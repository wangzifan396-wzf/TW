<script>
var BD='#1a1d27',DIM='#4a5568',AC='#7c5cff',INFO='#2dd4ff',WARN='#fbbf24',ERR='#ef4444',PUR='#a78bfa',ROSE='#f472b6';
var svg=document.getElementById('canvas');
var logEl=document.getElementById('log');
var badge=document.getElementById('badge');
var lmod=document.getElementById('lmod');
var curMod=0,curView=0;

function el(t,a,p){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function setLog(s){logEl.innerHTML=s;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

var MODS=[
 {id:'M1',name:'AI科学家全景',views:['全部','假设生成','实验设计','数据分析','论文撰写']},
 {id:'M2',name:'自动假设生成',views:['文献挖掘','知识图谱','类比推理','假设验证']},
 {id:'M3',name:'自动化实验',views:['干实验','湿实验','闭环优化','实验室自动化']},
 {id:'M4',name:'数据驱动发现',views:['模式识别','因果推断','异常检测','知识发现']},
 {id:'M5',name:'AI论文生成',views:['结构化写作','图表生成','同行评审','迭代改进']},
 {id:'M6',name:'科学基础模型',views:['领域适应','多模态融合','预训练策略','模型对比']},
 {id:'M7',name:'干湿闭环实验',views:['实验设计','自动执行','结果回流','方案优化']},
 {id:'M8',name:'应用领域',views:['材料科学','生物医学','化学合成','物理发现']}
];

/* ===== common defs & helpers ===== */
function addDefs(){
  var d=el('defs',{},svg);
  var mk=function(id,col){var m=el('marker',{id:id,markerWidth:9,markerHeight:9,refX:8,refY:4,orient:'auto'},d);el('path',{d:'M0,0 L8,4 L0,8 z',fill:col},m);};
  mk('ar',AC);mk('ai',INFO);mk('aw',WARN);mk('ap',PUR);mk('aros',ROSE);mk('ag','#64748b');
  var lg=function(id,c1,c2){var g=el('linearGradient',{id:id,x1:'0%',y1:'0%',x2:'0%',y2:'100%'},d);el('stop',{offset:'0%','stop-color':c1},g);el('stop',{offset:'100%','stop-color':c2},g);};
  lg('gac','#7c5cff','#5b3fd6');lg('ginf','#2dd4ff','#0e9ec9');lg('gwarn','#fbbf24','#d97706');lg('gpur','#a78bfa','#7c5cff');lg('grose','#f472b6','#db2777');
  var rg=el('radialGradient',{id:'gcore',cx:'50%',cy:'50%',r:'50%'},d);el('stop',{offset:'0%','stop-color':'#7c5cff','stop-opacity':'.55'},rg);el('stop',{offset:'100%','stop-color':'#7c5cff','stop-opacity':'0'},rg);
}
function box(x,y,w,h,label,fill,sc,fs){
  el('rect',{x:x,y:y,width:w,height:h,rx:7,fill:fill||BD,stroke:sc||AC,'stroke-width':1.4,'fill-opacity':fill?0.95:1},svg);
  if(label){var t=el('text',{x:x+w/2,y:y+h/2+(fs||12)*0.35,'text-anchor':'middle',fill:'#e8edf5','font-size':fs||12,'font-weight':500},svg);t.textContent=label;}
}
function boxL(x,y,w,h,label,col,fs){
  el('rect',{x:x,y:y,width:w,height:h,rx:7,fill:'#10131d',stroke:col||AC,'stroke-width':1.4},svg);
  if(label){var t=el('text',{x:x+w/2,y:y+h/2+(fs||12)*0.35,'text-anchor':'middle',fill:col||AC,'font-size':fs||12,'font-weight':600},svg);t.textContent=label;}
}
function arrow(x1,y1,x2,y2,col,w){el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col||AC,'stroke-width':w||1.7,'marker-end':'url(#'+(col===INFO?'ai':col===WARN?'aw':col===PUR?'ap':col===ROSE?'aros':'ar')+')'},svg);}
function dash(x1,y1,x2,y2,col){el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col||DIM,'stroke-width':1.3,'stroke-dasharray':'4 3'},svg);}
function line(x1,y1,x2,y2,col,w){el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col||DIM,'stroke-width':w||1.2},svg);}
function title(x,y,txt,col,sz){var t=el('text',{x:x,y:y,fill:col||INFO,'font-size':sz||16,'font-weight':'bold'},svg);t.textContent=txt;}
function lab(x,y,txt,col,sz,an,wt){var t=el('text',{x:x,y:y,fill:col||'#94a3b8','font-size':sz||11,'text-anchor':an||'start','font-weight':wt||400},svg);t.textContent=txt;}
function dot(cx,cy,r,col,op){el('circle',{cx:cx,cy:cy,r:r||4,fill:col||AC,'fill-opacity':op||1},svg);}
function ring(cx,cy,r,col){el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:col||AC,'stroke-width':1.4},svg);}
function chip(x,y,w,h,txt,col){el('rect',{x:x,y:y,width:w,height:h,rx:4,fill:'none',stroke:col||DIM,'stroke-width':1,'stroke-dasharray':'3 2'},svg);var t=el('text',{x:x+w/2,y:y+h/2+3.5,'text-anchor':'middle',fill:col||DIM,'font-size':10},svg);t.textContent=txt;}
function panel(x,y,w,h){el('rect',{x:x,y:y,width:w,height:h,rx:10,fill:'#0c0f18',stroke:'#1f2433','stroke-width':1},svg);}
function gridbg(){el('rect',{x:0,y:0,width:920,height:460,fill:'#0b0e16'},svg);for(var i=20;i<920;i+=40){el('line',{x1:i,y1:0,x2:i,y2:460,stroke:'#10141f','stroke-width':1},svg);}for(var j=20;j<460;j+=40){el('line',{x1:0,y1:j,x2:920,y2:j,stroke:'#10141f','stroke-width':1},svg);}}

/* ============ M1 AI科学家全景 ============ */
function m1Draw(){m1View(0);}
function m1View(mode){
  clear(svg);addDefs();gridbg();
  title(30,34,'AI 科学家全景 / Autonomous Scientist Panorama',INFO,15);
  if(mode===0){
    var cx=460,cy=250;
    el('circle',{cx:cx,cy:cy,r:120,fill:'url(#gcore)'},svg);
    ring(cx,cy,118,AC);ring(cx,cy,86,PUR);
    var t=el('text',{x:cx,y:cy-4,'text-anchor':'middle',fill:'#fff','font-size':16,'font-weight':'bold'},svg);t.textContent='AI 科学家核心';
    var t2=el('text',{x:cx,y:cy+16,'text-anchor':'middle',fill:PUR,'font-size':11},svg);t2.textContent='自主推理 · 决策 · 执行';
    var caps=[['假设生成',0],['实验设计',1],['数据分析',2],['论文撰写',3],['文献综述',4]];
    var pts=[];
    for(var i=0;i<5;i++){var a=-Math.PI/2+i*2*Math.PI/5;var px=cx+Math.cos(a)*185,py=cy+Math.sin(a)*125;pts.push([px,py]);
      var cols=[AC,INFO,WARN,ROSE,PUR];
      boxL(px-46,py-18,92,36,caps[i][0],cols[i],12);
      arrow(px,py,cx+Math.cos(a)*70,cy+Math.sin(a)*46,cols[i],1.6);
    }
    for(var k=0;k<5;k++){var n=(k+1)%5;dash(pts[k][0],pts[k][1],pts[n][0],pts[n][1],DIM);}
    lab(cx-300,cy+170,'闭环反馈：发现 → 假设 → 验证 → 发表 → 新发现',DIM,11);
    lab(cx-300,cy+188,'五个能力模块围绕核心引擎协同运转，形成自演化科研闭环',DIM,11);
    setLog('<span class="h">[M1·全景]</span> AI 科学家以一个统一推理核心串联五大能力。\n'+
      '<span class="k">核心引擎</span>：大模型 + 工具调用 + 记忆，承担规划、决策与反思。\n'+
      '<span class="k">五大能力</span>：文献综述 → 假设生成 → 实验设计 → 数据分析 → 论文撰写。\n'+
      '<span class="k">闭环特性</span>：每轮发现的产出成为下一轮假设的输入，实现自主演化。\n'+
      '<span class="w">关键挑战</span>：长程一致性、错误自纠、可复现性与科学严谨性平衡。');
  }else if(mode===1){
    title(30,58,'假设生成 / Hypothesis Generation',AC,13);
    var xs=[40,210,400,600,760];
    var ns=['文献语料','知识抽取','推理引擎','候选假设','排序输出'];
    var cs=[DIM,INFO,AC,PUR,ROSE];
    for(var i=0;i<5;i++){boxL(xs[i]-55,210,110,46,ns[i],cs[i],12);if(i<4)arrow(xs[i]+55,233,xs[i+1]-55,233,cs[i+1],1.8);}
    for(var j=0;j<3;j++){lab(xs[3]-55,286+j*16,'H'+(j+1)+' : 因素 X 与 Y 存在因果关联 (p='+[0.03,0.12,0.41][j]+')',[AC,INFO,DIM][j],11);}
    chip(395,160,110,28,'置信度评估',WARN);
    arrow(450,188,450,210,WARN,1.6);
    lab(30,120,'输入：海量论文 / 实验数据 / 已有知识库',DIM,11);
    lab(30,138,'输出：可验证、可排序的科学假设列表',DIM,11);
    setLog('<span class="h">[M1·假设生成]</span> 假设生成是 AI 科学家的起点。\n'+
      '<span class="k">流程</span>：从文献与数据中抽取实体关系 → 推理引擎组合新关联 → 生成候选假设 → 按新颖性与可验证性排序。\n'+
      '<span class="k">质量维度</span>：新颖性、可证伪性、与现有知识一致性、实验可行性。\n'+
      '<span class="w">难点</span>：避免 trivial 假设、控制幻觉、保证假设可被实验检验。');
  }else if(mode===2){
    title(30,58,'实验设计 / Experiment Design',INFO,13);
    panel(30,80,420,340);panel(470,80,420,340);
    lab(50,104,'实验空间',AC,12,'start',600);
    var factors=[['温度',60],['浓度',45],['时间',80],['pH值',35],['催化剂',55]];
    for(var i=0;i<5;i++){var y=120+i*34;lab(50,y+12,factors[i][0],'#cbd5e1',11);el('rect',{x:110,y:y,width:300,height:14,rx:3,fill:'#141826'},svg);el('rect',{x:110,y:y,width:factors[i][1]*3,height:14,rx:3,fill:INFO},svg);lab(415,y+12,factors[i][1]+'%',DIM,10);}
    lab(50,300,'响应变量 Y',WARN,11);lab(50,316,'约束: 成本 / 安全 / 时间',DIM,10);
    lab(490,104,'贝叶斯最优实验设计',AC,12);
    var gx=490,gy=130;
    for(var p=0;p<30;p++){dot(gx+15+Math.random()*360,gy+15+Math.random()*170,3,[AC,INFO,WARN][p%3],0.6);}
    el('path',{d:'M490,300 Q620,200 720,260 T850,180',fill:'none',stroke:ROSE,'stroke-width':2,'stroke-dasharray':'5 3'},svg);
    lab(490,330,' acquisition: UCB / EI / Thompson 采样',PUR,11);
    lab(490,350,'目标：最少实验次数逼近最优响应',DIM,10);
    setLog('<span class="k">[M1·实验设计]</span> AI 自动构造实验方案。\n'+
      '<span class="k">实验空间</span>：离散/连续因素的组合，需在巨大空间中高效搜索。\n'+
      '<span class="k">方法</span>：贝叶斯优化 + 主动学习，用代理模型预测并选择信息量最大的下一组实验。\n'+
      '<span class="k">采集函数</span>：UCB、EI、Thompson 采样权衡探索与利用。\n'+
      '<span class="w">目标</span>：以最少实验次数与成本逼近最优响应。');
  }else if(mode===3){
    title(30,58,'数据分析 / Data Analysis',WARN,13);
    var bx=60;
    var bars=[40,75,55,110,90,65,130,85];
    var bl=['T1','T2','T3','T4','T5','T6','T7','T8'];
    el('line',{x1:60,y1:330,x2:540,y2:330,stroke:DIM,'stroke-width':1},svg);
    for(var i=0;i<8;i++){var h=bars[i];el('rect',{x:bx+i*58,y:330-h,width:40,height:h,rx:3,fill:i%2?INFO:AC,'fill-opacity':0.8},svg);lab(bx+i*58+20,348,bl[i],DIM,10,'middle');lab(bx+i*58+20,326-h-6,h,DIM,9,'middle');}
    title(60,80,'响应分布',DIM,11);
    el('path',{d:'M60,250 C140,150 220,300 300,200 S460,140 540,180',fill:'none',stroke:ROSE,'stroke-width':2},svg);
    lab(560,250,'趋势拟合',ROSE,10);
    panel(580,90,310,330);
    lab(600,114,'统计推断流水线',AC,12);
    var stp=['数据清洗','异常剔除','分布检验','假设检验','效应量估计','结论输出'];
    for(var s=0;s<6;s++){var sy=134+s*42;boxL(610,sy,270,30,stp[s],s%2?INFO:PUR,11);if(s<5)arrow(745,sy+30,745,sy+42,DIM,1.3);}
    setLog('<span class="w">[M1·数据分析]</span> 实验产出数据后进入分析流水线。\n'+
      '<span class="k">步骤</span>：清洗 → 异常剔除 → 分布检验 → 假设检验 → 效应量 → 结论。\n'+
      '<span class="k">可视化</span>：柱状图展示分组响应，曲线拟合揭示趋势。\n'+
      '<span class="k">统计严谨</span>：多重比较校正、效应量与置信区间并报，避免 p 值滥用。\n'+
      '<span class="w">自动化要点</span>：分析方法选择需匹配实验类型与数据分布。');
  }else{
    title(30,58,'论文撰写 / Paper Writing',ROSE,13);
    var secs=[['Abstract','摘要：问题·方法·结论',AC],['Introduction','引言：背景与动机',INFO],['Related Work','相关工作：定位与差异',PUR],['Methods','方法：实验与模型',WARN],['Experiments','实验：结果与分析',ROSE],['Conclusion','结论：贡献与展望',INFO]];
    for(var i=0;i<6;i++){var y=80+i*56;boxL(40,y,260,46,secs[i][0],secs[i][2],12);lab(320,y+22,secs[i][1],DIM,11);}
    panel(560,80,330,330);

/* ===== framework: tabs, buttons, dispatch ===== */
var DRAWFNS=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
var VIEWFNS=[m1View,m2View,m3View,m4View,m5View,m6View,m7View,m8View];

function buildTabs(){
  var tb=document.getElementById('tabs');
  clear(tb);
  for(var i=0;i<MODS.length;i++){
    (function(idx){
      var b=document.createElement('button');
      b.className='tab'+(idx===curMod?' active':'');
      b.textContent=MODS[idx].id+' '+MODS[idx].name;
      b.onclick=function(){curMod=idx;curView=0;buildTabs();buildButtons();DRAWFNS[curMod]();updateMeta();};
      tb.appendChild(b);
    })(i);
  }
}
function buildButtons(){
  var ct=document.getElementById('controls');
  clear(ct);
  var ttl=document.createElement('div');ttl.className='ctitle';ttl.textContent='视图切换 / VIEWS';ct.appendChild(ttl);
  var views=MODS[curMod].views;
  for(var i=0;i<views.length;i++){
    (function(idx){
      var b=document.createElement('button');
      b.className='btn'+(idx===curView?' active':'');
      var sp=document.createElement('span');sp.className='dot';b.appendChild(sp);
      var lb=document.createElement('span');lb.textContent='0'+(idx+1)+' '+views[idx];b.appendChild(lb);
      b.onclick=function(){curView=idx;buildButtons();VIEWFNS[curMod](curView);updateMeta();};
      ct.appendChild(b);
    })(i);
  }
  var info=document.createElement('div');
  info.style.cssText='margin-top:6px;padding:8px 6px;font-size:10px;color:#475569;border-top:1px solid #1a1d27;line-height:1.5';
  info.textContent='共 '+views.length+' 个子视图，点击切换 SVG 可视化与日志说明。';
  ct.appendChild(info);
}
function updateMeta(){
  badge.textContent=MODS[curMod].id+' / VIEW 0'+(curView+1);
  lmod.textContent=MODS[curMod].id+' · '+MODS[curMod].views[curView];
}

buildTabs();
buildButtons();
DRAWFNS[curMod]();
updateMeta();
</script>
