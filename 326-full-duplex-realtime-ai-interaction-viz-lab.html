<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全双工实时AI交互可视化实验室 · Full-Duplex Realtime AI Interaction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0b0f;
    --bg-panel: #12141c;
    --bg-card: #181b25;
    --bg-deep: #08090e;
    --border: #232838;
    --border-strong: #2d3344;
    --teal: #00d4aa;
    --teal-dim: #008f72;
    --teal-glow: rgba(0, 212, 170, 0.15);
    --text: #e6e8ee;
    --text-dim: #8b909e;
    --text-faint: #5a5f6e;
    --amber: #ffb454;
    --rose: #ff6b81;
    --violet: #9d7aff;
    --blue: #4ea8ff;
    --cyan: #22d3ee;
    --pink: #f472b6;
    --font-sans: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --font-mono: "Consolas", "SF Mono", "JetBrains Mono", monospace;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--teal-dim); }

  /* Sticky Header */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 11, 15, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1360px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; white-space: nowrap;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 12px var(--teal);
    animation: brandPulse 2s ease-in-out infinite;
  }
  @keyframes brandPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 12px var(--teal); }
    50% { opacity: 0.6; box-shadow: 0 0 20px var(--teal); }
  }
  .brand .tag {
    font-size: 10px; font-weight: 600;
    color: var(--teal); background: var(--teal-glow);
    padding: 2px 7px; border-radius: 4px;
    letter-spacing: 0.5px;
  }
  nav.modules {
    display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto;
  }
  .mod-btn {
    background: transparent; border: 1px solid transparent;
    color: var(--text-dim); cursor: pointer;
    padding: 6px 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 500;
    font-family: inherit;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .mod-btn:hover { color: var(--text); background: var(--bg-card); }
  .mod-btn.active {
    color: var(--teal); background: var(--teal-glow);
    border-color: var(--teal-dim);
  }

  /* Main Layout */
  main {
    max-width: 1360px; margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .module { display: none; }
  .module.active { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  /* Module Header */
  .mod-head { margin-bottom: 22px; }
  .mod-head .crumb {
    font-size: 11px; color: var(--teal); font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .mod-head h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .mod-head p { color: var(--text-dim); font-size: 14px; max-width: 900px; }

  /* Grid */
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(12, 1fr);
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card h3 {
    font-size: 14px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h3::before {
    content: ""; width: 4px; height: 14px; border-radius: 2px;
    background: var(--teal);
  }
  .col-12 { grid-column: span 12; }
  .col-8 { grid-column: span 8; }
  .col-7 { grid-column: span 7; }
  .col-6 { grid-column: span 6; }
  .col-5 { grid-column: span 5; }
  .col-4 { grid-column: span 4; }
  .col-3 { grid-column: span 3; }
  @media (max-width: 980px) {
    .col-8, .col-7, .col-6, .col-5, .col-4, .col-3 { grid-column: span 12; }
  }

  /* Controls */
  .controls {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    margin-bottom: 14px;
  }
  .seg {
    display: inline-flex; background: var(--bg-card);
    border-radius: 8px; padding: 3px; gap: 2px;
    border: 1px solid var(--border);
  }
  .seg button {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); padding: 6px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 500; font-family: inherit;
    transition: all 0.15s ease;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    background: var(--teal); color: #0a0b0f; font-weight: 600;
  }

  /* SVG */
  svg.viz { width: 100%; display: block; border-radius: 8px; }

  /* Stats */
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; min-width: 110px;
  }
  .stat .k { font-size: 10.5px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.3px; }
  .stat .v { font-size: 18px; color: var(--teal); font-weight: 700; font-family: var(--font-mono); margin-top: 2px; }
  .stat .v.amber { color: var(--amber); }
  .stat .v.rose { color: var(--rose); }
  .stat .v.violet { color: var(--violet); }
  .stat .v.blue { color: var(--blue); }

  /* Legend */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

  /* Note */
  .note {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.7;
    background: var(--bg-card); border-left: 3px solid var(--teal-dim);
    padding: 10px 14px; border-radius: 0 6px 6px 0; margin-top: 12px;
  }
  .note b { color: var(--text); font-weight: 600; }
  .note code {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--teal); background: rgba(0,212,170,0.08);
    padding: 1px 5px; border-radius: 3px;
  }

  /* Badge */
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; letter-spacing: 0.4px;
    margin-left: 8px; vertical-align: middle;
  }
  .badge.core { background: rgba(0,212,170,0.15); color: var(--teal); }
  .badge.new { background: rgba(255,180,84,0.15); color: var(--amber); }
  .badge.hot { background: rgba(255,107,129,0.15); color: var(--rose); }

  /* Pills */
  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    font-size: 11.5px; padding: 5px 11px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
  }
  .pill:hover { color: var(--text); border-color: var(--teal-dim); }
  .pill.on { color: var(--teal); border-color: var(--teal); background: var(--teal-glow); }

  /* Table */
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cmp th, table.cmp td {
    text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
  }
  table.cmp th {
    font-size: 11px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.3px; text-transform: uppercase;
  }
  table.cmp td code {
    font-family: var(--font-mono); color: var(--teal);
  }
  table.cmp tr:hover td { background: var(--bg-card); }

  /* KV List */
  .kvlist { font-size: 12.5px; line-height: 1.9; }
  .kvlist .row { display: flex; gap: 8px; }
  .kvlist .row .k2 { color: var(--text-dim); min-width: 86px; }
  .kvlist .row .v2 { color: var(--text); }

  /* Footer */
  .foot {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-faint); text-align: center;
  }
  .mono { font-family: var(--font-mono); }

  /* SVG animation classes */
  .anim-flow { animation: dashFlow 1.5s linear infinite; }
  @keyframes dashFlow { to { stroke-dashoffset: -20; } }
  .anim-pulse { animation: svgPulse 2s ease-in-out infinite; }
  @keyframes svgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .anim-glow { animation: svgGlow 2s ease-in-out infinite; }
  @keyframes svgGlow {
    0%, 100% { filter: drop-shadow(0 0 2px currentColor); }
    50% { filter: drop-shadow(0 0 8px currentColor); }
  }
  .anim-blink { animation: svgBlink 1s ease-in-out infinite; }
  @keyframes svgBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  .anim-slide { animation: svgSlide 3s linear infinite; }
  @keyframes svgSlide { from { transform: translateX(0); } to { transform: translateX(20px); } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="dot"></span>
      <span>全双工实时AI交互可视化实验室</span>
      <span class="tag">VIZ LAB</span>
    </div>
    <nav class="modules" id="nav"></nav>
  </div>
</header>
<main>
  <section id="m1" class="module active"></section>
  <section id="m2" class="module"></section>
  <section id="m3" class="module"></section>
  <section id="m4" class="module"></section>
  <section id="m5" class="module"></section>
  <section id="m6" class="module"></section>
  <section id="m7" class="module"></section>
  <section id="m8" class="module"></section>
  <div class="foot">
    全双工实时AI交互可视化实验室 · Full-Duplex Realtime AI Interaction · 单文件零外部依赖 · 纯 HTML/CSS/JS+SVG
  </div>
</main>
<script>
"use strict";
/* ============ 工具函数 ============ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ============ 颜色常量 ============ */
var C = {
  teal: "#00d4aa", tealDim: "#008f72", blue: "#4ea8ff", amber: "#ffb454",
  rose: "#ff6b81", violet: "#9d7aff", cyan: "#22d3ee", pink: "#f472b6",
  text: "#e6e8ee", dim: "#8b909e", faint: "#5a5f6e",
  border: "#232838", borderS: "#2d3344", bgP: "#12141c", bgC: "#181b25", bgD: "#08090e"
};

/* ============ 通用绘图辅助 ============ */
var activeAnims = [];
function clearAnims() {
  for (var i = 0; i < activeAnims.length; i++) {
    if (activeAnims[i]) { clearInterval(activeAnims[i]); clearTimeout(activeAnims[i]); }
  }
  activeAnims = [];
}
function svgCanvas(w, h, vb) {
  var s = el("svg", { width: w, height: h, viewBox: vb || ("0 0 " + w + " " + h), class: "viz", preserveAspectRatio: "xMidYMid meet" });
  el("rect", { x: 0, y: 0, width: w, height: h, fill: C.bgD, rx: 8 }, s);
  return s;
}
function arrowDef(s, id, color) {
  var defs = s.querySelector("defs") || el("defs", {}, s);
  var mk = el("marker", { id: id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 Z", fill: color }, mk);
}
function gridLines(s, x, y, w, h, nx, ny, color) {
  var i;
  for (i = 1; i < nx; i++) {
    var gx = x + (w / nx) * i;
    el("line", { x1: gx, y1: y, x2: gx, y2: y + h, stroke: color || "#1a1e2a", "stroke-width": 1, "stroke-dasharray": "2 4" }, s);
  }
  for (i = 1; i < ny; i++) {
    var gy = y + (h / ny) * i;
    el("line", { x1: x, y1: gy, x2: x + w, y2: gy, stroke: color || "#1a1e2a", "stroke-width": 1, "stroke-dasharray": "2 4" }, s);
  }
}

/* ============================================================ */
/* M1 实时交互全景 */
/* ============================================================ */
var M1 = { view: "timeline" };
function m1Draw() {
  var sec = document.getElementById("m1");
  clearNode(sec);
  var head = document.createElement("div");
  head.className = "mod-head";
  head.innerHTML = '<div class="crumb">M1 · INTERACTION EVOLUTION</div>' +
    '<h1>实时交互全景<span class="badge core">核心范式</span></h1>' +
    '<p>从命令行到全双工实时对话，人机交互经历了四次范式跃迁。每一次跃迁都伴随着延迟容忍度的急剧压缩——从秒级到毫秒级，最终实现"听与说同时进行"的自然对话体验。全双工实时交互是AI交互的终极形态。</p>';
  sec.appendChild(head);

  var ctrl = document.createElement("div");
  ctrl.className = "controls";
  ctrl.innerHTML =
    '<div class="seg" id="m1seg">' +
    '<button class="on" data-v="timeline">演进时间线</button>' +
    '<button data-v="latency">延迟敏感度对比</button></div>';
  sec.appendChild(ctrl);

  var grid = document.createElement("div");
  grid.className = "grid";
  grid.innerHTML =
    '<div class="card col-12"><h3>交互模式演进可视化</h3><div id="m1viz"></div>' +
    '<div class="legend"><span><i style="background:#5a5f6e"></i>命令行 CLI</span>' +
    '<span><i style="background:#4ea8ff"></i>图形界面 GUI</span>' +
    '<span><i style="background:#ffb454"></i>语音交互 Voice</span>' +
    '<span><i style="background:#00d4aa"></i>全双工实时 Full-Duplex</span></div></div>' +
    '<div class="card col-8"><h3>核心洞察</h3><div id="m1info" class="note"></div></div>' +
    '<div class="card col-4"><h3>关键指标</h3><div id="m1stats" class="stat-row"></div></div>';
  sec.appendChild(grid);

  var seg = document.getElementById("m1seg");
  var btns = seg.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove("on");
      this.classList.add("on");
      m1View(this.dataset.v);
    });
  }
  m1View("timeline");
}
function m1View(v) {
  M1.view = v;
  clearAnims();
  if (v === "timeline") m1DrawTimeline();
  else m1DrawLatency();
  m1UpdateInfo(v);
}
function m1DrawTimeline() {
  var host = document.getElementById("m1viz");
  clearNode(host);
  var W = 1180, H = 460;
  var s = svgCanvas(W, H);
  host.appendChild(s);
  arrowDef(s, "m1aTeal", C.teal);
  arrowDef(s, "m1aBlue", C.blue);
  arrowDef(s, "m1aFaint", C.faint);

  tspanEl(W / 2, 32, "人机交互模式演进时间线", s, { fill: C.text, "font-size": 16, "font-weight": 700, "text-anchor": "middle" });
  el("line", { x1: 60, y1: 90, x2: W - 60, y2: 90, stroke: C.border, "stroke-width": 2 }, s);

  var eras = [
    { x: 180, name: "命令行 CLI", year: "1960s-1980s", color: C.faint, icon: ">_", desc: "文本输入/输出", latency: "1000ms+", lat: "高容忍" },
    { x: 460, name: "图形界面 GUI", year: "1980s-2010s", color: C.blue, icon: "[]", desc: "鼠标点击/键盘", latency: "200-500ms", lat: "中容忍" },
    { x: 740, name: "语音交互 Voice", year: "2010s-2024", color: C.amber, icon: "()", desc: "语音指令/唤醒词", latency: "100-300ms", lat: "低容忍" },
    { x: 1020, name: "全双工实时", year: "2024+", color: C.teal, icon: "<>", desc: "同时听说/自然对话", latency: "<50ms", lat: "极低容忍" }
  ];

  for (var i = 0; i < eras.length; i++) {
    var e = eras[i];
    el("circle", { cx: e.x, cy: 90, r: 8, fill: C.bgD, stroke: e.color, "stroke-width": 2.5 }, s);
    el("circle", { cx: e.x, cy: 90, r: 4, fill: e.color }, s);
    if (i < eras.length - 1) {
      el("line", { x1: e.x + 10, y1: 90, x2: eras[i + 1].x - 10, y2: 90, stroke: e.color, "stroke-width": 1.5, "stroke-dasharray": "4 3", class: "anim-flow" }, s);
    }
    el("rect", { x: e.x - 90, y: 115, width: 180, height: 140, rx: 10, fill: "#141926", stroke: e.color, "stroke-width": 1.5, opacity: 0.9 }, s);
    el("rect", { x: e.x - 90, y: 115, width: 180, height: 32, rx: 10, fill: e.color, opacity: 0.12 }, s);
    tspanEl(e.x, 136, e.name, s, { fill: e.color, "font-size": 13, "font-weight": 700, "text-anchor": "middle" });
    tspanEl(e.x, 162, e.year, s, { fill: C.dim, "font-size": 11, "text-anchor": "middle", "font-family": C.fontMono || "monospace" });
    el("rect", { x: e.x - 30, y: 175, width: 60, height: 30, rx: 5, fill: C.bgD, stroke: e.color, "stroke-width": 1 }, s);
    tspanEl(e.x, 195, e.icon, s, { fill: e.color, "font-size": 14, "text-anchor": "middle", "font-family": "monospace", "font-weight": 700 });
    tspanEl(e.x, 225, e.desc, s, { fill: C.dim, "font-size": 11, "text-anchor": "middle" });
    tspanEl(e.x, 245, "延迟: " + e.latency, s, { fill: e.color, "font-size": 10, "text-anchor": "middle", "font-family": "monospace" });

    el("rect", { x: e.x - 50, y: 275, width: 100, height: 28, rx: 14, fill: C.bgC, stroke: e.color, "stroke-width": 1, opacity: 0.7 }, s);
    tspanEl(e.x, 293, e.lat, s, { fill: e.color, "font-size": 10, "text-anchor": "middle", "font-weight": 600 });
  }

  el("rect", { x: 60, y: 325, width: W - 120, height: 115, rx: 8, fill: "#0f131c", stroke: C.border, "stroke-width": 1 }, s);
  tspanEl(80, 348, "延迟容忍度趋势：从秒级压缩到毫秒级", s, { fill: C.teal, "font-size": 12, "font-weight": 600 });
  var barY = 365;
  var barW = [280, 180, 110, 40];
  var barColors = [C.faint, C.blue, C.amber, C.teal];
  var barLabels = ["CLI 1000ms", "GUI 300ms", "Voice 150ms", "Full-Duplex 50ms"];
  for (var b = 0; b < 4; b++) {
    var bx = 80 + b * 270;
    el("rect", { x: bx, y: barY, width: 240, height: 16, rx: 3, fill: C.bgC, stroke: C.border, "stroke-width": 0.5 }, s);
    el("rect", { x: bx, y: barY, width: barW[b], height: 16, rx: 3, fill: barColors[b], opacity: 0.85 }, s);
    tspanEl(bx + 4, barY + 12, barLabels[b], s, { fill: "#fff", "font-size": 10, "font-weight": 600 });
    el("rect", { x: bx, y: barY + 20, width: 240, height: 16, rx: 3, fill: C.bgC, stroke: C.border, "stroke-width": 0.5 }, s);
    el("rect", { x: bx, y: barY + 20, width: barW[b] * 0.3, height: 16, rx: 3, fill: barColors[b], opacity: 0.5 }, s);
    tspanEl(bx + 4, barY + 32, "目标延迟", s, { fill: C.dim, "font-size": 9 });
  }
  tspanEl(W / 2, 430, "全双工实时交互将端到端延迟压缩到50ms以内，达到人类感知无延迟的对话体验", s, { fill: C.dim, "font-size": 11, "text-anchor": "middle" });
}
function m1DrawLatency() {
  var host = document.getElementById("m1viz");
  clearNode(host);
  var W = 1180, H = 460;
  var s = svgCanvas(W, H);
  host.appendChild(s);
  arrowDef(s, "m1bTeal", C.teal);

  tspanEl(W / 2, 32, "延迟敏感度对比分析", s, { fill: C.text, "font-size": 16, "font-weight": 700, "text-anchor": "middle" });

  var modes = [

    { name: "全双工实时", color: C.teal, current: 45, acceptable: 50, optimal: 30 }
  ];

  var chartX = 120, chartY = 70, chartW = 980, chartH = 280;
  el("line", { x1: chartX, y1: chartY, x2: chartX, y2: chartY + chartH, stroke: C.border, "stroke-width": 1.5 }, s);
  el("line", { x1: chartX, y1: chartY + chartH, x2: chartX + chartW, y2: chartY + chartH, stroke: C.border, "stroke-width": 1.5 }, s);

  var maxVal = 1400;
  var ticks = [0, 200, 400, 600, 800, 1000, 1200, 1400];
  for (var t = 0; t < ticks.length; t++) {
    var ty = chartY + chartH - (ticks[t] / maxVal) * chartH;
    el("line", { x1: chartX - 5, y1: ty, x2: chartX, y2: ty, stroke: C.faint, "stroke-width": 1 }, s);

  tspanEl(chartX + 20, 412, "深色柱 = 当前延迟   |   浅色区域 = 可接受范围   |   虚线 = 最优目标", s, { fill: C.dim, "font-size": 12 });

function m8DrawRadar() {
  var host = document.getElementById("m8viz");
  clearNode(host);
  var W = 1180, H = 470;
  var s = svgCanvas(W, H);
  host.appendChild(s);

  tspanEl(W / 2, 28, "场景能力雷达对比：多维度需求分析", s, { fill: C.text, "font-size": 16, "font-weight": 700, "text-anchor": "middle" });

  var dims = ["延迟", "打断", "多模态", "离线", "隐私", "准确率"];
  var radarData = [
    { name: "实时翻译", color: C.teal, vals: [5, 3, 2, 3, 3, 5], cx: 200, cy: 250 },
    { name: "智能客服", color: C.blue, vals: [5, 5, 3, 2, 3, 5], cx: 590, cy: 250 },
    { name: "车载交互", color: C.violet, vals: [5, 5, 5, 5, 3, 4], cx: 980, cy: 250 }
  ];
  var radarData2 = [
    { name: "在线教育", color: C.amber, vals: [4, 5, 5, 3, 2, 5], cx: 200, cy: 250 },
    { name: "智能家居", color: C.rose, vals: [3, 3, 5, 5, 3, 4], cx: 590, cy: 250 },
    { name: "医疗辅助", color: C.cyan, vals: [4, 3, 5, 3, 5, 5], cx: 980, cy: 250 }
  ];

  function drawRadar(cx, cy, data) {
    var R = 110;
    var n = dims.length;
    for (var lv = 1; lv <= 5; lv++) {
      var pts = "";
      for (var di = 0; di < n; di++) {
        var ang = -Math.PI / 2 + (Math.PI * 2 * di) / n;
        var rx = cx + Math.cos(ang) * R * (lv / 5);
        var ry = cy + Math.sin(ang) * R * (lv / 5);
        pts += rx + "," + ry + " ";
      }
      el("polygon", { points: pts.trim(), fill: "none", stroke: lv === 5 ? C.borderS : C.border, "stroke-width": 0.5, "stroke-dasharray": lv === 5 ? "0" : "2 3" }, s);
    }
    for (var di2 = 0; di2 < n; di2++) {
      var ang2 = -Math.PI / 2 + (Math.PI * 2 * di2) / n;
      var ex = cx + Math.cos(ang2) * R;
      var ey = cy + Math.sin(ang2) * R;
      el("line", { x1: cx, y1: cy, x2: ex, y2: ey, stroke: C.border, "stroke-width": 0.5 }, s);
      var lx = cx + Math.cos(ang2) * (R + 18);
      var ly = cy + Math.sin(ang2) * (R + 18) + 4;
      tspanEl(lx, ly, dims[di2], s, { fill: C.dim, "font-size": 10, "text-anchor": "middle" });
    }
    var dpts = "";
    for (var vi = 0; vi < n; vi++) {
      var ang3 = -Math.PI / 2 + (Math.PI * 2 * vi) / n;
      var vx = cx + Math.cos(ang3) * R * (data.vals[vi] / 5);
      var vy = cy + Math.sin(ang3) * R * (data.vals[vi] / 5);
      dpts += vx + "," + vy + " ";
    }
    el("polygon", { points: dpts.trim(), fill: data.color, opacity: 0.15, stroke: data.color, "stroke-width": 2 }, s);
    for (var vi2 = 0; vi2 < n; vi2++) {
      var ang4 = -Math.PI / 2 + (Math.PI * 2 * vi2) / n;
      var dvx = cx + Math.cos(ang4) * R * (data.vals[vi2] / 5);
      var dvy = cy + Math.sin(ang4) * R * (data.vals[vi2] / 5);
      el("circle", { cx: dvx, cy: dvy, r: 3.5, fill: data.color, stroke: "#08090e", "stroke-width": 1 }, s);
    }
    el("rect", { x: cx - 50, y: cy + R + 22, width: 100, height: 22, rx: 11, fill: data.color, opacity: 0.15, stroke: data.color, "stroke-width": 1 }, s);
    tspanEl(cx, cy + R + 37, data.name, s, { fill: data.color, "font-size": 12, "font-weight": 700, "text-anchor": "middle" });
  }

  for (var ri = 0; ri < radarData.length; ri++) {
    drawRadar(radarData[ri].cx, radarData[ri].cy, radarData[ri]);
  }

  el("line", { x1: 30, y1: 395, x2: W - 30, y2: 395, stroke: C.border, "stroke-width": 0.5, "stroke-dasharray": "4 4" }, s);
  tspanEl(W / 2, 415, "（切换查看另一组场景雷达对比）", s, { fill: C.faint, "font-size": 10, "text-anchor": "middle", "font-style": "italic" });

  for (var ri2 = 0; ri2 < radarData2.length; ri2++) {
    var d = radarData2[ri2];
    el("rect", { x: d.cx - 45, y: 432, width: 90, height: 18, rx: 9, fill: d.color, opacity: 0.1, stroke: d.color, "stroke-width": 0.5 }, s);
    tspanEl(d.cx, d.cx === 200 ? 445 : (d.cx === 590 ? 445 : 445), d.name, s, { fill: d.color, "font-size": 10, "text-anchor": "middle" });
  }
}

/* 模块注册与导航 */
/* ============================================================ */
var MODULES = [
  { id: "m1", name: "实时交互全景" },
  { id: "m2", name: "流式ASR/TTS" },
  { id: "m3", name: "全双工协议" },
  { id: "m4", name: "延迟优化" },
  { id: "m5", name: "打断处理" },
  { id: "m6", name: "多模态融合" },
  { id: "m7", name: "边缘部署" },
  { id: "m8", name: "应用场景矩阵" }
];
var initialized = {};
function switchModule(id) {
  var secs = document.querySelectorAll(".module");
  for (var i = 0; i < secs.length; i++) secs[i].classList.remove("active");
  document.getElementById(id).classList.add("active");
  var btns = document.querySelectorAll(".mod-btn");
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle("active", btns[j].dataset.mod === id);
  }
  if (!initialized[id]) {
    var num = id.substring(1);
    var fn = window["m" + num + "Draw"];
    if (fn) { fn(); initialized[id] = true; }
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}
(function buildNav() {
  var nav = document.getElementById("nav");
  for (var i = 0; i < MODULES.length; i++) {
    (function (m, idx) {
      var b = document.createElement("button");
      b.className = "mod-btn" + (idx === 0 ? " active" : "");
      b.dataset.mod = m.id;
      b.textContent = m.name;
      b.addEventListener("click", function () { switchModule(m.id); });
      nav.appendChild(b);
    })(MODULES[i], i);
  }
})();

/* ============ 初始化 ============ */
window.addEventListener("DOMContentLoaded", function () {
  m1Draw();
  initialized.m1 = true;
});
</script>
