<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扩散采样理论与收敛证明 - 可视化实验室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0b0f;
    --bg-panel: #12141c;
    --bg-card: #181b25;
    --border: #232838;
    --teal: #00d4aa;
    --teal-dim: #008f72;
    --teal-glow: rgba(0, 212, 170, 0.15);
    --text: #e6e8ee;
    --text-dim: #8b909e;
    --text-faint: #5a5f6e;
    --amber: #ffb454;
    --rose: #ff6b81;
    --violet: #9d7aff;
    --blue: #4ea8ff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 11, 15, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; white-space: nowrap;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 12px var(--teal);
  }
  .brand .tag {
    font-size: 10px; font-weight: 600;
    color: var(--teal); background: var(--teal-glow);
    padding: 2px 7px; border-radius: 4px;
    letter-spacing: 0.5px;
  }
  nav.modules {
    display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto;
  }
  .mod-btn {
    background: transparent; border: 1px solid transparent;
    color: var(--text-dim); cursor: pointer;
    padding: 6px 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 500;
    font-family: inherit;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .mod-btn:hover { color: var(--text); background: var(--bg-card); }
  .mod-btn.active {
    color: var(--teal); background: var(--teal-glow);
    border-color: var(--teal-dim);
  }
  main {
    max-width: 1280px; margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .module { display: none; }
  .module.active { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .mod-head { margin-bottom: 22px; }
  .mod-head .crumb {
    font-size: 11px; color: var(--teal); font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .mod-head h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .mod-head p { color: var(--text-dim); font-size: 14px; max-width: 820px; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(12, 1fr);
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card h3 {
    font-size: 14px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h3::before {
    content: ""; width: 4px; height: 14px; border-radius: 2px;
    background: var(--teal);
  }
  .col-12 { grid-column: span 12; }
  .col-8 { grid-column: span 8; }
  .col-6 { grid-column: span 6; }
  .col-4 { grid-column: span 4; }
  .col-3 { grid-column: span 3; }
  @media (max-width: 980px) {
    .col-8, .col-6, .col-4, .col-3 { grid-column: span 12; }
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    margin-bottom: 14px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl label {
    font-size: 11px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.3px;
  }
  .ctrl .val {
    font-size: 12px; color: var(--teal); font-weight: 700;
    font-family: "Consolas", "SF Mono", monospace;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 180px; height: 5px; border-radius: 3px;
    background: var(--bg-card); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--teal); cursor: pointer;
    box-shadow: 0 0 8px var(--teal-glow);
    border: 2px solid #0a0b0f;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--teal); cursor: pointer; border: 2px solid #0a0b0f;
  }
  .seg {
    display: inline-flex; background: var(--bg-card);
    border-radius: 8px; padding: 3px; gap: 2px;
    border: 1px solid var(--border);
  }
  .seg button {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; font-family: inherit;
    transition: all 0.15s ease;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    background: var(--teal); color: #0a0b0f; font-weight: 600;
  }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; min-width: 110px;
  }
  .stat .k { font-size: 10.5px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.3px; }
  .stat .v { font-size: 18px; color: var(--teal); font-weight: 700; font-family: "Consolas","SF Mono",monospace; margin-top: 2px; }
  .stat .v.amber { color: var(--amber); }
  .stat .v.rose { color: var(--rose); }
  .stat .v.violet { color: var(--violet); }
  svg.viz { width: 100%; display: block; border-radius: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i {
    width: 12px; height: 3px; border-radius: 2px; display: inline-block;
  }
  .note {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.7;
    background: var(--bg-card); border-left: 3px solid var(--teal-dim);
    padding: 10px 14px; border-radius: 0 6px 6px 0; margin-top: 12px;
  }
  .note b { color: var(--text); font-weight: 600; }
  .note code {
    font-family: "Consolas","SF Mono",monospace; font-size: 12px;
    color: var(--teal); background: rgba(0,212,170,0.08);
    padding: 1px 5px; border-radius: 3px;
  }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; letter-spacing: 0.4px;
    margin-left: 8px; vertical-align: middle;
  }
  .badge.icml { background: rgba(157,122,255,0.15); color: var(--violet); }
  .badge.new { background: rgba(0,212,170,0.15); color: var(--teal); }
  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    font-size: 11.5px; padding: 5px 11px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
  }
  .pill:hover { color: var(--text); border-color: var(--teal-dim); }
  .pill.on { color: var(--teal); border-color: var(--teal); background: var(--teal-glow); }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cmp th, table.cmp td {
    text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
  }
  table.cmp th {
    font-size: 11px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.3px; text-transform: uppercase;
  }
  table.cmp td code {
    font-family: "Consolas","SF Mono",monospace; color: var(--teal);
  }
  table.cmp tr:hover td { background: var(--bg-card); }
  .flow-step {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
  }
  .flow-step b { color: var(--teal); }
  .app-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; cursor: pointer;
    transition: all 0.2s ease; height: 100%;
  }
  .app-card:hover { border-color: var(--teal); transform: translateY(-2px); }
  .app-card .ic { font-size: 22px; margin-bottom: 8px; }
  .app-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .app-card p { font-size: 12px; color: var(--text-dim); }
  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .foot {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-faint); text-align: center;
  }
  .mono { font-family: "Consolas","SF Mono",monospace; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="dot"></span>
      <span>扩散采样理论与收敛证明</span>
      <span class="tag">VIZ LAB</span>
    </div>
    <nav class="modules" id="nav"></nav>
  </div>
</header>
<main>
  <!-- M1 -->
  <section id="m1" class="module active"></section>
  <!-- M2 -->
  <section id="m2" class="module"></section>
  <!-- M3 -->
  <section id="m3" class="module"></section>
  <!-- M4 -->
  <section id="m4" class="module"></section>
  <!-- M5 -->
  <section id="m5" class="module"></section>
  <!-- M6 -->
  <section id="m6" class="module"></section>
  <!-- M7 -->
  <section id="m7" class="module"></section>
  <!-- M8 -->
  <section id="m8" class="module"></section>
  <div class="foot">
    扩散采样理论与收敛证明 · 可视化实验室 · 基于 ICML 2026 Outstanding Paper "High-Accuracy Sampling for Diffusion Models and Log-Concave Distributions"
  </div>
</main>
<script>
"use strict";
/* ============ 工具函数 ============ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) {
    for (var k in attrs) {
      if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) {
  var t = document.createTextNode(str);
  node.appendChild(t);
  return node;
}
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent);
  txt(t, str);
  return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }

/* ============ 模块注册 ============ */
var MODULES = [
  { id: "m1", name: "采样理论全景" },
  { id: "m2", name: "polylog突破" },
  { id: "m3", name: "分数匹配" },
  { id: "m4", name: "收敛证明" },
  { id: "m5", name: "随机矩阵" },
  { id: "m6", name: "采样器对比" },
  { id: "m7", name: "高维挑战" },
  { id: "m8", name: "应用与未来" }
];
var initialized = {};
function switchModule(id) {
  var secs = document.querySelectorAll(".module");
  for (var i = 0; i < secs.length; i++) secs[i].classList.remove("active");
  document.getElementById(id).classList.add("active");
  var btns = document.querySelectorAll(".mod-btn");
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle("active", btns[j].dataset.mod === id);
  }
  if (!initialized[id]) {
    var fn = window["draw_" + id];
    if (fn) { fn(); initialized[id] = true; }
  }
}
(function buildNav() {
  var nav = document.getElementById("nav");
  for (var i = 0; i < MODULES.length; i++) {
    (function (m) {
      var b = document.createElement("button");
      b.className = "mod-btn" + (i === 0 ? " active" : "");
      b.dataset.mod = m.id;
      b.textContent = m.name;
      b.addEventListener("click", function () { switchModule(m.id); });
      nav.appendChild(b);
    })(MODULES[i]);
  }
})();

/* ============ 通用绘图辅助 ============ */
function svgCanvas(w, h, viewBox) {
  var s = el("svg", { width: w, height: h, viewBox: viewBox || ("0 0 " + w + " " + h), class: "viz" });
  el("rect", { x: 0, y: 0, width: w, height: h, fill: "#0e1018", rx: 8 }, s);
  return s;
}
function axis(s, x1, y1, x2, y2, color) {
  return el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: color || "#3a3f50", "stroke-width": 1.5 }, s);
}
function gridlines(s, x, y, w, h, nx, ny, color) {
  var i;
  for (i = 1; i < nx; i++) {
    var gx = x + (w / nx) * i;
    el("line", { x1: gx, y1: y, x2: gx, y2: y + h, stroke: color || "#1d212e", "stroke-width": 1, "stroke-dasharray": "2 4" }, s);
  }
  for (i = 1; i < ny; i++) {
    var gy = y + (h / ny) * i;
    el("line", { x1: x, y1: gy, x2: x + w, y2: gy, stroke: color || "#1d212e", "stroke-width": 1, "stroke-dasharray": "2 4" }, s);
  }
}

/* ============================================================ */
/* M1 采样理论全景 */
/* ============================================================ */
var M1 = { steps: 20, view: "process" };
function draw_m1() {
  var sec = document.getElementById("m1");
  var head = document.createElement("div");
  head.className = "mod-head";
  head.innerHTML = '<div class="crumb">M1 · PANORAMA</div>' +
    '<h1>扩散采样理论全景<span class="badge new">核心</span></h1>' +
    '<p>扩散模型通过前向过程逐步加噪将数据破坏为纯噪声，再通过反向过程逐步去噪生成样本。采样步数直接决定生成质量与推理成本——这是扩散模型推理的核心权衡。</p>';
  sec.appendChild(head);

  var ctrl = document.createElement("div");
  ctrl.className = "controls";
  ctrl.innerHTML =
    '<div class="ctrl"><label>采样步数 N</label><span class="val" id="m1stepV">20</span>' +
    '<input type="range" id="m1step" min="2" max="80" value="20"></div>' +
    '<div class="seg" id="m1seg">' +
    '<button class="on" data-v="process">前向/反向过程</button>' +
    '<button data-v="tradeoff">步数-质量权衡</button></div>';
  sec.appendChild(ctrl);

  var grid = document.createElement("div");
  grid.className = "grid";
  grid.innerHTML =
    '<div class="card col-8"><h3>扩散过程可视化</h3><div id="m1viz"></div>' +
    '<div class="legend"><span><i style="background:#4ea8ff"></i>前向加噪 q(x_t|x_0)</span>' +
    '<span><i style="background:#00d4aa"></i>反向去噪 p(x_{t-1}|x_t)</span></div></div>' +
    '<div class="card col-4"><h3>关键指标</h3><div id="m1stats" class="stat-row"></div>' +
    '<div class="note" id="m1note"></div></div>';
  sec.appendChild(grid);

  document.getElementById("m1step").addEventListener("input", function () {
    M1.steps = parseInt(this.value, 10);
    document.getElementById("m1stepV").textContent = M1.steps;
    m1View(M1.view);
  });
  var seg = document.getElementById("m1seg");
  var btns = seg.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove("on");
      this.classList.add("on");
      m1View(this.dataset.v);
    });
  }
  m1View("process");
}
function m1View(v) {
  M1.view = v;
  if (v === "process") m1DrawProcess();
  else m1DrawTradeoff();
}
function m1DrawProcess() {
  var host = document.getElementById("m1viz");
  clearNode(host);
  var W = 760, H = 420;
  var s = svgCanvas(W, H);
  host.appendChild(s);

  // 标题标注
  tspanEl(60, 38, "前向加噪过程  q(x_t | x_0) = N(x_t; sqrt(ᾱ_t)·x_0, (1-ᾱ_t)I)", s, { fill: "#4ea8ff", "font-size": 13, "font-family": "Consolas,monospace" });
  tspanEl(60, H - 18, "反向去噪过程  p(x_{t-1} | x_t) = N(x_{t-1}; μ_θ(x_t,t), σ_t²I)", s, { fill: "#00d4aa", "font-size": 13, "font-family": "Consolas,monospace" });

  var N = M1.steps;
  var trackY = 150;
  var trackY2 = 280;
  var x0 = 80, x1 = W - 60;
  // 前向轨道箭头
  el("line", { x1: x0, y1: trackY, x2: x1 - 10, y2: trackY, stroke: "#4ea8ff", "stroke-width": 2, "marker-end": "url(#m1arrF)" }, s);
  // 反向轨道箭头
  el("line", { x1: x1, y1: trackY2, x2: x0 + 10, y2: trackY2, stroke: "#00d4aa", "stroke-width": 2, "marker-end": "url(#m1arrB)" }, s);
  // 箭头标记
  var defs = el("defs", {}, s);
  var mkF = el("marker", { id: "m1arrF", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 Z", fill: "#4ea8ff" }, mkF);
  var mkB = el("marker", { id: "m1arrB", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 Z", fill: "#00d4aa" }, mkB);

  // 状态圆点（采样点）
  var pts = [];
  for (var i = 0; i <= 6; i++) {
    var px = x0 + (x1 - x0) * (i / 6);
    var noiseR = 6 + i * 5;
    el("circle", { cx: px, cy: trackY, r: noiseR, fill: "none", stroke: "#4ea8ff", "stroke-opacity": 0.25, "stroke-width": 1.5 }, s);
    var c = el("circle", { cx: px, cy: trackY, r: 5, fill: "#4ea8ff" }, s);
    pts.push(px);
    // t 标签
    tspanEl(px - 6, trackY + 28, "t=" + Math.round(i / 6 * N), s, { fill: "#8b909e", "font-size": 11 });
    // 连接线到反向
    el("line", { x1: px, y1: trackY + noiseR, x2: px, y2: trackY2 - noiseR, stroke: "#3a3f50", "stroke-width": 1, "stroke-dasharray": "3 3" }, s);
    // 反向点
    el("circle", { cx: px, cy: trackY2, r: noiseR, fill: "none", stroke: "#00d4aa", "stroke-opacity": 0.25, "stroke-width": 1.5 }, s);
    el("circle", { cx: px, cy: trackY2, r: 5, fill: "#00d4aa" }, s);
  }

  // 左右端点标签
  tspanEl(x0 - 18, trackY - 30, "x_0", s, { fill: "#e6e8ee", "font-size": 14, "font-weight": 700, "font-family": "Consolas,monospace" });
  tspanEl(x0 - 18, trackY - 14, "真实数据", s, { fill: "#8b909e", "font-size": 11 });
  tspanEl(x1 + 4, trackY - 30, "x_T", s, { fill: "#e6e8ee", "font-size": 14, "font-weight": 700, "font-family": "Consolas,monospace" });
  tspanEl(x1 + 4, trackY - 14, "纯噪声", s, { fill: "#8b909e", "font-size": 11 });

  // 噪声方差条
  tspanEl(40, trackY, "噪声↑", s, { fill: "#4ea8ff", "font-size": 10, "text-anchor": "end", "dominant-baseline": "middle" });
  tspanEl(40, trackY2, "信号↑", s, { fill: "#00d4aa", "font-size": 10, "text-anchor": "end", "dominant-baseline": "middle" });

  // 更新指标
  var stats = document.getElementById("m1stats");
  clearNode(stats);
  var s1 = document.createElement("div"); s1.className = "stat";
  s1.innerHTML = '<div class="k">采样步数 N</div><div class="v">' + N + '</div>';
  stats.appendChild(s1);
  var s2 = document.createElement("div"); s2.className = "stat";
  var q = Math.min(99.5, 50 + N * 0.9);
  s2.innerHTML = '<div class="k">生成质量(估)</div><div class="v amber">' + q.toFixed(1) + '%</div>';
  stats.appendChild(s2);
  var s3 = document.createElement("div"); s3.className = "stat";
  s3.innerHTML = '<div class="k">推理相对成本</div><div class="v rose">' + (N * 0.05).toFixed(2) + 'x</div>';
  stats.appendChild(s3);

  var note = document.getElementById("m1note");
  note.innerHTML = '<b>核心思想：</b>前向过程按方差表 <code>β_1...β_T</code> 逐步加噪，T 步后近似纯高斯噪声。反向过程学习每一步的去噪均值 <code>μ_θ</code>。步数 N 越多，每步去噪幅度越小，近似越精确，质量越高但推理越慢。';
}
function m1DrawTradeoff() {
  var host = document.getElementById("m1viz");
  clearNode(host);

function m2StepsOld(eps, d) { return Math.pow(1 / eps, 1.5) * Math.sqrt(d); }
function m2StepsNew(eps, d) { return d * Math.pow(Math.log(1 / eps), 2); }
function m2DrawLog() {
  var host = document.getElementById("m2viz");
  clearNode(host);
  var W = 760, H = 420, s = svgCanvas(W, H);

    var yn = (H - pad) - Math.min(1, ln / yMax) * ph;
    pOld += (i === 0 ? "" : " L ") + fx.toFixed(1) + " " + yo.toFixed(1);

  }

  el("path", { d: pNew, fill: "none", stroke: "#00d4aa", "stroke-width": 2.5 }, s);
  el("path", { d: pOld, fill: "none", stroke: "#ff6b81", "stroke-width": 2.5, "stroke-dasharray": "6 4" }, s);

  // 当前 eps 标记
  var curLx = Math.log10(1 / M2.eps);

  el("line", { x1: curFx, y1: curYo, x2: curFx, y2: curYn, stroke: "#ffb454", "stroke-width": 2 }, s);

function m2DrawRatio() {
  var host = document.getElementById("m2viz");
  clearNode(host);
  var W = 760, H = 420, s = svgCanvas(W, H);

  var xMin = 1, xMax = 12;

  for (var i = 0; i <= 60; i++) {
    var lx = xMin + (xMax - xMin) * (i / 60);

  for (var k = 1; k <= 12; k += 2) {
    var tx = pad + ((k - xMin) / (xMax - xMin)) * pw;

  }
  tspanEl(W / 2, H - 8, "目标精度 1/ε （对数轴）", s, { fill: "#8b909e", "font-size": 12, "text-anchor": "middle" });
  for (var yy = 0; yy <= 12; yy += 2) {
    var ty = (H - pad) - (yy / 12) * ph;
    tspanEl(pad - 8, ty + 4, "1e" + yy, s, { fill: "#5a5f6e", "font-size": 10, "text-anchor": "end" });

  tspanEl(20, H / 2, "加速比 新法→旧法 （对数轴）", s, { fill: "#8b909e", "font-size": 12, "text-anchor": "middle", transform: "rotate(-90 20 " + (H / 2) + ")" });

  m2UpdateStats(m2StepsOld(M2.eps, M2.dim), m2StepsNew(M2.eps, M2.dim), curR);

function m3View(v) { M3.view = v; if (v === "field") m3DrawField(); else if (v === "langevin") m3DrawLangevin(); else m3DrawMatching(); }
// 混合高斯密度 (两个 mode)
function m3Density(x, y) {
  var m1 = Math.exp(-((x - 2) * (x - 2) + (y - 1) * (y - 1)) * 0.6);
  var m2 = 0.7 * Math.exp(-((x + 1.5) * (x + 1.5) + (y + 1.5) * (y + 1.5)) * 0.8);
  return m1 + m2;
}
function m3Score(x, y) {
  // 解析分数: -∇(||x-mu||²) -> 指向 mode
  var g1x = -1.2 * (x - 2), g1y = -1.2 * (y - 1);
  var g2x = -1.6 * 0.7 * (x + 1.5), g2y = -1.6 * 0.7 * (y + 1.5);
  var d = m3Density(x, y) + 1e-6;
  var sx = (g1x * Math.exp(-((x - 2) * (x - 2) + (y - 1) * (y - 1)) * 0.6) + g2x * 0.7 * Math.exp(-((x + 1.5) * (x + 1.5) + (y + 1.5) * (y + 1.5)) * 0.8)) / d;
  var sy = (g1y * Math.exp(-((x - 2) * (x - 2) + (y - 1) * (y - 1)) * 0.6) + g2y * 0.7 * Math.exp(-((x + 1.5) * (x + 1.5) + (y + 1.5) * (y + 1.5)) * 0.8)) / d;
  return { sx: sx, sy: sy };
}
function m3DrawField() {
  var host = document.getElementById("m3viz");
  clearNode(host);
  var W = 760, H = 420, s = svgCanvas(W, H);
  host.appendChild(s);
  var cx = W / 2, cy = H / 2;
  var scale = 90; // 每单位像素
  // 密度等高线
  for (var lvl = 6; lvl >= 1; lvl--) {
    var rad = lvl * 32;
    el("ellipse", { cx: cx + 2 * scale, cy: cy - 1 * scale, rx: rad, ry: rad * 0.9, fill: "#9d7aff", "fill-opacity": 0.04 * (7 - lvl), stroke: "none" }, s);
    el("ellipse", { cx: cx - 1.5 * scale, cy: cy + 1.5 * scale, rx: rad * 0.8, ry: rad * 0.8, fill: "#9d7aff", "fill-opacity": 0.03 * (7 - lvl), stroke: "none" }, s);
  }
  // 分数场箭头
  for (var i = -3; i <= 3; i++) {
    for (var j = -2; j <= 2; j++) {
      var wx = i * 0.9, wy = j * 0.9;
      var sc = m3Score(wx, wy);
      var mag = Math.sqrt(sc.sx * sc.sx + sc.sy * sc.sy);
      if (mag < 0.05) continue;
      var px = cx + wx * scale, py = cy - wy * scale;
      var ex = px + sc.sx * 18, ey = py - sc.sy * 18;
      var op = Math.min(0.9, 0.3 + mag * 0.4);
      el("line", { x1: px, y1: py, x2: ex, y2: ey, stroke: "#00d4aa", "stroke-width": 1.4, "stroke-opacity": op, "marker-end": "url(#m3arr)" }, s);
      el("circle", { cx: px, cy: py, r: 1.5, fill: "#00d4aa", "fill-opacity": op }, s);
    }
  }

function m3DrawLangevin() {
  var host = document.getElementById("m3viz");
  clearNode(host);
  var W = 760, H = 420, s = svgCanvas(W, H);
  host.appendChild(s);
  var cx = W / 2, cy = H / 2, scale = 90;
  // 密度背景
  for (var lvl = 6; lvl >= 1; lvl--) {
    var rad = lvl * 32;
    el("ellipse", { cx: cx + 2 * scale, cy: cy - 1 * scale, rx: rad, ry: rad * 0.9, fill: "#9d7aff", "fill-opacity": 0.04 * (7 - lvl) }, s);
    el("ellipse", { cx: cx - 1.5 * scale, cy: cy + 1.5 * scale, rx: rad * 0.8, ry: rad * 0.8, fill: "#9d7aff", "fill-opacity": 0.03 * (7 - lvl) }, s);
  }
  // Langevin 轨迹
  var N = M3.iter;
  var path = "M ";
  var x = -3, y = 2.5;
  var pts = [];
  for (var i = 0; i < N; i++) {
    var px = cx + x * scale, py = cy - y * scale;
    pts.push({ x: px, y: py });
    path += (i === 0 ? "" : " L ") + px.toFixed(1) + " " + py.toFixed(1);
    var sc = m3Score(x, y);
    var step = 0.5;
    var z1 = (Math.sin(i * 12.9898) * 43758.5453) % 1; z1 = z1 - Math.floor(z1);
    var z2 = (Math.sin(i * 78.233) * 43758.5453) % 1; z2 = z2 - Math.floor(z2);
    x = x + (step / 2) * sc.sx + Math.sqrt(step) * (z1 - 0.5) * 2;
    y = y + (step / 2) * sc.sy + Math.sqrt(step) * (z2 - 0.5) * 2;
  }
  el("path", { d: path, fill: "none", stroke: "#ffb454", "stroke-width": 2, "stroke-opacity": 0.8 }, s);
  // 起点终点
  el("circle", { cx: pts[0].x, cy: pts[0].y, r: 6, fill: "#ff6b81", stroke: "#0e1018", "stroke-width": 2 }, s);
  tspanEl(pts[0].x + 8, pts[0].y - 8, "起点 x_0", s, { fill: "#ff6b81", "font-size": 11 });
  var last = pts[pts.length - 1];
  el("circle", { cx: last.x, cy: last.y, r: 6, fill: "#00d4aa", stroke: "#0e1018", "stroke-width": 2 }, s);
  tspanEl(last.x + 8, last.y - 8, "x_K", s, { fill: "#00d4aa", "font-size": 11, "font-weight": 700 });
  // 中间点
  for (var m = 1; m < pts.length - 1; m++) {
    el("circle", { cx: pts[m].x, cy: pts[m].y, r: 2.5, fill: "#ffb454", "fill-opacity": 0.6 }, s);
  }
  // 公式
  tspanEl(20, 30, "x_{k+1} = x_k + (ε/2)∇log p(x_k) + √ε·z,  z~N(0,I)", s, { fill: "#8b909e", "font-size": 12, "font-family": "Consolas,monospace" });

  var stats = document.getElementById("m3stats");
  clearNode(stats);
  var s1 = document.createElement("div"); s1.className = "stat";
  s1.innerHTML = '<div class="k">迭代步数 K</div><div class="v">' + N + '</div>';
  stats.appendChild(s1);
  var s2 = document.createElement("div"); s2.className = "stat";
  s2.innerHTML = '<div class="k">步长 ε</div><div class="v amber">0.50</div>';
  stats.appendChild(s2);
  var s3 = document.createElement("div"); s3.className = "stat";
  s3.innerHTML = '<div class="k">收敛性</div><div class="v">KL→0</div>';
  stats.appendChild(s3);
  var note = document.getElementById("m3note");
  note.innerHTML = '<b>Langevin 采样：</b>从噪声出发，每步沿分数方向移动并注入随机性，逐步收敛到目标分布 p(x)。扩散模型的反向过程本质上是一组嵌套的 Langevin 步。ICML 2026 证明其收敛仅需 <code>polylog(1/ε)</code> 步。';
}
function m3DrawMatching() {

  tspanEl(pad + 10, pad + 18, "L_DSM = E[ λ(t)·‖s_θ(x_t,t) + ε ‖² ]", s, { fill: "#4ea8ff", "font-size": 12, "font-family": "Consolas,monospace" });

  stats.appendChild(s1);
  var s2 = document.createElement("div"); s2.className = "stat";
  s2.innerHTML = '<div class="k">当前 loss</div><div class="v amber">' + li.toFixed(3) + '</div>';
  stats.appendChild(s2);
  var s3 = document.createElement("div"); s3.className = "stat";
  s3.innerHTML = '<div class="k">损失类型</div><div class="v">DSM</div>';
  stats.appendChild(s3);
  var note = document.getElementById("m3note");
  note.innerHTML = '<b>去噪分数匹配 (DSM)：</b>通过加噪后的 <code>x_t = √ᾱ_t·x_0 + √(1-ᾱ_t)·ε</code> 学习预测噪声 ε，等价于学习分数 <code>s_θ(x_t,t) ≈ -ε/√(1-ᾱ_t)</code>。无需计算难解的 ∇log p(x)。</p>';
}

function m4DrawStep() {
  var host = document.getElementById("m4viz");
  clearNode(host);

  var path = "M ";
  var bars = [];
  for (var i = 0; i <= 30; i++) {
    var fx = pad + (i / 30) * pw;
    var t = i / 30;
    // eta_t = c * (1-t)^2 + 小常数

}

function m5SeededRand(seed) {

    return seed / 233280;
  };

function m5DrawSpec() {
  var host = document.getElementById("m5viz");
  clearNode(host);
  var W = 760, H = 420, s = svgCanvas(W, H);
  host.appendChild(s);
  var pad = 50, pw = W - 2 * pad, ph = H - 2 * pad;
  axis(s, pad, H - pad, W - pad, H - pad);
  axis(s, pad, H - pad, pad, pad);
  gridlines(s, pad, pad, pw, ph, 8, 5);
  // 生成特征值 (伪随机，seeded by run)
  var rnd = m5SeededRand(M5.run * 137 + 1);
  var n = 60;
  var evals = [];
  for (var i = 0; i < n; i++) {
    var u = rnd();
    var v = rnd();
    // Box-Muller
    var z = Math.sqrt(-2 * Math.log(u + 1e-9)) * Math.cos(2 * Math.PI * v);
    // MP 分布采样: x = (1+sqrt(c))^2 + 偏移
    var c = 0.5;
    var lambda = 1 + c * z * 0.3 + (1 - c);
    evals.push(Math.max(0.1, lambda));
  }
  evals.sort(function (a, b) { return a - b; });
  // MP 理论包络
  var pathMP = "M ";
  var lamMin = Math.pow(1 - Math.sqrt(0.5), 2);
  var lamMax = Math.pow(1 + Math.sqrt(0.5), 2);
  for (var k = 0; k <= 100; k++) {
    var lam = lamMin + (lamMax - lamMin) * (k / 100);
    var dens = Math.sqrt(Math.max(0, (lamMax - lam) * (lam - lamMin))) / (2 * Math.PI * 0.5 * lam);
    var fx = pad + ((lam - 0.1) / 3.5) * pw;
    var fy = (H - pad) - Math.min(1, dens / 0.6) * ph;
    pathMP += (k === 0 ? "" : " L ") + fx.toFixed(1) + " " + fy.toFixed(1);
  }
  el("path", { d: pathMP, fill: "rgba(157,122,255,0.1)", stroke: "#9d7aff", "stroke-width": 2, "stroke-dasharray": "5 3" }, s);
  // 特征值散点
  for (var e = 0; e < evals.length; e++) {
    var ex = pad + ((evals[e] - 0.1) / 3.5) * pw;
    el("circle", { cx: ex, cy: H - pad - 8 - (e % 3) * 6, r: 4, fill: "#00d4aa", "fill-opacity": 0.7 }, s);
  }
  // 离群特征值
  var outX = pad + ((3.0 - 0.1) / 3.5) * pw;

  tspanEl(outX + 8, H - pad - 14, "离群谱峰\n(信号方向)", s, { fill: "#ff6b81", "font-size": 11 });
  tspanEl(W / 2, H - 10, "特征值 λ", s, { fill: "#8b909e", "font-size": 12, "text-anchor": "middle" });

  clearNode(stats);
  var s1 = document.createElement("div"); s1.className = "stat";
  s1.innerHTML = '<div class="k">运行编号</div><div class="v">#' + M5.run + '</div>';
  stats.appendChild(s1);
  var s2 = document.createElement("div"); s2.className = "stat";
  s2.innerHTML = '<div class="k">谱半径</div><div class="v violet">3.0</div>';
  stats.appendChild(s2);
  var s3 = document.createElement("div"); s3.className = "stat";
  s3.innerHTML = '<div class="k">离群特征值</div><div class="v rose">1</div>';
  stats.appendChild(s3);
  var note = document.getElementById("m5note");
  note.innerHTML = '<b>谱结构：</b>不同训练运行的权重矩阵谱高度相似——主体服从 <code>Marchenko-Pastur 律</code>（紫色包络），仅少数离群特征值承载真实信号（红点）。这种谱一致性解释了为何不同种子生成的图像统计特性稳定。';
