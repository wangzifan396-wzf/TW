<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpenMontage · 智能体视频生产系统可视化实验室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overflow-x:hidden;min-height:100vh;
}
.app{max-width:1300px;margin:0 auto;padding:16px;}
.app-header{margin-bottom:14px;}
.ah-badge{
  display:inline-block;padding:3px 10px;
  background:var(--bg4);border:1px solid var(--teal);
  color:var(--teal);border-radius:4px;
  font-size:11px;font-weight:bold;letter-spacing:1px;margin-bottom:8px;
}
.ah-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;}
.ah-tags{display:flex;gap:6px;flex-wrap:wrap;}
.ah-tags span{
  font-size:11px;color:var(--text3);
  background:var(--bg3);padding:2px 8px;
  border-radius:3px;border:1px solid var(--border);
}
.module-nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.nav-btn{
  padding:7px 12px;background:var(--bg3);
  border:1px solid var(--border2);color:var(--text2);
  border-radius:6px;cursor:pointer;font-size:12px;
  white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.nav-btn:hover{border-color:var(--teal);color:var(--text);}
.nav-btn.active{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:bold;}
.lab-hero{
  background:linear-gradient(135deg,var(--bg2),var(--bg3));
  border:1px solid var(--border2);border-radius:8px;
  padding:14px 16px;margin-bottom:12px;
}
.hero-title{font-size:17px;font-weight:bold;color:var(--teal);margin-bottom:4px;}
.hero-desc{font-size:13px;color:var(--text2);margin-bottom:8px;}
.hero-meta{display:flex;gap:16px;flex-wrap:wrap;}
.hero-meta-item{font-size:12px;color:var(--text3);}
.hero-meta-item b{color:var(--cyan);margin-right:3px;}
.module-panel{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:8px;padding:12px;
}
.mp-tabs{display:flex;gap:6px;margin-bottom:10px;}
.mp-tabs .tab{
  padding:5px 14px;background:var(--bg3);
  border:1px solid var(--border2);color:var(--text2);
  border-radius:5px;cursor:pointer;font-size:12px;transition:all .2s;
}
.mp-tabs .tab:hover{border-color:var(--cyan);color:var(--text);}
.mp-tabs .tab.active{background:var(--cyan);color:var(--bg);border-color:var(--cyan);font-weight:bold;}
.mp-body{display:flex;gap:12px;}
.svg-wrap{flex:1;min-width:0;}
.svg-wrap svg{
  width:100%;height:auto;display:block;
  background:var(--bg);border-radius:8px;border:1px solid var(--border);
}
.mp-side{width:230px;flex-shrink:0;}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
.pill{font-size:10px;padding:2px 8px;border:1px solid var(--border2);border-radius:10px;background:var(--bg3);}
.legend{margin-bottom:12px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);margin-bottom:4px;}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.info{font-size:11px;}
.info-item{color:var(--text2);margin-bottom:5px;line-height:1.5;}
.info-k{color:var(--text3);}
.info-v{color:var(--text);}
.info-title{font-size:11px;color:var(--cyan);font-weight:bold;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
/* animations */
.apulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.aglow{animation:glow 2s ease-in-out infinite;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
.adash{stroke-dasharray:6 4;animation:dash 1s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-10}}
.ablink{animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.aspin{animation:spin 12s linear infinite;transform-origin:center;transform-box:fill-box;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:960px){
  .mp-body{flex-direction:column;}
  .mp-side{width:100%;}
  .nav-btn{font-size:11px;padding:5px 8px;}
  .ah-title{font-size:18px;}
  .app{padding:10px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="ah-badge">VIZ LAB #419</span>

    <div class="mp-body">
      <div class="svg-wrap">
        <svg id="svg" viewBox="0 0 900 480" width="100%" preserveAspectRatio="xMidYMid meet" style="background:var(--bg);border-radius:8px;border:1px solid var(--border)">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="blur"/>

            <marker id="ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
            <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
            <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
            <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
            <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
            <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
            <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
          </defs>
          <g id="gMain"></g>
        </svg>
      </div>
      <div class="mp-side">
        <div class="pills" id="pills"></div>

    </div>
  </div>
</div>
<script>
var SVGNS='http://www.w3.org/2000/svg';
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs)for(var k in attrs)el.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(el);
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}

function box(g,x,y,w,h,opts){
  opts=opts||{};
  var r=E(g,'rect',{x:x,y:y,width:w,height:h,rx:opts.rx||6,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1});
  if(opts.dash)r.setAttribute('stroke-dasharray',opts.dash);
  if(opts.op!=null)r.setAttribute('opacity',opts.op);
  return r;
}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var t=E(g,'text',{x:x,y:y,fill:opts.fill||C.text,'font-size':opts.fs||12,'font-family':opts.mono?C.mono:'inherit','text-anchor':opts.ta||'start','font-weight':opts.fw||'normal'});
  if(opts.op!=null)t.setAttribute('opacity',opts.op);
  if(opts.cls)t.setAttribute('class',opts.cls);
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var l=E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1});
  if(opts.dash)l.setAttribute('stroke-dasharray',opts.dash);
  if(opts.op!=null)l.setAttribute('opacity',opts.op);
  if(opts.cls)l.setAttribute('class',opts.cls);
  return l;
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var m=opts.marker||'ah';
  var l=E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.teal,'stroke-width':opts.sw||2,'marker-end':'url(#'+m+')'});
  if(opts.dash)l.setAttribute('stroke-dasharray',opts.dash);
  if(opts.op!=null)l.setAttribute('opacity',opts.op);
  if(opts.cls)l.setAttribute('class',opts.cls);
  return l;
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  var c=E(g,'circle',{cx:cx,cy:cy,r:r,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1});
  if(opts.dash)c.setAttribute('stroke-dasharray',opts.dash);
  if(opts.op!=null)c.setAttribute('opacity',opts.op);
  if(opts.cls)c.setAttribute('class',opts.cls);
  return c;
}
function poly(g,pts,opts){
  opts=opts||{};
  var p=E(g,'polygon',{points:pts,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1});
  if(opts.op!=null)p.setAttribute('opacity',opts.op);
  if(opts.cls)p.setAttribute('class',opts.cls);
  return p;
}
function radar(g,cx,cy,r,labels,data,opts){
  opts=opts||{};
  var n=labels.length;
  var color=opts.color||C.teal;
  var color2=opts.color2;
  var data2=opts.data2;
  for(var i=1;i<=4;i++){
    var pts=[];
    for(var j=0;j<n;j++){
      var ang=-Math.PI/2+j*2*Math.PI/n;
      pts.push((cx+Math.cos(ang)*r*i/4).toFixed(1)+','+(cy+Math.sin(ang)*r*i/4).toFixed(1));
    }
    poly(g,pts.join(' '),{stroke:C.border2,sw:1,op:0.4});
  }
  for(var j=0;j<n;j++){
    var ang=-Math.PI/2+j*2*Math.PI/n;
    line(g,cx,cy,cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,{stroke:C.border2,sw:1,op:0.4});
  }
  var dpts=[];
  for(var j=0;j<n;j++){
    var ang=-Math.PI/2+j*2*Math.PI/n;
    var v=(data[j]||0);
    dpts.push((cx+Math.cos(ang)*r*v/100).toFixed(1)+','+(cy+Math.sin(ang)*r*v/100).toFixed(1));
  }
  poly(g,dpts.join(' '),{fill:color,stroke:color,sw:2,op:0.2});
  for(var j=0;j<n;j++){
    var ang=-Math.PI/2+j*2*Math.PI/n;
    var v=(data[j]||0);
    circ(g,cx+Math.cos(ang)*r*v/100,cy+Math.sin(ang)*r*v/100,3,{fill:color,stroke:'none'});
  }
  if(data2){
    var d2pts=[];
    for(var j=0;j<n;j++){
      var ang=-Math.PI/2+j*2*Math.PI/n;
      var v=(data2[j]||0);
      d2pts.push((cx+Math.cos(ang)*r*v/100).toFixed(1)+','+(cy+Math.sin(ang)*r*v/100).toFixed(1));
    }
    poly(g,d2pts.join(' '),{fill:color2,stroke:color2,sw:2,op:0.15});
    for(var j=0;j<n;j++){
      var ang=-Math.PI/2+j*2*Math.PI/n;
      var v=(data2[j]||0);
      circ(g,cx+Math.cos(ang)*r*v/100,cy+Math.sin(ang)*r*v/100,3,{fill:color2,stroke:'none'});
    }
  }
  for(var j=0;j<n;j++){
    var ang=-Math.PI/2+j*2*Math.PI/n;
    var lx=cx+Math.cos(ang)*(r+22);
    var ly=cy+Math.sin(ang)*(r+22)+4;
    txt(g,lx,ly,labels[j],{fs:10,fill:C.text2,ta:'middle'});
  }
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=30){
    line(g,x,0,x,h,{stroke:C.border,sw:1,op:0.3});
  }
  for(var y=0;y<=h;y+=30){
    line(g,0,y,w,y,{stroke:C.border,sw:1,op:0.3});
  }
}

function setPills(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var a=arr[i];
    var s=document.createElement('span');
    s.className='pill';
    s.textContent=typeof a==='string'?a:(a.t||'');
    if(typeof a==='object'&&a.c){s.style.borderColor=a.c;s.style.color=a.c;}
    el.appendChild(s);
  }
}
function setLegend(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  var ti=document.createElement('div');ti.className='info-title';ti.textContent='图例';el.appendChild(ti);
  for(var i=0;i<arr.length;i++){
    var a=arr[i];
    var d=document.createElement('div');d.className='leg-item';
    var dot=document.createElement('span');dot.className='leg-dot';
    dot.style.background=typeof a==='object'?(a.c||C.text3):C.text3;
    d.appendChild(dot);
    var t=document.createElement('span');t.textContent=typeof a==='string'?a:(a.t||'');
    d.appendChild(t);
    el.appendChild(d);
  }
}
function setInfo(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  var ti=document.createElement('div');ti.className='info-title';ti.textContent='详情';el.appendChild(ti);
  for(var i=0;i<arr.length;i++){
    var a=arr[i];
    var d=document.createElement('div');d.className='info-item';
    if(typeof a==='string'){
      d.textContent=a;
    }else{
      var k=document.createElement('span');k.className='info-k';k.textContent=a.k+': ';
      var v=document.createElement('span');v.className='info-v';v.textContent=a.v;
      d.appendChild(k);d.appendChild(v);
    }
    el.appendChild(d);
  }
}

function nodeBox(g,x,y,w,h,title,sub,opts){
  opts=opts||{};
  var c=opts.color||C.teal;
  box(g,x,y,w,h,{rx:8,fill:opts.fill||C.bg3,stroke:c,sw:opts.sw||1.5});
  E(g,'rect',{x:x,y:y,width:w,height:3,rx:1.5,fill:c});
  txt(g,x+w/2,y+h/2+(sub?-3:0),title,{fs:opts.fs||12,fill:C.text,ta:'middle',fw:'bold'});
  if(sub)txt(g,x+w/2,y+h/2+13,sub,{fs:9,fill:C.text2,ta:'middle'});
}
function chip(g,x,y,label,opts){
  opts=opts||{};
  var c=opts.color||C.cyan;
  var w=label.length*7.5+16;
  E(g,'rect',{x:x,y:y,width:w,height:18,rx:9,fill:opts.fill||'none',stroke:c,'stroke-width':1,opacity:0.8});
  txt(g,x+w/2,y+12,label,{fs:9,fill:c,ta:'middle'});
  return w;
}
function pbar(g,x,y,w,h,val,opts){
  opts=opts||{};
  var c=opts.color||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:h/2,fill:C.bg4,stroke:C.border,sw:0.5});
  var fw=Math.max(h,w*Math.max(0,Math.min(100,val))/100);
  E(g,'rect',{x:x,y:y,width:fw,height:h,rx:h/2,fill:c,opacity:0.85});
  if(opts.label)txt(g,x+w+6,y+h/2+4,opts.label,{fs:9,fill:C.text2});
}
function rbox(g,x,y,w,h,title,opts){
  opts=opts||{};
  var c=opts.color||C.border2;
  box(g,x,y,w,h,{rx:6,fill:opts.fill||C.bg2,stroke:c,sw:1});
  if(title){
    E(g,'rect',{x:x,y:y,width:w,height:22,rx:6,fill:c,opacity:0.12});
    txt(g,x+10,y+15,title,{fs:10,fill:c,ta:'start',fw:'bold'});
  }
}
function drawChip(g,x,y,label,opts){
  return chip(g,x,y,label,opts);
}

  {n:'M1',t:'智能体视频生产革命',d:'从Brief到MP4的范式跃迁 — Agent编排取代人工剪辑',v:['概念全景','范式对比','核心能力'],meta:[{k:'出品方',v:'calesthio'},{k:'Star',v:'25K+'},{k:'发布',v:'2026.03'}]},
  {n:'M2',t:'12条Pipeline全景',d:'覆盖视频生产全链路的12条智能体流水线',v:['Pipeline网格','数据流转','编排复用'],meta:[{k:'Pipeline',v:'12条'},{k:'工具',v:'52个'},{k:'技能',v:'500+'}]},

  {n:'M5',t:'从Brief到MP4全流程',d:'9阶段端到端自动生产流水线',v:['流程全景','时间成本','质量关卡'],meta:[{k:'阶段',v:'9个'},{k:'端到端',v:'<30min'},{k:'自动率',v:'92%'}]},

];
var mCur=0;
var mViews=[0,0,0,0,0,0,0,0];
var mLayers={};

/* ===== M1: 智能体视频生产革命 ===== */
function m1Draw(g){
  gridBg(g,900,480);
  var v=mViews[0];
  if(v===0){
    txt(g,450,28,'OpenMontage 概念全景: Brief → Agent编排 → MP4',{fs:15,fill:C.teal,ta:'middle',fw:'bold'});
    txt(g,450,46,'一段Brief文本输入，智能体编排器自动调度6大Agent协同完成视频生产',{fs:10,fill:C.text2,ta:'middle'});
    /* Brief input */
    box(g,30,160,100,140,{rx:8,fill:C.bg3,stroke:C.amber,sw:1.5});
    E(g,'rect',{x:30,y:160,width:100,height:3,rx:1.5,fill:C.amber});

/* ===== Framework Functions ===== */
function setView(i){
  mViews[mCur]=i;
  buildTabs();
  drawModule();
}

function buildTabs(){
  var el=$('mpTabs');
  if(!el)return;
  clearNode(el);
  var m=MODULES[mCur];
  for(var i=0;i<m.v.length;i++){
    var b=document.createElement('button');
    b.className='tab'+(i===mViews[mCur]?' active':'');
    b.textContent=m.v[i];
    b.onclick=(function(idx){
      return function(){setView(idx);};
    })(i);
    el.appendChild(b);
  }
}

function buildNav(){
  var el=$('moduleNav');
  if(!el)return;
  clearNode(el);
  for(var i=0;i<MODULES.length;i++){
    var b=document.createElement('button');
    b.className='nav-btn'+(i===mCur?' active':'');
    var s1=document.createElement('b');
    s1.textContent=MODULES[i].n+' ';
    b.appendChild(s1);
    b.appendChild(document.createTextNode(MODULES[i].t));
    b.onclick=(function(idx){
      return function(){
        mCur=idx;
        buildNav();
        updateHero();
        buildTabs();
        drawModule();
      };
    })(i);
    el.appendChild(b);
  }
}

function updateHero(){
  var el=$('labHero');
  if(!el)return;
  clearNode(el);
  var m=MODULES[mCur];
  var t=document.createElement('div');
  t.className='hero-title';
  t.textContent=m.n+' · '+m.t;
  el.appendChild(t);
  var d=document.createElement('div');
  d.className='hero-desc';
  d.textContent=m.d;
  el.appendChild(d);
  var meta=document.createElement('div');
  meta.className='hero-meta';
  for(var i=0;i<m.meta.length;i++){
    var mi=document.createElement('span');
    mi.className='hero-meta-item';
    var b=document.createElement('b');
    b.textContent=m.meta[i].k;
    mi.appendChild(b);
    mi.appendChild(document.createTextNode(' '+m.meta[i].v));
    meta.appendChild(mi);
  }
  el.appendChild(meta);
}

function drawModule(){
  var g=$('gMain');
  if(!g)return;
  clearNode(g);
  var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
  if(fns[mCur])fns[mCur](g);
}

function init(){
  buildNav();
  updateHero();
  buildTabs();
  drawModule();
}

window.addEventListener('DOMContentLoaded',init);
</script>
