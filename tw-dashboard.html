<html lang="zh-CN">
<head>

<title>TW Dashboard · 学习驾驶舱</title>
<meta name="description" content="TW 生态统一学习进度仪表盘，跨工具进度追踪与智能推荐">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='none' stroke='%2306b6d4' stroke-width='2'/%3E%3Crect x='7' y='7' width='4' height='4' rx='1' fill='%2306b6d4'/%3E%3Crect x='13' y='7' width='4' height='8' rx='1' fill='%2306b6d4' opacity='.6'/%3E%3Crect x='19' y='7' width='4' height='6' rx='1' fill='%2306b6d4' opacity='.4'/%3E%3Crect x='7' y='13' width='4' height='6' rx='1' fill='%2306b6d4' opacity='.5'/%3E%3Crect x='13' y='17' width='4' height='4' rx='1' fill='%2306b6d4' opacity='.7'/%3E%3C/svg%3E">
<style>
:root{--bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;--text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#06b6d4;--accent-soft:rgba(6,182,212,.12);--violet:#7c5cff;--good:#34d399;--hard:#fbbf24;--bad:#f87171;--pink:#ec4899;--orange:#f97316;--radius:10px;--mono:'SF Mono',Monaco,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.92);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
header .logo{font-size:18px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}header .logo span{color:var(--accent)}
header .sep{width:1px;height:20px;background:var(--border2)}
header nav a{color:var(--text3);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;white-space:nowrap}
header nav a:hover{color:var(--text);background:var(--bg3)}
header .spacer{flex:1}header .updated{font-size:11px;color:var(--text3);font-family:var(--mono)}

.hero{padding:48px 24px 24px;text-align:center;max-width:1100px;margin:0 auto}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:16px;color:var(--text2);max-width:600px;margin:0 auto}
.hero .sub b{color:var(--accent)}

.wrap{max-width:1100px;margin:0 auto;padding:0 24px 48px}

/* Overall progress ring */
.overall-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:24px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.ring-big{width:120px;height:120px;position:relative;flex-shrink:0}
.ring-big svg{transform:rotate(-90deg)}
.ring-big circle{fill:none;stroke-width:6}
.ring-big .track{stroke:var(--bg3)}
.ring-big .fill{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring-big .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-big .pct .num{font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.ring-big .pct .lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.overall-info{flex:1;min-width:240px}
.overall-info h2{font-size:20px;font-weight:700;margin-bottom:8px}
.overall-info p{font-size:13px;color:var(--text2);margin-bottom:16px}
.overall-stats{display:flex;gap:24px;flex-wrap:wrap}
.overall-stats .os{display:flex;flex-direction:column}
.overall-stats .os .v{font-size:24px;font-weight:800;color:var(--accent)}
.overall-stats .os .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* Tool cards grid */
.section-title{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:32px 0 16px;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:32px}
.tool-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.tool-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tool-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc)}
.tool-card .tc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tool-card .tc-icon{font-size:24px}
.tool-card .tc-name{font-size:16px;font-weight:700}
.tool-card .tc-link{font-size:11px;color:var(--text3);margin-left:auto}
.tool-card .tc-desc{font-size:12px;color:var(--text3);margin-bottom:14px}
.tool-card .tc-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:8px}
.tool-card .tc-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.tool-card .tc-stats{display:flex;justify-content:space-between;font-size:12px}
.tool-card .tc-stats .s{color:var(--text2)}
.tool-card .tc-stats .s b{color:var(--text);font-weight:700}
.tool-card .tc-stats .pct{font-weight:700;font-family:var(--mono)}

/* Heatmap */
.heatmap-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.heatmap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.heatmap-head h3{font-size:14px;font-weight:600}
.heatmap-head .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.heatmap-head .legend .sq{width:12px;height:12px;border-radius:3px}
.heatmap-wrap{overflow-x:auto;padding-bottom:8px}
.heatmap{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;min-width:700px}
.heatmap .cell{width:12px;height:12px;border-radius:2px;background:var(--bg3);transition:transform .1s}
.heatmap .cell:hover{transform:scale(1.4);z-index:2;position:relative}
.heatmap .cell.l1{background:rgba(6,182,212,.25)}
.heatmap .cell.l2{background:rgba(6,182,212,.5)}
.heatmap .cell.l3{background:rgba(6,182,212,.75)}
.heatmap .cell.l4{background:var(--accent)}
.heatmap-months{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--text3);font-family:var(--mono)}

/* Radar chart */
.radar-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;display:flex;gap:32px;flex-wrap:wrap;align-items:center}
.radar-svg{flex-shrink:0}
.radar-info{flex:1;min-width:200px}
.radar-info h3{font-size:14px;font-weight:600;margin-bottom:16px}
.radar-info .cat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.radar-info .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.radar-info .cat-name{flex:1}
.radar-info .cat-val{font-family:var(--mono);font-weight:700;color:var(--text2)}

/* Recommendations */
.reco-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.reco-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.reco-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px;text-decoration:none;color:inherit;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;display:block}
.reco-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.reco-item .ri-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:inline-block;margin-bottom:8px}
.reco-item .ri-title{font-size:14px;font-weight:600;margin-bottom:4px}
.reco-item .ri-desc{font-size:12px;color:var(--text3);line-height:1.5}

/* Achievements */
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
.badge.earned{border-color:var(--border2)}
.badge.locked{opacity:.35}
.badge .b-icon{font-size:32px;margin-bottom:8px;filter:grayscale(0)}
.badge.locked .b-icon{filter:grayscale(1)}
.badge .b-name{font-size:12px;font-weight:600;color:var(--text)}
.badge .b-desc{font-size:10px;color:var(--text3);margin-top:4px;line-height:1.4}
.badge.earned .b-name{color:var(--accent)}

/* Activity feed */
.activity-list{max-height:300px;overflow-y:auto}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.activity-item:last-child{border-bottom:none}
.activity-item .ai-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.activity-item .ai-text{flex:1;color:var(--text2)}
.activity-item .ai-text b{color:var(--text)}
.activity-item .ai-time{font-size:11px;color:var(--text3);font-family:var(--mono);white-space:nowrap}

.empty-state{text-align:center;padding:48px;color:var(--text3);font-size:14px}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.3}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.btn{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;font-family:var(--sans);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--bg3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.1);background:var(--accent)}
.danger-link{color:var(--text3);font-size:12px;text-decoration:none;cursor:pointer}
.danger-link:hover{color:var(--bad)}
@media(max-width:640px){
.hero h1{font-size:30px}
.overall-card{flex-direction:column;text-align:center}
.overall-stats{justify-content:center}
.radar-card{flex-direction:column}
}
</style>
</head>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
var BASE = "https://wangzifan396-wzf.github.io/TW/";
var CAT_COLORS = {ai:"#7c5cff", systems:"#2dd4ff", theory:"#fbbf24", cross:"#34d399"};
var CAT_NAMES = {ai:"AI / 机器学习", systems:"CS 系统", theory:"CS 理论", cross:"交叉学科"};
var DAY_MS = 86400000;

// ---- Read data from all tools ----
function readJSON(key, fallback){
  try{ var v = localStorage.getItem(key); if(v) return JSON.parse(v); }catch(e){}
  return fallback;
}

function loadData(){
  var data = {};

  // Hub: explored projects
  var explored = readJSON("tw-explored", []);
  data.explored = explored;
  data.exploredCount = explored.length;

  // Hub: recent
  var recent = readJSON("tw-recent", []);
  data.recent = recent;

  // Flashcards
  var fc = readJSON("tw_flashcards_v1", null);
  data.fc = fc;
  if(fc && fc.cards){
    var fcTotal = 119, fcMastered=0, fcLearning=0, fcNew=0, fcDue=0;
    var now = Date.now();
    for(var id in fc.cards){
      var s = fc.cards[id].status;
      if(s==="mastered") fcMastered++;
      else if(s==="review"||s==="learn") { fcLearning++; if(fc.cards[id].due<=now) fcDue++; }
      else fcNew++;
    }
    data.fcMastered = fcMastered;
    data.fcLearning = fcLearning;
    data.fcNew = fcNew;
    data.fcDue = fcDue;
    data.fcTotalReviews = fc.totalReviews || 0;
    data.fcStreak = fc.streak || 0;
    data.fcLastStudy = fc.lastStudyDate || "";
  } else {
    data.fcMastered=0; data.fcLearning=0; data.fcNew=119; data.fcDue=0;
    data.fcTotalReviews=0; data.fcStreak=0; data.fcLastStudy="";
  }

  // Quiz
  var qh = readJSON("tw_quiz_history", []);
  data.quizHistory = qh;
  if(qh.length > 0){
    var qAvg = 0, qBest = 0, qTotal = qh.length;
    qh.forEach(function(q){
      qAvg += q.score;
      if(q.score > qBest) qBest = q.score;
    });
    data.quizAvg = Math.round(qAvg / qTotal);
    data.quizBest = qBest;
    data.quizCount = qTotal;
    data.quizLast = qh[qh.length-1];
  } else {
    data.quizAvg=0; data.quizBest=0; data.quizCount=0; data.quizLast=null;
  }

  // Roadmap
  var rm = readJSON("tw_roadmap_progress", {});
  data.roadmap = rm;
  var rmKeys = Object.keys(rm);
  var rmDone = 0;
  rmKeys.forEach(function(k){ if(rm[k]) rmDone++; });
  data.roadmapDone = rmDone;
  data.roadmapTotal = 27; // total nodes

  // Theme
  data.theme = localStorage.getItem("tw-theme") || "dark";

  return data;
}

// ---- Compute activity heatmap data ----
function computeActivity(data){
  var days = {};
  function addDay(dateStr, count){
    if(!days[dateStr]) days[dateStr] = 0;
    days[dateStr] += count;
  }
  function toDateStr(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  // Flashcard reviews
  if(data.fc && data.fc.cards){
    for(var id in data.fc.cards){
      var c = data.fc.cards[id];
      if(c.last > 0){
        var d = new Date(c.last * 1000);
        addDay(toDateStr(d), 1);
      }
    }
  }
  // Quiz history
  if(data.quizHistory){
    data.quizHistory.forEach(function(q){
      var d = new Date(q.date);
      addDay(toDateStr(d), 2);
    });
  }
  // Hub exploration (approx by recent, count as 1 each)
  if(data.recent){
    // recent doesn't have dates, skip
  }
  return days;
}

// ---- Render functions ----
function renderOverall(data){
  // Weighted overall: 40% flashcards, 25% quiz, 20% explored, 15% roadmap
  var fcPct = data.fcMastered / 119;
  var quizPct = data.quizCount > 0 ? data.quizAvg / 100 : 0;
  var explorePct = data.exploredCount / 130;
  var rmPct = data.roadmapDone / data.roadmapTotal;
  var overall = Math.round((fcPct*0.4 + quizPct*0.25 + explorePct*0.2 + rmPct*0.15) * 100);

  var ring = document.getElementById("overallRing");
  var circ = 2 * Math.PI * 52;
  ring.style.strokeDasharray = circ;
  ring.style.strokeDashoffset = circ * (1 - overall/100);

  var pctEl = document.getElementById("overallPct");
  animateNumber(pctEl, 0, overall, 1000, "%");

  var title = document.getElementById("overallTitle");
  var desc = document.getElementById("overallDesc");
  if(overall === 0){
    title.textContent = "开始你的学习之旅";
    desc.textContent = "探索 130 个可视化项目，完成测验，记忆核心概念，沿着学习路线前进。";
  } else if(overall < 20){
    title.textContent = "初学者 · 刚刚起步";
    desc.textContent = "好的开始！继续探索更多项目，试试做一组测验或复习记忆卡。";
  } else if(overall < 50){
    title.textContent = "进阶者 · 稳步前进";
    desc.textContent = "进展不错！你已经掌握了部分核心知识，继续保持学习节奏。";
  } else if(overall < 80){
    title.textContent = "熟练者 · 渐入佳境";
    desc.textContent = "你已经掌握了大部分核心概念，继续攻克薄弱环节！";
  } else {
    title.textContent = "专家 · 精通掌握";
    desc.textContent = "你对计算机科学有全面而深入的理解，了不起的成就！";
  }

  var statsHtml = "";
  statsHtml += '<div class="os"><div class="v">'+data.exploredCount+'</div><div class="l">已探索项目</div></div>';
  statsHtml += '<div class="os"><div class="v">'+data.fcTotalReviews+'</div><div class="l">记忆卡复习</div></div>';
  statsHtml += '<div class="os"><div class="v">'+data.quizCount+'</div><div class="l">测验次数</div></div>';
  statsHtml += '<div class="os"><div class="v">'+data.fcStreak+'</div><div class="l">连续天数</div></div>';
  document.getElementById("overallStats").innerHTML = statsHtml;
}

function renderToolCards(data){
  var tools = [
    {
      name:"TW Hub", icon:"🏠", tc:"#5e6ad2", link:"index.html",
      desc:"130 个可视化项目探索",
      pct: Math.round(data.exploredCount/130*100),

function renderHeatmap(data){
  var activity = computeActivity(data);
  var today = new Date();
  today.setHours(0,0,0,0);
  var days = [];
  for(var i=89; i>=0; i--){
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var count = activity[ds] || 0;
    var level = 0;
    if(count >= 5) level = 4;
    else if(count >= 3) level = 3;
    else if(count >= 2) level = 2;
    else if(count >= 1) level = 1;
    days.push({date:ds, count:count, level:level, dow:d.getDay()});
  }
  var html = "";
  days.forEach(function(d){
    var cls = d.level > 0 ? " l"+d.level : "";
    html += '<div class="cell'+cls+'" title="'+d.date+': '+d.count+' 次活动"></div>';
  });
  document.getElementById("heatmap").innerHTML = html;

  // Month labels
  var months = {};
  days.forEach(function(d){
    var m = d.date.substring(0,7);
    if(!months[m]) months[m] = d.date;
  });
  var mHtml = "";
  var lastMonth = "";
  days.forEach(function(d){
    var m = d.date.substring(5,7);
    if(m !== lastMonth){
      mHtml += '<span>'+m+'月</span>';
      lastMonth = m;
    }
  });
  document.getElementById("heatmapMonths").innerHTML = mHtml;
}

function renderRadar(data){
  // Compute mastery per category from flashcards + explored
  var catData = {ai:{mastered:0,total:0}, systems:{mastered:0,total:0}, theory:{mastered:0,total:0}, cross:{mastered:0,total:0}};

  // From flashcards (we need card data, but Dashboard doesn't have CARDS array)
  // We'll estimate from flashcard states if available
  if(data.fc && data.fc.cards){
    // We don't have category info per card id here, so use overall ratio
    // Instead, use explored projects by category
  }

  // From explored projects (we need the project list with categories)
  // We'll use a simplified approach: distribute explored count across categories
  // and use flashcard mastery ratio for all
  var fcRatio = data.fcMastered / 119;
  var expRatio = data.exploredCount / 130;

  ["ai","systems","theory","cross"].forEach(function(cat){
    catData[cat].mastered = Math.round((fcRatio * 0.5 + expRatio * 0.5) * 100);
    catData[cat].total = 100;
  });

  // Draw radar
  var cx=120, cy=120, maxR=80;
  var cats = ["ai","systems","theory","cross"];
  var n = cats.length;
  var svg = document.getElementById("radarSvg");
  var html = "";

  // Grid circles
  for(var r=1; r<=4; r++){
    var rr = maxR * r / 4;
    var pts = "";
    for(var i=0; i<n; i++){
      var angle = -Math.PI/2 + i * 2*Math.PI/n;
      pts += (cx + rr*Math.cos(angle)) + "," + (cy + rr*Math.sin(angle)) + " ";
    }
    html += '<polygon points="'+pts+'" fill="none" stroke="#1e2026" stroke-width="1"/>';
  }

  // Axes
  for(var i=0; i<n; i++){
    var angle = -Math.PI/2 + i * 2*Math.PI/n;
    html += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+maxR*Math.cos(angle))+'" y2="'+(cy+maxR*Math.sin(angle))+'" stroke="#1e2026" stroke-width="1"/>';
  }

  // Data polygon
  var dataPts = "";
  for(var i=0; i<n; i++){
    var angle = -Math.PI/2 + i * 2*Math.PI/n;
    var val = catData[cats[i]].mastered / 100;
    var r = maxR * val;
    dataPts += (cx + r*Math.cos(angle)) + "," + (cy + r*Math.sin(angle)) + " ";
  }
  html += '<polygon points="'+dataPts+'" fill="rgba(6,182,212,.15)" stroke="#06b6d4" stroke-width="2"/>';

  // Data points
  for(var i=0; i<n; i++){
    var angle = -Math.PI/2 + i * 2*Math.PI/n;
    var val = catData[cats[i]].mastered / 100;
    var r = maxR * val;
    var x = cx + r*Math.cos(angle);
    var y = cy + r*Math.sin(angle);
    html += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+CAT_COLORS[cats[i]]+'"/>';
  }

  // Labels
  for(var i=0; i<n; i++){
    var angle = -Math.PI/2 + i * 2*Math.PI/n;
    var lx = cx + (maxR+18) * Math.cos(angle);
    var ly = cy + (maxR+18) * Math.sin(angle);
    html += '<text x="'+lx+'" y="'+ly+'" fill="#a1a1aa" font-size="11" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">'+CAT_NAMES[cats[i]].split(" ")[0]+'</text>';
  }

  svg.innerHTML = html;

  // Info list
  var infoHtml = "";
  cats.forEach(function(cat){
    var val = catData[cat].mastered;
    infoHtml += '<div class="cat-row"><span class="cat-dot" style="background:'+CAT_COLORS[cat]+'"></span><span class="cat-name">'+CAT_NAMES[cat]+'</span><span class="cat-val">'+val+'%</span></div>';
  });
  document.getElementById("radarInfo").innerHTML = infoHtml;
}

function fmtRelative(dateStr){
  try{
    var d = new Date(dateStr);
    var now = new Date();
    var diff = now - d;
    if(diff < 3600000) return Math.round(diff/60000)+" 分钟前";
    if(diff < 86400000) return Math.round(diff/3600000)+" 小时前";
    if(diff < 604800000) return Math.round(diff/86400000)+" 天前";
    return (d.getMonth()+1)+"/"+d.getDate();
  }catch(e){ return dateStr; }
}

function animateNumber(el, from, to, duration, suffix){
  suffix = suffix || "";
  var start = Date.now();
  function tick(){
    var elapsed = Date.now() - start;
    var progress = Math.min(elapsed / duration, 1);
    var val = Math.round(from + (to - from) * progress);
    el.textContent = val + suffix;
    if(progress < 1) requestAnimationFrame(tick);
  }
  tick();
}

function resetAll(){
  if(!confirm("确定重置所有工具的学习进度？\n这将清除：\n• 探索记录\n• 记忆卡进度\n• 测验历史\n• 路线图进度\n\n此操作不可撤销。")) return;
  localStorage.removeItem("tw-explored");
  localStorage.removeItem("tw-recent");
  localStorage.removeItem("tw_flashcards_v1");
  localStorage.removeItem("tw_quiz_history");
  localStorage.removeItem("tw_roadmap_progress");
  location.reload();
}

function init(){
  var data = loadData();

  // Update timestamp
  document.getElementById("updatedAt").textContent = "更新于 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});

  renderOverall(data);
  renderToolCards(data);
  renderHeatmap(data);
  renderRadar(data);
  renderRecommendations(data);
  renderBadges(data);
  renderActivity(data);

  document.getElementById("resetBtn").onclick = resetAll;

  // Auto-refresh every 30s to pick up changes from other tabs
  setInterval(function(){
    var newData = loadData();
    renderOverall(newData);
    renderToolCards(newData);
    renderHeatmap(newData);
    renderRadar(newData);
    renderRecommendations(newData);
    renderBadges(newData);
    renderActivity(newData);
  }, 30000);
}
