<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI+教育变革与人机共育新纪元 · 可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.6;min-height:100vh}
.app-header{position:sticky;top:0;z-index:100;background:rgba(10,11,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px}
.app-logo{font-size:18px;font-weight:700;color:var(--teal);letter-spacing:1px}
.app-logo span{color:var(--amber)}
.app-sub{color:var(--text3);font-size:12px;margin-left:4px}
.app-nav-btns{margin-left:auto;display:flex;gap:8px}
.module-nav{display:flex;gap:4px;padding:8px 24px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.mbtn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:7px 12px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px;white-space:nowrap;transition:all .2s}
.mbtn:hover{border-color:var(--teal);color:var(--teal)}
.mbtn.active{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:700}
.lab-hero{padding:36px 24px 20px;text-align:center;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.lab-hero h1{font-size:26px;margin-bottom:8px;letter-spacing:1px}
.lab-hero h1 .ac{color:var(--amber)}
.lab-hero h1 .tc{color:var(--teal)}
.lab-hero p{color:var(--text3);font-size:13px}
.module-panel{max-width:1200px;margin:0 auto;padding:20px 24px 60px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:12px}
.panel-title{font-size:20px;font-weight:700}
.panel-title .num{color:var(--amber);margin-right:8px}
.panel-desc{color:var(--text2);font-size:13px;max-width:620px;margin-top:4px}
.view-tabs{display:flex;gap:6px}
.vtab{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:6px 14px;border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:12px;transition:all .2s}
.vtab:hover{border-color:var(--cyan);color:var(--cyan)}
.vtab.active{background:var(--cyan);color:var(--bg);border-color:var(--cyan);font-weight:700}
.viz-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;overflow:hidden}
.viz-wrap svg{width:100%;height:auto;display:block}
.info-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.info-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
.info-card h4{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;margin:2px;font-size:11px}
.pill-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.pill-val{font-weight:700;font-size:12px}
.pill-lbl{color:var(--text2)}
.leg-item{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.leg-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.leg-txt{color:var(--text2)}
.info-row{display:flex;justify-content:space-between;margin:4px 0;font-size:12px;border-bottom:1px solid var(--border);padding-bottom:3px}
.info-k{font-weight:700}
.info-v{color:var(--text2)}
.footer{text-align:center;padding:20px;color:var(--text3);font-size:11px;border-top:1px solid var(--border)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.apulse{animation:pulse 2s ease-in-out infinite}
.aglow{animation:glow 2s ease-in-out infinite}
.adash{stroke-dasharray:5,5;animation:dash 1s linear infinite}
.ablink{animation:blink 1.5s ease-in-out infinite}
.aspin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@media(max-width:768px){.info-bar{grid-template-columns:1fr}.panel-head{flex-direction:column}}
</style>
</head>
<body>

  <div class="viz-wrap">

      <defs>
        <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00d4aa" stop-opacity="0.25"/><stop offset="100%" stop-color="#00d4aa" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f472b6" stop-opacity="0.25"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/><stop offset="100%" stop-color="#34d399" stop-opacity="0.03"/></linearGradient>
        <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0.03"/></linearGradient>
      </defs>
      <g id="layer"></g>
    </svg>

</div>

<script>
var SVGNS='http://www.w3.org/2000/svg';
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v!==undefined&&v!==null){el.setAttribute(k,v);}}}
  if(parent){parent.appendChild(el);}
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild){n.removeChild(n.firstChild);}}
function hexA(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function box(g,x,y,w,h,opts){
  opts=opts||{};
  return E(g,'rect',{x:x,y:y,width:w,height:h,rx:opts.rx||6,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5,class:opts.cls||''});
}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var t=E(g,'text',{x:x,y:y,'font-family':C.mono,'font-size':opts.fs||13,fill:opts.fill||C.text,'text-anchor':opts.ta||'start','font-weight':opts.fw||'normal'});
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5,'stroke-dasharray':opts.dash||'none',class:opts.cls||''});
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var col=opts.stroke||C.teal,sw=opts.sw||2,ang=Math.atan2(y2-y1,x2-x1),ah=opts.ah||7;
  E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':sw,'stroke-dasharray':opts.dash||'none',class:opts.cls||''});
  var p1x=x2-Math.cos(ang-0.4)*ah,p1y=y2-Math.sin(ang-0.4)*ah;
  var p2x=x2-Math.cos(ang+0.4)*ah,p2y=y2-Math.sin(ang+0.4)*ah;
  E(g,'polygon',{points:x2+','+y2+' '+p1x+','+p1y+' '+p2x+','+p2y,fill:col});
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  return E(g,'circle',{cx:cx,cy:cy,r:r,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5,class:opts.cls||''});
}
function poly(g,pts,opts){
  opts=opts||{};
  return E(g,'polygon',{points:pts,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5,class:opts.cls||''});
}
function radar(g,cx,cy,r,labels,values,opts){
  opts=opts||{};
  var n=labels.length,i,ring,a,rr,pts;
  for(ring=1;ring<=4;ring++){
    pts='';
    for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*ring/4;pts+=(cx+Math.cos(a)*rr)+','+(cy+Math.sin(a)*rr)+' ';}
    E(g,'polygon',{points:pts,fill:'none',stroke:C.border,'stroke-width':1});
  }
  for(i=0;i<n;i++){
    a=-Math.PI/2+i*2*Math.PI/n;
    E(g,'line',{x1:cx,y1:cy,x2:cx+Math.cos(a)*r,y2:cy+Math.sin(a)*r,stroke:C.border,'stroke-width':1});
    txt(g,cx+Math.cos(a)*(r+20),cy+Math.sin(a)*(r+20)+4,labels[i],{fs:11,fill:C.text2,ta:'middle'});
  }
  pts='';
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i]/100;pts+=(cx+Math.cos(a)*rr)+','+(cy+Math.sin(a)*rr)+' ';}
  E(g,'polygon',{points:pts,fill:hexA(opts.fill||C.teal,0.15),stroke:opts.stroke||C.teal,'stroke-width':2,class:opts.cls||''});
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i]/100;circ(g,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,3.5,{fill:opts.stroke||C.teal,stroke:C.bg2,sw:1.5});}
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function setPills(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  arr.forEach(function(p){
    var d=document.createElement('div');d.className='pill';
    d.style.borderColor=p.c||C.border2;
    d.innerHTML='<span class="pill-dot" style="background:'+p.c+'"></span><span class="pill-val" style="color:'+p.c+'">'+p.v+'</span><span class="pill-lbl">'+p.l+'</span>';
    c.appendChild(d);
  });
}
function setLegend(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  arr.forEach(function(p){
    var d=document.createElement('div');d.className='leg-item';
    d.innerHTML='<span class="leg-dot" style="background:'+p.c+'"></span><span class="leg-txt">'+p.t+'</span>';
    c.appendChild(d);
  });
}
function setInfo(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  arr.forEach(function(p){
    var d=document.createElement('div');d.className='info-row';
    d.innerHTML='<span class="info-k" style="color:'+(p.c||C.teal)+'">'+p.k+'</span><span class="info-v">'+p.v+'</span>';
    c.appendChild(d);
  });
}

var MODULES=[
  {n:'01',t:'AI+教育行动计划与政策驱动',d:'教育部AI+教育行动计划,WAIC 2026教育分论坛,人机共育理念',v:['政策演进时间线','行动框架五支柱','人机共育理念']},

  {n:'03',t:'个性化学习与认知仿真',d:'学习者心智模型,认知状态追踪,个性化路径生成,知识图谱适配',v:['心智模型图','认知状态雷达','学习路径流']},
  {n:'04',t:'人机协同教学新范式',d:'AI教师助手,人类教师角色转型,人机分工协作,课堂形态重构',v:['人机分工矩阵','课堂形态对比','教师角色转型']},
  {n:'05',t:'AI教育伦理与安全框架',d:'AI教育伦理参考框架,数据隐私,算法公平性,认知操控防范',v:['伦理框架四层','风险评估矩阵','安全防护体系']},
  {n:'06',t:'教育数字化转型与基础设施',d:'智慧校园,AI教室,教育云平台,数字教育资源体系',v:['智慧校园架构','教育云平台','数字资源生态']},
  {n:'07',t:'AI时代人才培养与课程革新',d:'课程体系智能化转型,AI素养培养,跨学科融合,教师AI能力提升',v:['课程体系转型','AI素养雷达','跨学科融合']},
  {n:'08',t:'教育AGI终局与认知共生',d:'认知共生愿景,涌现式教育,教育公平普惠,人机文明共进',v:['认知共生愿景','教育公平普惠','文明演进轨迹']}
];

var mCur=0,mViews=[0,0,0,0,0,0,0,0],mLayers={};

/* ========== Module 1: AI+教育行动计划与政策驱动 ========== */
function m1Draw(){
  var g=mLayers.m1;clearNode(g);gridBg(g,900,480);
  var v=mViews[0];

    txt(g,450,32,'AI+教育政策演进时间线 2023—2026',{fs:16,fill:C.amber,ta:'middle',fw:'bold'});

    ms.forEach(function(m,i){

    var pillars=[
      {x:150,t:'基础设施',d:['AI教室','教育云','5G网络'],c:C.teal},

    pillars.forEach(function(p){
      box(g,p.x-60,100,120,230,{fill:'url(#g-amber)',stroke:p.c,sw:1.5,rx:8});
      E(g,'rect',{x:p.x-60,y:100,width:120,height:26,rx:8,fill:hexA(p.c,0.2)});
      E(g,'rect',{x:p.x-60,y:114,width:120,height:12,fill:hexA(p.c,0.2)});
      txt(g,p.x,118,p.t,{fs:12,fill:p.c,ta:'middle',fw:'bold'});
      p.d.forEach(function(di,i){
        box(g,p.x-50,140+i*55,100,42,{fill:C.bg3,stroke:p.c,sw:1,rx:4});
        circ(g,p.x-36,161,3,{fill:p.c,stroke:'none',class:'apulse'});

    txt(g,450,360,'五大支柱协同驱动教育全面数字化转型',{fs:12,fill:C.text3,ta:'middle'});
    box(g,80,380,740,60,{fill:C.bg3,stroke:C.border2,sw:1,rx:6});

/* ========== UI System ========== */
function setView(mi,vi){
  mViews[mi]=vi;
  updateTabs();
  var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
  fns[mi]();
}
function drawModule(mi){
  mCur=mi;
  updatePanel(mi);
  updateTabs();
  var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
  fns[mi]();
}
function selectModule(mi){
  mCur=mi;
  updateNav();
  drawModule(mi);
}
function prevModule(){selectModule((mCur+7)%8);}
function nextModule(){selectModule((mCur+1)%8);}
function updateNav(){
  var c=$('moduleNav');clearNode(c);
  MODULES.forEach(function(m,i){
    var b=document.createElement('button');
    b.className='mbtn'+(i===mCur?' active':'');
    b.innerHTML='<b>'+m.n+'</b> '+m.t;
    b.onclick=function(){selectModule(i);};
    c.appendChild(b);
  });
}
function updateTabs(){
  var c=$('viewTabs');clearNode(c);
  var m=MODULES[mCur];
  m.v.forEach(function(vn,vi){
    var b=document.createElement('button');
    b.className='vtab'+(vi===mViews[mCur]?' active':'');
    b.textContent=vn;
    b.onclick=function(){setView(mCur,vi);};
    c.appendChild(b);
  });
}
function updatePanel(mi){
