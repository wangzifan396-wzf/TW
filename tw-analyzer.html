<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Analyzer — 代码复杂度分析器</title>
<style>
  :root {
    --bg: #08090a;
    --bg-elev: #0d0f12;
    --bg-elev2: #12151a;
    --bg-elev3: #171a20;
    --border: #1c1f26;
    --border-strong: #2a2f3a;
    --text: #e6e8eb;
    --text-dim: #8b9098;
    --text-faint: #565b66;
    --accent: #0891b2;
    --accent-bright: #06b6d4;
    --accent-dim: #0e4a5a;
    --green: #10b981;
    --green-dim: #0a3d31;
    --yellow: #f59e0b;
    --yellow-dim: #3d2c08;
    --red: #ef4444;
    --red-dim: #3d1414;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(8, 145, 178, 0.06), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(8, 145, 178, 0.04), transparent 60%),
      var(--bg);
  }

  a { color: var(--accent-bright); text-decoration: none; }

  /* ===== Header ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(8, 9, 10, 0.92);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 11px; margin-right: 6px; }
  .brand .mark {
    width: 30px; height: 30px;
    border-radius: 7px;
    background: linear-gradient(145deg, var(--accent), #0a6d85);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(8,145,178,0.35), 0 6px 18px -8px rgba(8,145,178,0.6);
  }
  .brand .mark svg { display: block; }
  .brand .name { font-weight: 650; letter-spacing: -0.01em; font-size: 15.5px; }
  .brand .name span { color: var(--accent-bright); }
  .brand .tag {
    font-size: 10.5px; color: var(--text-faint);
    letter-spacing: 0.14em; text-transform: uppercase;
    border-left: 1px solid var(--border-strong);
    padding-left: 10px; margin-left: 2px;
  }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }

  .seg {
    display: inline-flex; background: var(--bg-elev2);
    border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px;
  }
  .seg button {
    background: transparent; border: 0; color: var(--text-dim);
    font-family: var(--sans); font-size: 12.5px; font-weight: 550;
    padding: 6px 13px; border-radius: 6px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--accent-dim); color: var(--accent-bright); }

  .field { position: relative; }
  select, .btn {
    font-family: var(--sans); font-size: 12.5px;
    background: var(--bg-elev2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; outline: none;
    transition: border-color .15s, background .15s;
  }
  select:hover, .btn:hover { border-color: var(--border-strong); }
  select { padding-right: 28px; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238b9098' stroke-width='1.5'/></svg>");
    background-repeat: no-repeat; background-position: right 11px center;
  }

  .btn-primary {
    background: var(--accent); color: #04161c; border-color: var(--accent);
    font-weight: 650; letter-spacing: 0.01em;
  }
  .btn-primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
  .btn-ghost { background: transparent; }
  .btn-ghost:hover { background: var(--bg-elev2); }

  .kbd {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
    border: 1px solid var(--border-strong); border-radius: 4px;
    padding: 1px 5px; margin-left: 6px;
  }

  /* ===== Layout ===== */
  main {
    padding: 18px 22px 60px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 18px;
    max-width: 1680px;
    margin: 0 auto;
  }

  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--bg-elev2), transparent);
  }
  .panel-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .panel-head h2 {
    font-size: 11px; font-weight: 600; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .panel-head .meta { margin-left: auto; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }

  .col-left { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .full { grid-column: 1 / -1; }

  /* ===== Editor ===== */
  .editor-wrap { display: flex; flex-direction: column; min-height: 0; }
  .editor {
    display: flex; height: 64vh; min-height: 360px;
    background: var(--bg-elev2);
  }
  .gutter {
    padding: 12px 10px 12px 14px; text-align: right;
    color: var(--text-faint); background: var(--bg-elev);
    user-select: none; overflow: hidden;
    font-family: var(--mono); font-size: 12.5px; line-height: 20px;
    border-right: 1px solid var(--border); min-width: 52px;
    white-space: pre;
  }
  #codeInput {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); font-family: var(--mono); font-size: 12.5px;
    line-height: 20px; padding: 12px 14px; resize: none;
    white-space: pre; overflow: auto; tab-size: 2;
    caret-color: var(--accent-bright);
  }
  .editor-foot {
    display: flex; align-items: center; gap: 16px;
    padding: 9px 16px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-faint); font-family: var(--mono);
    background: var(--bg-elev);
  }
  .editor-foot .sep { width: 1px; height: 12px; background: var(--border-strong); }
  .editor-foot b { color: var(--text-dim); font-weight: 550; }

  /* ===== Dashboard ===== */
  .dash-grid {
    display: grid; grid-template-columns: 168px 1fr; gap: 18px; padding: 18px;
    align-items: center;
  }
  .gauge { position: relative; width: 168px; height: 168px; }
  .gauge svg { display: block; }
  .gauge .center {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center;
  }
  .gauge .grade { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .gauge .score { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 4px; }

  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .metric {
    background: var(--bg-elev2); border: 1px solid var(--border);
    border-radius: 9px; padding: 11px 13px;
  }
  .metric .k { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .metric .v { font-size: 22px; font-weight: 650; font-family: var(--mono); margin-top: 3px; letter-spacing: -0.02em; }
  .metric .sub { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; font-family: var(--mono); }
  .metric.accent .v { color: var(--accent-bright); }
  .metric .v.green { color: var(--green); }
  .metric .v.yellow { color: var(--yellow); }
  .metric .v.red { color: var(--red); }

  /* ===== Tables ===== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    text-align: left; padding: 10px 14px; font-size: 10.5px;
    color: var(--text-faint); letter-spacing: 0.09em; text-transform: uppercase;
    font-weight: 600; border-bottom: 1px solid var(--border);
    background: var(--bg-elev2); white-space: nowrap;
  }
  tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--bg-elev2); }
  .fn-name { color: var(--text); font-weight: 550; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    font-family: var(--sans); letter-spacing: 0.02em;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  .pill.green { color: var(--green); background: var(--green-dim); }
  .pill.green::before { background: var(--green); }
  .pill.yellow { color: var(--yellow); background: var(--yellow-dim); }
  .pill.yellow::before { background: var(--yellow); }
  .pill.red { color: var(--red); background: var(--red-dim); }
  .pill.red::before { background: var(--red); }

  /* ===== Chart ===== */
  .chart-wrap { padding: 16px; overflow-x: auto; }
  .chart svg { display: block; width: 100%; min-width: 480px; }
  .chart .bar { transition: opacity .15s; }
  .chart .bar:hover { opacity: 0.8; }
  .chart .axis { stroke: var(--border); }
  .chart .grid { stroke: var(--border); stroke-dasharray: 2 3; }
  .chart .lbl { fill: var(--text-faint); font-size: 9.5px; font-family: var(--mono); }
  .chart .vlbl { fill: var(--text-dim); font-size: 9.5px; font-family: var(--mono); }
  .chart .tip { fill: var(--text); font-size: 10px; font-family: var(--mono); }

  /* ===== Smells ===== */
  .smell-list { padding: 6px 0; max-height: 360px; overflow-y: auto; }
  .smell {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px;
    padding: 11px 16px; border-bottom: 1px solid var(--border);
    align-items: start;
  }
  .smell:last-child { border-bottom: 0; }
  .smell .ln {
    font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    background: var(--bg-elev2); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px; text-align: center; min-width: 44px;
  }
  .smell .body { min-width: 0; }
  .smell .body .t { font-size: 13px; font-weight: 550; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .smell .body .d { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .smell .body .fix { font-size: 11.5px; color: var(--accent-bright); margin-top: 3px; font-family: var(--mono); }
  .smell .sev { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 5px; letter-spacing: 0.04em; }
  .sev.high { color: var(--red); background: var(--red-dim); }
  .sev.mid { color: var(--yellow); background: var(--yellow-dim); }
  .sev.low { color: var(--green); background: var(--green-dim); }

  /* ===== Heatmap ===== */
  .heat-controls { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
  .heat-legend { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .heat-legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .heat-body {
    max-height: 460px; overflow: auto; padding: 8px 0;
    background: var(--bg-elev2); font-family: var(--mono); font-size: 12.5px; line-height: 20px;
  }
  .hline { display: flex; align-items: stretch; }
  .hline .hn {
    width: 52px; flex-shrink: 0; text-align: right; padding: 0 12px;
    color: var(--text-faint); user-select: none; border-right: 1px solid var(--border);
  }
  .hline .hc {
    padding: 0 14px; white-space: pre; border-left: 3px solid transparent;
    min-width: 0; flex: 1;
  }
  .hline.heat-0 .hc { border-left-color: rgba(139,144,152,0.18); }
  .hline.heat-1 .hc { border-left-color: var(--green); background: rgba(16,185,129,0.05); }
  .hline.heat-2 .hc { border-left-color: var(--green); background: rgba(16,185,129,0.10); }
  .hline.heat-3 .hc { border-left-color: var(--yellow); background: rgba(245,158,11,0.08); }
  .hline.heat-4 .hc { border-left-color: var(--yellow); background: rgba(245,158,11,0.14); }
  .hline.heat-5 .hc { border-left-color: var(--red); background: rgba(239,68,68,0.10); }
  .hline.heat-6 .hc { border-left-color: var(--red); background: rgba(239,68,68,0.18); }
  .tok-kw { color: #c678dd; }
  .tok-str { color: #98c379; }
  .tok-num { color: #d19a66; }
  .tok-com { color: var(--text-faint); font-style: italic; }
  .tok-fn { color: var(--accent-bright); }

  /* ===== Empty state ===== */
  .empty { padding: 48px 24px; text-align: center; color: var(--text-faint); }
  .empty .ic { font-size: 30px; margin-bottom: 10px; opacity: 0.5; }
  .empty .t { font-size: 13px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-elev3); border: 1px solid var(--border-strong);
    color: var(--text); padding: 10px 18px; border-radius: 9px;
    font-size: 12.5px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Scrollbars ===== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #363c48; }

  /* ===== Responsive ===== */
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
    .editor { height: 50vh; }
    .dash-grid { grid-template-columns: 1fr; justify-items: center; }
    .metrics { width: 100%; }
    .brand .tag { display: none; }
  }
  @media (max-width: 560px) {
    header { padding: 12px 14px; gap: 10px; }
    main { padding: 14px; }
    .toolbar { width: 100%; }
    .metrics { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 11 L6 5 L9 9 L14 3" stroke="#04161c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14" cy="3" r="1.6" fill="#04161c"/>
      </svg>
    </div>
    <div>
      <div class="name">TW <span>Analyzer</span></div>
    </div>
    <div class="tag">Code Complexity</div>
  </div>

  <div class="toolbar">
    <div class="seg" id="langSeg" role="tablist" aria-label="语言选择">
      <button data-lang="js" class="active">JavaScript</button>
      <button data-lang="python">Python</button>
      <button data-lang="java">Java</button>
    </div>
    <div class="field">
      <select id="exampleSelect" aria-label="预置示例">
        <option value="">加载示例…</option>
        <option value="clean">① 简洁的好代码 (A)</option>
        <option value="nested">② 过度嵌套</option>
        <option value="long">③ 长函数 (&gt;100行)</option>
        <option value="cc">④ 高圈复杂度</option>
        <option value="dup">⑤ 重复代码</option>
        <option value="cb">⑥ 回调地狱</option>
        <option value="eng">⑦ 合理的工程代码</option>
        <option value="refactor">⑧ 需要重构</option>
      </select>
    </div>
    <button class="btn btn-ghost" id="clearBtn" title="清空编辑器">清空</button>
    <button class="btn btn-primary" id="analyzeBtn">分析 <span class="kbd">Ctrl+↵</span></button>
  </div>
</header>

<main>
  <!-- Left: Editor -->
  <section class="col-left">
    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span>
        <h2>代码编辑器</h2>
        <span class="meta" id="editorMeta">— · —</span>
      </div>
      <div class="editor-wrap">
        <div class="editor">
          <div class="gutter" id="gutter">1</div>
          <textarea id="codeInput" spellcheck="false" placeholder="// 粘贴 JS / Python / Java 代码，或从顶部加载示例…&#10;// 按 Ctrl + Enter 运行分析"></textarea>
        </div>
        <div class="editor-foot">
          <span>行 <b id="footLines">0</b></span><span class="sep"></span>
          <span>字符 <b id="footChars">0</b></span><span class="sep"></span>
          <span>语言 <b id="footLang">JavaScript</b></span><span class="sep"></span>
          <span id="footHint">就绪</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Right: Results -->
  <section class="col-right">
    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span>
        <h2>总体健康度</h2>
        <span class="meta" id="dashMeta">未分析</span>
      </div>
      <div class="dash-grid">
        <div class="gauge" id="gauge"></div>
        <div class="metrics" id="metrics"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span>
        <h2>函数复杂度排行</h2>
        <span class="meta" id="fnMeta">0 个函数</span>
      </div>
      <div class="table-wrap">
        <table id="fnTable">
          <thead>
            <tr>
              <th>函数</th><th>行数</th><th>参数</th><th>圈复杂度</th><th>认知复杂度</th><th>风险</th>
            </tr>
          </thead>
          <tbody id="fnBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span>
        <h2>复杂度分布</h2>
        <span class="meta">圈复杂度 / 函数</span>
      </div>
      <div class="chart-wrap"><div class="chart" id="chart"></div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span>
        <h2>代码异味清单</h2>
        <span class="meta" id="smellMeta">0 项</span>
      </div>
      <div class="smell-list" id="smellList"></div>
    </div>
  </section>

  <!-- Full width: Heatmap -->
  <section class="panel full">
    <div class="panel-head">
      <span class="dot"></span>
      <h2>代码热力图</h2>
      <span class="meta" id="heatMeta">按行复杂度着色</span>
      <div class="heat-legend">
        <span class="sw" style="background:rgba(139,144,152,0.3)"></span>简单
        <span class="sw" style="background:var(--green)"></span>低
        <span class="sw" style="background:var(--yellow)"></span>中
        <span class="sw" style="background:var(--red)"></span>高
      </div>
    </div>
    <div class="heat-body" id="heatBody"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
 * TW Analyzer — 代码复杂度分析器
 * 纯正则 + 状态机实现，无外部依赖
 * ============================================================ */

var TW = (function () {

  /* ---------- 常量 ---------- */
  var LS_PREFIX = "tw-analyzer-";
  var RISK = {
    green: { label: "低", cls: "green" },
    yellow: { label: "中", cls: "yellow" },
    red: { label: "高", cls: "red" }
  };

  /* ---------- 工具函数 ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function countNL(str, upto) {
    var n = 0;
    for (var i = 0; i < upto && i < str.length; i++) if (str.charCodeAt(i) === 10) n++;
    return n;
  }
  function idxToLine(code, idx) { return countNL(code, idx) + 1; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  /* ---------- 语言配置 ---------- */
  var LANG = {
    js: {
      name: "JavaScript",
      lineComment: "//",
      blockComment: true,
      strings: ["'", '"', "`"],
      controlKw: ["if", "for", "while", "switch", "catch", "try"],

  /* ---------- 代码清洗：去除字符串与注释（保留长度与换行） ---------- */

    while (i < n) {
      var c = code[i];

      var three = code.substr(i, 3);
      // line comment
      if (lang === "python" && c === "#") {
        while (i < n && code[i] !== "\n") { out.push(" "); i++; }
        continue;
      }
      if (two === cfg.lineComment) {
        while (i < n && code[i] !== "\n") { out.push(" "); i++; }
        continue;
      }
      // block comment
      if (cfg.blockComment && two === "/*") {
        out.push(" ", " "); i += 2;
        while (i < n && code.substr(i, 2) !== "*/") {
          out.push(code[i] === "\n" ? "\n" : " "); i++;
        }
        if (i < n) { out.push(" ", " "); i += 2; }
        continue;
      }
      // python triple strings
      if (lang === "python" && (three === '"""' || three === "'''")) {
        out.push(" ", " ", " "); i += 3;
        while (i < n && code.substr(i, 3) !== three) {
          out.push(code[i] === "\n" ? "\n" : " "); i++;

        continue;

          out.push(code[i] === "\n" ? "\n" : " "); i++;

  /* ---------- 行统计 ---------- */

        continue;

        var q = t.substr(0, 3);
        if (t.indexOf(q, 3) === -1) inBlock = true;
        continue;

  /* ---------- 圈复杂度（McCabe） ---------- */

  function cyclomaticPerLine(cleaned, cfg) {

    var i = 0, n = cleaned.length;
    var controlSet = {};
    cfg.controlKw.forEach(function (k) { controlSet[k] = true; });
    var sibSet = {};
    cfg.siblingKw.forEach(function (k) { sibSet[k] = true; });

    while (i < n) {
      var c = cleaned[i];
      if (c === "(") { parenDepth++; i++; continue; }
      if (c === ")") { if (parenDepth > 0) parenDepth--; i++; continue; }
      if (c === "{") {
        braceDepth++;
        if (pending.length && pending[0] === braceDepth) {
          controlStack.push(braceDepth);
          pending.shift();
        }
        i++; continue;
      }
      if (c === "}") {
        braceDepth--;
        if (braceDepth < 0) braceDepth = 0;
        while (controlStack.length && controlStack[controlStack.length - 1] > braceDepth) {
          controlStack.pop();
        }
        // clear pending at top level (control without braces ended by closing block)

        i++; continue;

      if (c === ";") {

        i++; continue;

            pending.push(braceDepth + 1);
          }
        } else if (sibSet[word]) {

        }
        continue;
      }
      // logical operators
      if (c === "&" && cleaned[i + 1] === "&") { cog += 1; i += 2; continue; }
      if (c === "|" && cleaned[i + 1] === "|") { cog += 1; i += 2; continue; }
      if (c === "?" && cleaned[i + 1] === "?") { cog += 1; i += 2; continue; }
      if (c === "?" && cleaned[i + 1] !== ".") { cog += 1; i++; continue; }
      i++;

      } else if (f.cc > 10) {

      } else if (f.paramCount > 4) {

  /* 结构指纹：归一化标识符与字面量，保留关键字与运算符，用于检测复制粘贴 */

  ("var let const function if else for while do switch case default break continue return throw try catch finally new typeof instanceof in of delete void this class extends super static get set async await yield import export from as with implements interface package private protected public enum true false null undefined None True False def pass lambda self nonlocal global raise except and or not is abstract final native synchronized boolean int long float double char byte short").split(/\s+/).forEach(function (k) { if (k) KW_SET[k] = true; });

    var s = line;
    s = s.replace(/(['"`])(?:\\.|(?!\1).)*\1/g, "S");
    s = s.replace(/\b\d+(?:\.\d+)?\b/g, "N");
    s = s.replace(/[A-Za-z_$][\w$]*/g, function (w) { return KW_SET[w] ? w : "ID"; });
    s = s.replace(/\s+/g, " ").trim();
    return s;
  }

  function findDuplicates(lines) {
    var norm = lines.map(fingerprintLine);
    var result = [];
    var used = {};
    var minLen = 4, maxLen = 14;
    for (var i = 0; i < norm.length; i++) {
      if (used[i] || !norm[i]) continue;
      var foundLen = 0, foundJs = [];
      for (var L = Math.min(maxLen, norm.length - i); L >= minLen; L--) {
        var key = norm.slice(i, i + L).join("\n");
        if (key.replace(/[\sNID]/g, "").length < 5) continue;
        var js = [];
        for (var j = i + L; j <= norm.length - L; j++) {
          if (used[j]) continue;
          if (norm.slice(j, j + L).join("\n") === key) js.push(j);
        }
        if (js.length) { foundLen = L; foundJs = js; break; }
      }
      if (foundLen && result.length < 6) {
        foundJs.forEach(function (j) {
          if (result.length >= 6) return;
          result.push({ a: i, b: j, len: foundLen });
          for (var u = 0; u < foundLen; u++) used[j + u] = true;
        });
        for (var u2 = 0; u2 < foundLen; u2++) used[i + u2] = true;
      }
    }
    return result;
  }

  /* 回调地狱扫描器：仅追踪 function(...)/=> 回调括号深度，忽略 if/for 等块 */
  function detectCallbackHell(cleaned) {
    var totalBrace = 0, curDepth = 0, maxDepth = 0, line = 1, startLine = -1, maxLine = -1;
    var cbAt = [];
    var i = 0, n = cleaned.length;
    while (i < n) {
      var c = cleaned[i];
      if (c === "\n") { line++; i++; continue; }
      if (c === "{") {
        totalBrace++;
        var before = cleaned.slice(Math.max(0, i - 60), i);
        var isCb = /(?:=>|function\s*\([^)]*\))\s*$/.test(before);
        if (isCb) {
          curDepth++;
          if (curDepth === 1) startLine = line;
          if (curDepth > maxDepth) { maxDepth = curDepth; maxLine = startLine; }
        }
        cbAt[totalBrace] = isCb ? 1 : 0;
        i++; continue;
      }
      if (c === "}") {
        if (cbAt[totalBrace]) curDepth = Math.max(0, curDepth - 1);
        if (totalBrace > 0) totalBrace--;
        i++; continue;
      }
      i++;
    }
    return { depth: maxDepth, line: maxLine };
  }

  /* ---------- 热力图数据 ---------- */
  function buildHeatmap(cleaned, decPerLine, depthArr, lang) {
    var lines = cleaned.split("\n");
    var heat = new Array(lines.length).fill(0);
    for (var i = 0; i < lines.length; i++) {
      var score = decPerLine[i] + Math.max(0, depthArr[i] - 1) * 0.5;
      if (score <= 0.4) heat[i] = 0;
      else if (score <= 1) heat[i] = 1;
      else if (score <= 2) heat[i] = 2;
      else if (score <= 3) heat[i] = 3;
      else if (score <= 4) heat[i] = 4;
      else if (score <= 6) heat[i] = 5;
      else heat[i] = 6;
    }
    return heat;
  }

  /* ---------- 风险评级 ---------- */
  function riskOf(f) {
    if (f.cc > 15 || f.lines > 100 || f.cognitive > 20) return RISK.red;
    if (f.cc > 10 || f.lines > 50 || f.cognitive > 15) return RISK.yellow;
    return RISK.green;
  }

  /* ---------- 健康度评分 ---------- */
  function healthScore(stats, funcs, smells) {
    var score = 100;
    var ccAvg = funcs.length ? funcs.reduce(function (s, f) { return s + f.cc; }, 0) / funcs.length : stats.cc;
    if (ccAvg > 5) score -= (ccAvg - 5) * 3;
    var maxCc = funcs.length ? Math.max.apply(null, funcs.map(function (f) { return f.cc; })) : stats.cc;
    if (maxCc > 10) score -= (maxCc - 10) * 2;
    var maxCog = funcs.length ? Math.max.apply(null, funcs.map(function (f) { return f.cognitive; })) : stats.cognitive;
    if (maxCog > 15) score -= (maxCog - 15) * 1.5;
    smells.forEach(function (s) {
      if (s.sev === "high") score -= 6;
      else if (s.sev === "mid") score -= 3;
      else score -= 0.8;
    });
    var longFns = funcs.filter(function (f) { return f.lines > 50; }).length;
    score -= longFns * 3;
    return clamp(Math.round(score), 0, 100);
  }

  function gradeOf(score) {
    if (score >= 90) return { grade: "A", color: "#10b981" };
    if (score >= 80) return { grade: "B", color: "#84cc16" };
    if (score >= 70) return { grade: "C", color: "#f59e0b" };
    if (score >= 55) return { grade: "D", color: "#f97316" };
    if (score >= 40) return { grade: "E", color: "#ef4444" };
    return { grade: "F", color: "#dc2626" };
  }

  /* ---------- 简易语法高亮（热力图用） ---------- */
  function highlight(line, lang) {
    var escaped = esc(line);
    var cfg = LANG[lang] || LANG.js;
    var out = escaped;
    if (lang === "python") {
      out = out.replace(/(#.*$)/g, '<span class="tok-com">$1</span>');
    } else {
      out = out.replace(/(\/\/.*$)/g, '<span class="tok-com">$1</span>');
    }
    out = out.replace(/(['"`])(?:\\.|(?!\1).)*\1/g, '<span class="tok-str">$&</span>');
    out = out.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
    var kws = lang === "python"
      ? "def|class|if|elif|else|for|while|return|import|from|try|except|finally|with|as|in|not|and|or|None|True|False|lambda|yield|pass|break|continue|raise"
      : "function|const|let|var|if|else|for|while|return|class|extends|new|try|catch|finally|switch|case|break|continue|throw|import|export|from|default|typeof|instanceof|async|await|yield|this|null|undefined|true|false|void|public|private|protected|static|final|abstract|interface|implements|throws";
    out = out.replace(new RegExp("\\b(" + kws + ")\\b", "g"), '<span class="tok-kw">$1</span>');
    return out || "&nbsp;";
  }

  /* ============================================================
   *  渲染
   * ============================================================ */
  function renderGauge(score, grade) {
    var r = 64, cx = 84, cy = 84;
    var circ = 2 * Math.PI * r;
    var pct = score / 100;
    var offset = circ * (1 - pct);
    var g = gradeOf(score);
    $("gauge").innerHTML =
      '<svg viewBox="0 0 168 168" width="168" height="168">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#1c1f26" stroke-width="12"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + g.color + '" stroke-width="12" ' +
      'stroke-linecap="round" transform="rotate(-90 ' + cx + ' ' + cy + ')" ' +
      'stroke-dasharray="' + circ.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"/>' +
      '<circle cx="' + cx + '" cy="' + (cy - r) + '" r="3" fill="' + g.color + '"/>' +
      '</svg>' +
      '<div class="center"><div><div class="grade" style="color:' + g.color + '">' + g.grade + '</div>' +
      '<div class="score">' + score + ' / 100</div></div></div>';

  function renderMetrics(stats, funcs, deps) {
    var avgCc = funcs.length ? (funcs.reduce(function (s, f) { return s + f.cc; }, 0) / funcs.length) : stats.cc;
    var avgCog = funcs.length ? (funcs.reduce(function (s, f) { return s + f.cognitive; }, 0) / funcs.length) : stats.cognitive;
    var ccCls = avgCc <= 5 ? "green" : avgCc <= 10 ? "yellow" : "red";
    var cogCls = avgCog <= 10 ? "green" : avgCog <= 20 ? "yellow" : "red";
    $("metrics").innerHTML =
      metric("圈复杂度", stats.cc, "全文件 McCabe", "accent") +
      metric("认知复杂度", stats.cognitive, "SonarSource", "accent") +
      metric("函数数量", funcs.length, "已识别", "") +
      metric("平均圈复杂度", avgCc.toFixed(1), "每个函数", ccCls) +
      metric("代码行数", stats.code, "总 " + stats.total + " · 注释 " + stats.comment, "") +
      metric("依赖项", deps.count, "import / require", "") +
      metric("平均认知复杂度", avgCog.toFixed(1), "每个函数", cogCls) +
      metric("空行/注释", (stats.blank + stats.comment), "可优化空间", "");
  }

  function metric(k, v, sub, cls) {
    var vcls = cls === "green" ? "v green" : cls === "yellow" ? "v yellow" : cls === "red" ? "v red" : "v";
    var cardCls = cls === "accent" ? "metric accent" : "metric";
    return '<div class="' + cardCls + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="' + vcls + '">' + esc(v) + '</div>' +
      '<div class="sub">' + esc(sub) + '</div></div>';

  function renderFnTable(funcs) {

      return;
    }
    var sorted = funcs.slice().sort(function (a, b) { return b.cc - a.cc; });
    var html = "";
    sorted.forEach(function (f) {
      var r = riskOf(f);
      html += '<tr>' +
        '<td><div class="fn-name" title="' + esc(f.name + "(" + f.params + ")") + '">' + esc(f.name) + '</div></td>' +

  function renderChart(funcs) {
    var el = $("chart");
    if (!funcs.length) {
      el.innerHTML = '<div class="empty"><div class="ic">▁▂▄▆█</div><div class="t">无函数可绘制</div></div>';
      return;
    }
    var sorted = funcs.slice().sort(function (a, b) { return b.cc - a.cc; }).slice(0, 16);
    var maxCc = Math.max.apply(null, sorted.map(function (f) { return f.cc; }));
    maxCc = Math.max(maxCc, 5);
    var W = Math.max(480, sorted.length * 52);
    var H = 200;
    var padL = 36, padR = 14, padT = 16, padB = 44;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;
    var bw = plotW / sorted.length;
    var ticks = 4;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">';
    // grid + y labels
    for (var t = 0; t <= ticks; t++) {
      var yv = Math.round(maxCc * t / ticks);
      var yy = padT + plotH - (plotH * t / ticks);
      svg += '<line class="grid" x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '"/>';
      svg += '<text class="lbl" x="' + (padL - 6) + '" y="' + (yy + 3) + '" text-anchor="end">' + yv + '</text>';
    }
    svg += '<line class="axis" x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (W - padR) + '" y2="' + (padT + plotH) + '"/>';
    sorted.forEach(function (f, i) {
      var h = (f.cc / maxCc) * plotH;
      var x = padL + i * bw + bw * 0.18;
      var w = bw * 0.64;
      var y = padT + plotH - h;
      var r = riskOf(f);
      var color = r.cls === "red" ? "#ef4444" : r.cls === "yellow" ? "#f59e0b" : "#10b981";
      svg += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + color + '" opacity="0.85"><title>' + esc(f.name) + ' — CC ' + f.cc + ', 认知 ' + f.cognitive + '</title></rect>';
      svg += '<text class="tip" x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 4) + '" text-anchor="middle">' + f.cc + '</text>';
      var nm = f.name.length > 8 ? f.name.slice(0, 7) + "…" : f.name;
      svg += '<text class="vlbl" x="' + (x + w / 2).toFixed(1) + '" y="' + (H - padB + 14) + '" text-anchor="middle" transform="rotate(-20 ' + (x + w / 2).toFixed(1) + ' ' + (H - padB + 14) + ')">' + esc(nm) + '</text>';
    });
    svg += '</svg>';
    el.innerHTML = svg;
  }

  /* ============================================================
   *  主分析流程
   * ============================================================ */
  function analyze(code, lang) {
    var cfg = LANG[lang] || LANG.js;
    var cleaned = cleanCode(code, lang);
    var lineStats = countLines(code, lang);
    var funcs = extractFunctions(code, cleaned, lang);
    var deps = analyzeDeps(code, lang);
    var decPerLine = cyclomaticPerLine(cleaned, cfg);
    var depthArr = depthPerLine(cleaned, lang);
    var smells = detectSmells(code, cleaned, funcs, lang, depthArr);
    var heat = buildHeatmap(cleaned, decPerLine, depthArr, lang);

    var cc = cyclomatic(cleaned, cfg);
    var cog = cognitive(cleaned, lang);
    var stats = { cc: cc, cognitive: cog, total: lineStats.total, code: lineStats.code, comment: lineStats.comment, blank: lineStats.blank };

    var score = healthScore(stats, funcs, smells);
    var grade = gradeOf(score);

    renderGauge(score, grade);
    renderMetrics(stats, funcs, deps);
    renderFnTable(funcs);
    renderChart(funcs);
    renderSmells(smells);
    renderHeatmap(code, heat, lang);

    $("dashMeta").textContent = grade.grade + " · " + score + " 分";
    $("fnMeta").textContent = funcs.length + " 个函数";
    $("smellMeta").textContent = smells.length + " 项";
    $("heatMeta").textContent = funcs.length + " 函数 · " + lineStats.total + " 行";
  }

'  return new Promise((resolve, reject) => {\n' +
'    let attempt = 0;\n' +
'    function run() {\n' +
'      attempt++;\n' +
'      fetch(url)\n' +

  /* ============================================================
   *  UI 控制器
   * ============================================================ */
  var state = { lang: "js" };

  function updateGutter() {
    var ta = $("codeInput");
    var lines = ta.value.split("\n").length;
    var nums = [];
    for (var i = 1; i <= lines; i++) nums.push(i);
    $("gutter").textContent = nums.join("\n");
    $("footLines").textContent = lines;
    $("footChars").textContent = ta.value.length;
    $("editorMeta").textContent = lines + " 行 · " + state.lang.toUpperCase();
  }

  function loadExample(key) {
    if (!EXAMPLES[key]) return;
    $("codeInput").value = EXAMPLES[key];
    updateGutter();
    persist();
    runAnalysis();
    toast("已加载示例：" + $("exampleSelect").options[$("exampleSelect").selectedIndex].text);
  }

  function setLang(lang) {
    state.lang = lang;
    document.querySelectorAll("#langSeg button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    $("footLang").textContent = LANG[lang].name;
    updateGutter();
    persist();
  }

  function persist() {
    try {
      localStorage.setItem(LS_PREFIX + "code", $("codeInput").value);
      localStorage.setItem(LS_PREFIX + "lang", state.lang);
    } catch (e) { /* ignore */ }
  }

  function restore() {
    try {
      var lang = localStorage.getItem(LS_PREFIX + "lang");
      var code = localStorage.getItem(LS_PREFIX + "code");
      if (lang && LANG[lang]) setLang(lang);
      if (code != null) $("codeInput").value = code;
    } catch (e) { /* ignore */ }
  }

  function runAnalysis() {
    var code = $("codeInput").value;
    if (!code.trim()) {
      toast("请先粘贴代码或加载示例");
      return;
    }
    var t0 = performance.now();
    analyze(code, state.lang);
    var dt = Math.round(performance.now() - t0);
    $("footHint").textContent = "分析耗时 " + dt + "ms";
    persist();
  }

  function clearAll() {
    $("codeInput").value = "";
    updateGutter();
    persist();
    toast("已清空");
  }

  /* ---------- 编辑器增强：Tab 缩进 + 滚动同步 ---------- */
  function initEditor() {
    var ta = $("codeInput");
    var gutter = $("gutter");

    ta.addEventListener("input", function () {
      updateGutter();
      persist();
    });

    ta.addEventListener("scroll", function () {
      gutter.scrollTop = ta.scrollTop;
    });

    ta.addEventListener("keydown", function (e) {
      if (e.key === "Tab") {
        e.preventDefault();
        var s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 2;
        updateGutter();
        persist();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        runAnalysis();
      }
    });
  }

  function init() {
    restore();
    if (!$("codeInput").value) {
      $("codeInput").value = EXAMPLES.clean;
    }
    updateGutter();

    document.querySelectorAll("#langSeg button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.dataset.lang); runAnalysis(); });
    });
    $("exampleSelect").addEventListener("change", function () {
      var v = this.value;
      if (v) { loadExample(v); this.value = ""; }
    });
    $("analyzeBtn").addEventListener("click", runAnalysis);
    $("clearBtn").addEventListener("click", clearAll);

    initEditor();
    runAnalysis();
  }

  return { init: init };
})();

document.addEventListener("DOMContentLoaded", function () { TW.init(); });
</script>
