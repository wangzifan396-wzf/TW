<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TW · 混沌工程可视化实验室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --theme:#8b5cf6;--theme-2:#a78bfa;--theme-soft:rgba(139,92,246,.10);--theme-line:rgba(139,92,246,.28);--theme-glow:rgba(139,92,246,.45);
  --bg:#0a0b0f;--surface:#111319;--surface-2:#161922;--surface-3:#1d212c;
  --border:#232733;--border-2:#2e333f;
  --text:#e6e8ec;--text-2:#9aa1ad;--text-3:#646b78;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--sky:#38bdf8;--rose:#fb7185;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.86);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;gap:20px}
.hub-link{font-family:var(--mono);font-size:12px;color:var(--text-2);padding:5px 10px;border:1px solid var(--border-2);border-radius:6px;transition:.2s}
.hub-link:hover{color:var(--theme-2);border-color:var(--theme-line);background:var(--theme-soft)}
.topbar-title{font-weight:600;font-size:13px;letter-spacing:.02em}
.topbar-title b{color:var(--theme-2)}
.topbar-meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.08em}
main{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
.hero{padding:24px 0 36px;border-bottom:1px solid var(--border)}
.eyebrow{font-family:var(--mono);font-size:11px;color:var(--theme-2);letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:14px}
.hero h1 span{color:var(--theme-2)}
.hero p{color:var(--text-2);max-width:720px;font-size:15px}
.hero-stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-v{font-family:var(--mono);font-size:18px;color:var(--theme-2);font-weight:600}
.stat-l{font-size:11px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;margin-top:28px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:thin}
.tab{flex:0 0 auto;padding:11px 14px;font-size:12.5px;color:var(--text-3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:.18s}
.tab .tn{font-family:var(--mono);color:var(--text-3);margin-right:6px;font-size:11px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--theme-2);border-bottom-color:var(--theme)}
.tab.active .tn{color:var(--theme-2)}
.stage{position:relative;margin-top:28px}
.module{display:none;animation:fade .4s ease}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.mhead h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.mhead .mk{font-family:var(--mono);font-size:11px;color:var(--theme-2);background:var(--theme-soft);border:1px solid var(--theme-line);padding:2px 8px;border-radius:4px}
.mdesc{color:var(--text-2);font-size:13px;margin-bottom:20px;max-width:760px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:16px}
.panel-label{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel-label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--theme)}
.svg-wrap{width:100%;overflow:hidden;border-radius:6px;background:var(--surface-2)}
.svg-wrap svg{display:block;width:100%;height:auto}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font-family:var(--mono);font-size:11.5px;color:var(--text-2);background:var(--surface-3);border:1px solid var(--border-2);padding:6px 12px;border-radius:6px;cursor:pointer;transition:.16s}
.btn:hover{color:var(--theme-2);border-color:var(--theme-line);background:var(--theme-soft)}
.btn.on{color:var(--bg);background:var(--theme);border-color:var(--theme)}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.kv-item{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.kv-item b{color:var(--theme-2);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--text-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.note{font-size:12px;color:var(--text-3);border-left:2px solid var(--theme-line);padding:4px 0 4px 12px;margin-top:14px;line-height:1.55}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media(max-width:760px){.hero h1{font-size:26px}.topbar-meta{display:none}main{padding:24px 16px 60px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="hub-link" href="#">← TW Hub</a>
    <div class="topbar-title">TW · <b>混沌工程</b> 可视化实验室</div>
    <div class="topbar-meta">VIZ LAB · No.166</div>
  </div>
</header>
<main>
  <section class="hero">
    <div class="eyebrow">TW 可视化实验室 / 系列 No.166</div>
    <h1>混沌工程<span>可视化实验室</span></h1>
    <p>主动注入故障，验证系统在真实失效条件下的韧性。从故障注入类型到爆炸半径分析，从游戏日演练到自动化实验闭环——以可视化方式拆解混沌工程的核心方法论与实践工具链。</p>
    <div class="hero-stats">
      <div class="stat"><span class="stat-v">8</span><span class="stat-l">交互模块</span></div>
      <div class="stat"><span class="stat-v">Chaos Mesh</span><span class="stat-l">主流工具</span></div>
      <div class="stat"><span class="stat-v">~30KB</span><span class="stat-l">零依赖单文件</span></div>
      <div class="stat"><span class="stat-v">SVG</span><span class="stat-l">驱动可视化</span></div>
    </div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <section class="stage" id="stage"></section>

  <footer>
    <span>TW Visualization Lab · Chaos Engineering · 2026</span>
    <span>zero-dependency · pure HTML/CSS/JS+SVG</span>
  </footer>
</main>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag,attrs={},parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}
const MODS=[
  {id:"inject",n:"01",t:"故障注入类型"},
  {id:"resil",n:"02",t:"弹性测试策略"},
  {id:"gameday",n:"03",t:"游戏日演练"},
  {id:"blast",n:"04",t:"爆炸半径分析"},
  {id:"steady",n:"05",t:"稳态指标"},
  {id:"orch",n:"06",t:"故障编排"},
  {id:"auto",n:"07",t:"自动化实验"},
  {id:"recover",n:"08",t:"恢复验证"}
];
const tabsEl=$("#tabs"),stageEl=$("#stage");
MODS.forEach((m,i)=>{
  const t=document.createElement("div");
  t.className="tab"+(i===0?" active":"");
  t.dataset.mod=m.id;
  t.innerHTML=`<span class="tn">${m.n}</span>${m.t}`;
  t.onclick=()=>switchMod(m.id);
  tabsEl.appendChild(t);
  const mod=document.createElement("section");
  mod.className="module"+(i===0?" active":"");
  mod.id="mod-"+m.id;
  stageEl.appendChild(mod);
});
let current=null,rafId=null;
function switchMod(id){
  if(current===id)return;
  if(current&&registry[current]&&registry[current].stop)registry[current].stop();
  if(rafId)cancelAnimationFrame(rafId);
  $$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.mod===id));
  $$(".module").forEach(m=>m.classList.toggle("active",m.id==="mod-"+id));
  current=id;
  if(registry[id]&&registry[id].start)registry[id].start();
}
const registry={};

// ============ Module 01: 故障注入类型 ============
registry.inject=(()=>{
  const host=$("#mod-inject");
  host.innerHTML=`
    <div class="mhead"><span class="mk">01</span><h2>故障注入类型</h2></div>
    <div class="mdesc">混沌工程主动注入网络延迟/丢包、磁盘 IO 错误、CPU 饥饿、内存占用等故障，验证系统在真实失效模式下的行为。Chaos Mesh 等工具以 CRD 形式声明故障作用域与强度。</div>
    <div class="panel">
      <div class="panel-label">故障注入矩阵 · 点击切换故障类型</div>
      <div class="svg-wrap" id="inject-svg"></div>
      <div class="ctrl" id="inject-ctrl"></div>
      <div class="kv"><span class="kv-item">当前故障 <b id="inj-type">网络延迟</b></span><span class="kv-item">强度 <b id="inj-mag">200ms</b></span><span class="kv-item">受影响 pod <b id="inj-pods">3</b></span></div>
    </div>
    <div class="note">Chaos Mesh 提供 NetworkChaos / IOChaos / StressChaos / MemoryChaos 等 CRD。故障可指定 namespace、label selector、注入比例与持续时间，精准控制"实验"的影响面。</div>`;
  const W=760,H=300;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H},$("#inject-svg"));
  const faults=[
    {id:"net",name:"网络延迟",color:"#f87171",mag:"200ms",desc:"latency"},
    {id:"disk",name:"磁盘 IO 错误",color:"#fbbf24",mag:"errno 5",desc:"io error"},
    {id:"cpu",name:"CPU 饥饿",color:"#a78bfa",mag:"80%",desc:"cpu stress"},
    {id:"mem",name:"内存占用",color:"#38bdf8",mag:"1.2GB",desc:"mem fill"}
  ];
  // topology: 6 pods in 2 rows
  const pods=[];
  for(let i=0;i<6;i++){
    const r=Math.floor(i/3),c=i%3;
    const x=420+c*110,y=60+r*90;
    const g=el("g",{transform:`translate(${x},${y})`},svg);
    el("rect",{width:90,height:60,rx:6,fill:"#161922",stroke:"#2e333f"},g);
    el("text",{x:45,y:26,fill:"#9aa1ad","font-family":"ui-monospace","font-size":11,"text-anchor":"middle"},g).textContent="pod-"+(i+1);
    el("text",{x:45,y:44,fill:"#4b5260","font-family":"ui-monospace","font-size":9,"text-anchor":"middle"},g).textContent="running";
    pods.push({g,x,y,rect:g.firstChild,infected:false});
  }
  // control panel box
  el("rect",{x:30,y:60,width:320,height:170,rx:8,fill:"#111319",stroke:"#232733"},svg);
  el("text",{x:46,y:86,fill:"#646b78","font-family":"ui-monospace","font-size":11},svg).textContent="ChaosEngine";
  let active=0,t=0;
  // build control buttons
  const ctrl=$("#inject-ctrl");
  faults.forEach((f,i)=>{
    const b=document.createElement("button");
    b.className="btn"+(i===0?" on":"");
    b.textContent=f.name;
    b.onclick=()=>{active=i;ctrl.querySelectorAll(".btn").forEach((bb,ii)=>bb.classList.toggle("on",ii===i));apply()};
    ctrl.appendChild(b);
  });
  function apply(){
    const f=faults[active];
    $("#inj-type").textContent=f.name;
    $("#inj-mag").textContent=f.mag;
    pods.forEach(p=>{p.infected=false;p.rect.setAttribute("fill","#161922");p.rect.setAttribute("stroke","#2e333f");p.g.lastChild.textContent="running";p.g.lastChild.setAttribute("fill","#4b5260")});
    const n=3;
    const idx=[0,2,4];
    idx.forEach(i=>{pods[i].infected=true;pods[i].rect.setAttribute("fill",f.color+"22");pods[i].rect.setAttribute("stroke",f.color);pods[i].g.lastChild.textContent=f.desc;pods[i].g.lastChild.setAttribute("fill",f.color)});
    $("#inj-pods").textContent=n;
    // draw CRD yaml text
    const old=svg.querySelector(".crd");if(old)old.parentNode.removeChild(old);
    const cg=el("g",{class:"crd"},svg);
    const lines=[
      "kind: "+({net:"NetworkChaos",disk:"IOChaos",cpu:"StressChaos",mem:"MemoryChaos"}[f.id]),
      "spec:",
      "  selector:",
      "    pods: {default: [pod-1,pod-3,pod-5]}",
      "  mode: all",
      "  action: "+f.desc,
      "  duration: \"60s\""
    ];
    lines.forEach((l,i)=>el("text",{x:46,y:112+i*16,fill:i===0?f.color:"#9aa1ad","font-family":"ui-monospace","font-size":10.5},cg).textContent=l);
  }
  function frame(){
    t++;
    pods.forEach(p=>{
      if(p.infected){
        const o=0.4+0.5*Math.abs(Math.sin(t*0.08));
        p.rect.setAttribute("stroke-opacity",o);
      }
    });
    if(!reduceMotion)rafId=requestAnimationFrame(frame);
  }
  apply();
  return{start(){apply();rafId=requestAnimationFrame(frame)},
    stop(){if(rafId)cancelAnimationFrame(rafId)}};
})();

// ============ Module 02: 弹性测试策略 ============
registry.resil=(()=>{
  const host=$("#mod-resil");
  host.innerHTML=`
    <div class="mhead"><span class="mk">02</span><h2>弹性测试策略</h2></div>
    <div class="mdesc">从单一故障到组合故障，从单节点到跨区域，弹性测试分层递进。通过维度雷达评估系统在延迟、降级、隔离、恢复、级联等方面的成熟度，定位薄弱环节。</div>
    <div class="panel">
      <div class="panel-label">弹性成熟度雷达 · 六维评估</div>
      <div class="svg-wrap" id="resil-svg"></div>
      <div class="legend"><span><i style="background:#8b5cf6"></i>当前评分</span><span><i style="background:#34d399"></i>目标阈值</span></div>
      <div class="kv"><span class="kv-item">综合评分 <b id="rs-score">0</b></span><span class="kv-item">最弱维度 <b id="rs-weak">—</b></span></div>
    </div>
    <div class="note">从 L0(被动响应) 到 L4(主动混沌) 共五级。雷达低于目标阈值的维度即为下一轮实验的重点注入方向，形成"测量-注入-改进"的闭环。</div>`;
  const W=760,H=300;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H},$("#resil-svg"));
  const cx=380,cy=150,R=110;
  const dims=["延迟容忍","降级能力","故障隔离","恢复速度","级联防护","可观测性"];
  const target=[4,4,4,4,3.5,4.5];
  let current=[2.5,2,3,2.5,1.5,3];
  // rings
  for(let i=1;i<=5;i++){
    el("circle",{cx,cy,r:R*i/5,fill:"none",stroke:"#232733"},svg);
  }
  // axes
  dims.forEach((d,i)=>{
    const a=-Math.PI/2+i*Math.PI/3;
    el("line",{x1:cx,y1:cy,x2:cx+R*Math.cos(a),y2:cy+R*Math.sin(a),stroke:"#232733"},svg);
    el("text",{x:cx+(R+18)*Math.cos(a),y:cy+(R+18)*Math.sin(a)+4,fill:"#9aa1ad","font-family":"ui-monospace","font-size":10.5,"text-anchor":"middle"},svg).textContent=d;
  });
  function poly(vals,color,fill){
    const old=svg.querySelector("."+fill.replace(/[#()]/g,""));
    const pts=vals.map((v,i)=>{
      const a=-Math.PI/2+i*Math.PI/3;
      return [cx+R*v/5*Math.cos(a),cy+R*v/5*Math.sin(a)];
    });
    let p=svg.querySelector("poly[data-c='"+color+"']");
    if(!p){p=el("polygon",{stroke:color,"stroke-width":1.6},svg);p.setAttribute("data-c",color)}
    p.setAttribute("points",pts.map(pt=>pt.join(",")).join(" "));
    p.setAttribute("fill",color+"22");
  }
  let t=0;
  function frame(){
    t++;
    // animate current toward random walk
    if(t%40===0){
      current=current.map((v,i)=>Math.max(1,Math.min(5,v+(Math.random()-0.5)*1.2)));
      const scores=[1.5,2.5,3.5,4.5];
      // map to target-based for clarity
    }
    poly(target,"#34d399","tgt");
    poly(current,"#8b5cf6","cur");
    const avg=current.reduce((a,b)=>a+b,0)/current.length;
    $("#rs-score").textContent=avg.toFixed(1);
    const wi=current.indexOf(Math.min(...current));
    $("#rs-weak").textContent=dims[wi];
    if(!reduceMotion)rafId=requestAnimationFrame(frame);
  }
  return{start(){t=0;rafId=requestAnimationFrame(frame)},
    stop(){if(rafId)cancelAnimationFrame(rafId)}};
})();

// ============ Module 03: 游戏日演练 ============
registry.gameday=(()=>{
  const host=$("#mod-gameday");
  host.innerHTML=`
    <div class="mhead"><span class="mk">03</span><h2>游戏日演练</h2></div>
    <div class="mdesc">Game Day 是一场受控的"消防演习"：在真实或准真实环境里执行预定义故障剧本，团队按事件响应流程协作处置。重点不是发现 bug，而是验证流程、训练肌肉记忆。</div>
    <div class="panel">
      <div class="panel-label">Game Day 演练流程</div>
      <div class="svg-wrap" id="gameday-svg"></div>
      <div class="kv"><span class="kv-item">当前阶段 <b id="gd-phase">准备</b></span><span class="kv-item">进度 <b id="gd-prog">0%</b></span></div>
    </div>
    <div class="note">典型五阶段：场景设计 → 环境准备 → 故障注入 → 观测响应 → 复盘总结。每阶段有明确退出条件；复盘产出纳入下一次 Game Day 的输入，形成持续演练节奏。</div>`;
  const W=760,H=300;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H},$("#gameday-svg"));
  const phases=["场景设计","环境准备","故障注入","观测响应","复盘总结"];
  const colors=["#38bdf8","#a78bfa","#f87171","#fbbf24","#34d399"];
  const px=60,pw=128,gap=8,py=80;
  phases.forEach((p,i)=>{
    const x=px+i*(pw+gap);
    const g=el("g",{transform:`translate(${x},${py})`},svg);
    el("rect",{width:pw,height:60,rx:6,fill:"#161922",stroke:"#2e333f"},g);
    el("text",{x:pw/2,y:24,fill:"#4b5260","font-family":"ui-monospace","font-size":10,"text-anchor":"middle"},g).textContent="0"+(i+1);
    el("text",{x:pw/2,y:44,fill:"#9aa1ad","font-family":"ui-monospace","font-size":11.5,"text-anchor":"middle"},g).textContent=p;
    if(i<phases.length-1)el("path",{d:`M ${pw} 30 L ${pw+gap} 30`,stroke:"#2e333f","marker-end":"url(#ga)"},g);
    g.setAttribute("data-i",i);
  });
  el("defs",{}).innerHTML='<marker id="ga" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e333f"/></marker>';
  // detail panel
  const dbox=el("rect",{x:60,y:170,width:640,height:90,rx:8,fill:"#111319",stroke:"#232733"},svg);
  const dtitle=el("text",{x:80,y:198,fill:"#a78bfa","font-family":"ui-monospace","font-size":12},svg);
  const ddesc=el("text",{x:80,y:222,fill:"#9aa1ad","font-family":"ui-monospace","font-size":11},svg);
  const ddesc2=el("text",{x:80,y:242,fill:"#646b78","font-family":"ui-monospace","font-size":10.5},svg);
  const details=[
    "定义故障剧本、确定爆炸半径、评估风险、获得审批",
    "搭建演练环境、部署观测面板、配置告警通道、准备记录员",
    "按剧本注入故障、模拟级联失效、记录系统与人员行为",
    "监控稳态指标、判断降级与恢复、团队协作处置事件",

      <div class="legend"><span><i style="background:#f87171"></i>故障源</span><span><i style="background:#fbbf24"></i>受影响</span><span><i style="background:#34d399"></i>已隔离</span><span><i style="background:#2e333f"></i>正常</span></div>

  const W=760,H=300;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H},$("#blast-svg"));
  const nodes=[
    {id:"gw",name:"gateway",x:80,y:150,kind:"entry"},
    {id:"auth",name:"auth",x:240,y:60},
    {id:"order",name:"order",x:240,y:150},
    {id:"pay",name:"pay",x:240,y:240},
    {id:"inv",name:"inventory",x:420,y:100},
    {id:"user",name:"user-db",x:420,y:200},
    {id:"cache",name:"redis",x:580,y:60},
    {id:"mq",name:"kafka",x:580,y:150},
    {id:"db",name:"mysql",x:580,y:240}
  ];
  const edges=[["gw","auth"],["gw","order"],["gw","pay"],["order","inv"],["order","user"],["order","mq"],["pay","mq"],["pay","db"],["inv","cache"],["user","db"]];
  const byId={};nodes.forEach(n=>byId[n.id]=n);
  edges.forEach(([a,b])=>{
    el("line",{x1:byId[a].x,y1:byId[a].y,x2:byId[b].x,y2:byId[b].y,stroke:"#2e333f","stroke-width":1.2},svg).setAttribute("data-e",a+"-"+b);
  });
  nodes.forEach(n=>{
    const g=el("g",{transform:`translate(${n.x},${n.y})`},svg);
    n.rect=el("rect",{x:-42,y:-18,width:84,height:36,rx:5,fill:"#161922",stroke:"#2e333f"},g);
    n.label=el("text",{y:5,fill:"#9aa1ad","font-family":"ui-monospace","font-size":11,"text-anchor":"middle"},g);
    n.label.textContent=n.name;
    n.g=g;
  });
  let t=0,source="order";
  function spread(){
    // BFS layers from source
    const layers=[[source]];
    const seen=new Set([source]);
    while(true){
      const next=[];
      layers[layers.length-1].forEach(id=>{
        edges.forEach(([a,b])=>{
          const o=a===id?b:(b===id?a:null);
          if(o&&!seen.has(o)){seen.add(o);next.push(o)}
        });
      });
      if(!next.length)break;
      layers.push(next);
    }
    return layers;
  }
  let layers=spread(),aff=0,iso=0;
  function reset(){
    nodes.forEach(n=>{n.rect.setAttribute("fill","#161922");n.rect.setAttribute("stroke","#2e333f");n.label.setAttribute("fill","#9aa1ad")});

  }
  function frame(){
    t++;
    const step=Math.floor(t/40)%(layers.length+2);
    reset();
    if(step<layers.length){
      layers.slice(0,step+1).forEach((ly,li)=>{
        ly.forEach(id=>{
          const n=byId[id];
          if(id===source){n.rect.setAttribute("fill","#f8717122");n.rect.setAttribute("stroke","#f87171");n.label.setAttribute("fill","#f87171")}

            n.rect.setAttribute("fill","#34d39922");n.rect.setAttribute("stroke","#34d399");n.label.setAttribute("fill","#34d399");iso++;
          }else{
            n.rect.setAttribute("fill","#fbbf2422");n.rect.setAttribute("stroke","#fbbf24");n.label.setAttribute("fill","#fbbf24");aff++;
          }
        });
      });
    }
    $("#bl-aff").textContent=aff;
    $("#bl-iso").textContent=iso;
    $("#bl-rad").textContent=aff>3?"大":aff>1?"中":"小";
    if(!reduceMotion)rafId=requestAnimationFrame(frame);
  }
  return{start(){t=0;layers=spread();rafId=requestAnimationFrame(frame)},
    stop(){if(rafId)cancelAnimationFrame(rafId)}};
})();

    pts.push([x,y]);
  }
  el("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",stroke:"#8b5cf6","stroke-width":2},svg);
  // markers
  el("circle",{cx:cx+0.2*cw,cy:cy+ch*0.8,r:4,fill:"#f87171"},svg);
  el("text",{x:cx+0.2*cw+8,y:cy+ch*0.8-6,fill:"#f87171","font-family":"ui-monospace","font-size":9},svg).textContent="inject";
  el("circle",{cx:cx+0.45*cw,cy:cy+ch*0.3,r:4,fill:"#fbbf24"},svg);
  el("text",{x:cx+0.45*cw+8,y:cy+ch*0.3-6,fill:"#fbbf24","font-family":"ui-monospace","font-size":9},svg).textContent="heal trigger";
  el("circle",{cx:cx+0.7*cw,cy:cy+ch*0.8,r:4,fill:"#34d399"},svg);
  el("text",{x:cx+0.7*cw+8,y:cy+ch*0.8-6,fill:"#34d399","font-family":"ui-monospace","font-size":9},svg).textContent="recovered";
  // moving pulse
  const pulse=el("circle",{r:5,fill:"#8b5cf6"},svg);
  let t=0;
  function frame(){
    t++;
    const p=(t%200)/200;
    const idx=Math.floor(p*68);
    const pt=pts[idx]||pts[0];
    pulse.setAttribute("cx",pt[0]);pulse.setAttribute("cy",pt[1]);
    $("#rc-mttd").textContent="8s";
    $("#rc-mttr").textContent="42s";
    $("#rc-cons").textContent="OK";
    if(!reduceMotion)rafId=requestAnimationFrame(frame);
  }
  return{start(){t=0;rafId=requestAnimationFrame(frame)},
    stop(){if(rafId)cancelAnimationFrame(rafId)}};
})();

switchMod("inject");
</script>
</body>
</html>
