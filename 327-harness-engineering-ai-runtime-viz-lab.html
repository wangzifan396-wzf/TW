<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW · 驾驭工程与AI运行框架可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;
  --bg-panel:#101218;
  --bg-card:#161922;
  --bg-hover:#1c1f28;
  --border:#232734;
  --border-strong:#2d3344;
  --text:#e6e8ee;
  --text-dim:#9aa0b0;
  --text-faint:#62697b;
  --teal:#00d4aa;
  --teal-dim:rgba(0,212,170,.14);
  --teal-soft:rgba(0,212,170,.08);
  --warn:#f59e0b;
  --err:#ef4444;
  --blue:#38bdf8;
  --purple:#a78bfa;
  --rose:#fb7185;
  --orange:#ff9f43;
  --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:
    linear-gradient(rgba(0,212,170,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,170,.02) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4154}

.sticky-header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,11,15,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.sticky-header h1{
  font-size:17px;font-weight:600;
  color:var(--teal);letter-spacing:1.2px;
}
.header-right{display:flex;align-items:center;gap:14px}
.header-badge{
  font-size:10px;color:var(--teal);
  border:1px solid var(--teal-dim);
  background:var(--teal-soft);
  padding:3px 8px;border-radius:3px;
  letter-spacing:.5px;font-family:var(--mono);
  text-transform:uppercase;
}
#status{
  font-size:12px;color:var(--text-dim);
  font-family:var(--mono);min-width:140px;text-align:right;
}

#nav{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:10px 24px;
  background:var(--bg-panel);
  border-bottom:1px solid var(--border);
  position:sticky;top:52px;z-index:99;
}
.nav-btn{
  padding:7px 14px;
  background:var(--bg-card);
  border:1px solid var(--border);
  color:var(--text-dim);
  cursor:pointer;font-size:12px;
  border-radius:4px;
  transition:all .25s ease;
  font-family:inherit;white-space:nowrap;
}
.nav-btn:hover{border-color:var(--teal);color:var(--text);background:var(--bg-hover)}
.nav-btn.active{
  background:var(--teal-soft);
  border-color:var(--teal);
  color:var(--teal);
  box-shadow:0 0 10px var(--teal-dim);
}

#main{padding:20px 24px 60px;max-width:1400px;margin:0 auto}

.module{display:none}
.module.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.m-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.m-head .num{
  font-family:var(--mono);font-size:11px;
  color:var(--teal);background:var(--teal-soft);
  border:1px solid var(--teal-dim);
  padding:2px 7px;border-radius:4px;
}
.m-head h2{font-size:19px;font-weight:650}
.m-desc{color:var(--text-dim);font-size:13px;margin-bottom:16px;max-width:800px;line-height:1.6}

.module-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.view-btn{
  padding:6px 14px;background:transparent;
  border:1px solid var(--border-strong);
  color:var(--text-dim);cursor:pointer;
  font-size:12px;border-radius:4px;
  transition:all .2s ease;font-family:inherit;
}
.view-btn:hover{border-color:var(--teal);color:var(--text)}
.view-btn.active{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:600}

.svg-wrap{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:10px;padding:20px;
  overflow-x:auto;position:relative;
}
.svg-wrap svg{display:block;margin:0 auto}
.svg-wrap svg text{font-family:var(--sans)}

.info-panel{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;
}
.info-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:8px;padding:12px 14px;
  transition:border-color .25s;
}
.info-card:hover{border-color:var(--teal-dim)}
.info-card .k{
  font-size:10px;color:var(--teal);
  text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:5px;font-family:var(--mono);
}
.info-card .v{font-size:13px;color:var(--text);line-height:1.5}

@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes dash30{to{stroke-dashoffset:-30}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #00d4aa)}50%{filter:drop-shadow(0 0 8px #00d4aa)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes flowDot{0%{offset-distance:0%}100%{offset-distance:100%}}

@media(max-width:720px){
  .sticky-header h1{font-size:14px}
  #nav{position:static;top:auto;padding:8px 12px}
  .nav-btn{font-size:11px;padding:6px 10px}
  #main{padding:14px 12px 40px}
  .m-head h2{font-size:16px}
  .svg-wrap{padding:10px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="sticky-header">
  <h1>驾驭工程与AI运行框架可视化实验室</h1>
  <div class="header-right">
    <span class="header-badge">TENCENT 2026 AI趋势</span>
    <span id="status">就绪</span>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault();}},true);

/* ================================================================
   工具函数（必须完全一致的指定模式）
   ================================================================ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ================================================================
   颜色常量
   ================================================================ */
var AC='#00d4aa',INFO='#38bdf8',PUR='#a78bfa',WARN='#f59e0b',ERR='#ef4444',ROSE='#fb7185',DIM='#62697b',BD='#2d3344',BG='#161922',ORG='#ff9f43',TEAL_D='#008f72';

/* ================================================================
   辅助函数
   ================================================================ */
function toggleView(svg, viewName) {
  var groups = svg.querySelectorAll('g[data-view]');
  for (var i = 0; i < groups.length; i++) {
    if (groups[i].getAttribute('data-view') === viewName) {
      groups[i].setAttribute('style', '');
    } else {
      groups[i].setAttribute('style', 'display:none');
    }
  }
}
function updateViewButtons(moduleId, viewName) {
  var controls = document.getElementById(moduleId + '-controls');
  if (!controls) return;
  var btns = controls.querySelectorAll('.view-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('data-view') === viewName) {
      btns[i].classList.add('active');
    } else {
      btns[i].classList.remove('active');
    }
  }
}
function arrow(parent, x1, y1, x2, y2, color) {
  var c = color || BD;
  el('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, 'stroke-width': 1.5 }, parent);
  var a = Math.atan2(y2 - y1, x2 - x1);
  var h = 6;
  var p2x = (x2 - h * Math.cos(a - 0.4)).toFixed(1);
  var p2y = (y2 - h * Math.sin(a - 0.4)).toFixed(1);
  var p3x = (x2 - h * Math.cos(a + 0.4)).toFixed(1);
  var p3y = (y2 - h * Math.sin(a + 0.4)).toFixed(1);
  el('polygon', { points: x2 + ',' + y2 + ' ' + p2x + ',' + p2y + ' ' + p3x + ',' + p3y, fill: c }, parent);
}
function boxLabel(parent, x, y, w, h, label, color, fill, fs) {
  el('rect', { x: x, y: y, width: w, height: h, rx: 6, fill: fill || BG, stroke: color || BD, 'stroke-width': 1.5 }, parent);
  tspanEl(x + w / 2, y + h / 2 + 5, label, parent, { 'text-anchor': 'middle', fill: color || '#e6e8ee', 'font-size': fs || 13, 'font-weight': 600 });
}
function mkMarker(svg, id, color) {
  var defs = svg.querySelector('defs') || el('defs', {}, svg);
  var mk = el('marker', { id: id, markerWidth: 10, markerHeight: 10, refX: 8, refY: 3, orient: 'auto' }, defs);
  el('path', { d: 'M0,0 L0,6 L9,3 z', fill: color || AC }, mk);
}

/* ================================================================
   M1 · 驾驭工程全景
   ================================================================ */
function m1Draw() {
  var stage = document.getElementById('m1-stage');
  clearNode(stage);
  var svg = el('svg', { width: 920, height: 480, viewBox: '0 0 920 480' }, stage);
  mkMarker(svg, 'm1-arr', AC);

  /* --- 时间线视图 --- */
  var gTL = el('g', { 'data-view': 'timeline' }, svg);
  tspanEl(460, 35, 'AI竞争前沿演进路线', gTL, { 'text-anchor': 'middle', fill: AC, 'font-size': 18, 'font-weight': 'bold' });

  el('line', { x1: 100, y1: 220, x2: 820, y2: 220, stroke: BD, 'stroke-width': 2 }, gTL);
  var fl = el('line', { x1: 100, y1: 220, x2: 820, y2: 220, stroke: AC, 'stroke-width': 2, 'stroke-dasharray': '8 4', opacity: 0.5 }, gTL);
  fl.style.animation = 'dash 1s linear infinite';

  var stages = [
    { x: 170, year: '2024', title: '提示词工程', desc: '优化输入指令', color: INFO, items: ['单轮指令', '人工模板'] },
    { x: 460, year: '2025', title: '上下文工程', desc: '管理对话上下文', color: PUR, items: ['多轮对话', 'RAG增强'] },
    { x: 750, year: '2026', title: '驾驭工程', desc: '掌控运行框架', color: AC, items: ['全框架掌控', '多Agent编排'] }
  ];
  for (var i = 0; i < stages.length; i++) {
    var s = stages[i];
    var ring = el('circle', { cx: s.x, cy: 220, r: 32, fill: 'none', stroke: s.color, 'stroke-width': 2 }, gTL);
    if (i === 2) ring.style.animation = 'glow 2s ease-in-out infinite';
    el('circle', { cx: s.x, cy: 220, r: 14, fill: s.color, opacity: 0.2 }, gTL);
    tspanEl(s.x, 225, s.year, gTL, { 'text-anchor': 'middle', fill: s.color, 'font-size': 14, 'font-weight': 'bold' });
    tspanEl(s.x, 165, s.title, gTL, { 'text-anchor': 'middle', fill: '#e6e8ee', 'font-size': 16, 'font-weight': 'bold' });
    tspanEl(s.x, 285, s.desc, gTL, { 'text-anchor': 'middle', fill: DIM, 'font-size': 12 });
    for (var j = 0; j < s.items.length; j++) {
      tspanEl(s.x, 310 + j * 20, '\u00B7 ' + s.items[j], gTL, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11 });
    }
    if (i < stages.length - 1) {
      el('line', { x1: s.x + 38, y1: 220, x2: stages[i + 1].x - 38, y2: 220, stroke: s.color, 'stroke-width': 1.5, 'marker-end': 'url(#m1-arr)', opacity: 0.7 }, gTL);
    }
  }

  el('rect', { x: 120, y: 370, width: 680, height: 80, rx: 8, fill: 'none', stroke: BD, 'stroke-width': 1, 'stroke-dasharray': '4 4' }, gTL);
  tspanEl(460, 395, '竞争焦点转移', gTL, { 'text-anchor': 'middle', fill: AC, 'font-size': 13, 'font-weight': 'bold' });
  el('rect', { x: 150, y: 410, width: 120, height: 28, rx: 4, fill: '#1a1520', stroke: ERR, 'stroke-width': 1 }, gTL);
  tspanEl(210, 428, '模型内部', gTL, { 'text-anchor': 'middle', fill: ERR, 'font-size': 12 });
  el('line', { x1: 290, y1: 424, x2: 380, y2: 424, stroke: AC, 'stroke-width': 2, 'marker-end': 'url(#m1-arr)' }, gTL);
  el('rect', { x: 400, y: 410, width: 180, height: 28, rx: 4, fill: '#0a1f1a', stroke: AC, 'stroke-width': 1 }, gTL);
  tspanEl(490, 428, '外部运行框架', gTL, { 'text-anchor': 'middle', fill: AC, 'font-size': 12, 'font-weight': 'bold' });
  tspanEl(640, 428, '竞争前沿外移', gTL, { fill: DIM, 'font-size': 11 });

  /* --- 对比视图 --- */
  var gCmp = el('g', { 'data-view': 'compare', style: 'display:none' }, svg);
  tspanEl(460, 35, '三阶段能力对比', gCmp, { 'text-anchor': 'middle', fill: AC, 'font-size': 18, 'font-weight': 'bold' });
  var cols = [
    { x: 40, title: '提示词工程', year: '2024', color: INFO, items: ['单轮指令优化', '人工设计模板', '无状态管理', '模型能力固定', '错误人工修正'] },
    { x: 330, title: '上下文工程', year: '2025', color: PUR, items: ['多轮对话管理', 'RAG检索增强', '短期记忆窗口', '动态上下文组装', '部分自动纠错'] },
    { x: 620, title: '驾驭工程', year: '2026', color: AC, items: ['全运行框架掌控', '多Agent编排', '持久记忆系统', '实时评估纠偏', '自主错误恢复'] }
  ];
  for (var ci = 0; ci < cols.length; ci++) {
    var c = cols[ci];
    el('rect', { x: c.x, y: 60, width: 250, height: 390, rx: 8, fill: BG, stroke: c.color, 'stroke-width': 1.5 }, gCmp);
    el('rect', { x: c.x, y: 60, width: 250, height: 50, rx: 8, fill: c.color, opacity: 0.1 }, gCmp);
    tspanEl(c.x + 125, 85, c.title, gCmp, { 'text-anchor': 'middle', fill: c.color, 'font-size': 15, 'font-weight': 'bold' });
    tspanEl(c.x + 125, 102, c.year, gCmp, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11 });
    el('line', { x1: c.x + 15, y1: 120, x2: c.x + 235, y2: 120, stroke: c.color, 'stroke-width': 1, opacity: 0.3 }, gCmp);
    for (var ii = 0; ii < c.items.length; ii++) {
      var yy = 150 + ii * 55;
      el('circle', { cx: c.x + 25, cy: yy, r: 4, fill: c.color }, gCmp);
      tspanEl(c.x + 40, yy + 5, c.items[ii], gCmp, { fill: '#e6e8ee', 'font-size': 12 });
      el('rect', { x: c.x + 200, y: yy - 6, width: 12, height: 12, rx: 2, fill: 'none', stroke: c.color, 'stroke-width': 1 }, gCmp);
      el('circle', { cx: c.x + 206, cy: yy, r: 3, fill: c.color }, gCmp);
    }
  }

  m1View('timeline');
}
function m1View(v) {
  var svg = document.querySelector('#m1-stage svg');
  if (!svg) return;
  toggleView(svg, v);
  updateViewButtons('m1', v);
  setStatText(document.getElementById('status'), 'M1 视图: ' + v);
}

/* ================================================================
   M2 · 外部运行容器
   ================================================================ */
function m2Draw() {
  var stage = document.getElementById('m2-stage');
  clearNode(stage);
  var svg = el('svg', { width: 920, height: 480, viewBox: '0 0 920 480' }, stage);
  mkMarker(svg, 'm2-arr', AC);
  mkMarker(svg, 'm2-arr-d', DIM);

  /* --- 架构视图 --- */
  var gArch = el('g', { 'data-view': 'arch' }, svg);
  tspanEl(460, 35, '模型外部运行容器架构', gArch, { 'text-anchor': 'middle', fill: AC, 'font-size': 18, 'font-weight': 'bold' });

  // Model box (top)
  boxLabel(gArch, 340, 60, 240, 50, '大语言模型 (LLM)', INFO, '#0d1520', 14);
  tspanEl(460, 82, '推理引擎 · 生成核心', gArch, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11 });

  arrow(gArch, 460, 112, 460, 140, AC);

  // Container outer box
  el('rect', { x: 80, y: 140, width: 760, height: 240, rx: 10, fill: '#0d1018', stroke: AC, 'stroke-width': 2, 'stroke-dasharray': '6 3' }, gArch);
  tspanEl(100, 160, 'EXTERNAL RUNTIME CONTAINER', gArch, { fill: AC, 'font-size': 10, 'font-family': 'var(--mono)', 'letter-spacing': '1px' });

  // Four components
  var comps = [
    { x: 110, y: 180, w: 160, h: 80, label: '记忆管理', sub: 'Memory', color: INFO },
    { x: 290, y: 180, w: 160, h: 80, label: '工具调用', sub: 'Tools', color: PUR },
    { x: 470, y: 180, w: 160, h: 80, label: '任务规划', sub: 'Planning', color: AC },
    { x: 650, y: 180, w: 160, h: 80, label: '错误恢复', sub: 'Recovery', color: WARN }
  ];
  for (var i = 0; i < comps.length; i++) {
    var c = comps[i];
    el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, rx: 8, fill: BG, stroke: c.color, 'stroke-width': 1.5 }, gArch);
    tspanEl(c.x + c.w / 2, c.y + 32, c.label, gArch, { 'text-anchor': 'middle', fill: c.color, 'font-size': 14, 'font-weight': 'bold' });
    tspanEl(c.x + c.w / 2, c.y + 54, c.sub, gArch, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11, 'font-family': 'var(--mono)' });
    var dot = el('circle', { cx: c.x + c.w - 12, cy: c.y + 12, r: 3, fill: c.color }, gArch);
    dot.style.animation = 'pulse 2s ease-in-out infinite';
  }

  // Connection lines between components
  for (var k = 0; k < comps.length - 1; k++) {
    var ln = el('line', { x1: comps[k].x + comps[k].w, y1: comps[k].y + comps[k].h / 2, x2: comps[k + 1].x, y2: comps[k + 1].y + comps[k + 1].h / 2, stroke: BD, 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, gArch);
    ln.style.animation = 'dash 2s linear infinite';
  }

  // Internal bus
  el('line', { x1: 110, y1: 300, x2: 810, y2: 300, stroke: AC, 'stroke-width': 1, opacity: 0.3 }, gArch);
  tspanEl(460, 320, '内部消息总线 (Message Bus)', gArch, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11 });

  // Sandbox / isolation layer
  el('rect', { x: 110, y: 340, width: 700, height: 28, rx: 4, fill: '#0d1520', stroke: BD, 'stroke-width': 1 }, gArch);
  tspanEl(460, 358, '沙箱隔离层 \u00B7 资源限制 \u00B7 权限控制', gArch, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11 });

  // External world (bottom)
  arrow(gArch, 460, 380, 460, 410, AC);
  el('rect', { x: 260, y: 410, width: 400, height: 50, rx: 8, fill: '#1a1015', stroke: ROSE, 'stroke-width': 1.5 }, gArch);
  tspanEl(460, 432, '外部环境', gArch, { 'text-anchor': 'middle', fill: ROSE, 'font-size': 13, 'font-weight': 'bold' });
  tspanEl(460, 450, 'API \u00B7 数据库 \u00B7 文件系统 \u00B7 网络', gArch, { 'text-anchor': 'middle', fill: DIM, 'font-size': 11 });

  /* --- 数据流视图 --- */
  var gFlow = el('g', { 'data-view': 'flow', style: 'display:none' }, svg);
  tspanEl(460, 35, '运行容器数据流', gFlow, { 'text-anchor': 'middle', fill: AC, 'font-size': 18, 'font-weight': 'bold' });

  var steps = [
    { x: 80, label: '用户请求', color: ROSE },
    { x: 240, label: '任务规划', color: AC },
    { x: 400, label: '工具调用', color: PUR },
    { x: 560, label: '记忆检索', color: INFO },
    { x: 720, label: '错误检查', color: WARN },
    { x: 820, label: '返回结果', color: AC }
  ];
  for (var si = 0; si < steps.length; si++) {
    var st = steps[si];
    if (si < steps.length - 1) {
      var path = el('line', { x1: st.x + 50, y1: 220, x2: steps[si + 1].x, y2: 220, stroke: st.color, 'stroke-width': 2, 'stroke-dasharray': '6 3' }, gFlow);
      path.style.animation = 'dash 1.5s linear infinite';
    }

/* ================================================================
   switchModule — 模块切换
   ================================================================ */
function switchModule(id) {
  var navBtns = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < navBtns.length; i++) {
    if (navBtns[i].getAttribute('data-module') === id) {
      navBtns[i].classList.add('active');
    } else {
      navBtns[i].classList.remove('active');
    }
  }
  var modules = document.querySelectorAll('.module');
  for (var j = 0; j < modules.length; j++) {
    if (modules[j].id === 'module-' + id) {
      modules[j].classList.add('active');
    } else {
      modules[j].classList.remove('active');
    }
  }
  for (var k = 0; k < MODULES.length; k++) {
    if (MODULES[k].id === id) {
      MODULES[k].draw();
      setStatText(document.getElementById('status'), '当前模块: ' + MODULES[k].name);
      break;
    }
  }
}

/* ================================================================
   buildNav IIFE — 构建导航与模块容器
   ================================================================ */
(function buildNav() {
  var nav = document.getElementById('nav');
  var main = document.getElementById('main');

  for (var i = 0; i < MODULES.length; i++) {
    var mod = MODULES[i];

    /* Nav button */
    (function(m) {
      var btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.textContent = m.title;
      btn.setAttribute('data-module', m.id);
      btn.addEventListener('click', function() { switchModule(m.id); });
      nav.appendChild(btn);
    })(mod);

    /* Module container */
    var div = document.createElement('section');
    div.className = 'module';
    div.id = 'module-' + mod.id;

    /* Header */
    var head = document.createElement('div');
    head.className = 'm-head';
    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1).padStart(2, '0');
    head.appendChild(num);
    var h2 = document.createElement('h2');
    h2.textContent = mod.name;
    head.appendChild(h2);
    div.appendChild(head);

    var desc = document.createElement('p');
    desc.className = 'm-desc';
    desc.textContent = mod.desc;
    div.appendChild(desc);

    /* Controls */
    var controls = document.createElement('div');
    controls.className = 'module-controls';
    controls.id = mod.id + '-controls';
    for (var vi = 0; vi < mod.views.length; vi++) {
      (function(m, vw, idx) {
        var vb = document.createElement('button');
        vb.className = 'view-btn' + (idx === 0 ? ' active' : '');
        vb.textContent = vw.name;
        vb.setAttribute('data-view', vw.id);
        vb.addEventListener('click', function() { m.view(vw.id); });
        controls.appendChild(vb);
      })(mod, mod.views[vi], vi);
    }
    div.appendChild(controls);

    /* SVG wrap */
    var svgWrap = document.createElement('div');
    svgWrap.className = 'svg-wrap';
    var stage = document.createElement('div');
    stage.id = mod.id + '-stage';
    svgWrap.appendChild(stage);
    div.appendChild(svgWrap);

    /* Info panel */
    var infoPanel = document.createElement('div');
    infoPanel.className = 'info-panel';
    for (var ii = 0; ii < mod.info.length; ii++) {
      var card = document.createElement('div');
      card.className = 'info-card';
      var lk = document.createElement('div');
      lk.className = 'k';
      lk.textContent = mod.info[ii].k;
      card.appendChild(lk);
      var lv = document.createElement('div');
      lv.className = 'v';
      lv.textContent = mod.info[ii].v;
      card.appendChild(lv);
      infoPanel.appendChild(card);
    }
    div.appendChild(infoPanel);

    main.appendChild(div);
  }

  /* Initialize first module */
  switchModule(MODULES[0].id);
})();
</script>
