<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW · 超节点算力基础设施与AI工厂可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f; --bg-2:#0f1117; --bg-3:#161922; --bg-4:#1c2030;
  --border:#1e2433; --border-2:#2a3144;
  --text:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
  --teal:#00d4aa; --teal-dim:rgba(0,212,170,.16); --teal-soft:rgba(0,212,170,.08); --teal-glow:rgba(0,212,170,.35);
  --cyan:#22d3ee; --amber:#fbbf24; --red:#ef4444; --purple:#a78bfa; --blue:#3b82f6; --pink:#f472b6; --green:#34d399;
  --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.app-header{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;height:54px;padding:0 20px}
.hub-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);padding:6px 12px;border:1px solid var(--border);border-radius:6px;transition:.2s;white-space:nowrap}
.hub-link:hover{color:var(--teal);border-color:var(--teal)}
.header-title{font-size:14px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-title .sep{color:var(--text-3);margin:0 8px}
.header-title .ac{color:var(--teal)}
.header-badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:3px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.module-nav{position:sticky;top:54px;z-index:40;background:rgba(10,11,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px}
.nav-btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 13px;cursor:pointer;transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav-btn .nidx{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.nav-btn:hover{color:var(--text);background:var(--bg-3)}
.nav-btn.active{color:var(--teal);background:var(--teal-soft);border-color:var(--teal-dim);font-weight:600}
.nav-btn.active .nidx{color:var(--teal)}
.lab-main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.lab-hero{margin-bottom:24px}
.lab-hero .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:3px 9px;border-radius:4px;margin-bottom:14px;text-transform:uppercase}
.lab-hero h1{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.22;margin-bottom:10px}
.lab-hero h1 .grad{background:linear-gradient(120deg,var(--teal),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lab-hero p{color:var(--text-2);font-size:14px;max-width:820px;line-height:1.65}
.hero-ctrl{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.module-panel{display:none}
.module-panel.active{display:block;animation:mFade .4s ease}
@keyframes mFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.m-head .num{font-family:var(--mono);font-size:12px;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:2px 8px;border-radius:4px}
.m-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.m-head .sub{font-size:12px;color:var(--text-3);font-family:var(--mono)}
.m-desc{color:var(--text-2);font-size:13px;margin-bottom:16px;max-width:840px;line-height:1.6}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text);background:var(--bg-3);border:1px solid var(--border-2);border-radius:7px;padding:8px 15px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.active{background:var(--teal-soft);border-color:var(--teal-dim);color:var(--teal);font-weight:600}
.viz-wrap{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;overflow:hidden;position:relative}
.viz-wrap svg{display:block;width:100%;height:auto}
.status-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat-pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg-3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px}
.stat-pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat-pill .label{color:var(--text-3);font-size:11px}
.stat-pill .val{color:var(--text);font-weight:600;font-family:var(--mono)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.info-card{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:15px;transition:.2s}
.info-card:hover{border-color:var(--teal-dim)}
.info-card .k{font-family:var(--mono);font-size:10.5px;color:var(--teal);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.info-card .v{font-size:13.5px;color:var(--text);font-weight:600;margin-bottom:4px}
.info-card .d{font-size:12px;color:var(--text-3);line-height:1.55}
.legend-row{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text-2);margin-top:10px;font-family:var(--mono)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{fill:var(--text);font-family:var(--sans)}
svg .lbl{font-size:11px;fill:var(--text-2)}
svg .dim{fill:var(--text-3)}
svg .mono{font-family:var(--mono)}
svg .ttl{font-size:13px;font-weight:600;fill:var(--text)}
svg .sub{font-size:10.5px;fill:var(--text-3)}
svg .flow-rect{transition:.25s}
svg .flow-rect:hover{stroke-width:2.2}
.apulse{animation:apulse 1.6s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}
.aglow{animation:aglow 2s ease-in-out infinite}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 1px var(--teal))}50%{filter:drop-shadow(0 0 7px var(--teal))}}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.2s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aslide{animation:aslide 2s ease-in-out infinite alternate}
@keyframes aslide{from{transform:translateX(0)}to{transform:translateX(8px)}}
.aspin{transform-origin:center;transform-box:fill-box;animation:aspin 8s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
body.paused *{animation-play-state:paused!important}
@media (max-width:760px){.header-title{font-size:12px}.lab-hero h1{font-size:21px}.nav-btn{font-size:11px;padding:6px 9px}.nav-btn .nidx{display:none}.info-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="app-header"><div class="header-inner"><a href="index.html" class="hub-link">&#8592; TW Hub</a><span class="header-title">TW<span class="sep">/</span><span class="ac">超节点算力基础设施与AI工厂可视化实验室</span></span><span class="header-badge">VIZ LAB / 352</span></div></header>
<nav class="module-nav"><div class="nav-inner" id="nav-inner"></div></nav>
<main class="lab-main">
<div class="lab-hero"><span class="tag">SUPER NODE / AI FACTORY</span><h1>超节点算力基础设施与 <span class="grad">AI工厂</span> 可视化实验室</h1><p>从IDC到AIDC，从单卡到超节点集群——系统解构AI时代的算力基础设施。覆盖NPO光互连、Token工厂、液冷能效、算电协同、国产算力生态、云边端协同与未来计算前沿，呈现AI工厂从算力底座到智能产出的完整技术图谱。</p><div class="hero-ctrl"><button class="btn" id="anim-toggle" onclick="toggleAnim()">暂停动画</button><span class="stat-pill"><span class="dot" style="background:var(--teal)"></span><span class="label">模块</span><span class="val">8</span></span><span class="stat-pill"><span class="dot" style="background:var(--cyan)"></span><span class="label">视图</span><span class="val">24</span></span><span class="stat-pill"><span class="dot" style="background:var(--purple)"></span><span class="label">主题</span><span class="val">超节点算力</span></span></div></div>
<div id="module-stage"></div>
</main>
<script>
/* ===== 颜色常量 ===== */
var C={
  bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',
  border:'#1e2433',border2:'#2a3144',
  text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',
  teal:'#00d4aa',tealDim:'rgba(0,212,170,.16)',tealSoft:'rgba(0,212,170,.08)',
  cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',
  mono:"'SF Mono','JetBrains Mono',Consolas,monospace"
};
var SVGNS='http://www.w3.org/2000/svg';

/* ===== 工具函数 ===== */
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}
function el(tag,attrs,parent){
  var e=document.createElementNS(SVGNS,tag);
  if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}
function tspanEl(parent,s,o){
  o=o||{};var t=el('tspan',o,parent);t.textContent=s;return t;
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){el('line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1},g);}
  for(var y=0;y<=h;y+=45){el('line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1},g);}
  el('rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4},g);
}
function box(g,x,y,w,h,o){
  o=o||{};
  var r=el('rect',{x:x,y:y,width:w,height:h,rx:o.rx||7,fill:o.fill||C.bg3,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3},g);
  if(o.cls)r.setAttribute('class',o.cls);
  return r;
}
function lbox(g,x,y,w,h,title,sub,o){
  o=o||{};box(g,x,y,w,h,o);
  if(o.top){
    txt(g,o.left?x+14:x+w/2,y+22,title,{f:o.tf||C.text,s:o.ts||13,w:600,a:o.left?'start':'middle'});
    if(sub)txt(g,o.left?x+14:x+w/2,y+40,sub,{f:o.sf||C.text3,s:10.5,a:o.left?'start':'middle'});
  }else{
    txt(g,x+w/2,y+h/2+(sub?-6:4),title,{f:o.tf||C.text,s:o.ts||13,w:600});
    if(sub)txt(g,x+w/2,y+h/2+14,sub,{f:o.sf||C.text3,s:10.5});
  }
}
function txt(g,x,y,s,o){
  o=o||{};
  var t=el('text',{x:x,y:y,'text-anchor':o.a||'middle',fill:o.f||C.text,'font-size':o.s||11,'font-weight':o.w||400},g);
  if(o.mono)t.setAttribute('font-family',C.mono);
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,o){
  o=o||{};
  return el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.4,'stroke-dasharray':o.dash||'none',class:o.cls||''},g);
}
function arrow(g,x1,y1,x2,y2,o){
  o=o||{};
  var col=o.stroke||C.text2;var sw=o.sw||1.5;
  el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':sw,'stroke-dasharray':o.dash||'none',class:o.cls||'','marker-end':o.marker?('url(#'+o.marker+')'):''},g);
  if(!o.marker){
    var ang=Math.atan2(y2-y1,x2-x1);var ah=o.ah||7;
    el('polygon',{points:x2+','+y2+' '+(x2-ah*Math.cos(ang-0.42))+','+(y2-ah*Math.sin(ang-0.42))+' '+(x2-ah*Math.cos(ang+0.42))+','+(y2-ah*Math.sin(ang+0.42)),fill:col},g);
  }
}
function circ(g,cx,cy,r,o){
  o=o||{};
  return el('circle',{cx:cx,cy:cy,r:r,fill:o.fill||C.tealSoft,stroke:o.stroke||C.teal,'stroke-width':o.sw||1.5,class:o.cls||''},g);
}
function poly(g,pts,o){
  o=o||{};
  return el('polygon',{points:pts.join(' '),fill:o.fill||'none',stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3,class:o.cls||''},g);
}
function bar(g,x,y,w,h,col,cls){
  el('rect',{x:x,y:y,width:w,height:Math.max(2,h),fill:col+'33',stroke:col,'stroke-width':1.5,rx:3},g);
  el('rect',{x:x,y:y,width:w,height:Math.max(2,Math.min(6,h)),fill:col,class:cls||'apulse'},g);
}

/* ===== HTML 容器填充 ===== */
function setStatText(id,arr){
  var c=$(id);clearNode(c);
  arr.forEach(function(p){
    var s=document.createElement('span');s.className='stat-pill';
    var d=document.createElement('span');d.className='dot';d.style.background=p.c||C.teal;
    var l=document.createElement('span');l.className='label';l.textContent=p.k;
    var vv=document.createElement('span');vv.className='val';vv.textContent=p.v;
    s.appendChild(d);s.appendChild(l);s.appendChild(vv);c.appendChild(s);
  });
}
function setLegend(id,arr){
  var c=$(id);clearNode(c);
  arr.forEach(function(p){
    var s=document.createElement('span');
    var i=document.createElement('i');i.style.background=p.c;
    s.appendChild(i);s.appendChild(document.createTextNode(p.t));c.appendChild(s);
  });
}
function setInfo(id,arr){
  var c=$(id);clearNode(c);
  arr.forEach(function(p){
    var d=document.createElement('div');d.className='info-card';
    var k=document.createElement('div');k.className='k';k.textContent=p.k;
    var v=document.createElement('div');v.className='v';v.textContent=p.v;
    var de=document.createElement('div');de.className='d';de.textContent=p.d;
    d.appendChild(k);d.appendChild(v);d.appendChild(de);c.appendChild(d);
  });
}

/* ===== 标记 / 渐变 / 动画 ===== */
function mkMarker(defs,id,color){
  var m=el('marker',{id:id,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:color},m);
  return m;
}
function addDefs(svg){
  var defs=el('defs',{},svg);
  mkMarker(defs,'ar-teal',C.teal);mkMarker(defs,'ar-cyan',C.cyan);mkMarker(defs,'ar-blue',C.blue);
  mkMarker(defs,'ar-purple',C.purple);mkMarker(defs,'ar-amber',C.amber);mkMarker(defs,'ar-green',C.green);
  mkMarker(defs,'ar-red',C.red);mkMarker(defs,'ar-pink',C.pink);mkMarker(defs,'ar-gray',C.text3);
  var cols={teal:C.teal,cyan:C.cyan,blue:C.blue,purple:C.purple,amber:C.amber,green:C.green,red:C.red,pink:C.pink};
  for(var k in cols){
    var g=el('linearGradient',{id:'grad-'+k,x1:'0',y1:'0',x2:'0',y2:'1'},defs);
    el('stop',{offset:'0%','stop-color':cols[k],'stop-opacity':'0.28'},g);
    el('stop',{offset:'100%','stop-color':cols[k],'stop-opacity':'0.04'},g);
  }
  return defs;
}
var animPlaying=true;
function stopAnim(){animPlaying=false;document.body.classList.add('paused');}
function startAnim(){animPlaying=true;document.body.classList.remove('paused');}
function toggleAnim(){
  if(animPlaying){stopAnim();}else{startAnim();}
  var b=$('anim-toggle');
  if(b)b.textContent=animPlaying?'暂停动画':'播放动画';
}

/* ===== 雷达图 ===== */
function radar(g,cx,cy,r,labels,values,color){
  var n=labels.length,k,i,a,rr;
  for(k=1;k<=4;k++){
    var pts=[];
    for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*k/4;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}
    el('polygon',{points:pts.join(' '),fill:'none',stroke:'#1e2433','stroke-width':1},g);
  }
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:'#1e2433',sw:1});}
  var dpts=[];
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];dpts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}
  el('polygon',{points:dpts.join(' '),fill:color+'33',stroke:color,'stroke-width':2,class:'aglow'},g);
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:color,stroke:'none'});}
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lr=r+20;txt(g,cx+lr*Math.cos(a),cy+lr*Math.sin(a)+4,labels[i],{s:10.5,f:C.text2});}
}

/* ===== 附加图表工具 ===== */
function donut(g,cx,cy,r,segs){
  var a=-Math.PI/2;
  segs.forEach(function(s){
    var a2=a+2*Math.PI*s.v/100;
    var x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);
    var x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    var large=s.v>50?1:0;
    el('path',{d:'M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+' Z',fill:s.c+'33',stroke:s.c,'stroke-width':1.5},g);
    a=a2;
  });
  el('circle',{cx:cx,cy:cy,r:r*0.55,fill:C.bg2,stroke:C.border,'stroke-width':1},g);
}
function gauge(g,cx,cy,r,val,max,label,col){
  el('path',{d:'M'+(cx-r)+','+cy+' A'+r+','+r+' 0 0 1 '+(cx+r)+','+cy,fill:'none',stroke:C.border2,'stroke-width':6,'stroke-linecap':'round'},g);
  var ang=-Math.PI+Math.PI*val/max;
  var x2=cx+r*Math.cos(ang),y2=cy+r*Math.sin(ang);
  el('path',{d:'M'+(cx-r)+','+cy+' A'+r+','+r+' 0 0 1 '+x2+','+y2,fill:'none',stroke:col,'stroke-width':6,'stroke-linecap':'round',class:'aglow'},g);
  txt(g,cx,cy-4,Math.round(val/max*100)+'%',{s:14,f:col,mono:true,w:600});
  if(label)txt(g,cx,cy+16,label,{s:10,f:C.text3});
}
function tag(g,x,y,text,col){
  var w=text.length*7.5+16;
  el('rect',{x:x,y:y-10,width:w,height:16,rx:8,fill:col+'22',stroke:col,'stroke-width':1},g);
  txt(g,x+w/2,y+1,text,{s:9.5,f:col,mono:true});
}
function progressBar(g,x,y,w,h,val,max,col){
  el('rect',{x:x,y:y,width:w,height:h,rx:h/2,fill:C.bg4,stroke:C.border,'stroke-width':1},g);
  var fw=w*val/max;
  if(fw>2)el('rect',{x:x,y:y,width:fw,height:h,rx:h/2,fill:col,class:'apulse'},g);
  txt(g,x+w+8,y+h/2+1,Math.round(val/max*100)+'%',{s:9.5,f:col,mono:true,a:'start'});
}
/* 横向时间线：节点+标签 */
function timeline(g,x,y,w,events,col){
  el('line',{x1:x,y1:y,x2:x+w,y2:y,stroke:col,'stroke-width':1.8,'stroke-dasharray':'4 3',class:'adash'},g);
  events.forEach(function(ev){
    circ(g,ev.x||x,y,5,{fill:C.bg2,stroke:col,'stroke-width':2,class:'apulse'});
    txt(g,ev.x||x,y-12,ev.t,{s:10,f:col,mono:true,w:600});
    if(ev.d)txt(g,ev.x||x,y+18,ev.d,{s:9.5,f:C.text3});
  });
}
/* 堆叠水平条 */
function stackedBar(g,x,y,w,h,segs){
  var cx=x;
  segs.forEach(function(s){
    var sw=w*s.v;
    el('rect',{x:cx,y:y,width:Math.max(2,sw),height:h,fill:s.c+'55',stroke:s.c,'stroke-width':1,rx:2},g);
    if(sw>28)txt(g,cx+sw/2,y+h/2+1,s.l,{s:9,f:C.text,mono:true});
    cx+=sw;
  });
}
/* 热力格子 */
function heatCell(g,x,y,w,h,val,max,col){
  var t=val/max;
  el('rect',{x:x,y:y,width:w,height:h,rx:3,fill:col,opacity:0.15+t*0.55,stroke:col+'88','stroke-width':1},g);
  txt(g,x+w/2,y+h/2+1,Math.round(val),{s:9.5,f:C.text,mono:true,w:600});
}
/* 环形进度指标 */
function metricRing(g,cx,cy,r,val,max,label,col){
  el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:C.border2,'stroke-width':5},g);
  var circ2=2*Math.PI*r;
  el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:col,'stroke-width':5,'stroke-linecap':'round','stroke-dasharray':circ2,'stroke-dashoffset':circ2*(1-val/max),transform:'rotate(-90 '+cx+' '+cy+')',class:'aglow'},g);
  txt(g,cx,cy-2,Math.round(val/max*100)+'%',{s:13,f:col,mono:true,w:600});
  if(label)txt(g,cx,cy+15,label,{s:9.5,f:C.text3});
}
/* 标签芯片行 */
function chipRow(g,x,y,items,col){
  items.forEach(function(it,i){
    var w=it.length*7.2+14;
    el('rect',{x:x,y:y-9,width:w,height:15,rx:7,fill:col+'1f',stroke:col+'99','stroke-width':1},g);
    txt(g,x+w/2,y+1,it,{s:9,f:col,mono:true});
    x+=w+7;
  });
}
/* 曲线连接弧 */
function arcLink(g,x1,y1,x2,y2,col,sw){
  var mx=(x1+x2)/2,my=(y1+y2)/2-18;
  el('path',{d:'M'+x1+','+y1+' Q'+mx+','+my+' '+x2+','+y2,fill:'none',stroke:col,'stroke-width':sw||1.5,'stroke-dasharray':'4 3',class:'adash'},g);
  var ang=Math.atan2(y2-my,x2-mx);var ah=7;
  el('polygon',{points:x2+','+y2+' '+(x2-ah*Math.cos(ang-0.42))+','+(y2-ah*Math.sin(ang-0.42))+' '+(x2-ah*Math.cos(ang+0.42))+','+(y2-ah*Math.sin(ang+0.42)),fill:col},g);
}
/* 带图标的节点卡 */
function nodeCard(g,x,y,w,h,title,sub,col){
  box(g,x,y,w,h,{fill:col+'12',stroke:col,sw:1.5,cls:'aglow'});
  circ(g,x+18,y+20,7,{fill:col,stroke:'none',cls:'apulse'});
  txt(g,x+34,y+24,title,{f:col,s:12.5,w:600,a:'start'});
  if(sub)txt(g,x+34,y+40,sub,{f:C.text3,s:10,a:'start'});
}
/* KPI 数值块 */
function kpiBlock(g,x,y,w,h,k,val,col){
  box(g,x,y,w,h,{fill:C.bg4,stroke:col+'66',sw:1.2});
  el('rect',{x:x,y:y,width:3,height:h,fill:col},g);
  txt(g,x+14,y+18,k,{s:9.5,f:C.text3,mono:true,a:'start'});
  txt(g,x+14,y+38,val,{s:15,f:col,mono:true,w:600,a:'start'});
}

function vSep(g,x,y1,y2){el('line',{x1:x,y1:y1,x2:x,y2:y2,stroke:C.border,'stroke-width':1,'stroke-dasharray':'2 4'},g);}

var mRoots={},mLayers={},mStatus={},mDrawn={},currentModule=1;

/* ===== 构建 ===== */
function buildNav(){
  var n=$('nav-inner');
  MODULES.forEach(function(m,i){
    var idx=i+1;
    var b=document.createElement('button');
    b.className='nav-btn'+(i===0?' active':'');
    b.id='nav-m'+idx;
    b.innerHTML='<span class="nidx">'+m.num+'</span>'+m.title;
    b.onclick=function(){switchModule(idx);};
    n.appendChild(b);
  });
}
function buildStage(){
  var stage=$('module-stage');
  MODULES.forEach(function(m,i){
    var idx=i+1;
    var p=document.createElement('div');
    p.className='module-panel'+(i===0?' active':'');
    p.id='panel-m'+idx;
    var btns=m.views.map(function(v,j){
      return '<button class="btn'+(j===0?' active':'')+'" id="m'+idx+'-btn'+j+'" onclick="m'+idx+'View('+(j+1)+')">'+v+'</button>';
    }).join('');
    p.innerHTML='<div class="m-head"><span class="num">'+m.num+'</span><h2>'+m.title+'</h2><span class="sub">'+m.sub+'</span></div>'
      +'<div class="m-desc">'+m.desc+'</div><div class="ctrl-row">'+btns+'</div>'
      +'<div class="status-bar" id="m'+idx+'-stat"></div>'
      +'<div class="viz-wrap"><svg viewBox="0 0 900 480" id="m'+idx+'-svg"><g id="m'+idx+'-layer"></g></svg><div class="legend-row" id="m'+idx+'-leg"></div></div>'
      +'<div class="info-grid" id="m'+idx+'-info"></div>';
    stage.appendChild(p);
    mRoots['m'+idx]=$('m'+idx+'-svg');
    mLayers['m'+idx]=$('m'+idx+'-layer');
  });
}
function switchModule(id){
  currentModule=id;
  for(var i=1;i<=8;i++){
    var p=$('panel-m'+i);if(p)p.classList.toggle('active',i===id);
    var nb=$('nav-m'+i);if(nb)nb.classList.toggle('active',i===id);
  }
  if(!mDrawn['m'+id]){window['m'+id+'Draw']();}
}
function init(){
  var gs=document.createElementNS(SVGNS,'svg');
  gs.setAttribute('width','0');gs.setAttribute('height','0');gs.style.position='absolute';
  document.body.appendChild(gs);
  addDefs(gs);
  buildNav();buildStage();switchModule(1);
}
window.addEventListener('DOMContentLoaded',init);
