<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库内核深度可视化实验室 · Database Internals Viz Lab</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#c084fc;--accent2:#a855f7;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 80% 0%,rgba(192,132,252,0.06),transparent 50%);
}
code,.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(8,9,10,0.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.header-inner{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-0.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#08090a;font-weight:700;font-size:13px}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav-pill{font-size:12px;padding:6px 11px;border-radius:7px;color:var(--text2);background:transparent;border:1px solid transparent;cursor:pointer;transition:all .18s ease;white-space:nowrap}
.nav-pill:hover{color:var(--text);background:var(--bg2);border-color:var(--border)}
.nav-pill.active{color:var(--accent);background:rgba(192,132,252,0.1);border-color:rgba(192,132,252,0.3)}
.container{max-width:1280px;margin:0 auto;padding:32px 28px 120px}
.hero{padding:24px 0 40px;border-bottom:1px solid var(--border);margin-bottom:48px}
.hero h1{font-size:34px;letter-spacing:-0.02em;font-weight:600;margin-bottom:10px}
.hero h1 .glow{color:var(--accent)}
.hero p{color:var(--text2);font-size:15px;max-width:680px}
.hero .meta{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--text3)}
.hero .meta span{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.module{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-bottom:28px;scroll-margin-top:80px;transition:border-color .2s ease}
.module:hover{border-color:var(--border2)}
.module-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.module-num{flex-shrink:0;width:34px;height:34px;border-radius:9px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600}
.module-title{flex:1;min-width:200px}
.module-title h2{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px}
.module-title p{color:var(--text2);font-size:13.5px}
.badge{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);font-family:'SF Mono',Monaco,Consolas,monospace}
.badge.accent{color:var(--accent);border-color:rgba(192,132,252,0.3);background:rgba(192,132,252,0.08)}
.module-body{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px}
.panel-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;font-weight:600}
.desc{color:var(--text2);font-size:13.5px;margin-bottom:16px;line-height:1.7}
.desc strong{color:var(--text)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:7px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#08090a;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#08090a}
.btn.sm{font-size:11.5px;padding:5px 10px}
.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(192,132,252,0.1)}
.slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
.slider-row input[type=range]{-webkit-appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;width:110px}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.slider-row .val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:42px}
svg{display:block;width:100%;height:auto}
.svg-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:hidden}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.stat .v{font-size:16px;color:var(--text);font-family:'SF Mono',Monaco,Consolas,monospace;margin-top:2px}
.stat .v.acc{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
table.cmp th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em}
table.cmp td{color:var(--text2)}
table.cmp tr:hover td{color:var(--text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s ease;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.bn-btn{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .18s ease}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.bn-btn .name{font-size:14px;color:var(--text);margin-top:3px}
.bn-btn.next{text-align:right}
.bn-btn[disabled]{opacity:0.4;pointer-events:none}
@media(max-width:820px){.module-body{grid-template-columns:1fr}.hero h1{font-size:26px}.container{padding:24px 16px 100px}.header-inner{padding:12px 16px}}
.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:11.5px;color:var(--text2);white-space:pre;overflow-x:auto;margin-top:10px}
.code-block .kw{color:var(--accent)}.code-block .str{color:var(--green)}.code-block .num{color:var(--amber)}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo"><div class="logo-mark">D</div><span>Database Internals · 数据库内核深度</span></div>
    <div class="nav-pills" id="navPills"></div>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>数据库内核 <span class="glow">可视化实验室</span></h1>
    <p>8 个交互式模块，深入数据库引擎内部：查询执行、向量化、列式编码、事务隔离、WAL 恢复、代价估计、MVCC、分布式数据库。所有可视化均由 SVG 实时绘制。</p>
    <div class="meta">
      <span><i class="dot"></i>8 Modules</span>
      <span><i class="dot"></i>Pure SVG / Canvas</span>
      <span><i class="dot"></i>Zero Dependencies</span>
      <span><i class="dot"></i>Linear Dark Aesthetic</span>
    </div>
  </div>

  <div id="modules"></div>

  <div class="bottom-nav">
    <div class="bn-btn prev" id="bnPrev"><div class="lbl">← Previous</div><div class="name" id="bnPrevName">—</div></div>
    <div class="bn-btn next" id="bnNext"><div class="lbl">Next →</div><div class="name" id="bnNextName">—</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>[...p.querySelectorAll(s)];
const SVGNS='http://www.w3.org/2000/svg';
const el=(tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MODULES=[
  {id:'volcano',num:'01',name:'查询执行引擎',en:'Volcano Iterator Model'},
  {id:'vectorized',num:'02',name:'向量化执行',en:'Vectorized Execution'},
  {id:'columnar',num:'03',name:'列式存储编码',en:'Columnar Encoding'},
  {id:'isolation',num:'04',name:'事务隔离级别',en:'Isolation Levels'},
  {id:'wal',num:'05',name:'WAL 与 Checkpoint',en:'WAL & Checkpoint'},
  {id:'cost',num:'06',name:'统计与代价估计',en:'Cost Estimation'},
  {id:'mvcc',num:'07',name:'MVCC 实现',en:'MVCC Internals'},
  {id:'distributed',num:'08',name:'分布式数据库',en:'Distributed DB'},
];

const navPills=$('#navPills');
MODULES.forEach((m,i)=>{const b=document.createElement('div');b.className='nav-pill';b.textContent=m.num;b.onclick=()=>document.getElementById(m.id).scrollIntoView({behavior:'smooth',block:'start'});navPills.appendChild(b);});

const modulesEl=$('#modules');
MODULES.forEach(m=>{const sec=document.createElement('section');sec.className='module';sec.id=m.id;sec.innerHTML=`<div class="module-head"><div class="module-num">${m.num}</div><div class="module-title"><h2>${m.name}</h2><p>${m.en}</p></div><span class="badge accent">Module ${m.num}</span></div><div class="module-body" id="body-${m.id}"></div>`;modulesEl.appendChild(sec);});

/* ============================================================ 模块1: Volcano ============================================================ */
(()=>{
  const body=$('#body-volcano');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">Volcano 迭代器模型</div>
      <div class="desc">每个算子实现 <code>open()/next()/close()</code> 接口，一次返回一行(tuple)。父算子 pull 子算子。点击"拉取下一行"观察数据自底向上流动。</div>
      <div class="controls">
        <button class="btn primary" id="vo-next">拉取下一行</button>
        <button class="btn" id="vo-auto">自动执行</button>
        <button class="btn" id="vo-reset">重置</button>
      </div>
      <div class="svg-wrap"><svg id="vo-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">执行计划</div>
      <div class="code-block"><span class="kw">SELECT</span> name <span class="kw">FROM</span> users
<span class="kw">WHERE</span> age &gt; <span class="num">25</span>
<span class="kw">ORDER BY</span> name;</div>
      <div class="panel-title" style="margin-top:14px">算子树</div>
      <table class="cmp">
        <tr><th>算子</th><th>作用</th></tr>
        <tr><td>Sort</td><td>排序(内存/外排)</td></tr>
        <tr><td>Filter</td><td>谓词过滤</td></tr>
        <tr><td>SeqScan</td><td>顺序扫描表</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">特性</div>
      <div class="desc">优点：接口统一、内存友好(流式)、易嵌套。缺点：每行一次虚函数调用，CPU cache 不友好 → 向量化改进。</div>
    </div>`;
  const svg=$('#vo-svg');
  const operators=[
    {n:'Sort',x:230,y:40,w:90,color:'var(--accent)'},
    {n:'Filter (age>25)',x:230,y:110,w:120,color:'var(--amber)'},
    {n:'SeqScan users',x:230,y:180,w:110,color:'var(--green)'}
  ];
  const data=[
    {name:'Alice',age:30},{name:'Bob',age:22},{name:'Carol',age:28},{name:'Dave',age:35},{name:'Eve',age:19}
  ];
  let cursor=0,emitted=[],currentRow=null,activeOp=-1;
  function draw(){
    svg.innerHTML='';
    svg.appendChild(el('defs')).innerHTML=`<marker id="va" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--text3)"/></marker>`;
    // 算子
    operators.forEach((op,i)=>{
      const active=i===activeOp;
      svg.appendChild(el('rect',{x:op.x-op.w/2,y:op.y-16,width:op.w,height:32,rx:6,fill:'var(--bg3)',stroke:active?op.color:'var(--border2)','stroke-width':active?2:1.3}));
      svg.appendChild(el('text',{x:op.x,y:op.y+4,'text-anchor':'middle',fill:active?op.color:'var(--text2)','font-size':11,'font-family':'monospace'},op.n));
      if(i<operators.length-1){
        svg.appendChild(el('line',{x1:op.x,y1:op.y+16,x2:operators[i+1].x,y2:operators[i+1].y-16,stroke:'var(--text3)','stroke-width':1.3,'marker-end':'url(#va)'}));
      }
    });
    // 当前流动的行
    if(currentRow){
      svg.appendChild(el('rect',{x:currentRow.x-40,y:currentRow.y-12,width:80,height:24,rx:4,fill:'var(--accent)',opacity:0.9}));
      svg.appendChild(el('text',{x:currentRow.x,y:currentRow.y+4,'text-anchor':'middle',fill:'#08090a','font-size':10,'font-family':'monospace'},currentRow.text));
    }
    // 结果
    svg.appendChild(el('text',{x:20,y:260,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'结果集:'));
    emitted.forEach((r,i)=>{
      svg.appendChild(el('rect',{x:20+i*85,y:245,width:75,height:24,rx:4,fill:'var(--bg3)',stroke:'var(--green)','stroke-width':1}));
      svg.appendChild(el('text',{x:20+i*85+38,y:261,'text-anchor':'middle',fill:'var(--text2)','font-size':9,'font-family':'monospace'},r));
    });
    // 数据源
    svg.appendChild(el('text',{x:230,y:225,'text-anchor':'middle',fill:'var(--text3)','font-size':10,'font-family':'monospace'},'表数据 (cursor='+cursor+'/'+data.length+')'));
  }
  let animating=false;
  function step(){
    if(cursor>=data.length){toast('扫描完成');animating=false;return;}
    activeOp=2;
    const row=data[cursor];cursor++;
    draw();
    // SeqScan -> Filter
    setTimeout(()=>{
      currentRow={x:230,y:150,text:row.name+','+row.age};activeOp=1;draw();
      setTimeout(()=>{
        if(row.age>25){
          // Filter -> Sort
          currentRow={x:230,y:80,text:row.name};draw();
          setTimeout(()=>{
            currentRow=null;activeOp=0;draw();
            setTimeout(()=>{
              emitted.push(row.name);
              // 排序结果
              emitted.sort();
              activeOp=-1;draw();
              if(animating)setTimeout(step,400);
            },400);
          },400);
        }else{
          currentRow=null;activeOp=-1;draw();
          toast('过滤: '+row.name+' age='+row.age+' 被丢弃');
          if(animating)setTimeout(step,400);
        }
      },400);
    },400);
  }
  draw();
  $('#vo-next').onclick=()=>{if(!animating)step();};
  $('#vo-auto').onclick=(e)=>{animating=!animating;e.target.classList.toggle('active',animating);if(animating)step();};
  $('#vo-reset').onclick=()=>{cursor=0;emitted=[];currentRow=null;activeOp=-1;animating=false;$('.btn#vo-auto').classList.remove('active');draw();};
})();

/* ============================================================ 模块2: 向量化 ============================================================ */
(()=>{
  const body=$('#body-vectorized');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">行式 vs 向量化执行</div>
      <div class="desc">对比每次处理一行(左)与批量处理一列(右)。向量化把 1024 行打包成 Vector，一次 SIMD 处理，减少函数调用、提升 cache 命中。</div>
      <div class="controls">
        <button class="btn primary" id="ve-run">执行过滤 age>25</button>
        <div class="slider-row">批大小 <input type="range" id="ve-batch" min="1" max="8" value="4"><span class="val" id="ve-batch-v">4</span></div>
      </div>
      <div class="svg-wrap"><svg id="ve-svg" viewBox="0 0 460 260"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">性能对比</div>
      <table class="cmp">
        <tr><th>维度</th><th>行式(Volcano)</th><th>向量化</th></tr>
        <tr><td>函数调用</td><td>N 次</td><td>N/batch 次</td></tr>
        <tr><td>Cache</td><td>差(跨列)</td><td>优(连续列)</td></tr>
        <tr><td>SIMD</td><td>难</td><td>易利用</td></tr>
        <tr><td>典型系统</td><td>PostgreSQL</td><td>ClickHouse/DuckDB</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">SIMD 说明</div>
      <div class="desc">AVX2 可一条指令处理 8 个 int32。批大小通常 1024/2048。列存格式天然适配向量化。</div>
    </div>`;
  const svg=$('#ve-svg');
  let batch=4,running=false;
  $('#ve-batch').oninput=e=>{batch=+e.target.value;$('#ve-batch-v').textContent=batch;draw();};
  const rows=[{n:'A',a:30},{n:'B',a:22},{n:'C',a:28},{n:'D',a:35},{n:'E',a:19},{n:'F',a:40},{n:'G',a:18},{n:'H',a:26}];
  let rowResults=[],vecResults=[];
  function draw(){
    svg.innerHTML='';
    // 左：行式
    svg.appendChild(el('text',{x:115,y:20,'text-anchor':'middle',fill:'var(--text2)','font-size':12,'font-family':'monospace'},'行式 (逐行)'));
    let rowStep=0;
    rows.forEach((r,i)=>{
      const y=35+i*14;
      const processed=i<rowStep;
      const pass=processed&&r.a>25;
      svg.appendChild(el('rect',{x:40,y:y-8,width:150,height:11,fill:pass?'rgba(52,211,153,0.2)':(processed?'rgba(248,113,113,0.15)':'var(--bg3)'),stroke:'var(--border)'}));
      svg.appendChild(el('text',{x:50,y,fill:processed?(pass?'var(--green)':'var(--red)'):'var(--text3)','font-size':9,'font-family':'monospace'},r.n+':'+r.a+(processed?(pass?' ✓':' ✗'):'')));
    });
    // 右：向量化
    svg.appendChild(el('text',{x:345,y:20,'text-anchor':'middle',fill:'var(--accent)','font-size':12,'font-family':'monospace'},'向量化 (批量)'));
    // 列向量
    const vx=270;
    svg.appendChild(el('rect',{x:vx,y:32,width:150,height:rows.length*14+4,fill:'var(--bg3)',stroke:'var(--accent)','stroke-width':1.3}));
    svg.appendChild(el('text',{x:vx+75,y:30,'text-anchor':'middle',fill:'var(--accent)','font-size':9,'font-family':'monospace'},'Vector[age]'));
    rows.forEach((r,i)=>{
      const y=40+i*14;
      const inBatch=i<batch;
      const pass=inBatch&&r.a>25;
      svg.appendChild(el('rect',{x:vx+5,y:y-7,width:140,height:11,fill:inBatch?(pass?'rgba(52,211,153,0.3)':'rgba(248,113,113,0.2)'):'transparent',stroke:'none'}));
      svg.appendChild(el('text',{x:vx+15,y,fill:inBatch?(pass?'var(--green)':'var(--red)'):'var(--text3)','font-size':9,'font-family':'monospace'},r.a+(inBatch?(pass?' ✓':' ✗'):'')));
    });
    // SIMD 标记
    if(batch>0){
      svg.appendChild(el('rect',{x:vx-3,y:33,width:156,height:batch*14,fill:'none',stroke:'var(--amber)','stroke-width':1.5,'stroke-dasharray':'3 2'}));
      svg.appendChild(el('text',{x:vx+78,y:33+batch*14+12,'text-anchor':'middle',fill:'var(--amber)','font-size':9,'font-family':'monospace'},'SIMD batch ('+batch+')'));
    }
    // 计数
    const rowPass=rows.filter(r=>r.a>25).length;
    const vecPass=rows.slice(0,batch).filter(r=>r.a>25).length;
    svg.appendChild(el('text',{x:115,y:170,'text-anchor':'middle',fill:'var(--text3)','font-size':10,'font-family':'monospace'},'调用 '+rows.length+' 次 next()'));

/* ============================================================ 模块3: 列式编码 ============================================================ */
(()=>{
  const body=$('#body-columnar');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">列式存储编码</div>
      <div class="desc">切换编码方式观察压缩效果。<strong>RLE</strong>：连续重复值; <strong>Dictionary</strong>：低基数列; <strong>Delta</strong>：递增数值(时间戳)。</div>
      <div class="controls">
        <button class="btn active" data-enc="rle">RLE</button>
        <button class="btn" data-enc="dict">Dictionary</button>
        <button class="btn" data-enc="delta">Delta</button>
      </div>

    </div>

      <div class="panel-title">压缩效果</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">原始大小</div><div class="v" id="co-orig">— B</div></div>
        <div class="stat"><div class="k">编码后</div><div class="v acc" id="co-enc">— B</div></div>
        <div class="stat"><div class="k">压缩比</div><div class="v" id="co-ratio" style="color:var(--green)">—</div></div>
      </div>

      <table class="cmp">
        <tr><th>编码</th><th>最佳场景</th></tr>
        <tr><td>RLE</td><td>排序后重复值多</td></tr>
        <tr><td>Dictionary</td><td>低基数(枚举/状态)</td></tr>
        <tr><td>Delta</td><td>单调递增(时间/id)</td></tr>
      </table>
    </div>`;
  const svg=$('#co-svg');
  let enc='rle';
  const rleData=['A','A','A','B','B','C','C','C','C','A','A'];
  const dictData=['北京','上海','北京','广州','上海','北京','广州','上海','北京','广州','上海'];
  const deltaData=[1000,1001,1002,1003,1005,1008,1009,1012,1015,1018,1020];
  function draw(){
    svg.innerHTML='';
    let data,orig,encodedStr,encSize;
    if(enc==='rle'){
      data=rleData;orig=data.length*8;
      // run-length
      const runs=[];let cur=data[0],cnt=1;
      for(let i=1;i<data.length;i++){if(data[i]===cur)cnt++;else{runs.push([cur,cnt]);cur=data[i];cnt=1;}}
      runs.push([cur,cnt]);
      encodedStr=runs.map(r=>r[0]+'×'+r[1]).join(' ');
      encSize=runs.length*8;
      // 原始
      svg.appendChild(el('text',{x:20,y:25,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'原始: '+data.join(' ')));

      runs.forEach(r=>{
        const w=Math.max(40,r[1]*16);
        svg.appendChild(el('rect',{x,y:45,width:w-4,height:28,rx:4,fill:'var(--bg3)',stroke:'var(--accent)','stroke-width':1.3}));
        svg.appendChild(el('text',{x:x+w/2-2,y:63,'text-anchor':'middle',fill:'var(--accent)','font-size':10,'font-family':'monospace'},r[0]+'×'+r[1]));
        x+=w;
      });
      svg.appendChild(el('text',{x:20,y:95,fill:'var(--text3)','font-size':10,'font-family':'monospace'},runs.length+' runs (vs '+data.length+' 值)'));
    }else if(enc==='dict'){
      data=dictData;orig=data.length*10;
      const dict=[...new Set(data)];
      const dictMap={};dict.forEach((v,i)=>dictMap[v]=i);
      encodedStr=data.map(v=>'['+dictMap[v]+']').join(' ');
      encSize=dict.length*10+data.length*1;
      // dict
      svg.appendChild(el('text',{x:20,y:25,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'Dictionary:'));
      dict.forEach((v,i)=>{
        svg.appendChild(el('rect',{x:20+i*90,y:32,width:80,height:24,rx:4,fill:'var(--bg3)',stroke:'var(--amber)','stroke-width':1.2}));
        svg.appendChild(el('text',{x:20+i*90+40,y:48,'text-anchor':'middle',fill:'var(--amber)','font-size':10,'font-family':'monospace'},'['+i+'] '+v));
      });
      // encoded
      svg.appendChild(el('text',{x:20,y:85,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'编码后(存储索引):'));
      data.forEach((v,i)=>{
        const x=20+(i%6)*70;const y=95+Math.floor(i/6)*30;
        svg.appendChild(el('rect',{x,y,width:60,height:22,rx:3,fill:'var(--bg3)',stroke:'var(--accent)','stroke-width':1}));
        svg.appendChild(el('text',{x:x+30,y:y+14,'text-anchor':'middle',fill:'var(--accent)','font-size':10,'font-family':'monospace'},'['+dictMap[v]+']'));
      });
    }else{
      data=deltaData;orig=data.length*8;
      const deltas=[data[0]];
      for(let i=1;i<data.length;i++)deltas.push(data[i]-data[i-1]);
      encodedStr=deltas.join(' ');
      encSize=data.length*2;
      // 原始
      svg.appendChild(el('text',{x:20,y:25,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'原始值: '+data.join(', ')));
      // delta
      svg.appendChild(el('text',{x:20,y:55,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'Delta: '+deltas[0]+', '+deltas.slice(1).join(', ')));
      // 可视化递增
      data.forEach((v,i)=>{
        const x=30+i*38;const h=(v-1000)*4;
        svg.appendChild(el('rect',{x,y:240-h,width:30,height:h,fill:'var(--accent)',opacity:0.6}));
        svg.appendChild(el('text',{x:x+15,y:235-h,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},v));
        if(i>0){
          svg.appendChild(el('text',{x:x-8,y:90,fill:'var(--green)','font-size':9,'font-family':'monospace'},'+'+deltas[i]));
        }
      });
      svg.appendChild(el('line',{x1:20,y1:240,x2:440,y2:240,stroke:'var(--border2)','stroke-width':1}));
    }
    $('#co-orig').textContent=orig+' B';
    $('#co-enc').textContent=encSize+' B';
    $('#co-ratio').textContent=(orig/encSize).toFixed(1)+'x';
  }
  $$('#body-columnar [data-enc]').forEach(b=>b.onclick(()=>{
    $$('#body-columnar [data-enc]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');enc=b.dataset.enc;draw();
  }));
  draw();
})();

/* ============================================================ 模块4: 事务隔离 ============================================================ */
(()=>{
  const body=$('#body-isolation');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">事务隔离级别与异常</div>
      <div class="desc">两个事务 T1/T2 并发执行。切换隔离级别，观察是否发生<strong>脏读</strong>、<strong>不可重复读</strong>、<strong>幻读</strong>。</div>
      <div class="controls">
        <button class="btn" data-iso="ru">Read Uncommitted</button>
        <button class="btn active" data-iso="rc">Read Committed</button>
        <button class="btn" data-iso="rr">Repeatable Read</button>
        <button class="btn" data-iso="ser">Serializable</button>

      </div>
      <div class="svg-wrap"><svg id="is-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">隔离级别矩阵</div>
      <table class="cmp">
        <tr><th>级别</th><th>脏读</th><th>不可重复读</th><th>幻读</th></tr>
        <tr><td>Read Uncommitted</td><td style="color:var(--red)">可能</td><td style="color:var(--red)">可能</td><td style="color:var(--red)">可能</td></tr>
        <tr><td>Read Committed</td><td style="color:var(--green)">避免</td><td style="color:var(--red)">可能</td><td style="color:var(--red)">可能</td></tr>
        <tr><td>Repeatable Read</td><td style="color:var(--green)">避免</td><td style="color:var(--green)">避免</td><td style="color:var(--red)">可能</td></tr>
        <tr><td>Serializable</td><td style="color:var(--green)">避免</td><td style="color:var(--green)">避免</td><td style="color:var(--green)">避免</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">结果</div>
      <div class="desc" id="is-result">点击"执行场景"观察 T1/T2 时序。</div>
    </div>`;
  const svg=$('#is-svg');
  let iso='rc',stepIdx=0,timer=null;
  function draw(events){
    svg.innerHTML='';
    // 时间轴
    svg.appendChild(el('line',{x1:60,y1:140,x2:440,y2:140,stroke:'var(--border2)','stroke-width':1}));
    svg.appendChild(el('text',{x:30,y:70,fill:'var(--accent)','font-size':11,'font-family':'monospace'},'T1'));
    svg.appendChild(el('text',{x:30,y:210,fill:'var(--amber)','font-size':11,'font-family':'monospace'},'T2'));
    svg.appendChild(el('line',{x1:50,y1:65,x2:50,y2:220,stroke:'var(--text3)','stroke-width':0.5,'stroke-dasharray':'2 2'}));
    if(!events)return;
    events.forEach((e,i)=>{
      if(i>stepIdx)return;
      const y=e.t==='T1'?70:210;
      const x=80+i*55;
      const c=e.color||'var(--text2)';
      svg.appendChild(el('rect',{x:x-22,y:y-14,width:44,height:28,rx:4,fill:'var(--bg3)',stroke:c,'stroke-width':1.3}));
      svg.appendChild(el('text',{x,y:y+3,'text-anchor':'middle',fill:c,'font-size':8.5,'font-family':'monospace'},e.label));
      if(i>0){
        const px=80+(i-1)*55;const py=events[i-1].t==='T1'?70:210;
        svg.appendChild(el('line',{x1:px,y1:py>140?py-14:py+14,x2:x,y2:y>140?y-14:y+14,stroke:'var(--text3)','stroke-width':1,opacity:0.5}));
      }
      // 异常标记
      if(e.anomaly){
        svg.appendChild(el('text',{x,y:255,'text-anchor':'middle',fill:'var(--red)','font-size':9,'font-family':'monospace'},e.anomaly));
        svg.appendChild(el('circle',{cx:x,cy:140,r:8,fill:'none',stroke:'var(--red)','stroke-width':1.5}));
      }
    });
  }
  const scenarios={
    ru:[
      {t:'T1',label:'W x=2',color:'var(--accent)'},
      {t:'T2',label:'R x',color:'var(--amber)',anomaly:'脏读'},
      {t:'T2',label:'R=2',color:'var(--red)'},
      {t:'T1',label:'ROLLBACK',color:'var(--red)'},
    ],
    rc:[
      {t:'T1',label:'R x=1',color:'var(--accent)'},
      {t:'T2',label:'W x=2',color:'var(--amber)'},
      {t:'T2',label:'COMMIT',color:'var(--green)'},
      {t:'T1',label:'R x=2',color:'var(--red)',anomaly:'不可重复读'},
    ],
    rr:[
      {t:'T1',label:'R cnt=5',color:'var(--accent)'},
      {t:'T2',label:'INSERT',color:'var(--amber)'},
      {t:'T2',label:'COMMIT',color:'var(--green)'},
      {t:'T1',label:'R cnt=6',color:'var(--red)',anomaly:'幻读'},
    ],
    ser:[
      {t:'T1',label:'R range',color:'var(--accent)'},
      {t:'T2',label:'INSERT',color:'var(--amber)'},
      {t:'T2',label:'BLOCK',color:'var(--red)'},
      {t:'T1',label:'COMMIT',color:'var(--green)'},
      {t:'T2',label:'OK',color:'var(--green)'},
    ]
  };
  const results={
    ru:'Read Uncommitted: T2 读到 T1 未提交的脏数据，T1 回滚后 T2 读到的值无效 → 脏读。',
    rc:'Read Committed: T1 两次读同一行结果不同(T2 提交后) → 不可重复读。',
    rr:'Repeatable Read: 同行重复读一致，但 T2 新增行导致 T1 范围查询结果变化 → 幻读。',
    ser:'Serializable: T2 的 INSERT 被 T1 范围锁阻塞，等 T1 提交后才执行 → 完全隔离。'
  };
  $$('#body-isolation [data-iso]').forEach(b=>b.onclick(()=>{
    $$('#body-isolation [data-iso]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');iso=b.dataset.iso;stepIdx=0;clearTimeout(timer);draw(scenarios[iso]);$('#is-result').textContent='点击"执行场景"观察 T1/T2 时序。';
  }));
  draw(scenarios[iso]);
  $('#is-run').onclick=()=>{
    stepIdx=0;clearTimeout(timer);
    const evs=scenarios[iso];
    function next(){
      draw(evs);
      if(stepIdx<evs.length-1){stepIdx++;timer=setTimeout(next,800);}
      else{$('#is-result').textContent=results[iso];}
    }
    next();
  };
})();

/* ============================================================ 模块5: WAL + Checkpoint ============================================================ */
(()=>{
  const body=$('#body-wal');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">WAL 崩溃恢复流程</div>
      <div class="desc">Write-Ahead Logging：先写日志再改数据页。Checkpoint 推进 redo 起点。崩溃后从最近 checkpoint 重放 WAL。<strong>ARIES</strong> 三阶段：Analysis→Redo→Undo。</div>
      <div class="controls">
        <button class="btn primary" id="wa-step">写入操作</button>
        <button class="btn" id="wa-checkpoint">Checkpoint</button>
        <button class="btn" id="wa-crash">模拟崩溃</button>
        <button class="btn" id="wa-recover">恢复</button>
      </div>
      <div class="svg-wrap"><svg id="wa-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">ARIES 恢复算法</div>
      <table class="cmp">
        <tr><th>阶段</th><th>作用</th></tr>
        <tr><td>Analysis</td><td>扫描 WAL 重建事务表</td></tr>
        <tr><td>Redo</td><td>重放所有已记录修改</td></tr>
        <tr><td>Undo</td><td>回滚未提交事务</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">关键规则</div>
      <div class="desc">1. 数据页落盘前其 WAL 必须先落盘(Steal-NoForce)。<br>2. Checkpoint 记录脏页表+事务表，缩短恢复时间。<br>3. LSN 单调递增，页头记录 PageLSN。</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">WAL 记录</div><div class="v acc" id="wa-lsn">0</div></div>
        <div class="stat"><div class="k">Checkpoint</div><div class="v" id="wa-ckpt">—</div></div>
        <div class="stat"><div class="k">状态</div><div class="v" id="wa-status">NORMAL</div></div>
      </div>
    </div>`;
  const svg=$('#wa-svg');
  let log=[],lsn=0,ckptLSN=null,crashed=false,pageLSN=0,recovering=false;
  function draw(phase){
    svg.innerHTML='';
    // WAL 区
    svg.appendChild(el('rect',{x:20,y:30,width:200,height:220,fill:'var(--bg3)',stroke:'var(--border2)','stroke-width':1.3,rx:6}));
    svg.appendChild(el('text',{x:120,y:22,'text-anchor':'middle',fill:'var(--accent)','font-size':11,'font-family':'monospace'},'WAL Log'));
    log.forEach((e,i)=>{
      const y=45+i*16;const isCkpt=e.type==='ckpt';
      const inRedo=phase==='redo'&&e.lsn>=(ckptLSN||0);
      const inUndo=phase==='undo'&&e.type==='update'&&!e.committed;
      let c=e.committed?'var(--green)':'var(--text2)';
      if(isCkpt)c='var(--amber)';
      if(inRedo)c='var(--accent)';
      if(inUndo)c='var(--red)';
      svg.appendChild(el('rect',{x:25,y:y-10,width:190,height:13,fill:inRedo||inUndo?(inRedo?'rgba(192,132,252,0.15)':'rgba(248,113,113,0.15)'):'transparent'}));
      svg.appendChild(el('text',{x:30,y,fill:c,'font-size':9,'font-family':'monospace'},e.lsn+': '+e.text));
    });
    // 数据页
    svg.appendChild(el('rect',{x:260,y:30,width:180,height:100,fill:'var(--bg3)',stroke:'var(--border2)','stroke-width':1.3,rx:6}));
    svg.appendChild(el('text',{x:350,y:22,'text-anchor':'middle',fill:'var(--green)','font-size':11,'font-family':'monospace'},'Data Page'));
    svg.appendChild(el('text',{x:280,y:60,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'PageLSN: '+pageLSN));
    svg.appendChild(el('text',{x:280,y:85,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'value: '+(window._waVal||0)));
    svg.appendChild(el('text',{x:280,y:110,fill:'var(--text3)','font-size':9,'font-family':'monospace'},crashed?'(磁盘上的旧值)':'(内存+磁盘)'));
    // checkpoint 标记
    if(ckptLSN){
      const idx=log.findIndex(e=>e.lsn===ckptLSN);
      if(idx>=0){const y=45+idx*16;svg.appendChild(el('line',{x1:215,y1:y-3,x2:260,y2:60,stroke:'var(--amber)','stroke-width':1,'stroke-dasharray':'3 2'}));svg.appendChild(el('text',{x:225,y:y-5,fill:'var(--amber)','font-size':8,'font-family':'monospace'},'ckpt'));}
    }
    // 恢复阶段
    if(phase){
      svg.appendChild(el('rect',{x:260,y:150,width:180,height:100,fill:'var(--bg3)',stroke:phase==='undo'?'var(--red)':'var(--accent)','stroke-width':1.5,rx:6}));
      svg.appendChild(el('text',{x:350,y:175,'text-anchor':'middle',fill:phase==='undo'?'var(--red)':'var(--accent)','font-size':12,'font-family':'monospace'},'Phase: '+phase.toUpperCase()));
      const phases={analysis:'扫描 WAL 重建状态',redo:'重放 LSN≥'+(ckptLSN||0),undo:'回滚未提交事务'};
      svg.appendChild(el('text',{x:350,y:205,'text-anchor':'middle',fill:'var(--text2)','font-size':10,'font-family':'monospace'},phases[phase]||''));
    }
    $('#wa-lsn').textContent=lsn;
    $('#wa-ckpt').textContent=ckptLSN||'—';
    $('#wa-status').textContent=crashed?'CRASHED':(recovering?'RECOVERING':'NORMAL');
    $('#wa-status').style.color=crashed?'var(--red)':(recovering?'var(--amber)':'var(--green)');
  }
  draw();
  $('#wa-step').onclick=()=>{
    if(crashed){toast('已崩溃，需先恢复');return;}
    lsn++;const val=lsn*10;window._waVal=val;
    log.push({lsn,type:'update',text:'UPDATE x='+val,committed:Math.random()>0.3});
    pageLSN=lsn;draw();toast('LSN '+lsn+' 已写入 WAL');
  };
  $('#wa-checkpoint').onclick=()=>{
    if(crashed)return;
    lsn++;ckptLSN=lsn;log.push({lsn,type:'ckpt',text:'CHECKPOINT'});draw();toast('Checkpoint @ LSN '+lsn);
  };
  $('#wa-crash').onclick=()=>{
    crashed=true;pageLSN=Math.max(0,pageLSN-1);window._waVal=Math.max(0,(window._waVal||0)-5);draw();toast('系统崩溃! 内存数据丢失');
  };
  $('#wa-recover').onclick=()=>{
    if(!crashed){toast('系统正常，无需恢复');return;}
    recovering=true;draw('analysis');toast('Analysis: 扫描 WAL');
    setTimeout(()=>{draw('redo');toast('Redo: 重放修改');setTimeout(()=>{
      pageLSN=lsn;window._waVal=lsn*10;
      draw('redo');
      setTimeout(()=>{draw('undo');toast('Undo: 回滚未提交');setTimeout(()=>{
        log.forEach(e=>{if(e.type==='update'&&!e.committed)e.text+=' [UNDONE]';});
        recovering=false;crashed=false;draw();toast('恢复完成');
      },1200);},1200);
    },1200);},1200);
  };
})();

/* ============================================================ 模块6: 代价估计 ============================================================ */
(()=>{

  body.innerHTML=`
    <div class="panel">

      <div class="desc">优化器基于<strong>直方图</strong>估计谓词选择率。调整谓词值观察选择率变化，影响执行计划选择(索引扫描 vs 全表扫描)。</div>
      <div class="controls">
        <div class="slider-row">谓词 age &gt;= <input type="range" id="ce-val" min="0" max="100" value="40"><span class="val" id="ce-val-v">40</span></div>
        <button class="btn" id="ce-scan">全表扫描</button>
        <button class="btn" id="ce-index">索引扫描</button>
      </div>
      <div class="svg-wrap"><svg id="ce-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">选择率与代价</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">选择率</div><div class="v acc" id="ce-sel">—</div></div>
        <div class="stat"><div class="k">估计行数</div><div class="v" id="ce-rows">—</div></div>
        <div class="stat"><div class="k">全表代价</div><div class="v" id="ce-cost-scan">—</div></div>
        <div class="stat"><div class="k">索引代价</div><div class="v" id="ce-cost-idx" style="color:var(--green)">—</div></div>
      </div>
      <div class="panel-title" style="margin-top:14px">代价模型</div>
      <div class="desc">全表: pages × seq_page_cost<br>索引: random_page_cost × matches + index_pages<br>当选择率 &lt; ~10% 时索引更优。</div>
      <div class="desc" id="ce-plan" style="color:var(--accent)"></div>
    </div>`;
  const svg=$('#ce-svg');
  let pred=40,mode='scan';
  const buckets=Array.from({length:20},(_,i)=>{
    // 正态分布 mean=50 sd=15
    const x=i*5;const mean=50,sd=15;
    const h=Math.exp(-((x-mean)**2)/(2*sd*sd))/(sd*Math.sqrt(2*Math.PI));
    return {x0:x,x1:x+5,count:Math.round(h*2000)};
  });
  const totalPages=1000,totalRows=buckets.reduce((a,b)=>a+b.count,0);
  $('#ce-val').oninput=e=>{pred=+e.target.value;$('#ce-val-v').textContent=pred;draw();};
  function draw(){
    svg.innerHTML='';
    const bw=18,maxH=buckets.reduce((a,b)=>Math.max(a,b.count),0);
    buckets.forEach((b,i)=>{
      const h=(b.count/maxH)*150;
      const selected=b.x1>pred;
      const x=30+i*bw;
      svg.appendChild(el('rect',{x,y:200-h,width:bw-2,height:h,fill:selected?'var(--accent)':'var(--bg3)',stroke:selected?'var(--accent)':'var(--border2)','stroke-width':1}));
      if(i%4===0)svg.appendChild(el('text',{x:x+8,y:215,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},b.x0));
    });
    // 谓词线
    const px=30+(pred/100)*20*bw;
    svg.appendChild(el('line',{x1:px,y1:30,x2:px,y2:205,stroke:'var(--red)','stroke-width':1.5,'stroke-dasharray':'4 3'}));
    svg.appendChild(el('text',{x:px,y:25,'text-anchor':'middle',fill:'var(--red)','font-size':10,'font-family':'monospace'},'age>='+pred));
    // 轴
    svg.appendChild(el('line',{x1:30,y1:205,x2:30+20*bw,y2:205,stroke:'var(--border2)','stroke-width':1}));
    // 选择率
    const matchRows=buckets.filter(b=>b.x1>pred).reduce((a,b)=>a+b.count,0);
    const sel=totalRows>0?matchRows/totalRows:0;
    const scanCost=totalPages;
    const idxCost=Math.ceil(matchRows*1.2)+Math.ceil(sel*50);
    $('#ce-sel').textContent=(sel*100).toFixed(1)+'%';
    $('#ce-rows').textContent=matchRows;
    $('#ce-cost-scan').textContent=scanCost;
    $('#ce-cost-idx').textContent=idxCost;
    const better=idxCost<scanCost?'索引扫描':'全表扫描';
    $('#ce-plan').textContent='优化器选择: '+better;
    // 代价条
    const costY=240;
    svg.appendChild(el('text',{x:30,y:costY,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'Scan:'));
    svg.appendChild(el('rect',{x:80,y:costY-9,width:scanCost/8,height:11,fill:'var(--red)',opacity:0.6}));
    svg.appendChild(el('text',{x:30,y:costY+18,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'Index:'));
    svg.appendChild(el('rect',{x:80,y:costY+9,width:idxCost/8,height:11,fill:'var(--green)',opacity:0.6}));
  }
  draw();
})();

/* ============================================================ 模块7: MVCC ============================================================ */
(()=>{
  const body=$('#body-mvcc');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">MVCC 版本链</div>
      <div class="desc">每行保存多个版本(xmin/xmax)，组成 Undo Log 版本链。事务根据快照判断可见性。点击操作观察版本链变化。</div>
      <div class="controls">
        <button class="btn primary" id="mc-update">UPDATE</button>
        <button class="btn" id="mc-txn">新事务(快照)</button>
        <button class="btn" id="mc-reset">重置</button>
        <div class="slider-row">查看事务 <input type="range" id="mc-view" min="1" max="5" value="5"><span class="val" id="mc-view-v">5</span></div>
      </div>
      <div class="svg-wrap"><svg id="mc-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">可见性判断规则</div>
      <div class="desc">版本 V 对事务 T(快照 S)可见当：<br>1. xmin 已提交且 xmin ∈ S(创建时已提交)<br>2. xmax 为空，或 xmax ∉ S(删除未发生)</div>
      <table class="cmp">
        <tr><th>字段</th><th>含义</th></tr>
        <tr><td>xmin</td><td>创建该版本的事务ID</td></tr>
        <tr><td>xmax</td><td>删除/更新该版本的事务ID</td></tr>
        <tr><td>ctid</td><td>指向新版本(物理位置)</td></tr>
      </table>
      <div class="stat-grid">
        <div class="stat"><div class="k">当前事务</div><div class="v acc" id="mc-cur">5</div></div>
        <div class="stat"><div class="k">可见版本</div><div class="v" id="mc-visible">v1</div></div>
        <div class="stat"><div class="k">版本数</div><div class="v" id="mc-count">1</div></div>
      </div>
    </div>`;
  const svg=$('#mc-svg');
  let versions=[{v:1,val:100,xmin:1,xmax:null}],nextTxn=2,viewTxn=5;
  $('#mc-view').oninput=e=>{viewTxn=+e.target.value;$('#mc-view-v').textContent=viewTxn;draw();};
  function draw(){
    svg.innerHTML='';
    $('#mc-cur').textContent=viewTxn;
    $('#mc-count').textContent=versions.length;
    // 版本链
    versions.forEach((ver,i)=>{
      const y=40+i*45;
      const visible=(!ver.xmax||ver.xmax>viewTxn)&&(ver.xmin<=viewTxn);
      const c=visible?'var(--green)':'var(--text3)';
      svg.appendChild(el('rect',{x:120,y,width:220,height:35,rx:6,fill:visible?'rgba(52,211,153,0.1)':'var(--bg3)',stroke:c,'stroke-width':visible?2:1.2}));
      svg.appendChild(el('text',{x:130,y:y+14,fill:c,'font-size':10,'font-family':'monospace'},'v'+ver.v+' val='+ver.val));
      svg.appendChild(el('text',{x:130,y:y+28,fill:'var(--text3)','font-size':9,'font-family':'monospace'},'xmin='+ver.xmin+' xmax='+(ver.xmax||'null')));
      if(visible){svg.appendChild(el('text',{x:300,y:y+20,fill:'var(--green)','font-size':10,'font-family':'monospace'},'<- 可见'));$('#mc-visible').textContent='v'+ver.v;}
      // 链接箭头
      if(i<versions.length-1){
        svg.appendChild(el('line',{x1:230,y1:y+35,x2:230,y2:y+45,stroke:'var(--text3)','stroke-width':1.2,'marker-end':'url(#mca)'}));
      }
    });
    svg.appendChild(el('defs')).innerHTML=`<marker id="mca" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--text3)"/></marker>`;
    svg.appendChild(el('text',{x:30,y:60,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'最新')); 
    svg.appendChild(el('line',{x1:60,y1:55,x2:115,y2:55,stroke:'var(--text3)','stroke-width':1,'marker-end':'url(#mca)'}));
    // undo log
    svg.appendChild(el('rect',{x:360,y:40,width:90,height:versions.length*45,fill:'var(--bg3)',stroke:'var(--border2)','stroke-width':1,rx:4}));
    svg.appendChild(el('text',{x:405,y:30,'text-anchor':'middle',fill:'var(--amber)','font-size':10,'font-family':'monospace'},'Undo Log'));
    versions.forEach((v,i)=>{
      svg.appendChild(el('text',{x:405,y:60+i*45,fill:'var(--text3)','font-size':9,'font-anchor':'middle','text-anchor':'middle'},'undo v'+v.v));
    });
  }
  $('#mc-update').onclick=()=>{
    const last=versions[versions.length-1];
    last.xmax=nextTxn;
    versions.push({v:last.v+1,val:last.val+50,xmin:nextTxn,xmax:null});
    nextTxn++;draw();toast('事务'+(nextTxn-1)+' UPDATE → 新版本 v'+versions[versions.length-1].v);
  };
  $('#mc-txn').onclick=()=>{nextTxn++;viewTxn=nextTxn;$('#mc-view').value=viewTxn;$('#mc-view-v').textContent=viewTxn;draw();toast('新事务 T'+nextTxn+' 开始');};
  $('#mc-reset').onclick=()=>{versions=[{v:1,val:100,xmin:1,xmax:null}];nextTxn=2;viewTxn=5;$('#mc-view').value=5;$('#mc-view-v').textContent=5;draw();};
  draw();
})();

/* ============================================================ 模块8: 分布式数据库 ============================================================ */
(()=>{
  const body=$('#body-distributed');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">分布式时钟与一致性</div>
      <div class="desc">切换方案。<strong>Spanner TrueTime</strong>：GPS/原子钟，commit wait 等待 ε；<strong>Clock-SI</strong>：逻辑时钟+快照隔离，依赖 NTP 同步。</div>
      <div class="controls">
        <button class="btn active" data-sch="tt">Spanner TrueTime</button>
        <button class="btn" data-sch="clocksi">Clock-SI</button>
        <button class="btn primary" id="dd-commit">提交事务</button>
      </div>
      <div class="svg-wrap"><svg id="dd-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">方案对比</div>
      <table class="cmp">
        <tr><th>维度</th><th>TrueTime</th><th>Clock-SI</th></tr>
        <tr><td>时钟源</td><td>GPS+原子钟</td><td>NTP</td></tr>
        <tr><td>误差</td><td>~7ms(有界)</td><td>较大(无界)</td></tr>
        <tr><td>外部一致性</td><td>保证</td><td>不保证</td></tr>
        <tr><td>延迟</td><td>commit wait</td><td>低</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">机制说明</div>
      <div class="desc" id="dd-desc"></div>
    </div>`;
  const svg=$('#dd-svg');
  let sch='tt',events=[],committing=false;
  const descs={
    tt:'TrueTime API 返回 TT.now()=[earliest, latest](误差 ε)。事务选 s=latest 作为时间戳，commit wait 2ε 后才提交，确保所有副本时间已超过 s → 外部一致性(线性)。',
    clocksi:'Clock-SI 用本地物理时钟作快照时间戳。读请求带上 ts，副本返回 ts 之前已提交版本。依赖 NTP 同步，时钟漂移可能导致 stale read，但延迟低。'
  };
  function updateDesc(){$('#dd-desc').textContent=descs[sch];}
  updateDesc();
  $$('#body-distributed [data-sch]').forEach(b=>b.onclick(()=>{
    $$('#body-distributed [data-sch]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');sch=b.dataset.sch;events=[];updateDesc();draw();
  }));
  function draw(){
    svg.innerHTML='';
    svg.appendChild(el('defs')).innerHTML=`<marker id="dda" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--accent)"/></marker>`;
    // 时间轴
    const x0=60,x1=440;
    svg.appendChild(el('line',{x1:x0,y1:140,x2:x1,y2:140,stroke:'var(--border2)','stroke-width':1}));
    // 副本
    [80,140,200].forEach((y,i)=>{
      svg.appendChild(el('text',{x:30,y,fill:'var(--accent)','font-size':10,'font-family':'monospace'},'R'+i));
      svg.appendChild(el('line',{x1:x0,y1:y-15,x2:x1,y2:y-15,stroke:'var(--border)','stroke-width':0.5,opacity:0.4}));
    });
    if(sch==='tt'){
      // TrueTime 不确定性区间
      const now=200;
      svg.appendChild(el('rect',{x:now-20,y:60,width:40,height:160,fill:'rgba(192,132,252,0.1)',stroke:'var(--accent)','stroke-width':1,'stroke-dasharray':'3 2'}));
      svg.appendChild(el('text',{x:now,y:55,'text-anchor':'middle',fill:'var(--accent)','font-size':9,'font-family':'monospace'},'ε 区间'));
      svg.appendChild(el('line',{x1:now,y1:60,x2:now,y2:220,stroke:'var(--accent)','stroke-width':1.5}));
      svg.appendChild(el('text',{x:now,y:235,'text-anchor':'middle',fill:'var(--accent)','font-size':9,'font-family':'monospace'},'s=latest'));
      // commit wait
      svg.appendChild(el('rect',{x:now,y:140,width:60,height:6,fill:'var(--amber)',opacity:0.6}));
      svg.appendChild(el('text',{x:now+30,y:135,'text-anchor':'middle',fill:'var(--amber)','font-size':9,'font-family':'monospace'},'commit wait 2ε'));
      svg.appendChild(el('line',{x1:now+60,y1:140,x2:now+60,y2:80,stroke:'var(--green)','stroke-width':1.5,'marker-end':'url(#dda)'}));
      svg.appendChild(el('text',{x:now+60,y:75,'text-anchor':'middle',fill:'var(--green)','font-size':9,'font-family':'monospace'},'commit'));
    }else{
      // Clock-SI 本地时钟
      const ts=[180,200,220];
      ts.forEach((t,i)=>{
        svg.appendChild(el('line',{x1:t,y1:65+i*55,x2:t,y2:80+i*55,stroke:'var(--amber)','stroke-width':1.5}));
        svg.appendChild(el('circle',{cx:t,cy:80+i*55,r:4,fill:'var(--amber)'}));
        svg.appendChild(el('text',{x:t,y:60+i*55,'text-anchor':'middle',fill:'var(--amber)','font-size':9,'font-family':'monospace'},'ts='+t));
      });
      svg.appendChild(el('text',{x:230,y:240,'text-anchor':'middle',fill:'var(--text3)','font-size':9,'font-family':'monospace'},'各副本本地时钟(NTP 同步)'));
    }
    // events
    events.forEach((e,i)=>{
      svg.appendChild(el('circle',{cx:e.x,cy:e.y,r:5,fill:e.color}));
    });
  }
  $('#dd-commit').onclick=()=>{
    if(sch==='tt'){
      toast('Spanner: 选 s=latest → commit wait 2ε → 提交');
      events.push({x:260,y:80,color:'var(--green)'});
    }else{
      toast('Clock-SI: 本地 ts → 快照读 → 提交');
      events.push({x:200,y:80,color:'var(--green)'});
    }
    draw();
    setTimeout(()=>{events=[];draw();},2000);
  };
  draw();
})();

/* ============================================================ 底部导航 ============================================================ */
const sections=$$('.module');
function updateBottomNav(){
  const scrollY=window.scrollY+120;let cur=0;
  sections.forEach((s,i)=>{if(s.offsetTop<=scrollY)cur=i;});
  $('#bnPrevName').textContent=cur>0?MODULES[cur-1].name:'—';
  $('#bnNextName').textContent=cur<MODULES.length-1?MODULES[cur+1].name:'—';
  $('#bnPrev').setAttribute('disabled',cur===0);
  $('#bnNext').setAttribute('disabled',cur===MODULES.length-1);
  $('#bnPrev').onclick=()=>cur>0&&sections[cur-1].scrollIntoView({behavior:'smooth'});
  $('#bnNext').onclick=()=>cur<MODULES.length-1&&sections[cur+1].scrollIntoView({behavior:'smooth'});
  $$('.nav-pill').forEach((p,i)=>p.classList.toggle('active',i===cur));
}
window.addEventListener('scroll',updateBottomNav,{passive:true});
updateBottomNav();
</script>
