.apulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.aglow{animation:glow 2.5s ease-in-out infinite}

.adash{stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.ablink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
