<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SurfSense — 开源NotebookLM平替 · 可视化实验室</title>
<style>
:root{
--bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
--border:#1e2433;--border2:#2a3144;
--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
--teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;--red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;--pink:#f472b6;--green:#34d399;
--mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden;min-height:100vh}
.app{max-width:1300px;margin:0 auto;padding:16px}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;position:relative;overflow:hidden}
.app-header::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--cyan),var(--purple),var(--blue))}
.ah-left{display:flex;align-items:center;gap:14px}
.ah-badge{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;letter-spacing:1px}
.ah-title{font-size:17px;font-weight:700;letter-spacing:0.5px}
.ah-sub{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:1px}
.ah-tags{display:flex;gap:8px}
.ah-tag{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border2);color:var(--teal);background:rgba(0,212,170,0.06)}
.ah-tag.c2{color:var(--cyan);background:rgba(34,211,238,0.06)}
.ah-tag.c3{color:var(--purple);background:rgba(167,139,250,0.06)}
.ah-tag.c4{color:var(--amber);background:rgba(251,191,36,0.06)}
.module-nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.nav-btn{display:flex;flex-direction:column;align-items:center;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.2s;min-width:92px;font-family:inherit}
.nav-btn:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px)}
.nav-btn.active{border-color:var(--teal);background:rgba(0,212,170,0.08);box-shadow:0 0 12px rgba(0,212,170,0.15)}
.nav-n{font-size:10px;color:var(--text3);font-family:var(--mono);font-weight:700;letter-spacing:1px}
.nav-btn.active .nav-n{color:var(--teal)}
.nav-t{font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap}
.nav-btn.active .nav-t{color:var(--text);font-weight:600}
.lab-hero{padding:26px 24px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:14px;margin-bottom:14px;position:relative;overflow:hidden}
.lab-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),var(--cyan),transparent)}
.hero-eyebrow{font-size:11px;color:var(--text3);font-family:var(--mono);letter-spacing:2px;margin-bottom:8px}
.hero-eyebrow span{color:var(--teal);font-weight:700}
.hero-title{font-size:26px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
.hero-desc{font-size:13px;color:var(--text2);line-height:1.6;max-width:860px}
.hero-meta{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.hm-item{display:flex;flex-direction:column;gap:2px;padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.hm-k{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.hm-v{font-size:13px;color:var(--teal);font-weight:600}
.module-panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.mp-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 12px}
.mp-tab{padding:12px 18px;background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;font-family:inherit}
.mp-tab:hover{color:var(--text2)}
.mp-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.mp-body{display:flex;gap:0}
.svg-wrap{flex:1;padding:14px;min-width:0}
#svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.mp-side{width:260px;flex-shrink:0;padding:14px;border-left:1px solid var(--border);background:var(--bg3)}
.side-set{display:flex;flex-direction:column;gap:16px}
.sb{display:flex;flex-direction:column;gap:8px}
.sb-t{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text2)}
.pd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:6px}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.info{display:flex;flex-direction:column;gap:5px}
.info-row{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;background:var(--bg);border-radius:5px;font-size:11px}
.info-k{color:var(--text3)}
.info-v{color:var(--text2);font-weight:600;text-align:right}
.apulse{animation:apulse 2s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:0.35}}
.aglow{animation:aglow 2.5s ease-in-out infinite}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
.adash{stroke-dasharray:6 4;animation:adash 0.8s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.5s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:0.25}}
.aspin{animation:aspin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes aspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.app-footer{text-align:center;padding:16px;font-size:11px;color:var(--text3);letter-spacing:0.5px}
@media(max-width:960px){.mp-body{flex-direction:column}.mp-side{width:100%;border-left:none;border-top:1px solid var(--border)}.nav-btn{min-width:72px;padding:8px 10px}.ah-tags{display:none}.hero-title{font-size:22px}}
</style>
</head>

</defs>

</div>
<div class="mp-side">

</div>

<footer class="app-footer">SurfSense · 开源NotebookLM平替 · 私有化AI研究助手 · 15K+ GitHub Stars · 混合语义全文搜索 · MCP服务器集成 · MIT License · 2026</footer>

<script>

/* ==================== NAV & TABS ==================== */
function buildNav(){
var n=$('modNav');clearNode(n);
for(var i=0;i<MODULES.length;i++){
var b=document.createElement('button');
b.className='nav-btn'+(i===mCur?' active':'');
b.innerHTML='<span class="nav-n">'+MODULES[i].n+'</span><span class="nav-t">'+MODULES[i].t+'</span>';
b.onclick=function(idx){return function(){drawModule(idx);};}(i);
n.appendChild(b);
}
}
function buildTabs(mi){
var t=$('mpTabs');clearNode(t);
for(var i=0;i<3;i++){
var b=document.createElement('button');
b.className='mp-tab'+(i===mViews[mi]?' active':'');
b.textContent=MODULES[mi].v[i];
b.onclick=function(mi2,vi2){return function(){setView(mi2,vi2);};}(mi,i);
t.appendChild(b);
}
}
function setView(mi,vi){mViews[mi]=vi;drawModule(mi);}
function drawModule(mi){
mCur=mi;mLayers.main=$('layer');var layer=mLayers.main;clearNode(layer);
$('heroNum').textContent='0'+(mi+1);
$('heroTitle').textContent=MODULES[mi].t;
$('heroDesc').textContent=M_DESC[mi];
var hm=$('heroMeta');clearNode(hm);var meta=M_META[mi];
for(var i=0;i<meta.length;i++){
var d=document.createElement('div');d.className='hm-item';
d.innerHTML='<span class="hm-k">'+meta[i].k+'</span><span class="hm-v">'+meta[i].v+'</span>';
hm.appendChild(d);
}
buildNav();buildTabs(mi);
var fns=[drawM1,drawM2,drawM3,drawM4,drawM5,drawM6,drawM7,drawM8];
fns[mi](layer,mViews[mi]);
}
