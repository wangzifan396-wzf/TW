<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:14px;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
.app-header{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;height:54px;padding:0 20px}
.hub-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);padding:6px 12px;border:1px solid var(--border);border-radius:6px;transition:.2s;white-space:nowrap}
.hub-link:hover{color:var(--teal);border-color:var(--teal)}
.header-title{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-title .sep{color:var(--text3);margin:0 8px}
.header-title .ac{color:var(--teal)}
.header-badge{font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:10px;letter-spacing:.1em;color:var(--teal);background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.16);padding:3px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.module-nav{position:sticky;top:54px;z-index:40;background:rgba(10,11,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px}
.nav-btn{font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;font-size:12.5px;font-weight:500;color:var(--text2);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 13px;cursor:pointer;transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav-btn .nidx{font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:10px;color:var(--text3)}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--teal);background:rgba(0,212,170,.08);border-color:rgba(0,212,170,.16);font-weight:600}
.nav-btn.active .nidx{color:var(--teal)}
.lab-main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.lab-hero{margin-bottom:24px}
.lab-hero .tag{display:inline-block;font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:11px;letter-spacing:.12em;color:var(--teal);background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.16);padding:3px 9px;border-radius:4px;margin-bottom:14px;text-transform:uppercase}
.lab-hero h1{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.22;margin-bottom:10px}
.lab-hero h1 .grad{background:linear-gradient(120deg,var(--teal),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lab-hero p{color:var(--text2);font-size:14px;max-width:830px;line-height:1.65}
.module-panel{display:block;animation:mFade .4s ease}
@keyframes mFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.m-head .num{font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:12px;color:var(--teal);background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.16);padding:2px 8px;border-radius:4px}
.m-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.m-desc{color:var(--text2);font-size:13px;margin-bottom:16px;max-width:830px;line-height:1.6}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.btn{font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;font-size:12.5px;font-weight:500;color:var(--text);background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:8px 15px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.active{background:rgba(0,212,170,.08);border-color:rgba(0,212,170,.16);color:var(--teal);font-weight:600}
.viz-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;overflow:hidden;position:relative}
.viz-wrap svg{display:block;width:100%;height:auto}
.stat-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.legend-row{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text2);margin-bottom:14px;font-family:'SF Mono','JetBrains Mono',Consolas,monospace}
.leg-item{display:inline-flex;align-items:center;gap:6px}
.leg-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.info-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:15px;transition:.2s}
.info-card:hover{border-color:rgba(0,212,170,.16)}
svg text{fill:var(--text);font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif}
.apulse{animation:apulse 1.8s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.3}}
.aglow{animation:aglow 2s ease-in-out infinite}
@keyframes aglow{0%,100%{opacity:.4}50%{opacity:1}}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.5s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{transform-origin:center;transform-box:fill-box;animation:aspin 12s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
@media(max-width:760px){
  .header-title{font-size:12px}
  .lab-hero h1{font-size:21px}
  .nav-btn{font-size:11px;padding:6px 9px}
  .nav-btn .nidx{display:none}
  .info-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<header class="app-header">
  <div class="header-inner">
    <a href="index.html" class="hub-link">&#8592; TW Hub</a>

</header>
<nav class="module-nav"><div class="nav-inner" id="nav-inner"></div></nav>
<main class="lab-main">
  <div class="lab-hero">

    <h1>AI制药与<span class="grad">蛋白质设计2.0</span>可视化实验室</h1>
    <p>AlphaFold 3突破——联合预测蛋白/抗体/核酸/小分子复合物,2亿蛋白结构数字化,FDA AI药物开发指南(2026年7月),打破"10年10亿"双十定律,制药研发范式重构。8大模块、24个视图,系统呈现AI如何重塑药物发现全链路。</p>

        <g id="layer-m1"></g><g id="layer-m2"></g><g id="layer-m3"></g><g id="layer-m4"></g>

</main>
<script>
/* ===== 常量与工具函数 ===== */
var SVGNS='http://www.w3.org/2000/svg';
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){el.setAttribute(k,attrs[k]);}}
  if(parent){parent.appendChild(el);}
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild){n.removeChild(n.firstChild);}}

function box(g,x,y,w,h,fill,stroke,rw){
  return E(g,'rect',{x:x,y:y,width:w,height:h,fill:fill||C.bg3,stroke:stroke||C.border2,'stroke-width':1.5,rx:rw||6});
}
function txt(g,x,y,s,fs,fill,anchor,weight){
  var t=E(g,'text',{x:x,y:y,fill:fill||C.text,'font-size':fs||13,'text-anchor':anchor||'start'});
  if(weight){t.setAttribute('font-weight',weight);}
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,stroke,sw,dash){
  var a={'x1':x1,'y1':y1,'x2':x2,'y2':y2,'stroke':stroke||C.border2,'stroke-width':sw||1.5};
  if(dash){a['stroke-dasharray']=dash;}
  return E(g,'line',a);
}
function arrow(g,x1,y1,x2,y2,stroke,sw){
  var s=stroke||C.cyan,w=sw||2;
  line(g,x1,y1,x2,y2,s,w);
  var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<2)return;
  var ux=dx/len,uy=dy/len,px=-uy,py=ux,hl=7,hw=4;
  var hx=x2-ux*hl,hy=y2-uy*hl;
  E(g,'polygon',{points:x2+','+y2+' '+(hx+px*hw)+','+(hy+py*hw)+' '+(hx-px*hw)+','+(hy-py*hw),fill:s});
}
function circ(g,cx,cy,r,fill,stroke,sw){
  return E(g,'circle',{cx:cx,cy:cy,r:r,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5});
}
function poly(g,pts,fill,stroke,sw){
  return E(g,'polygon',{points:pts,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5});
}
function pathD(g,d,fill,stroke,sw){
  return E(g,'path',{d:d,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5});
}
function radar(g,cx,cy,r,labels,values,color){
  var n=labels.length,i,ang,rr,pts,dpts;
  for(var ly=1;ly<=4;ly++){
    pts=[];
    for(i=0;i<n;i++){ang=-Math.PI/2+i*2*Math.PI/n;rr=r*ly/4;pts.push((cx+Math.cos(ang)*rr)+','+(cy+Math.sin(ang)*rr));}
    E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:C.border,'stroke-width':1});
  }
  for(i=0;i<n;i++){ang=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,C.border,1);}
  dpts=[];
  for(i=0;i<n;i++){ang=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];dpts.push((cx+Math.cos(ang)*rr)+','+(cy+Math.sin(ang)*rr));}
  E(g,'polygon',{points:dpts.join(' '),fill:color,opacity:0.18,stroke:color,'stroke-width':2});
  for(i=0;i<n;i++){ang=-Math.PI/2+i*2*Math.PI/n;txt(g,cx+Math.cos(ang)*(r+22),cy+Math.sin(ang)*(r+22)+4,labels[i],11,C.text2,'middle');}
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function setPills(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var s=document.createElement('span');s.className='pill';
    s.style.borderColor=arr[i][1];s.style.color=arr[i][1];s.textContent=arr[i][0];
    el.appendChild(s);
  }
}
function setLegend(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('span');d.className='leg-item';
    var dot=document.createElement('span');dot.className='leg-dot';dot.style.background=arr[i][1];
    var t=document.createElement('span');t.textContent=arr[i][0];
    d.appendChild(dot);d.appendChild(t);el.appendChild(d);
  }
}
function setInfo(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='info-card';
    var k=document.createElement('div');
    k.style.cssText='font-size:10.5px;color:'+C.teal+';text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px';
    k.textContent=arr[i][0];
    var v=document.createElement('div');
    v.style.cssText='font-size:14px;font-weight:600;margin-bottom:4px';v.style.color=arr[i][2]||C.teal;
    v.textContent=arr[i][1];
    var ds=document.createElement('div');ds.style.cssText='font-size:12px;color:'+C.text3;ds.textContent=arr[i][3]||'';
    d.appendChild(k);d.appendChild(v);d.appendChild(ds);el.appendChild(d);
  }
}
function barV(g,x,y,w,h,fill,stroke){
  E(g,'rect',{x:x,y:y,width:w,height:Math.max(h,1),fill:fill,opacity:0.7,rx:3});
  E(g,'rect',{x:x,y:y,width:w,height:Math.max(h,1),fill:'none',stroke:stroke,'stroke-width':1.5,rx:3});
}

/* ===== 模块定义 ===== */
var MODULES=[
  {n:'01',t:'AI制药2.0与AlphaFold 3革命',d:'联合预测蛋白/抗体/核酸/小分子复合物,2亿蛋白结构数字化,打破双十定律',v:['AlphaFold 3联合预测','2亿蛋白结构数字化','打破双十定律']},
  {n:'02',t:'蛋白质结构预测与靶点挖掘',d:'AlphaFold3准确率急剧攀升,药物-靶点结合模拟,靶点发现全流程',v:['AF3准确率攀升','药物-靶点结合','靶点发现流程']},
  {n:'03',t:'分子设计与虚拟筛选',d:'候选药物分子预测,结合亲和力验证,虚拟筛选pipeline,先导化合物优化',v:['候选分子预测','结合亲和力验证','虚拟筛选流水线']},
  {n:'04',t:'FDA AI药物指南与合规',d:'2026年7月FDA指南,模型版本/训练数据/推理日志追溯,区块链合规',v:['FDA指南时间线','模型追溯体系','区块链合规']},
  {n:'05',t:'AI制药产业链与国产化',d:'国产AI制药龙头,本地化部署,摆脱海外模型限制,IND申报增长',v:['国产AI制药龙头','本地化部署','IND申报增长']},
  {n:'06',t:'蛋白质设计与新疗法',d:'de novo蛋白设计,抗体工程,酶催化剂设计,农业抗病/环保降解',v:['de novo蛋白设计','抗体工程','酶催化剂设计']},
  {n:'07',t:'AI制药ROI与临床转化',d:'研发周期缩短,成本降低,临床成功率提升,3款AI药物进入临床',v:['研发周期缩短','成本降低','临床转化']},
  {n:'08',t:'AI制药终局与生命科学革命',d:'生命乐高图纸,万能分子组装,精准医疗,生命科学范式重构',v:['生命乐高图纸','万能分子组装','生命科学范式']}
];

/* ===== 模块系统 ===== */
var mCur=0;
var mViews=[0,0,0,0,0,0,0,0];
var mLayers={};

function setView(mi,vi){mViews[mi]=vi;drawModule(mi);}
function switchModule(mi){
  var btns=document.querySelectorAll('.nav-btn');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',i===mi);}
  drawModule(mi);
}
function drawModule(mi){
  mCur=mi;
  var m=MODULES[mi];
  $('m-num').textContent=m.n;
  $('m-title').textContent=m.t;
  $('m-desc').textContent=m.d;
  var tabs=$('view-tabs');clearNode(tabs);
  for(var i=0;i<3;i++){
    (function(idx){
      var btn=document.createElement('button');
      btn.className='btn'+(mViews[mi]===idx?' active':'');
      btn.textContent=m.v[idx];
      btn.onclick=function(){setView(mi,idx);};
      tabs.appendChild(btn);
    })(i);
  }
  for(var i=0;i<8;i++){
    var layer=mLayers['m'+(i+1)];
    if(layer)layer.style.display=(i===mi)?'':'none';
    var s=$('m'+(i+1)+'-stat'),l=$('m'+(i+1)+'-leg'),inf=$('m'+(i+1)+'-info');
    if(s)s.style.display=(i===mi)?'flex':'none';
    if(l)l.style.display=(i===mi)?'flex':'none';
    if(inf)inf.style.display=(i===mi)?'grid':'none';
  }
  var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
  fns[mi]();
}

/* ===== M1: AI制药2.0与AlphaFold 3革命 ===== */
function m1Draw(){
  var g=mLayers.m1;clearNode(g);gridBg(g,900,480);
  var v=mViews[0];
  if(v===0){
    txt(g,450,28,'AlphaFold 3: 联合预测复合物结构',16,C.text,'middle','700');
    txt(g,450,48,'蛋白 + 抗体 + 核酸 + 小分子 — 一次预测全复合物',12,C.text2,'middle');
    var cx=450,cy=260;
    pathD(g,'M'+cx+','+(cy-55)+' C'+(cx+75)+','+(cy-75)+' '+(cx+85)+','+(cy+15)+' '+cx+','+(cy+55)+' C'+(cx-85)+','+(cy+35)+' '+(cx-75)+','+(cy-65)+' '+cx+','+(cy-55)+' Z','rgba(0,212,170,0.06)',C.teal,2);
    var pa=[[cx,cy-35],[cx+35,cy-15],[cx+42,cy+12],[cx+25,cy+32],[cx-25,cy+32],[cx-42,cy+12],[cx-35,cy-15],[cx,cy+5]];
    for(var i=0;i<pa.length;i++){circ(g,pa[i][0],pa[i][1],7,'rgba(0,212,170,0.3)',C.teal,1.5);}
    for(var i=0;i<pa.length-1;i++){line(g,pa[i][0],pa[i][1],pa[i+1][0],pa[i+1][1],C.teal,1);}
    txt(g,cx,cy+80,'蛋白质',12,C.teal,'middle','600');
    var ax=180,ay=250;
    line(g,ax,ay,ax-35,ay-45,C.cyan,2.5);line(g,ax,ay,ax+35,ay-45,C.cyan,2.5);line(g,ax,ay,ax,ay+45,C.cyan,2.5);
    circ(g,ax,ay,9,'rgba(34,211,238,0.2)',C.cyan,1.5);circ(g,ax-35,ay-45,6,'rgba(34,211,238,0.2)',C.cyan,1.5);
    circ(g,ax+35,ay-45,6,'rgba(34,211,238,0.2)',C.cyan,1.5);circ(g,ax,ay+45,6,'rgba(34,211,238,0.2)',C.cyan,1.5);
    txt(g,ax,ay+70,'抗体',12,C.cyan,'middle','600');
    var nx=730,ny=170;

/* ===== 初始化 ===== */
function init(){
  mLayers={m1:$('layer-m1'),m2:$('layer-m2'),m3:$('layer-m3'),m4:$('layer-m4'),
    m5:$('layer-m5'),m6:$('layer-m6'),m7:$('layer-m7'),m8:$('layer-m8')};
  var nav=$('nav-inner');
  for(var i=0;i<8;i++){
    (function(idx){
      var btn=document.createElement('button');
      btn.className='nav-btn'+(idx===0?' active':'');
      btn.innerHTML='<span class="nidx">'+MODULES[idx].n+'</span> '+MODULES[idx].t;
      btn.onclick=function(){switchModule(idx);};
      nav.appendChild(btn);
    })(i);
  }
  var container=$('extra-container');
  for(var i=0;i<8;i++){
    var mi=i+1;
    var sd=document.createElement('div');sd.className='stat-bar';sd.id='m'+mi+'-stat';sd.style.display='none';container.appendChild(sd);
    var ld=document.createElement('div');ld.className='legend-row';ld.id='m'+mi+'-leg';ld.style.display='none';container.appendChild(ld);
    var id=document.createElement('div');id.className='info-grid';id.id='m'+mi+'-info';id.style.display='none';container.appendChild(id);
  }
  drawModule(0);
}
window.addEventListener('DOMContentLoaded',init);
/* ===== End of AI制药与蛋白质设计2.0 可视化实验室 ===== */
</script>
