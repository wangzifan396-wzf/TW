<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data-Centric AI Viz Lab — 以数据为中心的 AI 可视化实验室</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#fb923c;--accent2:#f97316;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;overflow-x:hidden}
.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(251,146,60,.3)}
.logo-mark svg{width:16px;height:16px}
.nav-modules{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 0}
.nav-modules::-webkit-scrollbar{display:none}
.nav-mod{padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text3);white-space:nowrap;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace}
.nav-mod:hover{background:var(--bg3);color:var(--text)}
.nav-mod.active{background:rgba(251,146,60,.12);color:var(--accent)}
.hero{max-width:1200px;margin:0 auto;padding:64px 24px 48px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border2);border-radius:999px;font-size:12px;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;margin-bottom:20px}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:16px}
.hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:var(--text2);max-width:640px}
.hero-stats{display:flex;gap:32px;margin-top:32px}
.hero-stat .num{font-size:24px;font-weight:700;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace}
.hero-stat .lbl{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.modules{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:flex;flex-direction:column;gap:32px}
.module{scroll-margin-top:80px}
.module-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color .3s}
.module-card:hover{border-color:var(--border2)}
.module-head{padding:28px 32px 0;display:flex;align-items:flex-start;gap:16px}
.module-num{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);padding:4px 8px;border:1px solid rgba(251,146,60,.3);border-radius:6px;background:rgba(251,146,60,.06)}
.module-title{flex:1}
.module-title h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.module-title p{font-size:14px;color:var(--text2);max-width:760px}
.module-body{padding:24px 32px 32px}
.viz-wrap{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:24px;min-height:280px;position:relative;overflow:hidden}
.viz-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{padding:7px 14px;border:1px solid var(--border2);border-radius:8px;background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:rgba(251,146,60,.15);border-color:var(--accent);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
.slider-row input[type=range]{-webkit-appearance:none;width:160px;height:4px;background:var(--border2);border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(251,146,60,.5)}
.val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:36px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--text3)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px}
.bottom-nav{max-width:1200px;margin:0 auto;padding:24px 24px 64px;display:flex;justify-content:space-between;gap:16px}
.bn-btn{flex:1;padding:16px 20px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:4px}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn.next{text-align:right;align-items:flex-end}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.bn-btn .ttl{font-size:14px;color:var(--text);font-weight:500}
.bn-btn:hover .ttl{color:var(--accent)}
footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--text3);font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace}
svg{display:block}
.node-rect{transition:.25s}
.node-rect:hover{filter:brightness(1.3)}
.flow-line{stroke-dasharray:4 4;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="8" ry="3" stroke="#08090a" stroke-width="2"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6" stroke="#08090a" stroke-width="2"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" stroke="#08090a" stroke-width="2"/></svg></div>
      <span>Data-Centric AI Viz Lab</span>
    </div>
    <nav class="nav-modules" id="navModules"></nav>
  </div>
</header>

<section class="hero">
  <div class="hero-badge"><span class="dot"></span> AI/ML 可视化实验室 · 以数据为中心的 AI</div>
  <h1>Data-Centric AI<br><span class="grad">可视化实验室</span></h1>
  <p>从数据质量到数据飞轮，探索"固定模型、优化数据"的新范式。本实验室通过 8 个交互式模块，可视化以数据为中心的 AI 全流程。</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">8</div><div class="lbl">Modules</div></div>
    <div class="hero-stat"><div class="num">Data</div><div class="lbl">First Paradigm</div></div>
    <div class="hero-stat"><div class="num">Flywheel</div><div class="lbl">Feedback Loop</div></div>
  </div>
</section>

<div class="modules" id="modules"></div>

<div class="bottom-nav" id="bottomNav"></div>

<footer>Data-Centric AI Viz Lab · 纯 HTML/CSS/JS + SVG · Linear 暗色美学</footer>

<script>
const MODULES=[
  {id:'m1',num:'01',title:'Data-Centric vs Model-Centric',desc:'范式转变 — 从"固定数据调模型"到"固定模型调数据"。'},
  {id:'m2',num:'02',title:'数据质量维度',desc:'完整性、一致性、准确性、时效性 — 衡量数据好坏的四大维度。'},
  {id:'m3',num:'03',title:'数据增强',desc:'图像/文本/音频增强策略 — 用变换扩展训练数据多样性。'},
  {id:'m4',num:'04',title:'主动学习',desc:'Active Learning 选择策略 — 让模型主动挑选最有价值的样本标注。'},
  {id:'m5',num:'05',title:'数据标注',desc:'弱监督、众包标注 — 低成本获取大规模标注的工程方法。'},
  {id:'m6',num:'06',title:'数据版本管理',desc:'DVC, 数据血缘 — 像管理代码一样管理数据集版本与血缘。'},
  {id:'m7',num:'07',title:'合成数据',desc:'GAN/Diffusion 生成训练数据 — 用生成模型补充稀缺数据。'},
  {id:'m8',num:'08',title:'数据飞轮',desc:'数据反馈闭环 — 真实使用数据回流持续优化模型与数据。'}
];

const navEl=document.getElementById('navModules');
MODULES.forEach((m,i)=>{const a=document.createElement('a');a.className='nav-mod';a.href='#'+m.id;a.textContent=(i+1)+'';a.dataset.target=m.id;navEl.appendChild(a);});

const modEl=document.getElementById('modules');
MODULES.forEach(m=>{
  const sec=document.createElement('section');sec.className='module';sec.id=m.id;
  sec.innerHTML=`<div class="module-card"><div class="module-head"><span class="module-num">${m.num}</span><div class="module-title"><h2>${m.title}</h2><p>${m.desc}</p></div></div><div class="module-body"><div class="viz-wrap" id="viz-${m.id}"></div></div></div>`;
  modEl.appendChild(sec);
});

const bn=document.getElementById('bottomNav');
bn.innerHTML=`<a class="bn-btn prev" href="#m8"><span class="lbl">Prev</span><span class="ttl">数据飞轮</span></a><a class="bn-btn next" href="#m2"><span class="lbl">Next</span><span class="ttl">数据质量维度</span></a>`;

const navLinks=[...document.querySelectorAll('.nav-mod')];
const sections=MODULES.map(m=>document.getElementById(m.id));
window.addEventListener('scroll',()=>{
  let cur=0;sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<120)cur=i;});
  navLinks.forEach((l,i)=>l.classList.toggle('active',i===cur));
  const prevI=(cur-1+MODULES.length)%MODULES.length,nextI=(cur+1)%MODULES.length;
  bn.innerHTML=`<a class="bn-btn prev" href="#${MODULES[prevI].id}"><span class="lbl">Prev</span><span class="ttl">${MODULES[prevI].title}</span></a><a class="bn-btn next" href="#${MODULES[nextI].id}"><span class="lbl">Next</span><span class="ttl">${MODULES[nextI].title}</span></a>`;
});
navLinks[0].classList.add('active');

/* ===== MODULE 1: Data-Centric vs Model-Centric ===== */
(function(){
  const el=document.getElementById('viz-m1');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px">
    <defs><marker id="a1arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#fb923c"/></marker></defs>
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">两种范式对比（点击切换视角）</text>
    <!-- Model-Centric -->
    <g id="m1mc">
      <rect x="40" y="50" width="320" height="220" rx="12" fill="#0f1115" stroke="#2a2d35"/>
      <text x="200" y="78" text-anchor="middle" fill="#a1a1aa" font-size="13" font-weight="600">Model-Centric 模型为中心</text>
      <text x="200" y="96" text-anchor="middle" fill="#71717a" font-size="10">数据固定，不断调模型</text>
      <!-- fixed data -->
      <rect x="70" y="120" width="100" height="60" rx="6" fill="rgba(113,113,122,.15)" stroke="#71717a" stroke-dasharray="4 4"/>
      <text x="120" y="150" text-anchor="middle" fill="#71717a" font-size="11">数据</text>
      <text x="120" y="166" text-anchor="middle" fill="#71717a" font-size="9">(固定)</text>
      <!-- models stack -->
      <rect x="200" y="110" width="40" height="80" rx="4" fill="rgba(251,146,60,.1)" stroke="#fb923c"/>
      <rect x="210" y="100" width="40" height="80" rx="4" fill="rgba(251,146,60,.15)" stroke="#fb923c"/>
      <rect x="220" y="90" width="40" height="80" rx="4" fill="rgba(251,146,60,.2)" stroke="#fb923c"/>
      <text x="240" y="210" text-anchor="middle" fill="#fb923c" font-size="10">V1→V2→V3...</text>
      <path d="M170 150 L200 150" stroke="#71717a" stroke-width="1.5" marker-end="url(#a1arr)"/>
      <text x="200" y="245" text-anchor="middle" fill="#71717a" font-size="10">收益递减 · 边际成本高</text>
    </g>
    <!-- Data-Centric -->
    <g id="m1dc">
      <rect x="400" y="50" width="320" height="220" rx="12" fill="rgba(251,146,60,.06)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="560" y="78" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="600">Data-Centric 数据为中心</text>
      <text x="560" y="96" text-anchor="middle" fill="#71717a" font-size="10">模型固定，不断优化数据</text>
      <!-- fixed model -->
      <rect x="430" y="120" width="100" height="60" rx="6" fill="rgba(113,113,122,.15)" stroke="#71717a" stroke-dasharray="4 4"/>
      <text x="480" y="150" text-anchor="middle" fill="#71717a" font-size="11">模型</text>
      <text x="480" y="166" text-anchor="middle" fill="#71717a" font-size="9">(固定)</text>
      <!-- data improvements -->
      <rect x="560" y="110" width="50" height="22" rx="4" fill="rgba(251,146,60,.15)" stroke="#fb923c"/><text x="585" y="125" text-anchor="middle" fill="#fb923c" font-size="8">清洗</text>
      <rect x="560" y="138" width="50" height="22" rx="4" fill="rgba(251,146,60,.15)" stroke="#fb923c"/><text x="585" y="153" text-anchor="middle" fill="#fb923c" font-size="8">标注</text>
      <rect x="560" y="166" width="50" height="22" rx="4" fill="rgba(251,146,60,.15)" stroke="#fb923c"/><text x="585" y="181" text-anchor="middle" fill="#fb923c" font-size="8">增强</text>
      <rect x="620" y="124" width="50" height="22" rx="4" fill="rgba(251,146,60,.15)" stroke="#fb923c"/><text x="645" y="139" text-anchor="middle" fill="#fb923c" font-size="8">去偏</text>
      <rect x="620" y="152" width="50" height="22" rx="4" fill="rgba(251,146,60,.15)" stroke="#fb923c"/><text x="645" y="167" text-anchor="middle" fill="#fb923c" font-size="8">合成</text>
      <path d="M530 150 L560 150" stroke="#fb923c" stroke-width="1.5" marker-end="url(#a1arr)" class="flow-line"/>
      <text x="560" y="245" text-anchor="middle" fill="#fb923c" font-size="10">收益持续 · 可解释性强</text>
    </g>
  </svg>
  <div class="viz-controls">
    <button class="btn active" data-v="both">对比</button>
    <button class="btn" data-v="mc">仅 Model-Centric</button>
    <button class="btn" data-v="dc">仅 Data-Centric</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">Andrew Ng 倡导的 <span style="color:var(--accent)">Data-Centric AI</span> 认为：当模型架构趋于成熟，优化数据质量比堆模型参数收益更大、更可控。</p>`;
  el.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    const v=b.dataset.v;
    document.getElementById('m1mc').style.opacity=(v==='dc')?.25:1;
    document.getElementById('m1dc').style.opacity=(v==='mc')?.25:1;
  }));
})();

/* ===== MODULE 2: 数据质量维度 ===== */
(function(){
  const el=document.getElementById('viz-m2');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px" id="m2svg">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">数据质量雷达（拖动滑块评估数据集）</text>
    <g id="m2radar"></g>
  </svg>
  <div class="viz-controls">
    <div class="slider-row"><span>完整性</span><input type="range" id="m2s1" min="0" max="100" value="85"><span class="val" id="m2v1">85</span></div>
    <div class="slider-row"><span>一致性</span><input type="range" id="m2s2" min="0" max="100" value="70"><span class="val" id="m2v2">70</span></div>
    <div class="slider-row"><span>准确性</span><input type="range" id="m2s3" min="0" max="100" value="90"><span class="val" id="m2v3">90</span></div>
    <div class="slider-row"><span>时效性</span><input type="range" id="m2s4" min="0" max="100" value="60"><span class="val" id="m2v4">60</span></div>
    <div class="slider-row"><span>独特性</span><input type="range" id="m2s5" min="0" max="100" value="75"><span class="val" id="m2v5">75</span></div>
  </div>
  <div id="m2score" style="margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:13px"></div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">数据质量是 <span style="color:var(--accent)">多维</span> 的：完整性（缺值率）、一致性（格式统一）、准确性（标注正确）、时效性（数据新鲜度），任一维度差都会拖累模型。</p>`;
  const radar=document.getElementById('m2radar');
  const labels=['完整性','一致性','准确性','时效性','独特性'];
  const sliders=[1,2,3,4,5].map(i=>document.getElementById('m2s'+i));
  const vals=[1,2,3,4,5].map(i=>document.getElementById('m2v'+i));
  const score=document.getElementById('m2score');
  const cx=380,cy=170,R=100;
  function draw(){
    const v2=sliders.map(s=>+s.value);vals.forEach((v,i)=>v.textContent=v2[i]);
    let html='';
    for(let r=1;r<=4;r++){
      let pts='';for(let i=0;i<5;i++){const ang=-Math.PI/2+i*2*Math.PI/5;pts+=(cx+Math.cos(ang)*R*r/4)+','+(cy+Math.sin(ang)*R*r/4)+' ';}
      html+=`<polygon points="${pts}" fill="none" stroke="#1e2026"/>`;
    }
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*2*Math.PI/5;
      const x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
      html+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1e2026"/>`;
      html+=`<text x="${cx+Math.cos(ang)*(R+16)}" y="${cy+Math.sin(ang)*(R+16)+4}" text-anchor="middle" fill="#a1a1aa" font-size="10">${labels[i]}</text>`;
    }
    let dp='';for(let i=0;i<5;i++){const ang=-Math.PI/2+i*2*Math.PI/5;const v=v2[i]/100;dp+=(cx+Math.cos(ang)*R*v)+','+(cy+Math.sin(ang)*R*v)+' ';}
    html+=`<polygon points="${dp}" fill="rgba(251,146,60,.15)" stroke="#fb923c" stroke-width="2"/>`;
    for(let i=0;i<5;i++){const ang=-Math.PI/2+i*2*Math.PI/5;const v=v2[i]/100;html+=`<circle cx="${cx+Math.cos(ang)*R*v}" cy="${cy+Math.sin(ang)*R*v}" r="4" fill="#fb923c"/>`;}
    const avg=Math.round(v2.reduce((a,b)=>a+b,0)/5);
    html+=`<text x="${cx}" y="${cy}" text-anchor="middle" fill="#fb923c" font-size="16" font-weight="700">${avg}</text>`;
    radar.innerHTML=html;
    const weakest=labels[v2.indexOf(Math.min(...v2))];
    score.innerHTML=`综合质量分: <b style="color:${avg>=80?'#fb923c':avg>=60?'#facc15':'#ef4444'}">${avg}/100</b> · 最弱维度: <b style="color:#fb923c">${weakest}</b>（${Math.min(...v2)}）${avg>=80?' · 质量良好':avg>=60?' · 建议改进短板':' · 质量不足，需优先改进'}`;
  }
  sliders.forEach(s=>s.addEventListener('input',draw));draw();
})();

/* ===== MODULE 3: 数据增强 ===== */
(function(){
  const el=document.getElementById('viz-m3');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px" id="m3svg">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">图像数据增强（点击不同策略）</text>
    <g id="m3imgs"></g>
  </svg>
  <div class="viz-controls">
    <button class="btn active" data-aug="original">原始</button>
    <button class="btn" data-aug="flip">水平翻转</button>
    <button class="btn" data-aug="rotate">旋转</button>
    <button class="btn" data-aug="crop">随机裁剪</button>
    <button class="btn" data-aug="color">颜色抖动</button>
    <button class="btn" data-aug="noise">高斯噪声</button>
    <button class="btn" data-aug="mixup">MixUp</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">数据增强通过对训练样本施加 <span style="color:var(--accent)"> label-preserving 变换</span>，在不增加真实数据的情况下提升模型泛化能力，是 Data-Centric 的基础手段。</p>`;
  const imgs=document.getElementById('m3imgs');
  function draw(aug){
    let html='';
    const baseShape={

/* ===== MODULE 4: 主动学习 ===== */
(function(){
  const el=document.getElementById('viz-m4');
  el.innerHTML=`
  <svg viewBox="0 0 760 340" width="100%" style="max-height:380px" id="m4svg">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">主动学习样本选择（点击选择策略）</text>
    <g id="m4pts"></g>
    <text x="380" y="320" text-anchor="middle" fill="#71717a" font-size="10" id="m4desc">点越亮 = 不确定性越高，越值得标注</text>
  </svg>
  <div class="viz-controls">
    <button class="btn active" data-strat="uncertainty">不确定性采样</button>
    <button class="btn" data-strat="margin">边缘采样</button>
    <button class="btn" data-strat="diversity">多样性采样</button>
    <button class="btn" id="m4select">+ 选择 5 个样本</button>
    <button class="btn" id="m4reset">↺ 重置</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">主动学习让模型 <span style="color:var(--accent)">主动挑选</span> 最有价值的未标注样本交给人工标注，用更少标注预算达到更高精度。</p>`;
  const pts=document.getElementById('m4pts');
  const desc=document.getElementById('m4desc');
  const samples=[];
  for(let i=0;i<60;i++){
    samples.push({x:60+Math.random()*640,y:60+Math.random()*220,u:Math.random(),selected:false,cluster:Math.floor(Math.random()*4)});
  }
  function draw(strat,selectedIds){
    const descs={
      uncertainty:'选择预测概率最接近 0.5 的样本（最不确定）',
      margin:'选择 Top-2 类别概率差最小的样本',
      diversity:'选择能覆盖特征空间不同区域的样本'
    };
    desc.textContent=descs[strat];
    let h='';
    // decision boundary (abstract)
    h+=`<path d="M60 200 Q250 100 400 180 T700 150" fill="none" stroke="#2a2d35" stroke-dasharray="6 4"/>`;
    samples.forEach((s,i)=>{
      let score;
      if(strat==='uncertainty')score=Math.abs(s.u-0.5);
      else if(strat==='margin')score=Math.abs(s.u-0.4);
      else score=s.cluster/4;
      const uncertain=1-score*2; // higher = more uncertain
      const sel=selectedIds&&selectedIds.includes(i);
      const r=sel?7:4;
      const opacity=sel?1:(0.3+uncertain*0.6);
      const fill=sel?'#fb923c':(uncertain>0.6?'#f97316':'#71717a');
      h+=`<circle cx="${s.x}" cy="${s.y}" r="${r}" fill="${fill}" opacity="${opacity}" stroke="${sel?'#fb923c':'none'}" stroke-width="2"/>`;
    });
    pts.innerHTML=h;
  }
  let strat='uncertainty',selIds=[];
  function selectN(){
    selIds=[];
    const sorted=[...samples.keys()].sort((a,b)=>{
      const sa=samples[a],sb=samples[b];
      if(strat==='uncertainty')return Math.abs(sa.u-0.5)-Math.abs(sb.u-0.5);
      if(strat==='margin')return Math.abs(sa.u-0.4)-Math.abs(sb.u-0.4);
      return sa.cluster-sb.cluster;
    });
    selIds=sorted.slice(0,5);
  }
  el.querySelectorAll('[data-strat]').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('[data-strat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    strat=b.dataset.strat;selIds=[];draw(strat,null);
  }));
  document.getElementById('m4select').addEventListener('click',()=>{selectN();draw(strat,selIds);});
  document.getElementById('m4reset').addEventListener('click',()=>{selIds=[];draw(strat,null);});
  draw('uncertainty',null);
})();

    <button class="btn" id="m8spin">▶ 启动飞轮</button>
    <button class="btn" id="m8reset">↺ 重置</button>
    <div class="slider-row"><span>迭代轮次</span><span class="val" id="m8round">0</span></div>
  </div>
  <div id="m8log" style="margin-top:12px;font-family:'SF Mono',monospace;font-size:12px;color:var(--text2);padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);min-height:40px"></div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">数据飞轮是 Data-Centric AI 的终极形态：模型部署后 <span style="color:var(--accent)">收集真实使用数据→标注→训练→部署</span>，形成正向闭环，数据越用越好。</p>`;
  const stages=[
    {name:'部署上线',x:380,y:80,col:'#fb923c',icon:'rocket'},
    {name:'收集数据',x:560,y:140,col:'#f97316',icon:'collect'},
    {name:'标注清洗',x:540,y:260,col:'#facc15',icon:'label'},
    {name:'训练模型',x:220,y:260,col:'#84cc16',icon:'train'},
    {name:'评估反馈',x:200,y:140,col:'#22d3ee',icon:'eval'}
  ];
  const sg=document.getElementById('m8stages');
  const log=document.getElementById('m8log');
  const roundEl=document.getElementById('m8round');
  function draw(active){
    let h='';
    // cycle arrows
    for(let i=0;i<stages.length;i++){
      const a=stages[i],b=stages[(i+1)%stages.length];
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      h+=`<path d="M${a.x} ${a.y} Q${mx+(380-mx)*0.3} ${my+(190-my)*0.3} ${b.x} ${b.y}" fill="none" stroke="${active===i?'#fb923c':'#2a2d35'}" stroke-width="${active===i?2.5:1.5}" marker-end="url(#a8arr)" ${active===i?'class="flow-line"':''}/>`;
    }
    stages.forEach((s,i)=>{
      const on=active===i;
      h+=`<g>`;
      h+=`<circle cx="${s.x}" cy="${s.y}" r="${on?32:26}" fill="${on?'rgba(251,146,60,.15)':'#0f1115'}" stroke="${s.col}" stroke-width="${on?2.5:1.5}" class="${on?'pulse':''}"/>`;
      h+=`<text x="${s.x}" y="${s.y-2}" text-anchor="middle" fill="${on?s.col:'#e4e4e7'}" font-size="10" font-weight="600">${s.name}</text>`;
      h+=`<text x="${s.x}" y="${s.y+12}" text-anchor="middle" fill="#71717a" font-size="8">${i+1}</text>`;
      h+=`</g>`;
    });
    sg.innerHTML=h;
  }
  let timer=null,round=0,step=0;
  const msgs=[
    '部署模型到生产环境，开始服务用户',
    '收集用户真实交互数据（含错误案例）',
    '对收集数据标注、清洗、去噪',
    '用增强后的数据重新训练模型',
    '评估新模型，A/B 测试决定是否上线'
  ];
  document.getElementById('m8spin').addEventListener('click',function(){
    if(timer){clearInterval(timer);timer=null;this.textContent='▶ 启动飞轮';return;}
    this.textContent='⏸ 暂停';step=0;
    timer=setInterval(()=>{
      draw(step);
      log.innerHTML='阶段 '+(step+1)+'/5: <span style="color:'+stages[step].col+'">'+stages[step].name+'</span> — '+msgs[step];
      step++;
      if(step>=5){
        step=0;round++;roundEl.textContent=round;
        log.innerHTML+='<br><span style="color:#84cc16">✓ 飞轮第 '+round+' 轮完成 · 数据质量提升 · 模型精度 +'+(0.5+Math.random()).toFixed(1)+'%</span>';
      }
    },1000);
  });
  document.getElementById('m8reset').addEventListener('click',()=>{
    clearInterval(timer);timer=null;round=0;step=0;roundEl.textContent='0';log.textContent='';draw(-1);
    document.getElementById('m8spin').textContent='▶ 启动飞轮';
  });
  draw(-1);
})();
</script>
</body>
</html>
