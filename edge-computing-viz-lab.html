<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边缘计算可视化实验室 · Edge Computing Viz Lab</title>
<meta name="description" content="8 个交互式模块拆解边缘计算：Edge-Cloud 架构、Fog 计算层次、边缘 AI 部署、CDN 边缘缓存、IoT 网关、任务调度、数据同步与边缘安全。纯 HTML/CSS/JS + SVG，零依赖。">
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#14b8a6;--accent2:#0d9488;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--cyan:#22d3ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 80% 0%,rgba(20,184,166,0.06),transparent 50%);
}
code,.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
.header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-0.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#08090a;font-weight:700;font-size:13px}
.back-link{font-size:12.5px;color:var(--text2);border:1px solid var(--border2);border-radius:7px;padding:6px 11px;transition:all .18s ease;font-family:'SF Mono',Monaco,Consolas,monospace}
.back-link:hover{color:var(--accent);border-color:var(--accent)}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav-pill{font-size:12px;padding:6px 11px;border-radius:7px;color:var(--text2);background:transparent;border:1px solid transparent;cursor:pointer;transition:all .18s ease;white-space:nowrap;font-family:'SF Mono',Monaco,Consolas,monospace}
.nav-pill:hover{color:var(--text);background:var(--bg2);border-color:var(--border)}
.nav-pill.active{color:var(--accent);background:rgba(20,184,166,0.1);border-color:rgba(20,184,166,0.3)}
.container{max-width:1280px;margin:0 auto;padding:32px 28px 120px}
.hero{padding:24px 0 40px;border-bottom:1px solid var(--border);margin-bottom:48px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border2);border-radius:999px;font-size:12px;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;margin-bottom:18px}
.hero-badge .d{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{font-size:38px;letter-spacing:-0.02em;font-weight:700;margin-bottom:12px;line-height:1.1}
.hero h1 .glow{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text2);font-size:15.5px;max-width:720px}
.hero .meta{display:flex;gap:18px;margin-top:20px;font-size:12px;color:var(--text3);flex-wrap:wrap}
.hero .meta span{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.module{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-bottom:28px;scroll-margin-top:80px;transition:border-color .2s ease}
.module:hover{border-color:var(--border2)}
.module-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.module-num{flex-shrink:0;width:34px;height:34px;border-radius:9px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600}
.module-title{flex:1;min-width:200px}
.module-title h2{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px}
.module-title p{color:var(--text2);font-size:13.5px}
.badge{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);font-family:'SF Mono',Monaco,Consolas,monospace}
.badge.accent{color:var(--accent);border-color:rgba(20,184,166,0.3);background:rgba(20,184,166,0.08)}
.module-body{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px}
.panel-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;font-weight:600}
.desc{color:var(--text2);font-size:13.5px;margin-bottom:16px;line-height:1.7}
.desc strong{color:var(--text)}
.desc .acc{color:var(--accent)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:7px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#08090a;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#08090a}
.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(20,184,166,0.1)}
.slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
.slider-row input[type=range]{-webkit-appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;width:120px}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.slider-row .val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:46px}
svg{display:block;width:100%;height:auto}
.svg-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:hidden}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.stat .v{font-size:16px;color:var(--text);font-family:'SF Mono',Monaco,Consolas,monospace;margin-top:2px}
.stat .v.acc{color:var(--accent)}
.stat .v.bad{color:var(--red)}
.stat .v.warn{color:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
table.cmp th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em}
table.cmp td{color:var(--text2)}
table.cmp tr:hover td{color:var(--text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s ease;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.bn-btn{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .18s ease}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.bn-btn .name{font-size:14px;color:var(--text);margin-top:3px}
.bn-btn.next{text-align:right}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.flow-line{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media(max-width:820px){.module-body{grid-template-columns:1fr}.hero h1{font-size:28px}.container{padding:24px 16px 100px}.header-inner{padding:12px 16px}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <a class="logo" href="index.html"><div class="logo-mark">E</div><span>Edge Computing · 边缘计算</span></a>
    <a class="back-link" href="index.html">← 实验室集</a>
    <div class="nav-pills" id="navPills"></div>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="hero-badge"><span class="d"></span> CS Systems · 可视化实验室 #145</div>
    <h1>边缘计算 <span class="glow">可视化实验室</span></h1>
    <p>8 个交互式模块拆解边缘计算全栈：从 Edge-Cloud 架构对比到 Fog 计算层次，从边缘 AI 部署、CDN 边缘缓存、IoT 网关，到任务调度、数据同步与边缘安全。所有可视化均由 SVG 实时绘制，零外部依赖。</p>
    <div class="meta">
      <span><i class="dot"></i>8 Modules</span>
      <span><i class="dot"></i>Pure SVG</span>
      <span><i class="dot"></i>Zero Dependencies</span>
      <span><i class="dot"></i>Linear Dark Aesthetic</span>
    </div>
  </div>

  <div id="modules"></div>

  <div class="bottom-nav">
    <div class="bn-btn prev" id="bnPrev"><div class="lbl">← Previous</div><div class="name" id="bnPrevName">—</div></div>
    <div class="bn-btn next" id="bnNext"><div class="lbl">Next →</div><div class="name" id="bnNextName">—</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>[...p.querySelectorAll(s)];
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MODULES=[
  {id:'arch',num:'01',name:'Edge-Cloud 架构对比',en:'Edge vs Cloud Architecture'},
  {id:'fog',num:'02',name:'Fog 计算层次',en:'Fog Computing Hierarchy'},
  {id:'ai',num:'03',name:'边缘 AI 部署流程',en:'Edge AI Deployment Pipeline'},
  {id:'cdn',num:'04',name:'CDN 边缘缓存',en:'CDN Edge Caching'},
  {id:'iot',num:'05',name:'IoT 边缘网关',en:'IoT Edge Gateway'},
  {id:'sched',num:'06',name:'边缘任务调度',en:'Edge Task Scheduling'},
  {id:'sync',num:'07',name:'Edge-Cloud 数据同步',en:'Edge-Cloud Data Sync'},
  {id:'sec',num:'08',name:'边缘安全',en:'Edge Security'},
];

const navPills=$('#navPills');
MODULES.forEach((m,i)=>{const b=document.createElement('div');b.className='nav-pill';b.textContent=m.num;b.title=m.name;b.onclick=()=>document.getElementById(m.id).scrollIntoView({behavior:'smooth',block:'start'});navPills.appendChild(b);});

const modulesEl=$('#modules');
MODULES.forEach(m=>{const sec=document.createElement('section');sec.className='module';sec.id=m.id;sec.innerHTML='<div class="module-head"><div class="module-num">'+m.num+'</div><div class="module-title"><h2>'+m.name+'</h2><p>'+m.en+'</p></div><span class="badge accent">Module '+m.num+'</span></div><div class="module-body" id="body-'+m.id+'"></div>';modulesEl.appendChild(sec);});

/* 滚动高亮 + 底部导航 */
const navPillEls=$$('.nav-pill');
const sectionEls=MODULES.map(m=>document.getElementById(m.id));
window.addEventListener('scroll',()=>{
  let cur=0;sectionEls.forEach((s,i)=>{if(s.getBoundingClientRect().top<140)cur=i;});
  navPillEls.forEach((l,i)=>l.classList.toggle('active',i===cur));
  const prevI=(cur-1+MODULES.length)%MODULES.length,nextI=(cur+1)%MODULES.length;
  $('#bnPrevName').textContent=MODULES[prevI].name;
  $('#bnNextName').textContent=MODULES[nextI].name;
  $('#bnPrev').onclick=()=>sectionEls[prevI].scrollIntoView({behavior:'smooth'});
  $('#bnNext').onclick=()=>sectionEls[nextI].scrollIntoView({behavior:'smooth'});
});
navPillEls[0].classList.add('active');
$('#bnPrevName').textContent=MODULES[MODULES.length-1].name;
$('#bnNextName').textContent=MODULES[1].name;
$('#bnPrev').onclick=()=>sectionEls[MODULES.length-1].scrollIntoView({behavior:'smooth'});
$('#bnNext').onclick=()=>sectionEls[1].scrollIntoView({behavior:'smooth'});

/* ============================ 模块1: Edge-Cloud 架构对比 ============================ */
(()=>{
  const body=$('#body-arch');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">请求路径与延迟</div>
      <div class="desc">纯云架构中每个请求都要往返远端数据中心；边缘辅助架构把计算下沉到离用户最近的边缘节点，实时任务就地处理，重计算才回源云。切换模式观察数据包流向与延迟差异。</div>
      <div class="svg-wrap"><svg viewBox="0 0 560 320" id="archSvg"></svg></div>
      <div class="controls">
        <button class="btn active" data-mode="cloud">纯云架构</button>
        <button class="btn" data-mode="edge">边缘辅助</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">延迟分解 (ms)</div>
      <div class="controls">
        <div class="slider-row"><span>到云距离</span><input type="range" id="archDist" min="50" max="2000" value="800"><span class="val" id="archDistV">800km</span></div>
      </div>
      <div class="svg-wrap"><svg viewBox="0 0 560 240" id="archBar"></svg></div>
      <div class="stat-grid" id="archStats"></div>
      <div class="legend"><span><i style="background:#f87171"></i>网络往返 RTT</span><span><i style="background:#fbbf24"></i>排队/调度</span><span><i style="background:#14b8a6"></i>计算执行</span></div>
    </div>`;
  const svg=$('#archSvg'),bar=$('#archBar');
  const dist=$('#archDist'),distV=$('#archDistV');
  let mode='cloud',raf=null,t=0;
  function drawScene(){
    t+=0.016;
    let h='';
    h+='<text x="280" y="22" text-anchor="middle" fill="#a1a1aa" font-size="12" font-family="SF Mono,monospace">'+(mode==='cloud'?'设备 → 云数据中心（远距离往返）':'设备 → 边缘节点（就近）→ 必要时回源云')+'</text>';
    // device
    h+='<rect x="24" y="140" width="70" height="46" rx="8" fill="rgba(20,184,166,0.08)" stroke="#14b8a6"/><text x="59" y="168" text-anchor="middle" fill="#e4e4e7" font-size="11">设备</text>';
    if(mode==='cloud'){
      const x1=94,x2=470;
      h+='<path d="M'+x1+' 163 L'+x2+' 163" stroke="#14b8a6" stroke-width="1.5" class="flow-line"/>';
      h+='<rect x="466" y="130" width="80" height="66" rx="10" fill="rgba(20,184,166,0.1)" stroke="#14b8a6"/><text x="506" y="156" text-anchor="middle" fill="#14b8a6" font-size="11" font-weight="600">Cloud</text><text x="506" y="174" text-anchor="middle" fill="#71717a" font-size="9">数据中心</text>';
      // moving packet round trip
      const p=(t%2)/2; // 0..1
      const px=p<0.5?x1+(x2-x1)*(p*2):x2-(x2-x1)*((p-0.5)*2);
      h+='<circle cx="'+px.toFixed(1)+'" cy="163" r="5" fill="#14b8a6"><animate attributeName="r" values="5;7;5" dur="0.8s" repeatCount="indefinite"/></circle>';
      h+='<text x="280" y="232" text-anchor="middle" fill="#71717a" font-size="10">长距离光纤链路 · RTT 高</text>';
    }else{
      const xe=270;
      h+='<path d="M94 163 L'+(xe-40)+' 163" stroke="#14b8a6" stroke-width="1.5" class="flow-line"/>';
      h+='<rect x="'+(xe-40)+'" y="120" width="80" height="86" rx="10" fill="rgba(20,184,166,0.12)" stroke="#14b8a6"/><text x="'+xe+'" y="150" text-anchor="middle" fill="#14b8a6" font-size="11" font-weight="600">Edge</text><text x="'+xe+'" y="168" text-anchor="middle" fill="#71717a" font-size="9">边缘节点</text><text x="'+xe+'" y="184" text-anchor="middle" fill="#71717a" font-size="8">就地推理</text>';
      // device -> edge packet
      const p1=(t%1.4)/1.4;
      const px1=94+(xe-40-94)*p1;
      h+='<circle cx="'+px1.toFixed(1)+'" cy="163" r="5" fill="#14b8a6"/>';
      // occasional uplink to cloud
      const p2=(t%3)/3;
      if(p2<0.5){
        const px2=(xe+40)+(466-(xe+40))*(p2*2);
        h+='<path d="'+(xe+40)+' 163 L466 163" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>';
        h+='<circle cx="'+px2.toFixed(1)+'" cy="163" r="3" fill="#fbbf24" opacity="0.7"/>';
      }
      h+='<rect x="466" y="130" width="80" height="66" rx="10" fill="rgba(168,85,247,0.08)" stroke="#a855f7" opacity="0.7"/><text x="506" y="156" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">Cloud</text><text x="506" y="174" text-anchor="middle" fill="#71717a" font-size="9">回源(仅重任务)</text>';
      h+='<text x="280" y="232" text-anchor="middle" fill="#71717a" font-size="10">实时任务在边缘闭环 · 仅重计算回源</text>';
    }
    svg.innerHTML=h;
    raf=requestAnimationFrame(drawScene);
  }
  function compute(){
    const d=+dist.value;distV.textContent=d+'km';
    const rtt=mode==='cloud'?(d*2/200*3+8).toFixed(0):(d*2/200*0.3+3).toFixed(1); // edge much closer
    const cloudRTT=(d*2/200*3+8).toFixed(0);
    const sched=mode==='cloud'?6:2;
    const exec=mode==='cloud'?14:9;
    const total=(+rtt+sched+exec);
    // bar chart
    const maxBar=460,maxTotal=+cloudRTT+6+14+20;
    let bh='';
    bh+='<text x="20" y="34" fill="#a1a1aa" font-size="11">纯云</text>';
    let bx=20,bw1=clamp(+cloudRTT/maxTotal*maxBar,4,maxBar);
    bh+='<rect x="'+bx+'" y="46" width="'+bw1+'" height="22" fill="#f87171" rx="3"/><text x="'+(bx+bw1+6)+'" y="62" fill="#f87171" font-size="11">'+cloudRTT+'ms</text>';
    bx=20+bw1;let bw2=clamp(6/maxTotal*maxBar,3,maxBar);
    bh+='<rect x="'+bx+'" y="46" width="'+bw2+'" height="22" fill="#fbbf24" rx="3"/>';
    bx=20+bw1+bw2;let bw3=clamp(14/maxTotal*maxBar,3,maxBar);
    bh+='<rect x="'+bx+'" y="46" width="'+bw3+'" height="22" fill="#14b8a6" rx="3"/>';
    bh+='<text x="'+(20+bw1+bw2+bw3+6)+'" y="62" fill="#e4e4e7" font-size="11">总 '+(+cloudRTT+6+14)+'ms</text>';
    // edge
    bh+='<text x="20" y="104" fill="#14b8a6" font-size="11">边缘辅助</text>';
    let ebw1=clamp(+rtt/maxTotal*maxBar,4,maxBar);
    bh+='<rect x="20" y="116" width="'+ebw1+'" height="22" fill="#f87171" rx="3"/><text x="'+(20+ebw1+6)+'" y="132" fill="#f87171" font-size="11">'+rtt+'ms</text>';
    let ebw2=clamp(sched/maxTotal*maxBar,3,maxBar);
    bh+='<rect x="'+(20+ebw1)+'" y="116" width="'+ebw2+'" height="22" fill="#fbbf24" rx="3"/>';
    let ebw3=clamp(exec/maxTotal*maxBar,3,maxBar);
    bh+='<rect x="'+(20+ebw1+ebw2)+'" y="116" width="'+ebw3+'" height="22" fill="#14b8a6" rx="3"/>';
    bh+='<text x="'+(20+ebw1+ebw2+ebw3+6)+'" y="132" fill="#14b8a6" font-size="11">总 '+total+'ms</text>';
    bh+='<text x="20" y="180" fill="#71717a" font-size="10">↓ 延迟 = 网络 RTT + 排队调度 + 计算执行</text>';
    bh+='<text x="20" y="200" fill="#71717a" font-size="10">边缘把网络段缩短 ~10x，整体延迟显著下降</text>';
    bar.innerHTML=bh;
    const saved=(((+cloudRTT+6+14)-total)/((+cloudRTT+6+14))*100).toFixed(0);
    $('#archStats').innerHTML=
      '<div class="stat"><div class="k">纯云 RTT</div><div class="v bad">'+cloudRTT+'ms</div></div>'+
      '<div class="stat"><div class="k">边缘 RTT</div><div class="v acc">'+rtt+'ms</div></div>'+

      const x=padL+i*(W/(stages.length-1));

      h+='<text x="'+x.toFixed(1)+'" y="'+(y-10).toFixed(1)+'" text-anchor="middle" fill="#14b8a6" font-size="9">'+sz+'</text>';

      '<div class="stat"><div class="k">精度</div><div class="v">'+s.acc+'%</div></div>'+
      '<div class="stat"><div class="k">压缩比</div><div class="v acc">'+(240/s.size).toFixed(1)+'x</div></div>';
    const notes=[

      '量化把权重从 32 位浮点压到 8 位整数，体积降 4x，精度几乎无损，NPU 可直接加速 INT8。',
      '剪枝移除接近零的冗余连接，进一步稀疏化，体积再降，配合稀疏推理内核可省算力。',
      '转换为 TFLite/ONNX Runtime 等边缘运行时格式，匹配目标硬件算子。',
      '模型下发到边缘设备(OTA)，与本地传感器数据对接，准备就绪。',
      '边缘 NPU/DSP 在线推理，端到端延迟 <10ms，无需回源云。'
    ];
    $('#aiNote').innerHTML=notes[step];
    $('#aiStep').textContent=step<stages.length-1?'下一步 ▶':'✓ 完成';
  }
  $('#aiStep').addEventListener('click',()=>{if(step<stages.length-1){step++;update();}else{toast('部署流程已完成');}});
  $('#aiReset').addEventListener('click',()=>{step=0;update();});

})();

/* ============================ 模块4: CDN 边缘缓存 ============================ */
(()=>{
  const body=$('#body-cdn');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">请求路由与缓存命中</div>
      <div class="desc">CDN 把内容副本缓存到全球边缘 POP。用户请求先到最近的 POP：命中则直接返回(低延迟)，未命中则回源取并缓存。调节缓存命中率，观察回源比例与延迟变化。</div>
      <div class="svg-wrap"><svg viewBox="0 0 560 260" id="cdnSvg"></svg></div>
      <div class="controls">
        <button class="btn primary" id="cdnReq">▶ 发起请求</button>
        <button class="btn" id="cdnAuto">自动 ×10</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">命中率与延迟</div>
      <div class="controls">
        <div class="slider-row"><span>缓存命中率</span><input type="range" id="cdnHit" min="0" max="100" value="70"><span class="val" id="cdnHitV">70%</span></div>
      </div>
      <div class="svg-wrap"><svg viewBox="0 0 560 180" id="cdnBar"></svg></div>
      <div class="stat-grid" id="cdnStats"></div>
      <div class="legend"><span><i style="background:#14b8a6"></i>边缘命中</span><span><i style="background:#fbbf24"></i>回源未命中</span></div>
    </div>`;
  const svg=$('#cdnSvg'),bar=$('#cdnBar');
  const hit=$('#cdnHit'),hitV=$('#cdnHitV');
  let hits=0,miss=0,auto=null;
  function draw(last){
    let h='';
    // origin
    h+='<rect x="430" y="30" width="90" height="50" rx="10" fill="rgba(168,85,247,0.08)" stroke="#a855f7"/><text x="475" y="52" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">Origin</text><text x="475" y="68" text-anchor="middle" fill="#71717a" font-size="9">源站</text>';
    // user
    h+='<circle cx="40" cy="150" r="16" fill="rgba(20,184,166,0.1)" stroke="#14b8a6"/><text x="40" y="186" text-anchor="middle" fill="#71717a" font-size="9">用户</text>';
    // POPs
    const pops=[{x:160,y:90},{x:260,y:60},{x:340,y:120}];
    pops.forEach((p,i)=>{
      const cached=last?(i===last.pop && last.hit):false;
      h+='<rect x="'+(p.x-34)+'" y="'+(p.y-22)+'" width="68" height="44" rx="9" fill="'+(cached?'rgba(20,184,166,0.16)':'#0f1115')+'" stroke="#14b8a6" stroke-width="'+(cached?2:1)+'"/>';
      h+='<text x="'+p.x+'" y="'+(p.y-4)+'" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600">POP'+(i+1)+'</text>';
      h+='<text x="'+p.x+'" y="'+(p.y+10)+'" text-anchor="middle" fill="#71717a" font-size="8">'+(cached?'命中':'边缘')+'</text>';
      h+='<path d="M56 144 L'+(p.x-34)+' '+(p.y)+'" stroke="#2a2d35" stroke-width="1"/>';
      h+='<path d="'+(p.x+34)+' '+(p.y)+' L430 55" stroke="#2a2d35" stroke-width="1"/>';
    });
    if(last){
      const p=pops[last.pop];
      const col=last.hit?'#14b8a6':'#fbbf24';
      h+='<path d="M56 144 L'+(p.x-34)+' '+(p.y)+'" stroke="'+col+'" stroke-width="2" class="flow-line"/>';
      if(!last.hit){h+='<path d="'+(p.x+34)+' '+(p.y)+' L430 55" stroke="#fbbf24" stroke-width="2" class="flow-line"/>';}
      h+='<text x="280" y="230" text-anchor="middle" fill="'+col+'" font-size="11">'+(last.hit?'✓ 边缘缓存命中 · 就近返回':'✗ 未命中 · 回源拉取并缓存')+'</text>';
    }
    svg.innerHTML=h;
  }
  function oneReq(){
    const pop=Math.floor(Math.random()*3);
    const isHit=Math.random()*100<+hit.value;
    if(isHit)hits++;else miss++;
    draw({pop,hit:isHit});
    updateBar();
  }
  function updateBar(){
    hitV.textContent=hit.value+'%';
    const total=hits+miss||1,hitPct=(hits/total*100).toFixed(0);
    const edgeLat=12,originLat=85;
    const avg=(hits*edgeLat+miss*originLat)/total;
    let h='';
    h+='<text x="20" y="30" fill="#a1a1aa" font-size="11">实际命中 '+hitPct+'% ('+hits+'/'+total+')</text>';
    const w=+hit.value/100*460;
    h+='<rect x="20" y="44" width="460" height="22" rx="4" fill="#16181d"/>';
    h+='<rect x="20" y="44" width="'+w+'" height="22" rx="4" fill="#14b8a6"/>';
    h+='<rect x="'+(20+w)+'" y="44" width="'+(460-w)+'" height="22" rx="4" fill="#fbbf24" opacity="0.7"/>';
    h+='<text x="20" y="100" fill="#71717a" font-size="10">边缘命中延迟 '+edgeLat+'ms · 回源延迟 '+originLat+'ms</text>';
    h+='<text x="20" y="120" fill="#14b8a6" font-size="13" font-weight="600">平均延迟 '+avg.toFixed(1)+'ms</text>';
    h+='<text x="20" y="140" fill="#71717a" font-size="10">vs 全回源 '+(originLat).toFixed(0)+'ms · 加速 '+(originLat/avg).toFixed(1)+'x</text>';
    bar.innerHTML=h;
    $('#cdnStats').innerHTML=
      '<div class="stat"><div class="k">请求总数</div><div class="v">'+total+'</div></div>'+
      '<div class="stat"><div class="k">边缘命中</div><div class="v acc">'+hits+'</div></div>'+
      '<div class="stat"><div class="k">回源</div><div class="v warn">'+miss+'</div></div>'+
      '<div class="stat"><div class="k">平均延迟</div><div class="v acc">'+avg.toFixed(1)+'ms</div></div>';
  }
  $('#cdnReq').addEventListener('click',oneReq);
  $('#cdnAuto').addEventListener('click',function(){
    if(auto){clearInterval(auto);auto=null;this.textContent='自动 ×10';this.classList.remove('active');return;}
    this.textContent='■ 停止';this.classList.add('active');
    let c=0;
    auto=setInterval(()=>{oneReq();c++;if(c>=10){clearInterval(auto);auto=null;this.textContent='自动 ×10';this.classList.remove('active');}},420);
  });
  hit.addEventListener('input',updateBar);
  draw(null);updateBar();
})();

(()=>{

  // local: flops=2, bw=inf(0)
  // edge: flops=5, bw=40
  // cloud: flops=12, bw=10
  function decide(){
    const c=+C.value,d=+D.value;CV.textContent=c;DV.textContent=d;
    const local=c/2;
    const edge=c/5+d/40;
    const cloud=c/12+d/10;

    // scene

    h+='<text x="280" y="20" text-anchor="middle" fill="#a1a1aa" font-size="11">设备 → 最优卸载目标（高亮）</text>';

    const targets=[{n:'本地',x:0,c:'#34d399'},{n:'边缘',x:0,c:'#14b8a6'},{n:'云端',x:0,c:'#a855f7'}];
    const xs=[170,330,470];
    targets.forEach((t,i)=>{
      const on=best.n===t.n;
      h+='<rect x="'+(xs[i]-45)+'" y="80" width="90" height="60" rx="10" fill="'+(on?'rgba('+hexFill(t.c)+',0.16)':'#0f1115')+'" stroke="'+t.c+'" stroke-width="'+(on?2:1)+'"/>';
      h+='<text x="'+xs[i]+'" y="106" text-anchor="middle" fill="'+t.c+'" font-size="11" font-weight="600">'+t.n+'</text>';
      h+='<text x="'+xs[i]+'" y="124" text-anchor="middle" fill="#71717a" font-size="9">'+opts[i].t.toFixed(1)+'ms</text>';
      h+='<path d="M90 110 L'+(xs[i]-45)+' 110" stroke="'+(on?t.c:'#2a2d35')+'" stroke-width="'+(on?2:1)+'" '+(on?'class="flow-line"':'')+'/>';
    });
    h+='<text x="280" y="172" text-anchor="middle" fill="'+best.c+'" font-size="12" font-weight="600">推荐卸载 → '+best.n+' ('+best.t.toFixed(1)+'ms)</text>';
    svg.innerHTML=h;
    // bars
    const maxT=Math.max(local,edge,cloud)*1.1;
    let bh='';
    opts.forEach((o,i)=>{
      const y=30+i*46;
      bh+='<text x="20" y="'+(y+14)+'" fill="'+o.c+'" font-size="11">'+o.n+'</text>';
      const w=clamp(o.t/maxT*420,4,420);
      bh+='<rect x="60" y="'+y+'" width="'+w+'" height="20" rx="4" fill="'+o.c+'" opacity="'+(o.n===best.n?1:0.5)+'"/>';
      bh+='<text x="'+(64+w)+'" y="'+(y+14)+'" fill="'+(o.n===best.n?o.c:'#a1a1aa')+'" font-size="11">'+o.t.toFixed(1)+'ms</text>';
    });
    bar.innerHTML=bh;
    $('#schedStats').innerHTML=
      '<div class="stat"><div class="k">本地</div><div class="v '+(best.n==='本地'?'acc':'')+'">'+local.toFixed(1)+'</div></div>'+
      '<div class="stat"><div class="k">边缘</div><div class="v '+(best.n==='边缘'?'acc':'')+'">'+edge.toFixed(1)+'</div></div>'+
      '<div class="stat"><div class="k">云端</div><div class="v '+(best.n==='云端'?'acc':'')+'">'+cloud.toFixed(1)+'</div></div>'+
      '<div class="stat"><div class="k">最优</div><div class="v acc" style="font-size:13px">'+best.n+'</div></div>';
    const reason=best.n==='本地'?'数据量大而计算小，传输开销不划算，就地执行最优。':best.n==='边缘'?'计算与数据折中，边缘节点算力够且网络近，性价比最高。':'计算量大而数据小，值得付出传输代价换取云端强算力。';
    $('#schedNote').innerHTML='<strong>决策理由：</strong>'+reason;
  }
  function hexFill(c){const m={'#34d399':'52,211,153','#14b8a6':'20,184,166','#a855f7':'168,85,247'};return m[c]||'20,184,166';}
  C.addEventListener('input',decide);D.addEventListener('input',decide);
  decide();
})();

/* ============================ 模块7: Edge-Cloud 数据同步 ============================ */
(()=>{
  const body=$('#body-sync');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">边缘副本写入与合并</div>
      <div class="desc">边缘节点常离线/弱网，各副本独立写入后会分歧。点击让两个边缘节点各写一版，再用不同策略合并：LWW(最后写胜出)会丢数据，CRDT 合并可无损收敛。切换策略对比。</div>
      <div class="svg-wrap"><svg viewBox="0 0 560 240" id="syncSvg"></svg></div>
      <div class="controls">
        <button class="btn primary" id="syncWrite">✎ 两节点各写入</button>
        <button class="btn" id="syncMerge">↻ 合并</button>
        <button class="btn active" data-strat="lww">LWW 策略</button>
        <button class="btn" data-strat="crdt">CRDT 策略</button>
        <button class="btn" id="syncReset">↺ 重置</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">最终一致性收敛</div>
      <div class="desc">边缘优先保证<strong>可用性</strong>(AP)，放弃强一致，依赖异步同步达成最终一致。CRDT(无冲突复制数据类型)通过数学结构保证合并必定收敛、不丢更新。</div>
      <div id="syncLog" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'SF Mono',monospace;font-size:12px;color:var(--text2);min-height:120px"></div>
      <div class="stat-grid" id="syncStats"></div>
    </div>`;
  const svg=$('#syncSvg'),log=$('#syncLog');
  let strat='lww',state={a:[],b:[]},merged=false;
  function draw(){
    let h='';
    h+='<text x="280" y="20" text-anchor="middle" fill="#a1a1aa" font-size="11">边缘节点 A 与 B 独立写入后同步合并</text>';
    // node A
    h+='<rect x="30" y="50" width="120" height="70" rx="10" fill="rgba(20,184,166,0.1)" stroke="#14b8a6"/><text x="90" y="74" text-anchor="middle" fill="#14b8a6" font-size="12" font-weight="600">Edge A</text>';
    h+='<text x="90" y="98" text-anchor="middle" fill="#e4e4e7" font-size="10" id="syncA">cnt = ?</text>';
    // node B
    h+='<rect x="410" y="50" width="120" height="70" rx="10" fill="rgba(34,211,238,0.1)" stroke="#22d3ee"/><text x="470" y="74" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="600">Edge B</text>';
    h+='<text x="470" y="98" text-anchor="middle" fill="#e4e4e7" font-size="10" id="syncB">cnt = ?</text>';
    // cloud merged
    h+='<rect x="220" y="150" width="120" height="60" rx="10" fill="rgba(168,85,247,0.08)" stroke="#a855f7"/><text x="280" y="176" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">合并结果</text>';
    h+='<text x="280" y="196" text-anchor="middle" fill="#e4e4e7" font-size="10" id="syncM">未合并</text>';
    h+='<path d="M150 95 Q210 130 220 165" stroke="#14b8a6" stroke-width="1" stroke-dasharray="3 3"/>';
    h+='<path d="M410 95 Q350 130 340 165" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3"/>';
    if(merged){h+='<path d="M150 95 Q210 130 220 165" stroke="#14b8a6" stroke-width="2" class="flow-line"/><path d="M410 95 Q350 130 340 165" stroke="#22d3ee" stroke-width="2" class="flow-line"/>';}
    svg.innerHTML=h;
    $('#syncA').textContent='cnt = '+JSON.stringify(state.a);
    $('#syncB').textContent='cnt = '+JSON.stringify(state.b);
    if(merged){
      const r=doMerge();
      $('#syncM').textContent=JSON.stringify(r);
      $('#syncM').setAttribute('fill',strat==='crdt'?'#34d399':'#fbbf24');
    }else{
      $('#syncM').textContent='待合并';
    }
  }
  function doMerge(){
    if(strat==='lww'){
      // last writer wins: B wins (later timestamp) -> loses A's update
      return state.b.length?state.b:[];
    }
    // CRDT G-Counter: sum of per-replica counts
    const a=state.a.length?state.a[state.a.length-1]:0;
    const b=state.b.length?state.b[state.b.length-1]:0;
    return a+b;
  }
  function writeLog(s){log.innerHTML+='<div>'+s+'</div>';}
  body.querySelectorAll('[data-strat]').forEach(b=>b.addEventListener('click',()=>{
    body.querySelectorAll('[data-strat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    strat=b.dataset.strat;merged=false;draw();
    log.innerHTML='<div style="color:#71717a">已切换为 '+(strat==='lww'?'LWW 最后写胜出':'CRDT 无冲突合并')+'，请重新合并。</div>';
  }));
  $('#syncWrite').addEventListener('click',()=>{
    const av=(state.a.length?state.a[state.a.length-1]:0)+1;
    const bv=(state.b.length?state.b[state.b.length-1]:0)+1;
    state.a.push(av);state.b.push(bv);merged=false;draw();
    writeLog('<span style="color:#14b8a6">A 写入 cnt='+av+'</span> · <span style="color:#22d3ee">B 写入 cnt='+bv+'</span> （并发更新，副本分歧）');
    $('#syncStats').innerHTML='<div class="stat"><div class="k">A 版本</div><div class="v acc">'+av+'</div></div><div class="stat"><div class="k">B 版本</div><div class="v acc">'+bv+'</div></div><div class="stat"><div class="k">策略</div><div class="v" style="font-size:12px">'+strat.toUpperCase()+'</div></div>';
  });
  $('#syncMerge').addEventListener('click',()=>{
    if(!state.a.length||!state.b.length){toast('请先让两节点各写入');return;}
    merged=true;draw();
    const r=doMerge();
    if(strat==='lww'){
      writeLog('<span style="color:#fbbf24">LWW 合并：B 较晚 → 结果='+JSON.stringify(r)+'，A 的更新被丢弃 ✗</span>');
    }else{
      writeLog('<span style="color:#34d399">CRDT(G-Counter) 合并：A+B='+r+'，两副本都将收敛到 '+r+' ✓</span>');
    }
    $('#syncStats').innerHTML='<div class="stat"><div class="k">合并结果</div><div class="v '+(strat==='crdt'?'acc':'warn')+'">'+JSON.stringify(r)+'</div></div><div class="stat"><div class="k">数据丢失</div><div class="v '+(strat==='crdt'?'acc':'bad')+'">'+(strat==='crdt'?'否':'是')+'</div></div><div class="stat"><div class="k">收敛保证</div><div class="v '+(strat==='crdt'?'acc':'warn')+'">'+(strat==='crdt'?'保证':'不保证')+'</div></div>';
  });
  $('#syncReset').addEventListener('click',()=>{state={a:[],b:[]};merged=false;draw();log.innerHTML='<div style="color:#71717a">已重置。</div>';$('#syncStats').innerHTML='';});
  log.innerHTML='<div style="color:#71717a">点击"两节点各写入"产生并发更新，再"合并"对比两种策略。</div>';
  draw();
})();

      const a=attacks[active];
      h+='<circle cx="280" cy="120" r="78" fill="none" stroke="'+a.c+'" stroke-width="2" stroke-dasharray="4 4" class="pulse"/>';
      h+='<path d="M150 '+(46+list.indexOf(active)*44+18)+' L210 110" stroke="'+a.c+'" stroke-width="2" marker-end="url(#secArr)"/>';
      h+='<text x="280" y="232" text-anchor="middle" fill="#34d399" font-size="11">✓ 防御层拦截：'+a.def+'</text>';
    }
    h+='<defs><marker id="secArr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="'+(active?attacks[active].c:'#71717a')+'"/></marker></defs>';
    svg.innerHTML=h;
  }
  function hexFill(c){const m={'#f87171':'248,113,113','#fbbf24':'251,191,36','#22d3ee':'34,211,238','#a855f7':'168,85,247'};return m[c]||'20,184,166';}
  function drawStack(){
    const layers=[
      {n:'身份认证',d:'设备证书 · mTLS 双向',c:'#14b8a6'},
      {n:'访问控制',d:'最小权限 · 作用域',c:'#22d3ee'},
      {n:'流量防护',d:'WAF · 限速 · Anycast',c:'#34d399'},
      {n:'设备完整性',d:'安全启动 · TPM · 远程证明',c:'#fbbf24'},
      {n:'监控响应',d:'行为基线 · 异常隔离',c:'#a855f7'}
    ];
    let h='';
    layers.forEach((l,i)=>{
      const y=18+i*38;
      h+='<rect x="30" y="'+y+'" width="500" height="30" rx="7" fill="rgba('+hexFill(l.c)+',0.08)" stroke="'+l.c+'"/>';
      h+='<text x="48" y="'+(y+19)+'" fill="'+l.c+'" font-size="11" font-weight="600">'+l.n+'</text>';
      h+='<text x="180" y="'+(y+19)+'" fill="#a1a1aa" font-size="10.5">'+l.d+'</text>';
    });
    stack.innerHTML=h;
  }
  body.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
    body.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    active=b.dataset.a;draw();
    const a=attacks[active];
    $('#secDesc').innerHTML='<strong style="color:'+a.c+'">'+a.name+'：</strong>'+a.d+' <span class="acc">防御：</span>'+a.def;
  }));
  drawStack();draw();
})();
</script>
</body>
</html>
