<div class="lab-hero"><span class="tag">AGENTIC RAG / COGNITIVE RETRIEVAL</span><h1>Agentic RAG <span class="grad">与认知检索架构</span> 演进可视化实验室</h1><p>从Naive RAG到Agentic RAG，从扁平检索到认知协作——系统呈现2026年检索增强生成的范式跃迁全景。覆盖RAG四代演进、多智能体检索架构、GraphRAG知识图谱融合、Agentic检索策略、认知检索引擎、企业级落地与未来知识架构愿景，解构从"检索→生成"到"理解→推理→生成"的认知检索新范式。</p></div>

<script>
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',tealDim:'rgba(0,212,170,.16)',tealSoft:'rgba(0,212,170,.08)',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};
var SVGNS='http://www.w3.org/2000/svg';
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}
function E(p,t,a){var e=document.createElementNS(SVGNS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function gridBg(g,w,h){for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});}
function box(g,x,y,w,h,o){o=o||{};var r=E(g,'rect',{x:x,y:y,width:w,height:h,rx:o.rx||7,fill:o.fill||C.bg3,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3});if(o.cls)r.setAttribute('class',o.cls);return r;}

function line(g,x1,y1,x2,y2,o){o=o||{};return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.4,'stroke-dasharray':o.dash||'none',class:o.cls||''});}
function arrow(g,x1,y1,x2,y2,o){o=o||{};var col=o.stroke||C.text2;var sw=o.sw||1.5;E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':sw,'stroke-dasharray':o.dash||'none',class:o.cls||''});var ang=Math.atan2(y2-y1,x2-x1);var ah=o.ah||7;E(g,'polygon',{points:x2+','+y2+' '+(x2-ah*Math.cos(ang-0.42))+','+(y2-ah*Math.sin(ang-0.42))+' '+(x2-ah*Math.cos(ang+0.42))+','+(y2-ah*Math.sin(ang+0.42)),fill:col});}
function circ(g,cx,cy,r,o){o=o||{};return E(g,'circle',{cx:cx,cy:cy,r:r,fill:o.fill||C.tealSoft,stroke:o.stroke||C.teal,'stroke-width':o.sw||1.5,class:o.cls||''});}

function setPills(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){var s=document.createElement('span');s.className='stat-pill';var d=document.createElement('span');d.className='dot';d.style.background=p.c||C.teal;var l=document.createElement('span');l.className='label';l.textContent=p.k;var v=document.createElement('span');v.className='val';v.textContent=p.v;s.appendChild(d);s.appendChild(l);s.appendChild(v);c.appendChild(s);});}

function radar(g,cx,cy,r,labels,values,color){var n=labels.length,k,i,a,rr;for(k=1;k<=4;k++){var pts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*k/4;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:'#1e2433','stroke-width':1});}for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:'#1e2433',sw:1});}var dpts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];dpts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}E(g,'polygon',{points:dpts.join(' '),fill:color+'33',stroke:color,'stroke-width':2,cls:'aglow'});for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:color,stroke:'none'});}for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lr=r+20;txt(g,cx+lr*Math.cos(a),cy+lr*Math.sin(a)+4,labels[i],{s:10.5,f:C.text2});}}

{n:'01',t:'RAG四代演进全景',d:'从Naive RAG到Agentic RAG——检索增强生成四代架构的代际演进、架构对比与能力雷达图谱。',v:['代际演进','架构对比','能力雷达']},
{n:'02',t:'Agentic RAG多智能体架构',d:'多Agent协同检索架构：查询规划器、检索器、证据对齐器、答案评审器的角色分工与协同流程。',v:['多Agent架构','角色分工','协同流程']},
{n:'03',t:'GraphRAG与知识图谱融合',d:'GraphRAG架构：文档实体抽取、知识图谱构建、社区层次聚类与向量+图谱+关键词混合检索。',v:['GraphRAG架构','图谱构建','混合检索']},
{n:'04',t:'Agentic检索策略',d:'迭代检索、自适应检索、多跳检索三大策略，查询规划分解与自适应源路由决策。',v:['检索策略','查询规划','自适应路由']},
{n:'05',t:'认知检索引擎',d:'认知检索引擎：理解-推理-生成三层架构，思维链推理增强检索与证据评估冲突消解。',v:['认知架构','推理增强','证据评估']},
{n:'06',t:'企业级RAG落地',d:'企业级RAG落地挑战(74%失败率)、技术选型(Milvus/LangChain/LlamaIndex)与效果评估体系。',v:['落地挑战','技术选型','效果评估']},
{n:'07',t:'RAG与微调融合',d:'RAG与微调融合架构：参数化知识与检索式知识的分层融合策略与优化方向。',v:['融合架构','知识分层','优化策略']},
{n:'08',t:'未来知识架构愿景',d:'2026-2030技术路线图、认知知识库愿景与融合参数化/检索/推理的终极知识架构。',v:['技术路线','认知知识库','终极愿景']}
];

var mCur=0,mViews=[0,0,0,0,0,0,0,0],mLayers={};

function buildNav(){
var nav=$('nav');clearNode(nav);
MODULES.forEach(function(m,i){

b.innerHTML='<span style="font-family:var(--mono);font-size:11px;color:var(--text3)">'+m.n+'</span> '+m.t;
b.onclick=function(){showModule(i);};
nav.appendChild(b);
});
}

function buildStage(){
var stage=$('stage');clearNode(stage);
MODULES.forEach(function(m,i){
var sec=document.createElement('section');
sec.id='mod-'+i;
sec.style.display=i===mCur?'block':'none';
var head='<div class="module-head"><span class="module-num">M'+m.n+'</span><span class="module-title">'+m.t+'</span></div>';
head+='<div class="module-desc">'+m.d+'</div>';
var tabs='<div class="view-tabs" id="tabs-'+i+'">';
m.v.forEach(function(vt,vi){
tabs+='<button class="view-tab'+(vi===0?' active':'')+'" onclick="m'+(i+1)+'View('+vi+')">'+vt+'</button>';
});
tabs+='</div>';
var frame='<div class="viz-frame"><svg class="viz-svg" viewBox="0 0 900 480" id="svg-'+i+'"><g id="layer-'+i+'"></g></svg></div>';
var below='<div class="below"><div><div class="panel-label">关键指标</div><div class="stat-row" id="m'+(i+1)+'-stat"></div></div><div><div class="panel-label">图例说明</div><div class="legend-row" id="m'+(i+1)+'-leg"></div></div></div>';

});
}

function setView(mi,vi){
mViews[mi]=vi;
var tabs=$('tabs-'+mi);
Array.prototype.forEach.call(tabs.children,function(t,ti){
t.classList.toggle('active',ti===vi);
});
drawModule(mi);
}

function drawModule(mi){
var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
fns[mi]();
}

function showModule(i){
mCur=i;
MODULES.forEach(function(m,mi){
var s=$('mod-'+mi);

}

function m2View(v){setView(1,v);}
function m3View(v){setView(2,v);}
function m4View(v){setView(3,v);}
function m5View(v){setView(4,v);}
function m6View(v){setView(5,v);}
function m7View(v){setView(6,v);}

txt(g,450,32,'RAG四代演进时间线 · 2020-2026',{s:15,w:600,f:C.teal});

{x:245,c:C.cyan,t:'Advanced RAG',steps:['查询重写','向量检索','重排序','答案生成']},
{x:460,c:C.purple,t:'Modular RAG',steps:['路由分发','多路召回','融合重排','答案生成']},
{x:675,c:C.teal,t:'Agentic RAG',steps:['智能体规划','迭代检索','证据评估','反思修正','答案生成']}
