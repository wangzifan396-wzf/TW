<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高级系统设计可视化实验室 · Systems Design Advanced Viz Lab</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#38bdf8;--accent2:#0ea5e9;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 20% 0%,rgba(56,189,248,0.06),transparent 50%);
}
code,.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
a{color:inherit;text-decoration:none}
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(8,9,10,0.85);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1280px;margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-0.01em}
.logo-mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  color:#08090a;font-weight:700;font-size:13px;
}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav-pill{
  font-size:12px;padding:6px 11px;border-radius:7px;color:var(--text2);
  background:transparent;border:1px solid transparent;cursor:pointer;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;white-space:nowrap;
}
.nav-pill:hover{color:var(--text);background:var(--bg2);border-color:var(--border)}
.nav-pill.active{color:var(--accent);background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.3)}
.container{max-width:1280px;margin:0 auto;padding:32px 28px 120px}
.hero{padding:24px 0 40px;border-bottom:1px solid var(--border);margin-bottom:48px}
.hero h1{font-size:34px;letter-spacing:-0.02em;font-weight:600;margin-bottom:10px}
.hero h1 .glow{color:var(--accent)}
.hero p{color:var(--text2);font-size:15px;max-width:680px}
.hero .meta{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--text3)}
.hero .meta span{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.module{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:28px 30px;margin-bottom:28px;scroll-margin-top:80px;
  transition:border-color .2s ease;
}
.module:hover{border-color:var(--border2)}
.module-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.module-num{
  flex-shrink:0;width:34px;height:34px;border-radius:9px;
  background:var(--bg3);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600;
}
.module-title{flex:1;min-width:200px}
.module-title h2{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px}
.module-title p{color:var(--text2);font-size:13.5px}
.badge{
  font-size:11px;padding:3px 9px;border-radius:5px;
  background:var(--bg3);color:var(--text3);border:1px solid var(--border);
  font-family:'SF Mono',Monaco,Consolas,monospace;
}
.badge.accent{color:var(--accent);border-color:rgba(56,189,248,0.3);background:rgba(56,189,248,0.08)}
.module-body{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.module-body.full{grid-template-columns:1fr}
.panel{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px;
}
.panel-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;font-weight:600}
.desc{color:var(--text2);font-size:13.5px;margin-bottom:16px;line-height:1.7}
.desc strong{color:var(--text)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{
  font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:7px;
  background:var(--bg3);color:var(--text);border:1px solid var(--border2);cursor:pointer;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#08090a;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#08090a}
.btn.sm{font-size:11.5px;padding:5px 10px}
.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,0.1)}
.slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
.slider-row input[type=range]{
  -webkit-appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;width:110px;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--bg);
}
.slider-row .val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:36px}
svg{display:block;width:100%;height:auto}
.svg-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:hidden}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.stat .v{font-size:16px;color:var(--text);font-family:'SF Mono',Monaco,Consolas,monospace;margin-top:2px}
.stat .v.acc{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
table.cmp th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em}
table.cmp td{color:var(--text2)}
table.cmp tr:hover td{color:var(--text)}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;pointer-events:none;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-nav{
  display:flex;justify-content:space-between;gap:12px;margin-top:48px;
  padding-top:24px;border-top:1px solid var(--border);
}
.bn-btn{
  flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;
}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.bn-btn .name{font-size:14px;color:var(--text);margin-top:3px}
.bn-btn.next{text-align:right}
.bn-btn[disabled]{opacity:0.4;pointer-events:none}
@media(max-width:820px){
  .module-body{grid-template-columns:1fr}
  .hero h1{font-size:26px}
  .container{padding:24px 16px 100px}
  .header-inner{padding:12px 16px}
}
.flow-arrow{stroke:var(--text3);stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.pulse{animation:pulse 1.5s ease-in-out 8s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.grid-overlay{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:0.3}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">S</div>
      <span>Systems Design · 高级系统设计</span>
    </div>
    <div class="nav-pills" id="navPills"></div>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>高级系统设计 <span class="glow">可视化实验室</span></h1>
    <p>8 个交互式模块，深度剖析分布式系统核心机制：限流、一致性哈希、分布式锁、消息队列、缓存策略、分库分表、服务发现、熔断降级。所有可视化均由 SVG 实时绘制。</p>
    <div class="meta">
      <span><i class="dot"></i>8 Modules</span>
      <span><i class="dot"></i>Pure SVG / Canvas</span>
      <span><i class="dot"></i>Zero Dependencies</span>
      <span><i class="dot"></i>Linear Dark Aesthetic</span>
    </div>
  </div>

  <div id="modules"></div>

  <div class="bottom-nav">
    <div class="bn-btn prev" id="bnPrev">
      <div class="lbl">← Previous</div><div class="name" id="bnPrevName">—</div>
    </div>
    <div class="bn-btn next" id="bnNext">
      <div class="lbl">Next →</div><div class="name" id="bnNextName">—</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
/* ============================================================
   全局工具
============================================================ */
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};
const toast = (msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);};
const rnd = (a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MODULES = [
  {id:'rate-limit',num:'01',name:'限流算法',en:'Rate Limiting'},
  {id:'consistent-hash',num:'02',name:'一致性哈希',en:'Consistent Hashing'},
  {id:'distributed-lock',num:'03',name:'分布式锁',en:'Distributed Lock'},
  {id:'mq-patterns',num:'04',name:'消息队列模式',en:'Message Queue'},
  {id:'cache-strategy',num:'05',name:'缓存策略',en:'Cache Strategy'},
  {id:'sharding',num:'06',name:'分库分表',en:'Sharding'},
  {id:'service-discovery',num:'07',name:'服务发现',en:'Service Discovery'},
  {id:'circuit-breaker',num:'08',name:'熔断降级',en:'Circuit Breaker'},
];

/* 构建导航 */
const navPills = $('#navPills');
MODULES.forEach((m,i)=>{
  const b=document.createElement('div');
  b.className='nav-pill';b.textContent=m.num;b.dataset.target=m.id;
  b.onclick=()=>document.getElementById(m.id).scrollIntoView({behavior:'smooth',block:'start'});
  navPills.appendChild(b);
});

/* 构建模块容器 */
const modulesEl = $('#modules');
MODULES.forEach(m=>{
  const sec=document.createElement('section');
  sec.className='module';sec.id=m.id;
  sec.innerHTML=`
    <div class="module-head">
      <div class="module-num">${m.num}</div>
      <div class="module-title"><h2>${m.name}</h2><p>${m.en}</p></div>
      <span class="badge accent">Module ${m.num}</span>
    </div>
    <div class="module-body" id="body-${m.id}"></div>`;
  modulesEl.appendChild(sec);
});

/* ============================================================
   模块 1: 限流算法
============================================================ */
(()=>{
  const body=$('#body-rate-limit');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">算法对比可视化</div>
      <div class="desc">三种主流限流算法对比：<strong>令牌桶</strong>(允许突发)、<strong>漏桶</strong>(匀速流出)、<strong>滑动窗口</strong>(精确窗口)。点击不同算法切换，调整请求速率观察效果。</div>
      <div class="controls">
        <button class="btn active" data-algo="token">令牌桶</button>
        <button class="btn" data-algo="leaky">漏桶</button>
        <button class="btn" data-algo="sliding">滑动窗口</button>
        <div class="slider-row">请求速率 <input type="range" id="rl-rate" min="1" max="20" value="8"><span class="val" id="rl-rate-v">8/s</span></div>
      </div>
      <div class="svg-wrap"><svg id="rl-svg" viewBox="0 0 460 240"></svg></div>
      <div class="stat-grid">
        <div class="stat"><div class="k">通过</div><div class="v acc" id="rl-pass">0</div></div>
        <div class="stat"><div class="k">拒绝</div><div class="v" id="rl-reject" style="color:var(--red)">0</div></div>
        <div class="stat"><div class="k">令牌/水位</div><div class="v" id="rl-level">—</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">算法特性</div>
      <table class="cmp">
        <tr><th>算法</th><th>突发流量</th><th>匀速输出</th><th>精度</th><th>实现</th></tr>
        <tr><td>令牌桶</td><td>允许</td><td>否</td><td>中</td><td>简单</td></tr>
        <tr><td>漏桶</td><td>拒绝</td><td>是</td><td>中</td><td>中等</td></tr>
        <tr><td>滑动窗口</td><td>受限</td><td>否</td><td>高</td><td>复杂</td></tr>
      </table>
      <div class="panel-title" style="margin-top:18px">原理说明</div>
      <div class="desc" id="rl-desc"></div>
    </div>`;
  const svg=$('#rl-svg');
  let algo='token',rate=8,pass=0,reject=0,level=10;
  const capacity=10;
  $$('#body-rate-limit [data-algo]').forEach(b=>b.onclick=()=>{
    $$('#body-rate-limit [data-algo]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');algo=b.dataset.algo;pass=0;reject=0;level=algo==='token'?10:0;
    updateDesc();
  });
  $('#rl-rate').oninput=e=>{rate=+e.target.value;$('#rl-rate-v').textContent=rate+'/s';};
  const descs={
    token:'令牌以固定速率 r 向桶中添加，桶容量为 C。每个请求消耗一个令牌。桶满则丢弃新令牌；无令牌则拒绝请求。允许突发：桶满时可瞬间处理 C 个请求。',
    leaky:'水(请求)以任意速率流入漏桶，桶以固定速率 r 漏出。水满时新请求被拒绝。输出永远匀速 r，平滑突发流量，保护下游系统。',
    sliding:'将窗口分为 N 个小格子(如 1s 分 10 格 100ms)。每次请求删除过期格子，当前格子计数+1。窗口内总数超阈值则拒绝。精度高，无临界点突变问题。'
  };
  function updateDesc(){$('#rl-desc').textContent=descs[algo];}
  updateDesc();
  function draw(){
    svg.innerHTML='';
    const W=460,H=240;
    // 桶
    const bx=180,by=70,bw=100,bh=120;
    svg.appendChild(el('rect',{x:bx,y:by,width:bw,height:bh,rx:8,fill:'none',stroke:'var(--border2)','stroke-width':2}));
    if(algo==='token'){
      const fillH=(level/capacity)*bh;
      svg.appendChild(el('rect',{x:bx+2,y:by+bh-fillH,width:bw-4,height:fillH,fill:'rgba(56,189,248,0.15)',rx:6}));
      // 令牌
      for(let i=0;i<Math.floor(level);i++){
        const ty=by+bh-12-i*12;
        if(ty>by+4)svg.appendChild(el('circle',{cx:bx+bw/2,cy:ty,r:4,fill:'var(--accent)'}));
      }
      svg.appendChild(el('text',{x:bx+bw/2,y:by-12,'text-anchor':'middle',fill:'var(--text2)','font-size':11,'font-family':'monospace'},'+r'));
      // 请求箭头
      svg.appendChild(el('text',{x:bx-60,y:by+40,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'请求'));
      svg.appendChild(el('line',{x1:bx-60,y1:by+50,x2:bx-5,y2:by+50,class:'flow-arrow'}));
      svg.appendChild(el('text',{x:bx+bw+10,y:by+90,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'通过'));
      svg.appendChild(el('line',{x1:bx+bw+5,y1:by+90,x2:bx+bw+60,y2:by+90,class:'flow-arrow'}));
    }else if(algo==='leaky'){
      const fillH=(level/capacity)*bh;
      svg.appendChild(el('rect',{x:bx+2,y:by+bh-fillH,width:bw-4,height:fillH,fill:'rgba(56,189,248,0.15)',rx:6}));
      // 水波
      svg.appendChild(el('path',{d:`M${bx+2},${by+bh-fillH} Q${bx+bw/2},${by+bh-fillH-4} ${bx+bw-2},${by+bh-fillH}`,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));
      svg.appendChild(el('text',{x:bx+bw/2,y:by-12,'text-anchor':'middle',fill:'var(--text2)','font-size':11,'font-family':'monospace'},'流入'));
      svg.appendChild(el('line',{x1:bx+bw/2,y1:by+bh,x2:bx+bw/2,y2:by+bh+30,class:'flow-arrow'}));
      svg.appendChild(el('text',{x:bx+bw/2,y:by+bh+45,'text-anchor':'middle',fill:'var(--text2)','font-size':11,'font-family':'monospace'},'匀速漏出 r/s'));
    }else{
      // 滑动窗口
      const cells=10;const cw=bw/cells;
      const counters=window._slidingCount||new Array(cells).fill(0);
      window._slidingCount=counters;
      for(let i=0;i<cells;i++){
        const c=counters[i];
        const h=(c/Math.max(1,rate))*bh*0.6;
        svg.appendChild(el('rect',{x:bx+i*cw+1,y:by+bh-h,width:cw-2,height:h,fill:'rgba(56,189,248,0.4)',rx:2}));
        svg.appendChild(el('line',{x1:bx+i*cw,y1:by,x2:bx+i*cw,y2:by+bh,stroke:'var(--border)','stroke-width':0.5}));
      }
      svg.appendChild(el('rect',{x:bx,y:by,width:bw,height:bh,fill:'none',stroke:'var(--border2)','stroke-width':1.5,rx:4}));
      svg.appendChild(el('text',{x:bx,y:by-12,fill:'var(--text2)','font-size':11,'font-family':'monospace'},'← 过去        现在 →'));
      svg.appendChild(el('text',{x:bx+bw+10,y:by+40,fill:'var(--accent)','font-size':11,'font-family':'monospace'},'窗口内总数'));
    }
    // 统计
    $('#rl-pass').textContent=pass;
    $('#rl-reject').textContent=reject;
    $('#rl-level').textContent=algo==='sliding'?'—':level.toFixed(1)+'/'+capacity;
  }
  let last=performance.now(),tick=0;
  function loop(now){
    const dt=(now-last)/1000;last=now;
    const incoming=rate*dt*(0.7+Math.random()*0.6);
    for(let i=0;i<Math.floor(incoming)+1;i++){
      if(Math.random()>incoming-Math.floor(incoming)&&i===Math.floor(incoming))break;
      if(algo==='token'){
        if(level>=1){level-=1;pass++;}
        else reject++;
      }else if(algo==='leaky'){
        if(level<capacity)level+=0.8;
        else reject++;
      }else{
        const cells=window._slidingCount||new Array(cells).fill(0);
        const cur=0;const total=(window._slidingCount||[]).reduce((a,b)=>a+b,0);
        if(total<rate){window._slidingCount=window._slidingCount||new Array(10).fill(0);window._slidingCount[9]++;pass++;}
        else reject++;
      }
    }
    if(algo==='token')level=Math.min(capacity,level+dt*rate*0.6);
    if(algo==='leaky')level=Math.max(0,level-dt*rate*0.5);
    if(algo==='sliding'){
      tick+=dt;
      if(tick>0.3){tick=0;window._slidingCount=window._slidingCount||new Array(10).fill(0);window._slidingCount.shift();window._slidingCount.push(0);}
    }
    if(Math.random()<0.1)draw();
    requestAnimationFrame(loop);
  }
  draw();
  requestAnimationFrame(loop);
})();

/* ============================================================
   模块 2: 一致性哈希
============================================================ */
(()=>{
  const body=$('#body-consistent-hash');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">哈希环与虚拟节点</div>
      <div class="desc">一致性哈希将节点和数据映射到 0~2^32 环上。数据顺时针找到的第一个节点即为其归属。<strong>虚拟节点</strong>解决数据倾斜。点击"增加节点"观察数据迁移。</div>
      <div class="controls">
        <button class="btn primary" id="ch-add">+ 节点</button>
        <button class="btn" id="ch-remove">- 节点</button>
        <button class="btn" id="ch-vnode">虚拟节点 x3</button>
        <button class="btn" id="ch-reset">重置</button>
      </div>
      <div class="svg-wrap"><svg id="ch-svg" viewBox="0 0 320 320"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">数据分布统计</div>
      <div class="desc" id="ch-info">环上节点与 60 个数据 key 的分布。开启虚拟节点后分布更均匀。</div>
      <div id="ch-bars"></div>
      <div class="stat-grid">
        <div class="stat"><div class="k">节点数</div><div class="v acc" id="ch-nodes">3</div></div>
        <div class="stat"><div class="k">最大/最小</div><div class="v" id="ch-ratio">—</div></div>
        <div class="stat"><div class="k">迁移量</div><div class="v" id="ch-migrate" style="color:var(--amber)">0</div></div>
      </div>
    </div>`;
  const svg=$('#ch-svg');
  const CX=160,CY=160,R=120;
  let nodes=[],keys=[],vnodeFactor=1,lastOwner={};
  const colors=['#38bdf8','#f87171','#34d399','#fbbf24','#a78bfa','#f472b6'];
  function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
  function initKeys(){keys=[];for(let i=0;i<60;i++)keys.push({k:'key-'+i,h:hash('key-'+i)});}
  initKeys();
  function addNode(){
    const id=nodes.length;const name='N'+id;
    const positions=[];
    for(let v=0;v<vnodeFactor;v++)positions.push((hash(name+'#v'+v)>>>0)/4294967296);
    nodes.push({id,name,positions,color:colors[id%colors.length]});
    recompute();
  }
  function recompute(){
    const allVnodes=[];
    nodes.forEach(n=>n.positions.forEach((p,i)=>allVnodes.push({pos:p,node:n,virtual:true})));
    allVnodes.sort((a,b)=>a.pos-b.pos);
    const newOwner={};let migrate=0;
    keys.forEach(k=>{
      let idx=allVnodes.findIndex(v=>v.pos>=k.h/4294967296);
      if(idx===-1)idx=0;
      const owner=allVnodes[idx].node.name;
      newOwner[k.k]=owner;
      if(lastOwner[k.k]&&lastOwner[k.k]!==owner)migrate++;
    });
    lastOwner=newOwner;window._chMigrate=migrate;
    draw(allVnodes);
  }
  function draw(allVnodes){
    svg.innerHTML='';
    svg.appendChild(el('defs')).innerHTML=`<marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--text3)"/></marker>`;
    // 环
    svg.appendChild(el('circle',{cx:CX,cy:CY,r:R,fill:'none',stroke:'var(--border2)','stroke-width':1.5}));
    // 节点
    nodes.forEach(n=>{
      n.positions.forEach((p,i)=>{
        const a=p*Math.PI*2-Math.PI/2;
        const x=CX+Math.cos(a)*R,y=CY+Math.sin(a)*R;
        svg.appendChild(el('circle',{cx:x,cy:y,r:vnodeFactor>1&&i>0?3:6,fill:n.color,stroke:'var(--bg)','stroke-width':1.5}));
        if(i===0)svg.appendChild(el('text',{x:x+(Math.cos(a)>0?8:-8),y:y+4,fill:n.color,'font-size':9,'font-family':'monospace','text-anchor':Math.cos(a)>0?'start':'end'},n.name));
      });
    });
    // 数据点
    keys.forEach(k=>{
      const a=(k.h/4294967296)*Math.PI*2-Math.PI/2;
      const r=R-14;const x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r;
      const owner=lastOwner[k.k];const node=nodes.find(n=>n.name===owner);
      svg.appendChild(el('circle',{cx:x,cy:y,r:2,fill:node?node.color:'var(--text3)'}));
    });
    // 节点弧段
    if(allVnodes.length>0){
      let prev=allVnodes[allVnodes.length-1];
      allVnodes.forEach(v=>{
        const a1=prev.pos*Math.PI*2-Math.PI/2;
        const a2=v.pos*Math.PI*2-Math.PI/2;
        const large=Math.abs(a2-a1)>Math.PI?1:0;
        svg.appendChild(el('path',{d:`M${CX+Math.cos(a1)*R},${CY+Math.sin(a1)*R} A${R},${R} 0 ${large} 1 ${CX+Math.cos(a2)*R},${CY+Math.sin(a2)*R}`,fill:'none',stroke:v.node.color,'stroke-width':3,'opacity':0.35}));
        prev=v;
      });
    }
    // 统计
    const counts={};nodes.forEach(n=>counts[n.name]=0);
    keys.forEach(k=>{if(lastOwner[k.k])counts[lastOwner[k.k]]++;});
    const vals=Object.values(counts);
    const max=Math.max(...vals),min=Math.min(...vals);
    $('#ch-nodes').textContent=nodes.length;
    $('#ch-ratio').textContent=vals.length?`${max}/${min}`:'—';
    $('#ch-migrate').textContent=window._chMigrate||0;
    const bars=$('#ch-bars');bars.innerHTML='';
    nodes.forEach(n=>{
      const c=counts[n.name]||0;const pct=keys.length?(c/keys.length*100):0;
      const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px';
      row.innerHTML=`<span style="width:24px;color:${n.color};font-family:monospace">${n.name}</span>
        <div style="flex:1;height:18px;background:var(--bg3);border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${n.color};opacity:0.7;transition:width .4s"></div>
        </div>
        <span style="width:42px;text-align:right;color:var(--text2);font-family:monospace">${c}</span>`;
      bars.appendChild(row);
    });
  }
  $('#ch-add').onclick=()=>{if(nodes.length<6){addNode();toast('新增节点 N'+(nodes.length-1));}};
  $('#ch-remove').onclick=()=>{if(nodes.length>1){nodes.pop();recompute();toast('移除节点');}};
  $('#ch-vnode').onclick=(e)=>{vnodeFactor=vnodeFactor===1?3:1;e.target.classList.toggle('active',vnodeFactor===3);
    nodes.forEach(n=>{n.positions=[];for(let v=0;v<vnodeFactor;v++)n.positions.push((hash(n.name+'#v'+v)>>>0)/4294967296);});
    recompute();toast('虚拟节点 x'+vnodeFactor);};
  $('#ch-reset').onclick=()=>{nodes=[];lastOwner={};for(let i=0;i<3;i++)addNode();toast('已重置');};
  for(let i=0;i<3;i++)addNode();
})();

/* ============================================================
   模块 3: 分布式锁
============================================================ */
(()=>{
  const body=$('#body-distributed-lock');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">三种分布式锁实现</div>
      <div class="desc">点击"获取锁"模拟流程。<strong>Redis Redlock</strong>：多数节点加锁成功；<strong>Zookeeper</strong>：临时顺序节点+watch；<strong>ETCD</strong>：Lease+Compare-And-Swap。</div>
      <div class="controls">
        <button class="btn active" data-impl="redis">Redis Redlock</button>
        <button class="btn" data-impl="zk">Zookeeper</button>
        <button class="btn" data-impl="etcd">ETCD</button>
        <button class="btn primary" id="dl-acquire">获取锁</button>
        <button class="btn" id="dl-release">释放</button>
      </div>
      <div class="svg-wrap"><svg id="dl-svg" viewBox="0 0 460 260"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">特性对比</div>
      <table class="cmp">
        <tr><th>实现</th><th>一致性</th><th>可用性</th><th>性能</th><th>FIFO</th></tr>
        <tr><td>Redis Redlock</td><td>AP</td><td>高</td><td>极高</td><td>否</td></tr>
        <tr><td>Zookeeper</td><td>CP</td><td>中</td><td>中</td><td>是</td></tr>
        <tr><td>ETCD</td><td>CP</td><td>高</td><td>高</td><td>否</td></tr>
      </table>
      <div class="panel-title" style="margin-top:18px">关键机制</div>
      <div class="desc" id="dl-desc"></div>
      <div class="legend">
        <span><i style="background:var(--green)"></i>成功</span>
        <span><i style="background:var(--amber)"></i>等待/重试</span>
        <span><i style="background:var(--red)"></i>失败</span>
        <span><i style="background:var(--accent)"></i>锁持有</span>
      </div>
    </div>`;
  const svg=$('#dl-svg');
  let impl='redis',holding=false;
  const descs={
    redis:'Redlock：客户端向 N(通常5)个独立 Redis 实例发送 SET NX PX 加锁，获得多数(N/2+1)成功且耗时小于 TTL 即认为加锁成功。释放时向所有节点发送 Lua 删除。依赖时钟同步，存在 GC pause 风险(Martin Kleppmann 质疑)。',
    zk:'Zookeeper：创建 /lock 下的临时顺序节点 node_n，判断自己是否序号最小。最小者获锁；否则 watch 前一个节点。前节点删除触发唤醒。会话断开自动删除临时节点，避免死锁。严格 FIFO 公平锁。',
    etcd:'ETCD：基于 Raft 的 KV。用 Lease(租约)保证活性，txn(compare version==0 then put) 实现 CAS 原子加锁。续约 keep-alive 防止过期。CP 系统，强一致，Kubernetes 内置使用。'
  };
  function updateDesc(){$('#dl-desc').textContent=descs[impl];}
  updateDesc();
  $$('#body-distributed-lock [data-impl]').forEach(b=>b.onclick=()=>{
    $$('#body-distributed-lock [data-impl]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');impl=b.dataset.impl;holding=false;updateDesc();draw();
  });
  function draw(steps){
    svg.innerHTML='';
    const W=460;
    let client,targets;
    if(impl==='redis'){
      client={x:40,y:130};
      targets=[110,180,250,320,390].map((x,i)=>({x,y:130,label:'R'+i}));
    }else if(impl==='zk'){
      client={x:40,y:130};
      targets=[{x:230,y:60,label:'zk1'},{x:300,y:130,label:'zk2'},{x:230,y:200,label:'zk3'}];
    }else{
      client={x:40,y:130};
      targets=[{x:200,y:60,label:'etcd1'},{x:280,y:130,label:'etcd2'},{x:200,y:200,label:'etcd3'}];
    }
    // client
    svg.appendChild(el('rect',{x:client.x-25,y:client.y-18,width:50,height:36,rx:6,fill:'var(--bg3)',stroke:'var(--accent)','stroke-width':1.5}));
    svg.appendChild(el('text',{x:client.x,y:client.y+4,'text-anchor':'middle',fill:'var(--accent)','font-size':11,'font-family':'monospace'},'Client'));
    targets.forEach((t,i)=>{
      const ok=steps?steps[i]:null;
      let color='var(--border2)';
      if(ok==='ok')color='var(--green)';
      else if(ok==='wait')color='var(--amber)';
      else if(ok==='fail')color='var(--red)';
      svg.appendChild(el('rect',{x:t.x-26,y:t.y-18,width:52,height:36,rx:6,fill:'var(--bg3)',stroke:color,'stroke-width':1.5}));
      svg.appendChild(el('text',{x:t.x,y:t.y+4,'text-anchor':'middle',fill:'var(--text2)','font-size':10,'font-family':'monospace'},t.label));
      if(holding||ok){
        svg.appendChild(el('line',{x1:client.x+25,y1:client.y,x2:t.x-26,y2:t.y,stroke:color,'stroke-width':1.3,'marker-end':'url(#arr3)','stroke-dasharray':ok?'none':'4 3',opacity:0.8}));
      }
    });
    svg.appendChild(el('defs')).innerHTML=`<marker id="arr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--text3)"/></marker>`;
    if(holding){
      svg.appendChild(el('text',{x:230,y:240,'text-anchor':'middle',fill:'var(--green)','font-size':12,'font-family':'monospace'},'锁持有中 · TTL 倒计时'));
    }
  }
  function animate(){
    holding=false;
    if(impl==='redis'){
      let results=[];let i=0;
      const iv=setInterval(()=>{
        results.push(Math.random()>0.15?'ok':'fail');
        draw(results);
        i++;
        if(i>=5){
          clearInterval(iv);
          const okc=results.filter(r=>r==='ok').length;
          holding=okc>=3;
          draw(results);
          toast(holding?'Redlock 获取成功 ('+okc+'/5)':'加锁失败，未达多数');
        }
      },300);
    }else if(impl==='zk'){
      let step=0;
      const seq=['创建临时顺序节点','判断序号最小','watch 前驱节点','前驱释放，获锁'];
      const iv=setInterval(()=>{
        draw(step>=2?['wait','wait','wait']:['ok','ok','ok']);
        toast('ZK: '+seq[step]);
        step++;
        if(step>=seq.length){clearInterval(iv);holding=true;draw(['ok','ok','ok']);toast('ZK 锁获取成功');}
      },700);
    }else{
      let step=0;
      const seq=['申请 Lease','txn CAS (version==0)','keep-alive 续约','锁获取成功'];
      const iv=setInterval(()=>{
        draw(['ok','ok','ok']);
        toast('ETCD: '+seq[step]);
        step++;
        if(step>=seq.length){clearInterval(iv);holding=true;draw(['ok','ok','ok']);toast('ETCD 锁获取成功');}
      },650);
    }
  }
  draw();
  $('#dl-acquire').onclick=()=>{if(!holding)animate();else toast('已持有锁');};
  $('#dl-release').onclick=()=>{holding=false;draw();toast('锁已释放');};
})();

      m.y+=(m.ty-m.y)*0.08;
    });
    msgs=msgs.filter(m=>Math.abs(m.tx-m.x)>2||Math.abs(m.ty-m.y)>2);
    if(msgs.length>0){msgs.forEach(m=>{if(Math.abs(m.tx-m.x)<4&&Math.abs(m.ty-m.y)<4){if(m.dead)dead++;else consumed++;}});draw();}
    requestAnimationFrame(animate);
  }
  draw();animate();
})();

  function draw(){

    // App
    svg.appendChild(el('rect',{x:30,y:85,width:60,height:50,rx:6,fill:'var(--bg3)',stroke:'var(--accent)','stroke-width':1.5}));
    svg.appendChild(el('text',{x:60,y:114,'text-anchor':'middle',fill:'var(--accent)','font-size':11,'font-family':'monospace'},'App'));
    // Cache
    svg.appendChild(el('rect',{x:190,y:50,width:70,height:50,rx:6,fill:'var(--bg3)',stroke:'var(--amber)','stroke-width':1.5}));
    svg.appendChild(el('text',{x:225,y:80,'text-anchor':'middle',fill:'var(--amber)','font-size':11,'font-family':'monospace'},'Cache'));
    // DB
    svg.appendChild(el('rect',{x:190,y:135,width:70,height:50,rx:6,fill:'var(--bg3)',stroke:'var(--green)','stroke-width':1.5}));
    svg.appendChild(el('text',{x:225,y:165,'text-anchor':'middle',fill:'var(--green)','font-size':11,'font-family':'monospace'},'DB'));
    // flows
    flows.forEach(f=>{
      svg.appendChild(el('line',{x1:f.x1,y1:f.y1,x2:f.x2,y2:f.y2,stroke:f.color,'stroke-width':1.5,'marker-end':f.marker,opacity:f.opacity||0.9,'stroke-dasharray':f.dash||'none'}));
      svg.appendChild(el('circle',{cx:f.x1+(f.x2-f.x1)*f.p,cy:f.y1+(f.y2-f.y1)*f.p,r:4,fill:f.color}));
    });
    if(strat==='behind'){
      svg.appendChild(el('text',{x:340,y:100,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'异步刷盘'));
      svg.appendChild(el('text',{x:340,y:115,fill:'var(--text3)','font-size':9,'font-family':'monospace'},'(batch)'));
    }
  }
  function addFlow(x1,y1,x2,y2,color,marker){
    flows.push({x1,y1,x2,y2,color,marker,p:0,opacity:0.9});
  }
  function doWrite(){
    flows=[];
    if(strat==='aside'){
      addFlow(90,110,190,160,'var(--green)','url(#arr5g)'); // app->DB
      const f2={x1:225,y1:135,x2:225,y2:100,color:'var(--red)',marker:'url(#arr5a)',p:0,opacity:0.9,dash:'4 3'};
      flows.push(f2);
      setTimeout(()=>{flows=[];toast('Cache Aside 写: 更新DB → 删除缓存');},1500);
    }else if(strat==='through'){
      addFlow(90,110,190,75,'var(--amber)','url(#arr5a)');
      const f2={x1:225,y1:100,x2:225,y2:135,color:'var(--green)',marker:'url(#arr5g)',p:0};
      flows.push(f2);
      setTimeout(()=>{flows=[];toast('Write Through: 缓存同步写DB');},1800);
    }else{
      addFlow(90,110,190,75,'var(--amber)','url(#arr5a)');
      setTimeout(()=>{flows=[{x1:225,y1:100,x2:225,y2:135,color:'var(--green)',marker:'url(#arr5g)',p:0,dash:'4 3',opacity:0.6}];
        toast('Write Behind: 缓存先写，异步刷DB');},1200);
      setTimeout(()=>{flows=[];},3000);
    }
    draw();animateFlow();
  }
  function doRead(){
    flows=[{x1:90,y1:110,x2:190,y2:75,color:'var(--amber)',marker:'url(#arr5a)',p:0}];
    draw();animateFlow();
    setTimeout(()=>{
      flows.push({x1:90,y1:110,x2:190,y2:160,color:'var(--green)',marker:'url(#arr5g)',p:0});
      flows.push({x1:225,y1:135,x2:225,y2:100,color:'var(--amber)',marker:'url(#arr5a)',p:0,dash:'4 3'});
      draw();animateFlow();
      toast('读未命中 → 查DB → 回填缓存');
    },1200);
    setTimeout(()=>{flows=[];},3000);
  }
  let animId;
  function animateFlow(){
    cancelAnimationFrame(animId);
    function step(){
      let active=false;
      flows.forEach(f=>{if(f.p<1){f.p=Math.min(1,f.p+0.04);active=true;}});
      draw();
      if(active)animId=requestAnimationFrame(step);
    }
    step();
  }
  draw();
  $('#cs-write').onclick=doWrite;
  $('#cs-read').onclick=doRead;
})();

    <div class="panel">
      <div class="panel-title">滑动窗口统计</div>
      <div class="desc">Hystrix 默认 10 个 bucket，每个 1s，共 10s 窗口。统计窗口内总请求数与失败数，失败率超阈值且请求量达最小值则触发熔断。</div>
      <div id="cb-window"></div>
      <div class="stat-grid">
        <div class="stat"><div class="k">状态</div><div class="v acc" id="cb-state">CLOSED</div></div>
        <div class="stat"><div class="k">总请求</div><div class="v" id="cb-total">0</div></div>
        <div class="stat"><div class="k">失败数</div><div class="v" id="cb-fails" style="color:var(--red)">0</div></div>
        <div class="stat"><div class="k">失败率</div><div class="v" id="cb-rate">0%</div></div>
      </div>
    </div>`;
  const svg=$('#cb-svg');
  let state='CLOSED',window10=new Array(10).fill(0).map(()=>({s:0,f:0}));
  let thresh=50,halfOpenTimer=0;
  $('#cb-thresh').oninput=e=>{thresh=+e.target.value;$('#cb-thresh-v').textContent=thresh+'%';updateStats();};
  function totalReq(){return window10.reduce((a,b)=>a+b.s+b.f,0);}
  function totalFail(){return window10.reduce((a,b)=>a+b.f,0);}
  function failRate(){const t=totalReq();return t>0?totalFail()/t*100:0;}
  function updateStats(){
    $('#cb-state').textContent=state;
    const sc={'CLOSED':'var(--green)','OPEN':'var(--red)','HALF':'var(--amber)'};
    $('#cb-state').style.color=sc[state];
    $('#cb-total').textContent=totalReq();
    $('#cb-fails').textContent=totalFail();
    $('#cb-rate').textContent=failRate().toFixed(0)+'%';
    // window viz
    const w=$('#cb-window');w.innerHTML='';
    window10.forEach((b,i)=>{
      const total=b.s+b.f;const fp=total>0?b.f/total:0;
      const cell=document.createElement('div');
      cell.style.cssText='display:inline-block;width:9%;margin-right:1%;vertical-align:bottom';
      const h=Math.min(40,total*8);
      cell.innerHTML=`<div style="height:45px;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="height:${b.f*8>40?40:b.f*8}px;background:var(--red);opacity:0.7"></div>
        <div style="height:${b.s*8>40?40:b.s*8}px;background:var(--green);opacity:0.5"></div></div>
        <div style="text-align:center;font-size:9px;color:var(--text3);font-family:monospace;margin-top:2px">${i}</div>`;
      w.appendChild(cell);
    });
  }
  function transition(){
    if(state==='CLOSED'){
      if(totalReq()>=5&&failRate()>=thresh){state='OPEN';toast('失败率 '+failRate().toFixed(0)+'% ≥ '+thresh+'% → 熔断 OPEN');}
    }else if(state==='OPEN'){
      // 等待超时自动 half-open
    }else if(state==='HALF'){
      if(totalFail()>0){state='OPEN';toast('试探失败 → 重新 OPEN');}
      else if(totalReq()>=3){state='CLOSED';toast('试探成功 → CLOSED');window10=new Array(10).fill(0).map(()=>({s:0,f:0}));}
    }
  }
  function addReq(success){
    if(state==='OPEN'){toast('熔断中，请求被拒绝(快速失败)');updateStats();draw();return;}
    const idx=0; // 当前 bucket
    if(success)window10[idx].s++;else window10[idx].f++;
    transition();
    updateStats();draw();
  }
  function draw(){
    svg.innerHTML='';
    const states=[
      {n:'CLOSED',x:80,y:120,c:'var(--green)'},
      {n:'OPEN',x:230,y:120,c:'var(--red)'},
      {n:'HALF-OPEN',x:380,y:120,c:'var(--amber)'}
    ];
    states.forEach(s=>{
      const active=s.n===(state==='HALF'?'HALF-OPEN':state);
      svg.appendChild(el('circle',{cx:s.x,cy:s.y,r:active?42:36,fill:'none',stroke:s.c,'stroke-width':active?2.5:1.5,opacity:active?1:0.5}));
      if(active){
        const pulse=el('circle',{cx:s.x,cy:s.y,r:42,fill:'none',stroke:s.c,'stroke-width':1,opacity:0.4});
        pulse.classList.add('pulse');svg.appendChild(pulse);
      }
      svg.appendChild(el('text',{x:s.x,y:s.y+4,'text-anchor':'middle',fill:s.c,'font-size':11,'font-family':'monospace','font-weight':active?600:400},s.n));
    });
    // arrows
    svg.appendChild(el('defs')).innerHTML=`<marker id="arr8" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--text3)"/></marker>`;
    // CLOSED -> OPEN
    svg.appendChild(el('path',{d:`M ${122} ${110} Q ${155} ${70} ${190} ${110}`,fill:'none',stroke:'var(--red)','stroke-width':1.3,'marker-end':'url(#arr8)'}));
    svg.appendChild(el('text',{x:155,y:68,'text-anchor':'middle',fill:'var(--red)','font-size':9,'font-family':'monospace'},'失败率≥阈值'));
    // OPEN -> HALF
    svg.appendChild(el('path',{d:`M ${272} ${110} Q ${305} ${70} ${340} ${110}`,fill:'none',stroke:'var(--amber)','stroke-width':1.3,'marker-end':'url(#arr8)'}));
    svg.appendChild(el('text',{x:305,y:68,'text-anchor':'middle',fill:'var(--amber)','font-size':9,'font-family':'monospace'},'超时'));
    // HALF -> CLOSED
    svg.appendChild(el('path',{d:`M ${340} ${135} Q ${230} ${190} ${120} ${135}`,fill:'none',stroke:'var(--green)','stroke-width':1.3,'marker-end':'url(#arr8)'}));
    svg.appendChild(el('text',{x:230,y:205,'text-anchor':'middle',fill:'var(--green)','font-size':9,'font-family':'monospace'},'试探成功'));
    // HALF -> OPEN
    svg.appendChild(el('path',{d:`M ${360} ${135} Q ${300} ${175} ${250} ${140}`,fill:'none',stroke:'var(--red)','stroke-width':1,'marker-end':'url(#arr8)','stroke-dasharray':'3 2'}));
    svg.appendChild(el('text',{x:300,y:170,'text-anchor':'middle',fill:'var(--red)','font-size':8,'font-family':'monospace'},'试探失败'));
  }
  $('#cb-success').onclick=()=>addReq(true);
  $('#cb-fail').onclick=()=>addReq(false);
  $('#cb-reset').onclick=()=>{window10=new Array(10).fill(0).map(()=>({s:0,f:0}));state='CLOSED';updateStats();draw();toast('窗口已重置');};
  // auto OPEN -> HALF
  setInterval(()=>{
    if(state==='OPEN'){
      halfOpenTimer++;
      if(halfOpenTimer>=3){state='HALF';halfOpenTimer=0;window10=new Array(10).fill(0).map(()=>({s:0,f:0}));toast('超时 → 进入 HALF-OPEN 试探');updateStats();draw();}
    }
  },1000);
  draw();updateStats();
})();

/* ============================================================
   底部导航 + 滚动高亮
============================================================ */
const sections=$$('.module');
function updateBottomNav(){
  const scrollY=window.scrollY+120;
  let cur=0;
  sections.forEach((s,i)=>{if(s.offsetTop<=scrollY)cur=i;});
  $('#bnPrevName').textContent=cur>0?MODULES[cur-1].name:'—';
  $('#bnNextName').textContent=cur<MODULES.length-1?MODULES[cur+1].name:'—';
  $('#bnPrev').setAttribute('disabled',cur===0);
  $('#bnNext').setAttribute('disabled',cur===MODULES.length-1);
  $('#bnPrev').onclick=()=>cur>0&&sections[cur-1].scrollIntoView({behavior:'smooth'});
  $('#bnNext').onclick=()=>cur<MODULES.length-1&&sections[cur+1].scrollIntoView({behavior:'smooth'});
  $$('.nav-pill').forEach((p,i)=>p.classList.toggle('active',i===cur));
}
window.addEventListener('scroll',updateBottomNav,{passive:true});
updateBottomNav();
window.addEventListener('beforeunload',function(){for(var i=1;i<100000;i++){try{clearInterval(i)}catch(e){}}});</script>
