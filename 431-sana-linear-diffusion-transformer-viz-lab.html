<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANA 1.5 - NVIDIA线性扩散Transformer可视化实验室</title>
<style>
:root{
--bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
--border:#1e2433;--border2:#2a3144;
--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
--teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;--red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;--pink:#f472b6;--green:#34d399;
--mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;padding:16px}
.lab{max-width:960px;margin:0 auto}
.lab-header{text-align:center;padding:20px 0 16px;border-bottom:1px solid var(--border)}
.lab-title{font-size:28px;font-weight:700;color:var(--teal);letter-spacing:2px}
.lab-sub{font-size:13px;color:var(--text2);margin-top:6px}
.lab-hero{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--border)}
.hero-left{flex:1}
.hero-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.hero-title{font-size:20px;font-weight:700;color:var(--text);margin-top:4px}
.hero-desc{font-size:12px;color:var(--text2);margin-top:4px}
.hero-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;border:1px solid;background:var(--bg3)}
.hero-right{width:280px}
.hero-legend{display:flex;flex-direction:column;gap:4px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.hero-info{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.info-item{display:flex;justify-content:space-between;font-size:10px}
.info-k{color:var(--text3)}
.info-v{color:var(--text2)}
.module-nav{padding:12px 0;border-bottom:1px solid var(--border)}
.mod-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mod-tab{padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .2s}
.mod-tab:hover{border-color:var(--teal);color:var(--text)}
.mod-tab.active{background:var(--bg4);border-color:var(--teal);color:var(--teal)}
.view-tabs{display:flex;gap:6px;flex-wrap:wrap}
.view-tab{padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s}
.view-tab:hover{color:var(--text2)}
.view-tab.active{background:var(--bg3);border-color:var(--border2);color:var(--cyan)}
.module-panel{margin-top:12px}
#viz{width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.apulse{animation:apulse 2s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}
.aglow{filter:url(#glow)}
.adash{stroke-dasharray:5 4;animation:adash .8s linear infinite}
@keyframes adash{to{stroke-dashoffset:-9}}
.ablink{animation:ablink 1.4s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{animation:aspin 6s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes aspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="lab">
  <header class="lab-header">
    <div class="lab-title">SANA 1.5</div>
    <div class="lab-sub">NVIDIA 线性扩散Transformer · 文本到图像生成 · 可视化实验室</div>
  </header>
  <div class="lab-hero">
    <div class="hero-left">
      <div class="hero-label">当前模块</div>
      <div class="hero-title" id="heroTitle">Sana概览</div>
      <div class="hero-desc" id="heroDesc">NVIDIA线性扩散Transformer全景</div>
      <div class="hero-pills" id="heroPills"></div>
    </div>
    <div class="hero-right">
      <div class="hero-legend" id="heroLegend"></div>
      <div class="hero-info" id="heroInfo"></div>
    </div>
  </div>
  <div class="module-nav">
    <div class="mod-tabs" id="modTabs"></div>
    <div class="view-tabs" id="viewTabs"></div>
  </div>
  <div class="module-panel">
    <svg id="viz" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#00d4aa"/></marker>
        <marker id="ah-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/></marker>
        <marker id="ah-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a78bfa"/></marker>
        <marker id="ah-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fbbf24"/></marker>
        <marker id="ah-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
        <marker id="ah-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f472b6"/></marker>
        <marker id="ah-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#34d399"/></marker>
        <marker id="ah-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/></marker>
      </defs>
      <g id="layer0"></g>
    </svg>
  </div>
</div>
<script>
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};
var SVGNS='http://www.w3.org/2000/svg';

function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs)for(var k in attrs)el.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(el);
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}
function box(g,x,y,w,h,opts){
  opts=opts||{};
  return E(g,'rect',{x:x,y:y,width:w,height:h,rx:opts.rx||6,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1,opacity:opts.op||1});
}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var t=E(g,'text',{x:x,y:y,fill:opts.fill||C.text,'font-size':opts.fs||12,'font-family':opts.ff||C.mono,'text-anchor':opts.ta||'start','font-weight':opts.fw||400});
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1,'stroke-dasharray':opts.sd||'none',opacity:opts.op||1});
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var ck=opts.col||'teal';
  var cv=C[ck]||C.teal;
  var map={teal:'ah',cyan:'ah-c',purple:'ah-p',amber:'ah-a',blue:'ah-b',pink:'ah-k',green:'ah-g',red:'ah-r'};
  var mid=map[ck]||'ah';
  return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:cv,'stroke-width':opts.sw||1.5,'marker-end':'url(#'+mid+')',opacity:opts.op||1,'stroke-dasharray':opts.sd||'none'});
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  return E(g,'circle',{cx:cx,cy:cy,r:r,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1,opacity:opts.op||1});
}
function poly(g,pts,opts){
  opts=opts||{};
  return E(g,'polygon',{points:pts,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1,opacity:opts.op||1});
}
function radar(g,cx,cy,r,labels,data,opts){
  opts=opts||{};
  var n=labels.length,col=opts.col||C.teal;
  var ri,i,a,rr,pts=[];
  for(ri=1;ri<=4;ri++){
    rr=r*ri/4;pts=[];
    for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;pts.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}
    poly(g,pts.join(' '),{stroke:C.border,sw:1,fill:C.bg2,op:0.4});
  }
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:C.border,sw:1});}
  var dp=[];
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*data[i]/100;dp.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}
  poly(g,dp.join(' '),{fill:col,stroke:col,sw:1.5,op:0.2});
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*data[i]/100;circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:col,stroke:col});}
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lx=cx+(r+18)*Math.cos(a),ly=cy+(r+18)*Math.sin(a)+4;txt(g,lx,ly,labels[i],{fs:9,fill:C.text2,ta:'middle'});}
}
function gridBg(g,w,h){
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:C.bg});
  for(var x=0;x<=w;x+=30)E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:C.border,'stroke-width':0.5,opacity:0.35});
  for(var y=0;y<=h;y+=30)E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:C.border,'stroke-width':0.5,opacity:0.35});
}
function setPills(id,arr){
  var el=$(id);if(!el)return;el.innerHTML='';
  arr.forEach(function(a){var s=document.createElement('span');s.className='pill';s.style.borderColor=C[a.c]||C.teal;s.style.color=C[a.c]||C.teal;s.textContent=a.t;el.appendChild(s);});
}
function setLegend(id,arr){
  var el=$(id);if(!el)return;el.innerHTML='';
  arr.forEach(function(a){var d=document.createElement('div');d.className='leg-item';var dot=document.createElement('span');dot.className='leg-dot';dot.style.background=C[a.c]||C.teal;var lbl=document.createElement('span');lbl.textContent=a.t;d.appendChild(dot);d.appendChild(lbl);el.appendChild(d);});
}
function setInfo(id,arr){
  var el=$(id);if(!el)return;el.innerHTML='';
  arr.forEach(function(a){var d=document.createElement('div');d.className='info-item';var k=document.createElement('span');k.className='info-k';k.textContent=a.k;var v=document.createElement('span');v.className='info-v';v.textContent=a.v;d.appendChild(k);d.appendChild(v);el.appendChild(d);});
}
function nodeBox(g,x,y,w,h,title,sub,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:6,fill:C.bg3,stroke:col,'stroke-width':1.5});
  E(g,'rect',{x:x,y:y,width:w,height:3,rx:1.5,fill:col});
  txt(g,x+w/2,y+20,title,{fs:11,fw:600,fill:C.text,ta:'middle'});
  if(sub)txt(g,x+w/2,y+36,sub,{fs:9,fill:C.text3,ta:'middle'});
}
function chip(g,x,y,w,label,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:20,rx:10,fill:C.bg4,stroke:col,'stroke-width':1});
  txt(g,x+w/2,y+14,label,{fs:10,fill:col,ta:'middle',fw:500});
}
function pbar(g,x,y,w,h,val,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:h/2,fill:C.bg4});
  var fw=w*Math.min(val,100)/100;
  if(fw>0)E(g,'rect',{x:x,y:y,width:fw,height:h,rx:h/2,fill:col});
}
function rbox(g,x,y,w,h,col,label,val){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:5,fill:C.bg3,stroke:C.border2,'stroke-width':1});
  txt(g,x+8,y+16,label,{fs:10,fill:C.text2});
  txt(g,x+w-8,y+16,val,{fs:11,fill:col,ta:'end',fw:600});
  pbar(g,x+8,y+h-10,w-16,4,parseFloat(val)||0,col);
}
function drawChip(g,x,y,w,h,label,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:4,fill:col,opacity:0.1,stroke:col,'stroke-width':1});
  txt(g,x+w/2,y+h/2+4,label,{fs:10,fill:col,ta:'middle',fw:500});
}
function sectionTitle(g,x,y,s,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y-10,width:3,height:14,fill:col});
  txt(g,x+10,y,s,{fs:13,fw:600,fill:C.text});
}
function setHero(pills,legend,info){
  setPills('heroPills',pills);
  setLegend('heroLegend',legend);
  setInfo('heroInfo',info);
}

var MODULES=[
  {n:'M1',t:'Sana概览',d:'NVIDIA线性扩散Transformer全景',v:['模型全景','核心指标','研究团队']},
  {n:'M2',t:'线性扩散Transformer',d:'Linear DiT核心架构',v:['Linear DiT架构','线性注意力','效率对比']},
  {n:'M3',t:'深度压缩自编码器',d:'32倍空间压缩',v:['32倍压缩','编码流程','解码重建']},
  {n:'M4',t:'4096超高清生成',d:'突破分辨率极限',v:['分辨率突破','画质对比','生成流程']},
  {n:'M5',t:'0.6B小模型大能力',d:'小体积大性能',v:['参数对比','吞吐量','资源消耗']},
  {n:'M6',t:'SANA 1.5创新',d:'刷新文生图SOTA',v:['架构升级','质量提升','SOTA表现']},
  {n:'M7',t:'文生图SOTA对比',d:'超越主流模型',v:['vs SDXL','vs FLUX','综合排名']},
  {n:'M8',t:'应用与创意',d:'实际部署场景',v:['内容创作','设计应用','部署方案']}
];
var mCur=0;
var mViews=[0,0,0,0,0,0,0,0];
var mLayers=[];

function selectModule(idx){mCur=idx;drawModule();}
function setView(idx){mViews[mCur]=idx;drawModule();}
function drawModule(){
  var g=mLayers[0];clearNode(g);
  var fn=DRAWFN[mCur][mViews[mCur]];
  if(fn)fn(g);
  updateUI();
}
function updateUI(){
  var mt=$('modTabs');
  for(var i=0;i<mt.children.length;i++){mt.children[i].classList.toggle('active',i===mCur);}
  var vt=$('viewTabs');vt.innerHTML='';
  var m=MODULES[mCur];
  m.v.forEach(function(vn,i){var b=document.createElement('button');b.className='view-tab'+(i===mViews[mCur]?' active':'');b.textContent=vn;b.onclick=function(){setView(i);};vt.appendChild(b);});
  $('heroTitle').textContent=m.t;
  $('heroDesc').textContent=m.d;
}
function buildModTabs(){
  var mt=$('modTabs');mt.innerHTML='';
  MODULES.forEach(function(m,i){var b=document.createElement('button');b.className='mod-tab';b.textContent=m.n+' '+m.t;b.onclick=function(){selectModule(i);};mt.appendChild(b);});
}

/* ===== M1: Sana概览 ===== */
function drawM1V0(g){
  gridBg(g,900,480);
  sectionTitle(g,30,30,'Sana 模型全景架构',C.teal);
  var stages=[
    {x:30,t:'文本输入',s:'Prompt',ck:'cyan'},
    {x:160,t:'文本编码器',s:'T5 / Gemma',ck:'blue'},
    {x:290,t:'Linear DiT',s:'x28 blocks',ck:'teal'},
    {x:460,t:'潜空间',s:'32x 压缩',ck:'purple'},
    {x:610,t:'自编码解码',s:'Decoder',ck:'amber'},
    {x:760,t:'高清图像',s:'4096px',ck:'pink'}
  ];
  stages.forEach(function(st,i){
    nodeBox(g,st.x,70,110,56,st.t,st.s,C[st.ck]);
    if(i<stages.length-1)arrow(g,st.x+110,98,stages[i+1].x,98,{col:st.ck,sw:1.5});
  });
  sectionTitle(g,30,170,'核心特性',C.cyan);
  var feats=[
    {x:30,t:'线性注意力',d:'O(n) 复杂度',ck:'teal'},
    {x:230,t:'深度压缩',d:'32倍降采样',ck:'purple'},
    {x:430,t:'高效训练',d:'FP8 优化',ck:'amber'},
    {x:630,t:'超高分辨率',d:'4096x4096',ck:'pink'}
  ];
  feats.forEach(function(f){
    drawChip(g,f.x,190,200,44,'',C[f.ck]);
    txt(g,f.x+100,210,f.t,{fs:12,fill:C[f.ck],ta:'middle',fw:600});
    txt(g,f.x+100,226,f.d,{fs:9,fill:C.text2,ta:'middle'});
  });
  sectionTitle(g,30,270,'关键数据',C.amber);
  var stats=[
    {x:30,v:'0.6B',l:'参数量',ck:'teal'},
    {x:230,v:'100x',l:'吞吐量提升',ck:'cyan'},
    {x:430,v:'4096',l:'最大分辨率',ck:'purple'},
    {x:630,v:'8.5K+',l:'GitHub Stars',ck:'pink'}
  ];
  stats.forEach(function(s){
    E(g,'rect',{x:s.x,y:285,width:200,height:75,rx:6,fill:C.bg3,stroke:C.border2,'stroke-width':1});
    E(g,'rect',{x:s.x,y:285,width:200,height:3,rx:1.5,fill:C[s.ck]});
    txt(g,s.x+100,323,s.v,{fs:24,fill:C[s.ck],ta:'middle',fw:700});
    txt(g,s.x+100,345,s.l,{fs:10,fill:C.text2,ta:'middle'});
  });
  sectionTitle(g,30,390,'研究荣誉',C.green);
  drawChip(g,30,405,180,28,'ICLR 2025 Oral',C.green);
  drawChip(g,230,405,200,28,'NVIDIA + MIT + 清华',C.blue);
  drawChip(g,450,405,180,28,'20x 更小',C.amber);
  drawChip(g,650,405,180,28,'笔记本可运行',C.pink);
  setHero(
    [{t:'Linear DiT',c:'teal'},{t:'4096px',c:'pink'},{t:'0.6B',c:'cyan'},{t:'ICLR Oral',c:'green'}],
    [{t:'文本编码器',c:'blue'},{t:'Linear DiT x28',c:'teal'},{t:'深度压缩AE',c:'purple'},{t:'高清解码',c:'amber'}],
    [{k:'发布方',v:'NVIDIA / MIT / THU'},{k:'参数量',v:'0.6B'},{k:'压缩率',v:'32x'},{k:'分辨率',v:'4096x4096'}]
  );
}

function drawM1V1(g){
  gridBg(g,900,480);
  sectionTitle(g,30,30,'核心性能指标',C.teal);
  var metrics=[
    {y:60,l:'参数效率',v:'20',pct:20,col:'teal',d:'比SDXL小4倍'},
    {y:110,l:'吞吐量',v:'95',pct:95,col:'cyan',d:'比大模型快100倍'},
    {y:160,l:'空间压缩',v:'80',pct:80,col:'purple',d:'深度压缩自编码器'},
    {y:210,l:'最大分辨率',v:'100',pct:100,col:'pink',d:'4096x4096像素'},
    {y:260,l:'社区热度',v:'75',pct:75,col:'amber',d:'8.5K+ GitHub Stars'},
    {y:310,l:'能效比',v:'90',pct:90,col:'green',d:'低功耗高效运行'}
  ];
  metrics.forEach(function(m){
    rbox(g,30,m.y,380,42,C[m.col],m.l+'  '+m.d,m.v);
  });
