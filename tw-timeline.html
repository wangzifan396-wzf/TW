<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TW Timeline · 技术演进时间线</title>

<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#7c5cff;
  --ai:#5e6ad2;--sys:#34d399;--theo:#fbbf24;--cross:#f97316;
  --radius:8px;--mono:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3d45}

/* ═══ HEADER ═══ */
header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.92);border-bottom:1px solid var(--border);backdrop-filter:none;padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
header .logo{font-size:18px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
header .logo span{color:var(--accent)}
header .sep{width:1px;height:20px;background:var(--border2)}
header nav{display:flex;gap:4px}
header nav a{color:var(--text3);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:all .15s;white-space:nowrap}
header nav a:hover{color:var(--text);background:var(--bg3)}
header nav a.active{color:var(--text);background:var(--bg3)}
header .spacer{flex:1}
header .stats{font-size:12px;color:var(--text3);white-space:nowrap}
header .stats b{color:var(--text2)}

/* ═══ HERO ═══ */
.hero{padding:48px 24px 32px;text-align:center;max-width:1200px;margin:0 auto}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,var(--text) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:16px;color:var(--text2);max-width:600px;margin:0 auto 24px}
.hero .legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.hero .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.hero .legend-dot{width:10px;height:10px;border-radius:50%}
.hero .legend-item b{color:var(--text2);font-weight:600}

/* ═══ CONTROLS ═══ */
.controls{max-width:1400px;margin:0 auto;padding:0 24px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.controls .search{flex:1;min-width:200px;position:relative}
.controls .search input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 36px;color:var(--text);font-size:13px;font-family:var(--sans);transition:border-color .15s}
.controls .search input:focus{outline:none;border-color:var(--accent)}
.controls .search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.controls .filter-btns{display:flex;gap:4px}
.controls .fbtn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap}
.controls .fbtn:hover{color:var(--text2);border-color:var(--border2)}
.controls .fbtn.active{color:var(--text);border-color:var(--border2);background:var(--bg3)}
.controls .fbtn[data-cat="ai"].active{border-color:var(--ai);color:var(--ai)}
.controls .fbtn[data-cat="systems"].active{border-color:var(--sys);color:var(--sys)}
.controls .fbtn[data-cat="theory"].active{border-color:var(--theo);color:var(--theo)}
.controls .fbtn[data-cat="cross"].active{border-color:var(--cross);color:var(--cross)}
.controls .zoom-ctrl{display:flex;gap:4px;align-items:center}
.controls .zbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.controls .zbtn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}

/* ═══ TIMELINE CANVAS ═══ */
.timeline-wrap{position:relative;margin:0 auto;max-width:1400px;padding:0 24px 40px}
.timeline-scroll{overflow-x:auto;overflow-y:hidden;cursor:grab;border-radius:var(--radius);border:1px solid var(--border);background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%)}
.timeline-scroll.dragging{cursor:grabbing}
.timeline-inner{position:relative;height:560px;min-width:100%;user-select:none}

/* Era bands */
.era-band{position:absolute;top:0;bottom:0;opacity:.06;transition:opacity .2s}
.era-band:hover{opacity:.12}
.era-label{position:absolute;top:8px;font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap;pointer-events:none;text-transform:uppercase;letter-spacing:1px}

/* Center axis */
.axis-line{position:absolute;top:50%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--border2) 5%,var(--border2) 95%,transparent 100%);transform:translateY(-50%);pointer-events:none}
.year-tick{position:absolute;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.year-tick .tick-line{width:1px;height:8px;background:var(--border2);margin:0 auto}
.year-tick .tick-label{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px;text-align:center;white-space:nowrap}

/* Event nodes */
.event{position:absolute;cursor:pointer;transition:transform .2s ease;z-index:10}
.event:hover{z-index:20;transform:translateY(-2px)}
.event.up{bottom:50%}
.event.down{top:50%}
.event .stem{position:absolute;left:50%;width:2px;background:var(--border2);transform:translateX(-50%);transition:background .2s}
.event.up .stem{bottom:0;top:24px}
.event.down .stem{top:0;bottom:24px}
.event:hover .stem{background:var(--accent)}
.event .node{position:absolute;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border2);transition:all .2s;z-index:2}
.event.up .node{bottom:-7px}
.event.down .node{top:-7px}
.event:hover .node{box-shadow:0 0 0 1px var(--accent),0 0 16px rgba(124,92,255,.4);transform:translateX(-50%) scale(1.3)}
.event .card{position:absolute;left:50%;transform:translateX(-50%);width:220px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;transition:all .2s}
.event.up .card{bottom:32px}
.event.down .card{top:32px}
.event:hover .card{border-color:var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.4)}
.event .card .yr{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent)}
.event .card .ttl{font-size:13px;font-weight:600;color:var(--text);margin:2px 0 4px;line-height:1.3}
.event .card .dsc{font-size:11px;color:var(--text3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event .card .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-top:4px;font-weight:500}
.event.hidden{display:none}

/* ═══ DETAIL MODAL ═══ */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.modal-overlay.show{display:flex;opacity:1}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:0;max-width:480px;width:90%;overflow:hidden;transform:scale(.95);transition:transform .2s}
.modal-overlay.show .modal{transform:scale(1)}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.modal-head .yr{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
.modal-head .ttl{font-size:22px;font-weight:700;color:var(--text);margin:4px 0 8px}
.modal-head .cat-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.modal-body{padding:20px 24px}
.modal-body .dsc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.modal-body .impact{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.modal-body .impact-label{font-size:12px;color:var(--text3)}
.modal-body .impact-bar{display:flex;gap:2px}
.modal-body .impact-dot{width:10px;height:10px;border-radius:2px;background:var(--border)}
.modal-body .impact-dot.filled{background:var(--accent)}
.modal-body .link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:all .15s}
.modal-body .link-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,92,255,.3)}
.modal-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:6px;border:none;background:var(--bg3);color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{color:var(--text);background:var(--border)}

/* ═══ FOOTER ═══ */
footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);color:var(--text3);font-size:12px}
footer a{color:var(--text2);text-decoration:none}
footer a:hover{color:var(--accent)}

/* ═══ HINT ═══ */
.hint{text-align:center;padding:8px;font-size:12px;color:var(--text3)}
.hint kbd{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px;color:var(--text2);margin:0 2px}

/* Responsive */
@media(max-width:768px){
  header{padding:0 12px;height:48px}
  header nav{display:none}
  .hero{padding:32px 16px 24px}
  .hero h1{font-size:28px}
  .hero .sub{font-size:14px}
  .controls{padding:0 12px 12px}
  .timeline-wrap{padding:0 8px 24px}
  .event .card{width:180px}
  .event .card .dsc{display:none}
}
</style>
</head>

var pxPerYear = 80;  // zoom level
var minPxPerYear = 30;
var maxPxPerYear = 200;
var activeFilter = "all";

var yearEnd = 2026;
var totalYears = yearEnd - yearStart;

// ═══ INIT ═══
function init(){
  document.getElementById("evCount").textContent = EVENTS.length;
  document.getElementById("yrSpan").textContent = totalYears;
  document.getElementById("heroCount").textContent = EVENTS.length;

// ═══ RENDER ═══
function render(){
  var inner = document.getElementById("tlInner");
  var totalWidth = totalYears * pxPerYear + 200;
  inner.style.width = totalWidth + "px";

  // Clear
  inner.innerHTML = "";

  // Era bands
  ERAS.forEach(function(era){
    var left = (era.start - yearStart) * pxPerYear + 80;
    var width = (era.end - era.start) * pxPerYear;
    var band = document.createElement("div");
    band.className = "era-band";
    band.style.left = left + "px";
    band.style.width = width + "px";
    var color = era.start >= 2020 ? "#7c5cff" : era.start >= 2012 ? "#5e6ad2" : era.start >= 1996 ? "#34d399" : era.start >= 1980 ? "#fbbf24" : era.start >= 1956 ? "#f97316" : "#a1a1aa";
    band.style.background = color;
    band.style.borderRight = "1px solid rgba(255,255,255,.03)";
    inner.appendChild(band);

    var label = document.createElement("div");
    label.className = "era-label";
    label.style.left = (left + 8) + "px";
    label.style.top = "8px";
    label.textContent = era.name;
    inner.appendChild(label);
  });

  // Year ticks
  for(var y = 1936; y <= 2026; y += 5){
    var left = (y - yearStart) * pxPerYear + 80;
    var tick = document.createElement("div");
    tick.className = "year-tick";
    tick.style.left = left + "px";
    tick.innerHTML = '<div class="tick-line"></div><div class="tick-label">' + y + '</div>';
    inner.appendChild(tick);
  }

  // Center axis line
  var axis = document.createElement("div");
  axis.className = "axis-line";
  inner.appendChild(axis);

  // Events - distribute up/down to avoid overlap
  var sortedEvents = EVENTS.slice().sort(function(a,b){return a.year - b.year || a.title.localeCompare(b.title)});

  // Assign up/down positions, detect overlaps
  var upSlots = [];   // {year, width} for events on top
  var downSlots = []; // for events on bottom
  var cardWidth = 220;
  var cardHeight = 80; // approx height
  var cardGap = 10;

  sortedEvents.forEach(function(ev, idx){
    var left = (ev.year - yearStart) * pxPerYear + 80;
    ev._left = left;
    ev._idx = idx;

    // Check if should be hidden
    var hidden = false;
    if(activeFilter !== "all" && ev.cat !== activeFilter) hidden = true;
    if(searchQuery){
      var q = searchQuery.toLowerCase();
      if(ev.title.toLowerCase().indexOf(q) < 0 && ev.desc.toLowerCase().indexOf(q) < 0 && String(ev.year).indexOf(q) < 0) hidden = true;
    }

    // Determine up or down - alternate, but try to avoid overlap
    var isUp = idx % 2 === 0;

    // Check overlap in the chosen side
    var slotList = isUp ? upSlots : downSlots;
    var minLeft = left - cardWidth / 2;
    var maxLeft = left + cardWidth / 2;
    var hasOverlap = false;
    for(var s = 0; s < slotList.length; s++){
      var sl = slotList[s];
      if(minLeft < sl.maxLeft + cardGap && maxLeft > sl.minLeft - cardGap){
        hasOverlap = true;
        break;
      }
    }

    // If overlap, try the other side
    if(hasOverlap){
      var otherSlots = isUp ? downSlots : upSlots;
      var otherOverlap = false;
      for(var s = 0; s < otherSlots.length; s++){
        var sl = otherSlots[s];
        if(minLeft < sl.maxLeft + cardGap && maxLeft > sl.minLeft - cardGap){
          otherOverlap = true;
          break;
        }
      }
      if(!otherOverlap){
        isUp = !isUp;
        slotList = isUp ? upSlots : downSlots;
        hasOverlap = false;
      }
    }

    // If still overlapping, push to a higher row (stack)
    var stackLevel = 0;
    if(hasOverlap){
      // Find available stack level
      for(var lv = 1; lv < 5; lv++){
        var lvOverlap = false;
        for(var s = 0; s < slotList.length; s++){
          var sl = slotList[s];
          if(sl.stackLevel === lv && minLeft < sl.maxLeft + cardGap && maxLeft > sl.minLeft - cardGap){
            lvOverlap = true;
            break;
          }
        }
        if(!lvOverlap){
          stackLevel = lv;
          break;
        }
      }
    }

    slotList.push({minLeft:minLeft, maxLeft:maxLeft, stackLevel:stackLevel});
    ev._isUp = isUp;
    ev._stackLevel = stackLevel;

    // Create event element
    var el = document.createElement("div");
    el.className = "event " + (isUp ? "up" : "down") + (hidden ? " hidden" : "");
    el.style.left = left + "px";
    el.dataset.idx = idx;

    var stackOffset = stackLevel * (cardHeight + cardGap);

    // Stem
    var stemHeight = 40 + stackOffset;
    var stem = document.createElement("div");
    stem.className = "stem";
    stem.style.height = stemHeight + "px";
    el.appendChild(stem);

    // Node dot
    var node = document.createElement("div");
    node.className = "node";
    node.style.background = CAT_COLORS[ev.cat] || "#7c5cff";
    el.appendChild(node);

    // Card
    var card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = (isUp ? stackOffset : 0) + "px";
    card.style.marginTop = (isUp ? 0 : stackOffset) + "px";

    var yrEl = document.createElement("div");
    yrEl.className = "yr";
    yrEl.textContent = ev.year;
    card.appendChild(yrEl);

    var ttlEl = document.createElement("div");
    ttlEl.className = "ttl";
    ttlEl.textContent = ev.title;
    card.appendChild(ttlEl);

    var dscEl = document.createElement("div");
    dscEl.className = "dsc";
    dscEl.textContent = ev.desc;
    card.appendChild(dscEl);

    if(ev.project){
      var badge = document.createElement("div");
      badge.className = "badge";
      badge.style.background = (CAT_COLORS[ev.cat] || "#7c5cff") + "22";
      badge.style.color = CAT_COLORS[ev.cat] || "#7c5cff";
      badge.textContent = "🔗 " + ev.project;
      card.appendChild(badge);
    }

    el.appendChild(card);

    // Click handler
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var i = parseInt(this.dataset.idx);
      showDetail(EVENTS[i]);
    });

    inner.appendChild(el);
  });
}

// ═══ MODAL ═══
function showDetail(ev){
  document.getElementById("mYear").textContent = ev.year;
  document.getElementById("mTitle").textContent = ev.title;
  document.getElementById("mDesc").textContent = ev.desc;

  var catEl = document.getElementById("mCat");
  catEl.textContent = CAT_NAMES[ev.cat] || ev.cat;
  catEl.style.background = (CAT_COLORS[ev.cat] || "#7c5cff") + "22";
  catEl.style.color = CAT_COLORS[ev.cat] || "#7c5cff";

  // Impact
  var impactEl = document.getElementById("mImpact");
  impactEl.innerHTML = "";
  for(var i = 0; i < 5; i++){
    var dot = document.createElement("div");
    dot.className = "impact-dot" + (i < ev.impact ? " filled" : "");
    impactEl.appendChild(dot);
  }

  // Link
  var linkEl = document.getElementById("mLink");
  if(ev.project){
    linkEl.href = BASE + ev.project + "/";
    linkEl.style.display = "inline-flex";
    linkEl.textContent = "访问 " + ev.project + " →";
  } else {
    linkEl.style.display = "none";
  }

  document.getElementById("modalOverlay").classList.add("show");
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("show");
}

// ═══ CONTROLS ═══
function bindControls(){
  // Search
  var searchTimer;
  document.getElementById("searchInput").addEventListener("input", function(){
    clearTimeout(searchTimer);
    var val = this.value;
    searchTimer = setTimeout(function(){
      searchQuery = val.trim();
      render();
    }, 200);
  });

  // Filter buttons
  document.querySelectorAll(".fbtn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".fbtn").forEach(function(b){b.classList.remove("active")});
      this.classList.add("active");
      activeFilter = this.dataset.cat;
      render();
    });
  });

  // Zoom
  document.getElementById("zoomIn").addEventListener("click", function(){
    pxPerYear = Math.min(maxPxPerYear, pxPerYear + 20);
    render();
  });
  document.getElementById("zoomOut").addEventListener("click", function(){
    pxPerYear = Math.max(minPxPerYear, pxPerYear - 20);
    render();
  });
  document.getElementById("zoomReset").addEventListener("click", function(){
    pxPerYear = 80;
    render();
    document.getElementById("tlScroll").scrollLeft = 0;
  });

  // Drag to scroll
  var scroll = document.getElementById("tlScroll");
  var isDragging = false;
  var startX, scrollLeft;

  scroll.addEventListener("mousedown", function(e){
    if(e.target.closest(".event")) return;
    isDragging = true;
    scroll.classList.add("dragging");
    startX = e.pageX - scroll.offsetLeft;
    scrollLeft = scroll.scrollLeft;
  });

  scroll.addEventListener("mouseleave", function(){
    isDragging = false;
    scroll.classList.remove("dragging");
  });

  scroll.addEventListener("mouseup", function(){
    isDragging = false;
    scroll.classList.remove("dragging");
  });

  scroll.addEventListener("mousemove", function(e){
    if(!isDragging) return;
    e.preventDefault();
    var x = e.pageX - scroll.offsetLeft;
    var walk = (x - startX) * 1.5;
    scroll.scrollLeft = scrollLeft - walk;
  });

  // Wheel zoom
  scroll.addEventListener("wheel", function(e){
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      var delta = e.deltaY < 0 ? 10 : -10;
      pxPerYear = Math.max(minPxPerYear, Math.min(maxPxPerYear, pxPerYear + delta));
      render();
    } else {
      // Normal horizontal scroll
      e.preventDefault();
      scroll.scrollLeft += e.deltaY;
    }
  });

  // Modal close
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });

  // Keyboard
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeModal();
    if(e.key === "ArrowRight") scroll.scrollLeft += 100;
    if(e.key === "ArrowLeft") scroll.scrollLeft -= 100;
  });

  // Click outside events to close modal
  scroll.addEventListener("click", function(e){
    if(!e.target.closest(".event")) closeModal();
  });
}

// ═══ START ═══

// Scroll to a meaningful starting position
setTimeout(function(){
  var scroll = document.getElementById("tlScroll");

  var targetYear = 2012;
  var pos = (targetYear - yearStart) * pxPerYear + 80 - scroll.clientWidth / 2;
  scroll.scrollLeft = Math.max(0, pos);
}, 100);
