<style>

}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.app-header{background:linear-gradient(180deg,#0d0f15,#0a0b0f);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{max-width:1400px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:18px}
.hub-link{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s;white-space:nowrap}

.header-title{font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.header-title .sep{color:var(--text3);margin:0 2px}

.lab-hero{max-width:1400px;margin:0 auto;padding:56px 28px 40px}
.lab-hero .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--teal);background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.2);padding:5px 14px;border-radius:4px;margin-bottom:20px}

.module-head{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}

.view-tab{background:transparent;border:1px solid var(--border2);color:var(--text3);padding:7px 16px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500;transition:all .2s;font-family:inherit}

.viz-frame{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px}

.legend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

.info-card .d{font-size:12px;color:var(--text2);line-height:1.5}
.panel-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-family:var(--mono)}
.apulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.aglow{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.adash{stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.ablink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.aspin{transform-origin:center;animation:spin 8s linear infinite}

@media(max-width:900px){.below{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.lab-hero h1{font-size:24px}}
</style>

<div class="lab-hero"><span class="tag">AI CODING / FLEET MODE / MULTI-AGENT SWE</span><h1>AI编程 <span class="grad">舰队模式与多Agent</span> 软件工程可视化实验室</h1><p>从代码补全到舰队协同——系统呈现2026年AI编程的多Agent范式革新全景。覆盖多Agent软件工程架构、任务分解与并行编排、代码审查与质量保障、主流平台对比(Cursor/Devin/CodeBuddy)、开发流程重构、产业渗透与未来AI编程愿景，解构从单Agent到舰队模式的全栈自主开发演进。</p></div>

<script>
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',tealDim:'rgba(0,212,170,.16)',tealSoft:'rgba(0,212,170,.08)',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};
var SVGNS='http://www.w3.org/2000/svg';
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}
function E(p,t,a){var e=document.createElementNS(SVGNS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function gridBg(g,w,h){for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});}
function box(g,x,y,w,h,o){o=o||{};var r=E(g,'rect',{x:x,y:y,width:w,height:h,rx:o.rx||7,fill:o.fill||C.bg3,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3});if(o.cls)r.setAttribute('class',o.cls);return r;}
function lbox(g,x,y,w,h,title,sub,o){o=o||{};box(g,x,y,w,h,o);if(o.top){txt(g,o.left?x+14:x+w/2,y+22,title,{f:o.tf||C.text,s:o.ts||13,w:600,a:o.left?'start':'middle'});if(sub)txt(g,o.left?x+14:x+w/2,y+40,sub,{f:o.sf||C.text3,s:10.5,a:o.left?'start':'middle'});}else{txt(g,x+w/2,y+h/2+(sub?-6:4),title,{f:o.tf||C.text,s:o.ts||13,w:600});if(sub)txt(g,x+w/2,y+h/2+14,sub,{f:o.sf||C.text3,s:10.5});}}
function txt(g,x,y,s,o){o=o||{};var t=E(g,'text',{x:x,y:y,'text-anchor':o.a||'middle',fill:o.f||C.text,'font-size':o.s||11,'font-weight':o.w||400});if(o.mono)t.setAttribute('font-family',C.mono);t.textContent=s;return t;}
function line(g,x1,y1,x2,y2,o){o=o||{};return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.4,'stroke-dasharray':o.dash||'none',class:o.cls||''});}
function arrow(g,x1,y1,x2,y2,o){o=o||{};var col=o.stroke||C.text2;var sw=o.sw||1.5;E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':sw,'stroke-dasharray':o.dash||'none',class:o.cls||''});var ang=Math.atan2(y2-y1,x2-x1);var ah=o.ah||7;E(g,'polygon',{points:x2+','+y2+' '+(x2-ah*Math.cos(ang-0.42))+','+(y2-ah*Math.sin(ang-0.42))+' '+(x2-ah*Math.cos(ang+0.42))+','+(y2-ah*Math.sin(ang+0.42)),fill:col});}
function circ(g,cx,cy,r,o){o=o||{};return E(g,'circle',{cx:cx,cy:cy,r:r,fill:o.fill||C.tealSoft,stroke:o.stroke||C.teal,'stroke-width':o.sw||1.5,class:o.cls||''});}
function poly(g,pts,o){o=o||{};return E(g,'polygon',{points:pts.join(' '),fill:o.fill||'none',stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3,class:o.cls||''});}
function setPills(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){var s=document.createElement('span');s.className='stat-pill';var d=document.createElement('span');d.className='dot';d.style.background=p.c||C.teal;var l=document.createElement('span');l.className='label';l.textContent=p.k;var v=document.createElement('span');v.className='val';v.textContent=p.v;s.appendChild(d);s.appendChild(l);s.appendChild(v);c.appendChild(s);});}
function setLegend(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){var s=document.createElement('span');var i=document.createElement('i');i.style.background=p.c;s.appendChild(i);s.appendChild(document.createTextNode(p.t));c.appendChild(s);});}
function setInfo(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){var d=document.createElement('div');d.className='info-card';var k=document.createElement('div');k.className='k';k.textContent=p.k;var v=document.createElement('div');v.className='v';v.textContent=p.v;var de=document.createElement('div');de.className='d';de.textContent=p.d;d.appendChild(k);d.appendChild(v);d.appendChild(de);c.appendChild(d);});}
function radar(g,cx,cy,r,labels,values,color){var n=labels.length,k,i,a,rr;for(k=1;k<=4;k++){var pts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*k/4;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:'#1e2433','stroke-width':1});}for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:'#1e2433',sw:1});}var dpts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];dpts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}E(g,'polygon',{points:dpts.join(' '),fill:color+'33',stroke:color,'stroke-width':2,cls:'aglow'});for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:color,stroke:'none'});}for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lr=r+20;txt(g,cx+lr*Math.cos(a),cy+lr*Math.sin(a)+4,labels[i],{s:10.5,f:C.text2});}}

var MODULES=[
{n:'01',t:'AI编程舰队模式全景',d:'从代码补全到舰队协同——AI编程的四级范式演进，2026年主流平台格局与核心能力雷达图谱。',v:['演进路线','平台格局','能力雷达']},
{n:'02',t:'多Agent软件工程架构',d:'舰队模式的系统级架构设计：将帅Agent指挥、Worker Agent执行、A2A通信协议与角色分工体系。',v:['舰队架构','角色分工','通信协议']},
{n:'03',t:'任务分解与并行编排',d:'复杂软件任务的WBS分解策略、DAG并行调度图与动态重规划机制，实现多Agent高效协作。',v:['分解策略','并行调度','动态调整']},
{n:'04',t:'代码审查与质量保障',d:'多Agent代码审查流水线、自动化测试生成与CI/CD质量门禁集成的全链路质量保障体系。',v:['审查流程','测试生成','质量门禁']},
{n:'05',t:'主流平台对比',d:'Cursor、Devin、CodeBuddy NPC、Claude Code、GitHub Copilot五大平台的技术架构差异与适用场景深度对比。',v:['平台对比','技术差异','适用场景']},
{n:'06',t:'开发流程重构',d:'传统开发vs舰队模式开发流程对比、人机团队协作模式与JobBench/MCP Atlas效能指标体系。',v:['流程对比','团队协作','效能指标']},
{n:'07',t:'产业渗透与商业模式',d:'企业级Auto-SWE渗透率突破40%，SaaS/企业版/自托管三大商业模式与2025-2030市场预测。',v:['渗透率','商业模式','市场预测']},
{n:'08',t:'未来AI编程愿景',d:'2026-2030技术路线图、全自主软件工程愿景与AGI级编程能力的终极演进方向。',v:['技术路线','自主软件','终极愿景']}
];

var mCur=0,mViews=[0,0,0,0,0,0,0,0],mLayers={};
var VIEW_TITLES=MODULES.map(function(m){return m.v;});

function buildNav(){
var nav=$('nav');clearNode(nav);
MODULES.forEach(function(m,i){
var b=document.createElement('button');
b.className='nav-btn'+(i===mCur?' active':'');
b.innerHTML='<span style="font-family:var(--mono);font-size:11px;color:var(--text3)">'+m.n+'</span> '+m.t;
b.onclick=function(){showModule(i);};
nav.appendChild(b);
});
}

function buildStage(){
var stage=$('stage');clearNode(stage);
MODULES.forEach(function(m,i){
var sec=document.createElement('section');
sec.id='mod-'+i;
sec.style.display=i===mCur?'block':'none';
var head='<div class="module-head"><span class="module-num">M'+m.n+'</span><span class="module-title">'+m.t+'</span></div>';
head+='<div class="module-desc">'+m.d+'</div>';
var tabs='<div class="view-tabs" id="tabs-'+i+'">';
m.v.forEach(function(vt,vi){
tabs+='<button class="view-tab'+(vi===0?' active':'')+'" onclick="m'+(i+1)+'View('+vi+')">'+vt+'</button>';
});
tabs+='</div>';
var frame='<div class="viz-frame"><svg class="viz-svg" viewBox="0 0 900 480" id="svg-'+i+'"><g id="layer-'+i+'"></g></svg></div>';
var below='<div class="below"><div><div class="panel-label">关键指标</div><div class="stat-row" id="m'+(i+1)+'-stat"></div></div><div><div class="panel-label">图例说明</div><div class="legend-row" id="m'+(i+1)+'-leg"></div></div></div>';
below+='<div><div class="panel-label">深度数据</div><div class="info-grid" id="m'+(i+1)+'-info"></div></div>';
sec.innerHTML=head+tabs+frame+below;
stage.appendChild(sec);
mLayers['m'+(i+1)]=$('layer-'+i);
});
}

function setView(mi,vi){
mViews[mi]=vi;
var tabs=$('tabs-'+mi);
Array.prototype.forEach.call(tabs.children,function(t,ti){
t.classList.toggle('active',ti===vi);
});
drawModule(mi);
}

function drawModule(mi){
var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
fns[mi]();
}

function showModule(i){
mCur=i;
MODULES.forEach(function(m,mi){
var s=$('mod-'+mi);
if(s)s.style.display=mi===i?'block':'none';
});
buildNav();
drawModule(i);
}

function m1View(v){setView(0,v);}
function m2View(v){setView(1,v);}
function m3View(v){setView(2,v);}
function m4View(v){setView(3,v);}
function m5View(v){setView(4,v);}
function m6View(v){setView(5,v);}
function m7View(v){setView(6,v);}
function m8View(v){setView(7,v);}

function m1Draw(){
var g=mLayers.m1;clearNode(g);gridBg(g,900,480);
var v=mViews[0];
if(v===0){
txt(g,450,32,'AI编程演进路线：从补全到舰队模式',{s:15,w:600});

{x:90,t:'代码补全',y:'2018-2020',d:'Tab补全 / 单行建议',c:C.text3},
{x:270,t:'结对编程',y:'2021-2023',d:'Copilot / 上下文感知',c:C.blue},
{x:450,t:'自主Agent',y:'2024-2025',d:'Devin / 多步推理',c:C.purple},

var pts=[];for(var px=0;px<=800;px+=8){pts.push((px+50)+','+(430-Math.pow(px/800,1.8)*140));}
poly(g,pts,{fill:C.tealSoft,stroke:C.teal,sw:2,cls:'aglow'});

txt(g,55,425,'补全级',{s:10,f:C.text3,w:600});
}else if(v===1){
txt(g,450,32,'2026 AI编程平台格局',{s:15,w:600});
var plats=[
{x:160,y:120,w:150,h:80,t:'Cursor',s:'Cloud Agent / 树状层级',c:C.teal,m:'90%'},
{x:380,y:120,w:150,h:80,t:'Devin',s:'Auto-SWE / 全自主',c:C.purple,m:'85%'},
{x:600,y:120,w:150,h:80,t:'CodeBuddy',s:'NPC / 腾讯云',c:C.cyan,m:'78%'},
{x:270,y:280,w:150,h:80,t:'Claude Code',s:'终端原生 / Agent SDK',c:C.amber,m:'88%'},
