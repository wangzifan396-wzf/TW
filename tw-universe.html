<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Universe · 知识星图 · 140 Projects Constellation</title>

<style>
:root{
  --bg:#060708;--surface:#0e1014;--surface-2:#16181c;--surface-3:#1c1f24;
  --border:rgba(255,255,255,.06);--border-strong:rgba(255,255,255,.12);
  --ink:#f7f8f8;--muted:#9b9fa8;--faint:#62666d;
  --accent:#5e6ad2;--cyan:#2dd4ff;--emerald:#34d399;--amber:#fbbf24;--violet:#a78bfa;--rose:#fb7185;
  --font-sans:system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans CJK SC',sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}

/* Star background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 60% 70%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,.25),transparent),
    radial-gradient(1px 1px at 10% 80%,rgba(255,255,255,.2),transparent),
    radial-gradient(1px 1px at 90% 50%,rgba(255,255,255,.3),transparent),
    radial-gradient(2px 2px at 45% 45%,rgba(167,139,250,.15),transparent),
    radial-gradient(1px 1px at 35% 65%,rgba(45,212,255,.2),transparent),
    radial-gradient(1px 1px at 75% 25%,rgba(52,211,153,.15),transparent);
  background-size:200px 200px,250px 250px,300px 300px,180px 180px,220px 220px,400px 400px,350px 350px,280px 280px;
}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;height:52px;z-index:900;background:rgba(6,7,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px}
.nav .logo{font-weight:700;font-size:14px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.nav .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px var(--violet)}
.nav .subtitle{font-size:11px;color:var(--faint);font-family:var(--font-mono)}
.nav .links{margin-left:auto;display:flex;gap:20px;font-size:12px;color:var(--muted)}
.nav .links a{transition:color .2s}
.nav .links a:hover{color:var(--ink)}
.nav .btn-back{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;border:1px solid var(--border-strong);font-size:12px;color:var(--muted);transition:all .2s;text-decoration:none}
.nav .btn-back:hover{color:var(--ink);border-color:var(--violet);background:rgba(167,139,250,.08)}

/* SVG canvas */
#graph{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:1;cursor:grab}
#graph.dragging{cursor:grabbing}
#graph svg{width:100%;height:100%;display:block}

/* Edge styles */
.edge{stroke:rgba(255,255,255,.06);stroke-width:1;transition:stroke .2s,stroke-width .2s}
.edge.highlighted{stroke:rgba(167,139,250,.4);stroke-width:1.5}
.edge.dimmed{stroke:rgba(255,255,255,.02)}

/* Node styles */
.node{cursor:pointer;transition:opacity .2s}
.node circle{transition:r .2s,opacity .2s}
.node:hover circle{filter:brightness(1.3)}
.node.selected circle{stroke:var(--ink);stroke-width:2}
.node.dimmed{opacity:.15}
.node.matched circle{animation:nodePulse 1s ease-in-out infinite}
@keyframes nodePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.node-label{fill:var(--muted);font-size:10px;font-family:var(--font-sans);pointer-events:none;text-anchor:middle;transition:opacity .2s;font-weight:500}
.node-label.visible{opacity:1}
.node-label.hidden{opacity:0}
.node.dimmed .node-label{opacity:0}

/* Control panel */
.controls{position:fixed;top:68px;right:16px;z-index:800;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;width:260px;max-height:calc(100vh - 100px);overflow-y:auto}
.ctrl-group{margin-bottom:16px}
.ctrl-group:last-child{margin-bottom:0}
.ctrl-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-family:var(--font-mono)}
.ctrl-row{display:flex;gap:6px;flex-wrap:wrap}
.cat-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);transition:all .15s;cursor:pointer;white-space:nowrap}
.cat-btn:hover{color:var(--ink);border-color:var(--border-strong)}
.cat-btn.active{color:var(--ink);border-color:var(--border-strong)}
.cat-btn .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.search-input{width:100%;padding:8px 12px;border-radius:8px;font-size:12px;font-family:var(--font-sans);background:var(--surface-2);border:1px solid var(--border);color:var(--ink);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--faint)}
.stat-row{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-family:var(--font-mono);padding:3px 0}
.stat-row b{color:var(--ink);font-weight:600}
.btn-zoom{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;font-size:14px}
.btn-zoom:hover{color:var(--ink);border-color:var(--border-strong)}

/* Info panel */
.info-panel{position:fixed;bottom:16px;left:16px;z-index:800;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:300px;max-width:calc(100vw - 32px);transform:translateY(120%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.info-panel.visible{transform:translateY(0)}
.info-panel .ip-cat{font-size:10px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.info-panel .ip-title{font-size:16px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.info-panel .ip-en{font-size:11px;color:var(--faint);font-family:var(--font-mono);margin-bottom:10px}
.info-panel .ip-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.info-panel .ip-stats{display:flex;gap:16px;font-size:11px;color:var(--faint);font-family:var(--font-mono);margin-bottom:14px}
.info-panel .ip-links{display:flex;gap:8px}
.info-panel .ip-btn{flex:1;text-align:center;padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;text-decoration:none;transition:all .2s;border:1px solid}
.info-panel .ip-btn-demo{background:var(--violet);border-color:var(--violet);color:#fff}
.info-panel .ip-btn-demo:hover{background:var(--accent);box-shadow:0 0 20px rgba(167,139,250,.3)}
.info-panel .ip-btn-src{background:var(--surface-2);border-color:var(--border-strong);color:var(--muted)}
.info-panel .ip-btn-src:hover{color:var(--ink)}
.info-panel .ip-close{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:6px;border:none;background:var(--surface-3);color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s}
.info-panel .ip-close:hover{color:var(--ink)}
.info-panel .ip-connected{font-size:11px;color:var(--faint);margin-bottom:8px;font-family:var(--font-mono)}
.info-panel .ip-connected-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.info-panel .ip-chip{font-size:10px;padding:3px 7px;border-radius:4px;background:var(--surface-3);color:var(--muted);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.info-panel .ip-chip:hover{color:var(--ink);border-color:var(--border-strong)}

/* Loading */
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:var(--bg);transition:opacity .5s}
.loading.hidden{opacity:0;pointer-events:none}
.loading .text{font-size:14px;color:var(--muted);font-family:var(--font-mono)}
.loading .spinner{width:40px;height:40px;border:2px solid var(--surface-3);border-top-color:var(--violet);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tooltip */
.tooltip{position:fixed;z-index:950;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .15s;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tooltip.visible{opacity:1}
.tooltip .tt-cat{font-size:10px;font-family:var(--font-mono);text-transform:uppercase;margin-bottom:2px}

/* Mobile */
@media(max-width:768px){
  .controls{width:calc(100vw - 32px);right:16px;left:16px;max-height:40vh;top:60px}
  .info-panel{width:calc(100vw - 32px)}
}
</style>
</head>

[136,54],[136,70],[136,69],[136,79],     // DB Internals → Database, AdvDB, Storage, Lakehouse
[137,61],[137,123],[137,94],[137,111],   // Adv Algorithm → Algorithm, AdvDS, Automata, Graph
[138,109],[138,108],[138,36],[138,21],   // Comp Biology → Bioinfo, PGM, NLP, Speech
[139,107],[139,121],[139,106],[139,114], // Sci Computing → Numerical, PDE, Signal, ML Math
[140,131],[140,138],[140,139],[140,15]   // AI4Science → World Models, CompBio, SciComputing, Multimodal
];

// ====================================================================
// INIT: Build node map, initialize positions
// ====================================================================
var nodeMap = {};
NODES.forEach(function(n,i){
  nodeMap[n.id] = n;
  // Initialize in a circle
  var angle = (i / NODES.length) * Math.PI * 2;
  var r = 400 + Math.random() * 200;
  n.x = Math.cos(angle) * r + (Math.random()-0.5) * 100;
  n.y = Math.sin(angle) * r + (Math.random()-0.5) * 100;
  n.vx = 0;
  n.vy = 0;
  n.degree = 0;
});

// Deduplicate edges
var edgeSet = {};
var cleanEdges = [];
EDGES.forEach(function(e){
  var key = e[0] < e[1] ? e[0]+'-'+e[1] : e[1]+'-'+e[0];
  if(!edgeSet[key] && nodeMap[e[0]] && nodeMap[e[1]]){
    edgeSet[key] = true;
    cleanEdges.push({source:e[0], target:e[1]});
    nodeMap[e[0]].degree++;
    nodeMap[e[1]].degree++;
  }
});
EDGES = cleanEdges;

// Stats
document.getElementById('statEdges').textContent = EDGES.length;
var avgDeg = (EDGES.length * 2 / NODES.length).toFixed(1);
document.getElementById('statAvg').textContent = avgDeg;

// ====================================================================
// FORCE-DIRECTED LAYOUT SIMULATION
// ====================================================================
var W = window.innerWidth;
var H = window.innerHeight - 52;
var centerX = W / 2;
var centerY = H / 2;

function simulate(iterations){
  var repulsion = 8000;
  var attraction = 0.02;
  var damping = 0.85;
  var centerForce = 0.003;

  for(var iter = 0; iter < iterations; iter++){
    // Repulsion (all pairs)
    for(var i = 0; i < NODES.length; i++){
      var a = NODES[i];
      for(var j = i+1; j < NODES.length; j++){
        var b = NODES[j];
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        var dist2 = dx*dx + dy*dy + 0.01;
        var force = repulsion / dist2;
        var dist = Math.sqrt(dist2);
        var fx = (dx/dist) * force;
        var fy = (dy/dist) * force;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }

    // Attraction (connected)
    for(var k = 0; k < EDGES.length; k++){
      var s = nodeMap[EDGES[k].source];
      var t = nodeMap[EDGES[k].target];
      var dx = t.x - s.x;
      var dy = t.y - s.y;
      var dist = Math.sqrt(dx*dx + dy*dy + 0.01);
      var force = attraction * dist;
      var fx = (dx/dist) * force;
      var fy = (dy/dist) * force;
      s.vx += fx; s.vy += fy;
      t.vx -= fx; t.vy -= fy;
    }

    // Center force + damping + update
    for(var m = 0; m < NODES.length; m++){
      var n = NODES[m];
      n.vx += (centerX - n.x) * centerForce;
      n.vy += (centerY - n.y) * centerForce;
      n.vx *= damping;
      n.vy *= damping;
      n.x += n.vx;
      n.y += n.vy;
    }
  }
}

// Run simulation
simulate(300);

// ====================================================================
// INTERACTION: Zoom & Pan
// ====================================================================
var zoom = 1;
var panX = 0;
var panY = 0;
var isDragging = false;
var dragStart = {x:0, y:0};
var graphEl = document.getElementById('graph');

function applyTransform(){
  var tx = panX + ' ' + panY + ' ' + zoom;
  edgeGroup.setAttribute('transform', 'translate('+panX+','+panY+') scale('+zoom+')');
  nodeGroup.setAttribute('transform', 'translate('+panX+','+panY+') scale('+zoom+')');
  labelGroup.setAttribute('transform', 'translate('+panX+','+panY+') scale('+zoom+')');
  // Show labels when zoomed in
  var labels = labelGroup.querySelectorAll('.node-label');
  if(!labels.length){
    labels = nodeGroup.querySelectorAll('.node-label');
  }
  var opacity = zoom > 1.5 ? 1 : (zoom > 0.8 ? 0.6 : 0);
  // Labels are in nodeGroup, handle via CSS
}

graphEl.addEventListener('mousedown', function(e){
  if(e.target.closest('.node')) return;
  isDragging = true;
  graphEl.classList.add('dragging');
  dragStart.x = e.clientX - panX;
  dragStart.y = e.clientY - panY;
});

window.addEventListener('mousemove', function(e){
  if(!isDragging) return;
  panX = e.clientX - dragStart.x;
  panY = e.clientY - dragStart.y;
  applyTransform();
});

window.addEventListener('mouseup', function(){
  isDragging = false;
  graphEl.classList.remove('dragging');
});

graphEl.addEventListener('wheel', function(e){
  e.preventDefault();
  var delta = e.deltaY > 0 ? 0.9 : 1.1;
  var newZoom = Math.max(0.2, Math.min(5, zoom * delta));
  // Zoom towards mouse position
  var rect = graphEl.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;
  panX = mx - (mx - panX) * (newZoom / zoom);
  panY = my - (my - panY) * (newZoom / zoom);
  zoom = newZoom;
  applyTransform();
},{passive:false});

// Touch support
var touchDist = 0;
graphEl.addEventListener('touchstart', function(e){
  if(e.touches.length === 1){
    isDragging = true;
    dragStart.x = e.touches[0].clientX - panX;
    dragStart.y = e.touches[0].clientY - panY;
  } else if(e.touches.length === 2){
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    touchDist = Math.sqrt(dx*dx + dy*dy);
  }
},{passive:false});

graphEl.addEventListener('touchmove', function(e){
  e.preventDefault();
  if(e.touches.length === 1 && isDragging){
    panX = e.touches[0].clientX - dragStart.x;
    panY = e.touches[0].clientY - dragStart.y;
    applyTransform();
  } else if(e.touches.length === 2){
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var newDist = Math.sqrt(dx*dx + dy*dy);
    if(touchDist > 0){
      var delta = newDist / touchDist;
      zoom = Math.max(0.2, Math.min(5, zoom * delta));
      applyTransform();
    }
    touchDist = newDist;
  }
},{passive:false});

graphEl.addEventListener('touchend', function(){
  isDragging = false;
  touchDist = 0;
});

// Zoom buttons
document.getElementById('zoomIn').addEventListener('click', function(){
  zoom = Math.min(5, zoom * 1.3);
  applyTransform();
});
document.getElementById('zoomOut').addEventListener('click', function(){
  zoom = Math.max(0.2, zoom / 1.3);
  applyTransform();
});
document.getElementById('zoomReset').addEventListener('click', function(){

});

// NODE INTERACTION
// ====================================================================
var selectedNode = null;
var infoPanel = document.getElementById('infoPanel');
var tooltip = document.getElementById('tooltip');

// Get connected node IDs
function getConnected(nodeId){
  var connected = [];
  EDGES.forEach(function(e){
    if(e.source === nodeId) connected.push(e.target);
    else if(e.target === nodeId) connected.push(e.source);
  });
  return connected;
}

// Node click
nodeGroup.addEventListener('click', function(e){
  var nodeEl = e.target.closest('.node');
  if(!nodeEl) return;
  var id = parseInt(nodeEl.getAttribute('data-id'));
  var node = nodeMap[id];
  if(!node) return;

  selectedNode = node;
  // Clear previous selection
  nodeGroup.querySelectorAll('.node').forEach(function(n){n.classList.remove('selected')});
  nodeEl.classList.add('selected');

  // Highlight connected edges
  var connected = getConnected(id);
  var connectedSet = {};
  connected.forEach(function(cid){connectedSet[cid] = true});

  edgeGroup.querySelectorAll('.edge').forEach(function(line){
    var s = parseInt(line.getAttribute('data-source'));
    var t = parseInt(line.getAttribute('data-target'));
    if(s === id || t === id){
      line.classList.add('highlighted');
      line.classList.remove('dimmed');
    } else {
      line.classList.add('dimmed');
      line.classList.remove('highlighted');
    }
  });

  nodeGroup.querySelectorAll('.node').forEach(function(n){
    var nid = parseInt(n.getAttribute('data-id'));
    if(nid === id || connectedSet[nid]){
      n.classList.remove('dimmed');
    } else {
      n.classList.add('dimmed');
    }
  });

  // Show info panel
  showInfoPanel(node, connected);
});

function showInfoPanel(node, connected){
  document.getElementById('ipCat').textContent = CAT_NAMES[node.cat] || node.cat;
  document.getElementById('ipCat').style.color = CAT_COLORS[node.cat];
  document.getElementById('ipTitle').textContent = node.name;
  document.getElementById('ipEn').textContent = node.en;
  document.getElementById('ipDesc').textContent = node.desc;
  document.getElementById('ipStats').innerHTML = '<span>'+node.modules+' modules</span><span>'+node.degree+' connections</span>';

  var demoUrl = node.slug === 'ai-trends-2026'
    ? 'https://wangzifan396-wzf.github.io/TW/ai-trends-2026.html'
    : 'https://wangzifan396-wzf.github.io/TW/'+node.slug+'/';
  document.getElementById('ipDemo').href = demoUrl;
  document.getElementById('ipSrc').href = 'https://github.com/wangzifan396-wzf/'+node.slug;

  // Connected list
  var listEl = document.getElementById('ipConnectedList');
  var labelEl = document.getElementById('ipConnectedLabel');
  if(connected.length > 0){
    labelEl.textContent = 'Connected to (' + connected.length + '):';
    listEl.innerHTML = '';
    connected.slice(0, 12).forEach(function(cid){
      var cn = nodeMap[cid];
      if(cn){
        var chip = document.createElement('span');
        chip.className = 'ip-chip';
        chip.textContent = cn.name;
        chip.addEventListener('click', function(){
          // Click connected node
          var el = nodeGroup.querySelector('[data-id="'+cid+'"]');
          if(el) el.click();
        });
        listEl.appendChild(chip);
      }
    });
  } else {
    labelEl.textContent = '';
    listEl.innerHTML = '';
  }

  infoPanel.classList.add('visible');
}

// Close info panel
document.getElementById('ipClose').addEventListener('click', function(){
  infoPanel.classList.remove('visible');

  nodeGroup.querySelectorAll('.node').forEach(function(n){n.classList.remove('selected')});

var searchInput = document.getElementById('search');
searchInput.addEventListener('input', function(){
  var term = searchInput.value.trim().toLowerCase();
  if(term === ''){
    nodeGroup.querySelectorAll('.node').forEach(function(n){
      n.classList.remove('matched');
      n.classList.remove('dimmed');
    });
    return;
  }
  var matched = [];
  NODES.forEach(function(n){
    var text = (n.name + ' ' + n.en + ' ' + n.desc + ' ' + n.slug).toLowerCase();
    if(text.indexOf(term) >= 0){
      matched.push(n.id);
    }
  });
  nodeGroup.querySelectorAll('.node').forEach(function(el){
    var id = parseInt(el.getAttribute('data-id'));
    if(matched.indexOf(id) >= 0){
      el.classList.add('matched');
      el.classList.remove('dimmed');
    } else {
      el.classList.remove('matched');
      el.classList.add('dimmed');
    }
  });
});

  document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active')});

      }

      var t = nodeMap[parseInt(l.getAttribute('data-target'))];

        l.classList.remove('dimmed');
      } else {
        l.classList.add('dimmed');
      }
    });
  }
});

// ====================================================================
// CONTINUOUS PHYSICS (light, for organic feel)
// ====================================================================
var animId = null;
var isRunning = true;

function tick(){
  if(!isRunning){return;}
  // Light simulation
  var repulsion = 3000;
  var attraction = 0.015;
  var damping = 0.92;
  var centerForce = 0.002;

  for(var i = 0; i < NODES.length; i++){
    var a = NODES[i];
    for(var j = i+1; j < NODES.length; j++){
      var b = NODES[j];
      var dx = a.x - b.x;
      var dy = a.y - b.y;
      var dist2 = dx*dx + dy*dy + 0.01;
      if(dist2 < 10000){ // Only nearby nodes
        var force = repulsion / dist2;
        var dist = Math.sqrt(dist2);
        var fx = (dx/dist) * force;
        var fy = (dy/dist) * force;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
  }

  for(var k = 0; k < EDGES.length; k++){
    var s = nodeMap[EDGES[k].source];
    var t = nodeMap[EDGES[k].target];
    var dx = t.x - s.x;
    var dy = t.y - s.y;
    var dist = Math.sqrt(dx*dx + dy*dy + 0.01);
    if(dist > 200){
      var force = attraction * dist;
      var fx = (dx/dist) * force;
      var fy = (dy/dist) * force;
      s.vx += fx; s.vy += fy;
      t.vx -= fx; t.vy -= fy;
    }
  }

  for(var m = 0; m < NODES.length; m++){
    var n = NODES[m];
    n.vx += (centerX - n.x) * centerForce;
    n.vy += (centerY - n.y) * centerForce;
    n.vx *= damping;
    n.vy *= damping;
    n.x += n.vx;
    n.y += n.vy;
  }

  updateEdges();
  updateNodes();
  animId = requestAnimationFrame(tick);
}

// Start light animation, but slow down after 5 seconds
tick();
setTimeout(function(){
  isRunning = false;
  if(animId) cancelAnimationFrame(animId);
}, 8000);

// Pause when dragging
graphEl.addEventListener('mousedown', function(){
  isRunning = false;
  if(animId) cancelAnimationFrame(animId);
});
