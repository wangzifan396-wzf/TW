<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TW · 神经形态计算与类脑AI芯片可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}

/* ===== app-header ===== */
.app-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;background:rgba(10,11,15,.93);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.hdr-left{display:flex;align-items:center;gap:12px}
.logo-mark{font-size:22px;color:var(--purple);line-height:1;text-shadow:0 0 14px rgba(167,139,250,.7)}
.hdr-title{font-size:16px;font-weight:700;letter-spacing:.01em}
.hdr-sub{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.04em;margin-top:1px}
.hdr-right{display:flex;gap:8px}
.badge{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);padding:5px 9px;border-radius:5px;letter-spacing:.05em;white-space:nowrap}
.badge.b2{color:var(--green);border-color:rgba(52,211,153,.3)}

/* ===== module-nav ===== */
.module-nav{display:flex;gap:6px;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:58px;z-index:40}
.nav-btn{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 13px;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
.nav-btn:hover{color:var(--text);border-color:var(--purple)}
.nav-btn.active{color:var(--purple);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.45)}
.nb-num{font-family:var(--mono);font-size:11px;color:var(--text3)}
.nav-btn.active .nb-num{color:var(--purple)}

/* ===== lab-hero ===== */
.lab-hero{padding:26px 24px 14px}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.hero-card{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:16px;position:relative;overflow:hidden}
.hc-k{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.hc-v{font-size:23px;font-weight:700;margin-bottom:4px}
.hc-d{font-size:12px;color:var(--text2)}
.hc-bar{position:absolute;top:0;left:0;width:3px;height:100%}

/* ===== module-panel ===== */
.module-panel{max-width:1100px;margin:0 auto;padding:6px 24px 64px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.ph-left{display:flex;align-items:center;gap:14px}
.ph-num{font-family:var(--mono);font-size:13px;color:var(--purple);background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);padding:5px 10px;border-radius:6px;letter-spacing:.05em}
.ph-title{font-size:20px;font-weight:700}
.ph-desc{font-size:13px;color:var(--text2);margin-top:2px}
.ph-tags{display:flex;gap:6px;flex-wrap:wrap}
.ph-tag{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);padding:4px 8px;border-radius:5px}
.panel-tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px}
.tab-btn{flex:1;font-size:12.5px;font-weight:500;color:var(--text2);background:transparent;border:1px solid transparent;border-radius:7px;padding:10px 10px;cursor:pointer;transition:.18s;text-align:center;font-family:inherit}
.tab-btn:hover{color:var(--text);background:var(--bg3)}
.tab-btn.active{color:var(--purple);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.35);font-weight:600}
.panel-body{display:grid;grid-template-columns:1fr 282px;gap:14px;align-items:start}
@media(max-width:940px){.panel-body{grid-template-columns:1fr}}
.canvas-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:12px;overflow:hidden}
.canvas-wrap svg{display:block;width:100%;height:auto}

/* ===== sidebar ===== */
.sidebar{display:flex;flex-direction:column;gap:12px}
.side-panel{display:flex;flex-direction:column;gap:12px}
.side-block{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px}
.side-label{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text);background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px}
.pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.legend-box{display:flex;flex-direction:column;gap:7px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.info-box{display:flex;flex-direction:column;gap:10px}
.info-item{display:flex;flex-direction:column;gap:2px}
.info-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.info-val{font-size:12.5px;color:var(--text2);line-height:1.55}

svg text{font-family:var(--mono)}
.foot{max-width:1100px;margin:0 auto;padding:10px 24px 40px;color:var(--text3);font-size:11.5px;font-family:var(--mono);letter-spacing:.03em}

/* ===== animation classes ===== */
.apulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
.aglow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
.adash{stroke-dasharray:6 4;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-10}}
.ablink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>

  <div class="hdr-left">

<script>
var SVGNS='http://www.w3.org/2000/svg';
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

/* ===== core utilities ===== */
function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){el.setAttribute(k,attrs[k]);}}
  parent.appendChild(el);
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n.firstChild){n.removeChild(n.firstChild);}}
function box(g,x,y,w,h,fill,stroke,sw,rx){
  return E(g,'rect',{x:x,y:y,width:w,height:h,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5,rx:rx||5});
}
function txt(g,x,y,s,fs,fill,anchor,fw){
  var t=E(g,'text',{x:x,y:y,fill:fill||C.text,'font-size':fs||12,'text-anchor':anchor||'start','font-family':C.mono,'font-weight':fw||'normal'});
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,stroke,sw,dash,cls){
  var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:stroke||C.border2,'stroke-width':sw||1.5};
  if(dash&&dash!=='none')a['stroke-dasharray']=dash;
  if(cls)a['class']=cls;
  return E(g,'line',a);
}
function arrow(g,x1,y1,x2,y2,stroke,sw){
  var s=stroke||C.text2;var w=sw||1.5;
  line(g,x1,y1,x2,y2,s,w);
  var ang=Math.atan2(y2-y1,x2-x1);var L=9;var aw=4.2;
  var bx=x2-L*Math.cos(ang);var by=y2-L*Math.sin(ang);
  var p1x=bx+aw*Math.sin(ang);var p1y=by-aw*Math.cos(ang);
  var p2x=bx-aw*Math.sin(ang);var p2y=by+aw*Math.cos(ang);
  return poly(g,x2.toFixed(1)+','+y2.toFixed(1)+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1),s,s,1);
}
function circ(g,cx,cy,r,fill,stroke,sw,cls){
  var a={cx:cx,cy:cy,r:r,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5};
  if(cls)a['class']=cls;
  return E(g,'circle',a);
}
function poly(g,points,fill,stroke,sw,cls){
  var a={points:points,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5};
  if(cls)a['class']=cls;
  return E(g,'polygon',a);
}
function path(g,d,stroke,sw,fill,dash,cls){
  var a={d:d,fill:fill||'none',stroke:stroke||C.border2,'stroke-width':sw||1.5};
  if(dash&&dash!=='none')a['stroke-dasharray']=dash;
  if(cls)a['class']=cls;
  return E(g,'path',a);
}
function bp(pts){var d='M'+pts[0][0]+','+pts[0][1];for(var i=1;i<pts.length;i++){d+=' L'+pts[i][0]+','+pts[i][1];}return d;}
function radar(g,cx,cy,r,labels,series){
  var n=labels.length;
  for(var k=1;k<=4;k++){
    var pts=[];
    for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;pts.push((cx+Math.cos(a)*r*k/4).toFixed(1)+','+(cy+Math.sin(a)*r*k/4).toFixed(1));}
    poly(g,pts.join(' '),'none',C.border,1);
  }
  for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,C.border,1);}
  for(var s=0;s<series.length;s++){
    var col=series[s].c;var vals=series[s].vals;var pts=[];
    for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;var vv=vals[i]/100*r;pts.push((cx+Math.cos(a)*vv).toFixed(1)+','+(cy+Math.sin(a)*vv).toFixed(1));}
    poly(g,pts.join(' '),col+'22',col,1.8);
    for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;var vv=vals[i]/100*r;circ(g,cx+Math.cos(a)*vv,cy+Math.sin(a)*vv,3,col,col,1);}
  }
  for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;txt(g,cx+Math.cos(a)*(r+18),cy+Math.sin(a)*(r+18)+4,labels[i],11,C.text2,'middle');}
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function setPills(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='pill';
    d.innerHTML='<span class="pill-dot" style="background:'+arr[i].c+'"></span><span>'+arr[i].s+'</span>';
    el.appendChild(d);
  }
}
function setLegend(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='leg-item';
    d.innerHTML='<span class="leg-dot" style="background:'+arr[i].c+'"></span><span>'+arr[i].s+'</span>';
    el.appendChild(d);
  }
}
function setInfo(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='info-item';
    d.innerHTML='<span class="info-label" style="color:'+arr[i].c+'">'+arr[i].k+'</span><span class="info-val">'+arr[i].v+'</span>';
    el.appendChild(d);
  }
}

/* ===== modules definition ===== */
var MODULES=[
  {n:'01',t:'神经形态计算革命',d:'2026类脑新纪元 · 从冯诺依曼到类脑 · 能耗降低1000倍',v:['冯诺依曼vs类脑','突破时间线','能耗革命'],tags:['存算一体','事件驱动','1000×能效']},
  {n:'02',t:'脉冲神经网络SNN原理',d:'LIF神经元模型 · 脉冲编码 · 时序信息处理 · STDP学习规则',v:['LIF神经元','脉冲编码','STDP学习'],tags:['LIF模型','脉冲编码','时序处理']},
  {n:'03',t:'类脑芯片矩阵对比',d:'Intel Loihi 2 / IBM TrueNorth / BrainChip Akida 架构与能效',v:['架构对比','雷达参数','能效TOPS/W'],tags:['Loihi 2','TrueNorth','Akida']},
  {n:'04',t:'事件驱动与异步处理',d:'事件相机 · 稀疏事件驱动 · 仅处理变化像素 · 功耗优势',v:['事件相机原理','稀疏事件流','功耗优势'],tags:['DVS','稀疏','异步']},
  {n:'05',t:'SNN训练与学习规则',d:'STDP无监督 · 替代梯度反向传播 · SNN-to-ANN转换 · 混合训练',v:['STDP无监督','替代梯度','SNN转ANN'],tags:['STDP','Surrogate','混合训练']},
  {n:'06',t:'类脑AI应用场景',d:'边缘感知 · 实时视觉 · 机器人控制 · 自动驾驶事件感知',v:['边缘感知','机器人控制','自动驾驶'],tags:['边缘AI','机器人','自动驾驶']},
  {n:'07',t:'神经形态vs传统AI',d:'能耗/延迟/吞吐量对比 · 优劣势分析 · 适用场景边界',v:['能耗延迟','吞吐对比','场景边界'],tags:['能效','低延迟','场景边界']},
  {n:'08',t:'类脑终局与通用AI',d:'脑科学启发计算 · 意识计算假说 · 通用AI路径 · 碳硅融合',v:['脑启发计算','通用AI路径','碳硅融合'],tags:['脑启发','通用AI','碳硅融合']}
];

/* ===== module system ===== */
var mCur=0,mViews=[0,0,0,0,0,0,0,0],mLayers={};

function initSidebar(){
  var sb=$('sidebar');clearNode(sb);
  for(var i=1;i<=8;i++){
    var p=document.createElement('div');p.className='side-panel';p.id='side-m'+i;p.style.display='none';
    p.innerHTML='<div class="side-block"><div class="side-label">关键指标</div><div class="pill-row" id="m'+i+'-stat"></div></div>'
      +'<div class="side-block"><div class="side-label">图例</div><div class="legend-box" id="m'+i+'-leg"></div></div>'
      +'<div class="side-block"><div class="side-label">解读</div><div class="info-box" id="m'+i+'-info"></div></div>';
    sb.appendChild(p);
  }
}
function updatePanel(mi){
  var m=MODULES[mi];
  $('ph-num').textContent=m.n;
  $('ph-title').textContent=m.t;
  $('ph-desc').textContent=m.d;
  var tg=$('ph-tags');clearNode(tg);
  for(var i=0;i<m.tags.length;i++){var s=document.createElement('span');s.className='ph-tag';s.textContent=m.tags[i];tg.appendChild(s);}
  for(var i=0;i<3;i++){var tb=$('tab-'+i);tb.textContent=m.v[i];tb.className='tab-btn'+(mViews[mi]===i?' active':'');}
  var btns=document.querySelectorAll('.nav-btn');
  for(var j=0;j<btns.length;j++){btns[j].className='nav-btn'+(j===mi?' active':'');}
  for(var k=1;k<=8;k++){var sp=$('side-m'+k);if(sp)sp.style.display=(k===mi+1)?'':'none';}
}
function drawModule(mi){
  for(var i=1;i<=8;i++){if(mLayers['m'+i])mLayers['m'+i].style.display='none';}
  mCur=mi;
  mLayers['m'+(mi+1)].style.display='';
  updatePanel(mi);
  var fn=window['m'+(mi+1)+'Draw'];
  if(fn)fn();
}
function setView(mi,vi){mViews[mi]=vi;drawModule(mi);}

function init(){
  initSidebar();
  var nav=$('module-nav');
  for(var i=0;i<8;i++){
    var b=document.createElement('button');b.className='nav-btn';
    b.innerHTML='<span class="nb-num">'+MODULES[i].n+'</span><span>'+MODULES[i].t+'</span>';
    b.onclick=(function(mi){return function(){drawModule(mi);};})(i);
    nav.appendChild(b);
  }
  var tb=$('panel-tabs');
  for(var i=0;i<3;i++){
    var t=document.createElement('button');t.className='tab-btn';t.id='tab-'+i;
    t.onclick=(function(vi){return function(){setView(mCur,vi);};})(i);
    tb.appendChild(t);
  }
  var svg=$('canvas');
  for(var i=1;i<=8;i++){var g=E(svg,'g',{id:'m'+i+'-layer'});mLayers['m'+i]=g;g.style.display='none';}
  drawModule(0);
}

/* ===================== MODULE 1 ===================== */
function m1Draw(){
  var g=mLayers.m1;clearNode(g);gridBg(g,900,480);
  var v=mViews[0];
  if(v===0){
