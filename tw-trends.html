<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Trends — 技术采用趋势追踪</title>
<style>
  /* ============ Reset & Tokens ============ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:        #08090a;
    --bg-1:      #0b0c0e;
    --bg-2:      #101114;
    --bg-3:      #15171b;
    --border:    #1d1f24;
    --border-2:  #272a31;
    --ink:       #e8e8ec;
    --muted:     #8a8d95;
    --dim:       #54565d;
    --accent:    #f97316;
    --accent-2:  #fb923c;
    --accent-d:  #c2410c;
    --green:     #22c55e;
    --red:       #ef4444;
    --cyan:      #22d3ee;
    --purple:    #a78bfa;
    --font:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono:      ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Consolas, monospace;
    --r-sm: 5px; --r: 8px; --r-lg: 12px;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(249,115,22,.32); color: #fff; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #34373f; }

  /* ============ Layout ============ */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ============ Header ============ */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(8,9,10,.88);
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-d));
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700; font-size: 14px; color: #0a0a0a;
    box-shadow: 0 0 0 1px rgba(249,115,22,.35), 0 6px 18px -6px rgba(249,115,22,.5);
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-text b { font-weight: 650; letter-spacing: .2px; font-size: 15px; }
  .logo-text span { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
  .header-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; }
  .seg button {
    padding: 5px 11px; font-size: 12px; color: var(--muted); border-radius: 4px;
    font-family: var(--mono); letter-spacing: .02em; transition: color .15s, background .15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--bg-3); color: var(--accent); box-shadow: inset 0 0 0 1px var(--border-2); }
  .seg-label { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; align-self: center; }

  .tabs {
    display: flex; gap: 2px; padding: 0 12px; overflow-x: auto;
    scrollbar-width: thin;
  }
  .tab {
    flex-shrink: 0; padding: 9px 12px; font-size: 12.5px; color: var(--muted);
    border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s, border-color .15s;
    display: flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tab.on .dot { background: var(--accent); box-shadow: 0 0 8px rgba(249,115,22,.7); }

  /* ============ Main ============ */
  .main { flex: 1; padding: 20px; max-width: 1480px; width: 100%; margin: 0 auto; }
  .view { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ============ Cards ============ */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
  }
  .card-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .card-h h3 { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .card-h .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--bg-3); color: var(--muted); border: 1px solid var(--border-2); font-family: var(--mono); }

  /* ============ Dashboard ============ */
  .ov-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .ov-stat { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; position: relative; overflow: hidden; }
  .ov-stat::after { content: ""; position: absolute; right: -20px; top: -20px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(249,115,22,.10), transparent 70%); }
  .ov-stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .ov-stat .v { font-size: 28px; font-weight: 680; font-family: var(--mono); margin-top: 6px; letter-spacing: -.01em; }
  .ov-stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .ov-stat .d { font-size: 11px; color: var(--dim); margin-top: 3px; }

  .dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }

  .rank-list { display: flex; flex-direction: column; }
  .rank-row {
    display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px;
    padding: 9px 4px; border-bottom: 1px solid var(--border);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row:hover { background: var(--bg-2); }
  .rank-n { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: center; }
  .rank-row.top3 .rank-n { color: var(--accent); font-weight: 700; }
  .rank-name { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .rank-name .sw { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .rank-name b { font-weight: 550; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-name .cat { font-size: 10.5px; color: var(--dim); }
  .rank-val { font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: right; }
  .rank-val.up { color: var(--green); }
  .rank-val.dn { color: var(--red); }
  .rank-bar { height: 3px; background: var(--bg-3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .rank-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .rank-bar i.dn { background: var(--red); }

  .quad-wrap { position: relative; }
  .quad-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .quad-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .quad-legend i { width: 9px; height: 9px; border-radius: 2px; }

  /* ============ Detail ============ */
  .detail { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  .chart-card { padding: 18px 18px 8px; }
  .chart-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .chart-title h2 { font-size: 18px; font-weight: 650; letter-spacing: -.005em; }
  .chart-title .cat { font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .chart-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .leg {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; transition: opacity .15s, border-color .15s; cursor: pointer;
  }
  .leg:hover { border-color: var(--border-2); }
  .leg.off { opacity: .35; }
  .leg .sw { width: 10px; height: 10px; border-radius: 2px; }
  .leg .lv { font-family: var(--mono); color: var(--muted); margin-left: 2px; font-size: 11px; }

  .chart-box { width: 100%; }
  .chart-box svg { width: 100%; height: auto; display: block; font-family: var(--mono); }

  .grid-line { stroke: var(--border); stroke-width: 1; }
  .grid-line.zero { stroke: var(--border-2); }
  .axis-text { fill: var(--dim); font-size: 10.5px; }
  .axis-text.y { text-anchor: end; }
  .axis-text.x { text-anchor: middle; }
  .axis-title { fill: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .event-line { stroke: var(--border-2); stroke-width: 1; stroke-dasharray: 2 3; }
  .event-label { fill: var(--muted); font-size: 9.5px; }
  .event-tag { fill: var(--bg); }

  .pt { cursor: pointer; }
  .pt-hit { fill: transparent; pointer-events: all; }
  .pt-dot { transition: r .12s, stroke-width .12s; }
  .pt-tip { opacity: 0; transition: opacity .12s; pointer-events: none; }
  .pt:hover .pt-tip { opacity: 1; }
  .pt:hover .pt-dot { stroke-width: 3px; }

  /* ============ Stats Side ============ */
  .stats-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 96px; }
  .stat-tech {
    background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r);
    padding: 14px; border-left: 3px solid var(--border-2);
  }
  .stat-tech.lead { border-color: var(--border); }
  .stat-tech-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .stat-tech-h .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .stat-tech-h .nm .sw { width: 10px; height: 10px; border-radius: 2px; }
  .stat-tech-h .rank { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .stat-tech-h .rank b { color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-cell { }
  .stat-cell .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .stat-cell .v { font-size: 16px; font-weight: 650; font-family: var(--mono); margin-top: 2px; }
  .stat-cell .v.up { color: var(--green); }
  .stat-cell .v.dn { color: var(--red); }
  .stat-cell .v small { font-size: 11px; color: var(--muted); font-weight: 500; }
  .mini-spark { margin-top: 10px; height: 30px; }
  .mini-spark svg { width: 100%; height: 100%; display: block; }

  /* ============ Table ============ */
  .table-wrap { overflow-x: auto; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 760px; }
  table.cmp th, table.cmp td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.cmp thead th {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    font-weight: 600; background: var(--bg-2); position: sticky; top: 0;
  }
  table.cmp tbody tr { transition: background .12s; }
  table.cmp tbody tr:hover { background: var(--bg-2); }
  table.cmp .grp td { background: var(--bg-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; }
  table.cmp .nm { display: flex; align-items: center; gap: 8px; font-weight: 550; }
  table.cmp .nm .sw { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  table.cmp .num { font-family: var(--mono); text-align: right; }
  table.cmp .num.up { color: var(--green); }
  table.cmp .num.dn { color: var(--red); }
  table.cmp .spark { width: 96px; }
  table.cmp .spark svg { width: 96px; height: 26px; display: block; }

  /* ============ Footer ============ */
  .foot { text-align: center; padding: 24px 20px 32px; color: var(--dim); font-size: 11.5px; border-top: 1px solid var(--border); margin-top: 24px; }
  .foot b { color: var(--muted); font-family: var(--mono); }

  /* ============ Responsive ============ */
  @media (max-width: 1100px) {
    .ov-stats { grid-template-columns: repeat(2, 1fr); }
    .dash-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .detail { grid-template-columns: 1fr; }
    .stats-side { position: static; }
    .header-top { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    .main { padding: 14px; }
    .logo-text span { display: none; }
  }
  @media (max-width: 560px) {
    .ov-stats { grid-template-columns: 1fr 1fr; }
    .stat-grid { grid-template-columns: 1fr; }
    .header-tools { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .view { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ Header ============ -->
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-mark">TW</div>

          <b>TW Trends</b>

      <div class="header-tools" id="headerTools">
        <div class="seg" id="rangeSeg" data-tip="时间范围">
          <span class="seg-label">范围</span>

</div>

/* 给每个 tech 附加 color / peak / 增长等派生字段 */
var GROUPS = RAW_GROUPS.map(function(g){
  g.techs = g.techs.map(function(t, i){
    var max = 0, maxYear = YEARS[0], firstNZ = -1;
    for (var k=0;k<t.values.length;k++){
      var v = t.values[k];
      if (v > max){ max = v; maxYear = YEARS[k]; }
      if (firstNZ < 0 && v > 0) firstNZ = k;
    }
    var cur = t.values[t.values.length-1];
    var base = firstNZ>=0 ? t.values[firstNZ] : 0;
    var absGrowth = cur - (firstNZ>=0 ? t.values[firstNZ] : 0);
    var pctGrowth = base>0 ? ((cur-base)/base*100) : (cur>0 ? 999 : 0);
    return {
      name: t.name,
      values: t.values,
      color: PALETTE[i % PALETTE.length],
      cur: cur,
      peak: max,
      peakYear: maxYear,
      firstNZ: firstNZ,
      absGrowth: absGrowth,
      pctGrowth: pctGrowth
    };
  });
  // 组内当前值排序 -> 排名
  var ranked = g.techs.slice().sort(function(a,b){ return b.cur - a.cur; });
  g.techs.forEach(function(t){
    t.rank = ranked.indexOf(t) + 1;
  });
  g.maxCur = g.techs.reduce(function(m,t){ return Math.max(m,t.cur); }, 0);
 return g;
});

/* ---------- 全局技术扁平列表 (用于排行/象限/表格) ---------- */
var ALL_TECHS = [];
GROUPS.forEach(function(g){
  g.techs.forEach(function(t){
    var normMaturity = g.maxCur > 0 ? (t.cur / g.maxCur * 100) : 0;
    ALL_TECHS.push({
      name: t.name, group: g, color: t.color,
      cur: t.cur, peak: t.peak, peakYear: t.peakYear,
      absGrowth: t.absGrowth, pctGrowth: t.pctGrowth,
      rank: t.rank, maturity: normMaturity, values: t.values
    });
  });
});

/* ---------- 图表几何 ---------- */
var CHART = { w: 900, h: 420, pad: { t: 34, r: 28, b: 46, l: 54 } };

/* 根据时间范围取年份索引 */
function yearIdxs(range){
  var n = YEARS.length;
  if (range === "5y") return [n-5, n-4, n-3, n-2, n-1];
  if (range === "3y") return [n-3, n-2, n-1];
  var a = []; for (var i=0;i<n;i++) a.push(i); return a;
}
function rangeLabel(range){ return range==="all"?"全部":range==="5y"?"近5年":"近3年"; }

/* 计算 Y 轴范围 */
function yBounds(group, idxs){
  var min = Infinity, max = -Infinity;
  var visible = visibleTechs(group);
  visible.forEach(function(t){
    idxs.forEach(function(i){
      var v = t.values[i];
      if (v < min) min = v;
      if (v > max) max = v;
    });
  });
  if (visible.length === 0){ min = 0; max = 100; }
  if (min === max){ min = min - 5; max = max + 5; }
  // Elo 从 1000 起，0-100 指标从 0 起更直观
  if (group.unit !== "Elo") min = Math.min(min, 0);
  var pad = (max - min) * 0.12 || 8;
  if (group.unit !== "Elo") max = max + pad; else { min = min - pad*0.5; max = max + pad*0.5; }
  if (group.unit !== "Elo" && min < 0) min = 0;
  return { min: min, max: max };
}
function visibleTechs(group){
  var h = state.hidden[group.id] || [];
  return group.techs.filter(function(t){ return h.indexOf(t.name) < 0; });
}

/* 工具: 格式化数值 */
function fmt(v, unit){
  if (v === 0) return unit === "Elo" ? "—" : "0";
  return unit === "Elo" ? Math.round(v).toString() : Math.round(v).toString();
}
function fmtGrowth(g){
  if (g === 0) return "0";
  var sign = g > 0 ? "+" : "";
  return sign + Math.round(g);
}

/* ============================================================
   SVG 图表渲染
   ============================================================ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function svgOpen(extra){
  return '<svg viewBox="0 0 '+CHART.w+' '+CHART.h+'" preserveAspectRatio="xMidYMid meet" role="img" '+(extra||"")+'>';
}

/* 折线图 */
function renderLine(group){
  var idxs = yearIdxs(state.range);
  var b = yBounds(group, idxs);
  var pad = CHART.pad, W = CHART.w - pad.l - pad.r, H = CHART.h - pad.t - pad.b;
  var n = idxs.length;
  var xFor = function(i){ return pad.l + (n===1 ? W/2 : i*W/(n-1)); };
  var yFor = function(v){ return pad.t + (1-(v-b.min)/(b.max-b.min||1))*H; };
  var s = svgOpen('aria-label="'+esc(group.title)+' 折线图"');
  // grid + y axis
  var ticks = 5;
  for (var i=0;i<=ticks;i++){
    var v = b.min + (b.max-b.min)*i/ticks;
    var y = yFor(v);
    s += '<line class="grid-line'+(i===0?' zero':'')+'" x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(CHART.w-pad.r)+'" y2="'+y.toFixed(1)+'"/>';
    s += '<text class="axis-text y" x="'+(pad.l-8)+'" y="'+(y+3).toFixed(1)+'">'+fmt(v, group.unit)+'</text>';
  }
  // x axis labels
  for (var i=0;i<n;i++){
    var x = xFor(i);
    s += '<text class="axis-text x" x="'+x.toFixed(1)+'" y="'+(CHART.h-pad.b+16)+'">'+YEARS[idxs[i]]+'</text>';
  }
  s += '<text class="axis-title" x="'+(pad.l)+'" y="18">'+esc(group.unit)+'</text>';
  // events
  s += renderEvents(group, idxs, xFor, yFor, b);
  // lines + points
  visibleTechs(group).forEach(function(t){
    var d = "";
    idxs.forEach(function(yi, i){
      var v = t.values[yi];
      d += (i===0?"M":"L")+xFor(i).toFixed(1)+" "+yFor(v).toFixed(1)+" ";
    });
    s += '<path d="'+d.trim()+'" fill="none" stroke="'+t.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>';
    idxs.forEach(function(yi, i){
      var v = t.values[yi], x = xFor(i), y = yFor(v);
      s += '<g class="pt"><circle class="pt-hit" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="13"/>';
      s += '<circle class="pt-dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="'+t.color+'" stroke="'+CSS_VAR_BG+'" stroke-width="1.5"/>';
      s += tipMarkup(x, y, YEARS[yi], v, t, group);
      s += '</g>';
    });
  });
  s += '</svg>';
  return s;
}

/* 柱状图 (分组) */
function renderBar(group){
  var idxs = yearIdxs(state.range);
  var b = yBounds(group, idxs);
  var pad = CHART.pad, W = CHART.w - pad.l - pad.r, H = CHART.h - pad.t - pad.b;
  var n = idxs.length;
  var vis = visibleTechs(group);
  var m = vis.length || 1;
  var groupW = W / n;
  var barW = Math.min(16, (groupW * 0.7) / m);
  var yFor = function(v){ return pad.t + (1-(v-b.min)/(b.max-b.min||1))*H; };
  var s = svgOpen('aria-label="'+esc(group.title)+' 柱状图"');
  var ticks = 5;
  for (var i=0;i<=ticks;i++){
    var v = b.min + (b.max-b.min)*i/ticks;
    var y = yFor(v);
    s += '<line class="grid-line'+(i===0?' zero':'')+'" x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(CHART.w-pad.r)+'" y2="'+y.toFixed(1)+'"/>';
    s += '<text class="axis-text y" x="'+(pad.l-8)+'" y="'+(y+3).toFixed(1)+'">'+fmt(v, group.unit)+'</text>';
  }
  s += '<text class="axis-title" x="'+pad.l+'" y="18">'+esc(group.unit)+'</text>';
  idxs.forEach(function(yi, i){
    var gx = pad.l + groupW*i + groupW/2;
    var startX = gx - (m*barW)/2 + barW/2;
    s += '<text class="axis-text x" x="'+gx.toFixed(1)+'" y="'+(CHART.h-pad.b+16)+'">'+YEARS[yi]+'</text>';
    vis.forEach(function(t, ti){
      var v = t.values[yi];
      var x = startX + ti*barW - barW/2;
      var y = yFor(v);
      var h = (pad.t + H) - y;
      if (h < 0) { h = 0; y = pad.t + H; }
      s += '<g class="pt"><rect class="pt-hit" x="'+(x-2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(barW+4).toFixed(1)+'" height="'+Math.max(h,2).toFixed(1)+'" rx="2"/>';
      s += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+t.color+'" opacity="0.92"/>';
      s += tipMarkup(x+barW/2, y, YEARS[yi], v, t, group);
      s += '</g>';
    });
  });
  s += '</svg>';
  return s;
}

/* 雷达图 */
function renderRadar(group){
  var idxs = yearIdxs(state.range);
  var b = yBounds(group, idxs);
  var cx = CHART.w/2, cy = CHART.h/2 + 6;
  var r = Math.min((CHART.w-120)/2, (CHART.h-90)/2);
  var n = idxs.length;
  var ang = function(i){ return -Math.PI/2 + i*2*Math.PI/n; };
  var pt = function(i, v){ var rr = r*(v-b.min)/(b.max-b.min||1); return [cx+rr*Math.cos(ang(i)), cy+rr*Math.sin(ang(i))]; };
  var s = svgOpen('aria-label="'+esc(group.title)+' 雷达图"');
  // concentric grid
  for (var g=1; g<=4; g++){
    var rr = r*g/4;
    var poly = "";
    for (var i=0;i<n;i++){ poly += (cx+rr*Math.cos(ang(i))).toFixed(1)+","+(cy+rr*Math.sin(ang(i))).toFixed(1)+" "; }
    s += '<polygon points="'+poly.trim()+'" fill="none" class="grid-line"/>';
  }
  // axes + year labels
  for (var i=0;i<n;i++){
    var ex = cx+r*Math.cos(ang(i)), ey = cy+r*Math.sin(ang(i));
    s += '<line class="grid-line" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'"/>';
    var lx = cx+(r+16)*Math.cos(ang(i)), ly = cy+(r+16)*Math.sin(ang(i));
    s += '<text class="axis-text" x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="middle">'+YEARS[idxs[i]]+'</text>';
  }
  // tech polygons
  visibleTechs(group).forEach(function(t, ti){
    var poly = "";
    idxs.forEach(function(yi, i){ var p = pt(i, t.values[yi]); poly += p[0].toFixed(1)+","+p[1].toFixed(1)+" "; });
    s += '<defs><linearGradient id="rg-'+group.id+'-'+ti+'" x1="0" y1="0" x2="1" y2="1">';
    s += '<stop offset="0%" stop-color="'+t.color+'" stop-opacity="0.30"/>';
    s += '<stop offset="100%" stop-color="'+t.color+'" stop-opacity="0.08"/>';
    s += '</linearGradient></defs>';
    s += '<polygon points="'+poly.trim()+'" fill="url(#rg-'+group.id+'-'+ti+')" stroke="'+t.color+'" stroke-width="2" stroke-linejoin="round"/>';
    idxs.forEach(function(yi, i){
      var p = pt(i, t.values[yi]);
      s += '<g class="pt"><circle class="pt-hit" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="12"/>';
      s += '<circle class="pt-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.8" fill="'+t.color+'" stroke="'+CSS_VAR_BG+'" stroke-width="1.3"/>';
      s += tipMarkup(p[0], p[1], YEARS[yi], t.values[yi], t, group);
      s += '</g>';
    });
  });
  s += '<text class="axis-title" x="'+cx.toFixed(1)+'" y="20" text-anchor="middle">轴: 年份 · 半径: '+esc(group.unit)+'</text>';
  s += '</svg>';
  return s;
}

/* 事件标注 (竖虚线 + 标签) */
function renderEvents(group, idxs, xFor, yFor, b){
  var s = "", placed = {};
  group.events.forEach(function(ev){
    var yi = YEARS.indexOf(ev.y);
    if (yi < 0 || idxs.indexOf(yi) < 0) return;
    var t = group.techs.find(function(x){ return x.name === ev.t; });
    if (!t) return;
    var h = state.hidden[group.id] || [];
    if (h.indexOf(t.name) >= 0) return;
    var i = idxs.indexOf(yi);
    var x = xFor(i);
    var yTop = CHART.pad.t;
    var v = t.values[yi];
    var y = yFor(v);
    s += '<line class="event-line" x1="'+x.toFixed(1)+'" y1="'+yTop.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+(CHART.h-CHART.pad.b).toFixed(1)+'"/>';
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="none" stroke="'+t.color+'" stroke-width="1.6"/>';
    // 标签放置: 错开避免重叠
    var slot = placed[x.toFixed(0)] || 0;
    placed[x.toFixed(0)] = slot+1;
    var ly = yTop + 6 + slot*13;
    var labelW = ev.label.length*6.2 + 8;
    var lx = x - labelW/2;
    if (lx < CHART.pad.l) lx = CHART.pad.l;
    if (lx + labelW > CHART.w - CHART.pad.r) lx = CHART.w - CHART.pad.r - labelW;
    s += '<rect class="event-tag" x="'+lx.toFixed(1)+'" y="'+(ly-9).toFixed(1)+'" width="'+labelW.toFixed(1)+'" height="12" rx="3" fill="'+CSS_VAR_BG2+'" stroke="'+t.color+'" stroke-opacity="0.4"/>';
    s += '<text class="event-label" x="'+(lx+4).toFixed(1)+'" y="'+(ly).toFixed(1)+'" fill="'+t.color+'">'+esc(ev.label)+'</text>';
  });
  return s;
}

/* 悬浮提示 markup (纯 CSS hover, 无 JS 事件) */
function tipMarkup(x, y, year, v, t, group){
  var val = fmt(v, group.unit);
  var txt = year + " · " + t.name + " " + val;
  var tw = txt.length*6.1 + 14;
  var tx = x - tw/2;
  if (tx < 4) tx = 4;
  if (tx + tw > CHART.w-4) tx = CHART.w-4-tw;
  var ty = y - 34;
  if (ty < 4) ty = y + 12;
  return '<g class="pt-tip" transform="translate(0,0)">'+
    '<rect x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" width="'+tw.toFixed(1)+'" height="20" rx="4" fill="'+CSS_VAR_BG2+'" stroke="'+CSS_VAR_BORDER2+'" stroke-width="1"/>'+
    '<text x="'+(tx+tw/2).toFixed(1)+'" y="'+(ty+13).toFixed(1)+'" text-anchor="middle" fill="'+CSS_VAR_INK+'" font-size="10.5" font-family="'+CSS_MONO+'">'+esc(txt)+'</text>'+
    '</g>';
}

/* ---------- CSS 变量值 (供 SVG 内联使用) ---------- */
var CSS_VAR_BG = "#08090a";
var CSS_VAR_BG2 = "#101114";
var CSS_VAR_BORDER2 = "#272a31";
var CSS_VAR_INK = "#e8e8ec";
var CSS_MONO = "ui-monospace, monospace";

/* ============================================================
   视图渲染
   ============================================================ */
function render(){
  renderTabs();
  renderTools();
  var view = document.getElementById("view");
  if (state.active === "overview"){
    view.innerHTML = dashboardHTML();
    renderDashboardCharts();
  } else {
    var g = GROUPS.find(function(x){ return x.id === state.active; });
    view.innerHTML = detailHTML(g);
    renderDetailChart(g);
  }
}

/* Tabs */
function renderTabs(){
  var tabs = document.getElementById("tabs");
  var items = [{ id:"overview", name:"概览", cat:"Dashboard" }];
  GROUPS.forEach(function(g){ items.push({ id:g.id, name:g.techs.map(function(t){return t.name;}).join(" / "), cat:g.category }); });
  var html = "";
  items.forEach(function(it){
    var on = it.id === state.active ? " on" : "";
    html += '<button class="tab'+on+'" data-tab="'+it.id+'"><span class="dot"></span>'+esc(it.name)+'</button>';
  });
  tabs.innerHTML = html;
}

/* Header tools 视图状态同步 */
function renderTools(){
  var rs = document.getElementById("rangeSeg"), cs = document.getElementById("chartSeg");
  Array.prototype.forEach.call(rs.querySelectorAll("button"), function(b){
    b.classList.toggle("on", b.dataset.range === state.range);
  });
  Array.prototype.forEach.call(cs.querySelectorAll("button"), function(b){
    b.classList.toggle("on", b.dataset.chart === state.chart);
  });
  // 概览页隐藏范围/图表切换
  var detail = state.active !== "overview";
  rs.style.opacity = detail ? "1" : "0.4";
  cs.style.opacity = detail ? "1" : "0.4";
  rs.style.pointerEvents = detail ? "auto" : "none";
  cs.style.pointerEvents = detail ? "auto" : "none";
}

/* ---------- 仪表盘 ---------- */
function dashboardHTML(){
  var techCount = ALL_TECHS.length;
  var dataPoints = ALL_TECHS.length * YEARS.length;
  var span = (YEARS[YEARS.length-1] - YEARS[0] + 1);

  var topGrow = ALL_TECHS.slice().sort(function(a,b){ return b.absGrowth - a.absGrowth; }).slice(0,10);
  var topDecline = ALL_TECHS.slice().filter(function(t){ return t.absGrowth < 0; })
                      .sort(function(a,b){ return a.absGrowth - b.absGrowth; }).slice(0,5);
  var maxAbs = Math.max.apply(null, topGrow.map(function(t){ return Math.abs(t.absGrowth); }));
  var minAbs = topDecline.length ? Math.max.apply(null, topDecline.map(function(t){ return Math.abs(t.absGrowth); })) : 1;

  var html = '';
  // 总览统计
  html += '<div class="ov-stats">';
  html += ovStat("追踪技术", techCount, "项", "12 组对比 / 3 选 1");
  html += ovStat("数据点", dataPoints, "个", "每年 1 个采样");
  html += ovStat("时间跨度", span, "年", YEARS[0]+"–"+YEARS[YEARS.length-1]);
  html += ovStat("增长最强", "+"+topGrow[0].absGrowth, "", topGrow[0].name);
  html += '</div>';

  html += '<div class="dash-grid">';
  // Top 10 增长
  html += '<div class="card"><div class="card-h"><h3>最快增长技术 Top 10</h3><span class="sub">绝对增长 · '+rangeLabel(state.range)+'数据基线为全程</span></div><div class="rank-list">';
  topGrow.forEach(function(t, i){
    var w = maxAbs ? Math.abs(t.absGrowth)/maxAbs*100 : 0;
    html += '<div class="rank-row'+(i<3?' top3':'')+'">';
    html += '<div class="rank-n">'+(i+1)+'</div>';
    html += '<div class="rank-name"><span class="sw" style="background:'+t.color+'"></span><b>'+esc(t.name)+'</b><span class="cat">'+esc(t.group.category)+'</span></div>';
    html += '<div><div class="rank-val up">+'+t.absGrowth+'</div><div class="rank-bar"><i style="width:'+w.toFixed(1)+'%"></i></div></div>';
    html += '</div>';
  });
  html += '</div></div>';

  // 右侧: 衰退 + 象限
  html += '<div style="display:flex;flex-direction:column;gap:16px">';
  html += '<div class="card"><div class="card-h"><h3>衰退中的技术 Top 5</h3><span class="sub">负增长最大</span></div><div class="rank-list">';
  if (topDecline.length === 0){
    html += '<div style="padding:12px 4px;color:var(--dim);font-size:12px">暂无显著衰退项</div>';
  }
  topDecline.forEach(function(t, i){
    var w = minAbs ? Math.abs(t.absGrowth)/minAbs*100 : 0;
    html += '<div class="rank-row">';
    html += '<div class="rank-n">'+(i+1)+'</div>';
    html += '<div class="rank-name"><span class="sw" style="background:'+t.color+'"></span><b>'+esc(t.name)+'</b><span class="cat">'+esc(t.group.category)+'</span></div>';
    html += '<div><div class="rank-val dn">'+t.absGrowth+'</div><div class="rank-bar"><i class="dn" style="width:'+w.toFixed(1)+'%"></i></div></div>';
    html += '</div>';
  });
  html += '</div></div>';
  html += '</div>';
  html += '</div>';

  // 象限图
  html += '<div class="card quad-wrap"><div class="card-h"><h3>技术生命周期象限图</h3><span class="sub">横轴: 成熟度(组内归一) · 纵轴: 增长动力</span></div>';
  html += '<div class="chart-box" id="quadBox"></div>';
  html += '<div class="quad-legend">';
  html += '<span><i style="background:var(--green)"></i>新兴崛起</span>';
  html += '<span><i style="background:var(--accent)"></i>领导者</span>';
  html += '<span><i style="background:var(--purple)"></i>成熟停滞</span>';
  html += '<span><i style="background:var(--red)"></i>萎缩退潮</span>';
  html += '</div></div>';

  return html;
}

function ovStat(k, v, unit, d){
  return '<div class="ov-stat"><div class="k">'+esc(k)+'</div><div class="v">'+v+(unit?'<small>'+esc(unit)+'</small>':'')+'</div><div class="d">'+esc(d)+'</div></div>';
}

function renderDashboardCharts(){
  var box = document.getElementById("quadBox");
  if (box) box.innerHTML = renderQuadrant();
}

/* 象限图 */
function renderQuadrant(){
  var W = 900, H = 440, pad = { t: 30, r: 30, b: 50, l: 56 };
  var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  // x: maturity 0..100, y: absGrowth, 中心 x=50, y=0
  var growVals = ALL_TECHS.map(function(t){ return t.absGrowth; });
  var yMin = Math.min.apply(null, growVals), yMax = Math.max.apply(null, growVals);
  var yPad = (yMax - yMin) * 0.12 || 8;
  yMin = Math.min(yMin - yPad, 0); yMax = yMax + yPad;
  var xFor = function(m){ return pad.l + m/100*pw; };
  var yFor = function(g){ return pad.t + (1-(g-yMin)/(yMax-yMin||1))*ph; };
  var s = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="技术生命周期象限图">';
  // 背景区分四象限
  var cx = xFor(50), cy = yFor(0);
  s += '<rect x="'+pad.l+'" y="'+pad.t+'" width="'+(cx-pad.l).toFixed(1)+'" height="'+(cy-pad.t).toFixed(1)+'" fill="rgba(34,197,94,0.05)"/>'; // 左上 新兴
  s += '<rect x="'+cx.toFixed(1)+'" y="'+pad.t+'" width="'+(pad.l+pw-cx).toFixed(1)+'" height="'+(cy-pad.t).toFixed(1)+'" fill="rgba(249,115,22,0.06)"/>'; // 右上 领导者
  s += '<rect x="'+pad.l+'" y="'+cy.toFixed(1)+'" width="'+(cx-pad.l).toFixed(1)+'" height="'+(pad.t+ph-cy).toFixed(1)+'" fill="rgba(239,68,68,0.05)"/>'; // 左下 萎缩
  s += '<rect x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+(pad.l+pw-cx).toFixed(1)+'" height="'+(pad.t+ph-cy).toFixed(1)+'" fill="rgba(167,139,250,0.05)"/>'; // 右下 成熟停滞
  // 轴线
  s += '<line class="grid-line zero" x1="'+pad.l+'" y1="'+cy.toFixed(1)+'" x2="'+(pad.l+pw)+'" y2="'+cy.toFixed(1)+'"/>';
  s += '<line class="grid-line zero" x1="'+cx.toFixed(1)+'" y1="'+pad.t+'" x2="'+cx.toFixed(1)+'" y2="'+(pad.t+ph)+'"/>';
  // 刻度
  for (var i=0;i<=4;i++){
    var mv = i*25, mx = xFor(mv);
    s += '<text class="axis-text x" x="'+mx.toFixed(1)+'" y="'+(H-pad.b+16)+'">'+mv+'</text>';
    var gv = yMin + (yMax-yMin)*i/4, gy = yFor(gv);
    s += '<line class="grid-line" x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(pad.l+pw)+'" y2="'+gy.toFixed(1)+'" opacity="0.5"/>';
    s += '<text class="axis-text y" x="'+(pad.l-8)+'" y="'+(gy+3).toFixed(1)+'">'+(gv>0?'+':'')+Math.round(gv)+'</text>';
  }
  s += '<text class="axis-title" x="'+(pad.l+pw/2)+'" y="'+(H-8)+'" text-anchor="middle">成熟度 (组内归一 %)</text>';
  s += '<text class="axis-title" x="16" y="'+(pad.t+ph/2)+'" text-anchor="middle" transform="rotate(-90 16 '+(pad.t+ph/2)+')">增长动力 (Δ)</text>';
  // 象限标签
  s += '<text x="'+(pad.l+10)+'" y="'+(pad.t+18)+'" fill="#22c55e" font-size="11" font-family="'+CSS_MONO+'" opacity="0.85">新兴崛起</text>';
  s += '<text x="'+(pad.l+pw-10)+'" y="'+(pad.t+18)+'" text-anchor="end" fill="#f97316" font-size="11" font-family="'+CSS_MONO+'" opacity="0.9">领导者</text>';
  s += '<text x="'+(pad.l+10)+'" y="'+(pad.t+ph-8)+'" fill="#ef4444" font-size="11" font-family="'+CSS_MONO+'" opacity="0.85">萎缩退潮</text>';
  s += '<text x="'+(pad.l+pw-10)+'" y="'+(pad.t+ph-8)+'" text-anchor="end" fill="#a78bfa" font-size="11" font-family="'+CSS_MONO+'" opacity="0.85">成熟停滞</text>';
  // 点
  ALL_TECHS.forEach(function(t){
    var x = xFor(t.maturity), y = yFor(t.absGrowth);
    var realCol = t.absGrowth > 0 ? (t.maturity >= 50 ? "#f97316" : "#22c55e") : (t.maturity >= 50 ? "#a78bfa" : "#ef4444");
    s += '<g class="pt"><circle class="pt-hit" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="14"/>';
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.5" fill="'+realCol+'" stroke="'+CSS_VAR_BG+'" stroke-width="1.5" class="pt-dot"/>';
    s += '<g class="pt-tip"><rect x="'+(x-44).toFixed(1)+'" y="'+(y-30).toFixed(1)+'" width="88" height="18" rx="4" fill="'+CSS_VAR_BG2+'" stroke="'+CSS_VAR_BORDER2+'"/>';
    s += '<text x="'+x.toFixed(1)+'" y="'+(y-17).toFixed(1)+'" text-anchor="middle" fill="'+CSS_VAR_INK+'" font-size="10" font-family="'+CSS_MONO+'">'+esc(t.name)+' '+(t.absGrowth>0?'+':'')+t.absGrowth+'</text></g>';
    s += '</g>';
    s += '<text x="'+(x+8).toFixed(1)+'" y="'+(y+3).toFixed(1)+'" fill="'+realCol+'" font-size="10" opacity="0.7">'+esc(t.name)+'</text>';
  });
  s += '</svg>';
  return s;
}

/* ---------- 详情视图 ---------- */
function detailHTML(g){
  var html = '<div class="detail">';
  // 左: 图表
  html += '<div class="card chart-card">';
  html += '<div class="chart-title"><h2>'+esc(g.title)+'</h2><span class="cat">'+esc(g.category)+'</span></div>';
  html += '<div class="chart-desc">'+esc(g.desc)+'</div>';
  // legend
  html += '<div class="legend" id="legend">';
  var hidden = state.hidden[g.id] || [];
  g.techs.forEach(function(t){
    var off = hidden.indexOf(t.name) >= 0 ? " off" : "";
    html += '<button class="leg'+off+'" data-tech="'+esc(t.name)+'"><span class="sw" style="background:'+t.color+'"></span>'+esc(t.name)+'<span class="lv">'+fmt(t.cur, g.unit)+'</span></button>';
  });
  html += '</div>';
  html += '<div class="chart-box" id="chartBox"></div>';
  html += '</div>';
  // 右: 统计
  html += '<div class="stats-side" id="statsSide"></div>';
  html += '</div>';
  // 底部表格
  html += comparisonTableHTML();
  return html;
}

function renderDetailChart(g){
  var box = document.getElementById("chartBox");
  if (!box) return;
  var svg;
  if (state.chart === "area") svg = renderArea(g);
  else if (state.chart === "bar") svg = renderBar(g);
  else if (state.chart === "radar") svg = renderRadar(g);
  else svg = renderLine(g);
  box.innerHTML = svg;
  // 统计面板
  var side = document.getElementById("statsSide");
  if (side) side.innerHTML = statsSideHTML(g);
}

function statsSideHTML(g){
  var html = '';
  g.techs.forEach(function(t){
    var lead = t.rank === 1 ? " lead" : "";
    var gcls = t.absGrowth > 0 ? "up" : (t.absGrowth < 0 ? "dn" : "");
    html += '<div class="stat-tech'+lead+'" style="border-left-color:'+t.color+'">';
    html += '<div class="stat-tech-h"><div class="nm"><span class="sw" style="background:'+t.color+'"></span>'+esc(t.name)+'</div>';
    html += '<div class="rank">排名 <b>#'+t.rank+'</b>/3</div></div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-cell"><div class="k">当前'+esc(g.unit)+'</div><div class="v">'+fmt(t.cur, g.unit)+'</div></div>';
    html += '<div class="stat-cell"><div class="k">峰值'+esc(g.unit)+'</div><div class="v">'+fmt(t.peak, g.unit)+'<small> @ '+t.peakYear+'</small></div></div>';
    html += '<div class="stat-cell"><div class="k">绝对增长</div><div class="v '+gcls+'">'+(t.absGrowth>0?'+':'')+t.absGrowth+'</div></div>';
    html += '<div class="stat-cell"><div class="k">区间涨幅</div><div class="v '+gcls+'">'+(t.pctGrowth>=999?'∞':(t.pctGrowth>0?'+':'')+Math.round(t.pctGrowth)+'%')+'</div></div>';
    html += '</div>';
    html += '<div class="mini-spark">'+sparkSVG(t.values, t.color)+'</div>';
    html += '</div>';
  });
  return html;
}

function sparkSVG(values, color){
  var W = 260, H = 30, n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if (max === min){ max = min+1; }
  var d = "";
  values.forEach(function(v, i){
    var x = i*(W/(n-1)), y = H - (v-min)/(max-min)*H;
    d += (i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1)+" ";
  });
  var area = d + 'L'+W+' '+H+' L0 '+H+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+area.trim()+'" fill="'+color+'" opacity="0.16"/><path d="'+d.trim()+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round"/></svg>';
}

/* ---------- 对比表格 ---------- */
function comparisonTableHTML(){
  var html = '<div class="card" style="margin-top:16px"><div class="card-h"><h3>技术对比明细</h3><span class="sub">全 12 组 · 36 项技术 · 点击表头列所在组可跳转</span></div>';
  html += '<div class="table-wrap"><table class="cmp"><thead><tr>';
  html += '<th>技术</th><th>类别</th><th class="num">当前</th><th class="num">峰值</th><th class="num">峰值年</th><th class="num">增长</th><th class="num">涨幅</th><th class="num">排名</th><th>趋势</th>';
  html += '</tr></thead><tbody>';
  GROUPS.forEach(function(g){
    html += '<tr class="grp"><td colspan="9">'+esc(g.category)+' · '+esc(g.title)+'</td></tr>';
    g.techs.forEach(function(t){
      var gcls = t.absGrowth > 0 ? "up" : (t.absGrowth < 0 ? "dn" : "");
      var pcls = t.pctGrowth > 0 ? "up" : (t.pctGrowth < 0 ? "dn" : "");
      var pct = t.pctGrowth>=999 ? '∞' : (t.pctGrowth>0?'+':'')+Math.round(t.pctGrowth)+'%';
      html += '<tr data-group="'+g.id+'">';
      html += '<td><span class="nm"><span class="sw" style="background:'+t.color+'"></span>'+esc(t.name)+'</span></td>';
      html += '<td style="color:var(--muted)">'+esc(g.category)+'</td>';
      html += '<td class="num">'+fmt(t.cur, g.unit)+'</td>';
      html += '<td class="num">'+fmt(t.peak, g.unit)+'</td>';
      html += '<td class="num">'+t.peakYear+'</td>';
      html += '<td class="num '+gcls+'">'+(t.absGrowth>0?'+':'')+t.absGrowth+'</td>';
      html += '<td class="num '+pcls+'">'+pct+'</td>';
      html += '<td class="num">#'+t.rank+'</td>';
      html += '<td class="spark">'+sparkSVG(t.values, t.color)+'</td>';
      html += '</tr>';
    });
  });
  html += '</tbody></table></div></div>';
  return html;
}

/* ============================================================
   事件绑定 (仅 click, 无 mousemove)
   ============================================================ */
function bindEvents(){
  // tabs
  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest(".tab"); if (!b) return;
    state.active = b.dataset.tab; saveState(); render();
  });
  // range
  document.getElementById("rangeSeg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b || !b.dataset.range) return;
    state.range = b.dataset.range; saveState(); render();
  });
  // chart type
  document.getElementById("chartSeg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b || !b.dataset.chart) return;
    state.chart = b.dataset.chart; saveState(); render();
  });
  // legend toggle & table row jump (事件委托)
  document.getElementById("view").addEventListener("click", function(e){
    var leg = e.target.closest(".leg");
    if (leg){
      var name = leg.dataset.tech;
      var g = GROUPS.find(function(x){ return x.id === state.active; });
      if (!g) return;
      var h = state.hidden[g.id] || [];
      var idx = h.indexOf(name);
      if (idx >= 0) h.splice(idx,1); else h.push(name);
      state.hidden[g.id] = h; saveState();
      renderDetailChart(g);
      // 更新 legend 状态
      var hidden = state.hidden[g.id] || [];
      Array.prototype.forEach.call(document.querySelectorAll("#legend .leg"), function(el){
        el.classList.toggle("off", hidden.indexOf(el.dataset.tech) >= 0);
      });
      return;
    }
    var row = e.target.closest("tr[data-group]");
    if (row){
      state.active = row.dataset.group; saveState(); render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
  // 键盘左右切换组
  document.addEventListener("keydown", function(e){
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    var ids = ["overview"].concat(GROUPS.map(function(g){ return g.id; }));
    var idx = ids.indexOf(state.active);
    if (e.key === "ArrowRight"){ idx = (idx+1)%ids.length; state.active = ids[idx]; saveState(); render(); }
    else if (e.key === "ArrowLeft"){ idx = (idx-1+ids.length)%ids.length; state.active = ids[idx]; saveState(); render(); }
  });
}

/* ============================================================
   启动
   ============================================================ */
loadState();
bindEvents();
render();
</script>
