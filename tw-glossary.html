.modal-body .m-def{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.modal-body .m-section{margin-bottom:16px}
.modal-body .m-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

.modal-body .m-link:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,92,255,.3)}

.modal-close:hover{color:var(--text);background:var(--border)}
footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);color:var(--text3);font-size:12px}
footer a{color:var(--text2);text-decoration:none}footer a:hover{color:var(--accent)}
@media(max-width:768px){header{padding:0 12px;height:48px}header nav{display:none}.hero{padding:32px 16px 16px}.hero h1{font-size:28px}.glossary-grid{grid-template-columns:1fr;padding:0 12px 24px}.controls{padding:0 12px 12px}}

function renderGrid(){
