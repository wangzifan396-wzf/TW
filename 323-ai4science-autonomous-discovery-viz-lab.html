<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI4Science 自主科学发现可视化实验室</title>
<style>
:root {
  --bg: #0a0b0f;
  --bg-2: #10131a;
  --bg-3: #141821;
  --bg-4: #1a1f2b;
  --border: #232a3a;
  --border-2: #2e3850;
  --teal: #00d4aa;
  --teal-dim: #00a886;
  --teal-bright: #3df0c8;
  --teal-soft: rgba(0,212,170,0.10);
  --teal-glow: rgba(0,212,170,0.35);
  --text: #e6edf3;
  --dim: #8b949e;
  --faint: #545d6b;
  --accent: #58a6ff;
  --warn: #ffd166;
  --danger: #f85149;
  --purple: #a78bfa;
  --rose: #fb7185;
  --mono: 'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
.app-header {
  position: sticky; top: 0; z-index: 100;
  height: 48px;
  background: rgba(10,11,15,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.app-header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); white-space: nowrap; }
.app-header h1 .ac { color: var(--teal); }
.app-header h1 .id { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 10px; }
.header-meta { display: flex; gap: 8px; font-size: 11px; color: var(--dim); font-family: var(--mono); }
.header-meta .pill { padding: 3px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-2); }
.header-meta .pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); margin-right: 5px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.app-nav {
  position: sticky; top: 48px; z-index: 99;
  background: rgba(16,19,26,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex; gap: 6px; overflow-x: auto;
}
.nav-btn {
  flex-shrink: 0; padding: 7px 14px;
  border: 1px solid var(--border); background: var(--bg-2); color: var(--dim);
  border-radius: 7px; cursor: pointer; white-space: nowrap;
  font-size: 12px; font-weight: 500; font-family: var(--sans);
  transition: all 0.18s;
}
.nav-btn:hover { border-color: var(--teal-dim); color: var(--teal); background: var(--bg-3); }
.nav-btn.active { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); box-shadow: 0 0 10px rgba(0,212,170,0.15); }
.nav-btn .num { font-family: var(--mono); font-size: 10px; opacity: 0.6; margin-right: 4px; }
.app-main { max-width: 1180px; margin: 0 auto; padding: 20px; }
.module-shell { animation: modIn 0.4s ease-out; }
@keyframes modIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
.mod-header { margin-bottom: 14px; }
.mod-header h2 { font-size: 20px; font-weight: 650; color: var(--text); letter-spacing: -0.01em; margin-bottom: 4px; }
.mod-tag { display: inline-block; font-family: var(--mono); font-size: 13px; padding: 2px 8px; background: var(--teal-soft); color: var(--teal); border: 1px solid var(--teal-dim); border-radius: 5px; margin-right: 8px; }
.mod-desc { color: var(--dim); font-size: 13px; max-width: 760px; }
.mod-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.view-btn { padding: 6px 13px; border: 1px solid var(--border); background: var(--bg-2); color: var(--dim); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; font-family: var(--sans); transition: all 0.16s; }
.view-btn:hover { border-color: var(--teal-dim); color: var(--teal); background: var(--bg-3); }
.view-btn.active { border-color: var(--teal); color: var(--bg); background: var(--teal); font-weight: 600; }
.action-btn { padding: 6px 13px; border: 1px solid var(--teal-dim); background: transparent; color: var(--teal); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; font-family: var(--sans); transition: all 0.16s; margin-left: 6px; }
.action-btn:hover { background: var(--teal-soft); box-shadow: 0 0 8px rgba(0,212,170,0.2); }
.svg-wrap { background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow: hidden; position: relative; }
.svg-wrap .badge { position: absolute; top: 14px; left: 14px; font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.08em; z-index: 2; text-transform: uppercase; }
.mod-svg { display: block; width: 100%; height: auto; }
.mod-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 10px; margin-top: 12px; }
.stat-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; transition: border-color 0.2s; }
.stat-card:hover { border-color: var(--teal-dim); }
.stat-label { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; font-family: var(--mono); }
.stat-value { font-size: 19px; font-weight: 700; color: var(--teal); }
.mod-svg text { font-family: var(--sans); }
.app-footer { text-align: center; padding: 20px; color: var(--faint); font-size: 11px; font-family: var(--mono); border-top: 1px solid var(--border); margin-top: 30px; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--teal-dim); }
@media (max-width: 760px) {
  .app-header h1 { font-size: 13px; }
  .header-meta { display: none; }
  .app-nav { top: 44px; padding: 6px 12px; }
  .app-main { padding: 14px; }
}
</style>
</head>
<body>
<header class="app-header">
  <h1>AI4Science <span class="ac">自主科学发现</span> 可视化实验室<span class="id">VIZ-LAB / 323</span></h1>
  <div class="header-meta">
    <span class="pill"><span class="dot"></span>LIVE</span>
    <span class="pill">8 MODULES</span>
    <span class="pill">ZERO-DEP</span>
  </div>
</header>
<nav class="app-nav" id="nav"></nav>
<main class="app-main">
  <div id="module-content"></div>
</main>
<footer class="app-footer">AI4Science Autonomous Discovery Visualization Lab / Pure HTML+CSS+JS+SVG / No External Dependencies</footer>
<script>
/* ===== UTILITY FUNCTIONS (specified pattern) ===== */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ===== COLOR CONSTANTS ===== */
var C = {
  bg:'#0a0b0f', bg2:'#10131a', bg3:'#141821', bg4:'#1a1f2b',
  border:'#232a3a', border2:'#2e3850',
  teal:'#00d4aa', tealDim:'#00a886', tealBr:'#3df0c8', tealSoft:'rgba(0,212,170,0.10)',
  text:'#e6edf3', dim:'#8b949e', faint:'#545d6b',
  accent:'#58a6ff', warn:'#ffd166', danger:'#f85149', purple:'#a78bfa', rose:'#fb7185'
};

/* ===== SVG HELPERS ===== */
function sRect(x,y,w,h,p,o){var a={x:x,y:y,width:w,height:h};if(o){for(var k in o){if(o.hasOwnProperty(k))a[k]=o[k];}}return el('rect',a,p);}
function sCirc(cx,cy,r,p,o){var a={cx:cx,cy:cy,r:r};if(o){for(var k in o){if(o.hasOwnProperty(k))a[k]=o[k];}}return el('circle',a,p);}
function sLine(x1,y1,x2,y2,p,o){var a={x1:x1,y1:y1,x2:x2,y2:y2};if(o){for(var k in o){if(o.hasOwnProperty(k))a[k]=o[k];}}return el('line',a,p);}
function sPath(d,p,o){var a={d:d};if(o){for(var k in o){if(o.hasOwnProperty(k))a[k]=o[k];}}return el('path',a,p);}
function sPoly(pts,p,o){var a={points:pts};if(o){for(var k in o){if(o.hasOwnProperty(k))a[k]=o[k];}}return el('polygon',a,p);}
function sText(x,y,str,p,o){return tspanEl(x,y,str,p,o);}
function sGroup(p,o){var a={};if(o){for(var k in o){if(o.hasOwnProperty(k))a[k]=o[k];}}return el('g',a,p);}

function gridBg(svg,w,h){
  sRect(0,0,w,h,svg,{fill:C.bg2});
  for(var x=30;x<w;x+=30){sLine(x,0,x,h,svg,{stroke:C.border,'stroke-width':0.5,opacity:0.2});}
  for(var y=30;y<h;y+=30){sLine(0,y,w,y,svg,{stroke:C.border,'stroke-width':0.5,opacity:0.2});}
}

function addDefs(svg){
  var defs=el('defs',{},svg);
  var f=el('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
  el('feGaussianBlur',{stdDeviation:'2.5',result:'blur'},f);
  var fm=el('feMerge',{},f);
  el('feMergeNode',{in:'blur'},fm);
  el('feMergeNode',{in:'SourceGraphic'},fm);
  var mk=function(id,col){var m=el('marker',{id:id,markerWidth:'8',markerHeight:'8',refX:'7',refY:'4',orient:'auto'},defs);el('path',{d:'M0,0 L8,4 L0,8 Z',fill:col},m);};
  mk('arr',C.teal);mk('arrd',C.dim);mk('arrw',C.warn);mk('arrp',C.purple);
  var g=el('linearGradient',{id:'grad',x1:'0%',y1:'0%',x2:'0%',y2:'100%'},defs);
  el('stop',{offset:'0%','stop-color':C.teal,'stop-opacity':'0.25'},g);
  el('stop',{offset:'100%','stop-color':C.teal,'stop-opacity':'0.02'},g);
  var rg=el('radialGradient',{id:'rgrad',cx:'50%',cy:'50%',r:'50%'},defs);
  el('stop',{offset:'0%','stop-color':C.teal,'stop-opacity':'0.3'},rg);
  el('stop',{offset:'100%','stop-color':C.teal,'stop-opacity':'0'},rg);
}

function boxLabel(x,y,w,h,label,p,o){
  var fill=(o&&o.fill)||C.bg3,stroke=(o&&o.stroke)||C.teal,tc=(o&&o.tc)||C.text,fs=(o&&o.fs)||12,rx=(o&&o.rx)||7;
  sRect(x,y,w,h,p,{rx:rx,ry:rx,fill:fill,stroke:stroke,'stroke-width':1.4});
  sText(x+w/2,y+h/2+fs*0.35,label,p,{'text-anchor':'middle',fill:tc,'font-size':fs,'font-weight':500});
}
function arrow(x1,y1,x2,y2,p,o){
  var s=(o&&o.stroke)||C.teal,w=(o&&o.width)||1.6,m=(o&&o.marker)||'arr';
  sLine(x1,y1,x2,y2,p,{stroke:s,'stroke-width':w,'marker-end':'url(#'+m+')'});
}
function dashL(x1,y1,x2,y2,p,o){var s=(o&&o.stroke)||C.faint;sLine(x1,y1,x2,y2,p,{stroke:s,'stroke-width':1.2,'stroke-dasharray':'4 3'});}

/* ===== ANIMATION MANAGEMENT ===== */
var animTimers=[];
function stopAnims(){for(var i=0;i<animTimers.length;i++){clearInterval(animTimers[i]);}animTimers=[];}
function addAnim(fn,ms){var id=setInterval(fn,ms||40);animTimers.push(id);return id;}

function flowParts(svg,x1,y1,x2,y2,count,color,speed){
  var parts=[];
  for(var i=0;i<count;i++){var p=sCirc(x1,y1,2.5,svg,{fill:color,opacity:0});parts.push({el:p,t:i/count});}
  addAnim(function(){
    for(var i=0;i<parts.length;i++){
      parts[i].t=(parts[i].t+speed)%1;
      var x=x1+(x2-x1)*parts[i].t,y=y1+(y2-y1)*parts[i].t;
      parts[i].el.setAttribute('cx',x);
      parts[i].el.setAttribute('cy',y);
      parts[i].el.setAttribute('opacity',0.8*Math.sin(parts[i].t*Math.PI));
    }
  });
  return parts;
}
function pulseRing(svg,cx,cy,r,color){
  var ring=sCirc(cx,cy,r,svg,{fill:'none',stroke:color,'stroke-width':2,opacity:0.6});
  var t=0;
  addAnim(function(){
    t=(t+0.025)%1;
    ring.setAttribute('r',r+t*35);
    ring.setAttribute('opacity',0.6*(1-t));
  });
}

/* ===== UI HELPERS ===== */
function makeViewButtons(mid,views,def){
  var ctrl=document.getElementById('ctrl-'+mid);
  for(var i=0;i<views.length;i++){
    (function(v){
      var btn=document.createElement('button');
      btn.className='view-btn'+(v.id===def?' active':'');
      btn.textContent=v.label;
      btn.onclick=function(){
        var btns=ctrl.querySelectorAll('.view-btn');
        for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');
        btn.classList.add('active');
        MODULES[mid-1].view(v.id);
      };
      ctrl.appendChild(btn);
    })(views[i]);
  }
}
function makeActionBtn(mid,label,onClick){
  var ctrl=document.getElementById('ctrl-'+mid);
  var btn=document.createElement('button');
  btn.className='action-btn';
  btn.textContent=label;
  btn.onclick=onClick;
  ctrl.appendChild(btn);
  return btn;
}
function makeStats(mid,stats){
  var st=document.getElementById('stats-'+mid);
  clearNode(st);
  for(var i=0;i<stats.length;i++){
    var card=document.createElement('div');
    card.className='stat-card';
    var lab=document.createElement('div');
    lab.className='stat-label';
    lab.textContent=stats[i].label;
    var val=document.createElement('div');
    val.className='stat-value';
    val.textContent=stats[i].value;
    card.appendChild(lab);
    card.appendChild(val);
    st.appendChild(card);
  }
}
function gaussPath(cx,by,peak,wid,p,o){
  var d='';
  for(var i=-3.5;i<=3.5;i+=0.15){
    var x=cx+i*wid,y=by-peak*Math.exp(-i*i/2);
    d+=(i===-3.5?'M ':' L ')+x.toFixed(1)+','+y.toFixed(1);
  }
  return sPath(d,p,o);
}

/* ===== MODULES ARRAY ===== */
var MODULES=[
  {id:1,name:'AI科研自动化全景',desc:'从文献调研到论文撰写，AI赋能科研全链路的自动化图谱',draw:m1Draw,view:m1View},
  {id:2,name:'假设生成与验证',desc:'AI生成科学假设，贝叶斯推理驱动的假设空间搜索与验证循环',draw:m2Draw,view:m2View},
  {id:3,name:'实验设计优化',desc:'AI优化实验参数，主动学习选择实验，DoE实验设计方法论',draw:m3Draw,view:m3View},
  {id:4,name:'文献挖掘与知识发现',desc:'大规模文献图谱构建，知识抽取与跨文献推理，发现隐藏关联',draw:m4Draw,view:m4View},
  {id:5,name:'跨学科推理',desc:'跨领域知识迁移，类比推理，学科交叉催生新发现',draw:m5Draw,view:m5View},
  {id:6,name:'AI科学家系统',desc:'AREX等自主研究智能体，科研Agent架构，自主实验闭环',draw:m6Draw,view:m6View},
  {id:7,name:'科学范式变革',desc:'从经验科学到AI驱动科学，第五范式下的科学方法演进',draw:m7Draw,view:m7View},
  {id:8,name:'未来实验室',desc:'自主实验室架构，AI+机器人+云实验，24/7不间断科研与伦理展望',draw:m8Draw,view:m8View}
];

/* ===== switchModule ===== */
var curMod=1;
function switchModule(id){
  stopAnims();
  curMod=id;
  var navBtns=document.querySelectorAll('.nav-btn');
  for(var i=0;i<navBtns.length;i++){
    if(parseInt(navBtns[i].dataset.mid)===id)navBtns[i].classList.add('active');
    else navBtns[i].classList.remove('active');
  }
  var m=MODULES[id-1];
  var content=document.getElementById('module-content');
  clearNode(content);
  var shell=document.createElement('div');
  shell.className='module-shell';
  var hdr=document.createElement('div');
  hdr.className='mod-header';
  var h2=document.createElement('h2');
  h2.innerHTML='<span class="mod-tag">M'+id+'</span>'+m.name;
  hdr.appendChild(h2);
  var p=document.createElement('p');
  p.className='mod-desc';
  p.textContent=m.desc;
  hdr.appendChild(p);
  shell.appendChild(hdr);
  var ctrl=document.createElement('div');
  ctrl.className='mod-controls';
  ctrl.id='ctrl-'+id;
  shell.appendChild(ctrl);
  var sw=document.createElement('div');
  sw.className='svg-wrap';
  var badge=document.createElement('span');
  badge.className='badge';
  badge.textContent='M'+id+' / VIEW';
  sw.appendChild(badge);
  var svgEl=el('svg',{viewBox:'0 0 900 500',preserveAspectRatio:'xMidYMid meet',class:'mod-svg'});
  svgEl.id='svg-'+id;
  sw.appendChild(svgEl);
  shell.appendChild(sw);
  var st=document.createElement('div');
  st.className='mod-stats';
  st.id='stats-'+id;
  shell.appendChild(st);
  content.appendChild(shell);
  m.draw();
}

/* ===== buildNav IIFE ===== */
(function buildNav(){
  var nav=document.getElementById('nav');
  for(var i=0;i<MODULES.length;i++){
    (function(m){
      var btn=document.createElement('button');
      btn.className='nav-btn';
      btn.dataset.mid=m.id;
      btn.innerHTML='<span class="num">M'+m.id+'</span>'+m.name;
      btn.onclick=function(){switchModule(m.id);};
      nav.appendChild(btn);
    })(MODULES[i]);
  }
})();

/* ===================================================================== */
/* M1: AI科研自动化全景 */
/* ===================================================================== */
var m1Stages=[
  {n:'文献调研',ai:85,d:'自动综述'},
  {n:'假设生成',ai:78,d:'AI推理'},
  {n:'实验设计',ai:92,d:'DoE优化'},
  {n:'实验执行',ai:45,d:'机器人'},
  {n:'数据分析',ai:88,d:'ML分析'},
  {n:'论文撰写',ai:70,d:'AI辅助'}
];
var m1State={view:'pipeline'};

function m1Draw(){
  m1State={view:'pipeline'};
  makeViewButtons(1,[{id:'pipeline',label:'流程图谱'},{id:'network',label:'网络视图'},{id:'stats',label:'统计视图'}],'pipeline');
  makeActionBtn(1,'▶ 运行流程',function(){m1View(m1State.view);});
  makeStats(1,[
    {label:'AI自动化率',value:'76%'},
    {label:'AI赋能阶段',value:'6/6'},
    {label:'效率提升',value:'340%'},
    {label:'科研周期',value:'3月→2周'}
  ]);
  m1View('pipeline');
}

function m1View(v){
  m1State.view=v;
  stopAnims();
  var svg=document.getElementById('svg-1');
  clearNode(svg);
  addDefs(svg);
  gridBg(svg,900,500);
  sText(30,32,'AI科研自动化全景 / Autonomous Research Pipeline',svg,{fill:C.teal,'font-size':15,'font-weight':'bold'});
  if(v==='pipeline')m1Pipeline(svg);
  else if(v==='network')m1Network(svg);
  else if(v==='stats')m1Stats(svg);
}

function m1Pipeline(svg){
  var sx=40,sw=120,sh=60,gap=24,sy=200;
  var cols=[C.teal,C.accent,C.warn,C.rose,C.purple,C.tealBr];
  for(var i=0;i<m1Stages.length;i++){
    var x=sx+i*(sw+gap);
    boxLabel(x,sy,sw,sh,m1Stages[i].n,svg,{stroke:cols[i],fill:C.bg3,fs:13});
    sText(x+sw/2,sy+sh+22,m1Stages[i].d,svg,{'text-anchor':'middle',fill:C.dim,'font-size':11});
    sCirc(x+sw/2,sy-28,16,svg,{fill:C.bg3,stroke:cols[i],'stroke-width':1.5});
    sText(x+sw/2,sy-24,m1Stages[i].ai+'%',svg,{'text-anchor':'middle',fill:cols[i],'font-size':10,'font-weight':'bold'});
    sText(x+sw/2,sy-48,'AI',svg,{'text-anchor':'middle',fill:C.faint,'font-size':9});
    if(i<m1Stages.length-1){
      var ax2=x+sw+gap;
      arrow(x+sw+2,sy+sh/2,ax2-2,sy+sh/2,svg,{stroke:cols[i],width:1.5});
      flowParts(svg,x+sw+4,sy+sh/2,ax2-4,sy+sh/2,3,cols[i],0.012);
    }

function m3Doe(svg){
  sText(450,65,'实验设计 / Design of Experiments',svg,{'text-anchor':'middle',fill:C.text,'font-size':15,'font-weight':'bold'});
  var cx=450,cy=280,s=80;
  var corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
  var pts3D=[];
  for(var i=0;i<corners.length;i++){
    var c=corners[i];
    var x3d=[c[0]*s,c[1]*s,0];
    var y3d=[c[0]*s,c[1]*s,s*1.2];
    pts3D.push([cx+x3d[0],cy+x3d[1]-x3d[2]*0.4]);
    pts3D.push([cx+y3d[0],cy+y3d[1]-y3d[2]*0.4]);
  }
  for(var i=0;i<4;i++){
    var b1=pts3D[i*2],b2=pts3D[((i+1)%4)*2];
    var t1=pts3D[i*2+1],t2=pts3D[((i+1)%4)*2+1];
    sLine(b1[0],b1[1],b2[0],b2[1],svg,{stroke:C.teal,'stroke-width':1.5,opacity:0.8});
    sLine(t1[0],t1[1],t2[0],t2[1],svg,{stroke:C.teal,'stroke-width':1.5,opacity:0.5});
    sLine(b1[0],b1[1],t1[0],t1[1],svg,{stroke:C.teal,'stroke-width':1.2,opacity:0.4,'stroke-dasharray':'3 2'});
  }
  for(var i=0;i<4;i++){
    var b=pts3D[i*2],t=pts3D[i*2+1];
    sCirc(b[0],b[1],6,svg,{fill:C.teal,stroke:C.text,'stroke-width':1});
    sCirc(t[0],t[1],6,svg,{fill:C.teal,stroke:C.text,'stroke-width':1});
    var mid=[(b[0]+t[0])/2,(b[1]+t[1])/2];
