<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW · 神经符号 AI 可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg-elev:#111317;--bg-elev-2:#16181d;--bg-elev-3:#1c1f26;
  --border:#1f2128;--border-strong:#2a2d36;
  --text:#e4e4e7;--text-dim:#8b8d96;--text-faint:#56575e;
  --accent:#d946ef;--accent-dim:#a21caf;--accent-soft:rgba(217,70,239,.12);--accent-glow:rgba(217,70,239,.35);
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--cyan:#06b6d4;
  --mono:'SF Mono',ui-monospace,'Cascadia Code','Fira Code',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,var(--accent-soft),transparent 60%);pointer-events:none;z-index:0}
nav{position:sticky;top:0;z-index:100;background:rgba(10,11,15,.85);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px}
nav .brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:-.01em}
nav .brand .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
nav .brand .sep{color:var(--text-faint)}
nav .back{margin-left:auto;font-size:12px;color:var(--text-dim);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:6px;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
nav .back:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-elev)}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px 24px 80px}
.hero{margin-bottom:32px}
.hero .eyebrow{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.hero h1{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
.hero p{color:var(--text-dim);font-size:14px;max-width:640px}
.hero .meta{display:flex;gap:16px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.hero .meta span{display:flex;align-items:center;gap:5px}
.hero .meta span::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent-dim)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:none;border:none;padding:8px 12px;cursor:pointer;border-radius:6px 6px 0 0;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;position:relative;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tab .num{color:var(--text-faint);margin-right:6px}
.tab.active .num{color:var(--accent-dim)}
.module{display:none;animation:fade .3s ease}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mod-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.mod-head h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.mod-head .idx{font-family:var(--mono);font-size:11px;color:var(--accent-dim)}
.mod-desc{color:var(--text-dim);font-size:13px;margin-bottom:20px;max-width:720px}
.canvas{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.canvas svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;font-family:var(--mono);font-size:10px;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-swatch{width:10px;height:10px;border-radius:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.btn{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--bg-elev);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
.btn:hover{color:var(--text);border-color:var(--border-strong)}
.btn.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.info-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:14px}
.info-card .k{font-family:var(--mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.info-card .v{font-size:13px;color:var(--text)}
.info-card .v code{font-family:var(--mono);color:var(--accent);font-size:12px}
.code-block{font-family:var(--mono);font-size:11px;line-height:1.7;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:8px;padding:14px;color:var(--text-dim);overflow-x:auto;margin-top:12px}
.code-block .kw{color:var(--accent)}.code-block .fn{color:var(--blue)}.code-block .str{color:var(--green)}.code-block .cmt{color:var(--text-faint)}
.svg-label{font-family:var(--mono);font-size:10px;fill:var(--text-dim)}
.svg-node{transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
.svg-edge{transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
.pulse{animation:pulse 2s ease-in-out 8s}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.flow-dash{stroke-dasharray:4 4;animation:dash 1.5s linear 8s}
@keyframes dash{to{stroke-dashoffset:-16}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flow-dash{stroke-dasharray:none}}
@media(max-width:640px){.hero h1{font-size:22px}.tabs{gap:4px}.tab{padding:6px 8px;font-size:10px}main{padding:24px 14px 60px}}
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="dot"></span>TW<span class="sep">/</span>神经符号 AI 可视化实验室</div>
  <a class="back" href="#">← 返回 TW Hub</a>
</nav>
<main>
  <div class="hero">
    <div class="eyebrow">Neuro-Symbolic AI · Lab 168</div>
    <h1>神经符号 AI 可视化实验室</h1>
    <p>探索神经网络感知能力与符号系统推理能力的深度融合，从可微逻辑编程到因果推理与符号回归，揭示第三代 AI 的构建基石。</p>
    <div class="meta"><span>8 个交互模块</span><span>SVG 矢量可视化</span><span>实时动画</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="modules"></div>
</main>
<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
const MODULES=[
  {id:0,title:"神经符号集成架构",desc:"神经网络负责感知与模式识别，符号系统负责推理与逻辑推断。两者通过绑定层交换张量与符号表示，实现互补。"},
  {id:1,title:"逻辑编程 + 神经网络",desc:"可微分逻辑编程将谓词的真值映射为连续概率，使逻辑规则可被梯度下降优化，实现端到端学习。"},
  {id:2,title:"知识图谱推理",desc:"在知识图谱上进行多跳推理，沿关系边遍历，结合注意力机制聚合邻居信息，推理出隐藏关系。"},
  {id:3,title:"因果推理模型",desc:"结构因果模型（SCM）用有向无环图刻画变量间的因果机制，do-calculus 在干预下计算反事实分布。"},
  {id:4,title:"概率逻辑编程",desc:"ProbLog 为逻辑子句赋予概率，通过枚举证明路径并求和计算查询概率，实现概率与逻辑的统一推理。"},
  {id:5,title:"归纳逻辑编程",desc:"从正例与负例中搜索假设空间，泛化出覆盖正例且排除负例的一阶逻辑规则，如 FOIL 算法。"},
  {id:6,title:"可微分编程",desc:"将程序表示为计算图，自动微分引擎沿反向链式传播梯度，JAX/PyTorch 让任意可计算函数可微。"},
  {id:7,title:"符号回归",desc:"在符号空间中搜索数学表达式，用遗传编程或强化学习从数据中发现闭式公式，兼顾精度与可解释性。"}
];
const ACC="#d946ef";
function buildTabs(){const c=document.getElementById("tabs");MODULES.forEach((m,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span>${m.title}`;b.onclick=()=>select(i);c.appendChild(b)})}
function buildModules(){const c=document.getElementById("modules");MODULES.forEach((m,i)=>{const d=document.createElement("section");d.className="module"+(i===0?" active":"");d.id="mod-"+i;d.innerHTML=`<div class="mod-head"><span class="idx">M${String(i+1).padStart(2,"0")}</span><h2>${m.title}</h2></div><p class="mod-desc">${m.desc}</p><div class="canvas" id="cv-${i}"></div>`;c.appendChild(d)});MODULES.forEach((m,i)=>render[i](i))}
let current=0;
function select(i){document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));document.querySelectorAll(".module").forEach((m,j)=>m.classList.toggle("active",j===i));current=i}
// ===== renderers =====
const render=[];
// M0 神经符号集成架构
render[0]=(i)=>{const c=document.getElementById("cv-"+i);c.innerHTML=`
<div class="legend"><div class="legend-item"><div class="legend-swatch" style="background:#3b82f6"></div>神经网络</div><div class="legend-item"><div class="legend-swatch" style="background:#d946ef"></div>符号推理</div><div class="legend-item"><div class="legend-swatch" style="background:#22c55e"></div>绑定层</div></div>
<svg viewBox="0 0 720 320" id="svg0">
<defs><marker id="ar0" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#56575e"/></marker></defs>
<text x="100" y="24" class="svg-label" text-anchor="middle">感知层 · 神经网络</text>
<text x="360" y="24" class="svg-label" text-anchor="middle">绑定层</text>
<text x="620" y="24" class="svg-label" text-anchor="middle">推理层 · 符号系统</text>
<g id="nn-layer"></g>
<g id="bind-layer"></g>
<g id="sym-layer"></g>
</svg>
<div class="info-grid" style="margin-top:14px">
<div class="info-card"><div class="k">输入</div><div class="v">图像 / 文本 / 传感器</div></div>
<div class="info-card"><div class="k">神经编码</div><div class="v"><code>z = f_θ(x)</code> 连续嵌入</div></div>
<div class="info-card"><div class="k">符号映射</div><div class="v"><code>sym = decode(z)</code></div></div>
<div class="info-card"><div class="k">推理输出</div><div class="v">逻辑推断结果</div></div>
</div>`;
const svg=c.querySelector("svg");const ns="http://www.w3.org/2000/svg";
const nnG=svg.querySelector("#nn-layer"),bG=svg.querySelector("#bind-layer"),sG=svg.querySelector("#sym-layer");
const layers=[[3,60],[4,60],[4,60]];let nx=50;
layers.forEach((l,li)=>{l[0]=4;const nodes=4;const xs=50+li*70;for(let n=0;n<nodes;n++){const cy=60+n*55;const c=document.createElementNS(ns,"circle");c.setAttribute("cx",xs);c.setAttribute("cy",cy);c.setAttribute("r",11);c.setAttribute("fill","#111317");c.setAttribute("stroke","#3b82f6");c.setAttribute("stroke-width",1.5);c.setAttribute("class","svg-node");nnG.appendChild(c)}});
for(let li=0;li<2;li++){const x1=50+li*70,x2=50+(li+1)*70;for(let a=0;a<4;a++)for(let b=0;b<4;b++){const l=document.createElementNS(ns,"line");l.setAttribute("x1",x1);l.setAttribute("y1",60+a*55);l.setAttribute("x2",x2);l.setAttribute("y2",60+b*55);l.setAttribute("stroke","#1f2128");l.setAttribute("stroke-width",.6);nnG.appendChild(l)}}
// binding
[200,260,320].forEach((x,bi)=>{for(let n=0;n<4;n++){const cy=60+n*55;const r=document.createElementNS(ns,"rect");r.setAttribute("x",x-9);r.setAttribute("y",cy-9);r.setAttribute("width",18);r.setAttribute("height",18);r.setAttribute("rx",3);r.setAttribute("fill","#0a0b0f");r.setAttribute("stroke","#22c55e");r.setAttribute("stroke-width",1.5);r.setAttribute("class","svg-node pulse");r.style.animationDelay=(bi*0.3+n*0.15)+"s";bG.appendChild(r)}});
// arrows
[140,200,320,470].forEach(x=>{const a=document.createElementNS(ns,"line");a.setAttribute("x1",x);a.setAttribute("y1",155);a.setAttribute("x2",x+40);a.setAttribute("y2",155);a.setAttribute("stroke","#56575e");a.setAttribute("stroke-width",1.2);a.setAttribute("marker-end","url(#ar0)");bG.appendChild(a)});
// symbol
const rules=[["∀x","Cat(x)→Mammal(x)"],["∃y","Owns(y,x)"],["∧","P∧Q→R"],["¬","¬A∨B"]];
rules.forEach((r,ri)=>{const x=500;const cy=50+ri*60;const g=document.createElementNS(ns,"g");const rect=document.createElementNS(ns,"rect");rect.setAttribute("x",x);rect.setAttribute("y",cy-16);rect.setAttribute("width",170);rect.setAttribute("height",32);rect.setAttribute("rx",5);rect.setAttribute("fill","#111317");rect.setAttribute("stroke","#d946ef");rect.setAttribute("stroke-width",1);g.appendChild(rect);const t1=document.createElementNS(ns,"text");t1.setAttribute("x",x+12);t1.setAttribute("y",cy+1);t1.setAttribute("class","svg-label");t1.setAttribute("fill","#d946ef");t1.textContent=r[0];g.appendChild(t1);const t2=document.createElementNS(ns,"text");t2.setAttribute("x",x+44);t2.setAttribute("y",cy+1);t2.setAttribute("class","svg-label");t2.textContent=r[1];g.appendChild(t2);sG.appendChild(g)});
// moving token
const tok=document.createElementNS(ns,"circle");tok.setAttribute("r",4);tok.setAttribute("fill","#22c55e");tok.setAttribute("opacity",.9);svg.appendChild(tok);
let t=0;
function anim0(){t+=0.012;const x=140+((Math.sin(t)*0.5+0.5)*(470-140));tok.setAttribute("cx",x);tok.setAttribute("cy",155+Math.sin(t*3)*6);requestAnimationFrame(anim0)}anim0();
};
// M1 可微逻辑编程
render[1]=(i)=>{const c=document.getElementById("cv-"+i);c.innerHTML=`
<div class="controls"><button class="btn active" data-mode="clause">规则视图</button><button class="btn" data-mode="grad">梯度视图</button></div>
<svg viewBox="0 0 720 300" id="svg1">
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset=".5" stop-color="#d946ef" stop-opacity=".8"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
<text x="60" y="30" class="svg-label">谓词真值 (可微)</text>
<text x="600" y="30" class="svg-label" text-anchor="middle">输出</text>
<g id="preds"></g>
<g id="rules1"></g>
<line x1="40" y1="250" x2="560" y2="250" stroke="#1f2128" stroke-width="1"/>
<text x="40" y="270" class="svg-label">0.0</text><text x="300" y="270" class="svg-label" text-anchor="middle">0.5</text><text x="560" y="270" class="svg-label" text-anchor="end">1.0</text>
<rect x="590" y="80" width="100" height="60" rx="6" fill="#111317" stroke="#d946ef" stroke-width="1.5"/>
<text x="640" y="105" class="svg-label" text-anchor="middle" fill="#d946ef">目标</text>
<text x="640" y="125" class="svg-label" text-anchor="middle" id="out1">0.00</text>
</svg>
<div class="code-block"><span class="cmt"># 可微逻辑：谓词真值为连续值</span>
<span class="kw">rule</span>: Cat(x) <span class="kw">∧</span> Fur(x) <span class="kw">→</span> Mammal(x)
<span class="fn">p</span>(Mammal) = <span class="fn">σ</span>(w₁·<span class="fn">p</span>(Cat) + w₂·<span class="fn">p</span>(Fur) + b)  <span class="cmt"># 梯度可回传</span></div>`;
const svg=c.querySelector("svg");const ns="http://www.w3.org/2000/svg";
const preds=[["Cat",.85],["Fur",.72],["Tail",.60],["Bark",.10]];
const pG=svg.querySelector("#preds");
preds.forEach((p,idx)=>{const x=80+idx*120;const g=document.createElementNS(ns,"g");
const bar=document.createElementNS(ns,"rect");bar.setAttribute("x",x);bar.setAttribute("y",250-p[1]*180);bar.setAttribute("width",40);bar.setAttribute("height",p[1]*180);bar.setAttribute("fill",ACC);bar.setAttribute("opacity",.5);bar.setAttribute("rx",2);bar.setAttribute("class","pred-bar");bar.dataset.v=p[1];g.appendChild(bar);
const t=document.createElementNS(ns,"text");t.setAttribute("x",x+20);t.setAttribute("y",285);t.setAttribute("class","svg-label");t.setAttribute("text-anchor","middle");t.textContent=p[0];g.appendChild(t);
const vt=document.createElementNS(ns,"text");vt.setAttribute("x",x+20);vt.setAttribute("y",250-p[1]*180-6);vt.setAttribute("class","svg-label");vt.setAttribute("text-anchor","middle");vt.setAttribute("fill",ACC);vt.textContent=p[1].toFixed(2);g.appendChild(vt);
pG.appendChild(g)});
// rule lines
[[0,1],[2,1],[3,0]].forEach(pair=>{const l=document.createElementNS(ns,"line");l.setAttribute("x1",80+pair[0]*120+20);l.setAttribute("y1",250-preds[pair[0]][1]*180);l.setAttribute("x2",80+pair[1]*120+20);l.setAttribute("y2",250-preds[pair[1]][1]*180);l.setAttribute("stroke","url(#g1)");l.setAttribute("stroke-width",1.5);l.setAttribute("class","flow-dash");pG.appendChild(l)});
let t=0;
function anim1(){t+=0.02;const out=.5+.4*Math.sin(t);document.getElementById("out1").textContent=out.toFixed(2);requestAnimationFrame(anim1)}anim1();
};
// M2 知识图谱推理
render[2]=(i)=>{const c=document.getElementById("cv-"+i);c.innerHTML=`
<div class="legend"><div class="legend-item"><div class="legend-swatch" style="background:#3b82f6"></div>实体</div><div class="legend-item"><div class="legend-swatch" style="background:#d946ef"></div>查询实体</div><div class="legend-item"><div class="legend-swatch" style="background:#22c55e"></div>推理路径</div><div class="legend-item"><div class="legend-swatch" style="background:#56575e"></div>关系边</div></div>
<svg viewBox="0 0 720 320" id="svg2">
<g id="kg-nodes"></g><g id="kg-edges"></g><g id="kg-path"></g>
</svg>
<div class="info-grid" style="margin-top:14px">
<div class="info-card"><div class="k">查询</div><div class="v">姚明 → ? → 国家</div></div>
<div class="info-card"><div class="k">跳数</div><div class="v"><code>2-hop</code> 推理</div></div>
<div class="info-card"><div class="k">路径</div><div class="v">姚明—效力于→火箭—所在国→美国</div></div>
<div class="info-card"><div class="k">置信度</div><div class="v"><code>0.92</code></div></div>
</div>`;
const svg=c.querySelector("svg");const ns="http://www.w3.org/2000/svg";
const nodes=[["姚明",100,160,ACC],["火箭",280,90,"#3b82f6"],["湖人",280,230,"#3b82f6"],["美国",460,90,"#3b82f6"],["加州",460,230,"#3b82f6"],["NBA",280,160,"#3b82f6"],["篮球",100,60,"#3b82f6"]];
const edges=[[0,1,"效力于"],[0,2,"效力过"],[1,3,"所在国"],[2,4,"所在州"],[0,5,"联盟"],[5,6,"运动"],[3,4,"包含"]];
const eG=svg.querySelector("#kg-edges"),nG=svg.querySelector("#kg-nodes"),pG=svg.querySelector("#kg-path");
edges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]];const l=document.createElementNS(ns,"line");l.setAttribute("x1",a[1]);l.setAttribute("y1",a[2]);l.setAttribute("x2",b[1]);l.setAttribute("y2",b[2]);l.setAttribute("stroke","#2a2d36");l.setAttribute("stroke-width",1);eG.appendChild(l);const mx=(a[1]+b[1])/2,my=(a[2]+b[2])/2;const t=document.createElementNS(ns,"text");t.setAttribute("x",mx);t.setAttribute("y",my-4);t.setAttribute("class","svg-label");t.setAttribute("font-size",8);t.setAttribute("text-anchor","middle");t.setAttribute("fill","#56575e");t.textContent=e[2];eG.appendChild(t)});
// path 0->1->3
