<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuView WiFi感知可视化实验室</title>
<style>
:root{--bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;--border:#1e2433;--border2:#2a3144;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;--red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;--pink:#f472b6;--green:#34d399;--mono:"'SF Mono','JetBrains Mono',Consolas,monospace";}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.app{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
.app-header{margin-bottom:28px;}
.ah-badge{display:inline-block;font-size:10px;letter-spacing:2px;color:var(--teal);background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.2);padding:4px 10px;border-radius:4px;margin-bottom:12px;}
.ah-title{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
.ah-sub{color:var(--text2);font-size:13px;margin-bottom:12px;}
.ah-tags{display:flex;gap:6px;flex-wrap:wrap;}
.ah-tag{font-size:10px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);padding:3px 8px;border-radius:3px;}
.lab-hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:12px;padding:28px 24px;margin-bottom:24px;position:relative;overflow:hidden;}
.lab-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,170,0.06),transparent 70%);pointer-events:none;}
.hero-eyebrow{font-size:11px;letter-spacing:3px;color:var(--teal);margin-bottom:8px;}
.hero-title{font-size:22px;font-weight:700;margin-bottom:10px;color:var(--text);}
.hero-desc{color:var(--text2);font-size:13px;max-width:700px;margin-bottom:20px;}
.hero-meta{display:flex;gap:24px;flex-wrap:wrap;}
.hm-item{display:flex;flex-direction:column;gap:2px;}
.hm-k{font-size:10px;color:var(--text3);letter-spacing:1px;}
.hm-v{font-size:14px;color:var(--text);font-weight:600;}
.module-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;transition:all 0.2s;font-family:var(--mono);color:var(--text2);}
.nav-btn:hover{border-color:var(--border2);color:var(--text);}
.nav-btn.active{background:var(--bg4);border-color:var(--teal);color:var(--teal);}
.nav-n{font-size:10px;color:var(--text3);}
.nav-btn.active .nav-n{color:var(--teal);}
.nav-t{font-size:12px;}
.module-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.mp-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;flex-wrap:wrap;}
.mp-tab{padding:12px 16px;font-size:12px;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all 0.2s;font-family:var(--mono);}
.mp-tab:hover{color:var(--text2);}
.mp-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.mp-body{display:flex;gap:0;}
.svg-wrap{flex:1;padding:16px;overflow:auto;min-width:0;}
.svg-wrap svg{width:100%;height:auto;display:block;}
.mp-side{width:240px;flex-shrink:0;padding:16px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:16px;}
.sb{background:var(--bg3);border-radius:8px;padding:12px;}
.sb-t{font-size:10px;letter-spacing:1px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;}
.pills{display:flex;flex-wrap:wrap;gap:6px;}
.pill{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--bg4);color:var(--text2);border:1px solid var(--border2);}
.pd{font-size:11px;color:var(--text2);line-height:1.6;}
.legend{display:flex;flex-direction:column;gap:6px;}
.leg-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.info{display:flex;flex-direction:column;gap:4px;}
.info-row{display:flex;justify-content:space-between;gap:8px;}
.info-k{font-size:11px;color:var(--text3);}
.info-v{font-size:11px;color:var(--text);font-weight:600;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor);}50%{filter:drop-shadow(0 0 8px currentColor);}}
@keyframes dash{to{stroke-dashoffset:-20;}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0.2;}}
@keyframes spin{to{transform:rotate(360deg);}}
.apulse{animation:pulse 2s ease-in-out infinite;}
.aglow{animation:glow 2s ease-in-out infinite;}
.adash{stroke-dasharray:4 4;animation:dash 1s linear infinite;}
.ablink{animation:blink 1.5s ease-in-out infinite;}
.aspin{animation:spin 8s linear infinite;transform-origin:center;}
@media(max-width:960px){.mp-body{flex-direction:column;}.mp-side{width:100%;border-left:none;border-top:1px solid var(--border);}.hero-meta{gap:16px;}.ah-title{font-size:20px;}.hero-title{font-size:18px;}}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="ah-badge">RUVIEW · 86K+ STARS · MIT</div>
    <h1 class="ah-title">WiFi感知可视化实验室</h1>
    <p class="ah-sub">ruvnet/RuView — 将普通WiFi信号转化为实时空间智能</p>
    <div class="ah-tags">
      <span class="ah-tag">WiFi Sensing</span>
      <span class="ah-tag">CSI</span>
      <span class="ah-tag">ESP32</span>
      <span class="ah-tag">SNN</span>
      <span class="ah-tag">Edge AI</span>
      <span class="ah-tag">Rust</span>
    </div>
  </header>
  <section class="lab-hero">
    <div class="hero-eyebrow">WIFI SENSING VIZ LAB</div>
    <h2 class="hero-title">无需摄像头的空间智能感知</h2>
    <p class="hero-desc">利用ESP32传感器捕获信道状态信息(CSI)，实现穿墙人体检测、呼吸和心率监测、活动识别、睡眠质量监测——无需摄像头或可穿戴设备。脉冲神经网络在30秒内适应环境，4位量化模型仅8KB。</p>
    <div class="hero-meta">
      <div class="hm-item"><span class="hm-k">STARS</span><span class="hm-v">86K+</span></div>
      <div class="hm-item"><span class="hm-k">语言</span><span class="hm-v">Rust</span></div>
      <div class="hm-item"><span class="hm-k">许可证</span><span class="hm-v">MIT</span></div>
      <div class="hm-item"><span class="hm-k">定位</span><span class="hm-v">WiFi感知</span></div>
    </div>
  </section>
  <nav class="module-nav" id="modNav"></nav>
  <div class="module-panel">
    <div class="mp-tabs" id="mpTabs"></div>
    <div class="mp-body">
      <div class="svg-wrap">
        <svg id="svg" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="mp-side">
        <div class="sb"><div class="sb-t">技术标签</div><div class="pills" id="pillsEl"></div></div>
        <div class="sb"><div class="sb-t">图例</div><div class="legend" id="legendEl"></div></div>
        <div class="sb"><div class="sb-t">详细信息</div><div class="info" id="infoEl"></div></div>
      </div>
    </div>
  </div>
</div>
<script>
var NS='http://www.w3.org/2000/svg';
function E(parent,tag,attrs){
  var el=document.createElementNS(NS,tag);
  if(attrs){for(var k in attrs){el.setAttribute(k,attrs[k]);}}
  if(parent){parent.appendChild(el);}
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n.firstChild){n.removeChild(n.firstChild);}}
function box(g,x,y,w,h,fill,stroke,rx){
  return E(g,'rect',{x:x,y:y,width:w,height:h,rx:rx||6,fill:fill||'#0f1117',stroke:stroke||'#2a3144','stroke-width':1.2});
}
function txt(g,x,y,content,attrs){
  var a={x:x,y:y};
  if(attrs){for(var k in attrs){a[k]=attrs[k];}}
  var t=E(g,'text',a);
  t.textContent=content;
  return t;
}
function line(g,x1,y1,x2,y2,attrs){
  var a={x1:x1,y1:y1,x2:x2,y2:y2};
  if(attrs){for(var k in attrs){a[k]=attrs[k];}}
  return E(g,'line',a);
}
function arrow(g,x1,y1,x2,y2,col){
  return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col||'#00d4aa','stroke-width':1.5,'marker-end':'url(#arrow)'});
}
function circ(g,cx,cy,r,attrs){
  var a={cx:cx,cy:cy,r:r};
  if(attrs){for(var k in attrs){a[k]=attrs[k];}}
  return E(g,'circle',a);
}
function poly(g,points,attrs){
  var a={points:points};
  if(attrs){for(var k in attrs){a[k]=attrs[k];}}
  return E(g,'polygon',a);
}
function rbox(g,x,y,w,h,fill,stroke,rx){
  return E(g,'rect',{x:x,y:y,width:w,height:h,rx:rx||8,fill:fill||'none',stroke:stroke||'#2a3144','stroke-width':1.2});
}
function chip(g,x,y,w,h,label,col){
  col=col||'#00d4aa';
  rbox(g,x,y,w,h,'#0f1117',col,6);
  E(g,'rect',{x:x,y:y,width:3,height:h,fill:col});
  var t=E(g,'text',{x:x+10,y:y+h/2+4,fill:'#e2e8f0','font-size':11});
  t.textContent=label;
}
function pbar(g,x,y,w,h,pct,col){
  col=col||'#00d4aa';
  rbox(g,x,y,w,h,'#0a0b0f','#1e2433',h/2);
  E(g,'rect',{x:x,y:y,width:w*pct/100,height:h,rx:h/2,fill:col});
  var t=E(g,'text',{x:x+w+8,y:y+h/2+4,fill:'#94a3b8','font-size':10});
  t.textContent=pct+'%';
}
function drawChip(g,cx,cy,w,h,label){
  rbox(g,cx-w/2,cy-h/2,w,h,'#161922','#2a3144',4);
  rbox(g,cx-w/2+8,cy-h/2+8,w-16,h-16,'#0a0b0f','#1e2433',2);
  var t=E(g,'text',{x:cx,y:cy+4,'text-anchor':'middle',fill:'#00d4aa','font-size':12,'font-weight':600});
  t.textContent=label;
  var pinCount=Math.floor(h/14);
  for(var i=0;i<pinCount;i++){
    var py=cy-h/2+10+i*14;
    E(g,'rect',{x:cx-w/2-6,y:py-2,width:6,height:4,fill:'#2a3144'});
    E(g,'rect',{x:cx+w/2,y:py-2,width:6,height:4,fill:'#2a3144'});
  }
}
function nodeBox(g,x,y,w,h,title,sub,col){
  col=col||'#00d4aa';
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:8,fill:'#0f1117',stroke:col,'stroke-width':1.5,'stroke-opacity':0.5});
  E(g,'rect',{x:x,y:y,width:4,height:h,rx:2,fill:col});
  var t1=E(g,'text',{x:x+14,y:y+22,fill:'#e2e8f0','font-size':13,'font-weight':600});
  t1.textContent=title;
  if(sub){
    var t2=E(g,'text',{x:x+14,y:y+40,fill:'#64748b','font-size':10});
    t2.textContent=sub;
  }
}
function radar(g,cx,cy,r,labels,data,opts){
  opts=opts||{};
  var n=labels.length;
  var color=opts.color||'#00d4aa';
  for(var i=1;i<=4;i++){
    var rr=r*i/4;
    var pts=[];
    for(var j=0;j<n;j++){
      var a=-Math.PI/2+j*2*Math.PI/n;
      pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));
    }
    E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:'#1e2433','stroke-width':1});
  }
  for(var j=0;j<n;j++){
    var a=-Math.PI/2+j*2*Math.PI/n;
    line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{x1:cx,y1:cy,x2:cx+r*Math.cos(a),y2:cy+r*Math.sin(a),stroke:'#1e2433','stroke-width':1});
  }
  var dpts=[];
  for(var j=0;j<n;j++){
    var a=-Math.PI/2+j*2*Math.PI/n;
    var v=(data[j]||0)/100;
    dpts.push((cx+r*v*Math.cos(a))+','+(cy+r*v*Math.sin(a)));
  }
  E(g,'polygon',{points:dpts.join(' '),fill:color,'fill-opacity':0.15,stroke:color,'stroke-width':2});
  for(var j=0;j<n;j++){
    var a=-Math.PI/2+j*2*Math.PI/n;
    var v=(data[j]||0)/100;
    circ(g,0,0,0,{cx:cx+r*v*Math.cos(a),cy:cy+r*v*Math.sin(a),r:3,fill:color});
  }
  for(var j=0;j<n;j++){
    var a=-Math.PI/2+j*2*Math.PI/n;
    var lx=cx+(r+22)*Math.cos(a);
    var ly=cy+(r+22)*Math.sin(a);
    var t=E(g,'text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'middle',fill:'#94a3b8','font-size':11});
    t.textContent=labels[j];
  }
}
function gridBg(g,w,h){
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'#0a0b0f'});
  for(var x=0;x<=w;x+=30){
    line(g,x,0,x,h,{x1:x,y1:0,x2:x,y2:h,stroke:'#11141c','stroke-width':0.5});
  }
  for(var y=0;y<=h;y+=30){
    line(g,0,y,w,y,{x1:0,y1:y,x2:w,y2:y,stroke:'#11141c','stroke-width':0.5});
  }
}
function setPills(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  arr.forEach(function(p){
    var s=document.createElement('span');s.className='pill';s.textContent=p;el.appendChild(s);
  });
}
function setLegend(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  arr.forEach(function(item){
    var d=document.createElement('span');d.className='leg-dot';d.style.background=item[0];
    var s=document.createElement('span');s.textContent=item[1];
    var li=document.createElement('div');li.className='leg-item';li.appendChild(d);li.appendChild(s);
    el.appendChild(li);
  });
}
function setInfo(id,arr){
  var el=$(id);if(!el)return;clearNode(el);
  arr.forEach(function(item){
    var k=document.createElement('span');k.className='info-k';k.textContent=item[0];
    var v=document.createElement('span');v.className='info-v';v.textContent=item[1];
    var row=document.createElement('div');row.className='info-row';row.appendChild(k);row.appendChild(v);
    el.appendChild(row);
  });
}
function addDefs(svg){
  var defs=E(svg,'defs');
  var mk=E(defs,'marker',{id:'arrow',markerWidth:8,markerHeight:6,refX:8,refY:3,orient:'auto'});
  E(mk,'polygon',{points:'0 0, 8 3, 0 6',fill:'#00d4aa'});
  var g1=E(defs,'linearGradient',{id:'gradT',x1:0,y1:0,x2:1,y2:0});
  E(g1,'stop',{offset:'0%','stop-color':'#00d4aa'});
  E(g1,'stop',{offset:'100%','stop-color':'#22d3ee'});
  var g2=E(defs,'linearGradient',{id:'gradP',x1:0,y1:0,x2:0,y2:1});
  E(g2,'stop',{offset:'0%','stop-color':'#a78bfa'});
  E(g2,'stop',{offset:'100%','stop-color':'#3b82f6'});
  var flt=E(defs,'filter',{id:'glw',x:'-50%',y:'-50%',width:'200%',height:'200%'});
  E(flt,'feGaussianBlur',{stdDeviation:3,result:'coloredBlur'});
  var mg=E(flt,'feMerge',{});E(mg,'feMergeNode',{in:'coloredBlur'});E(mg,'feMergeNode',{in:'SourceGraphic'});
}

var MODULES=[
  {title:'项目概览',icon:'01',tabs:['项目全景','核心指标','定位分析']},
  {title:'CSI信号捕获',icon:'02',tabs:['ESP32传感器','信道状态信息','信号处理']},
  {title:'空间智能引擎',icon:'03',tabs:['穿墙检测','人体定位','存在感知']},
  {title:'生命体征监测',icon:'04',tabs:['呼吸检测','心率监测','睡眠分析']},
  {title:'脉冲神经网络',icon:'05',tabs:['SNN架构','30秒适应','边缘推理']},
  {title:'活动识别系统',icon:'06',tabs:['动作分类','行为分析','场景理解']},
  {title:'感知技术生态',icon:'07',tabs:['竞品对比','功能覆盖','优势分析']},
  {title:'空间智能未来',icon:'08',tabs:['技术路线','生态展望','未来方向']}
];
var mCur=0;
var mViews=[0,0,0,0,0,0,0,0];

function buildNav(){
  var el=$('modNav');clearNode(el);
  MODULES.forEach(function(m,i){
    var btn=document.createElement('div');
    btn.className='nav-btn'+(i===mCur?' active':'');
    btn.innerHTML='<span class="nav-n">'+m.icon+'</span><span class="nav-t">'+m.title+'</span>';
    btn.onclick=function(){mCur=i;buildNav();buildTabs(mCur);drawModule(mCur);};
    el.appendChild(btn);
  });
}
function buildTabs(mi){
  var el=$('mpTabs');clearNode(el);
  MODULES[mi].tabs.forEach(function(t,i){
    var tab=document.createElement('div');
    tab.className='mp-tab'+(i===mViews[mi]?' active':'');
    tab.textContent=t;
    tab.onclick=function(){mViews[mi]=i;buildTabs(mi);drawModule(mi);};
    el.appendChild(tab);
  });
}
function drawModule(mi){
  var svg=$('svg');clearNode(svg);addDefs(svg);
  var g=E(svg,'g',{});
  gridBg(g,900,480);
  var fns=[drawM1,drawM2,drawM3,drawM4,drawM5,drawM6,drawM7,drawM8];
  fns[mi](g,mViews[mi]);
}

// === M1 项目概览 ===
function drawM1(g,vi){
  if(vi===0){
    // 项目全景 - 架构流程图
    var t=E(g,'text',{x:30,y:36,fill:'#e2e8f0','font-size':16,'font-weight':700});
    t.textContent='RuView 系统架构全景';
    var nodes=[
      {x:40,y:80,w:130,h:60,t:'ESP32传感器',s:'WiFi CSI捕获',c:'#00d4aa'},
      {x:230,y:80,w:130,h:60,t:'CSI预处理',s:'去噪·滤波',c:'#22d3ee'},
      {x:420,y:80,w:130,h:60,t:'特征提取',s:'子载波分析',c:'#22d3ee'},
      {x:610,y:80,w:130,h:60,t:'脉冲神经网络',s:'SNN推理',c:'#a78bfa'},
      {x:40,y:220,w:130,h:55,t:'穿墙检测',s:'人体存在',c:'#fbbf24'},
      {x:200,y:220,w:130,h:55,t:'生命体征',s:'呼吸·心率',c:'#ef4444'},
      {x:360,y:220,w:130,h:55,t:'活动识别',s:'行为分类',c:'#34d399'},
      {x:520,y:220,w:130,h:55,t:'睡眠监测',s:'睡眠分期',c:'#f472b6'},
      {x:680,y:220,w:130,h:55,t:'空间映射',s:'位置追踪',c:'#3b82f6'}
    ];
    nodes.forEach(function(n){nodeBox(g,n.x,n.y,n.w,n.h,n.t,n.s,n.c);});
    // 连接线 - 上排
    arrow(g,170,110,230,110,'#00d4aa');
    arrow(g,360,110,420,110,'#22d3ee');
    arrow(g,550,110,610,110,'#22d3ee');
    // SNN 到各输出
    var outX=[105,265,425,585,745];
    outX.forEach(function(ox){
      line(g,675,140,ox,220,{x1:675,y1:140,x2:ox,y2:220,stroke:'#2a3144','stroke-width':1,'stroke-dasharray':'3 3'});
    });
    // 底部信息条
    rbox(g,40,320,820,60,'#0f1117','#1e2433',8);
    var items=[
      {x:70,t:'8KB',s:'4位量化模型',c:'#00d4aa'},
      {x:240,t:'30s',s:'环境适应',c:'#22d3ee'},
      {x:410,t:'100%',s:'无摄像头',c:'#a78bfa'},
      {x:580,t:'0',s:'可穿戴设备',c:'#fbbf24'},
      {x:730,t:'Edge',s:'边缘运行',c:'#34d399'}
    ];
