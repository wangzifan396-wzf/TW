<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#7c5cff;
  --cA:#7c5cff;--cB:#34d399;
  --radius:8px;
  --mono:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3d45}

header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.92);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
header .logo{font-size:18px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
header .logo span{color:var(--accent)}
header .sep{width:1px;height:20px;background:var(--border2)}
header nav{display:flex;gap:4px}
header nav a{color:var(--text3);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:all .15s;white-space:nowrap}
header nav a:hover{color:var(--text);background:var(--bg3)}
header nav a.active{color:var(--text);background:var(--bg3)}
header .spacer{flex:1}
header .stats{font-size:12px;color:var(--text3);white-space:nowrap}
header .stats b{color:var(--text2)}

.hero{padding:48px 24px 24px;text-align:center;max-width:1200px;margin:0 auto}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,var(--text) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:16px;color:var(--text2);max-width:600px;margin:0 auto}

.controls{max-width:1400px;margin:0 auto;padding:0 24px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filter-btns{display:flex;gap:4px;flex-wrap:wrap}
.fbtn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{color:var(--text2);border-color:var(--border2)}
.fbtn.active{color:var(--text);border-color:var(--border2);background:var(--bg3)}

.compare-grid{max-width:1400px;margin:0 auto;padding:0 24px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.compare-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.compare-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 4px 24px rgba(0,0,0,.3)}
.compare-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cA),var(--cB))}
.compare-card .cat-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.compare-card .title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.compare-card .desc{font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:12px}
.compare-card .vs-row{display:flex;align-items:center;gap:12px}
.compare-card .side{flex:1;text-align:center}
.compare-card .side .name{font-size:15px;font-weight:600}
.compare-card .side.a .name{color:var(--cA)}
.compare-card .side.b .name{color:var(--cB)}
.compare-card .side .dsc{font-size:11px;color:var(--text3);margin-top:2px}
.compare-card .vs{font-size:20px;font-weight:800;color:var(--text3);font-style:italic}
.compare-card .mini-radar{margin-top:12px;display:flex;justify-content:center}

/* Detail view */
.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;padding:20px}
.detail-overlay.show{display:flex;opacity:1}
.detail-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:transform .2s}
.detail-overlay.show .detail-modal{transform:scale(1)}
.detail-head{padding:24px;border-bottom:1px solid var(--border);position:relative}
.detail-head .cat-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;margin-bottom:8px}
.detail-head .ttl{font-size:24px;font-weight:700;color:var(--text)}
.detail-head .dsc{font-size:13px;color:var(--text2);margin-top:4px}
.detail-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;border:none;background:var(--bg3);color:var(--text3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.detail-close:hover{color:var(--text);background:var(--border)}
.detail-body{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.radar-section{display:flex;flex-direction:column;align-items:center}
.radar-section svg{width:100%;max-width:400px;height:auto}
.radar-title{font-size:18px;font-weight:700;margin-bottom:4px}
.radar-sub{font-size:12px;color:var(--text3);margin-bottom:12px}
.table-section{grid-column:1/-1}
.compare-table{width:100%;border-collapse:collapse;font-size:13px}
.compare-table th{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border2);font-weight:600;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.compare-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.compare-table .dim-name{font-weight:600;color:var(--text)}
.compare-table .score-cell{display:flex;align-items:center;gap:8px}
.compare-table .score-bar{width:80px;height:6px;border-radius:3px;background:var(--bg3);overflow:hidden}
.compare-table .score-fill{height:100%;border-radius:3px;transition:width .3s}
.compare-table .score-val{font-family:var(--mono);font-size:12px;font-weight:600;min-width:24px}
.compare-table .note{font-size:11px;color:var(--text3);line-height:1.4}
.compare-table .winner{color:var(--accent);font-weight:700}
.link-section{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:all .15s}
.link-btn.a{background:var(--cA);color:#fff}
.link-btn.b{background:var(--cB);color:#000}
.link-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}

footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);color:var(--text3);font-size:12px}
footer a{color:var(--text2);text-decoration:none}
footer a:hover{color:var(--accent)}

.hint{text-align:center;padding:8px;font-size:12px;color:var(--text3)}
.hint kbd{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px;color:var(--text2)}

@media(max-width:768px){
  header{padding:0 12px;height:48px}
  header nav{display:none}
  .hero{padding:32px 16px 16px}
  .hero h1{font-size:28px}
  .compare-grid{grid-template-columns:1fr;padding:0 12px 24px}
  .detail-body{grid-template-columns:1fr}
}
</style>
</head>

var CAT_COLORS = {"ai": "#5e6ad2", "systems": "#34d399", "theory": "#fbbf24", "cross": "#f97316"};
var CAT_NAMES = {"ai": "AI / 机器学习", "systems": "CS 系统", "theory": "CS 理论", "cross": "交叉学科"};
var BASE = "https://wangzifan396-wzf.github.io/TW/";
var activeFilter = "all";

function init(){
  document.getElementById("pairCount").textContent = PAIRS.length;
  var totalDims = PAIRS.reduce(function(s,p){return s + p.dims.length}, 0);
  document.getElementById("dimCount").textContent = totalDims;
  renderGrid();
  bindControls();
}

function renderGrid(){
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  PAIRS.forEach(function(pair){
    if(activeFilter !== "all" && pair.category !== activeFilter) return;
    var card = document.createElement("div");
    card.className = "compare-card";
    var color = CAT_COLORS[pair.category] || "#7c5cff";
    card.innerHTML =
      '<div class="cat-badge" style="background:'+color+'22;color:'+color+'">'+(CAT_NAMES[pair.category]||pair.category)+'</div>'+
      '<div class="title">'+pair.title+'</div>'+
      '<div class="desc">'+pair.desc+'</div>'+
      '<div class="vs-row">'+
        '<div class="side a"><div class="name">'+pair.a.name+'</div><div class="dsc">'+pair.a.desc+'</div></div>'+
        '<div class="vs">vs</div>'+
        '<div class="side b"><div class="name">'+pair.b.name+'</div><div class="dsc">'+pair.b.desc+'</div></div>'+
      '</div>'+
      '<div class="mini-radar" id="mini_'+pair.id+'"></div>';
    card.addEventListener("click", function(){showDetail(pair)});
    grid.appendChild(card);

    // Draw mini radar
    setTimeout(function(){drawMiniRadar("mini_"+pair.id, pair)}, 0);
  });
}

function drawMiniRadar(containerId, pair){
  var container = document.getElementById(containerId);
  if(!container) return;
  var size = 120;
  var cx = size/2, cy = size/2;
  var r = size/2 - 10;
  var n = pair.dims.length;
  var svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';

  // Grid circles
  for(var i=1;i<=3;i++){
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*i/3)+'" fill="none" stroke="#1e2026" stroke-width="1"/>';
  }
  // Axis lines
  for(var i=0;i<n;i++){
    var angle = (Math.PI*2/n)*i - Math.PI/2;
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(angle)*r)+'" y2="'+(cy+Math.sin(angle)*r)+'" stroke="#1e2026" stroke-width="1"/>';
  }
  // Polygon A
  var ptsA = "", ptsB = "";
  for(var i=0;i<n;i++){
    var angle = (Math.PI*2/n)*i - Math.PI/2;
    var ra = r * (pair.dims[i].a/10);
    var rb = r * (pair.dims[i].b/10);
    ptsA += (cx+Math.cos(angle)*ra)+","+(cy+Math.sin(angle)*ra)+" ";
    ptsB += (cx+Math.cos(angle)*rb)+","+(cy+Math.sin(angle)*rb)+" ";
  }
  svg += '<polygon points="'+ptsB+'" fill="rgba(52,211,153,.1)" stroke="#34d399" stroke-width="1.5"/>';
  svg += '<polygon points="'+ptsA+'" fill="rgba(124,92,255,.1)" stroke="#7c5cff" stroke-width="1.5"/>';
  svg += '</svg>';
  container.innerHTML = svg;
}

function drawRadar(containerId, pair, side, color){
  var container = document.getElementById(containerId);
  if(!container) return;
  var size = 300;
  var cx = size/2, cy = size/2;
  var r = size/2 - 30;
  var n = pair.dims.length;
  var svg = '<svg width="100%" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';

  // Grid circles
  for(var i=1;i<=5;i++){
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*i/5)+'" fill="none" stroke="#1e2026" stroke-width="1"/>';
  }
  // Axis lines + labels
  for(var i=0;i<n;i++){
    var angle = (Math.PI*2/n)*i - Math.PI/2;
    var x2 = cx+Math.cos(angle)*r;
    var y2 = cy+Math.sin(angle)*r;
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x2+'" y2="'+y2+'" stroke="#1e2026" stroke-width="1"/>';

    var lx = cx+Math.cos(angle)*(r+15);
    var ly = cy+Math.sin(angle)*(r+15)+3;
    svg += '<text x="'+lx+'" y="'+ly+'" font-size="9" fill="#71717a" text-anchor="middle" font-family="monospace">'+pair.dims[i].name+'</text>';
  }
  // Polygon
  var pts = "";
  var values = side === "a" ? pair.dims.map(function(d){return d.a}) : pair.dims.map(function(d){return d.b});
  for(var i=0;i<n;i++){
    var angle = (Math.PI*2/n)*i - Math.PI/2;
    var rv = r * (values[i]/10);
    pts += (cx+Math.cos(angle)*rv)+","+(cy+Math.sin(angle)*rv)+" ";
  }
  var fillColor = side === "a" ? "rgba(124,92,255,.15)" : "rgba(52,211,153,.15)";
  svg += '<polygon points="'+pts+'" fill="'+fillColor+'" stroke="'+color+'" stroke-width="2"/>';
  // Dots
  for(var i=0;i<n;i++){
    var angle = (Math.PI*2/n)*i - Math.PI/2;
    var rv = r * (values[i]/10);
    svg += '<circle cx="'+(cx+Math.cos(angle)*rv)+'" cy="'+(cy+Math.sin(angle)*rv)+'" r="3" fill="'+color+'"/>';
  }
  svg += '</svg>';
  container.innerHTML = svg;
}

function showDetail(pair){
  var color = CAT_COLORS[pair.category] || "#7c5cff";
  document.getElementById("dCat").textContent = CAT_NAMES[pair.category] || pair.category;
  document.getElementById("dCat").style.background = color + "22";
  document.getElementById("dCat").style.color = color;
  document.getElementById("dTitle").textContent = pair.title;
  document.getElementById("dDesc").textContent = pair.desc;

  var body = document.getElementById("dBody");
  body.innerHTML =
    '<div class="radar-section">'+
      '<div class="radar-title" style="color:var(--cA)">'+pair.a.name+'</div>'+
      '<div class="radar-sub">'+pair.a.desc+'</div>'+
      '<div id="radarA"></div>'+
    '</div>'+
    '<div class="radar-section">'+
      '<div class="radar-title" style="color:var(--cB)">'+pair.b.name+'</div>'+
      '<div class="radar-sub">'+pair.b.desc+'</div>'+
      '<div id="radarB"></div>'+
    '</div>'+
    '<div class="table-section">'+
      '<table class="compare-table">'+
        '<thead><tr><th>维度</th><th>'+pair.a.name+'</th><th>'+pair.b.name+'</th><th>说明</th></tr></thead>'+
        '<tbody>'+pair.dims.map(function(d){
          var winA = d.a > d.b, winB = d.b > d.a;
          return '<tr>'+
            '<td class="dim-name">'+d.name+'</td>'+
            '<td><div class="score-cell"><div class="score-bar"><div class="score-fill" style="width:'+(d.a*10)+'%;background:var(--cA)"></div></div><span class="score-val '+(winA?'winner':'')+'" style="color:'+(winA?'var(--cA)':'var(--text2)')+'">'+d.a+'</span></div></td>'+
            '<td><div class="score-cell"><div class="score-bar"><div class="score-fill" style="width:'+(d.b*10)+'%;background:var(--cB)"></div></div><span class="score-val '+(winB?'winner':'')+'" style="color:'+(winB?'var(--cB)':'var(--text2)')+'">'+d.b+'</span></div></td>'+
            '<td class="note">'+d.note+'</td>'+
          '</tr>';
        }).join("")+'</tbody>'+
      '</table>'+
    '</div>';

  if(pair.a.project || pair.b.project){
    var links = '<div class="link-section">';
    if(pair.a.project) links += '<a class="link-btn a" href="'+BASE+pair.a.project+'/" target="_blank">🔗 '+pair.a.project+' →</a>';
    if(pair.b.project) links += '<a class="link-btn b" href="'+BASE+pair.b.project+'/" target="_blank">🔗 '+pair.b.project+' →</a>';
    links += '</div>';
    body.insertAdjacentHTML("beforeend", links);
  }

  document.getElementById("detailOverlay").classList.add("show");
  setTimeout(function(){
    drawRadar("radarA", pair, "a", "#7c5cff");
    drawRadar("radarB", pair, "b", "#34d399");
  }, 50);
}

function closeModal(){
  document.getElementById("detailOverlay").classList.remove("show");
}

function bindControls(){
  document.querySelectorAll(".fbtn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".fbtn").forEach(function(b){b.classList.remove("active")});
      this.classList.add("active");
      activeFilter = this.dataset.cat;
      renderGrid();
    });
  });
  document.getElementById("detailClose").addEventListener("click", closeModal);
  document.getElementById("detailOverlay").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeModal();
  });
}

init();
</script>
