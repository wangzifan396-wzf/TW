.mp-tab.active{background:#1c2030;color:#22d3ee;border-color:#22d3ee;font-weight:bold}
.mp-body{flex:1;min-width:0}
.svg-wrap{background:#0a0b0f;border:1px solid #2a3144;border-radius:12px;padding:12px;overflow:hidden}
.svg-wrap svg{width:100%;height:auto;display:block}

.sb-t{font-size:10px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}

.ablink{animation:ablink 1.5s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{animation:aspin 14s linear infinite;transform-origin:center}

/* ===== 导航与模块系统 ===== */
function buildNav(){var nav=$('moduleNav');clearNode(nav);MODULES.forEach(function(m,i){var b=document.createElement('button');b.className='nav-btn'+(i===mCur?' active':'');var n=document.createElement('span');n.className='nav-n';n.textContent=m.n;var t=document.createElement('span');t.className='nav-t';t.textContent=m.t;b.appendChild(n);b.appendChild(t);b.onclick=function(){mCur=i;if(!mViews[mCur])mViews[mCur]=0;drawModule(mCur);buildNav();};nav.appendChild(b);});}
function buildTabs(mi){var tabs=$('mpTabs');clearNode(tabs);var m=MODULES[mi];m.v.forEach(function(vn,i){var b=document.createElement('button');b.className='mp-tab'+(i===mViews[mi]?' active':'');b.textContent=(i+1)+'. '+vn;b.onclick=function(){setView(mi,i);};tabs.appendChild(b);});}
function setView(mi,vi){mViews[mi]=vi;drawModule(mi);}
function drawModule(mi){for(var i=1;i<=8;i++){if(mLayers['m'+i])mLayers['m'+i].style.display='none';var ss=$('side-'+i);if(ss)ss.style.display='none';}var key='m'+(mi+1);if(mLayers[key])mLayers[key].style.display='';var ss2=$('side-'+(mi+1));if(ss2)ss2.style.display='';var fn=window[key+'Draw'];if(fn)fn();buildTabs(mi);updateHero(mi);}
function updateHero(mi){var m=MODULES[mi];var el=$('labHero');clearNode(el);var eb=document.createElement('div');eb.className='hero-eyebrow';eb.textContent='VIZ LAB / 422 · AIRI · '+m.n;el.appendChild(eb);var t=document.createElement('div');t.className='hero-title';t.textContent=m.n+' · '+m.t;el.appendChild(t);var d=document.createElement('div');d.className='hero-desc';d.textContent=m.d;el.appendChild(d);var meta=document.createElement('div');meta.className='hero-meta';m.meta.forEach(function(me){var it=document.createElement('div');it.className='hm-item';var k=document.createElement('div');k.className='hm-k';k.textContent=me.k;var v=document.createElement('div');v.className='hm-v';v.textContent=me.v;it.appendChild(k);it.appendChild(v);meta.appendChild(it);});el.appendChild(meta);}
function init(){mLayers={};var svg=$('svg');for(var i=1;i<=8;i++){var lg=E(svg,'g',{});mLayers['m'+i]=lg;lg.style.display=(i===1)?'':'none';}var side=$('mpSide');clearNode(side);for(var i=1;i<=8;i++){var ss=document.createElement('div');ss.className='side-set';ss.id='side-'+i;ss.style.display=(i===1)?'':'none';ss.innerHTML='<div class="sb"><div class="sb-t">标签</div><div class="pills" id="m'+i+'-stat"></div></div><div class="sb"><div class="sb-t">图例</div><div class="legend" id="m'+i+'-leg"></div></div><div class="sb"><div class="sb-t">数据</div><div class="info" id="m'+i+'-info"></div></div>';side.appendChild(ss);}buildNav();drawModule(0);}
window.addEventListener('DOMContentLoaded',init);
</script>
