<style>

body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}

@media(max-width:768px){.info-grid{grid-template-columns:1fr}.lab-hero h1{font-size:21px}.viz-wrap{height:360px}.nav-inner{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
window.addEventListener('error',function(e){
  var msg='[VizLab Error] '+(e.message||'unknown');
  if(e.filename) msg+=' @ '+e.filename+':'+e.lineno;
  console.error(msg);
},true);

var SVGNS='http://www.w3.org/2000/svg';

function el(tag,attrs){
  var e=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){e.setAttribute(k,attrs[k]);}}
  return e;
}
function txt(s){return document.createTextNode(s);}
function tspanEl(t,x,y,opts){
  var ts=el('tspan');
  if(x!==undefined)ts.setAttribute('x',x);
  if(y!==undefined)ts.setAttribute('y',y);
  if(opts){
    if(opts.fill)ts.setAttribute('fill',opts.fill);
    if(opts.fs)ts.setAttribute('font-size',opts.fs);
    if(opts.fw)ts.setAttribute('font-weight',opts.fw);
    if(opts.ta)ts.setAttribute('text-anchor',opts.ta);
  }
  ts.textContent=t;
  return ts;
}
function clearNode(n){while(n.firstChild)n.removeChild(n.firstChild);}
function setStatText(node,str){node.textContent=str;}

var C_TEAL='#00d4aa',C_CYAN='#22d3ee',C_AMBER='#fbbf24',C_RED='#ef4444';
var C_PURPLE='#a78bfa',C_BLUE='#3b82f6',C_PINK='#f472b6',C_GREEN='#34d399';
var C_BD='#1e293b',C_BD2='#334155',C_DIM='#64748b',C_T2='#94a3b8',C_T3='#64748b';

var reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var animId=null;
function stopAnim(){if(animId){cancelAnimationFrame(animId);animId=null;}}
function startAnim(fn,ms){
  stopAnim();
  if(reducedMotion)return;
  var last=0;
  function loop(t){
    if(t-last>=ms){fn();last=t;}
    animId=requestAnimationFrame(loop);
  }
  animId=requestAnimationFrame(loop);
}

function addDefs(svg,pfx){
  var defs=el('defs');
  var filter=el('filter',{id:pfx+'-glow',x:'-50%',y:'-50%',width:'200%',height:'200%'});
  filter.appendChild(el('feGaussianBlur',{stdDeviation:'3',result:'blur'}));
  var merge=el('feMerge');
  merge.appendChild(el('feMergeNode',{in:'blur'}));
  merge.appendChild(el('feMergeNode',{in:'SourceGraphic'}));
  filter.appendChild(merge);
  defs.appendChild(filter);
  var colors=[['teal','#00d4aa'],['cyan','#22d3ee'],['amber','#fbbf24'],['red','#ef4444'],['purple','#a78bfa'],['blue','#3b82f6']];
  for(var i=0;i<colors.length;i++){
    var grad=el('linearGradient',{id:pfx+'-'+colors[i][0],x1:'0',y1:'0',x2:'1',y2:'1'});
    grad.appendChild(el('stop',{offset:'0%','stop-color':colors[i][1],'stop-opacity':'0.25'}));
    grad.appendChild(el('stop',{offset:'100%','stop-color':colors[i][1],'stop-opacity':'0.03'}));
    defs.appendChild(grad);
  }
  svg.appendChild(defs);
  return defs;
}

function gridBg(parent,w,h,step){
  var g=el('g',{'stroke':C_BD,'stroke-width':0.5,opacity:0.2});
  for(var x=0;x<=w;x+=step){g.appendChild(el('line',{x1:x,y1:0,x2:x,y2:h}));}
  for(var y=0;y<=h;y+=step){g.appendChild(el('line',{x1:0,y1:y,x2:w,y2:y}));}
  parent.appendChild(g);
}

function box(parent,x,y,w,h,label,opts){
  opts=opts||{};
  var rect=el('rect',{x:x,y:y,width:w,height:h,rx:opts.rx||6,
    fill:opts.fill||'rgba(0,212,170,0.06)',stroke:opts.stroke||C_TEAL,
    'stroke-width':opts.sw||1});
  if(opts.dash)rect.setAttribute('stroke-dasharray',opts.dash);
  if(opts.cls)rect.setAttribute('class',opts.cls);
  if(opts.opacity)rect.setAttribute('opacity',opts.opacity);
  parent.appendChild(rect);
  if(label){
    var lx=opts.tx||(x+w/2),ly=opts.ty||(y+h/2);
    var t=el('text',{x:lx,y:ly,
      'text-anchor':opts.ta||'middle','dominant-baseline':'middle'});
    if(opts.cls)t.setAttribute('class',opts.cls);
    t.appendChild(tspanEl(label,lx,ly,{fill:opts.tf||C_T2,fs:opts.fs,fw:opts.fw,ta:opts.ta}));
    parent.appendChild(t);
  }
  return rect;
}

function arrow(parent,x1,y1,x2,y2,color,opts){
  opts=opts||{};
  var path=el('path',{d:'M'+x1+','+y1+' L'+x2+','+y2,
    stroke:color||C_TEAL,'stroke-width':opts.sw||1.5,fill:'none',
    'stroke-dasharray':opts.dash||'none'});
  if(opts.marker)path.setAttribute('marker-end',opts.marker);
  if(opts.cls)path.setAttribute('class',opts.cls);
  if(opts.opacity)path.setAttribute('opacity',opts.opacity);
  parent.appendChild(path);
  return path;
}

function mkMarker(svg,id,color){
  var defs=svg.querySelector('defs');
  if(!defs)defs=addDefs(svg,'tmp');
  var marker=el('marker',{id:id,viewBox:'0 0 10 10',refX:'8',refY:'5',
    markerWidth:'5',markerHeight:'5',orient:'auto'});
  marker.appendChild(el('path',{d:'M0,0 L10,5 L0,10 Z',fill:color}));
  defs.appendChild(marker);
}

function label(g,x,y,str,opts){
  opts=opts||{};
  var t=el('text',{x:x,y:y,'text-anchor':opts.ta||'start','dominant-baseline':opts.db||'middle'});
  if(opts.cls)t.setAttribute('class',opts.cls);
  t.appendChild(tspanEl(str,x,y,opts));
  g.appendChild(t);
  return t;
}

var mRoots={},mLayers={},mStatus={},mDrawn={},currentModule=0;

/* ===== M1: 全球AI治理全景 ===== */
function m1Draw(){
  var panel=document.getElementById('viz-m1');
  clearNode(panel);
  var svg=el('svg',{viewBox:'0 0 900 480',preserveAspectRatio:'xMidYMid meet'});
  panel.appendChild(svg);
  addDefs(svg,'m1');
  mkMarker(svg,'m1-arr',C_TEAL);
  mRoots.m1=svg;
  mLayers.m1=el('g');
  svg.appendChild(mLayers.m1);
  m1View(0);
}

function m1View(v){
  stopAnim();
  var g=mLayers.m1;
  clearNode(g);
  gridBg(g,900,480,30);
  var sb=document.getElementById('status-m1');
  var btns=document.querySelectorAll('#panel-0 .btn');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',i===v);
  if(v===0){
    setStatText(sb,'三大法域对比 / EU · CN · US · 2026');
    label(g,450,30,'三大法域AI治理框架对比',{ta:'middle',fill:C_TEAL,fs:16,fw:'bold'});
    var cols=[
      {x:30,c:C_TEAL,name:'欧盟 EU',items:['AI法案 2024.08生效','基于风险分级','基本权利导向','统一立法框架','AI办公室执法']},
      {x:320,c:C_RED,name:'中国 CN',items:['生成式AI管理办法','算法备案制度','安全+发展双目标','部门规章体系','网信办主导']},
      {x:610,c:C_BLUE,name:'美国 US',items:['EO 14110 + NIST RMF','行业自律为主','采购规则驱动','分散式治理','无统一联邦法']}
    ];
    for(var ci=0;ci<3;ci++){
      var col=cols[ci];
      box(g,col.x,55,260,50,'',{stroke:col.c,fill:'rgba(0,0,0,0.2)',sw:1.5});
      label(g,col.x+130,80,col.name,{ta:'middle',fill:col.c,fs:15,fw:'bold'});
      for(var ii=0;ii<col.items.length;ii++){
        var iy=125+ii*40;
        box(g,col.x+15,iy,230,32,'',{stroke:col.c,sw:0.8,fill:'rgba(0,0,0,0.15)',rx:5});
        var dot=el('circle',{cx:col.x+30,cy:iy+16,r:3,fill:col.c});
        if(ii===0)dot.setAttribute('class','apulse');
        g.appendChild(dot);
        label(g,col.x+42,iy+16,col.items[ii],{fill:C_T2,fs:11});
      }
    }
    box(g,30,360,840,70,'',{stroke:C_BD2,dash:'4 4',fill:'rgba(0,0,0,0.1)',rx:8});
    label(g,60,385,'监管力度',{fill:C_T3,fs:11});
    label(g,60,405,'EU: ★★★★★  CN: ★★★★☆  US: ★★★☆☆',{fill:C_T2,fs:11});
    label(g,340,385,'执行阶段',{fill:C_T3,fs:11});
    label(g,340,405,'EU: 全面执行  CN: 深度实施  US: 行政推进',{fill:C_T2,fs:11});
    label(g,640,385,'罚款上限',{fill:C_T3,fs:11});
    label(g,640,405,'EU: 营收7%  CN: 违法所得10倍  US: 合同取消',{fill:C_T2,fs:11});
  }else if(v===1){
    setStatText(sb,'治理演进 / 2020—2026 时间线');
    label(g,450,30,'全球AI治理演进时间线',{ta:'middle',fill:C_TEAL,fs:16,fw:'bold'});
    arrow(g,80,260,840,260,C_BD2,{sw:2});
    var years=[2020,2021,2022,2023,2024,2025,2026];
    var events={
      eu:[[2021,'AI法案提案'],[2024,'AI法案通过'],[2025,'禁止条款生效'],[2026,'高风险义务']],
      cn:[[2021,'算法推荐管理'],[2023,'生成式AI办法'],[2024,'深度合成新规'],[2025,'算法备案2.0']],
      us:[[2022,'AI权利蓝图'],[2023,'EO 14110签署'],[2024,'NIST RMF 1.0'],[2025,'联邦采购规则']]
    };
    for(var yi=0;yi<years.length;yi++){
      var yx=80+yi*(760/6);
      var yc=el('circle',{cx:yx,cy:260,r:4,fill:C_BD2});
      g.appendChild(yc);
      label(g,yx,285,String(years[yi]),{ta:'middle',fill:C_T3,fs:11});
    }
    var euColors=[C_TEAL,C_RED,C_BLUE];
    var groups=[
      {data:events.eu,ycolor:C_TEAL,dir:-1,baseY:200},
      {data:events.cn,ycolor:C_RED,dir:-1,baseY:160},
      {data:events.us,ycolor:C_BLUE,dir:1,baseY:320}
    ];
    for(var gi=0;gi<3;gi++){
      var grp=groups[gi];
      label(g,30,grp.baseY,gi===0?'EU':(gi===1?'CN':'US'),{fill:grp.ycolor,fs:11,fw:'bold'});
      for(var ei=0;ei<grp.data.length;ei++){
        var ey=80+(grp.data[ei][0]-2020)*(760/6);
        var eyy=grp.baseY+ei*20*(gi===2?-1:1);
        arrow(g,ey,260,ey,eyy,grp.ycolor,{sw:1,dash:'3 3'});
        var ec=el('circle',{cx:ey,cy:eyy,r:4,fill:grp.ycolor});
        if(ei===0)ec.setAttribute('class','apulse');
        g.appendChild(ec);
        label(g,ey+8,eyy,grp.data[ei][1],{fill:C_T2,fs:10});
      }
    }
    var pdot=el('circle',{cx:80,cy:260,r:6,fill:C_TEAL,class:'apulse'});
    g.appendChild(pdot);
    var px=80;
    startAnim(function(){
      px+=3;
      if(px>840)px=80;
      pdot.setAttribute('cx',px);
    },30);
    box(g,30,440,840,30,'',{stroke:C_BD2,fill:'rgba(0,0,0,0.1)',rx:6});
    label(g,450,455,'2020—2026：全球AI治理从倡议走向强执行',{ta:'middle',fill:C_T3,fs:11});
  }else if(v===2){
    setStatText(sb,'风险分级体系 / Risk Tiering');
    label(g,450,30,'AI风险分级体系',{ta:'middle',fill:C_TEAL,fs:16,fw:'bold'});
    var tiers=[
      {y:60,c:C_RED,name:'不可接受风险',tag:'禁止',ex:'社会评分 · 实时生物识别 · 操纵性AI',burden:100},
      {y:130,c:C_AMBER,name:'高风险',tag:'严格合规',ex:'医疗 · 教育 · 执法 · 就业 · 信用评估',burden:80},
      {y:200,c:C_CYAN,name:'有限风险',tag:'透明度义务',ex:'聊天机器人 · 深度伪造 · 情感识别',burden:40},
      {y:270,c:C_GREEN,name:'最小风险',tag:'自愿合规',ex:'垃圾邮件过滤 · 库存管理 · 视频游戏',burden:15},
      {y:340,c:C_DIM,name:'无风险',tag:'无义务',ex:'普通软件 · 传统IT系统',burden:0}
    ];
    for(var ti=0;ti<tiers.length;ti++){
      var tr=tiers[ti];
      box(g,50,tr.y,500,56,'',{stroke:tr.c,sw:1.2,fill:'rgba(0,0,0,0.15)',rx:8});
      box(g,50,tr.y,90,56,tr.tag,{stroke:tr.c,fill:tr.c,tf:C_T2,fs:11,fw:'bold'});
      label(g,160,tr.y+18,tr.name,{fill:tr.c,fs:13,fw:'bold'});
      label(g,160,tr.y+40,tr.ex,{fill:C_T3,fs:10});
      var bw=tr.burden*2.5;

    var m=MODULES[i];
    html+='<div class="module-panel" id="panel-'+i+'">';
    html+='<div class="m-head"><span class="num">'+m.num+'</span><h2>'+m.name+'</h2><span class="sub">/ '+m.id.toUpperCase()+'</span></div>';
    html+='<p class="m-desc">'+m.desc+'</p>';
    html+='<div class="ctrl-row">';
    for(var j=0;j<m.views.length;j++){
      html+='<button class="btn'+(j===0?' active':'')+'" onclick="MODULES['+i+'].view('+j+')">'+m.views[j]+'</button>';
    }
    html+='</div>';
    html+='<div class="viz-wrap" id="viz-'+m.id+'"></div>';
    html+='<div class="status-bar"><span class="stat-pill" id="status-'+m.id+'"></span></div>';
    html+='<div class="info-grid">';
    for(var k=0;k<m.info.length;k++){
      html+='<div class="info-card"><h4>'+m.info[k].t+'</h4><p>'+m.info[k].d+'</p></div>';
    }
    html+='</div>';
    html+='</div>';
  }
  stage.innerHTML=html;
}

function switchModule(index){
  stopAnim();
  currentModule=index;
  var panels=document.querySelectorAll('.module-panel');
  for(var i=0;i<panels.length;i++)panels[i].classList.remove('active');
  var panel=document.getElementById('panel-'+index);
  if(panel)panel.classList.add('active');
  var navBtns=document.querySelectorAll('.nav-btn');
  for(var i2=0;i2<navBtns.length;i2++)navBtns[i2].classList.toggle('active',i2===index);
  if(!mDrawn[index]){
    MODULES[index].draw();
    mDrawn[index]=true;
  }else{
    MODULES[index].view(0);
  }
}

(function(){
  var navInner=document.getElementById('nav-inner');
  if(!navInner)return;
  for(var i=0;i<MODULES.length;i++){
    var btn=document.createElement('button');
    btn.className='nav-btn';
    btn.innerHTML='<span class="nidx">'+MODULES[i].num+'</span><span>'+MODULES[i].short+'</span>';
    btn.onclick=(function(idx){return function(){switchModule(idx);};})(i);
    navInner.appendChild(btn);
  }
})();

document.addEventListener('DOMContentLoaded',function(){
  buildPanels();
  switchModule(0);
});
</script>
</body>
</html>
