<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TW Quiz · 知识挑战</title>
<meta name="description" content="90道计算机科学与AI知识挑战题，4大分类3个难度，覆盖世界模型、AI Agent、端侧AI、AI for Science等前沿主题，即时反馈与解析">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%237c5cff' stroke-width='2'/%3E%3Cpath d='M11 16l4 4l7-8' fill='none' stroke='%237c5cff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#7c5cff;
  --correct:#34d399;--wrong:#f87171;
  --radius:8px;
  --mono:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3d45}

header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.92);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
header .logo{font-size:18px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
header .logo span{color:var(--accent)}
header .sep{width:1px;height:20px;background:var(--border2)}
header nav{display:flex;gap:4px}
header nav a{color:var(--text3);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:all .15s;white-space:nowrap}
header nav a:hover{color:var(--text);background:var(--bg3)}
header nav a.active{color:var(--text);background:var(--bg3)}
header .spacer{flex:1}
header .stats{font-size:12px;color:var(--text3);white-space:nowrap}
header .stats b{color:var(--text2)}

.hero{padding:48px 24px 24px;text-align:center;max-width:1200px;margin:0 auto}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,var(--text) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:16px;color:var(--text2);max-width:600px;margin:0 auto}

/* Setup screen */
.setup{max-width:600px;margin:0 auto;padding:24px}
.setup h3{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.setup .opt-group{margin-bottom:24px}
.setup .opt-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.setup .opt-btns{display:flex;gap:8px;flex-wrap:wrap}
.setup .opt-btn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;flex:1;min-width:100px;text-align:center}
.setup .opt-btn:hover{border-color:var(--border2);color:var(--text)}
.setup .opt-btn.active{border-color:var(--accent);color:var(--text);background:var(--accent-soft,rgba(124,92,255,.1))}
.start-btn{display:block;margin:24px auto 0;padding:14px 48px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,92,255,.3)}
.start-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* Quiz screen */
.quiz-screen{max-width:700px;margin:0 auto;padding:24px}
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.quiz-progress{font-size:13px;color:var(--text3);font-family:var(--mono)}
.quiz-progress b{color:var(--text)}
.quiz-timer{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:600}
.progress-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:2px;transition:width .3s}

.question-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.question-meta{display:flex;gap:8px;margin-bottom:12px}
.meta-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.question-text{font-size:18px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:8px}
.option{padding:14px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px}
.option:hover{border-color:var(--accent);background:var(--bg2)}
.option .opt-letter{width:28px;height:28px;border-radius:6px;background:var(--bg);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text3);flex-shrink:0}
.option .opt-text{font-size:14px;color:var(--text2)}
.option.correct{border-color:var(--correct);background:rgba(52,211,153,.08)}
.option.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#000}
.option.correct .opt-text{color:var(--correct)}
.option.wrong{border-color:var(--wrong);background:rgba(248,113,113,.08)}
.option.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff}
.option.wrong .opt-text{color:var(--wrong)}
.option.disabled{pointer-events:none;opacity:.6}
.option.disabled.correct,.option.disabled.wrong{opacity:1}

.explanation{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:16px;margin-top:16px;display:none}
.explanation.show{display:block;animation:fadeIn .3s}
.explanation .exp-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.explanation .exp-text{font-size:13px;color:var(--text2);line-height:1.6}
.explanation .exp-link{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent);text-decoration:none}
.explanation .exp-link:hover{text-decoration:underline}

.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.nav-btn{padding:10px 20px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,92,255,.3)}

/* Results screen */
.results{max-width:700px;margin:0 auto;padding:24px;text-align:center}
.results-score{font-size:64px;font-weight:800;margin:16px 0}
.results-score.pass{color:var(--correct)}
.results-score.fail{color:var(--wrong)}
.results-msg{font-size:18px;color:var(--text2);margin-bottom:24px}
.results-breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.breakdown-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:left}
.breakdown-card .bc-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.breakdown-card .bc-val{font-size:24px;font-weight:700;color:var(--text)}
.breakdown-card .bc-val small{font-size:14px;color:var(--text3)}
.review-list{text-align:left;margin-bottom:24px}
.review-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.review-item .ri-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.review-item .ri-icon.correct{background:rgba(52,211,153,.2);color:var(--correct)}
.review-item .ri-icon.wrong{background:rgba(248,113,113,.2);color:var(--wrong)}
.review-item .ri-q{font-size:13px;color:var(--text2);flex:1}
.review-item .ri-a{font-size:12px;color:var(--text3)}
.restart-btn{padding:14px 32px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.restart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,92,255,.3)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);color:var(--text3);font-size:12px}
footer a{color:var(--text2);text-decoration:none}
footer a:hover{color:var(--accent)}

@media(max-width:768px){
  header{padding:0 12px;height:48px}
  header nav{display:none}
  .hero{padding:32px 16px 16px}
  .hero h1{font-size:28px}
  .quiz-screen,.setup,.results{padding:16px}
  .question-text{font-size:16px}
  .results-breakdown{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">TW <span>Quiz</span></div>
  <div class="sep"></div>
  <nav>
    <a href="index.html">Hub</a>
    <a href="tw-universe.html">Universe</a>
    <a href="tw-timeline.html">Timeline</a>
    <a href="tw-roadmap.html">Roadmap</a>
    <a href="tw-compare.html">Compare</a>
    <a href="tw-quiz.html" class="active">Quiz</a>
  </nav>
  <div class="spacer"></div>
  <div class="stats"><b id="qCount">0</b> 题</div>
</header>

<section class="hero">
  <h1>知识挑战</h1>
  <p class="sub">90 道计算机科学与 AI 知识题，4 大分类 3 个难度，覆盖世界模型、AI Agent、端侧 AI、数据库内核、AI for Science 等前沿主题。测试你的知识储备，每题附带详细解析。</p>
</section>

<!-- Setup Screen -->
<div class="setup" id="setupScreen">
  <h3>选择挑战模式</h3>
  <div class="opt-group">
    <div class="opt-label">分类</div>
    <div class="opt-btns" id="catBtns">
      <button class="opt-btn active" data-cat="all">全部</button>
      <button class="opt-btn" data-cat="ai">AI / ML</button>
      <button class="opt-btn" data-cat="systems">系统</button>
      <button class="opt-btn" data-cat="theory">理论</button>
      <button class="opt-btn" data-cat="cross">交叉</button>
    </div>
  </div>
  <div class="opt-group">
    <div class="opt-label">难度</div>
    <div class="opt-btns" id="lvlBtns">
      <button class="opt-btn active" data-lvl="0">全部</button>
      <button class="opt-btn" data-lvl="1">入门</button>
      <button class="opt-btn" data-lvl="2">进阶</button>
      <button class="opt-btn" data-lvl="3">专家</button>
    </div>
  </div>
  <div class="opt-group">
    <div class="opt-label">题量</div>
    <div class="opt-btns" id="numBtns">
      <button class="opt-btn" data-num="5">5 题</button>
      <button class="opt-btn active" data-num="10">10 题</button>
      <button class="opt-btn" data-num="20">20 题</button>
      <button class="opt-btn" data-num="0">全部</button>
    </div>
  </div>
  <button class="start-btn" id="startBtn">开始挑战</button>
</div>

<!-- Quiz Screen -->
<div class="quiz-screen" id="quizScreen" style="display:none">
  <div class="quiz-header">
    <div class="quiz-progress">第 <b id="curQ">1</b> / <span id="totalQ">10</span> 题</div>
    <div class="quiz-timer" id="timer">00:00</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progFill" style="width:10%"></div></div>
  <div id="quizContent"></div>
  <div class="quiz-nav">
    <button class="nav-btn" id="prevBtn" disabled>上一题</button>
    <button class="nav-btn primary" id="nextBtn">下一题</button>
  </div>
</div>

<!-- Results Screen -->
<div class="results" id="resultsScreen" style="display:none">
  <div class="results-score" id="finalScore">0</div>
  <div class="results-msg" id="finalMsg"></div>
  <div class="results-breakdown" id="breakdown"></div>
  <div class="review-list" id="reviewList"></div>
  <button class="restart-btn" id="restartBtn">再战一局</button>
</div>

<footer>
  <p>TW Quiz · 零依赖知识挑战系统 · <a href="https://wangzifan396-wzf.github.io/TW/">返回 Hub</a></p>
</footer>

<script>
var QUESTIONS = [
  {
    "q": "Transformer 架构的核心创新是什么？",
    "opts": [
      "循环连接",
      "自注意力机制",
      "卷积操作",
      "池化层"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "transformer-viz-lab",
    "exp": "Transformer 用自注意力替代了RNN的循环结构，允许并行计算和更好的长程依赖建模。"
  },
  {
    "q": "RAG 的主要作用是什么？",
    "opts": [
      "加速训练",
      "检索外部知识增强生成",
      "减小模型参数",
      "优化推理速度"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "rag-viz-lab",
    "exp": "RAG 通过检索外部知识库中的相关信息，增强LLM的回答准确性和时效性。"
  },
  {
    "q": "GAN 中的生成器和判别器是什么关系？",
    "opts": [
      "合作关系",
      "竞争关系",
      "串联关系",
      "独立运行"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "generative-viz-lab",
    "exp": "生成器和判别器进行对抗训练（minimax博弈），生成器试图欺骗判别器，判别器试图区分真假。"
  },
  {
    "q": "RLHF 中的 \"HF\" 代表什么？",
    "opts": [
      "High Fidelity",
      "Human Feedback",
      "Hidden Feature",
      "Hybrid Function"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "rlhf-viz-lab",
    "exp": "RLHF = Reinforcement Learning from Human Feedback，使用人类偏好数据训练奖励模型来优化LLM。"
  },
  {
    "q": "BERT 的预训练任务是什么？",
    "opts": [
      "因果语言建模",
      "掩码语言建模",
      "对比学习",
      "机器翻译"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "nlp-viz-lab",
    "exp": "BERT 使用掩码语言建模(MLM)，随机遮盖token让模型预测，从而学习双向表示。"
  },
  {
    "q": "Diffusion 模型的基本原理是什么？",
    "opts": [
      "对抗生成",
      "逐步去噪",
      "序列预测",
      "特征匹配"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "diffusion-viz-lab",
    "exp": "扩散模型通过前向过程逐步加噪，反向过程学习从噪声中逐步去噪来生成图像。"
  },
  {
    "q": "LoRA 微调的核心思想是什么？",
    "opts": [
      "冻结全部参数",
      "用低秩矩阵近似权重更新",
      "量化模型",
      "剪枝"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "finetune-viz-lab",
    "exp": "LoRA 将权重更新分解为两个低秩矩阵的乘积，大幅减少可训练参数数量。"
  },
  {
    "q": "MoE 架构的主要优势是什么？",
    "opts": [
      "减少总参数量",
      "稀疏激活提高推理效率",
      "简化训练",
      "减小模型"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 1,
    "project": "moe-viz-lab",
    "exp": "MoE 只激活部分专家网络，在保持大参数容量的同时减少实际计算量。"
  },
  {
    "q": "KV-Cache 在 Transformer 推理中的作用是什么？",
    "opts": [
      "减少内存",
      "缓存已计算的注意力键值避免重复计算",
      "加速训练",
      "存储梯度"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 2,
    "project": "inference-viz-lab",
    "exp": "KV-Cache 缓存之前token的Key和Value矩阵，避免在自回归生成时重复计算，显著加速推理。"
  },
  {
    "q": "PPO 中的 clip 机制是为了解决什么问题？",
    "opts": [
      "梯度消失",
      "策略更新过大",
      "内存不足",
      "过拟合"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 2,
    "project": "rlhf-viz-lab",
    "exp": "PPO 使用clip限制策略更新幅度，防止新旧策略差异过大导致训练不稳定。"
  },
  {
    "q": "Attention 的计算复杂度是？",
    "opts": [
      "O(n)",
      "O(n log n)",
      "O(n²)",
      "O(n³)"
    ],
    "ans": 2,
    "cat": "ai",
    "level": 2,
    "project": "transformer-viz-lab",
    "exp": "标准自注意力的计算复杂度为O(n²d)，n是序列长度，d是维度，这也是长序列处理的瓶颈。"
  },
  {
    "q": "CLIP 模型的训练目标是什么？",
    "opts": [
      "生成图像",
      "图文对比学习",
      "图像分类",
      "文本生成"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 2,
    "project": "multimodal-viz-lab",
    "exp": "CLIP 使用对比学习，在batch内拉近匹配的图文对，推远不匹配的图文对，学习统一表示空间。"
  },
  {
    "q": "HNSW 算法属于哪类向量索引？",
    "opts": [
      "哈希索引",
      "图索引",
      "树索引",
      "暴力搜索"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 2,
    "project": "vector-db-viz-lab",
    "exp": "HNSW (Hierarchical Navigable Small World) 是基于图的近似最近邻搜索算法，通过层次化图结构实现高效检索。"
  },
  {
    "q": "ZeRO 优化主要解决什么问题？",
    "opts": [
      "计算效率",
      "显存不足",
      "网络带宽",
      "数据加载"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 2,
    "project": "training-sys-viz-lab",
    "exp": "ZeRO 通过将优化器状态、梯度和参数分片到多个GPU上，显著减少单卡显存需求。"
  },
  {
    "q": "ResNet 的残差连接解决了什么问题？",
    "opts": [
      "梯度消失",
      "参数过多",
      "推理慢",
      "训练数据不足"
    ],
    "ans": 0,
    "cat": "ai",
    "level": 2,
    "project": "cv-viz-lab",
    "exp": "残差连接让梯度可以直接通过跳跃连接传播，解决了深层网络训练中的梯度消失问题。"
  },
  {
    "q": "DPO 相比 PPO 的主要优势是什么？",
    "opts": [
      "效果更好",
      "无需训练奖励模型和Critic",
      "训练更快",
      "模型更小"
    ],
    "ans": 1,
    "cat": "ai",
    "level": 2,
    "project": "rlhf-viz-lab",
    "exp": "DPO 直接从偏好数据优化策略，省去了训练奖励模型和Critic网络的步骤，大幅简化了RLHF流程。"
  },
  {
    "q": "Flash Attention 的核心优化策略是什么？",

  document.getElementById("nextBtn").addEventListener("click", nextQuestion);
  document.getElementById("restartBtn").addEventListener("click", function(){
    document.getElementById("resultsScreen").style.display = "none";
    document.getElementById("setupScreen").style.display = "block";
  });
}

function startQuiz(){
  // Filter questions
  var filtered = QUESTIONS.filter(function(q){
    if(selCat !== "all" && q.cat !== selCat) return false;
    if(selLvl > 0 && q.level !== selLvl) return false;
    return true;
  });

  // Shuffle
  for(var i = filtered.length-1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = filtered[i]; filtered[i] = filtered[j]; filtered[j] = tmp;
  }

  // Limit
  if(selNum > 0 && filtered.length > selNum) filtered = filtered.slice(0, selNum);

  quizQuestions = filtered;
  currentIdx = 0;
  answers = new Array(filtered.length).fill(null);
  startTime = Date.now();

  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  document.getElementById("totalQ").textContent = filtered.length;

  // Timer
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);

  renderQuestion();
}

function updateTimer(){
  var elapsed = Math.floor((Date.now() - startTime) / 1000);
  var m = Math.floor(elapsed / 60);
  var s = elapsed % 60;
  document.getElementById("timer").textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function renderQuestion(){
  var q = quizQuestions[currentIdx];
  answered = answers[currentIdx] !== null;

  document.getElementById("curQ").textContent = currentIdx + 1;
  document.getElementById("progFill").style.width = ((currentIdx+1) / quizQuestions.length * 100) + "%";

  var content = document.getElementById("quizContent");
  var color = CAT_COLORS[q.cat];
  var lvlColor = LEVEL_COLORS[q.level];

  var optsHtml = q.opts.map(function(opt, i){
    var cls = "option";
    var letter = String.fromCharCode(65 + i);
    if(answered){
      cls += " disabled";
      if(i === q.ans) cls += " correct";
      if(i === answers[currentIdx] && i !== q.ans) cls += " wrong";
    }
    return '<div class="'+cls+'" data-idx="'+i+'"><div class="opt-letter">'+letter+'</div><div class="opt-text">'+opt+'</div></div>';
  }).join("");

  var expHtml = "";
  if(answered){
    expHtml = '<div class="explanation show"><div class="exp-label">解析</div><div class="exp-text">'+q.exp+'</div>';
    if(q.project){
      expHtml += '<a class="exp-link" href="'+BASE+q.project+'/" target="_blank">深入学习 → '+q.project+'</a>';
    }
    expHtml += '</div>';
  }

  content.innerHTML =
    '<div class="question-card">'+
      '<div class="question-meta">'+
        '<span class="meta-badge" style="background:'+color+'22;color:'+color+'">'+CAT_NAMES[q.cat]+'</span>'+
        '<span class="meta-badge" style="background:'+lvlColor+'22;color:'+lvlColor+'">'+LEVEL_NAMES[q.level]+'</span>'+
      '</div>'+
      '<div class="question-text">'+q.q+'</div>'+
      '<div class="options">'+optsHtml+'</div>'+
      expHtml+
    '</div>';

  // Bind option clicks
  content.querySelectorAll(".option").forEach(function(el){
    el.addEventListener("click", function(){
      if(answered) return;
      var idx = parseInt(this.dataset.idx);
      answers[currentIdx] = idx;
      answered = true;
      renderQuestion();
    });
  });

  // Nav buttons
  document.getElementById("prevBtn").disabled = currentIdx === 0;
  var nextBtn = document.getElementById("nextBtn");
  if(currentIdx === quizQuestions.length - 1){
    nextBtn.textContent = "查看结果";
  } else {
    nextBtn.textContent = "下一题";
  }
  nextBtn.disabled = !answered;
}

function prevQuestion(){
  if(currentIdx > 0){
    currentIdx--;
    renderQuestion();
  }
}

function nextQuestion(){
  if(!answered) return;
  if(currentIdx < quizQuestions.length - 1){
    currentIdx++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults(){
  clearInterval(timerInterval);
  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("resultsScreen").style.display = "block";

  var correct = 0;
  for(var i = 0; i < quizQuestions.length; i++){
    if(answers[i] === quizQuestions[i].ans) correct++;
  }
  var pct = Math.round(correct / quizQuestions.length * 100);

  var scoreEl = document.getElementById("finalScore");
  scoreEl.textContent = pct + "%";
  scoreEl.className = "results-score " + (pct >= 60 ? "pass" : "fail");

  var msg = "";
  if(pct === 100) msg = "完美！你是真正的专家！";
  else if(pct >= 80) msg = "优秀！知识储备扎实";
  else if(pct >= 60) msg = "不错！继续加油";
  else if(pct >= 40) msg = "还需要更多学习";
  else msg = "别灰心，多看看 viz-lab 项目";
  document.getElementById("finalMsg").textContent = msg;

  // Breakdown
  var elapsed = Math.floor((Date.now() - startTime) / 1000);
  var m = Math.floor(elapsed / 60), s = elapsed % 60;
  var timeStr = m + "分" + s + "秒";

  // Category breakdown
  var catStats = {};
  quizQuestions.forEach(function(q, i){
    if(!catStats[q.cat]) catStats[q.cat] = {total:0, correct:0};
    catStats[q.cat].total++;
    if(answers[i] === q.ans) catStats[q.cat].correct++;
  });

  var bdHtml =
    '<div class="breakdown-card"><div class="bc-label">正确率</div><div class="bc-val">'+correct+'<small>/'+quizQuestions.length+'</small></div></div>'+
    '<div class="breakdown-card"><div class="bc-label">用时</div><div class="bc-val">'+timeStr+'</div></div>';

  Object.keys(catStats).forEach(function(cat){
    var cs = catStats[cat];
    bdHtml += '<div class="breakdown-card"><div class="bc-label">'+CAT_NAMES[cat]+'</div><div class="bc-val">'+cs.correct+'<small>/'+cs.total+'</small></div></div>';
  });

  document.getElementById("breakdown").innerHTML = bdHtml;

  // Review list
  var reviewHtml = "";
  quizQuestions.forEach(function(q, i){
    var isCorrect = answers[i] === q.ans;
    var userAns = answers[i] !== null ? q.opts[answers[i]] : "未作答";
    var correctAns = q.opts[q.ans];
    reviewHtml +=
      '<div class="review-item">'+
        '<div class="ri-icon '+(isCorrect?'correct':'wrong')+'">'+(isCorrect?'✓':'✗')+'</div>'+
        '<div class="ri-q">'+q.q+'</div>'+
        '<div class="ri-a">'+(isCorrect?'正确':'你的答案: '+userAns+' | 正确: '+correctAns)+'</div>'+
      '</div>';
  });
  document.getElementById("reviewList").innerHTML = reviewHtml;

  // Save to localStorage
  var history = [];
  try{history = JSON.parse(localStorage.getItem("tw_quiz_history") || "[]")}catch(e){}
  history.push({date: new Date().toISOString(), score: pct, correct: correct, total: quizQuestions.length, time: elapsed, cat: selCat, lvl: selLvl});
  if(history.length > 20) history = history.slice(-20);
  localStorage.setItem("tw_quiz_history", JSON.stringify(history));
}

init();
</script>
</body>
</html>
