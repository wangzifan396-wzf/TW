<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI原生教育与人才重构可视化实验室</title>
<style>
:root {
  --bg: #0a0b0f;
  --bg2: #12141c;
  --bg3: #1a1d28;
  --panel: #14161f;
  --teal: #00d4aa;
  --teal-dim: #00a888;
  --teal-deep: #007a63;
  --teal-glow: rgba(0,212,170,0.35);
  --text: #e0e6ed;
  --text-dim: #8a94a6;
  --text-faint: #5a6478;
  --border: #2a2f3d;
  --border-bright: #3a4055;
  --accent: #ff6b6b;
  --warn: #ffd166;
  --blue: #4dabf7;
  --purple: #b197fc;
  --orange: #ff922b;
  --mono: 'Courier New', Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,11,15,0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 38px; height: 38px;
  border: 1.5px solid var(--teal);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--teal);
  font-family: var(--mono);
  font-weight: bold;
  font-size: 15px;
  box-shadow: 0 0 14px var(--teal-glow);
  flex-shrink: 0;
}
.brand-title { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
.brand-sub { font-size: 11px; color: var(--text-dim); font-family: var(--mono); letter-spacing: 0.5px; }
.header-meta { font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-align: right; }
.header-meta span { color: var(--teal); }
nav.module-nav { background: var(--bg2); border-bottom: 1px solid var(--border); }
.nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 16px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 2px;
}
.nav-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 11px 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  font-family: inherit;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--text); background: var(--bg3); }
.nav-btn.active { color: var(--teal); border-bottom-color: var(--teal); background: var(--bg3); }
.nav-btn .nav-num { display: block; font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-bottom: 3px; }
.nav-btn.active .nav-num { color: var(--teal-dim); }
main { max-width: 1280px; margin: 0 auto; padding: 24px; }
.module { display: none; }
.module.active { display: block; animation: fadeUp 0.5s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.module-head { margin-bottom: 20px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.module-title { font-size: 22px; font-weight: 700; color: var(--text); }
.module-title .tag {
  font-family: var(--mono); font-size: 13px; color: var(--teal);
  background: var(--bg3); border: 1px solid var(--border-bright);
  padding: 2px 8px; border-radius: 4px; margin-right: 10px; vertical-align: middle;
}
.module-desc { font-size: 13px; color: var(--text-dim); margin-top: 6px; max-width: 620px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.ctrl-label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-right: 4px; letter-spacing: 1px; }
.ctrl-btn {
  background: var(--bg3); border: 1px solid var(--border-bright); color: var(--text-dim);
  padding: 6px 14px; font-size: 12px; border-radius: 4px; cursor: pointer;
  transition: all 0.15s; font-family: inherit;
}
.ctrl-btn:hover { border-color: var(--teal-dim); color: var(--text); }
.ctrl-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); font-weight: 600; }
.viz-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; position: relative; }
.viz-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--teal), transparent); opacity: 0.5; z-index: 1; }
.svg-wrap { padding: 16px; display: flex; justify-content: center; }
.svg-wrap svg { width: 100%; max-width: 920px; height: auto; display: block; }
.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; border-top: 1px solid var(--border); background: var(--bg2);
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
}
.status-bar .stat-val { color: var(--teal); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-right: 6px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.info-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; transition: border-color 0.2s; }
.info-card:hover { border-color: var(--teal-dim); }
.info-card .ic-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; }
.info-card .ic-value { font-size: 22px; font-weight: 700; color: var(--teal); margin-top: 4px; }
.info-card .ic-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
footer { max-width: 1280px; margin: 30px auto 0; padding: 20px 24px 40px; font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-align: center; border-top: 1px solid var(--border); }
@media (max-width: 900px) { .nav-inner { grid-template-columns: repeat(4, 1fr); } .header-meta { display: none; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">AE</div>
      <div>
        <div class="brand-title">AI原生教育与人才重构可视化实验室</div>
        <div class="brand-sub">AI NATIVE EDUCATION / TALENT RESTRUCTURING / VIZ LAB</div>
      </div>
    </div>
    <div class="header-meta">
      <div>SYSTEM <span id="sys-status">ONLINE</span></div>
      <div>MODULES <span>08</span> / ACTIVE <span id="active-mod">01</span></div>
    </div>
  </div>
  <nav class="module-nav"><div class="nav-inner" id="nav-container"></div></nav>
</header>
<main id="main-content"></main>
<footer>AI NATIVE EDUCATION AND TALENT RESTRUCTURING VISUALIZATION LABORATORY / ZERO-DEPENDENCY SINGLE FILE / SVG POWERED / 08 MODULES</footer>
<script>
"use strict";
/* ============================================================
   UTILITY FUNCTIONS (exact specification)
   ============================================================ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* HTML element helper */
function el2(tag, attrs, parent) {
  var e = document.createElement(tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}

/* Animation management */
var animTimers = [];
function addAnim(fn, ms) { var id = setInterval(fn, ms || 33); animTimers.push(id); return id; }
function clearAnims() { animTimers.forEach(function(id) { clearInterval(id); }); animTimers = []; }

/* Shared SVG helpers */
function svgDefs(svg) {
  var defs = el("defs", {}, svg);
  var g1 = el("linearGradient", { id: "grad-teal", x1: "0", y1: "0", x2: "1", y2: "0" }, defs);
  el("stop", { offset: "0%", "stop-color": "#00d4aa", "stop-opacity": "0.9" }, g1);
  el("stop", { offset: "100%", "stop-color": "#007a63", "stop-opacity": "0.9" }, g1);
  var g2 = el("linearGradient", { id: "grad-blue", x1: "0", y1: "0", x2: "1", y2: "0" }, defs);
  el("stop", { offset: "0%", "stop-color": "#4dabf7", "stop-opacity": "0.9" }, g2);
  el("stop", { offset: "100%", "stop-color": "#1c7ed6", "stop-opacity": "0.9" }, g2);
  var g3 = el("linearGradient", { id: "grad-v", x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
  el("stop", { offset: "0%", "stop-color": "#00d4aa", "stop-opacity": "0.7" }, g3);
  el("stop", { offset: "100%", "stop-color": "#00d4aa", "stop-opacity": "0.1" }, g3);
  var f1 = el("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
  el("feGaussianBlur", { stdDeviation: "2.5", result: "blur" }, f1);
  var fm = el("feMerge", {}, f1);
  el("feMergeNode", { in: "blur" }, fm);
  el("feMergeNode", { in: "SourceGraphic" }, fm);
  return defs;
}
function drawGrid(svg, w, h) {
  var g = el("g", { opacity: "0.05" }, svg);
  for (var x = 0; x <= w; x += 40) { el("line", { x1: x, y1: 0, x2: x, y2: h, stroke: "#00d4aa", "stroke-width": "0.5" }, g); }
  for (var y = 0; y <= h; y += 40) { el("line", { x1: 0, y1: y, x2: w, y2: y, stroke: "#00d4aa", "stroke-width": "0.5" }, g); }
}
function svgTitle(svg, title, sub) {
  tspanEl(450, 34, title, svg, { "text-anchor": "middle", fill: "#e0e6ed", "font-size": "17", "font-weight": "700" });
  if (sub) tspanEl(450, 54, sub, svg, { "text-anchor": "middle", fill: "#8a94a6", "font-size": "12" });
}
function rrect(x, y, w, h, r, fill, stroke, parent) {
  return el("rect", { x: x, y: y, width: w, height: h, rx: r, ry: r, fill: fill, stroke: stroke || "none", "stroke-width": stroke ? "1.5" : "0" }, parent);
}
function setActiveBtn(ctrlId, v) {
  var btns = document.getElementById(ctrlId).querySelectorAll(".ctrl-btn");
  for (var i = 0; i < btns.length; i++) {
    if (i === v) btns[i].classList.add("active");
    else btns[i].classList.remove("active");
  }
}
function buildCtrl(modId, labels, viewFn) {
  var ctrl = document.getElementById(modId + "-ctrl");
  clearNode(ctrl);
  var lab = el2("span", { class: "ctrl-label" }, ctrl);
  lab.textContent = "VIEW:";
  labels.forEach(function(name, i) {
    var btn = el2("button", { class: "ctrl-btn" + (i === 0 ? " active" : "") }, ctrl);
    btn.textContent = name;
    btn.onclick = function() { viewFn(i); };
  });
}
function svgFrame(svg, w, h) {
  svgDefs(svg);
  drawGrid(svg, w, h);
  el("rect", { x: 0.5, y: 0.5, width: w - 1, height: h - 1, fill: "none", stroke: "#2a2f3d", "stroke-width": "1", rx: "6" }, svg);
}

/* ============================================================
   M1: 教育范式变革
   ============================================================ */
function m1Draw() { buildCtrl("m1", ["范式对比", "能力迁移", "时代演进"], m1View); m1View(0); }
function m1View(v) {
  var svg = document.getElementById("m1-svg");
  clearNode(svg); clearAnims();
  svgFrame(svg, 900, 480);
  svgTitle(svg, "教育范式变革", "从给定问题找答案到架构型人才培养");
  if (v === 0) m1Compare(svg); else if (v === 1) m1Ability(svg); else m1Timeline(svg);
  setActiveBtn("m1", v);
  var stats = [
    "COMPARE | TRADITIONAL vs AI-NATIVE | PARADIGM SHIFT",
    "ABILITY | 6 SKILL AXES | MIGRATION HEATMAP",
    "TIMELINE | 4 ERAS | EVOLUTION FROM ANSWER-SEEKING TO ARCHITECTING"
  ];
  setStatText(document.getElementById("m1-stat"), stats[v]);
}
function m1Compare(svg) {
  var leftBox = { x: 60, y: 90, w: 340, h: 320 };
  var rightBox = { x: 500, y: 90, w: 340, h: 320 };
  el("rect", { x: leftBox.x, y: leftBox.y, width: leftBox.w, height: leftBox.h, fill: "#12141c", stroke: "#ff922b", "stroke-width": "1.5", rx: "8" }, svg);
  el("rect", { x: leftBox.x, y: leftBox.y, width: leftBox.w, height: 36, fill: "#ff922b", opacity: "0.12", rx: "8" }, svg);
  tspanEl(leftBox.x + leftBox.w / 2, leftBox.y + 24, "传统教育范式", svg, { "text-anchor": "middle", fill: "#ff922b", "font-size": "14", "font-weight": "700" });
  var leftItems = ["给定问题, 寻找标准答案", "知识记忆与应试训练", "单一学科深度培养", "执行者角色定位", "标准化考核体系"];
  leftItems.forEach(function(item, i) {
    var iy = leftBox.y + 60 + i * 44;
    el("circle", { cx: leftBox.x + 24, cy: iy, r: 4, fill: "#ff922b" }, svg);
    tspanEl(leftBox.x + 38, iy + 4, item, svg, { fill: "#8a94a6", "font-size": "12" });
  });
  el("rect", { x: rightBox.x, y: rightBox.y, width: rightBox.w, height: rightBox.h, fill: "#12141c", stroke: "#00d4aa", "stroke-width": "1.5", rx: "8" }, svg);
  el("rect", { x: rightBox.x, y: rightBox.y, width: rightBox.w, height: 36, fill: "#00d4aa", opacity: "0.12", rx: "8" }, svg);
  tspanEl(rightBox.x + rightBox.w / 2, rightBox.y + 24, "AI原生教育范式", svg, { "text-anchor": "middle", fill: "#00d4aa", "font-size": "14", "font-weight": "700" });
  var rightItems = ["定义问题, 架构解决方案", "意图表达与系统设计", "跨学科交叉融合", "架构师角色定位", "过程证据与能力评估"];
  rightItems.forEach(function(item, i) {
    var iy = rightBox.y + 60 + i * 44;
    el("circle", { cx: rightBox.x + 24, cy: iy, r: 4, fill: "#00d4aa" }, svg);
    tspanEl(rightBox.x + 38, iy + 4, item, svg, { fill: "#e0e6ed", "font-size": "12" });
  });
  var arrowY = 250;
  el("line", { x1: 410, y1: arrowY, x2: 486, y2: arrowY, stroke: "#00d4aa", "stroke-width": "2", opacity: "0.6" }, svg);
  el("polygon", { points: "486,243 500,250 486,257", fill: "#00d4aa" }, svg);
  tspanEl(450, arrowY - 14, "TRANSFORM", svg, { "text-anchor": "middle", fill: "#00d4aa", "font-size": "10", "font-family": "monospace" });
  var particles = [];
  for (var i = 0; i < 6; i++) {
    var p = el("circle", { cx: 410, cy: arrowY, r: 2.5, fill: "#00d4aa", filter: "url(#glow)" }, svg);
    particles.push({ node: p, t: i / 6 });
  }
  addAnim(function() {
    particles.forEach(function(p) {
      p.t += 0.008;
      if (p.t > 1) p.t -= 1;
      p.node.setAttribute("cx", 410 + 90 * p.t);
      p.node.setAttribute("opacity", Math.sin(p.t * Math.PI) * 0.9);
    });
  }, 30);
  tspanEl(230, leftBox.y + leftBox.h + 30, "执行型: 问题->答案", svg, { "text-anchor": "middle", fill: "#5a6478", "font-size": "11", "font-family": "monospace" });
  tspanEl(670, rightBox.y + rightBox.h + 30, "架构型: 意图->系统->证据", svg, { "text-anchor": "middle", fill: "#5a6478", "font-size": "11", "font-family": "monospace" });
  tspanEl(450, 460, "智源大会首次提出AI Native教育: 从寻找答案转向架构解决方案", svg, { "text-anchor": "middle", fill: "#5a6478", "font-size": "11" });
}
function m1Ability(svg) {
  var skills = [
    { name: "记忆复述", trad: 90, ai: 20, color: "#ff922b" },
    { name: "标准解题", trad: 85, ai: 25, color: "#ffd166" },
    { name: "问题定义", trad: 30, ai: 90, color: "#00d4aa" },
    { name: "系统架构", trad: 20, ai: 95, color: "#4dabf7" },
    { name: "跨学科整合", trad: 35, ai: 85, color: "#b197fc" },
    { name: "AI工具调度", trad: 5, ai: 88, color: "#ff922b" }
  ];
  var cx = 450, cy = 250, maxR = 150;
  el("circle", { cx: cx, cy: cy, r: maxR, fill: "none", stroke: "#2a2f3d", "stroke-width": "1" }, svg);
  el("circle", { cx: cx, cy: cy, r: maxR * 0.66, fill: "none", stroke: "#2a2f3d", "stroke-width": "1", "stroke-dasharray": "3 3" }, svg);
  el("circle", { cx: cx, cy: cy, r: maxR * 0.33, fill: "none", stroke: "#2a2f3d", "stroke-width": "1", "stroke-dasharray": "3 3" }, svg);
  var tradPts = [], aiPts = [];
  skills.forEach(function(s, i) {
    var ang = (i / skills.length) * 2 * Math.PI - Math.PI / 2;
    var tradR = maxR * s.trad / 100;
    var aiR = maxR * s.ai / 100;
    tradPts.push((cx + Math.cos(ang) * tradR) + "," + (cy + Math.sin(ang) * tradR));
    aiPts.push((cx + Math.cos(ang) * aiR) + "," + (cy + Math.sin(ang) * aiR));
    var lx = cx + Math.cos(ang) * (maxR + 40);
    var ly = cy + Math.sin(ang) * (maxR + 40);
    tspanEl(lx, ly + 4, s.name, svg, { "text-anchor": "middle", fill: s.color, "font-size": "11", "font-weight": "600" });
  });
  el("polygon", { points: tradPts.join(" "), fill: "#ff922b", opacity: "0.12", stroke: "#ff922b", "stroke-width": "1.5" }, svg);
  el("polygon", { points: aiPts.join(" "), fill: "#00d4aa", opacity: "0.15", stroke: "#00d4aa", "stroke-width": "1.5" }, svg);
  var aiPoly = el("polygon", { points: aiPts.join(" "), fill: "none", stroke: "#00d4aa", "stroke-width": "2", opacity: "0" }, svg);
  var pulseT = 0;
  addAnim(function() {
    pulseT += 0.03;
    aiPoly.setAttribute("opacity", 0.3 + 0.4 * Math.abs(Math.sin(pulseT)));
  }, 30);
  el("rect", { x: 50, y: 420, width: 10, height: 10, fill: "#ff922b", rx: "2" }, svg);
  tspanEl(66, 429, "传统教育侧重", svg, { fill: "#8a94a6", "font-size": "10", "font-family": "monospace" });
  el("rect", { x: 200, y: 420, width: 10, height: 10, fill: "#00d4aa", rx: "2" }, svg);
  tspanEl(216, 429, "AI原生教育侧重", svg, { fill: "#8a94a6", "font-size": "10", "font-family": "monospace" });
  tspanEl(450, 460, "能力重心从记忆复述转向问题定义与系统架构", svg, { "text-anchor": "middle", fill: "#5a6478", "font-size": "11" });
}
function m1Timeline(svg) {
  var stages = [
    { x: 130, label: "应试教育", sub: "问题->答案", year: "工业时代", color: "#ff922b", desc: "标准化考核" },
    { x: 350, label: "素质教育", sub: "多维能力", year: "信息时代", color: "#ffd166", desc: "综合素养" },
    { x: 570, label: "数字教育", sub: "工具辅助", year: "AI初期", color: "#4dabf7", desc: "数字素养" },
    { x: 790, label: "AI原生教育", sub: "架构培养", year: "AI时代", color: "#00d4aa", desc: "智源大会首提" }
  ];
  el("line", { x1: 90, y1: 260, x2: 830, y2: 260, stroke: "#2a2f3d", "stroke-width": "3" }, svg);
  el("line", { x1: 90, y1: 260, x2: 830, y2: 260, stroke: "#00d4aa", "stroke-width": "1", "stroke-dasharray": "5 5", opacity: "0.4" }, svg);
  el("polygon", { points: "830,253 848,260 830,267", fill: "#00d4aa" }, svg);
  stages.forEach(function(s, i) {
    el("circle", { cx: s.x, cy: 260, r: 26, fill: "#0a0b0f", stroke: s.color, "stroke-width": "2.5", filter: "url(#glow)" }, svg);
    el("circle", { cx: s.x, cy: 260, r: 10, fill: s.color, opacity: "0.85" }, svg);

  ];

  el("circle", { cx: cx, cy: cy, r: 100, fill: "none", stroke: "#2a2f3d", "stroke-width": "1", "stroke-dasharray": "3 3" }, svg);
  el("circle", { cx: cx, cy: cy, r: 50, fill: "none", stroke: "#2a2f3d", "stroke-width": "1", "stroke-dasharray": "3 3" }, svg);

  regions.forEach(function(r, i) {
    var ang = (i / regions.length) * 2 * Math.PI - Math.PI / 2;
    var accR = 150 * r.access / 100;
    var ax = cx + Math.cos(ang) * accR;
    var ay = cy + Math.sin(ang) * accR;
    var next = regions[(i + 1) % regions.length];
    var nextAng = ((i + 1) / regions.length) * 2 * Math.PI - Math.PI / 2;
    var nextAccR = 150 * next.access / 100;
    var nax = cx + Math.cos(nextAng) * nextAccR;
    var nay = cy + Math.sin(nextAng) * nextAccR;
    el("line", { x1: ax, y1: ay, x2: nax, y2: nay, stroke: r.color, "stroke-width": "1", opacity: "0.3" }, svg);
    el("circle", { cx: ax, cy: ay, r: 8, fill: r.color, filter: "url(#glow)" }, svg);
    var lx = cx + Math.cos(ang) * 175;
    var ly = cy + Math.sin(ang) * 175;
    tspanEl(lx, ly + 4, r.name, svg, { "text-anchor": "middle", fill: r.color, "font-size": "11", "font-weight": "600" });

  });
  var accPts = regions.map(function(r, i) {
    var ang = (i / regions.length) * 2 * Math.PI - Math.PI / 2;
    var accR = 150 * r.access / 100;
    return (cx + Math.cos(ang) * accR) + "," + (cy + Math.sin(ang) * accR);
  });
  el("polygon", { points: accPts.join(" "), fill: "#00d4aa", opacity: "0.08", stroke: "#00d4aa", "stroke-width": "1.5" }, svg);
  var pulseT = 0;
  var eqPoly = el("polygon", { points: accPts.join(" "), fill: "none", stroke: "#ff6b6b", "stroke-width": "2", opacity: "0" }, svg);
  addAnim(function() {
    pulseT += 0.03;
    eqPoly.setAttribute("opacity", 0.2 + 0.3 * Math.abs(Math.sin(pulseT)));
  }, 30);
  el("circle", { cx: cx, cy: cy, r: 6, fill: "#00d4aa" }, svg);
  tspanEl(cx, cy + 4, "GAP", svg, { "text-anchor": "middle", fill: "#0a0b0f", "font-size": "8", "font-weight": "700", "font-family": "monospace" });

/* ============================================================
   MODULE DOM BUILDER
   ============================================================ */
function buildModules() {
  var main = document.getElementById("main-content");
  MODULES.forEach(function(mod, idx) {
    var section = el2("section", { class: "module", id: "mod-" + mod.id }, main);
    var head = el2("div", { class: "module-head" }, section);
    var tw = el2("div", {}, head);
    var title = el2("div", { class: "module-title" }, tw);
    var tag = el2("span", { class: "tag" }, title);
    tag.textContent = "M" + (idx + 1);
    title.appendChild(document.createTextNode(mod.name));
    var desc = el2("div", { class: "module-desc" }, tw);
    desc.textContent = mod.desc;
    var ctrl = el2("div", { class: "controls", id: mod.id + "-ctrl" }, section);
    var panel = el2("div", { class: "viz-panel" }, section);
    var svgWrap = el2("div", { class: "svg-wrap" }, panel);
    var svg = el("svg", { viewBox: "0 0 900 480", preserveAspectRatio: "xMidYMid meet" }, svgWrap);
    svg.id = mod.id + "-svg";
    var statusBar = el2("div", { class: "status-bar", id: mod.id + "-bar" }, panel);
    var sl = el2("span", {}, statusBar);
    var dot = el2("span", { class: "status-dot" }, sl);
    sl.appendChild(document.createTextNode("LIVE"));
    var sr = el2("span", { class: "stat-val", id: mod.id + "-stat" }, statusBar);
    setStatText(sr, "INITIALIZING...");
    var info = el2("div", { class: "info-grid", id: mod.id + "-info" }, section);
    mod.cards.forEach(function(c) {
      var card = el2("div", { class: "info-card" }, info);
      var lab = el2("div", { class: "ic-label" }, card);
      lab.textContent = c.label;
      var val = el2("div", { class: "ic-value" }, card);
      val.textContent = c.value;
      var dsc = el2("div", { class: "ic-desc" }, card);
      dsc.textContent = c.desc;
    });
  });
}

/* ============================================================
   MODULE SWITCHING
   ============================================================ */
function switchModule(idx) {
  clearAnims();
  var mods = document.querySelectorAll(".module");
  for (var i = 0; i < mods.length; i++) mods[i].classList.remove("active");
  var mod = MODULES[idx];
  var target = document.getElementById("mod-" + mod.id);
  if (target) target.classList.add("active");
  var navBtns = document.querySelectorAll(".nav-btn");
  for (var j = 0; j < navBtns.length; j++) {
    if (j === idx) navBtns[j].classList.add("active");
    else navBtns[j].classList.remove("active");
  }
  var am = document.getElementById("active-mod");
  if (am) setStatText(am, String(idx + 1).padStart(2, "0"));
  if (!mod.inited) {
    mod.draw();
    mod.inited = true;
  }
  window.scrollTo(0, 0);
}

/* ============================================================
   NAVIGATION BUILDER (IIFE)
   ============================================================ */
(function buildNav() {
  var container = document.getElementById("nav-container");
  MODULES.forEach(function(mod, idx) {
    var btn = el2("button", { class: "nav-btn" + (idx === 0 ? " active" : "") }, container);
    var num = el2("span", { class: "nav-num" }, btn);
    num.textContent = mod.num;
    btn.appendChild(document.createTextNode(mod.short));
    btn.onclick = function() { switchModule(idx); };
  });
})();

/* ============================================================
   INITIALIZATION
   ============================================================ */
buildModules();
window.addEventListener("load", function() {
  switchModule(0);
});
