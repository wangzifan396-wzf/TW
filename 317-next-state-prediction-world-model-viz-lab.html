<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next-State Prediction与世界模型范式 - 可视化实验室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0b0f;
    --bg-panel: #12141c;
    --bg-card: #181b25;
    --border: #232838;
    --teal: #00d4aa;
    --teal-dim: #008f72;
    --teal-glow: rgba(0, 212, 170, 0.15);
    --text: #e6e8ee;
    --text-dim: #8b909e;
    --text-faint: #5a5f6e;
    --amber: #ffb454;
    --rose: #ff6b81;
    --violet: #9d7aff;
    --blue: #4ea8ff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 11, 15, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1320px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; white-space: nowrap;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 12px var(--teal);
  }
  .brand .tag {
    font-size: 10px; font-weight: 600;
    color: var(--teal); background: var(--teal-glow);
    padding: 2px 7px; border-radius: 4px;
    letter-spacing: 0.5px;
  }
  nav.modules {
    display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto;
  }
  .mod-btn {
    background: transparent; border: 1px solid transparent;
    color: var(--text-dim); cursor: pointer;
    padding: 6px 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 500;
    font-family: inherit;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .mod-btn:hover { color: var(--text); background: var(--bg-card); }
  .mod-btn.active {
    color: var(--teal); background: var(--teal-glow);
    border-color: var(--teal-dim);
  }
  main {
    max-width: 1320px; margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .module { display: none; }
  .module.active { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .mod-head { margin-bottom: 22px; }
  .mod-head .crumb {
    font-size: 11px; color: var(--teal); font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .mod-head h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .mod-head p { color: var(--text-dim); font-size: 14px; max-width: 860px; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(12, 1fr);
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card h3 {
    font-size: 14px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h3::before {
    content: ""; width: 4px; height: 14px; border-radius: 2px;
    background: var(--teal);
  }
  .col-12 { grid-column: span 12; }
  .col-8 { grid-column: span 8; }
  .col-7 { grid-column: span 7; }
  .col-6 { grid-column: span 6; }
  .col-5 { grid-column: span 5; }
  .col-4 { grid-column: span 4; }
  .col-3 { grid-column: span 3; }
  @media (max-width: 980px) {
    .col-8, .col-7, .col-6, .col-5, .col-4, .col-3 { grid-column: span 12; }
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    margin-bottom: 14px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl label {
    font-size: 11px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.3px;
  }
  .ctrl .val {
    font-size: 12px; color: var(--teal); font-weight: 700;
    font-family: "Consolas", "SF Mono", monospace;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 180px; height: 5px; border-radius: 3px;
    background: var(--bg-card); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--teal); cursor: pointer;
    box-shadow: 0 0 8px var(--teal-glow);
    border: 2px solid #0a0b0f;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--teal); cursor: pointer; border: 2px solid #0a0b0f;
  }
  .seg {
    display: inline-flex; background: var(--bg-card);
    border-radius: 8px; padding: 3px; gap: 2px;
    border: 1px solid var(--border);
  }
  .seg button {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; font-family: inherit;
    transition: all 0.15s ease;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    background: var(--teal); color: #0a0b0f; font-weight: 600;
  }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; min-width: 110px;
  }
  .stat .k { font-size: 10.5px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.3px; }
  .stat .v { font-size: 18px; color: var(--teal); font-weight: 700; font-family: "Consolas","SF Mono",monospace; margin-top: 2px; }
  .stat .v.amber { color: var(--amber); }
  .stat .v.rose { color: var(--rose); }
  .stat .v.violet { color: var(--violet); }
  .stat .v.blue { color: var(--blue); }
  svg.viz { width: 100%; display: block; border-radius: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i {
    width: 12px; height: 3px; border-radius: 2px; display: inline-block;
  }
  .note {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.7;
    background: var(--bg-card); border-left: 3px solid var(--teal-dim);
    padding: 10px 14px; border-radius: 0 6px 6px 0; margin-top: 12px;
  }
  .note b { color: var(--text); font-weight: 600; }
  .note code {
    font-family: "Consolas","SF Mono",monospace; font-size: 12px;
    color: var(--teal); background: rgba(0,212,170,0.08);
    padding: 1px 5px; border-radius: 3px;
  }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; letter-spacing: 0.4px;
    margin-left: 8px; vertical-align: middle;
  }
  .badge.core { background: rgba(0,212,170,0.15); color: var(--teal); }
  .badge.new { background: rgba(255,180,84,0.15); color: var(--amber); }
  .badge.hot { background: rgba(255,107,129,0.15); color: var(--rose); }
  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    font-size: 11.5px; padding: 5px 11px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
  }
  .pill:hover { color: var(--text); border-color: var(--teal-dim); }
  .pill.on { color: var(--teal); border-color: var(--teal); background: var(--teal-glow); }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cmp th, table.cmp td {
    text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
  }
  table.cmp th {
    font-size: 11px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.3px; text-transform: uppercase;
  }
  table.cmp td code {
    font-family: "Consolas","SF Mono",monospace; color: var(--teal);
  }
  table.cmp tr:hover td { background: var(--bg-card); }
  .kvlist { font-size: 12.5px; line-height: 1.9; }
  .kvlist .row { display: flex; gap: 8px; }
  .kvlist .row .k2 { color: var(--text-dim); min-width: 86px; }
  .kvlist .row .v2 { color: var(--text); }
  .foot {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-faint); text-align: center;
  }
  .mono { font-family: "Consolas","SF Mono",monospace; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="dot"></span>
      <span>Next-State Prediction与世界模型范式</span>
      <span class="tag">VIZ LAB</span>
    </div>
    <nav class="modules" id="nav"></nav>
  </div>
</header>
<main>
  <!-- M1 -->
  <section id="m1" class="module active"></section>
  <!-- M2 -->
  <section id="m2" class="module"></section>
  <!-- M3 -->
  <section id="m3" class="module"></section>
  <!-- M4 -->
  <section id="m4" class="module"></section>
  <!-- M5 -->
  <section id="m5" class="module"></section>
  <!-- M6 -->
  <section id="m6" class="module"></section>
  <!-- M7 -->
  <section id="m7" class="module"></section>
  <!-- M8 -->
  <section id="m8" class="module"></section>
  <div class="foot">
    Next-State Prediction与世界模型范式 · 可视化实验室 · 基于智源研究院2026十大AI趋势报告：AI从"预测下一个词"迈向"预测世界的下一个状态"
  </div>
</main>
<script>
"use strict";
/* ============ 工具函数 ============ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) {
    for (var k in attrs) {
      if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) {
  var t = document.createTextNode(str);
  node.appendChild(t);
  return node;
}
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent);
  txt(t, str);
  return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ============ 模块注册 ============ */
var MODULES = [
  { id: "m1", name: "NTP→NSP范式转移" },
  { id: "m2", name: "4D统一建模" },
  { id: "m3", name: "世界模型架构" },
  { id: "m4", name: "因果推理能力" },
  { id: "m5", name: "物理规则学习" },
  { id: "m6", name: "自动驾驶仿真" },
  { id: "m7", name: "机器人训练" },
  { id: "m8", name: "悟界与生态" }
];
var initialized = {};
function switchModule(id) {
  var secs = document.querySelectorAll(".module");
  for (var i = 0; i < secs.length; i++) secs[i].classList.remove("active");
  document.getElementById(id).classList.add("active");
  var btns = document.querySelectorAll(".mod-btn");
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle("active", btns[j].dataset.mod === id);
  }
  if (!initialized[id]) {
    var num = id.substring(1);
    var fn = window["m" + num + "Draw"];
    if (fn) { fn(); initialized[id] = true; }
  }
}
(function buildNav() {
  var nav = document.getElementById("nav");
  for (var i = 0; i < MODULES.length; i++) {
    (function (m, idx) {
      var b = document.createElement("button");
      b.className = "mod-btn" + (idx === 0 ? " active" : "");
      b.dataset.mod = m.id;
      b.textContent = m.name;
      b.addEventListener("click", function () { switchModule(m.id); });
      nav.appendChild(b);
    })(MODULES[i], i);
  }
})();

/* ============ 通用绘图辅助 ============ */
function svgCanvas(w, h, viewBox) {
  var s = el("svg", { width: w, height: h, viewBox: viewBox || ("0 0 " + w + " " + h), class: "viz" });
  el("rect", { x: 0, y: 0, width: w, height: h, fill: "#0e1018", rx: 8 }, s);
  return s;
}
function axis(s, x1, y1, x2, y2, color) {
  return el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: color || "#3a3f50", "stroke-width": 1.5 }, s);
}
function gridlines(s, x, y, w, h, nx, ny, color) {
  var i;
  for (i = 1; i < nx; i++) {
    var gx = x + (w / nx) * i;
    el("line", { x1: gx, y1: y, x2: gx, y2: y + h, stroke: color || "#1d212e", "stroke-width": 1, "stroke-dasharray": "2 4" }, s);
  }
  for (i = 1; i < ny; i++) {
    var gy = y + (h / ny) * i;
    el("line", { x1: x, y1: gy, x2: x + w, y2: gy, stroke: color || "#1d212e", "stroke-width": 1, "stroke-dasharray": "2 4" }, s);
  }
}
function arrowDef(s, id, color) {
  var defs = s.querySelector("defs") || el("defs", {}, s);
  var mk = el("marker", { id: id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 Z", fill: color }, mk);
}

/* ============================================================ */
/* M1 NTP→NSP 范式转移 */
/* ============================================================ */
var M1 = { view: "compare" };
function m1Draw() {
  var sec = document.getElementById("m1");
  var head = document.createElement("div");
  head.className = "mod-head";
  head.innerHTML = '<div class="crumb">M1 · PARADIGM SHIFT</div>' +
    '<h1>从"预测下一个词"到"预测下一个状态"<span class="badge core">核心范式</span></h1>' +
    '<p>智源研究院2026十大AI趋势报告指出，AI正经历从Next-Token Prediction（NTP）到Next-State Prediction（NSP）的根本性范式转移。NTP让模型在数字符号空间预测下一个离散token，而NSP让模型在连续时空物理空间预测世界的下一个状态——这意味着AI开始理解时空连续性与因果规律，从数字空间感知迈向物理世界认知与规划。</p>';
  sec.appendChild(head);

  var ctrl = document.createElement("div");
  ctrl.className = "controls";
  ctrl.innerHTML =
    '<div class="seg" id="m1seg">' +
    '<button class="on" data-v="compare">范式对比</button>' +
    '<button data-v="timeline">演进时间线</button></div>';
  sec.appendChild(ctrl);

  var grid = document.createElement("div");
  grid.className = "grid";
  grid.innerHTML =
    '<div class="card col-12"><h3>范式对比可视化</h3><div id="m1viz"></div>' +
    '<div class="legend"><span><i style="background:#4ea8ff"></i>Next-Token Prediction（符号空间）</span>' +
    '<span><i style="background:#00d4aa"></i>Next-State Prediction（物理时空空间）</span></div></div>' +
    '<div class="card col-8"><h3>核心差异</h3><div id="m1diff"></div></div>' +
    '<div class="card col-4"><h3>范式意义</h3><div id="m1note" class="note"></div></div>';
  sec.appendChild(grid);

  var seg = document.getElementById("m1seg");
  var btns = seg.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove("on");
      this.classList.add("on");
      m1View(this.dataset.v);
    });
  }
  m1View("compare");
}
function m1View(v) {
  M1.view = v;
  if (v === "compare") m1DrawCompare();
  else m1DrawTimeline();
  m1DrawDiff();
}
function m1DrawCompare() {
  var host = document.getElementById("m1viz");
  clearNode(host);
  var W = 1180, H = 440;
  var s = svgCanvas(W, H);
  host.appendChild(s);
  arrowDef(s, "m1aBlue", "#4ea8ff");
  arrowDef(s, "m1aTeal", "#00d4aa");
  arrowDef(s, "m1aGray", "#5a5f6e");

  /* 左半：NTP 文本token预测 */
  el("rect", { x: 30, y: 30, width: 545, height: 380, fill: "#141926", stroke: "#2a3550", "stroke-width": 1.5, rx: 10 }, s);
  tspanEl(50, 58, "Next-Token Prediction (NTP)", s, { fill: "#4ea8ff", "font-size": 15, "font-weight": 700 });
  tspanEl(50, 76, "数字符号空间 · 离散 token 序列", s, { fill: "#8b909e", "font-size": 11.5 });

  var tokens = ["今天", "天气", "真", "好", "，", "适合", "出门"];
  var tx = 50, ty = 130;
  var tw = 62, gap = 8;
  for (var i = 0; i < tokens.length; i++) {
    var isLast = (i === tokens.length - 1);
    var bx = tx + i * (tw + gap);
    el("rect", { x: bx, y: ty, width: tw, height: 38, fill: isLast ? "rgba(78,168,255,0.18)" : "#1c2233", stroke: isLast ? "#4ea8ff" : "#2c3450", "stroke-width": 1.5, rx: 6 }, s);
    tspanEl(bx + tw / 2, ty + 24, tokens[i], s, { fill: isLast ? "#4ea8ff" : "#c5c8d2", "font-size": 13, "text-anchor": "middle", "font-weight": isLast ? 700 : 400 });
    if (i < tokens.length - 1) {
      el("line", { x1: bx + tw + 1, y1: ty + 19, x2: bx + tw + gap - 1, y2: ty + 19, stroke: "#4ea8ff", "stroke-width": 1.5, "marker-end": "url(#m1aBlue)" }, s);
    }
  }
  tspanEl(50, 196, "P(token_{t+1} | token_1 ... token_t)", s, { fill: "#4ea8ff", "font-size": 12.5, "font-family": "Consolas,monospace" });

  /* 概率分布条 */
  tspanEl(50, 230, "下一个词概率分布:", s, { fill: "#8b909e", "font-size": 11.5 });
  var cands = [["散步", 0.42], ["运动", 0.26], ["郊游", 0.18], ["赏花", 0.14]];
  var bx0 = 50, by0 = 244;
  for (var ci = 0; ci < cands.length; ci++) {
    var bw = 110, bh = cands[ci][1] * 130;
    el("rect", { x: bx0 + ci * (bw + 12), y: by0 + (130 - bh), width: bw, height: bh, fill: "#4ea8ff", "fill-opacity": 0.25 + ci * 0.18, stroke: "#4ea8ff", rx: 3 }, s);
    tspanEl(bx0 + ci * (bw + 12) + bw / 2, by0 + 148, cands[ci][0], s, { fill: "#c5c8d2", "font-size": 11, "text-anchor": "middle" });
    tspanEl(bx0 + ci * (bw + 12) + bw / 2, by0 + 132 - bh - 4, (cands[ci][1] * 100).toFixed(0) + "%", s, { fill: "#4ea8ff", "font-size": 10, "text-anchor": "middle" });
  }

  tspanEl(50, 400, "本质：统计共现 → 符号接龙，无物理约束", s, { fill: "#5a5f6e", "font-size": 11.5, "font-style": "italic" });

  /* 右半：NSP 物理状态预测 */
  el("rect", { x: 605, y: 30, width: 545, height: 380, fill: "#0f1a18", stroke: "#1f4a40", "stroke-width": 1.5, rx: 10 }, s);
  tspanEl(625, 58, "Next-State Prediction (NSP)", s, { fill: "#00d4aa", "font-size": 15, "font-weight": 700 });
  tspanEl(625, 76, "物理时空空间 · 连续状态序列", s, { fill: "#8b909e", "font-size": 11.5 });

  /* 物理场景：小球抛物运动 t->t+1 */
  var sx = 660, sy0 = 360, gx = 470;
  el("line", { x1: 625, y1: sy0, x2: 1130, y2: sy0, stroke: "#3a4a44", "stroke-width": 2 }, s);
  /* 轨迹 */
  var trajPath = "M ";
  for (var ti = 0; ti <= 20; ti++) {
    var px = sx + (ti / 20) * gx;
    var py = sy0 - (180 * (ti / 20) - 9 * (ti / 20) * (ti / 20));
    trajPath += (ti === 0 ? "" : " L ") + px.toFixed(1) + " " + py.toFixed(1);
  }
  el("path", { d: trajPath, fill: "none", stroke: "#00d4aa", "stroke-width": 2, "stroke-opacity": 0.5, "stroke-dasharray": "4 3" }, s);
  /* 状态帧 t */
  for (var fi = 0; fi <= 3; fi++) {
    var tnorm = fi / 3;
    var fpx = sx + tnorm * gx;
    var fpy = sy0 - (180 * tnorm - 9 * tnorm * tnorm);
    el("circle", { cx: fpx, cy: fpy, r: 11, fill: "#00d4aa", "fill-opacity": 0.85, stroke: "#0e1018", "stroke-width": 2 }, s);
    tspanEl(fpx, fpy + 30, "S(t" + fi + ")", s, { fill: "#00d4aa", "font-size": 11, "text-anchor": "middle", "font-weight": 700 });
  }
  /* 预测的下一状态 */
  var ppx = sx + gx + 60;

function m2DrawSpacetime() {
  var host = document.getElementById("m2viz");
  clearNode(host);
  var W = 760, H = 440;
  var s = svgCanvas(W, H);
  host.appendChild(s);
  arrowDef(s, "m2aAmber", "#ffb454");

  tspanEl(W / 2, 30, "4D 时空网格：3D空间 × 时间", s, { fill: "#e6e8ee", "font-size": 14, "font-weight": 700, "text-anchor": "middle" });

  /* 绘制多个时间帧的3D立方体（等距投影） */
  var frames = 5;
  var baseX = 80, baseY = 320;
  var cubeSize = 60;
  var spacing = 130;
  var tNorm = M2.t / 100;

  for (var fi = 0; fi < frames; fi++) {
    var ft = fi / (frames - 1);
    var ox = baseX + fi * spacing;
    var oy = baseY - fi * 28;
    var active = (Math.abs(ft - tNorm) < 0.12);
    var op = active ? 1.0 : 0.4;
    var col = active ? "#00d4aa" : "#2c3450";

    /* 等距立方体 */
    var dx = cubeSize, dy = cubeSize * 0.5, dz = cubeSize * 0.7;
    /* 后面 */
    el("polygon", { points: (ox + dz) + "," + (oy - dz) + " " + (ox + dx + dz) + "," + (oy - dz) + " " + (ox + dx + dz) + "," + (oy + dy - dz) + " " + (ox + dz) + "," + (oy + dy - dz), fill: "#101820", stroke: col, "stroke-width": 1.2, "stroke-opacity": op }, s);
    /* 顶面 */
    el("polygon", { points: ox + "," + oy + " " + (ox + dx) + "," + oy + " " + (ox + dx + dz) + "," + (oy - dz) + " " + (ox + dz) + "," + (oy - dz), fill: active ? "rgba(0,212,170,0.18)" : "#141a26", stroke: col, "stroke-width": 1.2, "stroke-opacity": op }, s);
    /* 右面 */
    el("polygon", { points: (ox + dx) + "," + oy + " " + (ox + dx + dz) + "," + (oy - dz) + " " + (ox + dx + dz) + "," + (oy + dy - dz) + " " + (ox + dx) + "," + (oy + dy), fill: active ? "rgba(0,212,170,0.1)" : "#101218", stroke: col, "stroke-width": 1.2, "stroke-opacity": op }, s);
    /* 前面 */
    el("polygon", { points: ox + "," + oy + " " + (ox + dx) + "," + oy + " " + (ox + dx) + "," + (oy + dy) + " " + ox + "," + (oy + dy), fill: "none", stroke: col, "stroke-width": 1.2, "stroke-opacity": op }, s);

    /* 网格点（3D采样点） */
    var pts3d = [[0.25,0.25],[0.5,0.25],[0.75,0.25],[0.25,0.5],[0.5,0.5],[0.75,0.5],[0.25,0.75],[0.5,0.75],[0.75,0.75]];
    for (var pi = 0; pi < pts3d.length; pi++) {
      var px = ox + pts3d[pi][0] * dx;
      var py = oy + pts3d[pi][1] * dy;
      el("circle", { cx: px, cy: py, r: active ? 2.5 : 1.5, fill: col, "fill-opacity": op }, s);
    }

    /* 移动物体：在帧内位置随时间变化 */
    var objT = (ft + tNorm) % 1;
    var objX = ox + objT * dx;
    var objY = oy + (0.2 + 0.3 * Math.sin(objT * Math.PI * 2)) * dy;
    el("circle", { cx: objX, cy: objY, r: active ? 5 : 3, fill: "#ffb454", "fill-opacity": op }, s);

    tspanEl(ox + dx / 2, oy + dy + 18, "t=" + fi, s, { fill: active ? "#00d4aa" : "#5a5f6e", "font-size": 11, "text-anchor": "middle", "font-weight": active ? 700 : 400 });
  }

  /* 时间轴箭头 */
  el("line", { x1: 60, y1: 410, x2: W - 60, y2: 410, stroke: "#ffb454", "stroke-width": 2, "marker-end": "url(#m2aAmber)" }, s);
  tspanEl(W / 2, 430, "时间维度 →", s, { fill: "#ffb454", "font-size": 12, "text-anchor": "middle", "font-weight": 600 });

  /* 当前时间指示 */
  var curX = baseX + tNorm * (frames - 1) * spacing;
  var curY = baseY - tNorm * (frames - 1) * 28;
  el("line", { x1: curX + 30, y1: curY + 30, x2: curX + 30, y2: 408, stroke: "#00d4aa", "stroke-width": 1.5, "stroke-dasharray": "3 3", opacity: 0.7 }, s);
}

function m4Intervene(id) {
  var s = M4._s;
  var nodeMap = M4._nodeMap;
  /* 清除旧高亮 */
  var olds = s.querySelectorAll(".m4hl");
  for (var q = 0; q < olds.length; q++) olds[q].parentNode.removeChild(olds[q]);
  /* 找下游 */
  var downstream = {};
  function reach(cur) {
    for (var ei = 0; ei < M4._edges.length; ei++) {
      if (M4._edges[ei][0] === cur && !downstream[M4._edges[ei][1]]) {
        downstream[M4._edges[ei][1]] = true;
        reach(M4._edges[ei][1]);
      }
    }
  }
  reach(id);
  /* 高亮下游节点 */
  for (var nid in downstream) {
    if (downstream.hasOwnProperty(nid)) {
      var n = nodeMap[nid];
      el("circle", { cx: n.x, cy: n.y, r: 46, fill: "none", stroke: "#ff6b81", "stroke-width": 2, class: "m4hl" }, s);
    }
  }
  /* 干预标签 */
  var src = nodeMap[id];
  el("rect", { x: src.x - 30, y: src.y - 78, width: 60, height: 20, fill: "#ff6b81", rx: 4, class: "m4hl" }, s);
  el("text", { x: src.x, y: src.y - 64, fill: "#0a0b0f", "font-size": 11, "font-weight": 700, "text-anchor": "middle", class: "m4hl" }, s).textContent = "do()";
}

function m5DrawCollision() {
  var host = document.getElementById("m5viz");
  clearNode(host);
  var W = 760, H = 440;
  var s = svgCanvas(W, H);
  host.appendChild(s);

  tspanEl(W / 2, 30, "碰撞：动量守恒与弹性碰撞", s, { fill: "#e6e8ee", "font-size": 14, "font-weight": 700, "text-anchor": "middle" });

  el("line", { x1: 40, y1: 380, x2: W - 40, y2: 380, stroke: "#3a4a44", "stroke-width": 2 }, s);

  var t = M5.t / 100;
  /* 两球相向运动 */
  var m1 = 2, m2 = 1;
  var v1 = -80, v2 = 120;
  var x1start = 200, x2start = 560;
  /* 碰撞时刻 */
  var collideT = 0.4;
  var x1, x2, vv1, vv2;
  if (t < collideT) {
    x1 = x1start + v1 * t * 2;
    x2 = x2start + v2 * t * 2;
    vv1 = v1; vv2 = v2;
  } else {
    x1 = x1start + v1 * collideT * 2;
    x2 = x2start + v2 * collideT * 2;
    /* 弹性碰撞后速度 */
    var nv1 = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
    var nv2 = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
    x1 = x1 + nv1 * (t - collideT) * 2;
    x2 = x2 + nv2 * (t - collideT) * 2;
    vv1 = nv1; vv2 = nv2;
  }

  /* 球1 */
  el("circle", { cx: x1, cy: 330, r: 16 * m1, fill: "#00d4aa", "fill-opacity": 0.85, stroke: "#0e1018", "stroke-width": 2 }, s);
  tspanEl(x1, 335, "m₁", s, { fill: "#0a0b0f", "font-size": 12, "font-weight": 700, "text-anchor": "middle" });
  /* 速度箭头 */
  el("line", { x1: x1, y1: 330, x2: x1 + vv1 * 0.5, y2: 330, stroke: "#00d4aa", "stroke-width": 2, "marker-end": "url(#m4aRose)" }, s);
  /* 球2 */
  el("circle", { cx: x2, cy: 340, r: 16 * m2, fill: "#4ea8ff", "fill-opacity": 0.85, stroke: "#0e1018", "stroke-width": 2 }, s);
  tspanEl(x2, 345, "m₂", s, { fill: "#0a0b0f", "font-size": 11, "font-weight": 700, "text-anchor": "middle" });
  el("line", { x1: x2, y1: 340, x2: x2 + vv2 * 0.4, y2: 340, stroke: "#4ea8ff", "stroke-width": 2, "marker-end": "url(#m4aRose)" }, s);

  /* 碰撞闪光 */
  if (Math.abs(t - collideT) < 0.06) {
    var mid = (x1start + v1 * collideT * 2 + 16 * m1 + x2start + v2 * collideT * 2 - 16 * m2) / 2;
    el("circle", { cx: mid, cy: 335, r: 30, fill: "none", stroke: "#ffb454", "stroke-width": 2, opacity: 0.8 }, s);
    el("circle", { cx: mid, cy: 335, r: 20, fill: "#ffb454", "fill-opacity": 0.3 }, s);
  }

  /* 动量守恒公式 */
  tspanEl(60, 70, "m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂'", s, { fill: "#00d4aa", "font-size": 13, "font-family": "Consolas,monospace" });
  tspanEl(60, 92, "动量守恒定律", s, { fill: "#8b909e", "font-size": 11 });

  /* 数据 */
  tspanEl(500, 70, "碰撞前: P=" + ((m1 * v1 + m2 * v2).toFixed(0)), s, { fill: "#4ea8ff", "font-size": 12, "font-family": "Consolas,monospace" });
  tspanEl(500, 92, "碰撞后: P=" + ((m1 * vv1 + m2 * vv2).toFixed(0)), s, { fill: "#00d4aa", "font-size": 12, "font-family": "Consolas,monospace" });
}
function m5DrawFluid() {
  var host = document.getElementById("m5viz");
  clearNode(host);

  host.appendChild(s);

  tspanEl(W / 2, 30, "流体：粒子模拟与波浪", s, { fill: "#e6e8ee", "font-size": 14, "font-weight": 700, "text-anchor": "middle" });

  /* 容器 */
  el("rect", { x: 80, y: 200, width: 600, height: 180, fill: "none", stroke: "#3a4a55", "stroke-width": 2, rx: 4 }, s);

  var t = M5.t / 100;
  /* 流体粒子（SPH风格） */
  var np = 90;
  for (var i = 0; i < np; i++) {
    var seed = i * 0.137;
    var baseX = 90 + (i % 15) * 38 + (seed * 10 % 8);
    var row = Math.floor(i / 15);
    var baseY = 360 - row * 16;
    /* 波动 */
    var wave = Math.sin(t * Math.PI * 4 + baseX * 0.03) * 12;
    var px = baseX + wave * 0.4;
    var py = baseY + wave;
    /* 落到容器内 */
    py = Math.min(376, Math.max(210, py));
    var op = 0.3 + (1 - row / 6) * 0.5;
    el("circle", { cx: px, cy: py, r: 6, fill: "#4ea8ff", "fill-opacity": op }, s);
  }

  /* 波面线 */
  var wavePath = "M ";
  for (var wx = 90; wx <= 670; wx += 8) {
    var wy = 210 + Math.sin(t * Math.PI * 4 + wx * 0.03) * 8;
    wavePath += (wx === 90 ? "" : " L ") + wx + " " + wy.toFixed(1);
  }
  el("path", { d: wavePath, fill: "none", stroke: "#4ea8ff", "stroke-width": 2, "stroke-opacity": 0.7 }, s);

  /* 注入流 */
  if (t < 0.4) {
    el("rect", { x: 350, y: 60, width: 30, height: 80, fill: "#4ea8ff", "fill-opacity": 0.2 }, s);
    for (var di = 0; di < 6; di++) {
      var dy = 80 + di * 18 + (t * 200 % 18);
      el("circle", { cx: 365 + Math.sin(di) * 4, cy: dy, r: 4, fill: "#4ea8ff", "fill-opacity": 0.7 }, s);
    }
  }

  tspanEl(60, 70, "Navier-Stokes 近似（粒子法）", s, { fill: "#00d4aa", "font-size": 13, "font-family": "Consolas,monospace" });
  tspanEl(60, 92, "模型从视频中学会不可压缩、粘性、表面张力", s, { fill: "#8b909e", "font-size": 11 });
}

function m6DrawRisk() {
  var host = document.getElementById("m6viz");
  clearNode(host);
  var W = 1180, H = 440;
  var s = svgCanvas(W, H);
  host.appendChild(s);

  tspanEl(W / 2, 30, "风险预测：未来3秒碰撞概率热力图", s, { fill: "#e6e8ee", "font-size": 14, "font-weight": 700, "text-anchor": "middle" });

  var pad = 60, pw = W - 2 * pad, ph = 280;
  axis(s, pad, H - 80, W - pad, H - 80);
  axis(s, pad, H - 80, pad, 70);
  gridlines(s, pad, 70, pw, ph, 6, 5);

  /* 风险曲线 */
  var pathR = "M ", pathS = "M ";
  for (var i = 0; i <= 60; i++) {
    var fx = pad + (i / 60) * pw;
    var risk = 100 * Math.exp(-Math.pow((i - 35) / 12, 2)) + 10;
    var ry = (H - 80) - (risk / 110) * ph;
    pathR += (i === 0 ? "" : " L ") + fx.toFixed(1) + " " + ry.toFixed(1);
    var safe = 100 - risk;
    var sy = (H - 80) - (safe / 110) * ph;
    pathS += (i === 0 ? "" : " L ") + fx.toFixed(1) + " " + sy.toFixed(1);
  }
  el("path", { d: pathR, fill: "none", stroke: "#ff6b81", "stroke-width": 2.5 }, s);
  el("path", { d: pathS, fill: "none", stroke: "#00d4aa", "stroke-width": 2.5, "stroke-dasharray": "5 4" }, s);

  /* 风险区域填充 */
  var fillPath = pathR + " L " + (W - pad) + " " + (H - 80) + " L " + pad + " " + (H - 80) + " Z";
  el("path", { d: fillPath, fill: "#ff6b81", "fill-opacity": 0.1 }, s);

  /* 预测时刻标记 */
