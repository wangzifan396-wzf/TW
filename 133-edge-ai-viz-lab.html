<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge AI Viz Lab — 端侧 AI 可视化实验室</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#84cc16;--accent2:#65a30d;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;overflow-x:hidden}
.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(132,204,22,.3)}
.logo-mark svg{width:16px;height:16px}
.nav-modules{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 0}
.nav-modules::-webkit-scrollbar{display:none}
.nav-mod{padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text3);white-space:nowrap;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace}
.nav-mod:hover{background:var(--bg3);color:var(--text)}
.nav-mod.active{background:rgba(132,204,22,.12);color:var(--accent)}
.hero{max-width:1200px;margin:0 auto;padding:64px 24px 48px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border2);border-radius:999px;font-size:12px;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;margin-bottom:20px}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:16px}
.hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:var(--text2);max-width:640px}
.hero-stats{display:flex;gap:32px;margin-top:32px}
.hero-stat .num{font-size:24px;font-weight:700;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace}
.hero-stat .lbl{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.modules{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:flex;flex-direction:column;gap:32px}
.module{scroll-margin-top:80px}
.module-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color .3s}
.module-card:hover{border-color:var(--border2)}
.module-head{padding:28px 32px 0;display:flex;align-items:flex-start;gap:16px}
.module-num{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);padding:4px 8px;border:1px solid rgba(132,204,22,.3);border-radius:6px;background:rgba(132,204,22,.06)}
.module-title{flex:1}
.module-title h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.module-title p{font-size:14px;color:var(--text2);max-width:760px}
.module-body{padding:24px 32px 32px}
.viz-wrap{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:24px;min-height:280px;position:relative;overflow:hidden}
.viz-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{padding:7px 14px;border:1px solid var(--border2);border-radius:8px;background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:rgba(132,204,22,.15);border-color:var(--accent);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
.slider-row input[type=range]{-webkit-appearance:none;width:160px;height:4px;background:var(--border2);border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(132,204,22,.5)}
.val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:36px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--text3)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px}
.bottom-nav{max-width:1200px;margin:0 auto;padding:24px 24px 64px;display:flex;justify-content:space-between;gap:16px}
.bn-btn{flex:1;padding:16px 20px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:4px}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn.next{text-align:right;align-items:flex-end}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.bn-btn .ttl{font-size:14px;color:var(--text);font-weight:500}
.bn-btn:hover .ttl{color:var(--accent)}
footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--text3);font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace}
svg{display:block}
.node-rect{transition:.25s}
.node-rect:hover{filter:brightness(1.3)}
.flow-line{stroke-dasharray:4 4;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.blink{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#08090a" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#08090a"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2" stroke="#08090a" stroke-width="2"/></svg></div>
      <span>Edge AI Viz Lab</span>
    </div>
    <nav class="nav-modules" id="navModules"></nav>
  </div>
</header>

<section class="hero">
  <div class="hero-badge"><span class="dot"></span> AI/ML 可视化实验室 · 端侧 AI</div>
  <h1>Edge AI<br><span class="grad">可视化实验室</span></h1>
  <p>从模型压缩到端侧 LLM，探索 AI 如何在手机、IoT 设备上高效运行。本实验室通过 8 个交互式模块，拆解端侧 AI 的核心技术与挑战。</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">8</div><div class="lbl">Modules</div></div>
    <div class="hero-stat"><div class="num">&lt;10ms</div><div class="lbl">Latency Target</div></div>
    <div class="hero-stat"><div class="num">&lt;100MB</div><div class="lbl">Memory Budget</div></div>
  </div>
</section>

<div class="modules" id="modules"></div>

<div class="bottom-nav" id="bottomNav"></div>

<footer>Edge AI Viz Lab · 纯 HTML/CSS/JS + SVG · Linear 暗色美学</footer>

<script>
const MODULES=[
  {id:'m1',num:'01',title:'端侧 AI 挑战',desc:'功耗、内存、延迟约束 — 在资源受限的设备上运行 AI 的三重矛盾。'},
  {id:'m2',num:'02',title:'模型压缩',desc:'剪枝、蒸馏、量化对比 — 三种让模型变小的核心技术。'},
  {id:'m3',num:'03',title:'MobileNets',desc:'Depthwise Separable Conv — 用分离卷积大幅降低计算量。'},
  {id:'m4',num:'04',title:'神经架构搜索 NAS',desc:'为移动端搜索最优架构 — 自动寻找 latency-accuracy 帕累托前沿。'},
  {id:'m5',num:'05',title:'NPU/GPU 加速',desc:'硬件加速原理 — 专用加速器如何并行执行矩阵运算。'},
  {id:'m6',num:'06',title:'TFLite / CoreML 部署',desc:'移动端推理框架 — 从训练模型到手机可执行的完整链路。'},
  {id:'m7',num:'07',title:'联邦学习端侧',desc:'差分隐私 + 本地训练 — 数据不出设备的协作学习。'},
  {id:'m8',num:'08',title:'端侧 LLM',desc:'模型缩小到手机可运行 — 量化、推测解码与缓存优化。'}
];

const navEl=document.getElementById('navModules');
MODULES.forEach((m,i)=>{const a=document.createElement('a');a.className='nav-mod';a.href='#'+m.id;a.textContent=(i+1)+'';a.dataset.target=m.id;navEl.appendChild(a);});

const modEl=document.getElementById('modules');
MODULES.forEach(m=>{
  const sec=document.createElement('section');sec.className='module';sec.id=m.id;
  sec.innerHTML=`<div class="module-card"><div class="module-head"><span class="module-num">${m.num}</span><div class="module-title"><h2>${m.title}</h2><p>${m.desc}</p></div></div><div class="module-body"><div class="viz-wrap" id="viz-${m.id}"></div></div></div>`;
  modEl.appendChild(sec);
});

const bn=document.getElementById('bottomNav');
bn.innerHTML=`<a class="bn-btn prev" href="#m8"><span class="lbl">Prev</span><span class="ttl">端侧 LLM</span></a><a class="bn-btn next" href="#m2"><span class="lbl">Next</span><span class="ttl">模型压缩</span></a>`;

const navLinks=[...document.querySelectorAll('.nav-mod')];
const sections=MODULES.map(m=>document.getElementById(m.id));
window.addEventListener('scroll',()=>{
  let cur=0;sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<120)cur=i;});
  navLinks.forEach((l,i)=>l.classList.toggle('active',i===cur));
  const prevI=(cur-1+MODULES.length)%MODULES.length,nextI=(cur+1)%MODULES.length;
  bn.innerHTML=`<a class="bn-btn prev" href="#${MODULES[prevI].id}"><span class="lbl">Prev</span><span class="ttl">${MODULES[prevI].title}</span></a><a class="bn-btn next" href="#${MODULES[nextI].id}"><span class="lbl">Next</span><span class="ttl">${MODULES[nextI].title}</span></a>`;
});
navLinks[0].classList.add('active');

/* ===== MODULE 1: 端侧 AI 挑战 ===== */
(function(){
  const el=document.getElementById('viz-m1');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">资源约束三角（拖动滑块模拟设备预算）</text>
    <!-- triangle -->
    <polygon points="380,60 180,260 580,260" fill="none" stroke="#2a2d35" stroke-width="1.5"/>
    <circle cx="380" cy="60" r="8" fill="#84cc16"/>
    <text x="380" y="48" text-anchor="middle" fill="#84cc16" font-size="12" font-weight="600">延迟 Latency</text>
    <text x="380" y="36" text-anchor="middle" fill="#71717a" font-size="9" id="m1lat">目标 &lt; 10ms</text>
    <circle cx="180" cy="260" r="8" fill="#fb923c"/>
    <text x="180" y="284" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="600">功耗 Power</text>
    <text x="180" y="298" text-anchor="middle" fill="#71717a" font-size="9" id="m1pow">目标 &lt; 1W</text>
    <circle cx="580" cy="260" r="8" fill="#22d3ee"/>
    <text x="580" y="284" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="600">内存 Memory</text>
    <text x="580" y="298" text-anchor="middle" fill="#71717a" font-size="9" id="m1mem">目标 &lt; 100MB</text>
    <!-- center constraint -->
    <circle cx="380" cy="193" r="40" fill="rgba(132,204,22,.06)" stroke="#84cc16" stroke-width="1.5" class="pulse"/>
    <text x="380" y="190" text-anchor="middle" fill="#84cc16" font-size="11">可行域</text>
    <text x="380" y="204" text-anchor="middle" fill="#71717a" font-size="9">feasible</text>
    <!-- usage bars -->
    <text x="380" y="150" text-anchor="middle" fill="#a1a1aa" font-size="10">↓ 同时满足三者才能部署</text>
  </svg>
  <div class="viz-controls">
    <div class="slider-row"><span>模型大小</span><input type="range" id="m1sz" min="10" max="500" value="120"><span class="val" id="m1szv">120MB</span></div>
    <div class="slider-row"><span>计算量</span><input type="range" id="m1flops" min="10" max="2000" value="300"><span class="val" id="m1fv">300MFLOPs</span></div>
  </div>
  <div id="m1status" style="margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:13px"></div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">端侧 AI 面临 <span style="color:var(--accent)">延迟-功耗-内存</span> 三角约束：模型越大越准，但三者都会恶化。工程上需在精度与资源间权衡。</p>`;
  const sz=document.getElementById('m1sz'),fv=document.getElementById('m1flops');
  const szv=document.getElementById('m1szv'),flov=document.getElementById('m1fv');
  const status=document.getElementById('m1status');
  function eval(){
    const s=+sz.value,f=+fv.value;szv.textContent=s+'MB';flov.textContent=f+'MFLOPs';
    const lat=(f/100).toFixed(1),pow=(s*f/10000).toFixed(2);
    const ok=s<=100&&f<=500;
    status.innerHTML=`预估延迟: <span style="color:${f<=500?'#84cc16':'#fb923c'}">${lat}ms</span> · 功耗: <span style="color:${s*f<=50000?'#84cc16':'#fb923c'}">${pow}W</span> · 内存: <span style="color:${s<=100?'#84cc16':'#fb923c'}">${s}MB</span> → <b style="color:${ok?'#84cc16':'#fb923c'}">${ok?'✓ 可部署到端侧':'✗ 超出约束，需压缩'}</b>`;
  }
  sz.addEventListener('input',eval);fv.addEventListener('input',eval);eval();
})();

/* ===== MODULE 2: 模型压缩 ===== */
(function(){
  const el=document.getElementById('viz-m2');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">三种压缩技术对比（点击切换）</text>
    <!-- original model -->
    <g id="m2orig">
      <rect x="40" y="80" width="100" height="160" rx="8" fill="rgba(132,204,22,.08)" stroke="#84cc16" stroke-width="1.5"/>
      <text x="90" y="105" text-anchor="middle" fill="#84cc16" font-size="11" font-weight="600">原始模型</text>
      <text x="90" y="125" text-anchor="middle" fill="#a1a1aa" font-size="10">100MB</text>
      <text x="90" y="142" text-anchor="middle" fill="#71717a" font-size="9">acc 92%</text>
      <g id="m2grid"></g>
    </g>
    <!-- arrow -->
    <path d="M150 160 L240 160" stroke="#84cc16" stroke-width="1.5" marker-end="url(#a2arr)" class="flow-line"/>
    <defs><marker id="a2arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#84cc16"/></marker></defs>
    <!-- compressed -->
    <g id="m2comp"></g>
    <!-- stats -->
    <text x="510" y="280" text-anchor="middle" fill="#71717a" font-size="10" id="m2stat">选择压缩方式</text>
  </svg>
  <div class="viz-controls">
    <button class="btn active" data-c="prune">剪枝 Pruning</button>
    <button class="btn" data-c="distill">蒸馏 Distillation</button>
    <button class="btn" data-c="quant">量化 Quantization</button>
  </div>
  <div id="m2desc" style="margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text2)"></div>`;
  const grid=document.getElementById('m2grid');
  const comp=document.getElementById('m2comp');
  const stat=document.getElementById('m2stat');
  const desc=document.getElementById('m2desc');
  // draw original grid of neurons
  function drawOrig(){
    let h='';for(let i=0;i<6;i++)for(let j=0;j<4;j++){h+=`<circle cx="${60+j*15}" cy="${160+i*15}" r="4" fill="#84cc16" opacity=".5"/>`;}
    grid.innerHTML=h;
  }
  const info={
    prune:{size:'40MB',acc:'90%',ratio:'60%',d:'剪枝：移除权重接近 0 的连接（稀疏化），保留重要参数，体积减小 60%，精度损失小。'},
    distill:{size:'25MB',acc:'89%',ratio:'75%',d:'蒸馏：用大模型（教师）的软标签训练小模型（学生），体积减小 75%，学生学到教师的暗知识。'},
    quant:{size:'25MB',acc:'91%',ratio:'75%',d:'量化：将 FP32 权重转为 INT8（甚至 INT4），体积减小 75%，精度几乎无损，NPU 加速明显。'}
  };
  function drawComp(type){
    let h='';
    const colors={prune:'#84cc16',distill:'#22d3ee',quant:'#fb923c'};
    const c=colors[type];
    h+=`<rect x="250" y="80" width="100" height="160" rx="8" fill="rgba(${type==='prune'?'132,204,22':type==='distill'?'34,211,238':'251,146,60'},.08)" stroke="${c}" stroke-width="1.5"/>`;
    h+=`<text x="300" y="105" text-anchor="middle" fill="${c}" font-size="11" font-weight="600">${type==='prune'?'剪枝':type==='distill'?'蒸馏':'量化'}后</text>`;
    h+=`<text x="300" y="125" text-anchor="middle" fill="#a1a1aa" font-size="10">${info[type].size}</text>`;
    h+=`<text x="300" y="142" text-anchor="middle" fill="#71717a" font-size="9">acc ${info[type].acc}</text>`;
    // draw neurons based on type
    if(type==='prune'){
      for(let i=0;i<6;i++)for(let j=0;j<4;j++){if(Math.random()>0.4)h+=`<circle cx="${270+j*15}" cy="${160+i*15}" r="4" fill="${c}" opacity=".5"/>`;}
    }else if(type==='distill'){
      for(let i=0;i<4;i++)for(let j=0;j<3;j++){h+=`<circle cx="${275+j*18}" cy="${165+i*18}" r="5" fill="${c}" opacity=".5"/>`;}
    }else{
      for(let i=0;i<6;i++)for(let j=0;j<4;j++){h+=`<rect x="${267+j*15}" y="${156+i*15}" width="8" height="8" fill="${c}" opacity=".5"/>`;}
    }
    // arrow to result
    h+=`<path d="M360 160 L440 160" stroke="${c}" stroke-width="1.5" marker-end="url(#a2arr)" class="flow-line"/>`;
    // result box
    h+=`<rect x="450" y="100" width="220" height="120" rx="8" fill="#0f1115" stroke="#2a2d35"/>`;
    h+=`<text x="560" y="128" text-anchor="middle" fill="#e4e4e7" font-size="12">压缩效果</text>`;
    h+=`<text x="560" y="152" text-anchor="middle" fill="${c}" font-size="14" font-weight="600">体积 ↓${info[type].ratio}</text>`;
    h+=`<text x="560" y="174" text-anchor="middle" fill="#a1a1aa" font-size="11">精度: ${info[type].acc}</text>`;
    h+=`<text x="560" y="196" text-anchor="middle" fill="#71717a" font-size="10">${info[type].size} vs 100MB</text>`;
    comp.innerHTML=h;
    stat.textContent=`压缩比 ${info[type].ratio} · 精度 ${info[type].acc}`;
    desc.textContent=info[type].d;
  }
  el.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    drawComp(b.dataset.c);
  }));
  drawOrig();drawComp('prune');
})();

/* ===== MODULE 3: MobileNets ===== */
(function(){
  const el=document.getElementById('viz-m3');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px">
    <defs><marker id="a3arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#84cc16"/></marker></defs>
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">标准卷积 vs Depthwise Separable Conv</text>
    <!-- Standard conv -->
    <g id="m3std">
      <text x="180" y="56" text-anchor="middle" fill="#84cc16" font-size="12" font-weight="600">标准卷积 Standard Conv</text>
      <text x="180" y="72" text-anchor="middle" fill="#71717a" font-size="9">DK·DK·M·N = 大量计算</text>
      <!-- input cube -->
      <rect x="60" y="100" width="80" height="80" fill="rgba(132,204,22,.1)" stroke="#2a2d35"/>
      <rect x="68" y="92" width="80" height="80" fill="none" stroke="#2a2d35"/>
      <rect x="76" y="84" width="80" height="80" fill="none" stroke="#2a2d35"/>
      <text x="100" y="200" text-anchor="middle" fill="#71717a" font-size="9">输入 M 通道</text>
      <!-- kernel -->
      <rect x="180" y="120" width="40" height="40" fill="rgba(132,204,22,.2)" stroke="#84cc16"/>

(function(){
  const el=document.getElementById('viz-m4');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px" id="m4svg">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">NAS 帕累托前沿（点击搜索新架构）</text>
    <line x1="70" y1="280" x2="700" y2="280" stroke="#2a2d35"/>
    <line x1="70" y1="40" x2="70" y2="280" stroke="#2a2d35"/>
    <text x="385" y="305" text-anchor="middle" fill="#71717a" font-size="10">延迟 Latency (ms) →</text>
    <text x="30" y="160" fill="#71717a" font-size="10" transform="rotate(-90 30 160)">精度 Accuracy</text>
    <g id="m4pts"></g>
    <g id="m4front"></g>
  </svg>
  <div class="viz-controls">
    <button class="btn" id="m4search">🔍 搜索架构</button>
    <button class="btn" id="m4clear">↺ 清除</button>
    <div class="slider-row"><span>已评估</span><span class="val" id="m4cnt">0</span></div>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">NAS（如 ProxylessNAS、Once-for-All）在 <span style="color:var(--accent)">精度-延迟</span> 帕累托前沿上搜索架构，找到给定延迟约束下精度最高的网络结构。</p>`;
  const pts=document.getElementById('m4pts'),front=document.getElementById('m4front');
  const cnt=document.getElementById('m4cnt');
  const search=document.getElementById('m4search'),clear=document.getElementById('m4clear');
  let architectures=[];
  function gen(){
    const lat=20+Math.random()*180;
    const acc=0.6+0.35*Math.exp(-lat/200)+Math.random()*0.05;
    return {lat,acc};
  }
  function draw(){
    let h='';
    architectures.forEach((a,i)=>{
      const x=70+a.lat*(630/200);
      const y=280-(a.acc-0.6)*550;
      h+=`<circle cx="${x}" cy="${y}" r="4" fill="#2a2d35" stroke="#84cc16" stroke-width="1"/>`;
    });
    pts.innerHTML=h;
    // pareto front
    const sorted=[...architectures].sort((a,b)=>a.lat-b.lat);
    const pf=[];let bestAcc=0;
    sorted.forEach(a=>{if(a.acc>bestAcc){bestAcc=a.acc;pf.push(a);}});
    let fh='';
    if(pf.length>1){
      let d='M';pf.forEach((p,i)=>{const x=70+p.lat*(630/200),y=280-(p.acc-0.6)*550;d+=(i>0?' L':' ')+x+' '+y;});
      fh+=`<path d="${d}" fill="none" stroke="#84cc16" stroke-width="2"/>`;
    }
    pf.forEach(p=>{const x=70+p.lat*(630/200),y=280-(p.acc-0.6)*550;fh+=`<circle cx="${x}" cy="${y}" r="6" fill="#84cc16"/>`;});
    front.innerHTML=fh;
    cnt.textContent=architectures.length;
  }
  search.addEventListener('click',()=>{
    for(let i=0;i<5;i++)architectures.push(gen());
    draw();
  });
  clear.addEventListener('click',()=>{architectures=[];draw();});
  for(let i=0;i<10;i++)architectures.push(gen());draw();
})();

/* ===== MODULE 5: NPU/GPU 加速 ===== */
(function(){
  const el=document.getElementById('viz-m5');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px" id="m5svg">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">NPU 矩阵运算并行化（点击执行）</text>
    <g id="m5grid"></g>
    <text x="380" y="290" text-anchor="middle" fill="#71717a" font-size="10" id="m5stat">NPU: 8×8 PE 阵列 · 等待执行</text>
  </svg>
  <div class="viz-controls">
    <button class="btn" id="m5run">▶ 执行矩阵乘法</button>
    <button class="btn" id="m5reset">↺ 重置</button>
    <div class="slider-row"><span>PE 阵列</span><input type="range" id="m5pe" min="4" max="12" value="8"><span class="val" id="m5pev">8×8</span></div>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">NPU 用 <span style="color:var(--accent)">脉动阵列（Systolic Array）</span> 并行执行矩阵乘法，每个 PE（处理单元）同时计算一个乘加，相比 CPU 串行快数十倍。</p>`;
  const grid=document.getElementById('m5grid');
  const stat=document.getElementById('m5stat');
  const pe=document.getElementById('m5pe'),pev=document.getElementById('m5pev');
  const run=document.getElementById('m5run'),reset=document.getElementById('m5reset');
  let timer=null;
  function drawPE(active){
    const N=+pe.value;pev.textContent=N+'×'+N;
    let h='';
    const cellSize=Math.min(40,300/N);
    const startX=380-(N*cellSize)/2,startY=60;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const x=startX+j*cellSize,y=startY+i*cellSize;
      const on=active&&active[i]&&active[i][j];
      h+=`<rect x="${x+1}" y="${y+1}" width="${cellSize-2}" height="${cellSize-2}" rx="2" fill="${on?'#84cc16':'#16181d'}" stroke="${on?'#84cc16':'#2a2d35'}" opacity="${on?1:.5}"/>`;
      if(on)h+=`<text x="${x+cellSize/2}" y="${y+cellSize/2+3}" text-anchor="middle" fill="#08090a" font-size="${cellSize/3}" font-family="monospace">MAC</text>`;
    }
    // input labels
    h+=`<text x="${startX-10}" y="${startY-10}" text-anchor="end" fill="#71717a" font-size="10">A矩阵 ↓</text>`;
    h+=`<text x="${startX+N*cellSize+10}" y="${startY-10}" fill="#71717a" font-size="10">B矩阵 →</text>`;
    grid.innerHTML=h;
  }
  function animate(){
    const N=+pe.value;let step=0;
    const active=Array.from({length:N},()=>Array(N).fill(false));
    timer=setInterval(()=>{
      if(step>N){clearInterval(timer);timer=null;stat.textContent='NPU: 计算完成 ✓ '+N+'×'+N+' MAC 并行';run.textContent='▶ 执行矩阵乘法';return;}
      for(let i=0;i<N;i++)for(let j=0;j<N;j++)active[i][j]=(i+j)<=step;
      drawPE(active);
      stat.textContent='NPU: 周期 '+step+'/'+N+' · '+active.flat().filter(Boolean).length+' 个 PE 活跃';
      step++;
    },200);
  }
  run.addEventListener('click',function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶ 执行矩阵乘法';return;}this.textContent='⏸ 暂停';animate();});
  reset.addEventListener('click',()=>{clearInterval(timer);timer=null;drawPE(false);stat.textContent='NPU: 8×8 PE 阵列 · 等待执行';run.textContent='▶ 执行矩阵乘法';});
  pe.addEventListener('input',()=>drawPE(false));
  drawPE(false);
})();

    <text x="60" y="60" fill="#a1a1aa" font-size="11">原始 7B 模型</text>
    <rect x="60" y="68" width="600" height="20" rx="4" fill="#fb923c" opacity=".4"/>
    <text x="670" y="82" fill="#fb923c" font-size="10" id="m8orig">14GB (FP16)</text>
    <!-- after quant -->
    <text x="60" y="110" fill="#a1a1aa" font-size="11">INT4 量化后</text>
    <rect x="60" y="118" width="150" height="20" rx="4" fill="#84cc16"/>
    <text x="220" y="132" fill="#84cc16" font-size="10" id="m8quant">3.5GB (INT4)</text>
    <!-- optimization techniques -->
    <g transform="translate(60,160)">
      <rect width="180" height="50" rx="8" fill="#0f1115" stroke="#2a2d35"/>
      <text x="90" y="22" text-anchor="middle" fill="#84cc16" font-size="11" font-weight="600">INT4 量化</text>
      <text x="90" y="38" text-anchor="middle" fill="#71717a" font-size="9">体积↓4x</text>
    </g>
    <g transform="translate(260,160)">
      <rect width="180" height="50" rx="8" fill="#0f1115" stroke="#2a2d35"/>
      <text x="350" y="22" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">推测解码</text>
      <text x="350" y="38" text-anchor="middle" fill="#71717a" font-size="9">速度↑2-3x</text>
    </g>
    <g transform="translate(460,160)">
      <rect width="180" height="50" rx="8" fill="#0f1115" stroke="#2a2d35"/>
      <text x="550" y="22" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">KV Cache</text>
      <text x="550" y="38" text-anchor="middle" fill="#71717a" font-size="9">避免重算</text>
    </g>
    <!-- perf -->
    <text x="60" y="245" fill="#a1a1aa" font-size="11">生成速度</text>
    <rect x="60" y="253" width="0" height="16" rx="3" fill="#84cc16" id="m8speedbar"/>
    <text x="60" y="285" fill="#84cc16" font-size="11" id="m8speed">0 tokens/s</text>
    <text x="400" y="285" fill="#71717a" font-size="10" id="m8note">拖动下方滑块开启优化</text>
  </svg>
  <div class="viz-controls">
    <button class="btn" data-m8o="quant">INT4 量化</button>
    <button class="btn" data-m8o="spec">推测解码</button>
    <button class="btn" data-m8o="kv">KV Cache</button>
    <button class="btn" data-m8o="all">全部开启</button>
    <button class="btn" id="m8reset">↺ 重置</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">端侧 LLM（如 Phi-3、Gemma-2B）通过 <span style="color:var(--accent)">INT4 量化</span> 压缩到 3-4GB，配合 <span style="color:var(--accent)">推测解码</span> 与 <span style="color:var(--accent)">KV Cache</span> 在手机上达到可用生成速度。</p>`;
  const speedbar=document.getElementById('m8speedbar'),speed=document.getElementById('m8speed');
  const note=document.getElementById('m8note'),quantEl=document.getElementById('m8quant');
  let opts={quant:false,spec:false,kv:false};
  function update(){
    let base=4; // tokens/s baseline
    let size=14; // GB
    if(opts.quant){base*=2.5;size=3.5;}
    if(opts.spec)base*=2.2;
    if(opts.kv)base*=1.5;
    const w=Math.min(600,base*30);
    speedbar.setAttribute('width',w);
    speed.textContent=base.toFixed(1)+' tokens/s';
    quantEl.textContent=opts.quant?'3.5GB (INT4)':'14GB (FP16)';
    const on=Object.values(opts).filter(Boolean).length;
    note.textContent=on?on+' 项优化已开启 · 体积 '+(opts.quant?'3.5GB':'14GB'):'无优化 · 体积 14GB';
    el.querySelectorAll('[data-m8o]').forEach(b=>{
      const o=b.dataset.m8o;
      if(o==='all')b.classList.toggle('active',on===3);
      else b.classList.toggle('active',opts[o]);
    });
  }
  el.querySelectorAll('[data-m8o]').forEach(b=>b.addEventListener('click',()=>{
    const o=b.dataset.m8o;
    if(o==='all'){opts={quant:true,spec:true,kv:true};}
    else opts[o]=!opts[o];
    update();
  }));
  document.getElementById('m8reset').addEventListener('click',()=>{opts={quant:false,spec:false,kv:false};update();});
  update();
})();
</script>
</body>
</html>
