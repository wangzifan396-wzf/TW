var activeFilter = "all";
var searchQuery = "";

function renderNav(){
  var html = '<a class="nav-pill '+(activeFilter==="all"?"active":"")+'" data-filter="all">全部</a>';
  SECTIONS.forEach(function(s){
    html += '<a class="nav-pill '+(activeFilter===s.id?"active":"")+'" data-filter="'+s.id+'" href="#'+s.id+'">'+s.icon+" "+s.title+'</a>';
  });
  document.getElementById("navPills").innerHTML = html;
  document.querySelectorAll(".nav-pill").forEach(function(p){
    p.onclick = function(){
      activeFilter = p.dataset.filter;
      renderNav();
      renderSections();
      if(p.dataset.filter !== "all"){
        document.getElementById(p.dataset.filter).scrollIntoView({behavior:"smooth"});
      }
    };
  });
}

function highlight(text, query){
  if(!query) return text;
  var re = new RegExp("("+query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return text.replace(re, '<mark style="background:var(--accent-soft);color:var(--accent);padding:1px 2px;border-radius:2px">$1</mark>');
}

function renderSections(){
  var html = "";
  SECTIONS.forEach(function(s){
    if(activeFilter !== "all" && activeFilter !== s.id) return;

    // Filter rows by search
    var rows = s.rows;
    if(searchQuery){
      rows = s.rows.filter(function(r){
        return r.some(function(cell){ return String(cell).toLowerCase().indexOf(searchQuery) >= 0; });
      });
    }
    if(rows.length === 0 && searchQuery) return;

    html += '<div class="section" id="'+s.id+'">';
    html += '<div class="section-head"><span class="s-icon">'+s.icon+'</span><span class="s-title">'+s.title+'</span><span class="s-desc">'+s.desc+'</span></div>';
    html += '<table class="cheat-table"><thead><tr>';
    s.headers.forEach(function(h){ html += '<th>'+h+'</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function(r){
      html += '<tr>';
      r.forEach(function(cell, ci){
        var isCode = (s.id==="git"||s.id==="sql"||s.id==="python"||s.id==="docker") && ci === 1;
        var cls = isCode ? ' class="code"' : '';
        var disp = highlight(String(cell), searchQuery);
        if(s.id==="patterns" && ci===1){
          var tagCls = cell==="创建"?"tag-create":(cell==="结构"?"tag-struct":"tag-behav");
          disp = '<span class="tag '+tagCls+'">'+cell+'</span>';
        }
        html += '<td'+cls+'>'+disp+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  });
  if(html === "") html = '<div style="text-align:center;padding:48px;color:var(--text3)">没有匹配的内容</div>';
  document.getElementById("sections").innerHTML = html;
}

function init(){
  document.getElementById("searchInput").addEventListener("input", function(e){
    searchQuery = e.target.value.toLowerCase().trim();
    if(searchQuery){ activeFilter = "all"; renderNav(); }
    renderSections();
  });
  renderNav();
  renderSections();
}
init();
</script>
