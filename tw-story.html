<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Story · 计算机科学九十年交互叙事</title>
<style>
  :root{
    --bg:#08090a;
    --bg-soft:#0b0c0e;
    --surface:#0d0f11;
    --surface-2:#111417;
    --border:#1c1f23;
    --border-soft:#15181c;
    --border-strong:#2a2e34;
    --text:#e8e8ea;
    --text-2:#a1a1aa;
    --text-3:#6b7178;
    --accent:#f43f5e;
    --accent-soft:rgba(244,63,94,.14);
    --accent-line:rgba(244,63,94,.4);
    --ch1:#f43f5e;
    --ch2:#ec4899;
    --ch3:#d946ef;
    --ch4:#a855f7;
    --ch5:#8b5cf6;
    --ch6:#6366f1;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Menlo","Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    --maxw:1040px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 18% -5%, rgba(244,63,94,.05), transparent 42%),
      radial-gradient(circle at 92% 0%, rgba(99,102,241,.045), transparent 40%);
    background-attachment:fixed;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent-soft);color:#fff}

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(8,9,10,.86);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:var(--maxw);margin:0 auto;padding:12px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand-mark{width:26px;height:26px;flex-shrink:0}
  .brand-mark .dot{fill:var(--accent)}
  .brand-mark .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round}
  .brand-name{font-weight:600;letter-spacing:.3px;font-size:15px}
  .brand-name b{color:var(--accent);font-weight:700}
  .brand-name span{color:var(--text-3);font-weight:400;margin-left:4px;font-size:12px}

  .chapter-nav{display:flex;gap:2px;flex:1 1 auto;flex-wrap:wrap;min-width:0}
  .chapter-tab{
    display:flex;align-items:center;gap:7px;
    padding:6px 11px;border-radius:7px;cursor:pointer;
    font-size:12.5px;color:var(--text-2);
    border:1px solid transparent;white-space:nowrap;
    transition:color .18s,background .18s,border-color .18s;
  }
  .chapter-tab:hover{color:var(--text);background:var(--surface)}
  .chapter-tab.active{color:var(--text);background:var(--surface);border-color:var(--border-strong)}
  .chapter-tab .idx{
    font-family:var(--mono);font-size:10.5px;color:var(--text-3);
    width:16px;height:16px;display:grid;place-items:center;border-radius:4px;
    border:1px solid var(--border-strong);
  }
  .chapter-tab.active .idx{color:var(--ch-color,var(--accent));border-color:var(--ch-color,var(--accent))}

  .view-toggle{
    display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;
    flex-shrink:0;background:var(--surface);
  }
  .view-btn{
    padding:6px 12px;font-size:12px;color:var(--text-3);cursor:pointer;
    background:transparent;border:none;font-family:var(--sans);
    transition:color .15s,background .15s;display:flex;align-items:center;gap:6px;
  }
  .view-btn:hover{color:var(--text)}
  .view-btn.active{color:var(--text);background:var(--surface-2)}
  .view-btn svg{width:13px;height:13px}

  .progress-wrap{
    max-width:var(--maxw);margin:0 auto;padding:0 22px 10px;
    display:flex;align-items:center;gap:12px;
  }
  .progress-track{
    flex:1;height:3px;border-radius:2px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0;border-radius:2px;
    background:linear-gradient(90deg,var(--ch1),var(--ch4),var(--ch6));
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
  .progress-text{font-family:var(--mono);font-size:11px;color:var(--text-3);min-width:64px;text-align:right}

  /* ---------- LAYOUT ---------- */
  .container{max-width:var(--maxw);margin:0 auto;padding:36px 22px 140px}

  .hero{margin-bottom:48px;padding:8px 4px}
  .hero .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:2px;
    color:var(--accent);text-transform:uppercase;margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.5px;line-height:1.15;
    margin-bottom:14px;
  }
  .hero h1 .grad{
    background:linear-gradient(90deg,var(--ch1),var(--ch4),var(--ch6));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--text-2);max-width:640px;font-size:15px}
  .hero .meta{
    display:flex;gap:18px;margin-top:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:11px;color:var(--text-3);
  }
  .hero .meta span b{color:var(--text-2);font-weight:500}

  /* ---------- CARD FLOW ---------- */
  .cards-flow{position:relative;margin-top:10px}
  .cards-flow::before{
    content:"";position:absolute;left:60px;top:6px;bottom:6px;width:1px;
    background:linear-gradient(180deg,transparent,var(--border) 6%,var(--border) 94%,transparent);
  }

  .card{
    display:grid;grid-template-columns:120px 1fr;gap:0;
    margin-bottom:26px;scroll-margin-top:120px;
  }
  .card-year-col{position:relative}
  .card-dot{
    position:absolute;left:60px;top:30px;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;
    background:var(--bg);border:2px solid var(--text-3);
    z-index:2;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
  }
  .card.read .card-dot{
    background:var(--era-color,var(--accent));border-color:var(--era-color,var(--accent));
    box-shadow:0 0 0 4px rgba(244,63,94,.12);
  }
  .card-year{
    position:absolute;left:0;top:24px;width:50px;text-align:right;
    font-family:var(--mono);font-size:21px;font-weight:600;color:var(--text-2);
    letter-spacing:-.5px;
  }
  .card.read .card-year{color:var(--era-color,var(--accent))}

  .card-content{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--era-color,var(--accent));
    border-radius:10px;
    padding:22px 24px 20px;
    transition:border-color .2s,transform .2s,background .2s;
  }
  .card-content:hover{border-color:var(--border-strong);border-left-color:var(--era-color,var(--accent))}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
  .card-title{font-size:18px;font-weight:600;letter-spacing:-.2px;line-height:1.35}
  .card-chapter-tag{
    font-family:var(--mono);font-size:10px;color:var(--text-3);
    border:1px solid var(--border);padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;
  }
  .card-story{color:var(--text-2);font-size:14.5px;line-height:1.78;margin-bottom:16px}
  .card-people{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .people-label{font-family:var(--mono);font-size:10px;color:var(--text-3);align-self:center;margin-right:2px}
  .person-chip{
    font-size:11.5px;color:var(--text-2);background:var(--surface-2);
    border:1px solid var(--border);padding:3px 9px;border-radius:20px;
  }
  .card-illustration{
    background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:8px;
    padding:10px;margin-bottom:14px;display:flex;justify-content:center;align-items:center;
    color:var(--era-color,var(--accent));
  }
  .card-illustration svg{width:100%;max-width:460px;height:auto;display:block}
  .card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .related-link{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;color:var(--text-2);
    border:1px solid var(--border);padding:6px 11px;border-radius:7px;
    transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
  }
  .related-link:hover{color:var(--era-color,var(--accent));border-color:var(--era-color,var(--accent));background:var(--surface-2)}
  .related-link svg{width:12px;height:12px}

  .branch-btn{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;color:var(--text-2);cursor:pointer;
    background:transparent;border:1px dashed var(--border-strong);
    padding:6px 11px;border-radius:7px;font-family:var(--sans);
    transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
  }
  .branch-btn:hover{color:var(--text);border-color:var(--text-3)}
  .branch-btn .tri{transition:transform .2s;color:var(--era-color,var(--accent))}
  .branch-btn.open .tri{transform:rotate(90deg)}
  .branch-content{
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .35s ease,opacity .25s ease,margin .25s;
    color:var(--text-2);font-size:13.5px;line-height:1.75;
    background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:8px;
  }
  .branch-content.open{max-height:600px;opacity:1;margin-top:12px;padding:14px 16px}
  .branch-content .blabel{font-family:var(--mono);font-size:10px;color:var(--era-color,var(--accent));display:block;margin-bottom:7px;letter-spacing:1px}

  /* chapter separator */
  .chapter-sep{
    display:grid;grid-template-columns:120px 1fr;margin:14px 0 30px;align-items:center;
  }
  .chapter-sep-year{font-family:var(--mono);font-size:12px;color:var(--text-3);text-align:right;padding-right:14px}
  .chapter-sep-body{display:flex;align-items:center;gap:14px}
  .chapter-sep-bar{height:2px;flex:1;border-radius:1px;background:linear-gradient(90deg,var(--ch-color,var(--accent)),transparent)}
  .chapter-sep-title{font-size:20px;font-weight:600;letter-spacing:-.3px}
  .chapter-sep-sub{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:3px}

  /* ---------- TIMELINE VIEW ---------- */
  .timeline-view{display:none;padding:10px 0 20px}
  .timeline-view.active{display:block}
  .cards-flow.hidden{display:none}
  .hero.hidden{display:none}
  .timeline-wrap{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;
    overflow-x:auto;
  }
  .timeline-svg{display:block;min-width:760px;width:100%;height:auto}
  .tl-node{cursor:pointer;transition:transform .15s}
  .tl-node:hover{transform:translateY(-2px)}
  .tl-node circle{transition:r .15s,stroke-width .15s}
  .tl-node:hover circle{r:7}
  .tl-node text{pointer-events:none}
  .timeline-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:11px;color:var(--text-3)}
  .timeline-legend .lg{display:flex;align-items:center;gap:6px}
  .timeline-legend .lg i{width:10px;height:10px;border-radius:50%;display:inline-block}

  /* ---------- DOCK ---------- */
  .dock{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;z-index:40;
    background:rgba(13,15,17,.92);border:1px solid var(--border-strong);
    border-radius:12px;padding:6px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .dock-btn{
    display:flex;align-items:center;gap:6px;cursor:pointer;
    background:transparent;border:none;color:var(--text-2);
    padding:8px 12px;border-radius:8px;font-family:var(--sans);font-size:12.5px;
    transition:color .15s,background .15s;
  }
  .dock-btn:hover{color:var(--text);background:var(--surface-2)}
  .dock-btn:disabled{color:var(--text-3);opacity:.4;cursor:not-allowed}
  .dock-btn svg{width:14px;height:14px}
  .dock-divider{width:1px;height:18px;background:var(--border)}
  .dock-pos{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:0 6px}

  .top-link{opacity:0;pointer-events:none;transition:opacity .25s}
  .top-link.show{opacity:1;pointer-events:auto}

  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--surface);border:1px solid var(--border-strong);color:var(--text);
    padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:60;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--accent)}

  footer{max-width:var(--maxw);margin:0 auto;padding:30px 22px 60px;color:var(--text-3);font-size:12px;border-top:1px solid var(--border-soft)}
  footer .ft-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:760px){
    .topbar-inner{padding:10px 14px;gap:10px}
    .brand-name span{display:none}
    .chapter-nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
    .chapter-tab{padding:5px 8px;font-size:11.5px}
    .progress-wrap{padding:0 14px 8px}
    .container{padding:24px 14px 130px}
    .card{grid-template-columns:64px 1fr}
    .cards-flow::before{left:32px}
    .card-dot{left:32px;top:24px;width:11px;height:11px}
    .card-year{width:24px;font-size:13px;top:20px;left:0;text-align:left}
    .card-content{padding:16px 16px 14px}
    .card-title{font-size:16px}
    .card-head{flex-direction:column;gap:8px}
    .chapter-sep{grid-template-columns:64px 1fr}
    .chapter-sep-year{padding-right:8px;font-size:11px}
    .chapter-sep-title{font-size:17px}
    .dock{bottom:14px}
    .dock-btn{padding:7px 9px;font-size:12px}
    .dock-btn .lbl{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <line class="ln" x1="4" y1="14" x2="24" y2="14"/>
        <circle class="dot" cx="9" cy="14" r="3.2"/>
        <circle cx="19" cy="14" r="3.2" fill="none" stroke="#f43f5e" stroke-width="2"/>
      </svg>
      <div class="brand-name"><b>TW</b> Story<span>计算机科学九十年 · 交互叙事</span></div>
    </div>
    <nav class="chapter-nav" id="chapterNav"></nav>
    <div class="view-toggle">
      <button class="view-btn active" data-view="cards" id="vCards">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="3.5" rx="1"/><rect x="2" y="9" width="12" height="3.5" rx="1"/></svg>
        卡片
      </button>
      <button class="view-btn" data-view="timeline" id="vTimeline">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="2" y1="8" x2="14" y2="8"/><circle cx="5" cy="8" r="1.6" fill="currentColor"/><circle cx="10" cy="8" r="1.6" fill="currentColor"/></svg>
        时间轴
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 40</div>
  </div>
</header>

<main class="container">
  <section class="hero" id="hero">
    <div class="eyebrow">A Narrative Timeline · 1936 — 2026</div>
    <h1>从一条纸带到一群<span class="grad">智能体</span><br>计算机科学的九十年</h1>
    <p>四十个故事节点，六个时代。把图灵的纸带、冯·诺依曼的总线、香农的比特，一路串到 Transformer 与自主 Agent。滚动阅读，标记进度，切换时间轴俯瞰全局。</p>
    <div class="meta">
      <span><b>40</b> 故事节点</span>
      <span><b>6</b> 个时代</span>
      <span><b>90</b> 年跨度</span>
      <span>进度自动保存</span>
    </div>
  </section>

  <div class="cards-flow" id="cardsFlow"></div>

  <div class="timeline-view" id="timelineView">
    <div class="timeline-wrap">
      <svg class="timeline-svg" id="timelineSvg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="timeline-legend" id="timelineLegend"></div>
  </div>
</main>

<footer>
  <div class="ft-row">
    <span>TW Story · 零依赖单文件 HTML · 纯 HTML/CSS/JS + SVG</span>
    <span>向图灵、香农，以及所有写下未来的人致敬</span>
  </div>
</footer>

<div class="dock">
  <button class="dock-btn" id="prevBtn" title="上一节点 (k / ↑)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,12 6,8 10,4"/></svg>
    <span class="lbl">上一节点</span>
  </button>
  <div class="dock-pos" id="dockPos">— / 40</div>
  <button class="dock-btn" id="nextBtn" title="下一节点 (j / ↓)">
    <span class="lbl">下一节点</span>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,4 10,8 6,12"/></svg>
  </button>
  <div class="dock-divider"></div>
  <button class="dock-btn top-link" id="topBtn" title="返回顶部">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,10 8,6 12,10"/></svg>
    <span class="lbl">顶部</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
"use strict";
/* ============================================================
   TW Story · 数据层
   ============================================================ */
const CHAPTERS = [
  { id:1, title:"思想的诞生", range:"1936 — 1955", color:"#f43f5e", sub:"纸带、比特与抽象机器" },
  { id:2, title:"语言的黎明", range:"1956 — 1971", color:"#ec4899", sub:"让机器听懂人类的话" },
  { id:3, title:"个人计算机革命", range:"1972 — 1989", color:"#d946ef", sub:"计算走出机房，走进车库" },
  { id:4, title:"互联网时代", range:"1990 — 2006", color:"#a855f7", sub:"把世界连成一张网" },
  { id:5, title:"深度学习革命", range:"2007 — 2019", color:"#8b5cf6", sub:"神经网络学会看与说" },
  { id:6, title:"大模型时代", range:"2020 — 2026", color:"#6366f1", sub:"从涌现到自主行动" }
];

const N = (o)=>o; // identity helper
const NODES = [
N({year:1936, ch:1, title:"图灵的论文：论可计算数",
  people:["Alan Turing","David Hilbert"],
  story:"1936 年，24 岁的图灵在剑桥写下《论可计算数及其在判定问题上的应用》。他设想一台抽象机器——一条无限长的纸带，一个读写头，按规则在格子里移动、读写符号。这台“图灵机”不是为了建造，而是为了思考：哪些问题原则上可被计算？希尔伯特曾梦想用算法判定一切数学真理，图灵用一台虚构机器给出否定的回答——存在不可判定的问题。计算的边界，第一次被清晰划定。",
  related:{name:"图灵机可视化", href:"tw-turing.html"},
  branches:[{label:"图灵的生平与悲剧", content:"二战期间图灵在布莱切利园破解了德军 Enigma 密码，据估计将战争缩短两年。战后他仍因同性恋身份被定罪，被迫接受化学阉割。1954 年，他咬下一口浸过氰化物的苹果离世，年仅 41 岁。直到 2013 年英国女王才正式赦免他。今天的图灵奖，是计算机界的诺贝尔。"}],

N({year:1945, ch:1, title:"冯·诺依曼架构：EDVAC 报告",
  people:["John von Neumann","J. Presper Eckert","John Mauchly"],
  story:"1945 年 6 月，冯·诺依曼完成《EDVAC 报告草案》。他提出一个革命性想法：把程序和数据一同存进内存，让机器像处理数据一样处理指令。此前 ENIAC 靠插拔线缆编程，改一次程序要重新接线几天。“存储程序”架构让计算机真正成为通用机器——CPU、内存、输入输出三件套，成为此后七十年几乎所有计算机的骨架。这份报告没署名 Eckert 和 Mauchly，引发了一场旷日持久的发明权之争。",
  related:{name:"存储程序架构", href:"tw-vonneumann.html"},

N({year:1948, ch:1, title:"香农的信息论",
  people:["Claude Shannon"],
  story:"1948 年，贝尔实验室的香农发表《通信的数学理论》。他把“信息”从语义中剥离，定义为对不确定性的消除，并用“比特”作为基本单位。香农证明了：只要信道容量足够，信息就能以任意低的错误率传输——噪声并非不可战胜。他给出信源编码定理和信道编码定理，为后来的数据压缩、纠错码、直至整个数字通信奠基。同事说，香农一个人写完这篇论文，相当于生了一门学科。",

N({year:1949, ch:1, title:"EDSAC：第一台实用的存储程序计算机",
  people:["Maurice Wilkes"],
  story:"1949 年 5 月 6 日，剑桥大学的 EDSAC 第一次成功运行程序，打出一张素数表。它是世界上第一台实用的存储程序计算机，由 Maurice Wilkes 领导建造。Wilkes 后来说，他读完冯·诺依曼的 EDVAC 报告后就确信“计算机的未来就在这里”。EDVAC 仍在图纸上时，EDSAC 已经能跑真实的计算任务。这台机器还催生了最早的子程序库——程序员们开始共享代码，软件的概念悄然萌芽。",

N({year:1950, ch:1, title:"图灵测试：机器能思考吗？",
  people:["Alan Turing"],
  story:"1950 年 10 月，图灵在《心智》杂志发表《计算机器与智能》，开篇便问：“机器能思考吗？”他认为这个问题词义模糊，于是用一个游戏替代它——模仿游戏：裁判通过文字与人和机器交谈，若分不清谁是谁，便算机器通过。这就是后来被称为“图灵测试”的思想实验。图灵预言，到 2000 年机器能在五分钟对话中骗过三成裁判。七十年后，大语言模型让这个预言以意想不到的方式被反复检验。",
  related:{name:"模仿游戏交互", href:"tw-turing-test.html"},
  branches:[{label:"模仿游戏的现代回响", content:"1990 年起设立的洛布纳奖每年举办图灵测试比赛。2014 年一个名为 Eugene Goostman、伪装成 13 岁乌克兰男孩的聊天机器人号称“通过”测试——骗过 33% 评委。但学界普遍认为这更多是社交工程而非真智能。ChatGPT 出现后，人们发现“像人说话”和“真有智能”是两回事，图灵测试的哲学意义远大于它的工程意义。"}],
  svg:`<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="20" y="40" width="56" height="44" rx="6"/><rect x="164" y="40" width="56" height="44" rx="6"/><rect x="92" y="98" width="56" height="36" rx="6"/><circle cx="48" cy="58" r="3"/><circle cx="192" cy="58" r="3"/><circle cx="120" cy="112" r="3"/><line x1="48" y1="84" x2="48" y2="100"/><line x1="192" y1="84" x2="192" y2="100"/><line x1="48" y1="100" x2="100" y2="108"/><line x1="192" y1="100" x2="140" y2="108"/><line x1="76" y1="62" x2="92" y2="62" stroke-dasharray="3 3"/><line x1="148" y1="62" x2="164" y2="62" stroke-dasharray="3 3"/></g><text x="48" y="30" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".7">HUMAN?</text><text x="192" y="30" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".7">MACHINE?</text><text x="120" y="92" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".7">JUDGE</text></svg>`}),

N({year:1952, ch:1, title:"编译器之母：Grace Hopper 的 A-0",
  people:["Grace Hopper"],
  story:"1952 年，格蕾丝·霍珀在 UNIVAC 上完成 A-0 系统——世界上第一个编译器。当时人们普遍认为，计算机只能理解数字指令，让机器“翻译”符号代码是异想天开。霍珀不信邪：程序员的时间比机器的时间更宝贵。她把数学公式映射成机器指令的子程序，让程序员用调用代号替代手写机器码。同事们起初嘲笑这是“自动编程”，但 A-0 证明了抽象层能让编程效率成倍提升。编译器的种子，就此埋下。",
  related:{name:"编译管线可视化", href:"tw-compiler.html"},
  branches:[],
  svg:`<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g font-family="ui-monospace,monospace" font-size="11" fill="currentColor" text-anchor="middle"><text x="40" y="40">y = a + b</text><text x="40" y="58">CALL SQRT</text></g><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="80" y1="48" x2="120" y2="48"/><polygon points="120,48 113,44 113,52" fill="currentColor" stroke="none"/></g><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="124" y="32" width="44" height="32" rx="3"/><line x1="124" y1="48" x2="168" y2="48"/></g><text x="146" y="46" font-family="ui-monospace,monospace" font-size="8" fill="currentColor" text-anchor="middle" opacity=".7">A-0</text><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="168" y1="48" x2="196" y2="48"/><polygon points="196,48 189,44 189,52" fill="currentColor" stroke="none"/></g><g font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".8"><text x="212" y="36">01001</text><text x="212" y="48">10010</text><text x="212" y="60">00111</text></g><text x="120" y="92" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".6">SOURCE → COMPILER → MACHINE CODE</text><g fill="none" stroke="currentColor" stroke-width="1.3" opacity=".5"><rect x="30" y="108" width="180" height="24" rx="3"/><text x="120" y="124" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".8" stroke="none">SUBROUTINE LIBRARY</text></g></svg>`}),

N({year:1956, ch:2, title:"AI 诞生：达特茅斯会议",
  people:["John McCarthy","Marvin Minsky","Claude Shannon","Nathaniel Rochester"],
  story:"1956 年夏天，达特茅斯学院的一场为期八周的研讨会，被后人视为人工智能的诞辰。麦卡锡在提案中首次写下“Artificial Intelligence”一词。他与明斯基、罗切斯特、香农共同发起，召集了十来位年轻研究者。他们乐观地相信：“学习的每一个方面、智能的任何特征，原则上都能被精确描述并由机器模拟。”这种乐观贯穿了此后六十年的 AI 研究，哪怕其间经历了两次寒冬。",
  related:{name:"AI 寒冬周期图", href:"tw-dartmouth.html"},
  branches:[],
  svg:`<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="30" y="40" width="180" height="74" rx="4"/><line x1="30" y1="62" x2="210" y2="62"/></g><g fill="currentColor" stroke="none"><circle cx="60" cy="84" r="9"/><circle cx="100" cy="84" r="9"/><circle cx="140" cy="84" r="9"/><circle cx="180" cy="84" r="9"/></g><g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"><path d="M60 75 a4 4 0 0 1 8 0"/><path d="M100 75 a4 4 0 0 1 8 0"/><path d="M140 75 a4 4 0 0 1 8 0"/><path d="M180 75 a4 4 0 0 1 8 0"/></g><text x="120" y="32" font-family="ui-monospace,monospace" font-size="11" fill="currentColor" text-anchor="middle">A · I</text><text x="120" y="132" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".6">DARTMOUTH · SUMMER 1956</text></svg>`}),

N({year:1957, ch:2, title:"Fortran：Backus 的赌注",
  people:["John Backus"],
  story:"1957 年，IBM 的巴克斯团队发布 Fortran——第一个广泛使用的高级语言。巴克斯后来坦言，他搞 Fortran 是因为“我懒，不想再写汇编了”。当时很多人怀疑编译器生成的代码会比手写汇编慢，Fortran 团队用两年时间优化，最终证明它既能提高编程效率，又不牺牲运行速度。Fortran 让科学家终于能用接近数学公式的方式写程序，从此工程计算与科学计算有了共同语言。",
  related:{name:"高级语言谱系", href:"tw-fortran.html"},
  branches:[],

N({year:1958, ch:2, title:"Lisp：递归的优雅",
  people:["John McCarthy"],
  story:"1958 年，MIT 的麦卡锡设计了 Lisp——List Processing。它只有一种数据结构——列表，而代码本身也是列表，于是“程序即数据”成为 Lisp 的灵魂。Lisp 是第二古老的高级语言，却最早引入递归、垃圾回收、动态类型、高阶函数、条件表达式等概念——许多直到今天才被其他语言慢慢追上。麦卡锡原本只想做一个符号微分程序，却顺手发明了一门足以影响六十年的语言。",
  related:{name:"Lisp 求值树", href:"tw-lisp.html"},
  branches:[{label:"Lisp 的括号与同象性", content:"Lisp 最显眼的是满屏括号：(defun fact (n) (if (= n 0) 1 (* n (fact (- n 1)))))。代码即列表、列表即数据，这让宏成为可能——程序能在编译期改写自己。这种“同象性”(homoiconicity) 是 Lisp 区别于几乎所有语言的根本特征，也是它六十年后仍被新一代语言（Clojure、Racket）继承的原因。"}],
  svg:`<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="120" y1="30" x2="70" y2="70"/><line x1="120" y1="30" x2="120" y2="70"/><line x1="120" y1="30" x2="170" y2="70"/><line x1="70" y1="70" x2="45" y2="110"/><line x1="70" y1="70" x2="95" y2="110"/><line x1="170" y1="70" x2="170" y2="110"/></g><g font-family="ui-monospace,monospace" font-size="11" fill="currentColor" text-anchor="middle"><text x="120" y="24">*</text><text x="70" y="64">fact</text><text x="120" y="64">(-</text><text x="170" y="64">1)</text></g><g fill="currentColor" stroke="none"><circle cx="120" cy="30" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="120" cy="70" r="3"/><circle cx="170" cy="70" r="3"/><circle cx="45" cy="110" r="3"/><circle cx="95" cy="110" r="3"/><circle cx="170" cy="110" r="3"/></g><text x="40" y="138" font-family="ui-monospace,monospace" font-size="10" fill="currentColor" opacity=".7">(  *  (fact (- n 1))  1  )</text></svg>`}),

N({year:1964, ch:2, title:"BASIC：为非理科生而生",
  people:["John Kemeny","Thomas Kurtz"],
  story:"1964 年 5 月 1 日凌晨四点，达特茅斯学院的两位教授让学生运行了第一个 BASIC 程序。BASIC 的名字直白得可爱——Beginner's All-purpose Symbolic Instruction Code。他们只为一个目标：让非理工科学生也能用计算机。BASIC 语法简单、解释执行、即时反馈，后来随着微型机普及进入千家万户，整整一代程序员的第一行代码都是 10 PRINT \"HELLO\"。",
  related:{name:"解释器工作流", href:"tw-basic.html"},
  branches:[],
  svg:`<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="34" y="24" width="172" height="104" rx="5"/><rect x="46" y="36" width="148" height="74" rx="3"/></g><g fill="currentColor" stroke="none" opacity=".9"><circle cx="56" cy="30" r="1.6"/><circle cx="64" cy="30" r="1.6"/><circle cx="72" cy="30" r="1.6"/></g><g font-family="ui-monospace,monospace" font-size="10" fill="currentColor"><text x="56" y="56">&gt; 10 PRINT "HELLO"</text><text x="56" y="72">&gt; 20 GOTO 10</text><text x="56" y="88">&gt; RUN</text><text x="56" y="104">HELLO HELLO...</text></g><line x1="56" y1="96" x2="76" y2="96" stroke="currentColor" stroke-width="1.2" opacity=".7"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></line><text x="120" y="142" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".6">DARTMOUTH TIME-SHARING · 1964</text></svg>`}),

N({year:1969, ch:2, title:"ARPANET：\"lo\" 的故事",
  people:["Leonard Kleinrock","Charley Kline"],
  story:"1969 年 10 月 29 日晚，UCLA 的研究生查理·克莱恩坐在一台 SDS Sigma 7 前，试图登录斯坦福研究所的另一台计算机。他试图输入“LOGIN”，系统在传完“LO”后崩溃了。于是史上第一次网络传输的内容，是“LO”——有人戏称这是“Hello”的缩写。ARPANET 第一个节点就此上线，年底扩到四个节点。没人意识到，这个为学术共享而建的网，日后会变成连接全人类的互联网。",
  related:{name:"包交换网络", href:"tw-arpanet.html"},
  branches:[{label:"互联网的起源之争", content:"分组交换的思想其实有三个人几乎同时提出：美国的保罗·巴兰（想做一个抗核打击的军用网）、英国的唐纳德·戴维斯（首次用 packet 一词）、以及 ARPANET 团队。ARPANET 借鉴了他们的想法。所以互联网不是某一个人的发明，而是冷战焦虑、学术理想与工程奇迹的合流。"}],

N({year:1971, ch:2, title:"Unix：里奇和汤普森的\"玩具\"",
  people:["Ken Thompson","Dennis Ritchie"],
  story:"1971 年，贝尔实验室的汤普森和里奇在 DEC PDP-11 上跑起了第一版 Unix。它源于一个被撤资的项目 Multics——里奇称之为“被过度设计的庞然大物”。Unix 的哲学相反：每个程序只做好一件事，用管道把它们串起来。这套小而美的工具思想，加上用 C 重写后的可移植性，让 Unix 从一台被遗忘的小型机蔓延到几乎所有服务器。今天的 Linux、macOS、安卓，根都扎在这里。",
  related:{name:"Unix 管道与过滤器", href:"tw-unix.html"},
  branches:[],

N({year:1972, ch:3, title:"C 语言：为 Unix 而生",
  people:["Dennis Ritchie"],
  story:"1972 年，里奇在贝尔实验室完成 C 语言的雏形。它是为 Unix 而生——既要有高级语言的结构，又要能像汇编一样贴近硬件、操控内存。里奇引入了指针、结构体、可移植的类型系统，让同一份代码能在不同机器上编译运行。C 的简洁与锋利成就了它，也埋下隐患：程序员获得的自由，意味着必须自己小心指针与内存。半个世纪后，C 仍是操作系统、嵌入式、数据库的根基。",

N({year:1973, ch:3, title:"以太网：Metcalfe 的涂鸦",
  people:["Robert Metcalfe"],
  story:"1973 年，施乐 PARC 的梅特卡夫在一份内部备忘录里画下一张草图：一台台计算机连在一根共享电缆上，像发光的以太一样传递数据。他给这套局域网技术取名 Ethernet。梅特卡夫的洞察是“争用总线”——多台机器共用一根线，冲突就退避重传。后来他成立 3Com 公司把以太网商业化，并预言一个网络的价值与节点数平方成正比——这就是著名的梅特卡夫定律。",

N({year:1975, ch:3, title:"Microsoft 成立：车库里赶出的 BASIC",
  people:["Bill Gates","Paul Allen"],
  story:"1975 年 1 月，《大众电子》封面刊登 Altair 8800，两个年轻人看到了机会。保罗·艾伦坐飞机去见 MITS 老板，口袋里揣着他和盖茨通宵赶出来的 BASIC 解释器——它从未在真实机器上运行过，却一次跑通。那年盖茨 20 岁，艾伦 22 岁，他们在新墨西哥州阿尔伯克基注册了“Micro-Soft”。软件作为独立商品出售，这个当时争议不断的决定，定义了整个个人软件产业的商业模式。",

N({year:1976, ch:3, title:"Apple I：车库里的电路板",
  people:["Steve Wozniak","Steve Jobs","Ronald Wayne"],
  story:"1976 年，沃兹尼亚克在惠普的工位上、下班后的家里，亲手焊接出 Apple I 的电路板。它没有机箱、没有电源、没有键盘，只是一块裸板——但它是第一台带键盘接口、能直接显示字符的个人电脑。沃兹本想把它免费分享给同好，乔布斯说服他卖掉。两人和韦恩在车库里成立苹果公司，以 666.66 美元一台卖出 175 块 Apple I。个人电脑从极客玩具，开始走向一个产业。",

N({year:1983, ch:3, title:"TCP/IP：互联网的真正诞生",
  people:["Vint Cerf","Bob Kahn"],
  story:"1983 年 1 月 1 日，ARPANET 正式切换到 TCP/IP 协议——这一天被称为“Flag Day”。此前的网络各自为政，TCP/IP 给了它们一套共同语言：IP 负责寻址路由，TCP 负责可靠传输。瑟夫和卡恩设计的这套分层协议，让任何网络都能互联，“internet”一词才真正名副其实。切换当晚没人鼓掌，工程师们只盯着日志，祈祷不要崩。他们不知道，自己按下的是信息高速公路的总开关。",
  related:{name:"协议栈封装动画", href:"tw-tcpip.html"},

N({year:1989, ch:3, title:"WWW：CERN 的超文本提案",
  people:["Tim Berners-Lee"],
  story:"1989 年 3 月，CERN 的伯纳斯-李递交了一份提案：《信息管理：一个提案》。他的上司在批注里写下“模糊但激动人心”。他要解决一个简单问题：CERN 里成千上万的文档互相引用，却找不到彼此。他提出用“超文本”把文档链接起来，并发明了 URL、HTTP、HTML 三件套。1991 年第一个网站上线，伯纳斯-李坚持把 Web 专利免费开放——这个决定让万维网成为全人类的基础设施。",

N({year:1991, ch:4, title:"Linux：\"只是一个爱好\"",
  people:["Linus Torvalds"],
  story:"1991 年 8 月 25 日，赫尔辛基大学 21 岁的托瓦兹在新闻组发帖：“我只是做着玩，不会像 GNU 那么大那么专业。”他给自己写的内核取名 Linux。他本不想开源，但被朋友怂恿放上了 FTP，还随手定了个 GPL 协议。谁也没料到，这个“爱好”会吸引全球成千上万黑客协作，长成支撑互联网的基石。今天从手机到超级计算机、从云服务器到火星车，Linux 无处不在。",

N({year:1993, ch:4, title:"Mosaic：第一个图形浏览器",

  story:"1993 年，伊利诺伊大学 21 岁的安德森和同事写下 Mosaic——第一个能显示图片、点击链接的图形浏览器。此前 Web 只有纯文本，Mosaic 让“网上冲浪”第一次有了画面。安德森后来创办网景，引爆了浏览器大战和第一次互联网泡沫。而 Mosaic 团队里有一个叫比纳的程序员，他把 <img> 标签塞进 HTML——这个当时备受争议的小标签，定义了此后三十年网页的样子。",

N({year:1995, ch:4, title:"Java：一次编写，到处运行",
  people:["James Gosling"],
  story:"1995 年，Sun 公司发布 Java。高斯林原本在做机顶盒项目，C++ 太复杂、太容易出错，他干脆造了一门新语言。Java 的卖点是“一次编写，到处运行”——代码编译成字节码，跑在虚拟机上，跨平台。Write Once Run Anywhere 在现实中打了折扣，但 JVM 却意外成就了大数据（Hadoop）、企业后端乃至安卓。Java 的垃圾回收和强类型，让整整一代程序员第一次不必和内存搏斗。",

N({year:1998, ch:4, title:"Google：PageRank 改变搜索",
  people:["Larry Page","Sergey Brin"],
  story:"1998 年 9 月，佩奇和布林在苏珊·沃西基家车库里注册了 Google。他们的核心武器是 PageRank——把网页间的链接看作“投票”，重要的页面被更多重要页面指向。这个源自学术引用 ranking 的想法，让搜索结果质量碾压对手。Google 还立下信条“Don't be evil”，虽日后饱受争议，却定义了早期硅谷的理想主义气质。两个斯坦福博士没意识到，他们造的不只是搜索引擎，而是信息时代的入口。",

N({year:2004, ch:4, title:"Facebook：宿舍里的社交图谱",
  people:["Mark Zuckerberg"],
  story:"2004 年 2 月，哈佛柯克兰宿舍 H33 房间里，19 岁的扎克伯格敲下 thefacebook.com 的代码。它最初只是校园内的“花名册”，两周内半数哈佛学生注册。扎克伯格做的最关键决定是“真实身份”——必须用真名、真学校，这让线上社交第一次和线下关系绑定。随后 Facebook 蔓延到所有大学、所有人群，把“社交图谱”变成互联网的新地基。它也开启了关于隐私、算法、信息茧房的漫长争议。",

N({year:2006, ch:4, title:"Hadoop：开源复刻 MapReduce",
  people:["Doug Cutting"],
  story:"2006 年，卡廷把自己的开源项目命名为 Hadoop——他儿子玩具大象的名字。它复刻了 Google 两篇论文（GFS 与 MapReduce）的思想：把海量数据分散到廉价机器上并行处理。雅虎投入重金支持，Hadoop 很快成为大数据时代的操作系统。一夜之间，处理 PB 级数据不再需要超级计算机，而是一个机架的普通服务器。数据驱动决策，从大公司的奢侈品变成每个团队的日常。",

N({year:2007, ch:5, title:"iPhone：移动计算时代的开始",
  people:["Steve Jobs"],
  story:"2007 年 1 月，乔布斯在 Macworld 上掏出一台 iPhone。它把电话、音乐播放器、上网设备合三为一，并用一块多点触控屏取代了所有按键。批评者说它太贵、没键盘、不支持 3G，但用户第一次发现：用手指捏合放大照片，竟是如此自然。一年后 App Store 开放，移动应用生态爆发。iPhone 重新定义了“计算机”的形态——口袋里、随时在线、传感器满身——它为十年后的移动 AI 铺好了土壤。",

N({year:2012, ch:5, title:"AlexNet：GPU 上的 CNN 革命",
  people:["Alex Krizhevsky","Ilya Sutskever","Geoffrey Hinton"],
  story:"2012 年 9 月，ImageNet 竞赛结果公布：一个叫 AlexNet 的卷积神经网络把图像识别错误率从 26% 打到 15%，碾压所有传统方法。它的作者克里泽夫斯基在宿舍用两块 GTX 580 显卡训练了六天。关键不只是网络深了，而是用 GPU 并行训练 + 海量标注数据 + ReLU 激活。这篇论文点燃了深度学习革命——此后视觉、语音、翻译接连被神经网络攻陷。人们这才意识到，算力、数据、算法三件套齐了。",

N({year:2014, ch:5, title:"GAN：生成对抗网络",
  people:["Ian Goodfellow"],
  story:"2014 年，古德费洛在 NIPS 发表生成对抗网络。想法来自一家小酒馆的争论：能不能让两个神经网络互相对抗？一个生成器努力造假，一个判别器努力识破，二者博弈直到生成器能以假乱真。GAN 一举让 AI 学会“创造”——生成人脸、画风、甚至视频。它也带来 deepfake 的伦理风暴。古德费洛当晚喝完酒回家写出第一版代码，跑通时图像已经像模像样——有时好想法就差一杯酒的勇气。",

N({year:2015, ch:5, title:"TensorFlow：深度学习民主化",
  people:["Google Brain Team"],
  story:"2015 年 11 月，Google 开源 TensorFlow——深度学习框架。此前训练神经网络要手写反向传播、手动管理显存，门槛极高。TensorFlow 用数据流图把计算抽象成节点和边，自动求导、自动分布式。它让一个研究生花一个下午就能搭起以前要数月的实验。同年 Meta 发布 PyTorch，两者分庭抗礼。框架的民主化，让深度学习从几个大实验室的专利，变成全世界研究者的日常工具。",

N({year:2017, ch:5, title:"Transformer：Attention Is All You Need",
  people:["Vaswani 等 8 位作者"],
  story:"2017 年 6 月，八位 Google 研究者把一篇论文挂上 arXiv：《Attention Is All You Need》。他们扔掉了 RNN 和 CNN，只用“注意力机制”让模型一次看完全句、为每个词加权。Transformer 训练可并行、能捕捉长程依赖，效率远超过去。没人料到，这个为翻译设计的架构，日后撑起了 BERT、GPT、乃至所有大语言模型。八位作者后来各奔东西，几位创立了 Character.ai、Adept，他们自己也没想到这篇论文会改写 AI 格局。",
  related:{name:"注意力热力图", href:"tw-transformer.html"},

N({year:2018, ch:5, title:"BERT：预训练语言模型的突破",
  people:["Jacob Devlin","Google AI"],
  story:"2018 年 10 月，Google 发布 BERT——双向编码器表示。它的突破在“预训练”：先用海量无标注文本让模型学会语言本身，再用少量标注数据微调具体任务。这一“先广博、后专精”的范式，让 NLP 各项基准被一夜刷新。BERT 把“预训练+微调”确立为新范式，此后所有语言模型——GPT、T5、PaLM——都站在它的肩膀上。自然语言理解，正式进入“预训练为王”的时代。",

N({year:2019, ch:5, title:"GPT-2：\"太危险不能发布\"",
  people:["OpenAI"],
  story:"2019 年 2 月，OpenAI 发布 GPT-2，却没有放出完整模型——理由是“太危险”。它生成的假新闻几乎以假乱真，OpenAI 担心被滥用于造假与水军。这在 AI 圈引发激烈争论：是负责任，还是炒作？半年后他们分阶段放出了完整模型，世界并没有因此崩塌。但 GPT-2 第一次让大众直观感受到：语言模型不再只是玩具。它也为两年后 GPT-3 的爆发，悄悄埋好了引信。",

N({year:2020, ch:6, title:"GPT-3：1750 亿参数的涌现",
  people:["OpenAI"],
  story:"2020 年 6 月，OpenAI 发布 GPT-3，1750 亿参数，是 GPT-2 的一百多倍。真正的震撼来自 few-shot learning：给它几个例子，它就能写代码、写诗、做翻译、模拟对话，无需任何微调。规模带来了涌现——参数越多，能力越强，且出现训练时未直接优化的新技能。Scaling Law 从此成为行业信仰：只要继续堆算力和数据，奇迹会自己发生。大模型的军备竞赛，正式打响。",

N({year:2021, ch:6, title:"AlphaFold 2：蛋白质折叠被\"解决\"",
  people:["DeepMind","John Jumper"],
  story:"2021 年 7 月，DeepMind 公布 AlphaFold 2 的源码与数据库。它把困扰生物学五十年的“蛋白质折叠”问题基本解决——从氨基酸序列预测三维结构，精度接近实验。五十年来人类用 X 射线晶体学只解出约 17 万种蛋白结构，AlphaFold 一口气预测了几乎所有已知物种的 2 亿种。结构生物学被一夜改写，新药研发、酶工程、合成生物学获得了一座免费的金矿。AI 第一次让基础科学感到“被颠覆”。",

N({year:2022, ch:6, title:"ChatGPT：AI 的\"iPhone 时刻\"",
  people:["OpenAI","Sam Altman"],
  story:"2022 年 11 月 30 日，OpenAI 悄悄上线 ChatGPT。没有发布会，只有一条推文。五天后用户破百万，两个月破亿，成为史上增长最快的消费级应用。它背后的 RLHF（人类反馈强化学习）让模型学会“好好说话”——理解上下文、承认错误、拒绝有害请求。ChatGPT 让普通人第一次摸到强人工智能的边缘，被称作 AI 的“iPhone 时刻”。整个科技产业的叙事，从那天起被重写。",
  related:{name:"RLHF 奖励模型", href:"tw-chatgpt.html"},
  branches:[{label:"RLHF 是什么", content:"RLHF（Reinforcement Learning from Human Feedback）分三步：先让模型对同一问题生成多个回答；再由人类标注员给这些回答排序，训练一个“奖励模型”学会人类的偏好；最后用强化学习（PPO）让语言模型去最大化这个奖励。结果是模型不仅“会答”，还“会好好答”——更礼貌、更安全、更对齐人类意图。这是 ChatGPT 区别于 GPT-3 的关键。"}],
  svg:`<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M30 44 q0 -14 14 -14 h60 q14 0 14 14 v26 q0 14 -14 14 H64 l-16 14 v-14 h-4 q-14 0 -14 -14 Z"/></g><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M210 70 q0 -14 -14 -14 h-50 q-14 0 -14 14 v26 q0 14 14 14 h4 v12 l12 -12 h34 q14 0 14 -14 Z"/></g><g font-family="ui-monospace,monospace" font-size="8" fill="currentColor" opacity=".8"><text x="40" y="56">how to</text><text x="40" y="68">learn AI?</text><text x="134" y="80">1. math</text><text x="134" y="92">2. code</text><text x="134" y="104">3. build</text></g><g fill="currentColor" stroke="none" opacity=".5"><circle cx="44" cy="58" r="1.6"/><circle cx="44" cy="66" r="1.6"/><circle cx="196" cy="80" r="1.6"/><circle cx="196" cy="90" r="1.6"/><circle cx="196" cy="100" r="1.6"/></g><text x="120" y="134" font-family="ui-monospace,monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity=".7">1M users in 5 days · 100M in 2 months</text></svg>`}),

N({year:2022, ch:6, title:"Stable Diffusion：开源图像生成",

  story:"2022 年 8 月，Stability AI 把 Stable Diffusion 的权重开源。此前 DALL-E 2、Midjourney 都在云端闭源，按图收费。Stable Diffusion 能在一张消费级显卡上本地运行，任何人都能生成图像。这引爆了创作者社区：LoRA 微调、ControlNet 控图、无数工作流涌现。开源 vs 闭源的路线之争，从大语言模型烧到了图像生成。同时也掀起了版权、艺术、劳动的激烈讨论——AI 生成的画，算不算创作？",

N({year:2023, ch:6, title:"GPT-4：多模态的通才",
  people:["OpenAI"],
  story:"2023 年 3 月，GPT-4 发布。它首次具备多模态——能看懂图表、照片、手写笔记；在律师考试中打进前 10%，在生物奥赛接近金牌。OpenAI 用 RLHF 与一套人类价值观对齐方法，让它更安全、更可控，也更“像个通才”。GPT-4 仍会幻觉、仍会犯错，但它让“通用人工智能”不再是科幻词汇，而是一个可以认真讨论的工程目标。AI 能力的天花板到底在哪，成了这一年最焦虑的问题。",

N({year:2023, ch:6, title:"LLaMA：开源大模型爆发",
  people:["Meta","Yann LeCun"],
  story:"2023 年 2 月，Meta 意外泄露 LLaMA 模型权重——原本只给学术界申请。几天内权重传遍全网，社区立刻开始微调：羊驼、小羊驼、Vicuna、Alpaca 扎堆出现。一个几百美元显卡就能跑的小模型，经过微调逼近 GPT-3.5。开源大模型生态由此爆发，Meta 顺势把 Llama 2、Llama 3 完全开放。这场“意外的开源”逼得 OpenAI、Google 不断提速，也证明开放协作在 AI 时代仍有强大生命力。",

/* ============================================================
   TW Story · 渲染与交互层
   ============================================================ */
const LS_READ = "tw-story-read";
const LS_VIEW = "tw-story-view";
const TOTAL = NODES.length;
const state = { view:"cards", current:0, read:new Set() };

const chColor = (id)=> (CHAPTERS[id-1]||{}).color || "#f43f5e";
const chById  = (id)=> CHAPTERS[id-1];
const esc = (s)=> String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- 进度持久化 ---------- */
function loadRead(){
  try{ const a=JSON.parse(localStorage.getItem(LS_READ)||"[]"); state.read=new Set(a); }catch(e){ state.read=new Set(); }
}
function saveRead(){
  try{ localStorage.setItem(LS_READ, JSON.stringify([...state.read])); }catch(e){}
}
function updateProgress(){
  const n=state.read.size;
  document.getElementById("progressFill").style.width = (n/TOTAL*100)+"%";
  document.getElementById("progressText").textContent = n+" / "+TOTAL;
  document.querySelectorAll(".card").forEach((el,i)=>{
    el.classList.toggle("read", state.read.has(i));
  });
}
function markRead(i){
  if(!state.read.has(i)){ state.read.add(i); saveRead(); updateProgress(); }
}

/* ---------- 章节导航 ---------- */
function renderChapterNav(){
  const nav=document.getElementById("chapterNav");
  nav.innerHTML = CHAPTERS.map(c=>`
    <div class="chapter-tab" data-ch="${c.id}" style="--ch-color:${c.color}">
      <span class="idx">${c.id}</span>${c.title}
    </div>`).join("");
  nav.querySelectorAll(".chapter-tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      setView("cards");
      const firstIdx = NODES.findIndex(n=>n.ch===+t.dataset.ch);
      if(firstIdx>=0) scrollToNode(firstIdx);
    });
  });
}
function updateChapterActive(){
  const cur = NODES[state.current];
  if(!cur) return;
  document.querySelectorAll(".chapter-tab").forEach(t=>{
    t.classList.toggle("active", +t.dataset.ch===cur.ch);
  });
}

/* ---------- 卡片模板 ---------- */
function cardHTML(n, i){
  const c = chById(n.ch);
  const people = n.people.map(p=>`<span class="person-chip">${esc(p)}</span>`).join("");
  const branches = n.branches.length ? n.branches.map((b,bi)=>`
    <div style="margin-top:10px">
      <button class="branch-btn" data-branch="${i}-${bi}"><span class="tri">▸</span>了解更多：${esc(b.label)}</button>
      <div class="branch-content" data-bc="${i}-${bi}"><span class="blabel">${esc(b.label)}</span>${esc(b.content)}</div>
    </div>`).join("") : "";
  return `
  <article class="card" data-i="${i}" style="--era-color:${c.color}">
    <div class="card-year-col">
      <div class="card-year">${n.year}</div>
      <div class="card-dot"></div>
    </div>
    <div class="card-content">
      <div class="card-head">
        <div class="card-title">${esc(n.title)}</div>
        <div class="card-chapter-tag">CH${n.ch} · ${esc(c.range)}</div>
      </div>
      <p class="card-story">${esc(n.story)}</p>
      <div class="card-people"><span class="people-label">KEY PEOPLE</span>${people}</div>
      <div class="card-illustration">${n.svg}</div>
      <div class="card-footer">
        <a class="related-link" href="${esc(n.related.href)}" data-rel="${esc(n.related.name)}">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 L11 8 L6 13"/></svg>
          探索相关可视化 · ${esc(n.related.name)}
        </a>
        ${branches}
      </div>
    </div>
  </article>`;
}

/* ---------- 渲染卡片流 ---------- */
function chapterSepHTML(c){
  return `<div class="chapter-sep" style="--ch-color:${c.color}">
    <div class="chapter-sep-year">${c.range}</div>
    <div class="chapter-sep-body">
      <div>
        <div class="chapter-sep-title">${esc(c.title)}</div>
        <div class="chapter-sep-sub">CH${c.id} · ${esc(c.sub)}</div>
      </div>
      <div class="chapter-sep-bar"></div>
    </div>
  </div>`;
}

function renderCards(){
  const flow=document.getElementById("cardsFlow");
  let html="", lastCh=0;
  NODES.forEach((n,i)=>{
    if(n.ch!==lastCh){ html+=chapterSepHTML(chById(n.ch)); lastCh=n.ch; }
    html+=cardHTML(n,i);
  });
  flow.innerHTML=html;
  // 分支展开
  flow.querySelectorAll(".branch-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const k=btn.dataset.branch;
      const open=btn.classList.toggle("open");
      flow.querySelector('.branch-content[data-bc="'+k+'"]').classList.toggle("open",open);
    });
  });
  // 关联链接（TW 生态）
  flow.querySelectorAll(".related-link").forEach(a=>{
    a.addEventListener("click",(e)=>{
      e.preventDefault();
      showToast("将在 TW 生态中打开：<b>"+a.dataset.rel+"</b>");
    });
  });
  observeCards();
  updateProgress();
}

/* ---------- 滚动观察 / 当前节点 ---------- */
let io=null;
const visMap=new Map();
function observeCards(){
  if(io) io.disconnect();
  io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      const idx=+e.target.dataset.i;
      visMap.set(idx,e.intersectionRatio);
      if(e.isIntersecting && e.intersectionRatio>=0.55) markRead(idx);
    });
    let best=-1,br=-1;
    visMap.forEach((r,idx)=>{ if(r>br){br=r;best=idx;} });
    if(best>=0 && br>0){ state.current=best; updateChapterActive(); updateDock(); }
  },{threshold:[0.1,0.35,0.55,0.8]});
  document.querySelectorAll(".card").forEach(el=>io.observe(el));
}

function scrollToNode(i){
  const el=document.querySelector('.card[data-i="'+i+'"]');
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

function updateDock(){
  document.getElementById("dockPos").textContent=(state.current+1)+" / "+TOTAL;
  document.getElementById("prevBtn").disabled = state.current<=0;
  document.getElementById("nextBtn").disabled = state.current>=TOTAL-1;
  document.getElementById("topBtn").classList.toggle("show", window.scrollY>500);
}

function setView(v){
  state.view=v;
  try{ localStorage.setItem(LS_VIEW,v); }catch(e){}
  document.getElementById("vCards").classList.toggle("active",v==="cards");
  document.getElementById("vTimeline").classList.toggle("active",v==="timeline");
  document.getElementById("cardsFlow").classList.toggle("hidden",v!=="cards");
  document.getElementById("hero").classList.toggle("hidden",v!=="cards");
  document.getElementById("timelineView").classList.toggle("active",v==="timeline");
  if(v==="timeline") renderTimeline();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- 时间轴视图 ---------- */
function renderTimeline(){
  const svg=document.getElementById("timelineSvg");
  const W=1200, H=280, bandW=W/CHAPTERS.length, cy=150;
  let s="<defs>";
  CHAPTERS.forEach((c,i)=>{
    s+='<linearGradient id="cg'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c.color+'" stop-opacity=".18"/><stop offset="1" stop-color="'+c.color+'" stop-opacity="0"/></linearGradient>';
  });
  s+="</defs>";
  CHAPTERS.forEach((c,i)=>{
    const x=i*bandW;
    s+='<rect x="'+x+'" y="40" width="'+bandW+'" height="200" fill="url(#cg'+i+')" stroke="'+c.color+'" stroke-opacity=".25"/>';
    s+='<text x="'+(x+bandW/2)+'" y="30" fill="'+c.color+'" font-family="ui-monospace,monospace" font-size="14" font-weight="600" text-anchor="middle">CH'+c.id+' '+esc(c.title)+'</text>';
    s+='<text x="'+(x+bandW/2)+'" y="258" fill="#6b7178" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">'+c.range+'</text>';
  });
  s+='<line x1="0" y1="'+cy+'" x2="'+W+'" y2="'+cy+'" stroke="#2a2e34" stroke-width="1.5"/>';
  CHAPTERS.forEach((c,i)=>{
    const nodes=NODES.filter(n=>n.ch===c.id);
    const x0=i*bandW+34, x1=(i+1)*bandW-34;
    nodes.forEach((n,k)=>{
      const x = nodes.length===1 ? (x0+x1)/2 : x0 + (x1-x0)*k/(nodes.length-1);
      const ni = NODES.indexOf(n);
      const read = state.read.has(ni);
      const t = n.title.length>12 ? n.title.slice(0,11)+"…" : n.title;
      s+='<g class="tl-node" data-i="'+ni+'" transform="translate('+x+' '+cy+')">';
      s+='<circle r="'+(read?7:5.5)+'" fill="'+(read?c.color:"#0d0f11")+'" stroke="'+c.color+'" stroke-width="2"/>';
      s+='<text y="-16" fill="#a1a1aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">'+n.year+'</text>';
      s+='<text y="24" fill="#6b7178" font-family="ui-monospace,monospace" font-size="8.5" text-anchor="middle">'+esc(t)+'</text>';
      s+='</g>';
    });
  });
  svg.innerHTML=s;
  svg.querySelectorAll(".tl-node").forEach(g=>{
    g.addEventListener("click",()=>{
      const idx=+g.dataset.i;
      setView("cards");
      setTimeout(()=>scrollToNode(idx),140);
    });
  });
  document.getElementById("timelineLegend").innerHTML =
    '<span style="color:#6b7178">点击任意节点跳转到卡片 · 实心圆=已读</span>'+
    CHAPTERS.map(c=>'<span class="lg"><i style="background:'+c.color+'"></i>CH'+c.id+' '+esc(c.title)+'</span>').join("");
}

/* ---------- toast ---------- */
let toastTimer=null;
function showToast(html){
  const t=document.getElementById("toast");
  t.innerHTML=html; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}

/* ---------- 初始化 ---------- */
function init(){
  loadRead();
  try{ state.view=localStorage.getItem(LS_VIEW)||"cards"; }catch(e){}
  renderChapterNav();
  renderCards();
  setView(state.view);
  updateDock();
  document.getElementById("prevBtn").addEventListener("click",()=>{ if(state.current>0) scrollToNode(state.current-1); });
  document.getElementById("nextBtn").addEventListener("click",()=>{ if(state.current<TOTAL-1) scrollToNode(state.current+1); });
  document.getElementById("topBtn").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
  document.getElementById("vCards").addEventListener("click",()=>setView("cards"));
  document.getElementById("vTimeline").addEventListener("click",()=>setView("timeline"));
  window.addEventListener("keydown",(e)=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
    if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); if(state.view!=="cards")setView("cards"); else if(state.current<TOTAL-1)scrollToNode(state.current+1); }
    else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); if(state.view!=="cards")setView("cards"); else if(state.current>0)scrollToNode(state.current-1); }
    else if(e.key==="t"){ setView("timeline"); }
    else if(e.key==="c"){ setView("cards"); }
  });
  let ticking=false;
  window.addEventListener("scroll",()=>{
    if(!ticking){ ticking=true; requestAnimationFrame(()=>{ updateDock(); ticking=false; }); }
  },{passive:true});
}
init();
</script>
