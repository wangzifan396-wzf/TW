<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI搜索引擎与知识获取革命 - 可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.app-header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.app-logo{font-family:var(--mono);font-size:13px;color:var(--teal);background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.3);padding:4px 10px;border-radius:4px;letter-spacing:.5px;white-space:nowrap}
.app-title{font-size:17px;font-weight:600;color:var(--text)}
.app-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}
.module-nav{display:flex;gap:2px;padding:8px 28px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap}
.mod-btn{background:transparent;border:1px solid transparent;color:var(--text3);font-size:12px;padding:6px 12px;border-radius:4px;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:sans-serif}
.mod-btn:hover{color:var(--text2);background:var(--bg3)}
.mod-btn.active{color:var(--teal);border-color:rgba(0,212,170,.4);background:rgba(0,212,170,.06)}
.mod-btn .num{font-family:var(--mono);font-size:10px;opacity:.7;margin-right:4px}
.lab-hero{padding:20px 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.lab-hero .hero-top{display:flex;align-items:baseline;gap:12px}
.lab-hero .hero-num{font-family:var(--mono);font-size:28px;color:var(--teal);opacity:.4}
.lab-hero h1{font-size:21px;color:var(--text)}
.lab-hero p{font-size:13px;color:var(--text2);max-width:820px;margin-top:6px}
.lab-hero .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lab-hero .tag{font-size:11px;color:var(--cyan);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);padding:2px 8px;border-radius:3px;font-family:var(--mono)}
.module-panel{padding:0}
.view-tabs{display:flex;gap:0;padding:0 28px;background:var(--bg2);border-bottom:1px solid var(--border)}
.vtab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:13px;padding:10px 18px;cursor:pointer;transition:all .2s;font-family:sans-serif}
.vtab:hover{color:var(--text2)}
.vtab.active{color:var(--teal);border-bottom-color:var(--teal)}
.lab-main{display:flex;gap:0;align-items:stretch}
.svg-wrap{flex:1;padding:20px;background:var(--bg);min-height:520px;display:flex;align-items:center;justify-content:center}
.svg-wrap svg{width:100%;max-width:900px;height:auto}
.side-panel{width:280px;background:var(--bg2);border-left:1px solid var(--border);padding:16px;overflow-y:auto}
.side-mod{display:none}
.side-mod.active{display:block}
.side-section{margin-bottom:18px}
.side-section h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;font-family:var(--mono)}
.pills{display:flex;flex-direction:column;gap:6px}
.pill{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-size:12px}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{color:var(--text2);font-size:11px}
.legend{display:flex;flex-direction:column;gap:5px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.legend-swatch{width:14px;height:3px;border-radius:2px;flex-shrink:0}
.info{display:flex;flex-direction:column;gap:0}
.info-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)}
.info-k{font-family:var(--mono);font-size:11px;white-space:nowrap}
.info-v{color:var(--text2);text-align:right;font-size:12px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
@keyframes dashmove{to{stroke-dashoffset:-20}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.apulse{animation:pulse 2s ease-in-out infinite}
.aglow{animation:glow 2s ease-in-out infinite}
.adash{stroke-dasharray:6 4;animation:dashmove 1s linear infinite}
.ablink{animation:blink 1.5s ease-in-out infinite}
.aspin{animation:spin 4s linear infinite;transform-origin:center;transform-box:fill-box}
</style>
</head>
<body>
<div class="app-header">
  <span class="app-logo">SRCH-LAB</span>
  <div>
    <div class="app-title">AI搜索引擎与知识获取革命</div>
    <div class="app-sub">Visualization Lab &middot; 8 Modules &middot; 24 Views</div>
  </div>
</div>
<nav class="module-nav" id="moduleNav"></nav>
<div class="lab-hero">
  <div class="hero-top">
    <span class="hero-num" id="heroNum">01</span>
    <h1 id="heroTitle"></h1>
  </div>
  <p id="heroDesc"></p>
  <div class="tags">
    <span class="tag">Perplexity</span>
    <span class="tag">秘塔 Mita</span>
    <span class="tag">天工 Tiangong</span>
    <span class="tag">Kimi</span>
    <span class="tag">RAG</span>
    <span class="tag">Links -> Answers</span>
  </div>
</div>
<div class="module-panel">
  <div class="view-tabs" id="viewTabs"></div>
  <div class="lab-main">
    <div class="svg-wrap">
      <svg id="svg" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="side-panel" id="sidePanel"></div>
  </div>
</div>
<script>
var SVGNS='http://www.w3.org/2000/svg';
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

var MODULES=[
  {n:'01',t:'AI搜索引擎革命与知识获取重塑',d:'从链接到答案,搜索+推理编织,Perplexity/秘塔/天工/Kimi/You.com/Gemini五大引擎重塑信息获取',v:['范式转移','引擎全景','演进时间线']},
  {n:'02',t:'Perplexity与答案引擎范式',d:'带引用的思考者,边搜边读边想,信源可查报告,情境个性化,Answer Engine范式定义者',v:['搜索推理管线','功能矩阵','信源追溯']},
  {n:'03',t:'秘塔与中文AI搜索突破',d:'中文场景首选,长文档深度分析,知识库构建,学术搜索,中文原生AI搜索引擎代表',v:['中文能力雷达','长文档分析','学术搜索流']},
  {n:'04',t:'天工与多模态搜索',d:'多模态资料整理,图片/视频/文档理解,跨模态检索,多模态搜索引擎探索',v:['多模态管线','跨模态空间','模态理解']},
  {n:'05',t:'Kimi与长文档智能分析',d:'超长上下文,文档深度理解,论文/报告/合同分析,知识提取,超长上下文搜索引擎',v:['超长上下文','文档分析','知识提取']},
  {n:'06',t:'AI搜索技术架构与RAG',d:'检索增强生成,query理解,多路召回,答案合成,引用追溯,RAG驱动的搜索架构',v:['RAG管线','多路召回','答案合成']},
  {n:'07',t:'AI搜索商业化与生态竞争',d:'订阅模式/API/企业版,生态从搜索到AI工作台演变,定价对比,商业化路径',v:['定价矩阵','生态演变','市场份额']},
  {n:'08',t:'AI搜索终局与知识民主化',d:'搜索即起点,知识获取民主化,认知平权,搜索终局展望,知识平权与认知革命',v:['搜索即起点','知识民主化','终局展望']},
];

var mCur=0;
var mViews=[0,0,0,0,0,0,0,0];
var mLayers={};

function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){el.setAttribute(k,attrs[k]);}}
  if(parent){parent.appendChild(el);}
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild){n.removeChild(n.firstChild);}}
function box(g,x,y,w,h,opts){
  opts=opts||{};
  var r=E(g,'rect',{x:x,y:y,width:Math.max(w,1),height:Math.max(h,1),rx:opts.rx||6,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5});
  if(opts.dash){r.setAttribute('stroke-dasharray',opts.dash);}
  if(opts.cls){r.setAttribute('class',opts.cls);}
  if(opts.op){r.setAttribute('opacity',opts.op);}
  return r;
}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var t=E(g,'text',{x:x,y:y,fill:opts.fill||C.text,'font-size':opts.fs||12,'font-family':opts.family||'sans-serif','text-anchor':opts.anchor||'start','font-weight':opts.fw||'normal'});
  if(opts.op){t.setAttribute('opacity',opts.op);}
  if(opts.cls){t.setAttribute('class',opts.cls);}
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var l=E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5});
  if(opts.dash){l.setAttribute('stroke-dasharray',opts.dash);}
  if(opts.cls){l.setAttribute('class',opts.cls);}
  if(opts.op){l.setAttribute('opacity',opts.op);}
  return l;
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var col=opts.stroke||C.teal;
  var sw=opts.sw||2;
  var l=E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':sw});
  if(opts.dash){l.setAttribute('stroke-dasharray',opts.dash);}
  if(opts.cls){l.setAttribute('class',opts.cls);}
  var ang=Math.atan2(y2-y1,x2-x1);
  var ah=opts.ah||8;
  E(g,'polygon',{points:x2+','+y2+' '+(x2-ah*Math.cos(ang-0.4))+','+(y2-ah*Math.sin(ang-0.4))+' '+(x2-ah*Math.cos(ang+0.4))+','+(y2-ah*Math.sin(ang+0.4)),fill:col});
  return l;
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  var c=E(g,'circle',{cx:cx,cy:cy,r:Math.max(r,0.5),fill:opts.fill||'none',stroke:opts.stroke||C.teal,'stroke-width':opts.sw||1.5});
  if(opts.dash){c.setAttribute('stroke-dasharray',opts.dash);}
  if(opts.cls){c.setAttribute('class',opts.cls);}
  if(opts.op){c.setAttribute('opacity',opts.op);}
  return c;
}
function poly(g,pts,opts){
  opts=opts||{};
  var p=E(g,'polygon',{points:pts,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5});
  if(opts.cls){p.setAttribute('class',opts.cls);}
  if(opts.op){p.setAttribute('opacity',opts.op);}
  return p;
}
function radar(g,cx,cy,r,labels,values,opts){
  opts=opts||{};
  var n=labels.length;
  var max=opts.max||1;
  for(var ring=1;ring<=4;ring++){
    var pts='';
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+i*2*Math.PI/n;
      var rr=r*ring/4;
      pts+=(cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a))+' ';
    }
    E(g,'polygon',{points:pts,fill:'none',stroke:C.border,opacity:0.4});
  }
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+i*2*Math.PI/n;
    line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:C.border,op:0.5});
    txt(g,cx+(r+18)*Math.cos(a),cy+(r+18)*Math.sin(a)+4,labels[i],{fs:10,fill:C.text2,anchor:'middle'});
  }
  var dpts='';
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+i*2*Math.PI/n;
    var rr=r*values[i]/max;
    dpts+=(cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a))+' ';
  }
  E(g,'polygon',{points:dpts,fill:opts.fill||C.teal,opacity:0.15,stroke:opts.stroke||C.teal,'stroke-width':2});
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+i*2*Math.PI/n;
    var rr=r*values[i]/max;
    circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:opts.stroke||C.teal,stroke:'none'});
  }
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function setPills(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='pill';
    d.innerHTML='<span class="pill-dot" style="background:'+arr[i][1]+'"></span><span class="pill-label">'+arr[i][0]+'</span>';
    c.appendChild(d);
  }
}
function setLegend(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='legend-item';
    d.innerHTML='<span class="legend-swatch" style="background:'+arr[i][1]+'"></span><span>'+arr[i][0]+'</span>';
    c.appendChild(d);
  }
}
function setInfo(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  for(var i=0;i<arr.length;i++){
    var d=document.createElement('div');d.className='info-row';
    d.innerHTML='<span class="info-k" style="color:'+arr[i][2]+'">'+arr[i][0]+'</span><span class="info-v">'+arr[i][1]+'</span>';
    c.appendChild(d);
  }
}
function setView(mi,vi){mViews[mi]=vi;if(mi===mCur){drawModule(mi);updateViewTabs();}}
function drawModule(mi){
  for(var i=1;i<=8;i++){
    if(mLayers['m'+i]){mLayers['m'+i].style.display='none';}
    var sm=$('side-m'+i);if(sm){sm.classList.remove('active');}
  }
  mLayers['m'+(mi+1)].style.display='block';
  var sm2=$('side-m'+(mi+1));if(sm2){sm2.classList.add('active');}
  if(mi===0){m1Draw();}
  else if(mi===1){m2Draw();}
  else if(mi===2){m3Draw();}
  else if(mi===3){m4Draw();}
  else if(mi===4){m5Draw();}
  else if(mi===5){m6Draw();}
  else if(mi===6){m7Draw();}
  else if(mi===7){m8Draw();}
}
function selectModule(mi){mCur=mi;drawModule(mi);updateModuleNav();updateViewTabs();updateHero();}
function updateModuleNav(){
  var btns=document.querySelectorAll('.mod-btn');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',i===mCur);}
}
function updateViewTabs(){
  var vt=$('viewTabs');clearNode(vt);
  var m=MODULES[mCur];
  for(var i=0;i<m.v.length;i++){
    var b=document.createElement('button');
    b.className='vtab'+(i===mViews[mCur]?' active':'');
    b.textContent=m.v[i];
    b.onclick=(function(idx){return function(){setView(mCur,idx);};})(i);
    vt.appendChild(b);
  }
}
function updateHero(){
  var m=MODULES[mCur];
  $('heroTitle').textContent=m.t;
  $('heroDesc').textContent=m.d;
  $('heroNum').textContent=m.n;
}
function buildModuleNav(){
  var nav=$('moduleNav');clearNode(nav);
  for(var i=0;i<MODULES.length;i++){
    var b=document.createElement('button');b.className='mod-btn';
    b.innerHTML='<span class="num">'+MODULES[i].n+'</span>'+MODULES[i].t;
    b.onclick=(function(idx){return function(){selectModule(idx);};})(i);
    nav.appendChild(b);
  }
}
function buildSidePanel(){
  var sp=$('sidePanel');clearNode(sp);
  for(var i=1;i<=8;i++){
    var d=document.createElement('div');d.className='side-mod';d.id='side-m'+i;
    if(i===1){d.classList.add('active');}
    d.innerHTML='<div class="side-section"><h4>统计指标</h4><div class="pills" id="m'+i+'-stat"></div></div>'+
      '<div class="side-section"><h4>图例</h4><div class="legend" id="m'+i+'-leg"></div></div>'+
      '<div class="side-section"><h4>详情</h4><div class="info" id="m'+i+'-info"></div></div>';
    sp.appendChild(d);
  }
}
function initLayers(){
  var svg=$('svg');
  for(var i=1;i<=8;i++){
    var g=E(svg,'g',{id:'m'+i+'-layer'});
    g.style.display='none';
    mLayers['m'+i]=g;
  }
}
function init(){buildSidePanel();buildModuleNav();initLayers();selectModule(0);}
window.onload=init;

/* ===== Module 1: AI搜索引擎革命与知识获取重塑 ===== */
function m1Draw(){
  var g=mLayers.m1;clearNode(g);gridBg(g,900,480);
  var v=mViews[0];
  if(v===0){
    txt(g,450,30,'从链接到答案:搜索范式革命',{fs:18,fill:C.teal,anchor:'middle',fw:'bold'});
    txt(g,180,70,'传统搜索引擎',{fs:13,fill:C.amber,anchor:'middle',fw:'bold'});
    box(g,60,85,240,310,{stroke:C.amber,dash:'4 4'});
    var tradSteps=['用户输入查询','关键词匹配','返回链接列表','用户逐个点击','自行筛选信息'];
    for(var i=0;i<tradSteps.length;i++){
      var yy=105+i*56;
      box(g,100,yy,160,36,{fill:'rgba(251,191,36,.06)',stroke:C.amber,sw:1});
      txt(g,180,yy+23,tradSteps[i],{fs:11,fill:C.text,anchor:'middle'});
      if(i<tradSteps.length-1){arrow(g,180,yy+36,180,yy+56,{stroke:C.amber,sw:1.5,dash:'3 3'});}
    }
    txt(g,720,70,'AI答案引擎',{fs:13,fill:C.teal,anchor:'middle',fw:'bold'});
    box(g,600,85,240,310,{stroke:C.teal,dash:'4 4'});
    var aiSteps=['用户自然提问','意图理解+推理','多源检索+阅读','LLM合成答案','带引用直接回答'];
    for(var i=0;i<aiSteps.length;i++){
      var yy=105+i*56;
      box(g,640,yy,160,36,{fill:'rgba(0,212,170,.06)',stroke:C.teal,sw:1});
      txt(g,720,yy+23,aiSteps[i],{fs:11,fill:C.text,anchor:'middle'});
      if(i<aiSteps.length-1){var al=arrow(g,720,yy+36,720,yy+56,{stroke:C.teal,sw:1.5});al.setAttribute('class','adash');}
    }
    txt(g,450,225,'范式',{fs:14,fill:C.purple,anchor:'middle',fw:'bold'});
    txt(g,450,245,'革命',{fs:14,fill:C.purple,anchor:'middle',fw:'bold'});
    arrow(g,310,235,590,235,{stroke:C.purple,sw:2.5,dash:'6 4',ah:12});
    txt(g,180,418,'关键词 + 链接',{fs:10,fill:C.text3,anchor:'middle'});
    txt(g,180,435,'高跳出率 / 信息碎片',{fs:10,fill:C.red,anchor:'middle'});
