<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Playground — 交互式算法实验场</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;
  --border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;
  --accent:#06b6d4;--accent2:#0891b2;--accent-dim:rgba(6,182,212,.12);
  --warn:#f59e0b;--err:#ef4444;--ok:#10b981;
  --radius:8px;
  --mono:'SF Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 40px;border-bottom:1px solid var(--border);background:rgba(8,9,10,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.logo-mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:#000}
.logo .dim{color:var(--text3);font-weight:400}
header nav a{color:var(--text2);text-decoration:none;font-size:13px;transition:color .15s;display:flex;align-items:center;gap:6px}
header nav a:hover{color:var(--text)}
header nav a .arrow{font-size:11px}

/* Hero */
.hero{padding:64px 40px 48px;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(6,182,212,.06),transparent)}
.hero .badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(6,182,212,.2);padding:4px 12px;border-radius:20px;margin-bottom:20px}
.hero h1{font-size:44px;font-weight:700;letter-spacing:-.03em;margin-bottom:16px;line-height:1.1}
.hero h1 .accent{color:var(--accent)}
.hero p{color:var(--text2);font-size:16px;max-width:580px;margin:0 auto;line-height:1.7}
.hero .meta{display:flex;justify-content:center;gap:24px;margin-top:28px;font-size:12px;color:var(--text3)}
.hero .meta span{display:flex;align-items:center;gap:6px}
.hero .meta .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Selector */
.selector-wrap{padding:32px 40px 8px;max-width:1600px;margin:0 auto}
.selector-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.selector-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.selector-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:8px}
.selector-category h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px}
.selector-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.exp-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s;text-align:left;font-family:var(--sans);color:var(--text)}
.exp-card:hover{background:var(--bg3);border-color:var(--border2);transform:translateY(-1px)}
.exp-card.active{background:var(--accent-dim);border-color:var(--accent)}
.exp-num{font-family:var(--mono);font-size:11px;color:var(--text3);min-width:22px}
.exp-card.active .exp-num{color:var(--accent)}
.exp-name{font-size:13px;font-weight:500}

/* Experiment Area */
.exp-area{padding:24px 40px 48px;max-width:1600px;margin:0 auto}
.exp-header{margin-bottom:20px}
.exp-header h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.exp-header h2 .tag{font-size:11px;font-family:var(--mono);color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:4px;font-weight:400}
.exp-header p{color:var(--text2);font-size:13px;line-height:1.6;max-width:800px}
.exp-body{display:grid;grid-template-columns:280px 1fr 260px;gap:16px;margin-bottom:14px;align-items:start}

/* Panels */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.panel-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}

/* Controls */
.control-group{margin-bottom:16px}
.control-group:last-child{margin-bottom:0}
.control-group label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:6px}
.control-group .val{color:var(--accent);font-family:var(--mono);font-weight:600}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent);transition:transform .1s}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
input[type="text"],input[type="number"]{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;font-family:var(--sans);outline:none;transition:border-color .15s}
input[type="text"]:focus,input[type="number"]:focus{border-color:var(--accent)}
select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;outline:none;font-family:var(--sans)}
select:focus{border-color:var(--accent)}
button{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s;font-family:var(--sans);font-weight:500}
button:hover{background:var(--border2);border-color:var(--text3)}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#000;border-color:var(--accent)}
button.primary:hover{background:var(--accent2)}
button.ghost{background:transparent}
button.sm{padding:5px 10px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.checkbox-group{display:flex;flex-direction:column;gap:6px}
.checkbox-group label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);text-transform:none;letter-spacing:normal;cursor:pointer}
.checkbox-group input[type="checkbox"]{accent-color:var(--accent);width:14px;height:14px}

/* Viz */
.exp-viz{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;position:relative}
.exp-viz canvas{max-width:100%}
.viz-empty{color:var(--text3);font-size:13px;text-align:center}
.viz-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;align-self:flex-start}

/* Stats */
.stat-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-item:last-child{border-bottom:none}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-family:var(--mono);font-size:15px;color:var(--accent);font-weight:600}
.stat-value.warn{color:var(--warn)}
.stat-value.ok{color:var(--ok)}
.stat-value.err{color:var(--err)}

/* Actions */
.exp-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}

/* Code Panel */
.code-panel{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:var(--mono);font-size:11.5px;line-height:1.7;margin-top:12px;width:100%;max-height:200px;overflow:auto}
.code-line{padding:1px 8px;border-radius:3px;color:var(--text2);white-space:pre;transition:background .1s}
.code-line.active{background:var(--accent-dim);color:var(--accent)}
.code-line .ln{color:var(--text3);margin-right:10px;user-select:none}

/* Compare grid for sorting */
.compare-grid{display:grid;gap:12px;width:100%}
.compare-cell{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px}
.compare-cell h4{font-size:11px;color:var(--text2);margin-bottom:4px;font-family:var(--mono)}
.compare-cell canvas{width:100%;display:block}

/* Heatmap */
.heatmap{display:grid;gap:1px;font-family:var(--mono)}
.heatmap-cell{display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,.7);border-radius:2px;transition:background .2s}
.heatmap-label{font-size:10px;color:var(--text3);display:flex;align-items:center;justify-content:center}

/* Tree SVG */
.tree-svg{width:100%;height:auto}
.tree-node rect{fill:var(--bg3);stroke:var(--border2);stroke-width:1;rx:4}
.tree-node text{fill:var(--text);font-family:var(--mono);font-size:11px}
.tree-link{stroke:var(--border2);stroke-width:1.5;fill:none}

/* Graph SVG */
.graph-svg{width:100%;height:100%;cursor:pointer}
.graph-node{cursor:pointer;transition:all .15s}
.graph-node circle{fill:var(--bg3);stroke:var(--border2);stroke-width:2;transition:all .2s}
.graph-node.active circle{fill:var(--accent);stroke:var(--accent)}
.graph-node.visited circle{fill:var(--accent2);stroke:var(--accent)}
.graph-node.path circle{fill:var(--ok);stroke:var(--ok)}
.graph-node text{fill:var(--text);font-size:10px;font-family:var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.graph-edge{stroke:var(--border2);stroke-width:1.5;transition:all .2s}
.graph-edge.active{stroke:var(--accent);stroke-width:3}
.graph-edge.path{stroke:var(--ok);stroke-width:3}
.graph-edge text{fill:var(--text3);font-size:9px;font-family:var(--mono)}

/* Head tabs (attention) */
.head-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.head-tabs button{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:4px 12px;border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--mono);transition:all .15s}
.head-tabs button:hover{border-color:var(--accent);color:var(--text)}
.head-tabs button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* Node state for Raft */
.raft-node{transition:all .3s}

/* Footer */
footer{padding:32px 40px;border-top:1px solid var(--border);text-align:center;color:var(--text3);font-size:12px}
footer .links{display:flex;justify-content:center;gap:20px;margin-bottom:12px}
footer a{color:var(--text2);text-decoration:none;transition:color .15s}
footer a:hover{color:var(--accent)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;z-index:1000;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* Responsive */
@media(max-width:1100px){
  .exp-body{grid-template-columns:1fr}
}
@media(max-width:768px){
  header{padding:12px 16px}
  .hero{padding:40px 16px 28px}
  .hero h1{font-size:28px}
  .hero p{font-size:14px}
  .selector-wrap,.exp-area{padding:16px}
  .selector-cards{grid-template-columns:1fr}
  footer{padding:24px 16px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">TW</div>
    <span>TW Playground <span class="dim">/ 实验场</span></span>
  </div>
  <nav>
    <a href="index.html">返回首页 <span class="arrow">→</span></a>
  </nav>
</header>

<section class="hero">
  <div class="badge">Interactive Algorithm Lab</div>
  <h1>动手感受算法的<span class="accent">运作方式</span></h1>
  <p>不是看图，而是操作图。通过调整参数、观察动画来理解排序、图论、机器学习、分布式系统与密码学的核心算法。每个实验都是一个可调节参数、实时反馈的交互沙盒。</p>
  <div class="meta">
    <span><span class="dot"></span>12 个实验</span>
    <span><span class="dot"></span>零外部依赖</span>
    <span><span class="dot"></span>纯 SVG / Canvas</span>
  </div>
</section>

<div class="selector-wrap">
  <div class="selector-section-title">选择实验</div>
  <div class="selector-grid" id="selectorGrid"></div>
</div>

<div class="exp-area" id="expArea">
  <div class="viz-empty" style="padding:80px 0">从上方选择一个实验开始探索</div>
</div>

<footer>
  <div class="links">
    <a href="index.html">首页</a>
    <a href="tw-playground.html">Playground</a>
  </div>
  <div>TW Playground — 交互式算法实验场 · 纯前端实现，零外部依赖</div>
</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ==================== Utilities ==================== */
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html;
  return e;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1);}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove('show');},2000);
}
function setupCanvas(canvas,w,h){
  var dpr=window.devicePixelRatio||1;
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  canvas.width=w*dpr;
  canvas.height=h*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return ctx;
}
function makeSVG(tag,attrs){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  return e;
}

/* ==================== Control Helpers ==================== */
function ctrlGroup(label,inner){
  return '<div class="control-group"><label>'+label+'</label>'+inner+'</div>';
}
function rangeInput(id,min,max,val,step){
  return '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" value="'+val+'" step="'+(step||1)+'"><span class="val" id="'+id+'_val">'+val+'</span>';
}
function makeLayout(root,title,desc,tag){
  root.innerHTML=
    '<div class="exp-header">'+
      '<h2>'+title+(tag?' <span class="tag">'+tag+'</span>':'')+'</h2>'+
      '<p>'+desc+'</p>'+
    '</div>'+
    '<div class="exp-body">'+
      '<div class="panel" id="expControls"><div class="panel-title">参数控制</div><div id="ctrlInner"></div></div>'+
      '<div class="panel exp-viz" id="expViz" style="padding:16px"></div>'+
      '<div class="panel" id="expStats"><div class="panel-title">实时数据</div><div id="statsInner"></div></div>'+
    '</div>'+
    '<div class="exp-actions" id="expActions"></div>';
  return {
    controls:root.querySelector('#ctrlInner'),
    viz:root.querySelector('#expViz'),
    stats:root.querySelector('#statsInner'),
    actions:root.querySelector('#expActions')
  };
}
function statRow(label,value,cls){
  return '<div class="stat-item"><span class="stat-label">'+label+'</span><span class="stat-value '+(cls||'')+'" >'+value+'</span></div>';
}
function bindRange(id,cb){
  var r=document.getElementById(id),v=document.getElementById(id+'_val');
  r.addEventListener('input',function(){
    v.textContent=r.value;
    if(cb)cb(parseFloat(r.value));
  });
}

/* ==================== Experiments Registry ==================== */
var Experiments=[];

/* Color constants for SVG (CSS vars don't work in SVG attributes) */
var COL={bg3:'#16181d',border2:'#2a2d35',accent:'#06b6d4',accent2:'#0891b2',text:'#e4e4e7',text2:'#a1a1aa',text3:'#71717a',warn:'#f59e0b',ok:'#10b981',err:'#ef4444'};

/* ==================== Experiment 1: Sorting Arena ==================== */
var sortCode={
  bubble:['for i = 0 to n-1','  for j = 0 to n-i-2','    if arr[j] > arr[j+1]','      swap(arr[j], arr[j+1])'],
  quick:['function quicksort(lo, hi)','  if lo < hi','    p = partition(lo, hi)','    quicksort(lo, p-1)','    quicksort(p+1, hi)','function partition(lo, hi)','  pivot = arr[hi]','  i = lo - 1','  for j = lo to hi-1','    if arr[j] < pivot','      i++; swap(arr[i], arr[j])','  swap(arr[i+1], arr[hi])','  return i+1'],
  merge:['function mergesort(lo, hi)','  if lo < hi','    mid = (lo+hi)/2','    mergesort(lo, mid)','    mergesort(mid+1, hi)','    merge(lo, mid, hi)','function merge(lo, mid, hi)','  i=0, j=0, k=lo','  while i<len && j<len','    pick smaller; place at k','    k++','  copy remaining'],
  heap:['// build max heap','function heapify(n, i)','  l=2i+1, r=2i+2','  if l<n && arr[l]>arr[largest]','  if r<n && arr[r]>arr[largest]','  if largest != i','    swap; heapify(n, largest)','// extract elements','for i=n-1 to 1','  swap(arr[0], arr[i])','  heapify(i, 0)'],
  tim:['minRun = 16','for each run of size minRun:','  insertionSort(run)','function insertionSort(lo,hi)','  for i=lo+1 to hi','    key = arr[i]; j = i-1','    while j>=lo && arr[j]>key','      arr[j+1] = arr[j]; j--','for size=minRun; size<n; size*=2','  merge adjacent runs']
};
function bubbleSteps(a){var s=[],r=a.slice(),c=0,w=0;for(var i=0;i<r.length;i++){for(var j=0;j<r.length-i-1;j++){c++;s.push({t:'cmp',i:j,j:j+1,c:c,w:w,l:3,a:r.slice()});if(r[j]>r[j+1]){var t=r[j];r[j]=r[j+1];r[j+1]=t;w++;s.push({t:'swp',i:j,j:j+1,c:c,w:w,l:4,a:r.slice()});}}}s.push({t:'done',c:c,w:w,l:0,a:r.slice()});return s;}
function quickSteps(a){var s=[],r=a.slice(),c=0,w=0;function p(lo,hi){var pv=r[hi],i=lo-1;for(var j=lo;j<hi;j++){c++;s.push({t:'cmp',i:j,j:hi,c:c,w:w,l:10,a:r.slice()});if(r[j]<pv){i++;var t=r[i];r[i]=r[j];r[j]=t;w++;s.push({t:'swp',i:i,j:j,c:c,w:w,l:11,a:r.slice()});}}var t2=r[i+1];r[i+1]=r[hi];r[hi]=t2;w++;s.push({t:'swp',i:i+1,j:hi,c:c,w:w,l:12,a:r.slice()});return i+1;}function qs(lo,hi){if(lo<hi){s.push({t:'cmp',i:lo,j:hi,c:c,w:w,l:2,a:r.slice()});var m=p(lo,hi);qs(lo,m-1);qs(m+1,hi);}}qs(0,r.length-1);s.push({t:'done',c:c,w:w,l:0,a:r.slice()});return s;}
function mergeSteps(a){var s=[],r=a.slice(),c=0,w=0;function mg(lo,mid,hi){var L=r.slice(lo,mid+1),R=r.slice(mid+1,hi+1),i=0,j=0,k=lo;while(i<L.length&&j<R.length){c++;s.push({t:'cmp',i:lo+i,j:mid+1+j,c:c,w:w,l:9,a:r.slice()});if(L[i]<=R[j]){r[k]=L[i];i++;}else{r[k]=R[j];j++;}w++;s.push({t:'swp',i:k,j:k,c:c,w:w,l:10,a:r.slice()});k++;}while(i<L.length){r[k]=L[i];i++;k++;w++;s.push({t:'swp',i:k-1,j:k-1,c:c,w:w,l:11,a:r.slice()});}while(j<R.length){r[k]=R[j];j++;k++;w++;s.push({t:'swp',i:k-1,j:k-1,c:c,w:w,l:11,a:r.slice()});}}function ms(lo,hi){if(lo<hi){var mid=(lo+hi)>>1;ms(lo,mid);ms(mid+1,hi);mg(lo,mid,hi);}}ms(0,r.length-1);s.push({t:'done',c:c,w:w,l:0,a:r.slice()});return s;}
function heapSteps(a){var s=[],r=a.slice(),c=0,w=0;function hf(n,i){var lg=i,l=2*i+1,rt=2*i+2;if(l<n){c++;s.push({t:'cmp',i:l,j:lg,c:c,w:w,l:4,a:r.slice()});if(r[l]>r[lg])lg=l;}if(rt<n){c++;s.push({t:'cmp',i:rt,j:lg,c:c,w:w,l:5,a:r.slice()});if(r[rt]>r[lg])lg=rt;}if(lg!==i){var t=r[i];r[i]=r[lg];r[lg]=t;w++;s.push({t:'swp',i:i,j:lg,c:c,w:w,l:7,a:r.slice()});hf(n,lg);}}for(var i=(r.length>>1)-1;i>=0;i--)hf(r.length,i);for(var i2=r.length-1;i2>0;i2--){var t2=r[0];r[0]=r[i2];r[i2]=t2;w++;s.push({t:'swp',i:0,j:i2,c:c,w:w,l:10,a:r.slice()});hf(i2,0);}s.push({t:'done',c:c,w:w,l:0,a:r.slice()});return s;}
function timSteps(a){var s=[],r=a.slice(),c=0,w=0,mr=16;function is(lo,hi){for(var i=lo+1;i<=hi;i++){var key=r[i],j=i-1;while(j>=lo){c++;s.push({t:'cmp',i:j,j:j+1,c:c,w:w,l:7,a:r.slice()});if(r[j]>key){r[j+1]=r[j];w++;s.push({t:'swp',i:j+1,j:j,c:c,w:w,l:8,a:r.slice()});j--;}else break;}r[j+1]=key;}}function mg(lo,mid,hi){var L=r.slice(lo,mid+1),R=r.slice(mid+1,hi+1),i=0,j=0,k=lo;while(i<L.length&&j<R.length){c++;s.push({t:'cmp',i:lo+i,j:mid+1+j,c:c,w:w,l:10,a:r.slice()});if(L[i]<=R[j]){r[k]=L[i];i++;}else{r[k]=R[j];j++;}w++;s.push({t:'swp',i:k,j:k,c:c,w:w,l:10,a:r.slice()});k++;}while(i<L.length)r[k++]=L[i++];while(j<R.length)r[k++]=R[j++];}for(var i=0;i<r.length;i+=mr)is(i,Math.min(i+mr-1,r.length-1));for(var sz=mr;sz<r.length;sz*=2){for(var lo=0;lo<r.length;lo+=2*sz){var mid=lo+sz-1,hi=Math.min(lo+2*sz-1,r.length-1);if(mid<hi)mg(lo,mid,hi);}}s.push({t:'done',c:c,w:w,l:0,a:r.slice()});return s;}

Experiments.push({
  id:'bptree',num:2,name:'B+树操作台',category:'数据结构',
  desc:'插入、删除、查找节点，观察B+树的分裂与合并过程。调整树的阶数，理解平衡多路搜索树的自调节机制。',
  mount:function(root){
    var L=makeLayout(root,'B+树操作台','插入、删除、查找节点，观察B+树的分裂与合并过程。调整阶数，理解平衡多路搜索树的自调节机制。','B+ Tree');
    var S={order:4,tree:null,lastOp:'',highlight:null};
    function createTree(order){
      var root={isLeaf:true,keys:[],children:[],next:null,parent:null};
      function minK(){return Math.ceil(order/2)-1;}
      function findLeaf(key){var n=root;while(!n.isLeaf){var i=0;while(i<n.keys.length&&key>=n.keys[i])i++;n=n.children[i];}return n;}
      function insert(key){
        var leaf=findLeaf(key),pos=0;while(pos<leaf.keys.length&&key>leaf.keys[pos])pos++;
        if(pos<leaf.keys.length&&leaf.keys[pos]===key)return false;leaf.keys.splice(pos,0,key);
        if(leaf.keys.length>order-1)splitLeaf(leaf);return true;
      }
      function splitLeaf(leaf){
        var mid=Math.ceil(leaf.keys.length/2);
        var nl={isLeaf:true,keys:leaf.keys.slice(mid),children:[],next:leaf.next,parent:null};
        leaf.keys=leaf.keys.slice(0,mid);leaf.next=nl;insertInParent(leaf,nl.keys[0],nl);
      }
      function insertInParent(node,key,newNode){
        if(node===root){var nr={isLeaf:false,keys:[key],children:[node,newNode],parent:null};node.parent=nr;newNode.parent=nr;root=nr;return;}
        var p=node.parent,idx=p.children.indexOf(node);p.keys.splice(idx,0,key);p.children.splice(idx+1,0,newNode);newNode.parent=p;
        if(p.keys.length>order-1)splitInternal(p);
      }
      function splitInternal(node){
        var mid=Math.floor(node.keys.length/2),pk=node.keys[mid];
        var nn={isLeaf:false,keys:node.keys.slice(mid+1),children:node.children.slice(mid+1),parent:null};
        node.keys=node.keys.slice(0,mid);node.children=node.children.slice(0,mid+1);
        nn.children.forEach(function(c){c.parent=nn;});insertInParent(node,pk,nn);
      }
      function search(key){var l=findLeaf(key);return l.keys.indexOf(key)>=0;}
      function del(key){
        var leaf=findLeaf(key),idx=leaf.keys.indexOf(key);if(idx<0)return false;leaf.keys.splice(idx,1);
        if(leaf===root)return true;if(leaf.keys.length>=minK())return true;rebalance(leaf);return true;
      }
      function rebalance(node){
        if(node===root){if(!node.isLeaf&&node.children.length===1){root=node.children[0];root.parent=null;}return;}
        var p=node.parent,idx=p.children.indexOf(node);
        var ls=idx>0?p.children[idx-1]:null,rs=idx<p.children.length-1?p.children[idx+1]:null;
        if(ls&&ls.keys.length>minK()){
          if(node.isLeaf){node.keys.unshift(ls.keys.pop());p.keys[idx-1]=node.keys[0];}
          else{node.keys.unshift(p.keys[idx-1]);p.keys[idx-1]=ls.keys.pop();var ch=ls.children.pop();ch.parent=node;node.children.unshift(ch);}
          return;
        }
        if(rs&&rs.keys.length>minK()){
          if(node.isLeaf){node.keys.push(rs.keys.shift());p.keys[idx]=rs.keys[0];}
          else{node.keys.push(p.keys[idx]);p.keys[idx]=rs.keys.shift();var ch2=rs.children.shift();ch2.parent=node;node.children.push(ch2);}
          return;
        }
        if(ls)merge(ls,node,p,idx-1);else merge(node,rs,p,idx);
        if(p===root){if(p.keys.length===0){root=p.children[0];root.parent=null;}}
        else if(p.keys.length<minK())rebalance(p);
      }
      function merge(left,right,parent,keyIdx){
        if(left.isLeaf){left.keys=left.keys.concat(right.keys);left.next=right.next;}
        else{left.keys.push(parent.keys[keyIdx]);left.keys=left.keys.concat(right.keys);right.children.forEach(function(c){c.parent=left;});left.children=left.children.concat(right.children);}
        parent.keys.splice(keyIdx,1);parent.children.splice(parent.children.indexOf(right),1);
      }
      function getHeight(){var h=1,n=root;while(!n.isLeaf){h++;n=n.children[0];}return h;}
      function countNodes(){var c=0;(function w(n){c++;if(!n.isLeaf)n.children.forEach(w);})(root);return c;}
      function countKeys(){var c=0;(function w(n){if(n.isLeaf)c+=n.keys.length;else n.children.forEach(w);})(root);return c;}
      return{root:root,insert:insert,del:del,search:search,getHeight:getHeight,countNodes:countNodes,countKeys:countKeys,findLeaf:findLeaf};
    }
    S.tree=createTree(S.order);
    L.controls.innerHTML=
      ctrlGroup('阶数 (order)',rangeInput('bpOrder',3,7,S.order,1))+
      ctrlGroup('插入节点','<div class="btn-row"><input type="number" id="bpIns" placeholder="数字" style="flex:1"><button class="sm" id="bpInsBtn">插入</button></div>')+
      ctrlGroup('删除节点','<div class="btn-row"><input type="number" id="bpDel" placeholder="数字" style="flex:1"><button class="sm" id="bpDelBtn">删除</button></div>')+
      ctrlGroup('查找节点','<div class="btn-row"><input type="number" id="bpFind" placeholder="数字" style="flex:1"><button class="sm" id="bpFindBtn">查找</button></div>')+
      ctrlGroup('批量操作','<div class="btn-row"><button class="sm" id="bpRand">随机10个</button><button class="sm" id="bpClear">清空</button></div>');
    L.actions.innerHTML='<button id="bpReset">重置</button>';
    function render(){
      var maxD=0,lc=0;
      (function lay(n,d){if(d>maxD)maxD=d;if(n.isLeaf){n._x=lc;lc++;}else{var s=0;n.children.forEach(function(c){lay(c,d+1);s+=c._x;});n._x=s/n.children.length;}n._y=d;})(S.tree.root,0);
      var kw=34,nh=24,gx=8,gy=55;

      // parent-child links
      all.forEach(function(n){if(!n.isLeaf){n.children.forEach(function(c){
        var x1=n._x*(kw+gx)+20,y1=n._y*gy+20,x2=c._x*(kw+gx)+20,y2=c._y*gy+20;
        svg.appendChild(makeSVG('line',{x1:x1,y1:y1+nh/2,x2:x2,y2:y2-nh/2,stroke:COL.border2,'stroke-width':1.5}));
      });}});
      // nodes
      all.forEach(function(n){
        var g=makeSVG('g',{});var cx=n._x*(kw+gx)+20,cy=n._y*gy+20;
        var hl=S.highlight===n;var totalW=n.keys.length*kw||kw;
        var lx=cx-totalW/2;
        for(var i=0;i<Math.max(n.keys.length,1);i++){
          var rx=lx+i*kw;
          svg.appendChild(makeSVG('rect',{x:rx,y:cy-nh/2,width:kw,height:nh,fill:hl?'rgba(6,182,212,0.2)':COL.bg3,stroke:hl?COL.accent:COL.border2,'stroke-width':1,rx:3}));
          if(n.keys[i]!==undefined){var t=makeSVG('text',{x:rx+kw/2,y:cy,'text-anchor':'middle','dominant-baseline':'central',fill:COL.text,'font-family':'monospace','font-size':11});t.textContent=n.keys[i];svg.appendChild(t);}
        }

      });
      L.viz.innerHTML='';L.viz.appendChild(svg);
      L.stats.innerHTML=statRow('阶数',S.order)+statRow('树高度',S.tree.getHeight())+statRow('节点总数',S.tree.countNodes())+statRow('叶子键数',S.tree.countKeys())+statRow('最后操作',S.lastOp||'—');
    }
    function doInsert(v){if(isNaN(v))return;var ok=S.tree.insert(v);S.lastOp=ok?'插入 '+v:'已存在 '+v;S.highlight=null;render();}
    function doDelete(v){if(isNaN(v))return;var ok=S.tree.del(v);S.lastOp=ok?'删除 '+v:'未找到 '+v;S.highlight=null;render();}
    function doSearch(v){if(isNaN(v))return;var f=S.tree.search(v);S.lastOp=f?'找到 '+v:'未找到 '+v;S.highlight=S.tree.findLeaf(v);render();}
    bindRange('bpOrder',function(v){S.order=v;S.tree=createTree(v);S.lastOp='阶数改为 '+v;render();});

  desc:'调整哈希函数和冲突解决策略（链地址/开放寻址/布谷鸟），观察不同策略下的冲突率变化。插入键值，实时可视化哈希表结构。',
  mount:function(root){
    var L=makeLayout(root,'哈希表冲突解决','调整哈希函数和冲突策略，观察不同策略下的冲突率。插入键值，实时可视化哈希表结构。','Hash Table');
    var S={size:10,hashFn:'division',strategy:'chaining',buckets:[],t1:[],t2:[],collisions:0,insertions:0,failed:0,lastKey:null,lastBucket:-1,batchTimer:0};
    function initTable(){S.buckets=[];for(var i=0;i<S.size;i++)S.buckets.push([]);S.t1=new Array(S.size).fill(null);S.t2=new Array(S.size).fill(null);S.collisions=0;S.insertions=0;S.failed=0;S.lastKey=null;S.lastBucket=-1;}
    function h1(key){if(S.hashFn==='division')return key%S.size;return Math.floor(S.size*((key*0.6180339887)%1));}
    function h2(key){return Math.floor(S.size*((key*0.4142135623)%1));}
    function insertKey(key){
      S.insertions++;S.lastKey=key;
      if(S.strategy==='chaining'){var i=h1(key);if(S.buckets[i].length>0)S.collisions++;S.buckets[i].push(key);S.lastBucket=i;return true;}
      if(S.strategy==='linear'){var i=h1(key),st=i;while(S.buckets[i].length>0){S.collisions++;i=(i+1)%S.size;if(i===st){S.failed++;return false;}}S.buckets[i]=[key];S.lastBucket=i;return true;}
      if(S.strategy==='quadratic'){var b=h1(key);for(var i=0;i<S.size;i++){var p=(b+i*i)%S.size;if(S.buckets[p].length===0){if(i>0)S.collisions+=i;S.buckets[p]=[key];S.lastBucket=p;return true;}}S.failed++;return false;}
      if(S.strategy==='cuckoo'){var a=h1(key),b=h2(key);if(S.t1[a]===null){S.t1[a]=key;S.lastBucket=a;return true;}if(S.t2[b]===null){S.t2[b]=key;S.collisions++;S.lastBucket=b+S.size;return true;}S.collisions++;var cur=key,useT1=true;for(var i=0;i<S.size*2;i++){if(useT1){var h=h1(cur);if(S.t1[h]===null){S.t1[h]=cur;S.lastBucket=h;return true;}var ev=S.t1[h];S.t1[h]=cur;cur=ev;}else{var h=h2(cur);if(S.t2[h]===null){S.t2[h]=cur;S.lastBucket=h+S.size;return true;}var ev2=S.t2[h];S.t2[h]=cur;cur=ev2;}useT1=!useT1;}S.failed++;return false;}
    }
    L.controls.innerHTML=
      ctrlGroup('表大小 (m)',rangeInput('htSize',5,30,S.size,1))+
      ctrlGroup('哈希函数','<select id="htHash"><option value="division">除留余数法 k%m</option><option value="multiplication">乘法法 floor(m*(kA%1))</option></select>')+
      ctrlGroup('冲突策略','<select id="htStrategy">'+Object.keys(htStrategies).map(function(k){return '<option value="'+k+'"'+(S.strategy===k?' selected':'')+'>'+htStrategies[k]+'</option>'}).join('')+'</select>')+
      ctrlGroup('插入键值','<div class="btn-row"><input type="number" id="htIns" placeholder="输入数字" style="flex:1"><button class="sm" id="htInsBtn">插入</button></div>')+
      ctrlGroup('批量操作','<div class="btn-row"><button class="sm" id="htBatch">随机插入15个</button><button class="sm" id="htClear">清空</button></div>');
    L.actions.innerHTML='<button id="htReset">重置</button>';
    document.getElementById('htHash').value=S.hashFn;
    function renderHT(){
      var ch=24,w=S.strategy==='cuckoo'?500:440,h=Math.max(S.size*ch+40,200);
      var cv=el('canvas'),ctx=setupCanvas(cv,w,h);ctx.font='11px monospace';
      if(S.strategy==='cuckoo'){
        var cw=(w-50)/2;ctx.fillStyle=COL.text3;ctx.fillText('Table 1 (h1)',25,14);ctx.fillText('Table 2 (h2)',cw+35,14);
        for(var i=0;i<S.size;i++){var y=24+i*ch;
          var la=S.lastBucket===i;ctx.fillStyle=S.t1[i]!==null?(la?'rgba(6,182,212,0.25)':'rgba(6,182,212,0.08)'):COL.bg3;ctx.strokeStyle=la?COL.accent:COL.border2;ctx.fillRect(25,y,cw-10,ch-2);ctx.strokeRect(25,y,cw-10,ch-2);
          ctx.fillStyle=COL.text3;ctx.fillText('['+i+']',30,y+15);if(S.t1[i]!==null){ctx.fillStyle=la?COL.accent:COL.text;ctx.fillText(S.t1[i],65,y+15);}
          var lb=S.lastBucket===i+S.size;ctx.fillStyle=S.t2[i]!==null?(lb?'rgba(6,182,212,0.25)':'rgba(6,182,212,0.08)'):COL.bg3;ctx.strokeStyle=lb?COL.accent:COL.border2;ctx.fillRect(cw+35,y,cw-10,ch-2);ctx.strokeRect(cw+35,y,cw-10,ch-2);
          ctx.fillStyle=COL.text3;ctx.fillText('['+i+']',cw+40,y+15);if(S.t2[i]!==null){ctx.fillStyle=lb?COL.accent:COL.text;ctx.fillText(S.t2[i],cw+75,y+15);}
        }
      }else{
        var cw2=w-50;
        for(var i=0;i<S.size;i++){var y=24+i*ch;var bk=S.buckets[i],hc=bk.length>1,la=S.lastBucket===i;
          ctx.fillStyle=bk.length>0?(la?'rgba(6,182,212,0.25)':(hc?'rgba(245,158,11,0.1)':'rgba(6,182,212,0.08)')):COL.bg3;
          ctx.strokeStyle=la?COL.accent:(hc?COL.warn:COL.border2);ctx.fillRect(25,y,cw2,ch-2);ctx.strokeRect(25,y,cw2,ch-2);
          ctx.fillStyle=COL.text3;ctx.fillText('['+i+']',30,y+15);
          var x=65;bk.forEach(function(v,j){if(j>0){ctx.fillStyle=COL.warn;ctx.fillText('→',x,y+15);x+=16;}ctx.fillStyle=(la&&j===bk.length-1)?COL.accent:COL.text;ctx.fillText(v,x,y+15);x+=32;});
        }
      }
      L.viz.innerHTML='';L.viz.appendChild(cv);
      var lf=(S.insertions/S.size).toFixed(2);var rate=S.insertions>0?((S.collisions/S.insertions)*100).toFixed(1)+'%':'0%';
      L.stats.innerHTML=statRow('表大小',S.size)+statRow('哈希函数',S.hashFn==='division'?'除留余数':'乘法法')+statRow('策略',htStrategies[S.strategy])+statRow('总插入',S.insertions)+statRow('冲突次数',S.collisions,S.collisions>0?'warn':'')+statRow('冲突率',rate)+statRow('负载因子',lf)+statRow('失败插入',S.failed,S.failed>0?'err':'')+statRow('最后键值',S.lastKey!==null?S.lastKey:'—');
    }
    function doInsert(v){if(isNaN(v))return;insertKey(v);renderHT();}
    bindRange('htSize',function(v){S.size=v;initTable();renderHT();});
    document.getElementById('htHash').addEventListener('change',function(e){S.hashFn=e.target.value;});
    document.getElementById('htStrategy').addEventListener('change',function(e){S.strategy=e.target.value;initTable();renderHT();});
    document.getElementById('htInsBtn').addEventListener('click',function(){doInsert(parseInt(document.getElementById('htIns').value));document.getElementById('htIns').value='';});
    document.getElementById('htIns').addEventListener('keydown',function(e){if(e.key==='Enter'){doInsert(parseInt(e.target.value));e.target.value='';}});
    document.getElementById('htBatch').addEventListener('click',function(){
      if(S.batchTimer)clearTimeout(S.batchTimer);var keys=[];for(var i=0;i<15;i++)keys.push(randInt(1,999));var idx=0;
      function next(){if(idx>=keys.length)return;insertKey(keys[idx]);idx++;renderHT();S.batchTimer=setTimeout(next,150);}next();
    });
    document.getElementById('htClear').addEventListener('click',function(){if(S.batchTimer)clearTimeout(S.batchTimer);initTable();renderHT();});
    document.getElementById('htReset').addEventListener('click',function(){if(S.batchTimer)clearTimeout(S.batchTimer);initTable();renderHT();});
    initTable();renderHT();
    return function(){if(S.batchTimer)clearTimeout(S.batchTimer);};
  }
});

/* ==================== Experiment 4: Shortest Path Explorer ==================== */
Experiments.push({
  id:'shortestpath',num:4,name:'最短路径探索器',category:'图算法',

  mount:function(root){

    var S={graph:null,algo:'dijkstra',start:-1,end:-1,steps:[],stepIdx:0,running:false,raf:0,speed:50,visited:{},activeEdges:{},pathEdges:{},pathNodes:{},matrix:null,matrixUpdate:null,finalDist:Infinity,relaxCount:0,visitCount:0};
    function genGraph(n,density){
      var nodes=[],edges=[];var cx=220,cy=200,r=140;
      for(var i=0;i<n;i++){var a=(i/n)*Math.PI*2-Math.PI/2;nodes.push({id:i,x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}
      for(var i=0;i<n;i++){var j=(i+1)%n;edges.push({from:i,to:j,weight:randInt(1,15)});}
      for(var i=0;i<n;i++){for(var j=i+2;j<n;j++){if(j!==(i+1)%n&&Math.random()<density){edges.push({from:i,to:j,weight:randInt(1,20)});}}}
      return{nodes:nodes,edges:edges};
    }
    function dijkstraSteps(g,s,e){
      var st=[],dist={},vis={},prev={};g.nodes.forEach(function(n){dist[n.id]=Infinity;});dist[s]=0;
      while(true){var u=-1,md=Infinity;for(var id in dist){if(!vis[id]&&dist[id]<md){md=dist[id];u=parseInt(id);}}if(u===-1||u===e)break;vis[u]=true;st.push({type:'visit',node:u});
        g.edges.forEach(function(ed){[[ed.from,ed.to],[ed.to,ed.from]].forEach(function(d){if(d[0]===u&&!vis[d[1]]){var nd=dist[u]+ed.weight;if(nd<dist[d[1]]){dist[d[1]]=nd;prev[d[1]]=u;st.push({type:'relax',from:u,to:d[1]});}}});});}
      var path=[];var c=e;while(c!==undefined){path.unshift(c);c=prev[c];}st.push({type:'done',path:path,dist:dist[e]});return st;
    }
    function bfSteps(g,s,e){
      var st=[],dist={},prev={};g.nodes.forEach(function(n){dist[n.id]=Infinity;});dist[s]=0;var V=g.nodes.length;
      for(var i=0;i<V-1;i++){var up=false;g.edges.forEach(function(ed){[[ed.from,ed.to],[ed.to,ed.from]].forEach(function(d){if(dist[d[0]]!==Infinity&&dist[d[0]]+ed.weight<dist[d[1]]){dist[d[1]]=dist[d[0]]+ed.weight;prev[d[1]]=d[0];up=true;st.push({type:'relax',from:d[0],to:d[1],iter:i});}});});if(!up)break;}
      var path=[];var c=e;while(c!==undefined){path.unshift(c);c=prev[c];}st.push({type:'done',path:path,dist:dist[e]});return st;
    }
    function floydSteps(g,s,e){
      var st=[],n=g.nodes.length,dist=[],nxt=[];for(var i=0;i<n;i++){dist.push(new Array(n).fill(Infinity));nxt.push(new Array(n).fill(null));dist[i][i]=0;}
      g.edges.forEach(function(ed){if(ed.weight<dist[ed.from][ed.to]){dist[ed.from][ed.to]=ed.weight;nxt[ed.from][ed.to]=ed.to;}if(ed.weight<dist[ed.to][ed.from]){dist[ed.to][ed.from]=ed.weight;nxt[ed.to][ed.from]=ed.from;}});
      st.push({type:'init',matrix:dist.map(function(r){return r.slice();})});
      for(var k=0;k<n;k++){for(var i=0;i<n;i++){for(var j=0;j<n;j++){if(dist[i][k]+dist[k][j]<dist[i][j]){dist[i][j]=dist[i][k]+dist[k][j];nxt[i][j]=nxt[i][k];st.push({type:'update',k:k,i:i,j:j,dist:dist[i][j]});}}}}
      var path=[];if(dist[s][e]!==Infinity){var c=s;while(c!==e&&c!==null){path.push(c);c=nxt[c][e];}if(c===e)path.push(e);}
      st.push({type:'done',dist:dist[s][e],path:path});return st;
    }
    L.controls.innerHTML=
      ctrlGroup('算法','<select id="spAlgo"><option value="dijkstra">Dijkstra</option><option value="bellmanford">Bellman-Ford</option><option value="floyd">Floyd-Warshall</option></select>')+
      ctrlGroup('节点数',rangeInput('spNodes',5,15,8,1))+
      ctrlGroup('边密度',rangeInput('spDensity',10,60,30,1))+
      ctrlGroup('动画速度',rangeInput('spSpeed',1,100,S.speed,1))+
      ctrlGroup('操作','<div class="btn-row"><button class="sm" id="spGen">生成新图</button></div>')+
      '<div style="font-size:11px;color:var(--text3);line-height:1.6;margin-top:8px">点击节点选择起点(青)和终点(橙)，然后点击运行。</div>';
    L.actions.innerHTML='<button id="spReset">重置</button><button id="spRun" class="primary">运行</button>';
    function renderGraph(){
      var g=S.graph;var svg=makeSVG('svg',{class:'graph-svg',width:440,height:400});
      g.edges.forEach(function(e){var n1=g.nodes[e.from],n2=g.nodes[e.to];var k=e.from+'-'+e.to,k2=e.to+'-'+e.from;
        var isA=S.activeEdges[k]||S.activeEdges[k2],isP=S.pathEdges[k]||S.pathEdges[k2];
        svg.appendChild(makeSVG('line',{x1:n1.x,y1:n1.y,x2:n2.x,y2:n2.y,stroke:isP?COL.ok:(isA?COL.accent:COL.border2),'stroke-width':isP?3:(isA?2.5:1.5)}));
        var mx=(n1.x+n2.x)/2,my=(n1.y+n2.y)/2;svg.appendChild(makeSVG('rect',{x:mx-9,y:my-8,width:18,height:16,fill:'#0f1115',rx:2}));
        var wt=makeSVG('text',{x:mx,y:my,'text-anchor':'middle','dominant-baseline':'central',fill:COL.text3,'font-size':9,'font-family':'monospace'});wt.textContent=e.weight;svg.appendChild(wt);
      });
      g.nodes.forEach(function(n){
        var fill=COL.bg3,stroke=COL.border2;

        var ng=makeSVG('g',{class:'graph-node'});ng.appendChild(makeSVG('circle',{cx:n.x,cy:n.y,r:14,fill:fill,stroke:stroke,'stroke-width':2}));
        var t=makeSVG('text',{x:n.x,y:n.y,fill:tcol,'font-size':10,'font-family':'monospace','text-anchor':'middle','dominant-baseline':'central'});t.textContent=n.id;ng.appendChild(t);
        ng.addEventListener('click',function(){selectNode(n.id);});svg.appendChild(ng);
      });
      return svg;
    }
    function renderMatrix(){
      if(!S.matrix)return null;var n=S.graph.nodes.length,cs=Math.min(32,Math.floor(360/n));var w=n*cs+30,h=n*cs+30;
      var cv=el('canvas'),ctx=setupCanvas(cv,w,h);ctx.font='10px monospace';
      for(var j=0;j<n;j++){ctx.fillStyle=COL.text3;ctx.fillText(j,18+j*cs+cs/2-3,12);}
      for(var i=0;i<n;i++){ctx.fillStyle=COL.text3;ctx.fillText(i,4,24+i*cs+cs/2+3);}
      for(var i=0;i<n;i++){for(var j=0;j<n;j++){var x=18+j*cs,y=20+i*cs;
        var isU=S.matrixUpdate&&S.matrixUpdate.i===i&&S.matrixUpdate.j===j;
        ctx.fillStyle=isU?'rgba(6,182,212,0.3)':COL.bg3;ctx.strokeStyle=isU?COL.accent:COL.border2;

        var txt=v===Infinity?'∞':String(v);ctx.fillText(txt,x+cs/2-txt.length*2.5,y+cs/2+3);

      L.viz.innerHTML='<div class="viz-label">'+inst+'</div>';

    function selectNode(id){

/* ==================== Experiment 5: MST Builder ==================== */
Experiments.push({
  id:'mst',num:5,name:'最小生成树构建器',category:'图算法',
  desc:'在交互式图上选择算法（Prim/Kruskal），可视化最小生成树的逐步构建过程。点击边可手动添加/删除边，观察树的总权重变化。',
  mount:function(root){
    var L=makeLayout(root,'最小生成树构建器','交互式图上选择算法，可视化最小生成树的逐步构建过程。','Graph');
    var S={graph:null,algo:'prim',steps:[],stepIdx:0,running:false,raf:0,speed:50,inTree:{},activeEdges:{},consideredEdges:{},totalWeight:0,edgeCount:0,nodeCount:0};
    function genGraph(n,density){
      var nodes=[],edges=[];var cx=220,cy=200,r=140;
      for(var i=0;i<n;i++){var a=(i/n)*Math.PI*2-Math.PI/2;nodes.push({id:i,x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}
      for(var i=0;i<n;i++){var j=(i+1)%n;edges.push({from:i,to:j,weight:randInt(1,20)});}
      for(var i=0;i<n;i++){for(var j=i+2;j<n;j++){if(Math.random()<density){edges.push({from:i,to:j,weight:randInt(1,25)});}}}
      return{nodes:nodes,edges:edges};
    }
    function primSteps(g){
      var st=[],inT={},n=g.nodes.length;inT[0]=true;st.push({type:'addnode',node:0});
      var edgeList=g.edges.map(function(e){return{from:e.from,to:e.to,weight:e.weight};});
      for(var iter=0;iter<n-1;iter++){
        var best=null,bw=Infinity;
        edgeList.forEach(function(e){var a=inT[e.from],b=inT[e.to];if(a!==b&&e.weight<bw){bw=e.weight;best=e;}});
        if(!best)break;
        st.push({type:'consider',from:best.from,to:best.to});
        var nn=inT[best.from]?best.to:best.from;
        inT[nn]=true;
        st.push({type:'addedge',from:best.from,to:best.to,weight:best.weight});
        st.push({type:'addnode',node:nn});
      }
      return st;
    }
    function kruskalSteps(g){
      var st=[],parent={};g.nodes.forEach(function(n){parent[n.id]=n.id;});
      function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
      var sorted=g.edges.slice().sort(function(a,b){return a.weight-b.weight;});
      var count=0;
      sorted.forEach(function(e){
        st.push({type:'consider',from:e.from,to:e.to});
        var rf=find(e.from),rt=find(e.to);
        if(rf!==rt){
          parent[rf]=rt;count++;
          st.push({type:'addedge',from:e.from,to:e.to,weight:e.weight});
          if(count<g.nodes.length-1)st.push({type:'addnode',node:e.to});
        }else{
          st.push({type:'reject',from:e.from,to:e.to});
        }
      });
      return st;
    }

      ctrlGroup('算法','<select id="mstAlgo"><option value="prim">Prim</option><option value="kruskal">Kruskal</option></select>')+

        var wt=makeSVG('text',{x:mx,y:my,'text-anchor':'middle','dominant-baseline':'central',fill:COL.text3,'font-size':9,'font-family':'monospace'});wt.textContent=e.weight;svg.appendChild(wt);
      });
      g.nodes.forEach(function(n){
        var isIn=S.inTree['n'+n.id];var fill=isIn?COL.ok:COL.bg3,stroke=isIn?COL.ok:COL.border2;
        var tcol=isIn?'#000':COL.text;
        var ng=makeSVG('g',{});ng.appendChild(makeSVG('circle',{cx:n.x,cy:n.y,r:14,fill:fill,stroke:stroke,'stroke-width':2}));
        var t=makeSVG('text',{x:n.x,y:n.y,fill:tcol,'font-size':10,'font-family':'monospace','text-anchor':'middle','dominant-baseline':'central'});t.textContent=n.id;ng.appendChild(t);
        svg.appendChild(ng);
      });
      svg.addEventListener('click',function(ev){
        if(ev.target.tagName==='line'){
          var f=parseInt(ev.target.getAttribute('data-from')),t=parseInt(ev.target.getAttribute('data-to'));
          for(var i=S.graph.edges.length-1;i>=0;i--){if((S.graph.edges[i].from===f&&S.graph.edges[i].to===t)||(S.graph.edges[i].from===t&&S.graph.edges[i].to===f)){S.graph.edges.splice(i,1);break;}}
          clearAnim();renderViz();renderStats();
        }
      });
      return svg;
    }
    function renderViz(){
      L.viz.innerHTML='<div class="viz-label">算法: '+(S.algo==='prim'?'Prim':'Kruskal')+' · 点击边可删除</div>';
      L.viz.appendChild(renderGraph());
    }
    function renderStats(){
      L.stats.innerHTML=statRow('算法',S.algo==='prim'?'Prim':'Kruskal')+statRow('节点数',S.graph.nodes.length)+statRow('边数',S.graph.edges.length)+statRow('树中边数',S.edgeCount)+statRow('总权重',S.totalWeight,S.totalWeight>0?'ok':'')+statRow('迭代步',S.stepIdx+'/'+S.steps.length);
    }
    function clearAnim(){S.inTree={};S.activeEdges={};S.consideredEdges={};S.totalWeight=0;S.edgeCount=0;S.stepIdx=0;S.steps=[];}

      if(st.type==='addedge'){S.inTree[k]=true;S.activeEdges[k]=false;S.consideredEdges[k]=false;S.totalWeight+=st.weight;S.edgeCount++;}

      else if(st.type==='reject'){S.consideredEdges[k]=false;S.activeEdges[k]=true;setTimeout(function(){if(S.activeEdges)S.activeEdges[k]=false;},300);}
    }
    function animate(){

      renderViz();renderStats();
      if(S.stepIdx>=S.steps.length){S.running=false;document.getElementById('mstRun').textContent='运行';}

    }
    function startRun(){

      clearAnim();S.inTree['n0']=true;

    document.getElementById('mstRun').addEventListener('click',startRun);
    document.getElementById('mstReset').addEventListener('click',function(){clearAnim();S.inTree={};renderViz();renderStats();});
    S.graph=genGraph(8,0.3);renderViz();renderStats();
    return function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);};
  }
});

/* ==================== Experiment 7: K-Means Sandbox ==================== */
Experiments.push({

    function genRandom(){

      var cv=el('canvas'),ctx=setupCanvas(cv,W,H);

      // Voronoi-like background
      if(S.centroids.length>0){
        var res=8;
        for(var py=0;py<H;py+=res){for(var px=0;px<W;px+=res){var best=0,bd=Infinity;S.centroids.forEach(function(c,j){var d=(px-c.x)*(px-c.x)+(py-c.y)*(py-c.y);if(d<bd){bd=d;best=j;}});ctx.fillStyle=S.colors[best%S.colors.length]+'15';ctx.fillRect(px,py,res,res);}}
      }
      // points
      S.points.forEach(function(p,i){var col=S.colors[S.assignments[i]%S.colors.length];ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();});
      // centroids
      S.centroids.forEach(function(c,j){var col=S.colors[j%S.colors.length];ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(j+1),c.x,c.y);});
      return cv;
    }
    function renderViz(){L.viz.innerHTML='<div class="viz-label">点击画布添加数据点 · 背景色块为Voronoi区域</div>';var cv=renderCanvas();cv.style.cursor='crosshair';cv.addEventListener('click',function(e){var rect=cv.getBoundingClientRect();S.points.push({x:e.clientX-rect.left,y:e.clientY-rect.top});S.assignments.push(0);renderViz();renderStats();});L.viz.appendChild(cv);}
    function renderStats(){
      var inertia=0;
      S.points.forEach(function(p,i){var c=S.centroids[S.assignments[i]];if(c){inertia+=(p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y);}});
      var clusterCounts={};S.assignments.forEach(function(a){clusterCounts[a]=(clusterCounts[a]||0)+1;});
      var ccStr=Object.keys(clusterCounts).sort(function(a,b){return a-b;}).map(function(k){return k+':'+clusterCounts[k];}).join(' ');
      L.stats.innerHTML=statRow('K值',S.k)+statRow('数据点数',S.points.length)+statRow('迭代次数',S.iter)+statRow('阶段',S.stepMode==='assign'?'分配':'更新')+statRow('惯性(WCSS)',inertia.toFixed(1))+statRow('聚类分布',ccStr||'-');
    }
    function doStep(){

    function startRun(){

      if(S.points.length<S.k){showToast('数据点太少');return;}

    }
    function reinit(){S.centroids=[];S.assignments=S.points.map(function(){return 0;});S.iter=0;S.stepMode='assign';}
    document.getElementById('kmK').addEventListener('input',function(e){S.k=parseInt(e.target.value);document.getElementById('kmK_val').textContent=S.k;reinit();renderViz();renderStats();});
    document.getElementById('kmInit').addEventListener('change',function(e){S.init=e.target.value;reinit();renderViz();renderStats();});

    document.getElementById('kmClear').addEventListener('click',function(){S.points=[];S.assignments=[];S.centroids=[];S.iter=0;renderViz();renderStats();});

    document.getElementById('kmReset').addEventListener('click',function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('kmRun').textContent='运行';initCentroids();renderViz();renderStats();});
    genRandom();initCentroids();renderViz();renderStats();
    return function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);};
  }
});

/* ==================== Experiment 8: Neural Network Decision Boundary ==================== */
Experiments.push({
  id:'nnet',num:8,name:'神经网络决策边界',category:'AI / 机器学习',
  desc:'调整隐藏层数、神经元数和激活函数，实时训练并绘制决策边界。选择XOR/圆形/螺旋数据集，观察网络表达能力的变化。',
  mount:function(root){
    var L=makeLayout(root,'神经网络决策边界','调整网络结构与激活函数，实时训练并绘制决策边界。','ML');
    var S={layers:2,neurons:5,activation:'relu',dataset:'xor',lr:0.1,weights:[],biases:[],data:[],labels:[],running:false,raf:0,epoch:0,loss:0,acc:0,res:12};
    var ACTS={
      relu:{name:'ReLU',fn:function(x){return Math.max(0,x);},df:function(x){return x>0?1:0;}},
      sigmoid:{name:'Sigmoid',fn:function(x){return 1/(1+Math.exp(-x));},df:function(x){var s=1/(1+Math.exp(-x));return s*(1-s);}},
      tanh:{name:'Tanh',fn:function(x){return Math.tanh(x);},df:function(x){var t=Math.tanh(x);return 1-t*t;}}
    };
    var W=440,H=400;
    function genData(){
      S.data=[];S.labels=[];
      if(S.dataset==='xor'){
        for(var i=0;i<40;i++){var x=randInt(-50,50)/100,y=randInt(-50,50)/100;var l=(x*y>0)?1:0;S.data.push([x,y]);S.labels.push(l);}
        for(var i=0;i<20;i++){S.data.push([randInt(-50,-10)/100,randInt(-50,-10)/100]);S.labels.push(0);S.data.push([randInt(10,50)/100,randInt(10,50)/100]);S.labels.push(0);S.data.push([randInt(-50,-10)/100,randInt(10,50)/100]);S.labels.push(1);S.data.push([randInt(10,50)/100,randInt(-50,-10)/100]);S.labels.push(1);}
      }else if(S.dataset==='circles'){
        for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,r=0.2+Math.random()*0.1;S.data.push([r*Math.cos(a),r*Math.sin(a)]);S.labels.push(0);}
        for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,r=0.6+Math.random()*0.1;S.data.push([r*Math.cos(a),r*Math.sin(a)]);S.labels.push(1);}
      }else if(S.dataset==='spiral'){
        for(var c=0;c<2;c++){for(var i=0;i<40;i++){var r=i/40*0.8,a=i/40*4*Math.PI+c*Math.PI;S.data.push([r*Math.cos(a)+randInt(-5,5)/200,r*Math.sin(a)+randInt(-5,5)/200]);S.labels.push(c);}}
      }
    }
    function initNet(){
      var sizes=[2];for(var i=0;i<S.layers;i++)sizes.push(S.neurons);sizes.push(1);
      S.weights=[];S.biases=[];
      for(var l=0;l<sizes.length-1;l++){
        var wl=[],bl=[];
        for(var j=0;j<sizes[l+1];j++){var row=[];for(var k=0;k<sizes[l];k++){row.push((Math.random()*2-1)*0.8);}wl.push(row);bl.push((Math.random()*2-1)*0.3);}
        S.weights.push(wl);S.biases.push(bl);
      }
      S.epoch=0;S.loss=0;S.acc=0;
    }
    function forward(x){
      var act=ACTS[S.activation];var a=x;var cache=[x];
      for(var l=0;l<S.weights.length;l++){
        var out=[];
        for(var j=0;j<S.weights[l].length;j++){
          var s=S.biases[l][j];
          for(var k=0;k<a.length;k++){s+=S.weights[l][j][k]*a[k];}
          out.push(l<S.weights.length-1?act.fn(s):1/(1+Math.exp(-s)));
        }
        a=out;cache.push(a);
      }
      return{out:a[0],cache:cache};
    }
    function trainBatch(){
      var lr=S.lr,n=S.data.length,totalLoss=0,correct=0;
      var act=ACTS[S.activation];
      for(var idx=0;idx<n;idx++){
        var x=S.data[idx],y=S.labels[idx];
        var res=forward(x),pred=res.out;
        totalLoss+=-(y*Math.log(pred+1e-9)+(1-y)*Math.log(1-pred+1e-9));
        if((pred>0.5?1:0)===y)correct++;
        // backprop
        var grads=[[(pred-y)]];
        for(var l=S.weights.length-1;l>=0;l--){
          var gW=[],gB=[];
          for(var j=0;j<S.weights[l].length;j++){
            var g=grads[grads.length-1][j];
            if(l<S.weights.length-1){g*=act.df(res.cache[l+1][j]);}
            gB.push(g);var row=[];
            for(var k=0;k<S.weights[l][j].length;k++){row.push(g*res.cache[l][k]);}
            gW.push(row);
          }
          if(l>0){var newG=[];for(var k=0;k<S.weights[l][0].length;k++){var s=0;for(var j=0;j<S.weights[l].length;j++){s+=grads[grads.length-1][j]*(l<S.weights.length-1?act.df(res.cache[l+1][j]):1)*S.weights[l][j][k];}newG.push(s);}grads.push(newG);}
          for(var j=0;j<S.weights[l].length;j++){S.biases[l][j]-=lr*gB[j];for(var k=0;k<S.weights[l][j].length;k++){S.weights[l][j][k]-=lr*gW[j][k];}}
        }
      }
      S.loss=totalLoss/n;S.acc=correct/n;S.epoch++;
    }
    function renderBoundary(){
      var cv=el('canvas'),ctx=setupCanvas(cv,W,H);var res=S.res;
      for(var py=0;py<H;py+=res){for(var px=0;px<W;px+=res){
        var x=(px/W)*2-1,y=(py/H)*2-1;
        var p=forward([x,y]).out;
        var R,G,B;
        if(p>0.5){var t=(p-0.5)*2;R=6+t*20;G=100+t*80;B=180+t*30;}
        else{var t=(0.5-p)*2;R=180+t*40;G=100+t*30;B=20+t*10;}
        ctx.fillStyle='rgb('+(R|0)+','+(G|0)+','+(B|0)+')';ctx.fillRect(px,py,res,res);
      }}
      S.data.forEach(function(d,i){var px=((d[0]+1)/2)*W,py=((d[1]+1)/2)*H;ctx.fillStyle=S.labels[i]===1?'#06b6d4':'#f59e0b';ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,3.5,0,Math.PI*2);ctx.fill();ctx.stroke();});
      return cv;
    }
    function renderViz(){L.viz.innerHTML='<div class="viz-label">决策边界 · 青=类别1 · 橙=类别0 · 分辨率可调</div>';L.viz.appendChild(renderBoundary());}
    function renderStats(){L.stats.innerHTML=statRow('网络结构','2-'+Array(S.layers).fill(S.neurons).join('-')+'-1')+statRow('激活函数',ACTS[S.activation].name)+statRow('数据集',S.dataset)+statRow('Epoch',S.epoch)+statRow('损失',S.loss.toFixed(4),S.loss<0.3?'ok':'')+statRow('准确率',(S.acc*100).toFixed(1)+'%',S.acc>0.9?'ok':'')+statRow('参数数',countParams());}
    function countParams(){var c=0;S.weights.forEach(function(wl){wl.forEach(function(row){c+=row.length;});});S.biases.forEach(function(bl){c+=bl.length;});return c;}
    function animate(){if(!S.running)return;for(var i=0;i<3;i++)trainBatch();renderViz();renderStats();if(S.epoch>3000||S.acc>0.99){S.running=false;document.getElementById('nnRun').textContent='训练';}else S.raf=requestAnimationFrame(animate);}
    function startRun(){if(S.running){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('nnRun').textContent='训练';return;}S.running=true;document.getElementById('nnRun').textContent='暂停';animate();}
    L.controls.innerHTML=
      ctrlGroup('隐藏层数',rangeInput('nnLayers',1,4,2,1))+
      ctrlGroup('每层神经元',rangeInput('nnNeurons',2,8,5,1))+
      ctrlGroup('激活函数','<select id="nnAct">'+Object.keys(ACTS).map(function(k){return'<option value="'+k+'">'+ACTS[k].name+'</option>';}).join('')+'</select>')+
      ctrlGroup('数据集','<select id="nnData"><option value="xor">XOR</option><option value="circles">同心圆</option><option value="spiral">螺旋</option></select>')+
      ctrlGroup('学习率',rangeInput('nnLR',1,100,10,1))+
      ctrlGroup('边界分辨率',rangeInput('nnRes',6,24,12,2))+
      ctrlGroup('操作','<div class="btn-row"><button class="sm" id="nnInit">重新初始化</button></div>');
    L.actions.innerHTML='<button id="nnReset">重置</button><button class="sm" id="nnStep">单步训练</button><button id="nnRun" class="primary">训练</button>';
    document.getElementById('nnLayers').addEventListener('input',function(e){S.layers=parseInt(e.target.value);document.getElementById('nnLayers_val').textContent=S.layers;initNet();renderViz();renderStats();});
    document.getElementById('nnNeurons').addEventListener('input',function(e){S.neurons=parseInt(e.target.value);document.getElementById('nnNeurons_val').textContent=S.neurons;initNet();renderViz();renderStats();});

    document.getElementById('nnData').addEventListener('change',function(e){S.dataset=e.target.value;genData();initNet();renderViz();renderStats();});
    bindRange('nnLR',function(v){S.lr=v/100;});
    bindRange('nnRes',function(v){S.res=v;renderViz();});
    document.getElementById('nnInit').addEventListener('click',function(){initNet();renderViz();renderStats();});
    document.getElementById('nnStep').addEventListener('click',function(){trainBatch();renderViz();renderStats();});

  }

/* ==================== Experiment 9: Attention Weights ==================== */
Experiments.push({
  id:'attention',num:9,name:'注意力权重可视化',category:'AI / 机器学习',
  desc:'输入文本序列，可视化Self-Attention权重矩阵。调整头数和温度，观察注意力分布变化。点击矩阵查看详细权重。',
  mount:function(root){
    var L=makeLayout(root,'注意力权重可视化','输入文本序列，观察Self-Attention权重矩阵的变化。','ML');
    var S={tokens:['我','喜欢','学习','算法','与','数据','结构'],heads:4,temperature:1.0,weights:[],curHead:0,embedDim:16,embeddings:[],selQ:-1,selK:-1};
    var vocabSize=200;
    function tokenize(text){return text.trim().split(/[\s,，。、]+/).filter(function(t){return t.length>0;});}
    function genEmbeddings(){
      S.embeddings=[];
      var seed=12345;
      function rng(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
      S.tokens.forEach(function(){var emb=[];for(var i=0;i<S.embedDim*S.heads;i++)emb.push((rng()*2-1)*0.5);S.embeddings.push(emb);});
    }
    function computeAttention(){
      var n=S.tokens.length,d=S.embedDim;S.weights=[];
      for(var h=0;h<S.heads;h++){
        var head=[];
        for(var i=0;i<n;i++){
          var q=S.embeddings[i].slice(h*d,(h+1)*d);var row=[];
          for(var j=0;j<n;j++){
            var k=S.embeddings[j].slice(h*d,(h+1)*d);var s=0;for(var x=0;x<d;x++)s+=q[x]*k[x];row.push(s/Math.sqrt(d)/S.temperature);
          }
          // softmax
          var mx=Math.max.apply(null,row),sum=0;row=row.map(function(v){var e=Math.exp(v-mx);sum+=e;return e;});row=row.map(function(v){return v/sum;});
          head.push(row);
        }
        S.weights.push(head);
      }

      ctrlGroup('注意力头数',rangeInput('atHeads',1,8,4,1))+

      ctrlGroup('操作','<div class="btn-row"><button class="sm" id="atReemb">重新生成嵌入</button></div>')+
      '<div style="font-size:11px;color:var(--text3);line-height:1.6;margin-top:8px">温度越低注意力越尖锐(聚焦少数词)，越高越均匀。点击矩阵单元格查看权重。</div>';
    L.actions.innerHTML='<button id="atReset">重置</button>';
    function renderMatrix(){
      var n=S.tokens.length;if(n===0)return el('div','viz-empty','无数据');

        var v=S.weights[S.curHead]?S.weights[S.curHead][i][j]:0;
        var R,G,B;
        if(v>0.5){var t=(v-0.5)*2;R=6+t*30;G=150+t*50;B=200+t*40;}

        if(isSel){ctx.strokeStyle=COL.warn;ctx.lineWidth=2;ctx.strokeRect(padH+j*cs,padH+i*cs,cs-2,cs-2);}
        if(v>0.15){ctx.fillStyle=v>0.5?'#000':COL.text;ctx.textAlign='center';ctx.font='9px monospace';ctx.fillText(v.toFixed(2),padH+j*cs+cs/2,padH+i*cs+cs/2+3);}
      }}
      // axis labels
      ctx.fillStyle=COL.text3;ctx.font='10px sans-serif';ctx.textAlign='center';
      ctx.fillText('Key →',padH+n*cs/2,totalH-4);ctx.save();ctx.translate(12,padH+n*cs/2);ctx.rotate(-Math.PI/2);ctx.fillText('Query',0,0);ctx.restore();
      cv.style.cursor='pointer';cv.dataset.n=n;
      cv.addEventListener('click',function(e){var rect=cv.getBoundingClientRect();var mx=e.clientX-rect.left,my=e.clientY-rect.top;var n=parseInt(cv.dataset.n),cs2=Math.min(40,Math.floor(380/n)),padH2=60;var ci=Math.floor((my-padH2)/cs2),cj=Math.floor((mx-padH2)/cs2);if(ci>=0&&ci<n&&cj>=0&&cj<n){S.selQ=ci;S.selK=cj;renderStats();renderMatrixWrap();}});
      return cv;
    }
    function renderMatrixWrap(){renderViz();}
    function renderHeads(){

      return wrap;
    }
    function renderViz(){
      L.viz.innerHTML='<div class="viz-label">注意力权重矩阵 · 行=Query · 列=Key · 颜色越亮权重越高</div>';

/* ==================== Experiment 10: Cache Replacement Simulator ==================== */
Experiments.push({
  id:'cache',num:10,name:'缓存替换策略模拟器',category:'系统实验',
  desc:'调整缓存大小和访问模式（顺序/随机/Zipf），对比LRU/LFU/FIFO/ARC的命中率。实时绘制命中率曲线和缓存状态。',
  mount:function(root){
    var L=makeLayout(root,'缓存替换策略模拟器','对比LRU/LFU/FIFO/ARC缓存替换策略在不同访问模式下的命中率。','System');
    var S={cacheSize:4,pattern:'zipf',accessSeq:[],idx:0,running:false,raf:0,speed:3,caches:{lru:[],lfu:[],fifo:[],arc:[]},hits:{lru:0,lfu:0,fifo:0,arc:0},misses:{lru:0,lfu:0,fifo:0,arc:0},freq:{lfu:{}},arcP:0,history:[],addrSpace:32};
    var COLORS={lru:'#06b6d4',lfu:'#f59e0b',fifo:'#10b981',arc:'#a855f7'};
    var NAMES={lru:'LRU',lfu:'LFU',fifo:'FIFO',arc:'ARC'};
    var W=440,H=400;
    function genSeq(){
      S.accessSeq=[];var n=400;
      if(S.pattern==='sequential'){for(var i=0;i<n;i++)S.accessSeq.push(i%S.addrSpace);}
      else if(S.pattern==='random'){for(var i=0;i<n;i++)S.accessSeq.push(randInt(0,S.addrSpace-1));}
      else if(S.pattern==='zipf'){for(var i=0;i<n;i++){var r=Math.random(),idx=0,cum=0;for(var k=1;k<=S.addrSpace;k++){cum+=1/(k*1.5);if(r<=cum){idx=k-1;break;}}S.accessSeq.push(idx);}}
      else if(S.pattern==='loop'){var sz=randInt(4,8);for(var i=0;i<n;i++)S.accessSeq.push(i%sz);}
    }
    function accessLRU(addr){
      var idx=S.caches.lru.indexOf(addr);
      if(idx>=0){S.hits.lru++;S.caches.lru.splice(idx,1);S.caches.lru.push(addr);}
      else{S.misses.lru++;if(S.caches.lru.length>=S.cacheSize)S.caches.lru.shift();S.caches.lru.push(addr);}
    }
    function accessLFU(addr){
      var idx=S.caches.lfu.indexOf(addr);
      if(idx>=0){S.hits.lfu++;S.freq.lfu[addr]=(S.freq.lfu[addr]||0)+1;}
      else{S.misses.lfu++;if(S.caches.lfu.length>=S.cacheSize){var minF=Infinity,minI=0;S.caches.lfu.forEach(function(a,i){if((S.freq.lfu[a]||0)<minF){minF=S.freq.lfu[a]||0;minI=i;}});var ev=S.caches.lfu.splice(minI,1)[0];delete S.freq.lfu[ev];}S.caches.lfu.push(addr);S.freq.lfu[addr]=1;}
    }
    function accessFIFO(addr){
      var idx=S.caches.fifo.indexOf(addr);
      if(idx>=0){S.hits.fifo++;}
      else{S.misses.fifo++;if(S.caches.fifo.length>=S.cacheSize)S.caches.fifo.shift();S.caches.fifo.push(addr);}
    }
    function accessARC(addr){
      // Simplified ARC: maintains T1 and T2 with adaptive partition
      var c=S.cacheSize;var t1=S.caches.arc.slice(0,Math.ceil(c/2)+S.arcP);var t2=S.caches.arc.slice(Math.ceil(c/2)+S.arcP);
      var inT1=t1.indexOf(addr)>=0,inT2=t2.indexOf(addr)>=0;
      if(inT1||inT2){S.hits.arc++;if(inT2){t2.splice(t2.indexOf(addr),1);t2.push(addr);}}
      else{S.misses.arc++;var total=t1.length+t2.length;if(total>=c){if(t1.length>=Math.max(1,c/2+S.arcP)){t1.shift();S.arcP=Math.min(S.arcP+1,c-1);}else{t2.shift();S.arcP=Math.max(S.arcP-1,0);}}t1.push(addr);}
      S.caches.arc=t1.concat(t2);
    }
    function step(){
      if(S.idx>=S.accessSeq.length)return false;
      var addr=S.accessSeq[S.idx];
      accessLRU(addr);accessLFU(addr);accessFIFO(addr);accessARC(addr);
      S.idx++;
      var total=S.idx;var hr={lru:S.hits.lru/total,lfu:S.hits.lfu/total,fifo:S.hits.fifo/total,arc:S.hits.arc/total};
      S.history.push(hr);
      if(S.history.length>400)S.history.shift();
      return true;
    }
    function renderChart(){
      var cv=el('canvas'),ctx=setupCanvas(cv,W,H);
      ctx.fillStyle='#0f1115';ctx.fillRect(0,0,W,H);
      // grid
      ctx.strokeStyle='#1e2026';ctx.lineWidth=0.5;
      for(var i=0;i<=10;i++){var y=H-30-(i/10)*(H-50);ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(W-10,y);ctx.stroke();}
      // axis labels
      ctx.fillStyle=COL.text3;ctx.font='9px monospace';ctx.textAlign='right';
      for(var i=0;i<=10;i+=2){ctx.fillText((i*10)+'%',25,H-30-(i/10)*(H-50));}
      ctx.textAlign='center';ctx.fillText('访问序号',W/2,H-8);
      // lines
      var n=S.history.length;if(n<2)return cv;
      var xScale=(W-40)/n,yScale=H-50;
      Object.keys(COLORS).forEach(function(key){
        ctx.strokeStyle=COLORS[key];ctx.lineWidth=1.5;ctx.beginPath();
        S.history.forEach(function(h,i){var x=30+i*xScale,y=H-30-h[key]*yScale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
        ctx.stroke();
      });
      // legend
      ctx.textAlign='left';ctx.font='10px sans-serif';
      var lx=W-100;
      Object.keys(COLORS).forEach(function(key,i){ctx.fillStyle=COLORS[key];ctx.fillRect(lx,10+i*16,10,10);ctx.fillStyle=COL.text2;ctx.fillText(NAMES[key]+' '+((S.history[n-1][key]*100).toFixed(1)+'%'),lx+14,18+i*16);});
      return cv;
    }
    function renderCacheState(){
      var html='<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">当前缓存内容</div>';
      Object.keys(COLORS).forEach(function(key){
        var items=S.caches[key];html+='<div style="margin-bottom:8px"><span style="color:'+COLORS[key]+';font-weight:600;font-size:11px">'+NAMES[key]+'</span> <span style="font-family:var(--mono);font-size:10px;color:var(--text2)">['+items.join(', ')+']</span></div>';
      });
      return html;
    }
    function renderViz(){
      L.viz.innerHTML='<div class="viz-label">命中率曲线 (0-100%) · 4种策略对比</div>';
      L.viz.appendChild(renderChart());
      var st=el('div','',renderCacheState());st.style.padding='10px 0';L.viz.appendChild(st);
    }
    function renderStats(){
      var total=S.idx||1;
      L.stats.innerHTML=statRow('缓存大小',S.cacheSize)+statRow('地址空间',S.addrSpace)+statRow('访问模式',S.pattern)+statRow('已访问',S.idx+'/'+S.accessSeq.length)+statRow('LRU命中率',(S.hits.lru/total*100).toFixed(1)+'%',S.hits.lru>=S.hits.fifo?'ok':'')+statRow('LFU命中率',(S.hits.lfu/total*100).toFixed(1)+'%')+statRow('FIFO命中率',(S.hits.fifo/total*100).toFixed(1)+'%')+statRow('ARC命中率',(S.hits.arc/total*100).toFixed(1)+'%',S.hits.arc>=S.hits.lru?'ok':'');
    }
    function animate(){
      if(!S.running)return;
      for(var i=0;i<S.speed*5&&S.idx<S.accessSeq.length;i++)step();
      renderViz();renderStats();
      if(S.idx>=S.accessSeq.length){S.running=false;document.getElementById('caRun').textContent='运行';}
      else S.raf=requestAnimationFrame(animate);
    }
    function startRun(){
      if(S.running){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('caRun').textContent='运行';return;}
      if(S.idx>=S.accessSeq.length)resetSim();
      S.running=true;document.getElementById('caRun').textContent='暂停';animate();
    }
    function resetSim(){S.idx=0;S.caches={lru:[],lfu:[],fifo:[],arc:[]};S.hits={lru:0,lfu:0,fifo:0,arc:0};S.misses={lru:0,lfu:0,fifo:0,arc:0};S.freq={lfu:{}};S.arcP=0;S.history=[];genSeq();renderViz();renderStats();}
    L.controls.innerHTML=
      ctrlGroup('缓存大小',rangeInput('caSize',1,16,4,1))+
      ctrlGroup('地址空间',rangeInput('caAddr',8,48,32,1))+
      ctrlGroup('访问模式','<select id="caPattern"><option value="sequential">顺序</option><option value="random">随机</option><option value="zipf" selected>Zipf分布</option><option value="loop">循环</option></select>')+
      ctrlGroup('动画速度',rangeInput('caSpeed',1,10,3,1))+
      ctrlGroup('操作','<div class="btn-row"><button class="sm" id="caStep">单步</button></div>');
    L.actions.innerHTML='<button id="caReset">重置</button><button id="caRun" class="primary">运行</button>';
    document.getElementById('caSize').addEventListener('input',function(e){S.cacheSize=parseInt(e.target.value);document.getElementById('caSize_val').textContent=S.cacheSize;resetSim();});
    document.getElementById('caAddr').addEventListener('input',function(e){S.addrSpace=parseInt(e.target.value);document.getElementById('caAddr_val').textContent=S.addrSpace;resetSim();});
    document.getElementById('caPattern').addEventListener('change',function(e){S.pattern=e.target.value;resetSim();});
    bindRange('caSpeed',function(v){S.speed=v;});
    document.getElementById('caStep').addEventListener('click',function(){if(S.idx>=S.accessSeq.length)resetSim();step();renderViz();renderStats();});
    document.getElementById('caRun').addEventListener('click',startRun);
    document.getElementById('caReset').addEventListener('click',function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('caRun').textContent='运行';resetSim();});
    resetSim();
    return function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);};
  }
});

/* ==================== Experiment 11: Raft Consensus Simulator ==================== */
Experiments.push({
  id:'raft',num:11,name:'共识算法模拟器',category:'系统实验',
  desc:'调整节点数和故障数，观察Raft领导者选举过程。可视化任期号、投票、心跳和状态转换。',
  mount:function(root){
    var L=makeLayout(root,'共识算法模拟器','调整节点数和故障数，观察Raft领导者选举与心跳过程。','System');
    var S={nodeCount:5,failedCount:1,nodes:[],leader:-1,term:0,running:false,raf:0,speed:1,phase:'idle',stepCount:0,votesReceived:{},electionTimeouts:[],heartbeatCount:0,log:[],splitVote:false};
    var STATES={follower:'#71717a',candidate:'#f59e0b',leader:'#06b6d4',failed:'#ef4444'};
    var STATE_NAMES={follower:'Follower',candidate:'Candidate',leader:'Leader',failed:'Failed'};
    function initNodes(){
      S.nodes=[];S.leader=-1;S.term=0;S.stepCount=0;S.heartbeatCount=0;S.log=[];S.phase='idle';S.splitVote=false;
      for(var i=0;i<S.nodeCount;i++){
        var a=(i/S.nodeCount)*Math.PI*2-Math.PI/2;
        S.nodes.push({id:i,state:'follower',x:220+130*Math.cos(a),y:200+130*Math.sin(a),term:0,votedFor:-1,votesGot:0,timeout:randInt(15,30),timer:0});
      }
      for(var i=0;i<S.failedCount&&i<S.nodeCount;i++){S.nodes[i].state='failed';}
      addLog('初始化 '+S.nodeCount+' 个节点，'+S.failedCount+' 个故障');
    }
    function addLog(msg){S.log.unshift('['+S.stepCount+'] '+msg);if(S.log.length>12)S.log.pop();}
    function startElection(){
      var alive=S.nodes.filter(function(n){return n.state!=='failed';});
      if(alive.length===0)return;
      // pick candidate with smallest timeout
      alive.sort(function(a,b){return a.timeout-b.timeout;});
      var cand=alive[0];
      if(cand.state==='leader')return;
      S.term++;cand.term=S.term;cand.state='candidate';cand.votedFor=cand.id;cand.votesGot=1;
      S.phase='election';
      addLog('节点'+cand.id+' 发起选举 Term='+S.term);
      // request votes
      S.nodes.forEach(function(n){
        if(n.id!==cand.id&&n.state!=='failed'){
          if(n.term<cand.term||(n.term===cand.term&&n.votedFor===-1)){
            n.votedFor=cand.id;n.term=cand.term;cand.votesGot++;
          }
        }
      });
      var majority=Math.floor(S.nodeCount/2)+1;
      if(cand.votesGot>=majority){
        cand.state='leader';S.leader=cand.id;
        S.nodes.forEach(function(n){if(n.id!==cand.id&&n.state!=='failed'){n.state='follower';n.term=S.term;}});
        S.phase='heartbeat';
        addLog('节点'+cand.id+' 当选Leader (票数:'+cand.votesGot+'/'+S.nodeCount+')');
      }else{
        addLog('选举失败 票数不足 ('+cand.votesGot+'/'+majority+')');
        cand.state='follower';
        S.splitVote=true;
      }
    }
    function sendHeartbeat(){
      if(S.leader<0)return;
      var leader=S.nodes[S.leader];
      if(leader.state!=='leader'){S.leader=-1;return;}
      S.heartbeatCount++;
      S.nodes.forEach(function(n){if(n.id!==S.leader&&n.state!=='failed'){n.term=S.term;n.timer=0;}});
      addLog('Leader'+S.leader+' 发送心跳 #'+S.heartbeatCount);
    }
    function simulateFailure(){
      var alive=S.nodes.filter(function(n){return n.state!=='failed';});
      if(alive.length<=S.failedCount)return;
      var idx=randInt(0,alive.length-1);
      var node=alive[idx];
      if(node.state==='leader'){addLog('Leader'+node.id+' 宕机!');S.leader=-1;S.phase='election';}
      else addLog('节点'+node.id+' 宕机');
      node.state='failed';
    }
    function simulateRecovery(){
      var failed=S.nodes.filter(function(n){return n.state==='failed';});
      if(failed.length===0)return;
      var node=failed[randInt(0,failed.length-1)];
      node.state='follower';node.term=S.term;node.votedFor=-1;node.timer=0;
      addLog('节点'+node.id+' 恢复');
    }
    function step(){
      S.stepCount++;
      S.nodes.forEach(function(n){
        if(n.state==='failed')return;
        n.timer++;
        if(n.state!=='leader'&&n.timer>=n.timeout&&S.phase!=='election'){
          n.timeout=randInt(15,30);n.timer=0;startElection();return;
        }
      });
      if(S.phase==='heartbeat'&&S.leader>=0&&S.stepCount%8===0){sendHeartbeat();}
      // random events
      if(S.stepCount%40===0&&Math.random()<0.4){simulateFailure();}
      if(S.stepCount%50===0&&Math.random()<0.5){simulateRecovery();}
    }
    function renderNodes(){
      var svg=makeSVG('svg',{class:'graph-svg',width:440,height:400});
      // heartbeat lines from leader
      if(S.leader>=0){
        var leader=S.nodes[S.leader];
        S.nodes.forEach(function(n){
          if(n.id!==S.leader&&n.state!=='failed'){
            var pulse=(S.stepCount%8<2)?1:0.2;
            svg.appendChild(makeSVG('line',{x1:leader.x,y1:leader.y,x2:n.x,y2:n.y,stroke:COL.accent,'stroke-width':1,'stroke-opacity':pulse,'stroke-dasharray':'3,3'}));
          }
        });
      }
      S.nodes.forEach(function(n){
        var col=STATES[n.state],isLeader=n.state==='leader';
        if(n.state==='failed'){svg.appendChild(makeSVG('line',{x1:n.x-8,y1:n.y-8,x2:n.x+8,y2:n.y+8,stroke:COL.err,'stroke-width':2}));svg.appendChild(makeSVG('line',{x1:n.x-8,y1:n.y+8,x2:n.x+8,y2:n.y-8,stroke:COL.err,'stroke-width':2}));}
        svg.appendChild(makeSVG('circle',{cx:n.x,cy:n.y,r:isLeader?20:16,fill:col,stroke:isLeader?'#fff':col,'stroke-width':isLeader?2:1,'fill-opacity':n.state==='failed'?0.3:1}));
        var t=makeSVG('text',{x:n.x,y:n.y-2,fill:n.state==='failed'?COL.text2:'#000','font-size':10,'font-family':'monospace','text-anchor':'middle','dominant-baseline':'central','font-weight':'bold'});t.textContent='N'+n.id;svg.appendChild(t);
        var st=makeSVG('text',{x:n.x,y:n.y+9,fill:n.state==='failed'?COL.text2:'#000','font-size':7,'font-family':'monospace','text-anchor':'middle','dominant-baseline':'central'});st.textContent=STATE_NAMES[n.state].slice(0,4);svg.appendChild(st);
        var tm=makeSVG('text',{x:n.x,y:n.y+26,fill:COL.text3,'font-size':8,'font-family':'monospace','text-anchor':'middle'});tm.textContent='T'+n.term;svg.appendChild(tm);
      });
      return svg;
    }
    function renderLog(){
      var html='<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">事件日志</div>';
      html+='<div style="font-family:var(--mono);font-size:10px;color:var(--text2);line-height:1.8;max-height:180px;overflow-y:auto">';
      S.log.forEach(function(l){html+='<div>'+l+'</div>';});
      html+='</div>';return html;
    }
    function renderViz(){
      L.viz.innerHTML='<div class="viz-label">Raft集群状态 · 虚线=心跳 · X=故障节点</div>';
      L.viz.appendChild(renderNodes());
      var lp=el('div','',renderLog());lp.style.padding='10px 0';L.viz.appendChild(lp);
    }
    function renderStats(){
      var counts={follower:0,candidate:0,leader:0,failed:0};
      S.nodes.forEach(function(n){counts[n.state]++;});
      L.stats.innerHTML=statRow('节点总数',S.nodeCount)+statRow('存活节点',counts.follower+counts.candidate+counts.leader)+statRow('故障节点',counts.failed)+statRow('当前Term',S.term)+statRow('Leader',S.leader>=0?'N'+S.leader:'无',S.leader>=0?'ok':'err')+statRow('阶段',S.phase)+statRow('心跳次数',S.heartbeatCount)+statRow('模拟步数',S.stepCount);
    }
    function animate(){if(!S.running)return;for(var i=0;i<S.speed;i++)step();renderViz();renderStats();S.raf=requestAnimationFrame(animate);}
    function startRun(){if(S.running){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('rfRun').textContent='运行';return;}S.running=true;document.getElementById('rfRun').textContent='暂停';animate();}
    L.controls.innerHTML=
      ctrlGroup('节点数',rangeInput('rfNodes',3,9,5,1))+
      ctrlGroup('初始故障数',rangeInput('rfFailed',0,4,1,1))+
      ctrlGroup('模拟速度',rangeInput('rfSpeed',1,5,1,1))+
      ctrlGroup('操作','<div class="btn-row"><button class="sm" id="rfStep">单步</button><button class="sm" id="rfFail">随机故障</button><button class="sm" id="rfRecv">恢复节点</button></div>');
    L.actions.innerHTML='<button id="rfReset">重置</button><button id="rfRun" class="primary">运行</button>';
    document.getElementById('rfNodes').addEventListener('input',function(e){S.nodeCount=parseInt(e.target.value);document.getElementById('rfNodes_val').textContent=S.nodeCount;initNodes();renderViz();renderStats();});
    document.getElementById('rfFailed').addEventListener('input',function(e){S.failedCount=parseInt(e.target.value);document.getElementById('rfFailed_val').textContent=S.failedCount;initNodes();renderViz();renderStats();});
    bindRange('rfSpeed',function(v){S.speed=v;});
    document.getElementById('rfStep').addEventListener('click',function(){step();renderViz();renderStats();});
    document.getElementById('rfFail').addEventListener('click',function(){simulateFailure();renderViz();renderStats();});
    document.getElementById('rfRecv').addEventListener('click',function(){simulateRecovery();renderViz();renderStats();});
    document.getElementById('rfRun').addEventListener('click',startRun);
    document.getElementById('rfReset').addEventListener('click',function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('rfRun').textContent='运行';initNodes();renderViz();renderStats();});
    initNodes();renderViz();renderStats();
    return function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);};
  }
});
