      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    var H0=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    function rotr(x,n){return((x>>>n)|(x<<(32-n)))>>>0;}
    function strToBytes(s){var b=[];for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c<128)b.push(c);else if(c<2048){b.push(192|(c>>6));b.push(128|(c&63));}else{b.push(224|(c>>12));b.push(128|((c>>6)&63));b.push(128|(c&63));}}return b;}
    function compute(){
      var bytes=strToBytes(S.input);var origLen=bytes.length;
      // padding
      bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
      var bitLen=origLen*8;for(var i=7;i>=0;i--)bytes.push((bitLen>>>(i*8))&0xff);
      S.padded=bytes.slice();
      // process first block only (for simplicity, most inputs fit in one block)
      var block=bytes.slice(0,64);
      // message schedule
      S.w=[];for(var i=0;i<16;i++){S.w.push(((block[i*4]<<24)|(block[i*4+1]<<16)|(block[i*4+2]<<8)|block[i*4+3])>>>0);}
      for(var i=16;i<64;i++){
        var s0=rotr(S.w[i-15],7)^rotr(S.w[i-15],18)^(S.w[i-15]>>>3);
        var s1=rotr(S.w[i-2],17)^rotr(S.w[i-2],19)^(S.w[i-2]>>>10);
        S.w.push((S.w[i-16]+s0+S.w[i-7]+s1)>>>0);
      }
      // compression
      S.h=H0.slice();S.states=[];
      var a=H0[0],b=H0[1],c=H0[2],d=H0[3],e=H0[4],f=H0[5],g=H0[6],hh=H0[7];
      for(var i=0;i<64;i++){
        S.states.push([a,b,c,d,e,f,g,hh,i]);
        var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
        var ch=(e&f)^((~e)&g);
        var temp1=(hh+S1+ch+K256[i]+S.w[i])>>>0;
        var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
        var maj=(a&b)^(a&c)^(b&c);
        var temp2=(S0+maj)>>>0;
        hh=g;g=f;f=e;e=(d+temp1)>>>0;d=c;c=b;b=a;a=(temp1+temp2)>>>0;
      }
      S.states.push([a,b,c,d,e,f,g,hh,64]);
      S.h=[(H0[0]+a)>>>0,(H0[1]+b)>>>0,(H0[2]+c)>>>0,(H0[3]+d)>>>0,(H0[4]+e)>>>0,(H0[5]+f)>>>0,(H0[6]+g)>>>0,(H0[7]+hh)>>>0];
      S.finalHash=S.h.map(function(v){return('00000000'+v.toString(16)).slice(-8);}).join('');
      S.round=0;S.phase='schedule';
    }
    function hex8(v){return('00000000'+(v>>>0).toString(16)).slice(-8);}
    function renderSchedule(){
      var cv=el('canvas'),ctx=setupCanvas(cv,440,200);
      ctx.fillStyle='#0f1115';ctx.fillRect(0,0,440,200);
      var cols=16,rows=4,cs=26;
      var startX=8,startY=24;
      ctx.font='8px monospace';ctx.textAlign='center';
      for(var i=0;i<64;i++){
        var r=Math.floor(i/16),c=i%16;var x=startX+c*(cs+1),y=startY+r*(cs*2+4);
        var isCur=S.round<64&&i<=S.round&&S.phase==='compress';
        var isInit=i<16;
        ctx.fillStyle=isInit?'rgba(6,182,212,0.15)':'rgba(245,158,11,0.08)';
        if(isCur)ctx.fillStyle='rgba(6,182,212,0.35)';
        ctx.strokeStyle=isCur?COL.accent:(isInit?COL.accent2:COL.border2);
        ctx.lineWidth=isCur?1.5:0.5;
        ctx.fillRect(x,y,cs,cs*2);ctx.strokeRect(x,y,cs,cs*2);
        ctx.fillStyle=COL.text2;ctx.font='7px monospace';
        ctx.fillText('W'+i,x+cs/2,y-3);
        ctx.fillStyle=COL.text;ctx.font='7px monospace';
        var hv=hex8(S.w[i]);ctx.fillText(hv.slice(0,4),x+cs/2,y+cs*0.7);ctx.fillText(hv.slice(4),x+cs/2,y+cs*1.4);
      }
      ctx.fillStyle=COL.text3;ctx.font='10px sans-serif';ctx.textAlign='left';
      ctx.fillText('消息扩展 W[0..63] · 青=来自消息 · 橙=计算扩展',8,190);
      return cv;
    }
    function renderRegisters(){
      var st=S.states[Math.min(S.round,63)];
      var names=['a','b','c','d','e','f','g','h'];
      var cv=el('canvas'),ctx=setupCanvas(cv,440,120);
      ctx.fillStyle='#0f1115';ctx.fillRect(0,0,440,120);
      ctx.font='10px monospace';
      for(var i=0;i<8;i++){
        var x=10+i*54,y=10;
        var v=st[i];var hv=hex8(v);
        ctx.fillStyle=COL.bg3;ctx.strokeStyle=COL.border2;ctx.lineWidth=1;
        ctx.fillRect(x,y,50,80);ctx.strokeRect(x,y,50,80);
        ctx.fillStyle=COL.accent;ctx.font='bold 12px monospace';ctx.textAlign='center';
        ctx.fillText(names[i],x+25,y+16);
        ctx.fillStyle=COL.text;ctx.font='8px monospace';
        ctx.fillText(hv.slice(0,4),x+25,y+36);ctx.fillText(hv.slice(4),x+25,y+50);
        // binary representation (simplified)
        ctx.fillStyle=COL.text3;ctx.font='6px monospace';
        var bin=v.toString(2);while(bin.length<32)bin='0'+bin;
        ctx.fillText(bin.slice(0,16),x+25,y+66);ctx.fillText(bin.slice(16),x+25,y+74);
      }
      ctx.fillStyle=COL.text3;ctx.font='10px sans-serif';ctx.textAlign='left';
      var label=S.phase==='schedule'?'准备开始压缩':(S.round>=64?'压缩完成':'压缩轮次 '+(S.round+1)+'/64 · K='+hex8(K256[Math.min(S.round,63)])+' · W='+hex8(S.w[Math.min(S.round,63)]));
      ctx.fillText(label,10,108);
      return cv;
    }
    function renderHash(){
      var html='<div style="margin-top:10px"><div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">SHA-256 输出</div>';
      html+='<div style="font-family:var(--mono);font-size:13px;color:'+(S.round>=64?COL.ok:COL.text3)+';word-break:break-all;padding:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px">'+S.finalHash+'</div></div>';
      return html;
    }
    function renderViz(){
      L.viz.innerHTML='<div class="viz-label">SHA-256 运算可视化 · 64轮压缩</div>';
      L.viz.appendChild(renderSchedule());
      L.viz.appendChild(renderRegisters());
      var hp=el('div','',renderHash());L.viz.appendChild(hp);
    }
    function renderStats(){
      var inputBytes=strToBytes(S.input).length;
      L.stats.innerHTML=statRow('输入文本',S.input.slice(0,20)+(S.input.length>20?'...':''))+statRow('输入字节数',inputBytes)+statRow('填充后大小',S.padded.length+' bytes')+statRow('消息块数',Math.ceil(S.padded.length/64))+statRow('当前轮次',S.phase==='schedule'?'-' :S.round+'/64')+statRow('阶段',S.phase==='schedule'?'消息扩展':(S.phase==='compress'?'压缩函数':'完成'))+statRow('哈希长度','256 bits (64 hex)')+statRow('状态',S.round>=64?'完成':'运行中');
    }
    function animate(){
      if(!S.running)return;
      for(var i=0;i<S.speed;i++){
        if(S.phase==='schedule'){S.phase='compress';}
        else if(S.phase==='compress'){S.round++;if(S.round>=64){S.phase='done';S.running=false;document.getElementById('shRun').textContent='运行';}}
      }
      renderViz();renderStats();
      if(S.running)S.raf=requestAnimationFrame(animate);
    }
    function startRun(){
      if(S.running){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);document.getElementById('shRun').textContent='运行';return;}
      compute();S.running=true;document.getElementById('shRun').textContent='暂停';animate();
    }
    L.controls.innerHTML=
      ctrlGroup('输入文本','<input type="text" id="shInput" value="'+S.input.replace(/"/g,'&quot;')+'" style="width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px">')+
      ctrlGroup('动画速度',rangeInput('shSpeed',1,8,2,1))+
      ctrlGroup('操作','<div class="btn-row"><button class="sm" id="shStep">单步</button><button class="sm" id="shSkip">跳到结果</button></div>')+
      '<div style="font-size:11px;color:var(--text3);line-height:1.6;margin-top:8px">SHA-256将输入填充到512位块，扩展为64个字W，然后经过64轮压缩得到256位哈希。</div>';
    L.actions.innerHTML='<button id="shReset">重置</button><button id="shRun" class="primary">运行</button>';
    document.getElementById('shInput').addEventListener('change',function(e){S.input=e.target.value;compute();renderViz();renderStats();});
    bindRange('shSpeed',function(v){S.speed=v;});
    document.getElementById('shStep').addEventListener('click',function(){if(S.phase==='schedule'){S.phase='compress';}else if(S.phase==='compress'){S.round++;if(S.round>=64)S.phase='done';}renderViz();renderStats();});
    document.getElementById('shSkip').addEventListener('click',function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);compute();S.round=64;S.phase='done';renderViz();renderStats();document.getElementById('shRun').textContent='运行';});
    document.getElementById('shRun').addEventListener('click',startRun);
    document.getElementById('shReset').addEventListener('click',function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);compute();renderViz();renderStats();document.getElementById('shRun').textContent='运行';});
    compute();renderViz();renderStats();
    return function(){S.running=false;if(S.raf)cancelAnimationFrame(S.raf);};
  }
});

/* ==================== App Controller ==================== */
var currentCleanup=null;
var currentId=null;

function selectExperiment(id){
  if(currentCleanup){try{currentCleanup();}catch(e){}currentCleanup=null;}
  var exp=null;
  for(var i=0;i<Experiments.length;i++){if(Experiments[i].id===id){exp=Experiments[i];break;}}
  if(!exp)return;
  currentId=id;
  var cards=document.querySelectorAll('.exp-card');
  cards.forEach(function(c){c.classList.toggle('active',c.dataset.id===id);});
  var root=document.getElementById('expArea');
  clear(root);
  try{
    currentCleanup=exp.mount(root);
  }catch(e){
    root.innerHTML='<div class="viz-empty" style="padding:40px">实验加载失败: '+e.message+'</div>';
    console.error(e);
  }
  root.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderSelector(){
  var container=document.getElementById('selectorGrid');
  var cats={};
  var order=['排序算法','数据结构','图算法','AI / 机器学习','系统实验','加密 / 编码'];
  Experiments.forEach(function(e){
    if(!cats[e.category])cats[e.category]=[];
    cats[e.category].push(e);
  });
  var html='';
  order.forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="selector-category"><h3>'+cat+'</h3><div class="selector-cards">';
    cats[cat].forEach(function(e){
      html+='<button class="exp-card" data-id="'+e.id+'"><span class="exp-num">'+String(e.num).padStart(2,'0')+'</span><span class="exp-name">'+e.name+'</span></button>';
    });
    html+='</div></div>';
  });
  container.innerHTML=html;
  container.querySelectorAll('.exp-card').forEach(function(card){
    card.addEventListener('click',function(){selectExperiment(card.dataset.id);});
  });
}

function init(){
  renderSelector();
  if(Experiments.length>0){
    selectExperiment(Experiments[0].id);
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}

})();
</script>
