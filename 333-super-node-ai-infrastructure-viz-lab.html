<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超节点与AI算力基础设施可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f; --bg-card:#12141b; --bg-elev:#1a1d27;
  --teal:#00d4aa; --teal-dim:#00a888; --teal-glow:rgba(0,212,170,0.25);
  --text:#e8eef5; --text-dim:#8a96a8; --text-mute:#5a6478;
  --border:#232838; --border-hi:#3a4156;
  --amber:#ffb454; --red:#ff5c7c; --blue:#4cb8ff; --violet:#a78bfa; --green:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(0,212,170,0.06),transparent 60%),
    radial-gradient(900px 500px at 0% 100%,rgba(76,184,255,0.05),transparent 55%),
    var(--bg);
}
header{
  position:sticky;top:0;z-index:50;background:rgba(10,11,15,0.82);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:16px;
}
.logo{
  width:38px;height:38px;border:1.5px solid var(--teal);border-radius:9px;
  display:grid;place-items:center;color:var(--teal);font-weight:800;font-size:15px;
  box-shadow:0 0 18px var(--teal-glow),inset 0 0 12px rgba(0,212,170,0.15);
  font-family:'Consolas',monospace;
}
header h1{font-size:16px;font-weight:600;letter-spacing:.4px}
header h1 span{color:var(--teal)}
header .live{display:flex;align-items:center;gap:6px;margin-left:14px;color:var(--text-dim);font-size:12px}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:blink 1.6s ease-in-out infinite}
header .sub{color:var(--text-dim);font-size:12px;margin-left:auto}
#nav{
  display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--border);
  background:rgba(18,20,27,0.6);position:sticky;top:67px;z-index:40;
}
#nav button{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  padding:7px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;transition:all .2s ease;font-family:inherit;
}
#nav button:hover{color:var(--text);border-color:var(--border-hi);transform:translateY(-1px)}
#nav button.active{color:#0a0b0f;background:var(--teal);border-color:var(--teal);box-shadow:0 0 14px var(--teal-glow);font-weight:600}
main{padding:24px;max-width:1180px;margin:0 auto}
.module{display:none;animation:fadeUp .45s ease}
.module.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mhead{margin-bottom:6px}
.mhead h2{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.mhead h2 .idx{color:var(--teal);font-family:'Consolas',monospace;font-size:14px;background:rgba(0,212,170,0.08);padding:3px 8px;border-radius:6px;border:1px solid rgba(0,212,170,0.25)}
.mhead p{color:var(--text-dim);font-size:13px;margin-top:6px;max-width:920px;line-height:1.65}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.toolbar button{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);
  padding:6px 15px;border-radius:7px;font-size:12.5px;cursor:pointer;transition:all .2s;font-family:inherit;
}
.toolbar button:hover{color:var(--text);border-color:var(--border-hi)}
.toolbar button.active{color:var(--teal);border-color:var(--teal);background:rgba(0,212,170,0.08);box-shadow:0 0 10px rgba(0,212,170,0.12)}
.svg-wrap{
  background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:18px;overflow:auto;position:relative;
}
.svg-wrap::before{content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:radial-gradient(600px 200px at 50% 0%,rgba(0,212,170,0.04),transparent 70%)}
.svg-wrap svg{display:block;max-width:100%;height:auto}
.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--teal);padding:12px 14px;border-radius:9px;transition:border-color .2s}
.stat .k{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:21px;font-weight:700;color:var(--text);margin-top:5px;font-family:'Consolas',monospace}
.stat .v em{color:var(--teal);font-style:normal;font-size:13px;margin-left:4px}
.note{margin-top:14px;font-size:12.5px;color:var(--text-mute);line-height:1.65;border-left:2px solid var(--border-hi);padding-left:12px}
footer{text-align:center;color:var(--text-mute);font-size:12px;padding:30px;border-top:1px solid var(--border);margin-top:30px}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes dashmove{to{stroke-dashoffset:-40}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.flow{stroke-dasharray:8 6;animation:flow 1.1s linear infinite}
.blink{animation:blink 1.6s ease-in-out infinite}
.spin{transform-origin:center;animation:spin 9s linear infinite}
.floaty{animation:floaty 3.2s ease-in-out infinite}
.grid-bg line{stroke:#1c2030;stroke-width:1}
</style>
</head>
<body>
<header>
  <div class="logo">SN</div>
  <h1>超节点与<span>AI算力基础设施</span>可视化实验室</h1>
  <div class="live"><span class="dot"></span><span>实时仿真中</span></div>
  <div class="sub">WAIC 2026 · 超节点国产算力趋势 · v1.0</div>
</header>
<nav id="nav"></nav>
<main id="stage"></main>
<footer>数据基于 WAIC 2026 超节点与国产算力公开趋势整理 · 仅用于可视化研究与学习</footer>

<script>
/* ===== 工具函数（必须完全一致） ===== */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ===== 色板与绘图辅助 ===== */
var C = {
  bg:'#0a0b0f', card:'#12141b', elev:'#1a1d27', deep:'#0e1016',
  teal:'#00d4aa', tealDim:'#00a888', tealGlow:'rgba(0,212,170,0.25)',
  text:'#e8eef5', dim:'#8a96a8', mute:'#5a6478',
  border:'#232838', borderHi:'#3a4156',
  amber:'#ffb454', red:'#ff5c7c', blue:'#4cb8ff', violet:'#a78bfa', green:'#4ade80'
};
function textEl(x, y, str, parent, opts){
  var a = { x:x, y:y, fill:C.text, 'font-size':13, 'font-family':'Segoe UI,system-ui,sans-serif' };
  if(opts){ for(var k in opts){ if(opts.hasOwnProperty(k)) a[k]=opts[k]; } }
  var t = el('text', a, parent); txt(t, str); return t;
}
function titleBlock(svg, title, sub){
  textEl(24, 36, title, svg, {fill:C.teal, 'font-size':17, 'font-weight':700});
  if(sub) textEl(24, 56, sub, svg, {fill:C.dim, 'font-size':12});
}
function linearGrad(id, stops, parent, opts){
  var o = opts||{};
  var g = el('linearGradient', {id:id, x1:o.x1||'0%', y1:o.y1||'0%', x2:o.x2||'100%', y2:o.y2||'0%'}, parent);
  stops.forEach(function(s){ el('stop', {offset:s[0], 'stop-color':s[1], 'stop-opacity':(s[2]!=null?s[2]:1)}, g); });
  return g;
}
function addArrow(id, parent, color){
  var m = el('marker', {id:id, viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:7, markerHeight:7, orient:'auto'}, parent);
  el('path', {d:'M0,0 L10,5 L0,10 Z', fill:color||C.teal}, m);
}
function gridBg(svg, w, h, step){
  var g = el('g', {class:'grid-bg', opacity:0.5}, svg);
  for(var x=0;x<=w;x+=step){ el('line',{x1:x,y1:0,x2:x,y2:h},g); }
  for(var y=0;y<=h;y+=step){ el('line',{x1:0,y1:y,x2:w,y2:y},g); }
  return g;
}
function setStats(statsId, items){
  var host = document.getElementById(statsId);
  if(!host) return;
  clearNode(host);
  items.forEach(function(it, idx){
    var d = document.createElement('div'); d.className='stat';
    var k = document.createElement('div'); k.className='k'; k.textContent = it.k;
    var v = document.createElement('div'); v.className='v';
    var vs = document.createElement('span'); vs.className='val'; vs.id = statsId + '-' + idx;
    setStatText(vs, it.v);
    v.appendChild(vs);
    if(it.u){ var e = document.createElement('em'); e.className='unit'; e.textContent = it.u; v.appendChild(e); }
    d.appendChild(k); d.appendChild(v); host.appendChild(d);
  });
}
function setNote(id, str){ var n = document.getElementById(id); if(n) n.textContent = str; }
var _timers = [];
function clearAnims(){ _timers.forEach(function(t){ clearInterval(t); clearTimeout(t); }); _timers = []; }
function anim(fn, ms){ var t = setInterval(fn, ms); _timers.push(t); return t; }
function growBar(x, y, w, h, color, parent, delay){
  var r = el('rect', {x:x, y:y, width:w, height:0, rx:3, fill:color}, parent);
  var a = el('animate', {attributeName:'height', from:'0', to:h, dur:'0.7s', begin:(delay||0)+'s', fill:'freeze'}, r);
  var a2 = el('animate', {attributeName:'y', from:(y+h), to:y, dur:'0.7s', begin:(delay||0)+'s', fill:'freeze'}, r);
  return r;
}

/* ===================== M1 超节点全景 ===================== */
function m1Draw(){ m1View(0); }
function m1View(v){
  clearAnims();
  var svg = document.getElementById('m1-svg'); clearNode(svg);
  var d = el('defs', {}, svg);
  linearGrad('m1g1', [['0',C.teal,'0.6'],['100%',C.blue,'0.1']], d);
  linearGrad('m1bar', [['0',C.teal],['100%',C.tealDim]], d, {x2:'0%',y2:'100%'});
  linearGrad('m1amb', [['0',C.amber],['100%','#b8702a']], d, {x2:'0%',y2:'100%'});
  addArrow('m1ar', d, C.teal);
  gridBg(svg, 960, 540, 40);

  if(v===0){
    titleBlock(svg, '演进路径：从单卡到超节点集群', '算力竞争逻辑从单卡性能转向系统级互联');
    var stages = [
      {t:'单卡性能', s:'GPU单点算力', c:C.mute},
      {t:'8卡服务器', s:'NVLink内互联', c:C.blue},
      {t:'整机柜', s:'柜内 Scale-up', c:C.violet},
      {t:'Pod超节点', s:'柜间 Scale-out', c:C.amber},
      {t:'超节点集群', s:'十万卡级', c:C.teal}
    ];
    var y=250, gap=172, sx=44;
    el('line',{x1:44,y1:y,x2:916,y2:y,stroke:C.border,'stroke-width':1},svg);
    stages.forEach(function(st,i){
      var x=sx+i*gap;
      var active = (i===4);
      el('rect',{x:x,y:y-58,width:144,height:116,rx:11,fill:C.elev,stroke:st.c,'stroke-width':1.5},svg);
      if(active) el('rect',{x:x-3,y:y-61,width:150,height:122,rx:13,fill:'none',stroke:C.teal,'stroke-width':1.5,class:'pulse'},svg);
      // icon: GPU squares
      for(var gx=0;gx<3;gx++){ for(var gy=0;gy<2;gy++){
        var cs = active?C.teal:(i>=2?st.c:C.borderHi);
        el('rect',{x:x+16+gx*22,y:y-46+gy*20,width:16,height:14,rx:2,fill:cs,opacity:active?0.9:0.5},svg);
      }}
      textEl(x+72, y+8, st.t, svg, {'text-anchor':'middle',fill:C.text,'font-size':13,'font-weight':600});
      textEl(x+72, y+26, st.s, svg, {'text-anchor':'middle',fill:C.dim,'font-size':10.5});
      textEl(x+72, y+46, '阶段 '+(i+1), svg, {'text-anchor':'middle',fill:st.c,'font-size':10,'font-family':'Consolas,monospace'});
      if(i<4){ el('line',{x1:x+144,y1:y,x2:x+gap-6,y2:y,stroke:C.teal,'stroke-width':2,'marker-end':'url(#m1ar)',class:'flow'},svg); }
    });
    // moving packet
    var pkt = el('circle',{cx:60,cy:y,r:5,fill:C.teal,filter:'drop-shadow(0 0 6px '+C.teal+')'},svg);
    var pp=0;
    anim(function(){ pp=(pp+4)%880; pkt.setAttribute('cx', 60+pp); pkt.setAttribute('opacity', 0.4+0.6*Math.abs(Math.sin(pp/60))); }, 30);
    textEl(480, 120, '范式转变：从“堆单卡算力”到“系统级互联”', svg, {'text-anchor':'middle',fill:C.amber,'font-size':13,'font-weight':600});
    setStats('m1-stats', [
      {k:'集群规模',v:'10万+',u:'卡'},
      {k:'互联带宽',v:'400',u:'GB/s'},
      {k:'端到端延迟',v:'<500',u:'ns'},
      {k:'竞争维度',v:'系统级',u:''}
    ]);
    setNote('m1-note','超节点将算力竞争从“单卡 FLOPS”推向“系统级互联效率”：当单卡性能边际递减，谁能把更多 GPU 编织成一个超大计算体，谁就掌握下一代 AI 算力话语权。');
  } else if(v===1){
    titleBlock(svg, '超节点五大标准', '重新定义 AI 算力基础设施的硬性指标');
    var stds = [
      {t:'32卡统一',v:'32',u:'卡',d:'单超节点内 GPU 规模',c:C.teal},
      {t:'互联带宽',v:'400',u:'GB/s',d:'GPU 间双向带宽',c:C.blue},
      {t:'端到端延迟',v:'<500',u:'ns',d:'跨节点访问延迟',c:C.violet},
      {t:'统一编址',v:'1',u:'域',d:'全局一致内存空间',c:C.amber},
      {t:'高速总线',v:'NVLink',u:'',d:'柜间高速互联总线',c:C.green}
    ];
    var cx=110, cy=200, r=64, gap=176;
    stds.forEach(function(s,i){
      var x=cx+i*gap;
      // ring
      el('circle',{cx:x,cy:cy,r:r,fill:'none',stroke:C.border,'stroke-width':1},svg);
      el('circle',{cx:x,cy:cy,r:r-1,fill:'none',stroke:s.c,'stroke-width':2,opacity:0.8},svg);
      el('circle',{cx:x,cy:cy,r:r+8,fill:'none',stroke:s.c,'stroke-width':1,class:'pulse',opacity:0.5},svg);
      // arc dash
      el('circle',{cx:x,cy:cy,r:r-12,fill:'none',stroke:s.c,'stroke-width':1.5,'stroke-dasharray':'3 5',opacity:0.6,class:'flow'},svg);
      textEl(x, cy-6, s.v, svg, {'text-anchor':'middle',fill:s.c,'font-size':22,'font-weight':700,'font-family':'Consolas,monospace'});
      textEl(x, cy+14, s.u, svg, {'text-anchor':'middle',fill:C.dim,'font-size':11});
      textEl(x, cy+86, s.t, svg, {'text-anchor':'middle',fill:C.text,'font-size':13,'font-weight':600});
      textEl(x, cy+104, s.d, svg, {'text-anchor':'middle',fill:C.mute,'font-size':10.5});
    });
    el('line',{x1:60,y1:330,x2:900,y2:330,stroke:C.border,'stroke-width':1,'stroke-dasharray':'4 4'},svg);
    textEl(480, 370, '五项标准共同构成超节点的“技术准入门槛”', svg, {'text-anchor':'middle',fill:C.amber,'font-size':13});
    var seq = ['32卡规模','400GB/s带宽','<500ns延迟','统一编址','高速总线'];
    var bx=120;
    seq.forEach(function(q,i){
      var w=150;
      el('rect',{x:bx,y:395,width:w,height:40,rx:8,fill:C.elev,stroke:C.teal,'stroke-width':1},svg);
      textEl(bx+w/2,419,q,svg,{'text-anchor':'middle',fill:C.teal,'font-size':12,'font-weight':600});
      if(i<4){ el('line',{x1:bx+w,y1:415,x2:bx+w+18,y2:415,stroke:C.teal,'stroke-width':2,'marker-end':'url(#m1ar)',class:'flow'},svg); }
      bx+=w+20;
    });
    setStats('m1-stats', [
      {k:'GPU规模',v:'32',u:'卡/节点'},
      {k:'双向带宽',v:'400',u:'GB/s'},
      {k:'访问延迟',v:'<500',u:'ns'},
      {k:'编址域',v:'统一',u:''}
    ]);
    setNote('m1-note','五大标准并非孤立：32 卡规模需要 400GB/s 带宽支撑，而带宽又依赖 <500ns 低延迟与统一编址才能转化为有效算力，最终由高速总线物理落地。');
  } else {
    titleBlock(svg, '性能跃迁：单卡 vs 超节点', '有效算力随系统化能力指数级提升');
    var dims = [
      {n:'峰值FLOPS', a:1, b:1, c:1},
      {n:'有效算力', a:18, b:55, c:96},
      {n:'通信效率', a:22, b:48, c:92},
      {n:'扩展性', a:15, b:40, c:90},
      {n:'能效比', a:30, b:52, c:85}
    ];
    var bw=120, baseY=460, top=130, colGap=170, sx=70;
    el('line',{x1:50,y1:baseY,x2:910,y2:baseY,stroke:C.borderHi,'stroke-width':1.5},svg);
    [0,25,50,75,100].forEach(function(p){
      var yy=baseY-(baseY-top)*p/100;
      el('line',{x1:50,y1:yy,x2:910,y2:yy,stroke:C.border,'stroke-width':1,'stroke-dasharray':'3 4'},svg);
      textEl(38, yy+4, p+'', svg, {'text-anchor':'end',fill:C.mute,'font-size':10});
    });
    dims.forEach(function(dm,i){
      var x=sx+i*colGap;
      var cols=[{v:dm.a,c:C.mute,l:'单卡'},{v:dm.b,c:C.blue,l:'8卡服务器'},{v:dm.c,c:C.teal,l:'超节点'}];
      cols.forEach(function(co,ci){
        var h=(baseY-top)*co.v/100;
        var bx=x+ci*38;
        growBar(bx, baseY-h, 30, h, co.c, svg, ci*0.12);
        textEl(bx+15, baseY-h-8, co.v, svg, {'text-anchor':'middle',fill:co.c,'font-size':10,'font-weight':600});
      });
      textEl(x+57, baseY+22, dm.n, svg, {'text-anchor':'middle',fill:C.text,'font-size':12,'font-weight':600});
    });
    // legend
    var lg=[{c:C.mute,l:'单卡'},{c:C.blue,l:'8卡服务器'},{c:C.teal,l:'超节点'}];
    lg.forEach(function(g,i){ el('rect',{x:660+i*90,y:80,width:14,height:14,rx:3,fill:g.c},svg); textEl(680+i*90,92,g.l,svg,{fill:C.dim,'font-size':11}); });
    setStats('m1-stats', [
      {k:'有效算力提升',v:'5.3x',u:''},
      {k:'通信效率',v:'92%',u:''},
      {k:'扩展性',v:'90%',u:''},
      {k:'能效比',v:'85%',u:''}
    ]);
    setNote('m1-note','峰值 FLOPS 三者相当，但“有效算力”相差数倍——这正是超节点的核心价值：把峰值算力转化为模型训练真正可用的算力。');
  }
}

/* ===================== M2 四大瓶颈突破 ===================== */
function m2Draw(){ m2View(0); }
function m2View(v){
  clearAnims();
  var svg = document.getElementById('m2-svg'); clearNode(svg);
  var d = el('defs', {}, svg);
  linearGrad('m2red', [['0',C.red],['100%','#7a2440']], d, {x2:'0%',y2:'100%'});
  linearGrad('m2grn', [['0',C.green],['100%',C.tealDim]], d, {x2:'0%',y2:'100%'});
  addArrow('m2ar', d, C.teal);
  addArrow('m2ar2', d, C.red);
  gridBg(svg, 960, 540, 40);

  if(v===0){
    titleBlock(svg, '四大瓶颈全景', '单卡时代迈向超节点必须跨越的四堵墙');
    var walls = [
      {t:'通信墙', d:'跨卡/跨节点带宽不足', v:75, c:C.red, x:120},

    mod.className = 'module';
    mod.id = 'mod-' + m.id;
    var head = document.createElement('div'); head.className='mhead';
    var h2 = document.createElement('h2');
    var idxSpan = document.createElement('span'); idxSpan.className='idx';
    idxSpan.textContent = 'M' + String(i+1).padStart(2,'0');
    h2.appendChild(idxSpan);
    h2.appendChild(document.createTextNode(m.name));
    var p = document.createElement('p'); p.textContent = m.desc;
    head.appendChild(h2); head.appendChild(p);
    mod.appendChild(head);

    var toolbar = document.createElement('div'); toolbar.className='toolbar';
    m.views.forEach(function(vn, vi){
      var b = document.createElement('button'); b.textContent = vn;
      b.onclick = (function(mm, vv, tb, btn){
        return function(){
          tb.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
          btn.classList.add('active');
          mm.view(vv);
        };
      })(m, vi, toolbar, b);
      toolbar.appendChild(b);
    });
    mod.appendChild(toolbar);

    var wrap = document.createElement('div'); wrap.className='svg-wrap';
    var svg = el('svg', {id: m.id + '-svg', viewBox:'0 0 960 540', width:'100%', preserveAspectRatio:'xMidYMid meet'}, null);
    wrap.appendChild(svg);
    mod.appendChild(wrap);

    var stat = document.createElement('div'); stat.className='statbar'; stat.id=m.id+'-stats';
    mod.appendChild(stat);

    var note = document.createElement('div'); note.className='note'; note.id=m.id+'-note';
    note.textContent = m.note;
    mod.appendChild(note);

    stage.appendChild(mod);
  });
}

var buildNav = (function(){
  var nav = document.getElementById('nav');
  MODULES.forEach(function(m, i){
    var b = document.createElement('button');
    b.textContent = (i+1) + '. ' + m.name;
    b.onclick = function(){ switchModule(i); };
    nav.appendChild(b);
  });
  return true;
})();

function switchModule(idx){
  var navBtns = document.querySelectorAll('#nav button');
  navBtns.forEach(function(b, i){ b.classList.toggle('active', i === idx); });
  var mods = document.querySelectorAll('.module');
  mods.forEach(function(m, i){ m.classList.toggle('active', i === idx); });
  var mod = mods[idx];
  if(mod){
    var tbtns = mod.querySelectorAll('.toolbar button');
    tbtns.forEach(function(b, i){ b.classList.toggle('active', i === 0); });
  }
  clearAnims();
  if(MODULES[idx]){
    MODULES[idx].draw();
    MODULES[idx]._drawn = true;
  }
}

buildStage();
switchModule(0);
</script>
</body>
</html>
