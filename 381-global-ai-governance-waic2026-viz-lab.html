@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.aglow{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.adash{stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.ablink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.aspin{transform-origin:center;animation:spin 8s linear infinite}

@media(max-width:900px){.below{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.lab-hero h1{font-size:24px}}
