<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Models Viz Lab — 世界模型可视化实验室</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#f472b6;--accent2:#ec4899;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;overflow-x:hidden;
}
.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
a{color:inherit;text-decoration:none}

/* Header */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(8,9,10,.8);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:24px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo-mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(244,114,182,.3);
}
.logo-mark svg{width:16px;height:16px}
.nav-modules{
  display:flex;gap:4px;overflow-x:auto;flex:1;
  scrollbar-width:none;padding:4px 0;
}
.nav-modules::-webkit-scrollbar{display:none}
.nav-mod{
  padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text3);
  white-space:nowrap;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace;
}
.nav-mod:hover{background:var(--bg3);color:var(--text)}
.nav-mod.active{background:rgba(244,114,182,.12);color:var(--accent)}

/* Hero */
.hero{
  max-width:1200px;margin:0 auto;padding:64px 24px 48px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px;border:1px solid var(--border2);border-radius:999px;
  font-size:12px;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;
  margin-bottom:20px;
}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{
  font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:16px;
}
.hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:var(--text2);max-width:640px}
.hero-stats{display:flex;gap:32px;margin-top:32px}
.hero-stat .num{font-size:24px;font-weight:700;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace}
.hero-stat .lbl{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}

/* Modules */
.modules{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:flex;flex-direction:column;gap:32px}
.module{scroll-margin-top:80px}
.module-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;transition:border-color .3s;
}
.module-card:hover{border-color:var(--border2)}
.module-head{
  padding:28px 32px 0;display:flex;align-items:flex-start;gap:16px;
}
.module-num{
  font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;
  color:var(--accent);padding:4px 8px;border:1px solid rgba(244,114,182,.3);
  border-radius:6px;background:rgba(244,114,182,.06);
}
.module-title{flex:1}
.module-title h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.module-title p{font-size:14px;color:var(--text2);max-width:760px}
.module-body{padding:24px 32px 32px}
.viz-wrap{
  background:var(--bg);border:1px solid var(--border);border-radius:12px;
  padding:24px;min-height:280px;position:relative;overflow:hidden;
}
.viz-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{
  padding:7px 14px;border:1px solid var(--border2);border-radius:8px;
  background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;
  transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:rgba(244,114,182,.15);border-color:var(--accent);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
.slider-row input[type=range]{
  -webkit-appearance:none;width:160px;height:4px;background:var(--border2);border-radius:2px;outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(244,114,182,.5);
}
.val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:36px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--text3)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px}

/* Bottom nav */
.bottom-nav{
  max-width:1200px;margin:0 auto;padding:24px 24px 64px;
  display:flex;justify-content:space-between;gap:16px;
}
.bn-btn{
  flex:1;padding:16px 20px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg2);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:4px;
}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn.next{text-align:right;align-items:flex-end}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.bn-btn .ttl{font-size:14px;color:var(--text);font-weight:500}
.bn-btn:hover .ttl{color:var(--accent)}

footer{
  border-top:1px solid var(--border);padding:32px 24px;text-align:center;
  color:var(--text3);font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace;
}

svg{display:block}
.node-rect{transition:.25s}
.node-rect:hover{filter:brightness(1.3)}
.flow-line{stroke-dasharray:4 4;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.fade-in{animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.grid-bg{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:24px 24px}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="#08090a" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#08090a"/></svg></div>
      <span>World Models Viz Lab</span>
    </div>
    <nav class="nav-modules" id="navModules"></nav>
  </div>
</header>

<section class="hero">
  <div class="hero-badge"><span class="dot"></span> AI/ML 可视化实验室 · 世界模型</div>
  <h1>World Models<br><span class="grad">可视化实验室</span></h1>
  <p>从 Dreamer 到 Sora，探索 AI 如何"理解"与"想象"世界。本实验室通过 8 个交互式模块，可视化世界模型的核心架构与原理。</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">8</div><div class="lbl">Modules</div></div>
    <div class="hero-stat"><div class="num">RSSM</div><div class="lbl">Core Architecture</div></div>
    <div class="hero-stat"><div class="num">Imagination</div><div class="lbl">Latent Planning</div></div>
  </div>
</section>

<div class="modules" id="modules"></div>

<div class="bottom-nav" id="bottomNav"></div>

<footer>World Models Viz Lab · 纯 HTML/CSS/JS + SVG · Linear 暗色美学</footer>

<script>
const MODULES = [
  {id:'m1',num:'01',title:'World Model 概念',desc:'什么是世界模型 — AI 通过学习环境动力学来预测、想象与规划的能力。'},
  {id:'m2',num:'02',title:'Dreamer 架构',desc:'RSSM 潜空间动力学 + 奖励头 + 解码器，端到端 model-based RL。'},
  {id:'m3',num:'03',title:'Latent Imagination',desc:'在潜空间中 rollout 未来轨迹，无需解码到像素即可规划。'},
  {id:'m4',num:'04',title:'Recurrent State Space Model',desc:'确定性循环状态 + 随机潜变量，兼顾稳定与多样性。'},
  {id:'m5',num:'05',title:'视频预测',desc:'预测未来帧的挑战 — 误差累积、模糊与多模态未来。'},
  {id:'m6',num:'06',title:'Model-based RL',desc:'相比 model-free 的优势 — 样本效率与想象训练。'},
  {id:'m7',num:'07',title:'Planning via World Model',desc:'在世界模型中搜索动作序列，MPPI 与 latent planning。'},
  {id:'m8',num:'08',title:'GAIA-1 / Sora 生成式世界模型',desc:'大规模生成式世界模型 — 从驾驶模拟到视频生成。'}
];

// Build nav
const navEl = document.getElementById('navModules');
MODULES.forEach((m,i)=>{
  const a=document.createElement('a');
  a.className='nav-mod';a.href='#'+m.id;a.textContent=(i+1)+'';
  a.dataset.target=m.id;
  navEl.appendChild(a);
});

// Build module shells
const modEl=document.getElementById('modules');
MODULES.forEach(m=>{
  const sec=document.createElement('section');
  sec.className='module';sec.id=m.id;
  sec.innerHTML=`<div class="module-card">
    <div class="module-head">
      <span class="module-num">${m.num}</span>
      <div class="module-title"><h2>${m.title}</h2><p>${m.desc}</p></div>
    </div>
    <div class="module-body"><div class="viz-wrap" id="viz-${m.id}"></div></div>
  </div>`;
  modEl.appendChild(sec);
});

// Bottom nav
const bn=document.getElementById('bottomNav');
bn.innerHTML=`<a class="bn-btn prev" href="#m8"><span class="lbl">Prev</span><span class="ttl">GAIA-1 / Sora</span></a>
<a class="bn-btn next" href="#m2"><span class="lbl">Next</span><span class="ttl">Dreamer 架构</span></a>`;

// Scrollspy
const navLinks=[...document.querySelectorAll('.nav-mod')];
const sections=MODULES.map(m=>document.getElementById(m.id));
window.addEventListener('scroll',()=>{
  let cur=0;
  sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<120)cur=i;});
  navLinks.forEach((l,i)=>l.classList.toggle('active',i===cur));
  // update bottom nav
  const prevI=(cur-1+MODULES.length)%MODULES.length,nextI=(cur+1)%MODULES.length;
  bn.innerHTML=`<a class="bn-btn prev" href="#${MODULES[prevI].id}"><span class="lbl">Prev</span><span class="ttl">${MODULES[prevI].title}</span></a>
  <a class="bn-btn next" href="#${MODULES[nextI].id}"><span class="lbl">Next</span><span class="ttl">${MODULES[nextI].title}</span></a>`;
});
navLinks[0].classList.add('active');

/* ============ MODULE 1: World Model 概念 ============ */
(function(){
  const el=document.getElementById('viz-m1');
  el.innerHTML=`
  <svg viewBox="0 0 760 300" width="100%" style="max-height:340px">
    <defs>
      <linearGradient id="g1world" x1="0" x2="1"><stop offset="0" stop-color="#1e2026"/><stop offset="1" stop-color="#0f1115"/></linearGradient>
      <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#f472b6"/></marker>
    </defs>
    <!-- World -->
    <rect x="40" y="60" width="220" height="180" rx="12" fill="url(#g1world)" stroke="#1e2026"/>
    <text x="150" y="40" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">真实世界 Environment</text>
    <g class="grid-bg" opacity=".5"><rect x="50" y="70" width="200" height="160" rx="6" fill="none"/></g>
    <!-- moving agent -->
    <circle id="m1agent" cx="120" cy="150" r="10" fill="#f472b6">
      <animate attributeName="cx" values="120;200;160;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;110;180;150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="260" text-anchor="middle" fill="#71717a" font-size="11">agent 在环境中移动</text>

    <!-- observation arrow -->
    <path d="M270 130 Q330 110 390 110" fill="none" stroke="#f472b6" stroke-width="2" marker-end="url(#arr1)" class="flow-line"/>
    <text x="330" y="100" text-anchor="middle" fill="#f472b6" font-size="11">observation o_t</text>
    <!-- action arrow back -->
    <path d="M390 170 Q330 190 270 170" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arr1)" stroke-dasharray="4 4"/>
    <text x="330" y="200" text-anchor="middle" fill="#71717a" font-size="11">action a_t</text>

    <!-- World Model (brain) -->
    <rect x="400" y="60" width="320" height="180" rx="12" fill="url(#g1world)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="560" y="40" text-anchor="middle" fill="#f472b6" font-size="13" font-family="'SF Mono',monospace">World Model 世界模型</text>
    <circle cx="560" cy="150" r="48" fill="none" stroke="#f472b6" stroke-width="1.5" opacity=".4" class="pulse"/>
    <circle cx="560" cy="150" r="32" fill="rgba(244,114,182,.1)" stroke="#f472b6"/>
    <text x="560" y="155" text-anchor="middle" fill="#f472b6" font-size="11">latent</text>
    <!-- prediction output -->
    <path d="M600 150 L680 110" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr1)" class="flow-line"/>
    <path d="M600 150 L680 150" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr1)" class="flow-line"/>
    <path d="M600 150 L680 190" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr1)" class="flow-line"/>
    <text x="700" y="115" fill="#a1a1aa" font-size="10">预测 o_{t+1}</text>
    <text x="700" y="155" fill="#a1a1aa" font-size="10">reward r_t</text>
    <text x="700" y="195" fill="#a1a1aa" font-size="10">done</text>
  </svg>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#f472b6"></span>观察/预测信号</div>
    <div class="legend-item"><span class="legend-dot" style="background:#71717a"></span>动作信号</div>
    <div class="legend-item"><span class="legend-dot" style="background:rgba(244,114,182,.2);border:1px solid #f472b6"></span>潜空间状态</div>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">世界模型学习环境的动力学 <span class="mono" style="color:var(--accent)">p(o_{t+1} | o_{≤t}, a_{≤t})</span>，让 agent 无需每次都与环境交互即可"想象"行为后果，大幅提升样本效率。</p>`;
})();

/* ============ MODULE 2: Dreamer 架构 ============ */
(function(){
  const el=document.getElementById('viz-m2');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px">
    <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#f472b6"/></marker></defs>
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">Dreamer 架构（点击高亮数据流）</text>
    <!-- Encoder -->
    <rect class="node-rect" data-flow="enc" x="30" y="120" width="110" height="60" rx="8" fill="#0f1115" stroke="#2a2d35"/>
    <text x="85" y="150" text-anchor="middle" fill="#e4e4e7" font-size="12">Encoder</text>
    <text x="85" y="166" text-anchor="middle" fill="#71717a" font-size="10">CNN</text>
    <text x="85" y="105" text-anchor="middle" fill="#71717a" font-size="10">image o_t</text>
    <!-- RSSM core -->
    <rect class="node-rect" data-flow="rssm" x="200" y="100" width="180" height="120" rx="10" fill="rgba(244,114,182,.06)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="290" y="130" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">RSSM</text>
    <rect x="215" y="145" width="70" height="28" rx="5" fill="#16181d" stroke="#2a2d35"/>
    <text x="250" y="163" text-anchor="middle" fill="#a1a1aa" font-size="10">deterministic</text>
    <rect x="295" y="145" width="70" height="28" rx="5" fill="#16181d" stroke="#2a2d35"/>
    <text x="330" y="163" text-anchor="middle" fill="#a1a1aa" font-size="10">stochastic</text>
    <text x="290" y="200" text-anchor="middle" fill="#71717a" font-size="10">latent state h_t, z_t</text>
    <!-- Recurrent -->
    <path d="M200 160 Q175 160 175 190 Q175 220 200 220" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr2)" opacity=".5"/>
    <text x="168" y="245" fill="#71717a" font-size="9">recurrent</text>
    <!-- Decoder -->
    <rect class="node-rect" data-flow="dec" x="450" y="70" width="120" height="50" rx="8" fill="#0f1115" stroke="#2a2d35"/>
    <text x="510" y="95" text-anchor="middle" fill="#e4e4e7" font-size="12">Decoder</text>
    <text x="510" y="110" text-anchor="middle" fill="#71717a" font-size="10">重建图像</text>
    <!-- Reward -->
    <rect class="node-rect" data-flow="rew" x="450" y="135" width="120" height="50" rx="8" fill="#0f1115" stroke="#2a2d35"/>
    <text x="510" y="160" text-anchor="middle" fill="#e4e4e7" font-size="12">Reward Head</text>
    <text x="510" y="175" text-anchor="middle" fill="#71717a" font-size="10">预测 r_t</text>
    <!-- Continue -->
    <rect class="node-rect" data-flow="con" x="450" y="200" width="120" height="50" rx="8" fill="#0f1115" stroke="#2a2d35"/>
    <text x="510" y="225" text-anchor="middle" fill="#e4e4e7" font-size="12">Continue Head</text>
    <text x="510" y="240" text-anchor="middle" fill="#71717a" font-size="10">预测 done</text>
    <!-- Actor Critic -->
    <rect class="node-rect" data-flow="ac" x="620" y="120" width="120" height="80" rx="8" fill="rgba(244,114,182,.06)" stroke="#f472b6"/>
    <text x="680" y="150" text-anchor="middle" fill="#f472b6" font-size="12">Actor-Critic</text>
    <text x="680" y="168" text-anchor="middle" fill="#a1a1aa" font-size="10">imagination</text>
    <text x="680" y="182" text-anchor="middle" fill="#a1a1aa" font-size="10">training</text>
    <!-- arrows -->
    <path id="m2p1" d="M140 150 L200 150" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr2)" class="flow-line"/>
    <path id="m2p2" d="M380 120 L450 95" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr2)" class="flow-line"/>
    <path id="m2p3" d="M380 160 L450 160" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr2)" class="flow-line"/>
    <path id="m2p4" d="M380 200 L450 225" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr2)" class="flow-line"/>
    <path d="M570 160 L620 160" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arr2)" class="flow-line"/>
  </svg>
  <div class="viz-controls">
    <button class="btn active" data-hl="all">全部</button>
    <button class="btn" data-hl="rssm">RSSM 核心</button>
    <button class="btn" data-hl="dec">Decoder</button>
    <button class="btn" data-hl="rew">Reward</button>
    <button class="btn" data-hl="ac">Actor-Critic</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">Dreamer 通过 <span style="color:var(--accent)">RSSM</span> 将观测编码为潜状态，再从潜空间想象未来轨迹并训练 actor-critic，实现高效 model-based RL。点击按钮高亮不同数据流。</p>`;
  const btns=el.querySelectorAll('.btn');
  btns.forEach(b=>b.addEventListener('click',()=>{
    btns.forEach(x=>x.classList.remove('active'));b.classList.add('active');
    const hl=b.dataset.hl;
    el.querySelectorAll('.node-rect').forEach(r=>{
      const f=r.dataset.flow;
      r.setAttribute('stroke', (hl==='all'||f===hl)?'#f472b6':'#2a2d35');
      r.style.opacity=(hl==='all'||f===hl)?'1':'.4';
    });
  }));
})();

/* ============ MODULE 3: Latent Imagination ============ */
(function(){
  const el=document.getElementById('viz-m3');
  el.innerHTML=`
  <svg viewBox="0 0 760 300" width="100%" style="max-height:340px" id="m3svg">
    <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#f472b6"/></marker></defs>
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">在潜空间想象未来轨迹（拖动滑块改变 horizon）</text>
    <g id="m3traj"></g>

  const g=document.getElementById('m5frames');

(function(){

  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">在世界模型中，agent 采样多条动作序列（MPPI），用想象的累计回报加权平均选择最优动作，实现 <span style="color:var(--accent)">零真实交互规划</span>。</p>`;
  const tree=document.getElementById('m7tree');
  const b=document.getElementById('m7b'),bv=document.getElementById('m7bv');
  const d=document.getElementById('m7d'),dv=document.getElementById('m7dv');
  const planBtn=document.getElementById('m7plan'),clearBtn=document.getElementById('m7clear');
  function nodePos(depth,idx,B,D){
    const x=60+depth*((640)/D);
    const spacing=260/Math.pow(B,depth);
    const y=60+idx*spacing+spacing/2;
    return [x,y];
  }
  function draw(bestPath){
    const B=+b.value,D=+d.value;bv.textContent=B;dv.textContent=D;
    let html='';
    const totalLeaves=Math.pow(B,D);
    // draw all nodes
    for(let dep=0;dep<=D;dep++){
      const cnt=Math.pow(B,dep);
      for(let i=0;i<cnt;i++){
        const [x,y]=nodePos(dep,i,B,D);
        const isBest=bestPath&&dep<=bestPath.length&&bestPath.slice(0,dep).join(',')===Array.from({length:dep},(_,k)=>bestPath[k]).join(',');
        const r=dep===0?8:5;
        const fill=dep===0?'#f472b6':(isBest?'#f472b6':'#2a2d35');
        html+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" opacity="${isBest?1:.5}"/>`;
        if(dep===D){
          const r_val=(Math.random()*3-0.5).toFixed(1);
          html+=`<text x="${x+10}" y="${y+3}" fill="${isBest?'#f472b6':'#71717a'}" font-size="9">R=${r_val}</text>`;
        }
      }
    }
    // edges
    for(let dep=0;dep<D;dep++){
      const cnt=Math.pow(B,dep);
      for(let i=0;i<cnt;i++){
        const [px,py]=nodePos(dep,i,B,D);
        for(let k=0;k<B;k++){
          const childIdx=i*B+k;
          const [cx,cy]=nodePos(dep+1,childIdx,B,D);
          const isBest=bestPath&&dep<bestPath.length&&bestPath[dep]===k&&bestPath.slice(0,dep).join(',')===Array.from({length:dep},(_,kk)=>bestPath[kk]).join(',');
          html+=`<path d="M${px} ${py} L${cx} ${cy}" stroke="${isBest?'#f472b6':'#1e2026'}" stroke-width="${isBest?2:1}" fill="none"/>`;
        }
      }
    }
    tree.innerHTML=html;
  }
  let animTimer=null;
  planBtn.addEventListener('click',()=>{
    const B=+b.value,D=+d.value;
    // random best path
    const path=[];for(let i=0;i<D;i++)path.push(Math.floor(Math.random()*B));
    // animate
    let step=0;clearInterval(animTimer);
    draw(null);
    animTimer=setInterval(()=>{
      step++;if(step>D){clearInterval(animTimer);return;}
      draw(path.slice(0,step));
    },400);
  });
  clearBtn.addEventListener('click',()=>{clearInterval(animTimer);draw(null);});
  b.addEventListener('input',()=>draw(null));d.addEventListener('input',()=>draw(null));
  draw(null);
})();

  function drawOut(){
    let html='';
    for(let i=0;i<5;i++){
      const x=490+i*50;
      html+=`<rect x="${x}" y="110" width="40" height="80" rx="4" fill="#0f1115" stroke="#2a2d35"/>`;
      // content depends on model
      if(curModel==='gaia'){
        // road + car
        html+=`<rect x="${x}" y="170" width="40" height="20" fill="#1e2026"/>`;
        html+=`<rect x="${x+10}" y="135" width="20" height="14" rx="3" fill="#f472b6" opacity="${0.4+Math.random()*0.5}"/>`;
        html+=`<line x1="${x}" y1="180" x2="${x+40}" y2="180" stroke="#71717a" stroke-dasharray="3 3"/>`;
      }else{
        // abstract scene
        const hue=Math.random()*60+300;
        html+=`<rect x="${x}" y="115" width="40" height="40" fill="hsl(${hue},40%,${15+Math.random()*20}%)"/>`;
        html+=`<circle cx="${x+20}" cy="170" r="${4+Math.random()*6}" fill="hsl(${hue+30},50%,${30+Math.random()*30}%)"/>`;
      }
      html+=`<text x="${x+20}" y="205" text-anchor="middle" fill="#71717a" font-size="8">f${i+1}</text>`;
    }
    out.innerHTML=html;
  }
  document.getElementById('m8gen').addEventListener('click',()=>{drawTokens();drawOut();});
  el.querySelectorAll('[data-m8m]').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('[data-m8m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    curModel=b.dataset.m8m;drawOut();
  }));
  drawTokens();drawOut();
  setInterval(drawTokens,1500);
})();
</script>
</body>
</html>
