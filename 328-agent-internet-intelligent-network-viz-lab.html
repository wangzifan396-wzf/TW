<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智联网与Agent互联网可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg-elev:#0f131a;--bg-card:#141a24;--bg-deep:#07080c;
  --border:#1c2330;--border-br:#283242;
  --text:#e6edf6;--text-dim:#6b7689;--text-mute:#444f60;
  --teal:#00d4aa;--teal-br:#2ce8bf;--teal-dim:#00a884;--teal-glow:rgba(0,212,170,.12);
  --blue:#4a9eff;--purple:#b388ff;--amber:#ffb74d;--red:#ff5c7a;--cyan:#22d3ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(0,212,170,.05),transparent),radial-gradient(900px 500px at 0% 0%,rgba(74,158,255,.04),transparent);
}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,11,15,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:30px;height:30px;border:1.5px solid var(--teal);border-radius:7px;display:grid;place-items:center;position:relative}
.logo::before{content:"";position:absolute;inset:5px;border:1px solid var(--teal-dim);border-radius:3px;transform:rotate(45deg)}
.logo::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.brand-title{font-size:15px;font-weight:600;letter-spacing:.5px}
.brand-title b{color:var(--teal-br)}
.brand-sub{font-size:11px;color:var(--text-dim);letter-spacing:1.5px}
.meta{display:flex;gap:18px;font-size:11px;color:var(--text-dim)}
.meta span b{color:var(--teal-br)}
.nav{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px 12px}
.nav-btn{
  background:var(--bg-card);border:1px solid var(--border-br);color:var(--text-dim);
  padding:7px 13px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;
  transition:all .18s;display:flex;align-items:center;gap:7px;
}
.nav-btn .tag{font-size:10px;color:var(--text-mute);border:1px solid var(--border-br);padding:1px 5px;border-radius:4px}
.nav-btn:hover{border-color:var(--teal-dim);color:var(--text)}
.nav-btn:hover .tag{color:var(--teal-dim)}
.nav-btn.active{background:var(--teal-glow);border-color:var(--teal);color:var(--teal-br);box-shadow:0 0 0 1px var(--teal-glow)}
.nav-btn.active .tag{color:var(--teal-br);border-color:var(--teal-dim)}
.stage{max-width:1180px;margin:0 auto;padding:22px}
.module{display:none}
.module.active{display:block;animation:modIn .5s cubic-bezier(.2,.7,.3,1)}
@keyframes modIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mod-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.mod-tag{flex:none;width:40px;height:40px;border:1.5px solid var(--teal);border-radius:9px;display:grid;place-items:center;color:var(--teal-br);font-weight:700;font-size:13px;background:var(--teal-glow)}
.mod-head h2{font-size:18px;font-weight:600;letter-spacing:.3px}
.mod-head p{font-size:12px;color:var(--text-dim);margin-top:3px;max-width:760px}
.mod-body{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:16px;overflow:hidden}
.ctrl-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.view-btn{
  background:var(--bg-card);border:1px solid var(--border-br);color:var(--text-dim);
  padding:7px 15px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;transition:all .18s;
}
.view-btn:hover{border-color:var(--teal-dim);color:var(--text)}
.view-btn.active{background:var(--teal-glow);border-color:var(--teal);color:var(--teal-br)}
.svg-frame{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;
  padding:10px;overflow-x:auto;
}
.svg-frame svg{display:block;width:100%;height:auto;min-width:760px;border-radius:6px}
.stat-bar{
  margin-top:12px;background:var(--bg-deep);border:1px solid var(--border);border-radius:9px;
  padding:11px 15px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-size:12px;color:var(--text-dim);
}
.stat-bar b{color:var(--teal-br)}
.stat-bar .k{color:var(--text-mute)}
.stat-bar::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulseDot 1.6s infinite;margin-right:12px}
@keyframes pulseDot{0%,100%{opacity:.4}50%{opacity:1}}
.foot{max-width:1180px;margin:30px auto 50px;padding:0 22px;color:var(--text-mute);font-size:11px;border-top:1px solid var(--border);padding-top:14px}
.foot b{color:var(--text-dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
svg .flow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.spin{transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--border-br);border-radius:4px}
::-webkit-scrollbar-track{background:var(--bg-deep)}
</style>
</head>
<body>
<header>
  <div class="brand-row">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="brand-title">智联网 <b>Agent Internet</b> 可视化实验室</div>
        <div class="brand-sub">AGENT-INTELLIGENT-NETWORK / VIS-LAB / 2026</div>
      </div>
    </div>
    <div class="meta">
      <span>模块 <b id="meta-mod">M1</b>/8</span>
      <span>主题 <b>智联网</b></span>
      <span>状态 <b style="color:var(--teal-br)">LIVE</b></span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="stage" id="stage"></main>
<footer class="foot">
  <div>基于腾讯研究院 <b>2026 AI十大趋势</b> · 智联网(Agent Internet)概念 · 零外部依赖单文件 / 纯HTML+CSS+JS+SVG</div>
  <div style="margin-top:6px">交互提示: 顶部切换模块 · 每个模块内点击视图按钮切换可视化 · SVG内置实时动画</div>
</footer>

<script>
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ---------- 通用绘制助手 ---------- */
var W = 1000, H = 450;
function baseRect(svg, fill){ return el("rect",{x:0,y:0,width:W,height:H,fill:fill||"#0c0f15"},svg); }
function hexPoints(cx, cy, r){
  var p = [];
  for (var i = 0; i < 6; i++){
    var a = Math.PI/6 + i*Math.PI/3;
    p.push((cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1));
  }
  return p.join(" ");
}
function node(cx, cy, r, fill, stroke, parent){
  return el("circle",{cx:cx,cy:cy,r:r,fill:fill,stroke:stroke||"#2a3242","stroke-width":1.4},parent);
}
function hex(cx, cy, r, fill, stroke, parent){
  return el("polygon",{points:hexPoints(cx,cy,r),fill:fill,stroke:stroke||"#2a3242","stroke-width":1.4},parent);
}
function line(x1,y1,x2,y2,stroke,parent,opts){
  var a = {x1:x1,y1:y1,x2:x2,y2:y2,stroke:stroke||"#2a3242","stroke-width":1.4};
  if(opts){for(var k in opts){if(opts.hasOwnProperty(k))a[k]=opts[k];}}
  return el("line",a,parent);
}
function pulse(el_){
  el("animate",{attributeName:"opacity",values:"0.45;1;0.45",dur:"2.2s",repeatCount:"indefinite"},el_);
}
function label(x,y,str,parent,opts){
  var a={x:x,y:y,fill:"#7a8699","font-size":11};
  if(opts){for(var k in opts){if(opts.hasOwnProperty(k))a[k]=opts[k];}}
  return tspanEl(x,y,str,parent,a);
}
function panel(x,y,w,h,fill,stroke,parent,r){
  return el("rect",{x:x,y:y,width:w,height:h,rx:r||8,ry:r||8,fill:fill||"#0f131a",stroke:stroke||"#1c2330","stroke-width":1},parent);
}
function defsBlock(svg, id){
  var defs = el("defs",{},svg);
  var rg = el("radialGradient",{id:id+"glow"},defs);
  el("stop",{offset:"0%","stop-color":"#00d4aa","stop-opacity":.55},rg);
  el("stop",{offset:"100%","stop-color":"#00d4aa","stop-opacity":0},rg);
  var lg = el("linearGradient",{id:id+"line",x1:0,y1:0,x2:1,y2:0},defs);
  el("stop",{offset:"0%","stop-color":"#00d4aa","stop-opacity":.9},lg);
  el("stop",{offset:"100%","stop-color":"#4a9eff","stop-opacity":.9},lg);
  var ag = el("linearGradient",{id:id+"amber",x1:0,y1:0,x2:1,y2:0},defs);
  el("stop",{offset:"0%","stop-color":"#ffb74d","stop-opacity":.9},ag);
  el("stop",{offset:"100%","stop-color":"#ff5c7a","stop-opacity":.9},ag);
  return defs;
}
function arrowHead(svg,id,color){
  var m = el("marker",{id:id,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"},svg);
  el("path",{d:"M0,0 L10,5 L0,10 Z",fill:color||"#00d4aa"},m);
}
function gridDots(svg){
  var g = el("g",{opacity:.5},svg);
  for(var x=40;x<W;x+=40){for(var y=40;y<H;y+=40){
    el("circle",{cx:x,cy:y,r:.7,fill:"#1a2230"},g);
  }}
  return g;
}
function flowLine(x1,y1,x2,y2,color,parent){
  var l = line(x1,y1,x2,y2,color||"#00d4aa",parent,{"stroke-width":1.6,"stroke-dasharray":"5 5",opacity:.7});
  el("animate",{attributeName:"stroke-dashoffset",from:"0",to:"-20",dur:"1.2s",repeatCount:"indefinite"},l);
  return l;
}

/* ================= M1 智联网全景 ================= */
var m1Current = 0;
function m1Draw(){
  var svg = document.getElementById("svg-m1");
  clearNode(svg);
  defsBlock(svg,"m1"); arrowHead(svg,"m1ah","#00d4aa");
  baseRect(svg);
  m1View(m1Current);
}
function m1View(v){
  m1Current = v;
  var svg = document.getElementById("svg-m1");
  var g = document.getElementById("m1-content");
  if(!g){ g = el("g",{id:"m1-content"},svg); }
  clearNode(g);
  gridDots(g);
  label(40,34,"M1 · 智联网全景 / Agent Internet Panorama",g,{fill:"#00d4aa","font-size":13,"font-weight":600});
  if(v===0){
    label(40,56,"互联网主体从人类 → Agent 的迭代演化",g,{fill:"#6b7689"});
    /* 三个阶段面板 */
    var ps=[["传统互联网",80],["过渡期",460],["智联网",760]];
    for(var i=0;i<3;i++){ panel(60+i*320,90,260,300,i===2?"#0c1a16":"#0f131a","#283242",g,10); }
    /* 阶段1: 人类节点网络 */
    label(190,120,"PHASE 1 · 人类主体",g,{fill:"#4a9eff","text-anchor":"middle"});
    var humans=[[170,180],[230,210],[150,250],[210,270],[250,230]];
    for(var j=0;j<humans.length;j++){ for(var k=j+1;k<humans.length;k++){ line(humans[j][0],humans[j][1],humans[k][0],humans[k][1],"#1f2a3d",g,{opacity:.6}); } }
    for(j=0;j<humans.length;j++){ var c=node(humans[j][0],humans[j][1],9,"#0a1830","#4a9eff",g); pulse(c); el("circle",{cx:humans[j][0],cy:humans[j][1],r:3,fill:"#4a9eff"},g); }
    label(190,300,"人类用户 × 内容消费",g,{fill:"#6b7689","text-anchor":"middle","font-size":10});
    label(190,318,"广告 · 社交 · 信息流",g,{fill:"#444f60","text-anchor":"middle","font-size":10});
    /* 阶段2: 过渡 */
    label(590,120,"PHASE 2 · 共生过渡",g,{fill:"#ffb74d","text-anchor":"middle"});
    node(560,200,8,"#0a1830","#4a9eff",g);
    hex(620,200,11,"#06140f","#00d4aa",g);
    node(590,255,8,"#0a1830","#4a9eff",g);
    flowLine(560,200,620,200,"#00d4aa",g);
    flowLine(590,255,620,200,"#00d4aa",g);
    flowLine(560,200,590,255,"#4a9eff",g);
    label(590,300,"人机协同 · Agent辅助",g,{fill:"#6b7689","text-anchor":"middle","font-size":10});
    /* 阶段3: 智联网 */
    label(890,120,"PHASE 3 · 智联网",g,{fill:"#00d4aa","text-anchor":"middle"});
    var ags=[[850,180],[910,200],[860,255],[920,255],[880,310]];
    for(j=0;j<ags.length;j++){ for(k=j+1;k<ags.length;k++){ flowLine(ags[j][0],ags[j][1],ags[k][0],ags[k][1],"#00a884",g); } }
    for(j=0;j<ags.length;j++){ var h=hex(ags[j][0],ags[j][1],12,"#06140f","#00d4aa",g); pulse(h); el("circle",{cx:ags[j][0],cy:ags[j][1],r:3.5,fill:"#00d4aa"},g); }
    label(890,345,"Agent主体 · 任务驱动",g,{fill:"#6b7689","text-anchor":"middle","font-size":10});
    label(890,363,"自主检索 · 跨平台协作",g,{fill:"#444f60","text-anchor":"middle","font-size":10});
    /* 演化箭头 */
    var a1=line(330,235,440,235,"url(#m1line)",g,{"stroke-width":2,opacity:.8,"marker-end":"url(#m1ah)"});
    var a2=line(600,235,720,235,"url(#m1line)",g,{"stroke-width":2,opacity:.8,"marker-end":"url(#m1ah)"});
    label(385,225,"演化",g,{fill:"#00d4aa","text-anchor":"middle","font-size":10});
    label(660,225,"成型",g,{fill:"#00d4aa","text-anchor":"middle","font-size":10});
    /* 时间轴 */
    line(80,400,920,400,"#283242",g,{"stroke-width":2});
    var tps=[["2010",140],["2018",340],["2024",640],["2026+",880]];
    for(i=0;i<tps.length;i++){ el("circle",{cx:tps[i][1],cy:400,r:4,fill:i===3?"#00d4aa":"#283242",stroke:"#00d4aa"},g); label(tps[i][1],420,tps[i][0],g,{fill:i===3?"#00d4aa":"#6b7689","text-anchor":"middle","font-size":10}); }
    setStatText(document.getElementById("stat-m1"),"主体变迁: 人类 → Agent → 共生智联网   |   时间跨度: 2010-2026+   |   阶段: 3");
  } else if(v===1){
    label(40,56,"人与Agent共生的网络拓扑: 双主体协同结构",g,{fill:"#6b7689"});
    var cx=500, cy=235;
    /* 人类层(外环蓝) + Agent层(内环青) */
    var humans=[], agents=[];
    for(i=0;i<8;i++){ var ang=i/8*Math.PI*2; humans.push([cx+170*Math.cos(ang), cy+150*Math.sin(ang)]); }
    for(i=0;i<8;i++){ var ang2=i/8*Math.PI*2+Math.PI/8; agents.push([cx+95*Math.cos(ang2), cy+85*Math.sin(ang2)]); }
    /* 人-A连线 */
    for(i=0;i<8;i++){ flowLine(humans[i][0],humans[i][1],agents[i][0],agents[i][1],"#2a4a6a",g); }
    /* Agent内部网 */
    for(i=0;i<8;i++){ flowLine(agents[i][0],agents[i][1],agents[(i+1)%8][0],agents[(i+1)%8][1],"#00a884",g); }
    /* 中心 */
    var c0=node(cx,cy,16,"#06140f","#00d4aa",g); pulse(c0);
    el("circle",{cx:cx,cy:cy,r:6,fill:"#00d4aa"},g);
    label(cx,cy+4,"核",g,{fill:"#0a0b0f","text-anchor":"middle","font-size":9});
    for(i=0;i<8;i++){ flowLine(agents[i][0],agents[i][1],cx,cy,"#00d4aa",g); }
    /* 节点 */
    for(i=0;i<8;i++){ node(humans[i][0],humans[i][1],7,"#0a1830","#4a9eff",g); label(humans[i][0],humans[i][1]+22,"H"+(i+1),g,{fill:"#4a9eff","text-anchor":"middle","font-size":9}); }
    for(i=0;i<8;i++){ var hx=hex(agents[i][0],agents[i][1],9,"#06140f","#00d4aa",g); label(agents[i][0],agents[i][1]+22,"A"+(i+1),g,{fill:"#00d4aa","text-anchor":"middle","font-size":9}); }
    /* 图例 */
    panel(40,90,150,58,"#0f131a","#283242",g,8);
    label(55,110,"图例",g,{fill:"#00d4aa","font-size":10});
    el("circle",{cx:62,cy:128,r:5,fill:"#0a1830",stroke:"#4a9eff"},g); label(74,132,"人类主体",g,{fill:"#6b7689","font-size":10});
    el("polygon",{points:hexPoints(62,146,6),fill:"#06140f",stroke:"#00d4aa"},g); label(74,150,"Agent主体",g,{fill:"#6b7689","font-size":10});
    setStatText(document.getElementById("stat-m1"),"共生节点: 8人 + 8Agent   |   双主体协同   |   中心: Agent编排核");
  } else {
    label(40,56,"智联网分层拓扑结构: 四层架构",g,{fill:"#6b7689"});
    var layers=[["应用层 / Application","用户任务入口 · 自然语言交互","#00d4aa",100],["Agent编排层 / Orchestration","主Agent统筹 · 多Agent分工","#4a9eff",180],["通信协议层 / Protocol","A2A协议 · 身份验证 · 互操作","#b388ff",260],["基础设施层 / Infra","注册中心 · 服务发现 · 信用体系","#ffb74d",340]];
    for(i=0;i<layers.length;i++){
      var L=layers[i];
      panel(70,L[3]-26,860,52,i===0?"#0c1a16":"#0f131a","#283242",g,8);
      el("rect",{x:70,y:L[3]-26,width:6,height:52,fill:L[2],rx:3},g);
      label(90,L[3]-6,L[0],g,{fill:L[2],"font-size":12,"font-weight":600});
      label(90,L[3]+12,L[1],g,{fill:"#6b7689","font-size":10});
      /* 层内节点 */
      for(var n=0;n<5;n++){ var nx=300+n*120; el("rect",{x:nx-22,y:L[3]-14,width:44,height:22,rx:5,fill:"#0a0e15",stroke:L[2],opacity:.9},g); label(nx,L[3]+1,"n"+(n+1),g,{fill:L[2],"text-anchor":"middle","font-size":9}); }
    }
    /* 层间箭头 */
    for(i=0;i<3;i++){ flowLine(500,layers[i][3]+26,500,layers[i+1][3]-26,"#00d4aa",g); }
    label(960,100,"API",g,{fill:"#00d4aa","text-anchor":"end","font-size":9});
    label(960,260,"A2A",g,{fill:"#b388ff","text-anchor":"end","font-size":9});
    setStatText(document.getElementById("stat-m1"),"架构层次: 4层   |   应用→编排→协议→基础设施   |   全栈解耦");
  }
}

/* ================= M2 Agent自主检索 ================= */
var m2Current = 0;
function m2Draw(){
  var svg = document.getElementById("svg-m2");
  clearNode(svg);
  defsBlock(svg,"m2"); arrowHead(svg,"m2ah","#00d4aa");
  baseRect(svg);
  m2View(m2Current);
}
function m2View(v){
  m2Current = v;
  var svg = document.getElementById("svg-m2");
  var g = document.getElementById("m2-content");
  if(!g){ g = el("g",{id:"m2-content"},svg); }
  clearNode(g);
  gridDots(g);
  label(40,34,"M2 · Agent自主检索 / Autonomous Retrieval",g,{fill:"#00d4aa","font-size":13,"font-weight":600});
  if(v===0){
    label(40,56,"Agent自主跨平台检索信息,数据回流驱动任务完成",g,{fill:"#6b7689"});

/* ---------- 模块注册 / 导航 / 切换 ---------- */
var MODULES = [
  { id:"m1", tag:"M1", name:"智联网全景", desc:"互联网主体从人类到Agent的迭代,人与Agent共生的智联网成型", views:["演化时间线","共生网络","拓扑结构"], draw:m1Draw, view:m1View, current:0 },

  { id:"m5", tag:"M5", name:"商业模式重构", desc:"从广告曝光分成到按任务结果收费,TCR任务完成率指标体系", views:["模式对比","TCR体系","收益曲线"], draw:m5Draw, view:m5View, current:0 },
  { id:"m6", tag:"M6", name:"Agent间通信协议", desc:"A2A协议,Agent身份验证,跨平台互操作", views:["协议栈","身份验证","互操作"], draw:m6Draw, view:m6View, current:0 },
  { id:"m7", tag:"M7", name:"智联网基础设施", desc:"Agent注册中心,服务发现,信用体系,安全隔离", views:["注册中心","服务发现","信用体系"], draw:m7Draw, view:m7View, current:0 },
  { id:"m8", tag:"M8", name:"智联网生态", desc:"开放生态vs封闭生态,Agent市场,平台竞争格局", views:["生态格局","Agent市场","竞争矩阵"], draw:m8Draw, view:m8View, current:0 }
];
var currentModule = "m1";

function buildControls(idx){
  var mod = MODULES[idx];
  var bar = document.getElementById("ctrl-" + mod.id);
  if(!bar) return;
  clearNode(bar);
  mod.views.forEach(function(label, i){
    var b = document.createElement("button");
    b.className = "view-btn" + (i === mod.current ? " active" : "");
    b.textContent = label;
    b.onclick = (function(ii){ return function(){
      mod.current = ii;
      var btns = bar.querySelectorAll(".view-btn");
      for(var q=0;q<btns.length;q++){ btns[q].classList.remove("active"); }
      this.classList.add("active");
      mod.view(ii);
    }; })(i);
    bar.appendChild(b);
  });
}

function switchModule(id){
  currentModule = id;
  var mods = document.querySelectorAll(".module");
  for(var i=0;i<mods.length;i++){ mods[i].classList.remove("active"); }
  var target = document.getElementById("mod-" + id);
  if(target){ target.classList.add("active"); }
  var btns = document.querySelectorAll(".nav-btn");
  for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("active", btns[j].dataset.mod === id); }
  for(var k=0;k<MODULES.length;k++){
    if(MODULES[k].id === id){
      buildControls(k);
      MODULES[k].draw();
      var mm = document.getElementById("meta-mod");
      if(mm) mm.textContent = MODULES[k].tag;
      break;
    }
  }
}

var buildNav = (function(){
  var nav = document.getElementById("nav");
  var stage = document.getElementById("stage");
  MODULES.forEach(function(mod){
    /* nav button */
    var b = document.createElement("button");
    b.className = "nav-btn";
    b.dataset.mod = mod.id;
    var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = mod.tag;
    b.appendChild(tag);
    b.appendChild(document.createTextNode(mod.name));
    b.onclick = function(){ switchModule(mod.id); };
    nav.appendChild(b);
    /* module container */
    var m = document.createElement("div");
    m.className = "module"; m.id = "mod-" + mod.id;
    var head = document.createElement("div"); head.className = "mod-head";
    var tg = document.createElement("div"); tg.className = "mod-tag"; tg.textContent = mod.tag;
    var ht = document.createElement("div");
    var h2 = document.createElement("h2"); h2.textContent = mod.name;
    var p = document.createElement("p"); p.className = "mod-desc"; p.textContent = mod.desc;
    ht.appendChild(h2); ht.appendChild(p);
    head.appendChild(tg); head.appendChild(ht);
    var body = document.createElement("div"); body.className = "mod-body";
    var ctrl = document.createElement("div"); ctrl.className = "ctrl-bar"; ctrl.id = "ctrl-" + mod.id;
    var frame = document.createElement("div"); frame.className = "svg-frame";
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("id","svg-" + mod.id);
    svg.setAttribute("viewBox","0 0 1000 450");
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    frame.appendChild(svg);
    var stat = document.createElement("div"); stat.className = "stat-bar"; stat.id = "stat-" + mod.id; stat.textContent = "就绪";
    body.appendChild(ctrl); body.appendChild(frame); body.appendChild(stat);
    m.appendChild(head); m.appendChild(body);
    stage.appendChild(m);
  });
})();

window.addEventListener("DOMContentLoaded", function(){
  switchModule("m1");
});
</script>
