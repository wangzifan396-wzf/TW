<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Papers · 可视化论文解读实验室</title>
<style>
:root{
  --bg:#08090a; --bg2:#0f1115; --bg3:#16181d;
  --border:#1e2026; --border2:#2a2d35;
  --text:#e4e4e7; --text2:#a1a1aa; --text3:#71717a;
  --accent:#7c5cff; --accent2:#5b3fd6;
  --green:#3ecf8e; --red:#ef4444; --blue:#3b82f6; --amber:#f59e0b; --cyan:#06b6d4; --pink:#ec4899;
  --radius:10px;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800}
.nav{display:flex;align-items:center;gap:4px}
.nav a{padding:7px 13px;border-radius:7px;font-size:13.5px;color:var(--text2);transition:.15s;font-weight:500}
.nav a:hover{background:var(--bg3);color:var(--text)}
.nav a.active{color:var(--text);background:var(--bg3)}

/* Hero */
.hero{max-width:1280px;margin:0 auto;padding:72px 24px 48px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.02em;margin-bottom:20px;padding:5px 12px;border:1px solid var(--border2);border-radius:100px;background:var(--bg2)}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:22px;max-width:880px}
.hero h1 .grad{background:linear-gradient(120deg,var(--accent),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:17px;color:var(--text2);max-width:620px;margin-bottom:36px;line-height:1.65}
.hero-stats{display:flex;gap:40px;flex-wrap:wrap}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
.stat .lbl{font-size:12.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* Filter bar */
.filter-bar{max-width:1280px;margin:0 auto;padding:0 24px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-bar .lbl{font-size:12.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.chip{padding:6px 14px;border-radius:100px;font-size:13px;font-weight:500;border:1px solid var(--border2);color:var(--text2);background:var(--bg2);transition:.15s}
.chip:hover{border-color:var(--text3);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Paper grid */
.paper-grid{max-width:1280px;margin:0 auto;padding:0 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.paper-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.paper-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-2px)}
.paper-card.read::after{content:'';position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pc-year{font-family:var(--mono);font-size:12px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:5px;border:1px solid var(--border)}
.pc-cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.cat-nlp{color:var(--cyan);background:rgba(6,182,212,.1)}
.cat-cv{color:var(--green);background:rgba(62,207,142,.1)}
.cat-rl{color:var(--amber);background:rgba(245,158,11,.1)}
.cat-gen{color:var(--pink);background:rgba(236,72,153,.1)}
.cat-cross{color:var(--accent);background:rgba(124,92,255,.1)}
.paper-card h3{font-size:15px;font-weight:650;line-height:1.35;margin-bottom:8px;letter-spacing:-.01em;min-height:40px}
.pc-authors{font-size:12px;color:var(--text3);margin-bottom:12px}
.pc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pc-tag{font-size:11px;color:var(--text2);background:var(--bg);padding:3px 8px;border-radius:5px;border:1px solid var(--border)}
.pc-contrib{font-size:12.5px;color:var(--text2);line-height:1.5}
.pc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.pc-cite{font-size:11.5px;color:var(--text3);font-family:var(--mono)}
.pc-arrow{font-size:13px;color:var(--text3);transition:.15s}
.paper-card:hover .pc-arrow{color:var(--accent);transform:translateX(3px)}

/* Detail view */
.detail-view{max-width:1100px;margin:0 auto;padding:0 24px 80px;display:none}
.detail-view.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);margin-bottom:24px;transition:.15s;padding:7px 0}
.detail-back:hover{color:var(--text)}
.detail-header{margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.detail-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.detail-meta .year{font-family:var(--mono);font-size:13px;color:var(--text3)}
.detail-meta .sep{color:var(--border2)}
.detail-meta .inst{font-size:13px;color:var(--text2)}
.detail-meta .cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.detail-header h2{font-size:clamp(24px,3.5vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:14px}
.detail-authors{font-size:14px;color:var(--text2);margin-bottom:18px}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.detail-tag{font-size:12px;color:var(--accent);background:rgba(124,92,255,.08);padding:4px 10px;border-radius:6px;border:1px solid rgba(124,92,255,.2)}
.detail-cite{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);font-family:var(--mono)}

.section{margin-bottom:48px}
.section-label{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.section-num{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.section-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.section-desc{font-size:14.5px;color:var(--text2);line-height:1.7;margin-bottom:20px;max-width:760px}

.viz-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.viz-box .viz-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.viz-box .viz-hint{font-size:11.5px;color:var(--text3);margin-top:12px;text-align:center}
.viz-svg{width:100%;display:block}
.viz-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.vctrl-btn{padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:500;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.15s}
.vctrl-btn:hover{color:var(--text);border-color:var(--text3)}
.vctrl-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.vctrl-slider{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.vctrl-slider input[type=range]{-webkit-appearance:none;width:120px;height:4px;background:var(--border2);border-radius:2px;outline:none}
.vctrl-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}

.arch-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.arch-box svg{width:100%;height:auto;display:block}

.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.result-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.result-card h4{font-size:13px;color:var(--text2);margin-bottom:14px;font-weight:600}
.result-card svg{width:100%;display:block}

.impact-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.impact-list li{display:flex;gap:12px;font-size:14px;color:var(--text2);line-height:1.6}
.impact-list li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex-shrink:0}

.related-box{background:linear-gradient(135deg,rgba(124,92,255,.06),rgba(6,182,212,.04));border:1px solid var(--border2);border-radius:var(--radius);padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.related-box .rb-left h4{font-size:15px;font-weight:650;margin-bottom:4px}
.related-box .rb-left p{font-size:13px;color:var(--text2)}
.related-box .rb-link{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.related-box .rb-link:hover{background:var(--accent2)}

.detail-nav{display:flex;align-items:center;justify-content:space-between;margin-top:56px;padding-top:28px;border-top:1px solid var(--border);gap:16px}
.dnav-btn{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);transition:.15s;max-width:48%}
.dnav-btn:hover{border-color:var(--border2);background:var(--bg3)}
.dnav-btn .dnav-dir{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.dnav-btn .dnav-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav-btn.next{margin-left:auto;text-align:right;flex-direction:row}

/* Footer */
.footer{border-top:1px solid var(--border);padding:40px 24px}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footer p{font-size:13px;color:var(--text3)}
.footer-links{display:flex;gap:18px}
.footer-links a{font-size:13px;color:var(--text2);transition:.15s}
.footer-links a:hover{color:var(--text)}

@media(max-width:640px){
  .hero{padding:48px 24px 36px}
  .hero-stats{gap:24px}
  .nav{display:none}
  .detail-nav{flex-direction:column}
  .dnav-btn{max-width:100%;width:100%}
}
.hidden{display:none!important}
</style>
</head>

<section class="hero">
  <span class="hero-eyebrow"><span class="dot"></span>可视化论文解读实验室</span>
  <h1>用动画与图表，<span class="grad">看见</span>里程碑论文的突破点</h1>
  <p>TW Papers 将12篇改变计算机科学与AI领域的经典论文，拆解为可交互的可视化模块。不是翻译论文，而是让你直观理解每篇论文的核心问题、关键创新与历史影响。</p>
  <div class="hero-stats">
    <div class="stat"><div class="num">12</div><div class="lbl">里程碑论文</div></div>
    <div class="stat"><div class="num">5</div><div class="lbl">研究领域</div></div>
    <div class="stat"><div class="num">12</div><div class="lbl">交互可视化</div></div>
    <div class="stat"><div class="num">2013–21</div><div class="lbl">时间跨度</div></div>
  </div>
</section>

<div class="filter-bar" id="filterBar">
  <span class="lbl">筛选</span>
  <button class="chip active" data-cat="all">全部</button>

</div>

<div class="paper-grid" id="paperGrid"></div>

<div class="detail-view" id="detailView"></div>

<footer class="footer">
  <div class="footer-inner">
    <p>TW Papers · 可视化论文解读实验室 · 纯 HTML/CSS/JS + SVG 构建</p>
    <div class="footer-links">
      <a href="index.html">Hub</a>

    </div>

</footer>

<script>
"use strict";
/* ============================================================
   TW Papers — Paper Data
   ============================================================ */
const PAPERS = [
  {
    id:'transformer', cat:'nlp', catLabel:'NLP',
    title:'Attention Is All You Need', year:2017,
    authors:'Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan N. Gomez, Łukasz Kaiser, Illia Polosukhin',
    institution:'Google Brain / Google Research',
    citations:'130,000+', tags:['Self-Attention','Transformer','Sequence-to-Sequence','Positional Encoding'],
    problem:'在 Transformer 之前，序列建模主要依赖 RNN/LSTM/GRU。这些模型必须按时间步顺序计算，无法并行化，且难以捕捉长距离依赖——相隔很远的词之间信息会逐步衰减。',
    innovation:'论文彻底抛弃循环结构，仅用自注意力（Self-Attention）机制建模序列内部关系。每个位置可以同时关注所有其他位置，实现完全并行计算。引入多头注意力（Multi-Head Attention）让模型从不同子空间关注不同模式，配合位置编码注入顺序信息。',
    architecture:'编码器-解码器结构，各6层。每层核心：多头注意力 + 前馈网络(FFN) + 残差连接 + LayerNorm。Q/K/V 通过线性投影得到，注意力分数 = softmax(QKᵀ/√dₖ)·V。',
    results:[
      {name:'WMT14 EN-DE BLEU', data:[{label:'已有最佳',v:25.2},{label:'Transformer',v:28.4}], unit:'BLEU'},
      {name:'WMT14 EN-FR BLEU', data:[{label:'已有最佳',v:40.4},{label:'Transformer',v:41.8}], unit:'BLEU'},
      {name:'训练成本(相对)', data:[{label:'基线模型',v:100},{label:'Transformer',v:28}], unit:'%'}
    ],
    impact:'Transformer 成为现代 AI 的基石架构。它直接催生了 BERT、GPT 系列、ViT、CLIP 等几乎所有现代大模型。\"Attention is all you need\" 这句话定义了一个时代——注意力机制取代了循环网络，成为序列建模的默认范式。',
    related:'transformer-viz-lab'
  },
  {
    id:'bert', cat:'nlp', catLabel:'NLP',
    title:'BERT: Pre-training of Deep Bidirectional Transformers', year:2018,
    authors:'Jacob Devlin, Ming-Wei Chang, Kenton Lee, Kristina Toutanova',
    institution:'Google AI Language',
    citations:'95,000+', tags:['Masked Language Model','双向编码','预训练','NLU'],
    problem:'GPT 等单向语言模型只能从左到右建模，无法利用右侧上下文。而传统词向量（Word2Vec、ELMo）要么浅层、要么单向，无法真正双向理解语言。',
    innovation:'BERT 提出掩码语言建模（MLM）：随机遮蔽部分 token，让模型根据左右两侧上下文预测被遮蔽的词，实现真正的双向编码。同时引入下一句预测（NSP）任务学习句间关系。预训练后只需微调即可适配下游任务。',
    architecture:'仅使用 Transformer 编码器（Base: 12层/110M, Large: 24层/340M）。输入 = Token嵌入 + 位置嵌入 + 段落嵌入。预训练任务：MLM(15%遮蔽) + NSP。',
    results:[
      {name:'GLUE 平均分', data:[{label:'之前SOTA',v:80.2},{label:'BERT Large',v:85.6}], unit:'分'},
      {name:'SQuAD v1.1 F1', data:[{label:'人类',v:91.2},{label:'BERT',v:93.2}], unit:'F1'},
      {name:'SQuAD v2.0 F1', data:[{label:'之前SOTA',v:81.0},{label:'BERT',v:83.1}], unit:'F1'}
    ],
    impact:'BERT 证明了\"预训练+微调\"范式的强大威力，11项 NLP 任务刷新纪录，超过人类表现。它开启了 NLP 的预训练时代，催生了 RoBERTa、ALBERT、DeBERTa 等一系列变体，并启发了计算机视觉领域的 MAE 等掩码建模方法。',
    related:'nlp-viz-lab'
  },
  {
    id:'gpt3', cat:'nlp', catLabel:'NLP',
    title:'Language Models are Few-Shot Learners (GPT-3)', year:2020,
    authors:'Tom Brown, Benjamin Mann, Nick Ryder, ..., Sam Altman, Ilya Sutskever',
    institution:'OpenAI',
    citations:'30,000+', tags:['Few-Shot Learning','In-Context Learning','规模化','自回归'],
    problem:'在 GPT-3 之前，要让语言模型适应新任务，必须为每个任务收集标注数据并微调。这种方式成本高、泛化差，且不同任务需要不同模型。',
    innovation:'GPT-3（1750亿参数）证明：当模型规模足够大时，无需任何参数更新，仅通过在输入中提供少量示例（few-shot），模型就能通过上下文学习（In-Context Learning）完成新任务。规模本身涌现出新的能力。',
    architecture:'自回归 Transformer 解码器，96层，d_model=12288，96个注意力头，上下文窗口2048 token。使用稀疏注意力降低长序列计算成本。',
    results:[
      {name:'模型规模 vs 准确率', curve:true, data:[{x:0,y:33},{x:1,y:41},{x:2,y:48},{x:3,y:55},{x:4,y:61},{x:5,y:66}], unit:'%', xlabel:'规模档位(0=小→5=175B)'},
      {name:'Few-Shot 能力涌现', curve:true, data:[{x:0,y:20},{x:1,y:22},{x:2,y:25},{x:3,y:31},{x:4,y:44},{x:5,y:58}], unit:'%', xlabel:'规模档位'}
    ],
    impact:'GPT-3 的发布是 LLM 时代的真正起点。In-Context Learning 成为提示工程（Prompt Engineering）的基础，直接催生了 ChatGPT 与整个生成式 AI 产业。它证明\"Scaling Law\"——模型越大、数据越多、算力越多，能力越强。',
    related:'llm-viz-lab'
  },
  {
    id:'ddpm', cat:'gen', catLabel:'生成',
    title:'Denoising Diffusion Probabilistic Models (DDPM)', year:2020,
    authors:'Jonathan Ho, Ajay Jain, Pieter Abbeel',
    institution:'UC Berkeley',
    citations:'12,000+', tags:['扩散模型','去噪','U-Net','生成模型'],

/* ============================================================
   State & Utilities
   ============================================================ */
const STORAGE_KEY = 'tw-papers-progress';
let currentCat = 'all';
let currentIdx = -1;
let animFrame = null;
let activeVizCleanup = null;

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
function markRead(id){
  const p = loadProgress();
  p[id] = true;
  saveProgress(p);
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function svgEl(tag, attrs){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function cancelAnim(){
  if(animFrame){ cancelAnimationFrame(animFrame); animFrame = null; }
  if(activeVizCleanup){ activeVizCleanup(); activeVizCleanup = null; }
}

/* ============================================================
   Render Paper Grid
   ============================================================ */
function renderGrid(){
  const grid = document.getElementById('paperGrid');
  grid.innerHTML = '';
  const progress = loadProgress();
  const filtered = PAPERS.filter(p => currentCat==='all' || p.cat===currentCat);
  filtered.forEach(p => {
    const idx = PAPERS.indexOf(p);
    const card = el('div','paper-card' + (progress[p.id]?' read':''));
    card.innerHTML = `
      <div class="pc-top">
        <span class="pc-year">${p.year}</span>
        <span class="pc-cat cat-${p.cat}">${p.catLabel}</span>
      </div>
      <h3>${p.title}</h3>
      <div class="pc-authors">${p.authors.split(',')[0]} et al.</div>
      <div class="pc-tags">${p.tags.slice(0,3).map(t=>`<span class="pc-tag">${t}</span>`).join('')}</div>
      <div class="pc-contrib">${p.innovation.split('。')[0]}。</div>
      <div class="pc-footer">
        <span class="pc-cite">${p.citations} 引用</span>
        <span class="pc-arrow">→</span>
      </div>`;
    card.addEventListener('click', ()=> openDetail(idx));
    grid.appendChild(card);
  });
}

/* ============================================================
   Filter
   ============================================================ */
document.getElementById('filterBar').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#filterBar .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentCat = chip.dataset.cat;
  renderGrid();
});

/* ============================================================
   Detail View
   ============================================================ */
function openDetail(idx){
  cancelAnim();
  currentIdx = idx;
  const p = PAPERS[idx];
  markRead(p.id);
  renderDetail(p);
  document.getElementById('paperGrid').classList.add('hidden');
  document.querySelector('.filter-bar').classList.add('hidden');
  const dv = document.getElementById('detailView');
  dv.classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   Result Charts (bar + line)
   ============================================================ */
function renderResultChart(r, idx){
  const container = document.getElementById('resultChart'+idx);
  if(!container) return;
  const W = 260, H = 150, pad = {l:36,r:14,t:14,b:30};
  const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'viz-svg'});
  if(r.curve){
    // line chart
    const data = r.data;
    const xs = data.map(d=>d.x), ys = data.map(d=>d.y);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys)*0.9, yMax = Math.max(...ys)*1.05;
    const sx = x => pad.l + (x-xMin)/(xMax-xMin||1)*(W-pad.l-pad.r);
    const sy = y => H-pad.b - (y-yMin)/(yMax-yMin||1)*(H-pad.t-pad.b);
    // grid
    for(let i=0;i<=4;i++){
      const yy = pad.t + i*(H-pad.t-pad.b)/4;
      svg.appendChild(svgEl('line',{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:'#1e2026','stroke-width':1}));
    }
    // path
    let pathD = '';
    data.forEach((d,i)=>{ pathD += (i===0?'M':'L') + sx(d.x)+' '+sy(d.y); });
    const defs = svgEl('defs');
    defs.innerHTML = `<linearGradient id="g${idx}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient>`;
    svg.appendChild(defs);
    const areaD = pathD + ` L ${sx(xMax)} ${H-pad.b} L ${sx(xMin)} ${H-pad.b} Z`;
    svg.appendChild(svgEl('path',{d:areaD,fill:`url(#g${idx})`}));
    svg.appendChild(svgEl('path',{d:pathD,fill:'none',stroke:'#7c5cff','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
    data.forEach(d=>{
      svg.appendChild(svgEl('circle',{cx:sx(d.x),cy:sy(d.y),r:3,fill:'#7c5cff',stroke:'#0f1115','stroke-width':1.5}));
    });
    // x label
    const xtext = svgEl('text',{x:W/2,y:H-6,fill:'#71717a','font-size':9,'text-anchor':'middle','font-family':'monospace'});
    xtext.textContent = r.xlabel||'';
    svg.appendChild(xtext);
    // y unit
    const utext = svgEl('text',{x:pad.l,y:pad.t-3,fill:'#71717a','font-size':9,'font-family':'monospace'});
    utext.textContent = r.unit;
    svg.appendChild(utext);
  } else {
    // bar chart
    const data = r.data;
    const maxV = Math.max(...data.map(d=>d.v));
    const barW = (W-pad.l-pad.r)/data.length - 14;
    const colors = ['#71717a','#7c5cff','#3ecf8e'];
    for(let i=0;i<=4;i++){
      const yy = pad.t + i*(H-pad.t-pad.b)/4;
      svg.appendChild(svgEl('line',{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:'#1e2026','stroke-width':1}));
    }
    data.forEach((d,i)=>{
      const bh = (d.v/maxV)*(H-pad.t-pad.b);
      const bx = pad.l + i*((W-pad.l-pad.r)/data.length) + 7;
      const by = H-pad.b-bh;
      svg.appendChild(svgEl('rect',{x:bx,y:by,width:barW,height:bh,fill:colors[i%3],rx:4}));
      const vtext = svgEl('text',{x:bx+barW/2,y:by-5,fill:'#e4e4e7','font-size':10,'text-anchor':'middle','font-family':'monospace','font-weight':'600'});
      vtext.textContent = d.v;
      svg.appendChild(vtext);
      const ltext = svgEl('text',{x:bx+barW/2,y:H-pad.b+14,fill:'#a1a1aa','font-size':9,'text-anchor':'middle'});
      const label = d.label.length>8 ? d.label.slice(0,7)+'…' : d.label;
      ltext.textContent = label;
      svg.appendChild(ltext);
    });
    const utext = svgEl('text',{x:pad.l,y:pad.t-3,fill:'#71717a','font-size':9,'font-family':'monospace'});
    utext.textContent = r.unit;
    svg.appendChild(utext);
  }
  container.appendChild(svg);
}

const INNOVATION_VIZ = {
  // 1. Transformer: Self-Attention heatmap
  transformer(box){
    const W=560,H=300;
    const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'viz-svg'});
    box.appendChild(svg);
    const tokens = ['The','cat','sat','on','the','mat'];
    const n = tokens.length;
    const cellSize = 36;
    const ox = 70, oy = 50;
    // Generate attention weights (softmax-ish)
    let weights = [];
    for(let i=0;i<n;i++){
      let row = [];
      for(let j=0;j<n;j++){
        // diagonal + nearby bias
        let v = Math.exp(-Math.abs(i-j)*0.6) + Math.random()*0.2;
        row.push(v);
      }
      const sum = row.reduce((a,b)=>a+b,0);
      row = row.map(v=>v/sum);
      weights.push(row);
    }
    // headers
    tokens.forEach((t,j)=>{
      const tx = svgEl('text',{x:ox+j*cellSize+cellSize/2,y:oy-8,fill:'#a1a1aa','font-size':10,'text-anchor':'middle','font-weight':'600'});
      tx.textContent = t; svg.appendChild(tx);
    });
    tokens.forEach((t,i)=>{
      const ty = svgEl('text',{x:ox-8,y:oy+i*cellSize+cellSize/2+3,fill:'#a1a1aa','font-size':10,'text-anchor':'end','font-weight':'600'});
      ty.textContent = t; svg.appendChild(ty);
    });
    // cells
    const cells = [];
    for(let i=0;i<n;i++){
      cells.push([]);
      for(let j=0;j<n;j++){
        const rect = svgEl('rect',{x:ox+j*cellSize,y:oy+i*cellSize,width:cellSize-2,height:cellSize-2,rx:3,fill:'#16181d'});
        svg.appendChild(rect);
        cells[i].push(rect);
      }
    }
    // Multi-head indicator
    const heads = ['Head 1','Head 2','Head 3','Head 4'];
    let activeHead = 0;
    const headBtns = el('div','viz-controls');
    box.appendChild(headBtns);
    heads.forEach((h,i)=>{
      const b = el('button','vctrl-btn'+(i===0?' active':''),h);
      b.addEventListener('click',()=>{
        activeHead = i;
        headBtns.querySelectorAll('.vctrl-btn').forEach((bb,k)=>bb.classList.toggle('active',k===i));
        regen();
      });
      headBtns.appendChild(b);
    });
    function regen(){
      weights = [];
      for(let i=0;i<n;i++){
        let row = [];
        const bias = activeHead%2===0 ? 0.6 : 1.2;
        for(let j=0;j<n;j++){
          let v = Math.exp(-Math.abs(i-j)*bias) + Math.random()*0.15;
          if(activeHead===2 && Math.abs(i-j)<=1) v += 0.3;
          if(activeHead===3 && (i+j)%2===0) v += 0.25;
          row.push(v);
        }
        const sum = row.reduce((a,b)=>a+b,0);
        row = row.map(v=>v/sum);
        weights.push(row);
      }
      animate();
    }
    function animate(){
      let frame = 0;
      const maxFrame = 30;
      function step(){
        cancelAnim();
        frame++;
        const t = Math.min(frame/maxFrame,1);
        for(let i=0;i<n;i++){
          for(let j=0;j<n;j++){
            const v = weights[i][j]*t;
            const alpha = Math.min(v*1.6,1);
            cells[i][j].setAttribute('fill',`rgba(124,92,255,${alpha})`);
          }
        }
        if(frame<maxFrame){ animFrame = requestAnimationFrame(step); }
      }
      step();
    }
    regen();
    const hint = el('div','viz-hint','点击不同注意力头查看不同的关注模式 · 颜色越亮注意力权重越高');
    box.appendChild(hint);
    activeVizCleanup = ()=> cancelAnim();
  },

    sliderWrap.appendChild(slider);
    const lbl=el('span',null,'0');
    sliderWrap.appendChild(lbl);
    ctrl.appendChild(sliderWrap);
    function update(){
      const t=parseInt(slider.value);
      lbl.textContent=t;
      rects.forEach((r,i)=>{
        const noise=i<=t?(i/(steps-1)):0;
        if(i<=t){
          const g=Math.round(62+noise*60);
          const b=Math.round(142-noise*100);
          const a=0.9-noise*0.5;
          r.setAttribute('fill',`rgba(${30+noise*120},${g},${b<0?0:b},${a})`);
        } else {
          r.setAttribute('fill','#1e2026');
        }
      });
    }
    slider.addEventListener('input',update);
    update();
    const revBtn=el('button','vctrl-btn','反向去噪 ▶');
    revBtn.addEventListener('click',()=>{
      slider.value=0; update();
      let t=0;
      function fwd(){
        cancelAnim();
        t++;
        slider.value=t; update();
        if(t<steps-1){ animFrame=requestAnimationFrame(()=>{ setTimeout(fwd,200); }); }
      }
      // animate forward then backward
      let phase='fwd';
      function run(){
        cancelAnim();
        if(phase==='fwd'){ t++; if(t>=steps-1) phase='bwd'; }
        else { t--; if(t<=0){ return; } }
        slider.value=t; update();
        animFrame=requestAnimationFrame(()=>{ setTimeout(run,180); });
      }
      t=0; phase='fwd'; run();
    });

    // root node
    const root={x:280,y:50,children:[]};
    const nodes=[root];
    const edges=[];
    // pre-generate tree structure
    const tree=[{x:280,y:50,p:null,depth:0}];
    const treeEdges=[];
    const positions=[
      {x:180,y:110},{x:280,y:110},{x:380,y:110},
      {x:130,y:175},{x:220,y:175},{x:310,y:175},{x:400,y:175},
      {x:100,y:240},{x:170,y:240},{x:250,y:240},{x:330,y:240},{x:410,y:240}
    ];
    // build edges
    treeEdges.push({from:0,to:1},{from:0,to:2},{from:0,to:3});
    treeEdges.push({from:1,to:4},{from:1,to:5},{from:2,to:6},{from:3,to:7});
    treeEdges.push({from:4,to:8},{from:5,to:9},{from:6,to:10},{from:7,to:11});
    positions.forEach(p=>tree.push({x:p.x,y:p.y}));
    let shown=1;
    function drawTree(){
      // clear edges and nodes (remove old, redraw)
      const old = svg.querySelectorAll('.mcts-el');
      old.forEach(e=>e.remove());
      // draw edges
      for(let i=0;i<treeEdges.length;i++){
        if(treeEdges[i].to>=shown) break;
        const e=treeEdges[i];
        const ln=svgEl('line',{x1:tree[e.from].x,y1:tree[e.from].y,x2:tree[e.to].x,y2:tree[e.to].y,stroke:'#3ecf8e','stroke-width':1.5,opacity:0.5,class:'mcts-el'});
        svg.appendChild(ln);
      }
      // draw nodes
      for(let i=0;i<shown && i<tree.length;i++){
        const n=tree[i];
        const c=svgEl('circle',{cx:n.x,cy:n.y,r:i===0?9:6,fill:i===0?'#7c5cff':'#3ecf8e',stroke:'#0f1115','stroke-width':1.5,class:'mcts-el'});
        svg.appendChild(c);
        if(i>0){
          const wins=Math.floor(Math.random()*20)+1;
          const visits=wins*2+Math.floor(Math.random()*10);
          const t=svgEl('text',{x:n.x,y:n.y-12,fill:'#71717a','font-size':8,'text-anchor':'middle','font-family':'monospace',class:'mcts-el'});
          t.textContent=wins+'/'+visits; svg.appendChild(t);
        }
      }
      const counter=svgEl('text',{x:280,y:265,fill:'#71717a','font-size':10,'text-anchor':'middle','font-family':'monospace',class:'mcts-el'});
      counter.textContent='已扩展节点: '+shown+' / '+tree.length;
      svg.appendChild(counter);
    }
    drawTree();
    let playing=false;
    function grow(){
      cancelAnim();
      shown++;
      if(shown>tree.length){ shown=tree.length; playing=false; btn.textContent='▶ 重新搜索'; return; }
      drawTree();
      if(playing){ animFrame=requestAnimationFrame(()=>{ setTimeout(grow,250); }); }
    }
    const ctrl=el('div','viz-controls');
    box.appendChild(ctrl);
    const btn=el('button','vctrl-btn active','▶ 开始树搜索');

      if(!playing){ playing=true; shown=1; btn.textContent='⏸ 暂停'; grow(); }
      else { playing=false; btn.textContent='▶ 继续'; }
    });

      if(shown<tree.length){ shown++; drawTree(); }

    ctrl.appendChild(stepBtn);
    const hint=el('div','viz-hint','策略网络指导扩展，价值网络评估节点 · W/N 为访问统计');

    // clip region
    const eps=0.2;
    const clipL=pad.l+(0.5-eps)*(W-pad.l-pad.r);
    const clipR=pad.l+(0.5+eps)*(W-pad.l-pad.r);
    svg.appendChild(svgEl('rect',{x:clipL,y:pad.t,width:clipR-clipL,height:H-pad.t-pad.b,fill:'rgba(62,207,142,.06)'}));
    svg.appendChild(svgEl('line',{x1:clipL,y1:pad.t,x2:clipL,y2:H-pad.b,stroke:'#3ecf8e','stroke-width':1,'stroke-dasharray':'4 2'}));
    svg.appendChild(svgEl('line',{x1:clipR,y1:pad.t,x2:clipR,y2:H-pad.b,stroke:'#3ecf8e','stroke-width':1,'stroke-dasharray':'4 2'}));
    svg.appendChild(svgEl('text',{x:clipL,y:pad.t-4,fill:'#3ecf8e','font-size':8,'text-anchor':'middle','font-family':'monospace'})).textContent='1−ε';
    svg.appendChild(svgEl('text',{x:clipR,y:pad.t-4,fill:'#3ecf8e','font-size':8,'text-anchor':'middle','font-family':'monospace'})).textContent='1+ε';
    // x axis label
    svg.appendChild(svgEl('text',{x:W/2,y:H-10,fill:'#71717a','font-size':10,'text-anchor':'middle'})).textContent='策略比率 r = π_new/π_old';
    svg.appendChild(svgEl('text',{x:pad.l,y:pad.t-8,fill:'#71717a','font-size':9,'font-family':'monospace'})).textContent='目标L';
    let A=1; // positive advantage
    function sx(r){ return pad.l+r*(W-pad.l-pad.r); }
    function sy(v){ const maxV=1.3; return H-pad.b-(v/maxV)*(H-pad.t-pad.b); }
    // unclipped line (dashed)
    let ud=''; for(let r=0;r<=1.001;r+=0.02){ ud+=(ud===''?'M':'L')+sx(r)+' '+sy(r*A); }
    svg.appendChild(svgEl('path',{d:ud,fill:'none',stroke:'#71717a','stroke-width':1.5,'stroke-dasharray':'4 3',opacity:0.5}));
    // clipped line (solid)
    const clipPath=svgEl('path',{fill:'none',stroke:'#7c5cff','stroke-width':2.5});
    svg.appendChild(clipPath);
    function drawClipped(){
      let d='';
      for(let r=0;r<=1.001;r+=0.01){
        const v=Math.min(r*A, (1+eps)*A);
        d+=(d===''?'M':'L')+sx(r)+' '+sy(v);
      }
      clipPath.setAttribute('d',d);
    }
    drawClipped();
    // legend
    svg.appendChild(svgEl('line',{x1:pad.l+10,y1:pad.t+8,x2:pad.l+30,y2:pad.t+8,stroke:'#7c5cff','stroke-width':2.5}));

    box.appendChild(ctrl);

    advBtn.addEventListener('click',()=>{
      A = A>0 ? -1 : 1;
      advBtn.textContent = A>0 ? '优势 A>0' : '优势 A<0';
      drawClipped();
    });
    ctrl.appendChild(advBtn);
    const epsBtn=el('button','vctrl-btn','ε=0.2');
    let epsVal=0.2;
    epsBtn.addEventListener('click',()=>{

      const ncl=pad.l+(0.5-epsVal)*(W-pad.l-pad.r);
      const ncr=pad.l+(0.5+epsVal)*(W-pad.l-pad.r);
      // redraw would need references; simple approach: just update drawClipped
      drawClipped();
    });
    ctrl.appendChild(epsBtn);
    const hint=el('div','viz-hint','截断限制策略更新幅度 · 切换优势正负观察目标函数变化');
    box.appendChild(hint);
    activeVizCleanup=()=> cancelAnim();
  },

    svg.appendChild(svgEl('text',{x:80,y:175,fill:'#71717a','font-size':8,'text-anchor':'middle'})).textContent='冻结 d×k';

    // B (r×k)
    const bRect=svgEl('rect',{x:160,y:90,width:60,height:40,rx:5,fill:'rgba(124,92,255,.15)',stroke:'#7c5cff','stroke-width':1.5});
    svg.appendChild(bRect);
    svg.appendChild(svgEl('text',{x:190,y:115,fill:'#7c5cff','font-size':13,'text-anchor':'middle','font-weight':'700','font-family':'monospace'})).textContent='B';
    const bLabel=svgEl('text',{x:190,y:145,fill:'#71717a','font-size':8,'text-anchor':'middle','font-family':'monospace'});
    svg.appendChild(bLabel);
    svg.appendChild(svgEl('text',{x:230,y:115,fill:'#71717a','font-size':16,'text-anchor':'middle','font-weight':'700'})).textContent='×';
    // A (d×r)
    const aRect=svgEl('rect',{x:250,y:80,width:60,height:60,rx:5,fill:'rgba(124,92,255,.15)',stroke:'#7c5cff','stroke-width':1.5});
    svg.appendChild(aRect);
    svg.appendChild(svgEl('text',{x:280,y:115,fill:'#7c5cff','font-size':13,'text-anchor':'middle','font-weight':'700','font-family':'monospace'})).textContent='A';
    const aLabel=svgEl('text',{x:280,y:155,fill:'#71717a','font-size':8,'text-anchor':'middle','font-family':'monospace'});
    svg.appendChild(aLabel);
    svg.appendChild(svgEl('text',{x:330,y:115,fill:'#71717a','font-size':16,'text-anchor':'middle','font-weight':'700'})).textContent='=';
    // result
    svg.appendChild(svgEl('rect',{x:350,y:60,width:80,height:100,rx:6,fill:'rgba(124,92,255,.08)',stroke:'#7c5cff','stroke-width':1.5}));
    svg.appendChild(svgEl('text',{x:390,y:115,fill:'#7c5cff','font-size':13,'text-anchor':'middle','font-weight':'700','font-family':'monospace'})).textContent='W₀+BA';
    svg.appendChild(svgEl('text',{x:390,y:175,fill:'#71717a','font-size':8,'text-anchor':'middle'})).textContent='合并无延迟';
    // parameter comparison bar
    svg.appendChild(svgEl('text',{x:280,y:200,fill:'#a1a1aa','font-size':10,'text-anchor':'middle','font-weight':'600'})).textContent='可训练参数对比';
    const fullBar=svgEl('rect',{x:60,y:210,width:200,height:14,rx:3,fill:'#ef4444'});
    svg.appendChild(fullBar);
    svg.appendChild(svgEl('text',{x:270,y:222,fill:'#ef4444','font-size':9})).textContent='全量微调 100%';
    const loraBar=svgEl('rect',{x:60,y:228,width:1.2,height:8,rx:2,fill:'#3ecf8e'});
    svg.appendChild(loraBar);
    svg.appendChild(svgEl('text',{x:270,y:236,fill:'#3ecf8e','font-size':9})).textContent='LoRA ~0.6%';
    let rank=8;
    function update(){
      const h=Math.max(20,Math.min(100,rank*5));
      bRect.setAttribute('y',60+(100-h)/2);
      bRect.setAttribute('height',h);
      aRect.setAttribute('y',60+(100-h)/2);
      aRect.setAttribute('height',h);
      bLabel.textContent='r×k (r='+rank+')';
      aLabel.textContent='d×r (r='+rank+')';
      const pct=(rank*2/(rank*2+1000)*100).toFixed(1);
      loraBar.setAttribute('width',Math.max(1.2,rank*0.15));
    }
    const ctrl=el('div','viz-controls');
    box.appendChild(ctrl);
    const sliderWrap=el('div','vctrl-slider');
    sliderWrap.innerHTML='<span>秩 r</span>';
    const slider=document.createElement('input');
    slider.type='range'; slider.min=1; slider.max=64; slider.value=8; slider.step=1;
    sliderWrap.appendChild(slider);
    const lbl=el('span',null,'8');
    sliderWrap.appendChild(lbl);
    ctrl.appendChild(sliderWrap);
    slider.addEventListener('input',()=>{
      rank=parseInt(slider.value);
      lbl.textContent=rank;
      update();
    });
    update();
    const hint=el('div','viz-hint','调整秩 r：r越小参数越少，矩阵 B 和 A 越扁');
    box.appendChild(hint);
    activeVizCleanup=()=> cancelAnim();
  },
  // 12. AlphaFold 2: Sequence to structure pipeline
  alphafold(box){
    const W=560,H=260;
    const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'viz-svg'});
    box.appendChild(svg);
    svg.appendChild(svgEl('text',{x:280,y:24,fill:'#a1a1aa','font-size':11,'text-anchor':'middle','font-weight':'600'})).textContent='序列 → 3D结构 预测流程';
    // sequence dots
    const seq='ACDEFGHIK';
    const seqDots=[];
    seq.split('').forEach((c,i)=>{
      const x=40+i*24;
      const d=svgEl('circle',{cx:x,cy:60,r:6,fill:'#71717a'});
      svg.appendChild(d); seqDots.push(d);
      const t=svgEl('text',{x:x,y:80,fill:'#71717a','font-size':8,'text-anchor':'middle','font-family':'monospace'});
      t.textContent=c; svg.appendChild(t);
    });
    // arrow to structure
    svg.appendChild(svgEl('path',{d:'M 280 90 L 280 110',stroke:'#7c5cff','stroke-width':1.5,'marker-end':'url(#afa)'}));
    const defs=svgEl('defs');
    defs.innerHTML='<marker id="afa" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7c5cff"/></marker>';
    svg.appendChild(defs);
    // 3D structure (animated folding)
    const structure=svgEl('g',{transform:'translate(280,180)'});
    svg.appendChild(structure);
    // generate a 3D-like backbone
    const nRes=seq.length;
    const points=[];
    for(let i=0;i<nRes;i++){
      const angle=i*0.7;
      const r=30+i*3;
      points.push({x:r*Math.cos(angle),y:r*Math.sin(angle)*0.5,base:0});
    }
    const backbone=svgEl('path',{fill:'none',stroke:'#3ecf8e','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
    structure.appendChild(backbone);
    const resDots=[];
    points.forEach((p,i)=>{
      const d=svgEl('circle',{cx:p.x,cy:p.y,r:4,fill:'#3ecf8e',stroke:'#0f1115','stroke-width':1});
      structure.appendChild(d); resDots.push(d);
    });
    let foldProgress=0, playing=false;
    function drawFold(){
      const t=foldProgress;
      // interpolate from line to folded
      let d='';
      points.forEach((p,i)=>{
        const startX=(i-nRes/2)*14;
        const startY=0;
        const x=startX+(p.x-startX)*t;
        const y=startY+(p.y-startY)*t;
        d+=(i===0?'M':'L')+x+' '+y;
        resDots[i].setAttribute('cx',x);
        resDots[i].setAttribute('cy',y);
      });
      backbone.setAttribute('d',d);
    }
    function animate(){
      cancelAnim();
      foldProgress+=0.02;
      if(foldProgress>=1){ foldProgress=1; playing=false; btn.textContent='▶ 重新折叠'; return; }
      drawFold();
      if(playing){ animFrame=requestAnimationFrame(()=>{ setTimeout(animate,30); }); }
    }
    drawFold();
    // accuracy comparison
    svg.appendChild(svgEl('text',{x:80,y:130,fill:'#71717a','font-size':9,'text-anchor':'middle'})).textContent='之前最佳';
    svg.appendChild(svgEl('rect',{x:40,y:138,width:80,height:12,rx:2,fill:'#ef4444',opacity:0.6}));
    svg.appendChild(svgEl('text',{x:80,y:162,fill:'#ef4444','font-size':9,'text-anchor':'middle','font-family':'monospace'})).textContent='GDT 62';
    svg.appendChild(svgEl('text',{x:460,y:130,fill:'#71717a','font-size':9,'text-anchor':'middle'})).textContent='AlphaFold2';
    svg.appendChild(svgEl('rect',{x:420,y:135,width:80,height:18,rx:2,fill:'#3ecf8e'}));
    svg.appendChild(svgEl('text',{x:460,y:162,fill:'#3ecf8e','font-size':9,'text-anchor':'middle','font-family':'monospace','font-weight':'700'})).textContent='GDT 92.4';
    const ctrl=el('div','viz-controls');
    box.appendChild(ctrl);
    const btn=el('button','vctrl-btn active','▶ 播放蛋白质折叠');
    btn.addEventListener('click',()=>{
      if(!playing){ playing=true; foldProgress=0; btn.textContent='⏸ 暂停'; animate(); }
      else { playing=false; btn.textContent='▶ 继续'; }
    });
    ctrl.appendChild(btn);
    const hint=el('div','viz-hint','氨基酸序列折叠成3D结构 · 精度从GDT 62提升至92.4');
    box.appendChild(hint);
    activeVizCleanup=()=> cancelAnim();
  }
};
