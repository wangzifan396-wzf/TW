<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Network — 网络包旅程模拟器</title>
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090a;--bg-1:#0d0e10;--bg-2:#131417;--bg-3:#1a1b1f;
  --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.12);
  --text:#e4e4e7;--text-2:#a1a1aa;--text-3:#71717a;
  --accent:#4f46e5;--accent-2:#6366f1;--accent-bg:rgba(79,70,229,0.12);
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#06b6d4;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Source Code Pro',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:13px;line-height:1.5;display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ===== Header ===== */
.hdr{
  height:56px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:12px;padding:0 16px;background:var(--bg-1);
  flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo-mark{
  width:28px;height:28px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:700;color:#fff;letter-spacing:-0.5px;
}
.logo-text{font-weight:600;font-size:14px}
.logo-sub{font-size:11px;color:var(--text-3);border-left:1px solid var(--border-2);padding-left:10px;margin-left:2px}
.hdr-input{flex:1;max-width:420px}
.hdr-input input{
  width:100%;height:34px;background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:6px;padding:0 12px;color:var(--text);font-size:13px;outline:none;
  transition:border-color .15s;
}
.hdr-input input:focus{border-color:var(--accent)}
.btn{
  height:34px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:500;
  background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:var(--bg-3);border-color:rgba(255,255,255,0.2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{height:30px;padding:0 10px;font-size:11px}
.hdr-speed{display:flex;gap:0;border:1px solid var(--border-2);border-radius:6px;overflow:hidden}
.speed-btn{
  height:34px;padding:0 10px;font-size:11px;color:var(--text-2);
  background:var(--bg-2);transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;border-right:1px solid var(--border-2);
}
.speed-btn:last-child{border-right:none}
.speed-btn.active{background:var(--accent-bg);color:var(--accent-2)}
.speed-btn:hover:not(.active){background:var(--bg-3)}

/* ===== Main Layout ===== */
.main{flex:1;display:flex;overflow:hidden;min-height:0}

/* ===== Stage Section ===== */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.stage-top{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.stage-title{font-size:15px;font-weight:600}
.step-label{
  font-size:12px;color:var(--text-2);font-family:var(--mono);
  padding:4px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:4px;
  max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.stage-svg{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:8px 16px;position:relative;
  background:
    linear-gradient(var(--bg) 0 0),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.02) 39px,rgba(255,255,255,0.02) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.02) 39px,rgba(255,255,255,0.02) 40px);
}
.stage-svg svg{max-width:100%;max-height:100%}
.stage-controls{
  padding:8px 16px 12px;display:flex;align-items:center;gap:8px;
  border-top:1px solid var(--border);
}
.phase-progress{flex:1;height:4px;background:var(--bg-2);border-radius:2px;overflow:hidden;margin-left:8px}
.phase-progress-bar{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .05s linear}

/* ===== Detail Section ===== */
.detail{width:340px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.detail-section{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--border)}
.detail-section:last-child{border-bottom:none}
.detail-title{
  padding:10px 16px;font-size:11px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);
  background:var(--bg-1);
}
.detail-content{flex:1;overflow-y:auto;padding:12px 16px}
.detail-content::-webkit-scrollbar{width:6px}
.detail-content::-webkit-scrollbar-track{background:transparent}
.detail-content::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}

/* Protocol header SVG */
.proto-svg{margin-bottom:12px}
.proto-svg svg{width:100%;display:block}

/* Protocol field table */
.proto-table{width:100%;border-collapse:collapse;font-size:11px}
.proto-table th{
  text-align:left;padding:6px 8px;color:var(--text-3);font-weight:500;
  border-bottom:1px solid var(--border-2);font-size:10px;text-transform:uppercase;letter-spacing:0.3px;
}
.proto-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.proto-table td:first-child{color:var(--text-2);font-family:var(--mono);white-space:nowrap}
.proto-table td:nth-child(2){color:var(--accent-2);font-family:var(--mono);white-space:nowrap}
.proto-table td:last-child{color:var(--text-3)}

/* HTTP message display */
.http-msg{
  font-family:var(--mono);font-size:11px;line-height:1.7;
  background:var(--bg-2);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin-bottom:12px;
}
.http-msg .m-method{color:var(--accent-2);font-weight:600}
.http-msg .m-path{color:var(--cyan)}
.http-msg .m-ver{color:var(--text-3)}
.http-msg .m-status{color:var(--green);font-weight:600}
.http-msg .m-hdr{color:var(--text-2)}
.http-msg .m-val{color:var(--text)}
.http-msg .m-body{color:var(--text-3)}
.http-msg .m-blank{color:var(--text-3);font-style:italic}

/* Knowledge card */
.kn-card{}
.kn-title{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
.kn-intro{font-size:12px;color:var(--text-2);margin-bottom:12px;line-height:1.6}
.kn-points{list-style:none;margin-bottom:12px}
.kn-points li{
  font-size:12px;color:var(--text-2);padding:4px 0 4px 16px;position:relative;line-height:1.5;
}
.kn-points li::before{
  content:'';position:absolute;left:0;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);
}
.kn-fact{
  font-size:11px;color:var(--text-3);padding:10px 12px;
  background:var(--bg-2);border:1px solid var(--border);border-radius:6px;
  border-left:3px solid var(--accent);line-height:1.5;
}
.kn-fact-label{color:var(--accent-2);font-weight:600;margin-right:4px}

/* ===== Footer / Timeline ===== */
.footer{flex-shrink:0;border-top:1px solid var(--border);background:var(--bg-1);padding:10px 16px}
.timeline{display:flex;align-items:center;gap:0;overflow-x:auto}
.tl-node{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 8px;
  border-radius:4px;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;flex-shrink:0;min-width:64px;
}
.tl-dot{
  width:10px;height:10px;border-radius:50%;background:var(--bg-3);
  border:2px solid var(--border-2);transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.tl-node.visited .tl-dot{background:var(--green);border-color:var(--green)}
.tl-node.active .tl-dot{background:var(--accent);border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-bg)}
.tl-label{font-size:10px;color:var(--text-3);white-space:nowrap}
.tl-node.active .tl-label{color:var(--accent-2);font-weight:600}
.tl-node.visited .tl-label{color:var(--text-2)}
.tl-node:hover .tl-dot{border-color:var(--accent-2)}
.tl-line{height:2px;flex:1;min-width:12px;background:var(--border-2);transition:background .2s}
.tl-line.done{background:var(--green)}

/* ===== Responsive ===== */
@media (max-width:960px){
  .main{flex-direction:column}
  .stage{border-right:none;border-bottom:1px solid var(--border);min-height:50%}
  .detail{width:100%;flex-direction:row}
  .detail-section{flex:1;border-bottom:none;border-right:1px solid var(--border)}
  .detail-section:last-child{border-right:none}
  .logo-sub{display:none}
}
@media (max-width:640px){
  .hdr{flex-wrap:wrap;height:auto;padding:8px;gap:8px}
  .hdr-input{order:3;flex:1 1 100%;max-width:none}
  .detail{flex-direction:column}
  .detail-section{border-right:none;border-bottom:1px solid var(--border)}
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-mark">TW</div>
    <span class="logo-text">TW Network</span>
    <span class="logo-sub">网络包旅程模拟器</span>
  </div>
  <div class="hdr-input">
    <input type="text" id="url-input" placeholder="https://example.com" value="https://example.com" />
  </div>
  <button id="send-btn" class="btn btn-primary">发送</button>
  <div class="hdr-speed">
    <button class="speed-btn" data-speed="0">慢速</button>
    <button class="speed-btn active" data-speed="1">正常</button>
    <button class="speed-btn" data-speed="2">快速</button>
  </div>
</header>

<main class="main">
  <section class="stage">
    <div class="stage-top">
      <div class="stage-title" id="stage-title">DNS 解析</div>
      <div class="step-label" id="step-label">点击"发送"开始模拟</div>
    </div>
    <div class="stage-svg" id="stage-container"></div>
    <div class="stage-controls">
      <button id="prev-btn" class="btn btn-sm">上一阶段</button>
      <button id="play-btn" class="btn btn-sm">播放</button>
      <button id="replay-btn" class="btn btn-sm">重播</button>
      <button id="next-btn" class="btn btn-sm">下一阶段</button>
      <div class="phase-progress"><div class="phase-progress-bar" id="phase-progress-bar"></div></div>
    </div>
  </section>
  <aside class="detail">
    <div class="detail-section" style="flex:1">
      <div class="detail-title">协议报文格式</div>
      <div class="detail-content" id="protocol-content"></div>
    </div>
    <div class="detail-section" style="flex:1">
      <div class="detail-title">知识卡片</div>
      <div class="detail-content" id="knowledge-content"></div>
    </div>
  </aside>
</main>

<footer class="footer">
  <div class="timeline" id="timeline"></div>
</footer>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
(function(){
'use strict';

/* ===== State ===== */
var state={
  phase:0,playing:false,speed:1,speedIdx:1,progress:0,
  phaseStart:0,rafId:null,visited:new Set(),urlData:null,
};
var prefersReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var SPEEDS=[{label:'慢速',value:0.5},{label:'正常',value:1},{label:'快速',value:2}];

/* ===== Utils ===== */
function $(id){return document.getElementById(id)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function easeIO(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function easeOut(t){return 1-Math.pow(1-t,3)}

function posOnPath(wps,p){
  var n=wps.length;
  if(n===0)return{x:0,y:0};
  if(p<=wps[0].at)return{x:wps[0].x,y:wps[0].y};
  if(p>=wps[n-1].at)return{x:wps[n-1].x,y:wps[n-1].y};
  for(var i=0;i<n-1;i++){
    if(p>=wps[i].at&&p<=wps[i+1].at){
      var t=(p-wps[i].at)/(wps[i+1].at-wps[i].at);
      var et=easeIO(t);
      return{x:lerp(wps[i].x,wps[i+1].x,et),y:lerp(wps[i].y,wps[i+1].y,et)};
    }
  }
  return{x:wps[n-1].x,y:wps[n-1].y};
}

function stepIdx(steps,p){
  var idx=0;
  for(var i=0;i<steps.length;i++){if(p>=steps[i].at)idx=i}
  return idx;
}

function localT(steps,p){
  var i=stepIdx(steps,p);
  var cur=steps[i];var next=steps[i+1];
  if(!next)return 1;
  return clamp((p-cur.at)/(next.at-cur.at),0,1);
}

/* ===== SVG Helpers ===== */
function E(id){return document.getElementById(id)}
function actN(id){var e=E(id);if(e){e.setAttribute('fill','rgba(79,70,229,0.12)');e.setAttribute('stroke','#4f46e5');e.setAttribute('stroke-width','1.5')}}
function deactN(id){var e=E(id);if(e){e.setAttribute('fill','#131417');e.setAttribute('stroke','rgba(255,255,255,0.1)');e.setAttribute('stroke-width','1')}}
function actL(id){var e=E(id);if(e){e.setAttribute('stroke','#4f46e5');e.setAttribute('stroke-width','2')}}
function deactL(id){var e=E(id);if(e){e.setAttribute('stroke','rgba(255,255,255,0.08)');e.setAttribute('stroke-width','1.5')}}
function setOp(id,v){var e=E(id);if(e)e.setAttribute('opacity',String(v))}
function setAttr(id,attr,v){var e=E(id);if(e)e.setAttribute(attr,String(v))}

function node(rectId,x,y,w,h,title,sub){
  return '<g>'+
    '<rect id="'+rectId+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="#131417" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+h/2-3)+'" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="600">'+title+'</text>'+
    (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+13)+'" text-anchor="middle" fill="#71717a" font-size="10" font-family="ui-monospace,monospace">'+sub+'</text>':'')+
    '</g>';
}

function wrapSVG(inner){
  return '<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;">'+
    '<defs>'+
    '<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>'+
    '<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>'+
    '<marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.15)"/></marker>'+
    '</defs>'+inner+'</svg>';
}

/* ===== URL Parsing ===== */
function parseURL(url){
  var raw=(url||'').trim();
  if(!raw)raw='https://example.com';
  if(!/^https?:\/\//.test(raw))raw='https://'+raw;
  try{
    var u=new URL(raw);
    var path=u.pathname+u.search;
    if(!path||path==='/')path='/';
    return{protocol:u.protocol,hostname:u.hostname,
      port:u.port||(u.protocol==='https:'?'443':'80'),
      path:path,full:u.href};
  }catch(e){
    return{protocol:'https:',hostname:'example.com',port:'443',path:'/',full:'https://example.com'};
  }
}

/* ===== Protocol Header SVG Builder ===== */
function buildHeaderSVG(rows){
  var pxPerBit=9;var rowH=34;var gap=2;
  var maxBits=0;
  for(var i=0;i<rows.length;i++){
    var t=0;for(var j=0;j<rows[i].length;j++)t+=rows[i][j].bits;
    if(t>maxBits)maxBits=t;
  }
  var totalW=maxBits*pxPerBit;
  var content='';
  for(var ri=0;ri<rows.length;ri++){
    var x=0;var y=ri*(rowH+gap);
    var row=rows[ri];
    for(var fi=0;fi<row.length;fi++){
      var f=row[fi];
      var w=f.bits*pxPerBit;
      var color=f.color||'rgba(79,70,229,0.08)';
      content+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+rowH+'" rx="3" fill="'+color+'" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>';
      if(w>=28){
        content+='<text x="'+(x+w/2)+'" y="'+(y+14)+'" text-anchor="middle" fill="#a1a1aa" font-size="9" font-family="ui-monospace,monospace">'+f.name+'</text>';
        content+='<text x="'+(x+w/2)+'" y="'+(y+27)+'" text-anchor="middle" fill="#e4e4e7" font-size="9" font-family="ui-monospace,monospace">'+f.value+'</text>';
      }else if(w>=14){
        content+='<text x="'+(x+w/2)+'" y="'+(y+21)+'" text-anchor="middle" fill="#a1a1aa" font-size="8" font-family="ui-monospace,monospace">'+f.name+'</text>';
      }
      x+=w;
    }
  }
  var totalH=rows.length*(rowH+gap);
  return '<svg viewBox="0 0 '+totalW+' '+totalH+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">'+content+'</svg>';
}

/* ===== Phases Data ===== */
var PHASES=[
/* ---- Phase 0: DNS ---- */
{
  id:'dns',name:'DNS 解析',short:'DNS',desc:'域名到 IP 地址的解析过程',duration:7000,
  steps:[
    {at:0.00,label:'浏览器检查本地 DNS 缓存'},
    {at:0.14,label:'缓存未命中，查询递归解析器'},
    {at:0.28,label:'解析器查询根 DNS 服务器 (.)'},
    {at:0.40,label:'根 DNS 返回 .com TLD 服务器地址'},
    {at:0.52,label:'解析器查询 .com TLD 服务器'},
    {at:0.64,label:'TLD 返回 example.com 权威 DNS 地址'},
    {at:0.76,label:'解析器查询权威 DNS 服务器'},
    {at:0.88,label:'权威 DNS 返回 IP 地址，解析器缓存并返回'},
  ],
  svg:function(){
    var h=state.urlData?state.urlData.hostname:'example.com';
    var s='';
    s+='<line id="dns-l1" x1="410" y1="72" x2="410" y2="92" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+='<line id="dns-l2" x1="410" y1="134" x2="410" y2="158" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+='<line id="dns-l3" x1="370" y1="186" x2="200" y2="262" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+='<line id="dns-l4" x1="230" y1="283" x2="350" y2="283" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+='<line id="dns-l5" x1="470" y1="283" x2="590" y2="283" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+='<line id="dns-l6" x1="620" y1="262" x2="450" y2="186" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+='<line id="dns-l7" x1="410" y1="158" x2="410" y2="72" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>';
    s+=node('dns-browser',340,30,140,42,'浏览器',h);
    s+=node('dns-cache',340,92,140,42,'本地缓存','miss');
    s+=node('dns-resolver',330,158,160,42,'递归解析器','8.8.8.8');
    s+=node('dns-root',105,262,125,42,'根 DNS','.');
    s+=node('dns-tld',350,262,120,42,'TLD DNS','.com');
    s+=node('dns-auth',590,262,125,42,'权威DNS',h.split('.').slice(-2).join('.'));
    s+=node('dns-result',320,352,180,42,'解析结果','93.184.216.34');
    s+='<circle id="dns-glow" cx="410" cy="51" r="12" fill="rgba(79,70,229,0.25)" opacity="0"/>';
    s+='<circle id="dns-pkt" cx="410" cy="51" r="6" fill="#4f46e5" opacity="0"/>';

      '绘制 (Paint/Repaint) 填充像素到图层',
    ],
    fact:'GPU 合成层可独立于主线程渲染，用 transform/opacity 做动画更高效。',
  }
}
]; /* end PHASES */

/* ===== Rendering Functions ===== */
function buildStage(idx){
  var ph=PHASES[idx];
  $('stage-container').innerHTML=ph.svg();
  $('stage-title').textContent=(idx+1)+'. '+ph.name;
  state.progress=0;
  state.phaseStart=0;
  $('phase-progress-bar').style.width='0%';
  if(prefersReducedMotion){
    ph.tick(1);
    $('phase-progress-bar').style.width='100%';
    state.visited.add(idx);
  }
}

function renderProtocol(idx){
  var ph=PHASES[idx];
  var html='';
  // Header layout SVG or HTTP message
  if(ph.headerRows){
    html+='<div class="proto-svg">'+buildHeaderSVG(ph.headerRows)+'</div>';
  }
  if(ph.httpMsg){
    html+=ph.httpMsg();
  }
  // Field table
  html+='<table class="proto-table"><thead><tr><th>字段</th><th>值</th><th>说明</th></tr></thead><tbody>';
  for(var i=0;i<ph.protoFields.length;i++){
    var pf=ph.protoFields[i];
    html+='<tr><td>'+pf.f+'</td><td>'+pf.v+'</td><td>'+pf.d+'</td></tr>';
  }
  html+='</tbody></table>';
  $('protocol-content').innerHTML=html;
}

function renderKnowledge(idx){
  var kn=PHASES[idx].knowledge;
  var html='<div class="kn-card">';
  html+='<div class="kn-title">'+kn.title+'</div>';
  html+='<div class="kn-intro">'+kn.intro+'</div>';
  html+='<ul class="kn-points">';
  for(var i=0;i<kn.points.length;i++){
    html+='<li>'+kn.points[i]+'</li>';
  }
  html+='</ul>';
  html+='<div class="kn-fact"><span class="kn-fact-label">DID YOU KNOW</span>'+kn.fact+'</div>';
  html+='</div>';
  $('knowledge-content').innerHTML=html;
}

function renderTimeline(){
  var html='';
  for(var i=0;i<PHASES.length;i++){
    var cls='tl-node';
    if(i===state.phase)cls+=' active';
    if(state.visited.has(i))cls+=' visited';
    html+='<button class="'+cls+'" data-idx="'+i+'">';
    html+='<span class="tl-dot"></span>';
    html+='<span class="tl-label">'+PHASES[i].short+'</span>';
    html+='</button>';
    if(i<PHASES.length-1){
      html+='<span class="tl-line'+(state.visited.has(i)?' done':'')+'"></span>';
    }
  }
  $('timeline').innerHTML=html;
  var nodes=document.querySelectorAll('.tl-node');
  for(var i=0;i<nodes.length;i++){
    nodes[i].addEventListener('click',function(){
      goToPhase(parseInt(this.getAttribute('data-idx')));
    });
  }
}

function updateStepLabel(p){
  var ph=PHASES[state.phase];
  var si=stepIdx(ph.steps,p);
  $('step-label').textContent=ph.steps[si].label;
}

function updatePhaseProgress(p){
  $('phase-progress-bar').style.width=Math.round(p*100)+'%';
}

function updatePlayButton(){
  $('play-btn').textContent=state.playing?'暂停':'播放';
}

/* ===== Animation Loop ===== */
function tick(ts){
  if(!state.playing)return;
  if(!state.phaseStart)state.phaseStart=ts;
  var elapsed=ts-state.phaseStart;
  var duration=PHASES[state.phase].duration/state.speed;
  state.progress=Math.min(elapsed/duration,1);
  PHASES[state.phase].tick(state.progress);
  updateStepLabel(state.progress);
  updatePhaseProgress(state.progress);
  if(state.progress>=1){
    state.visited.add(state.phase);
    renderTimeline();
    if(state.phase<PHASES.length-1){
      state.phase++;
      state.phaseStart=0;
      state.progress=0;
      buildStage(state.phase);
      renderProtocol(state.phase);
      renderKnowledge(state.phase);
      renderTimeline();
      state.rafId=requestAnimationFrame(tick);
    }else{
      state.playing=false;
      updatePlayButton();
    }
  }else{
    state.rafId=requestAnimationFrame(tick);
  }
}

function play(){
  if(prefersReducedMotion){
    for(var i=state.phase;i<PHASES.length;i++){
      state.visited.add(i);
    }
    state.phase=PHASES.length-1;
    buildStage(state.phase);
    renderProtocol(state.phase);
    renderKnowledge(state.phase);
    renderTimeline();
    return;
  }
  if(state.phase>=PHASES.length-1&&state.progress>=1){
    state.phase=0;state.progress=0;state.visited.clear();
    state.visited.add(0);
    buildStage(0);
    renderProtocol(0);
    renderKnowledge(0);
  }
  state.playing=true;
  state.phaseStart=0;
  updatePlayButton();
  state.rafId=requestAnimationFrame(tick);
}

function pause(){
  state.playing=false;
  if(state.rafId)cancelAnimationFrame(state.rafId);
  state.rafId=null;
  updatePlayButton();
}

function togglePlay(){
  if(state.playing){pause()}else{play()}
}

function goToPhase(idx){
  if(idx<0||idx>=PHASES.length)return;
  pause();
  state.phase=idx;
  state.progress=0;
  state.phaseStart=0;
  buildStage(idx);
  renderProtocol(idx);
  renderKnowledge(idx);
  renderTimeline();
}

function nextPhase(){
  goToPhase(Math.min(state.phase+1,PHASES.length-1));
}

function prevPhase(){
  goToPhase(Math.max(state.phase-1,0));
}

function replayPhase(){
  pause();
  state.progress=0;
  state.phaseStart=0;
  buildStage(state.phase);
  play();
}

/* ===== Event Handlers ===== */
function handleSend(){
  var url=$('url-input').value;
  state.urlData=parseURL(url);
  try{localStorage.setItem('tw-net-url',url)}catch(e){}
  state.phase=0;
  state.progress=0;
  state.visited.clear();
  state.visited.add(0);
  buildStage(0);
  renderProtocol(0);
  renderKnowledge(0);
  renderTimeline();
  play();
}

function handleSpeed(idx){
  state.speedIdx=idx;
  state.speed=SPEEDS[idx].value;
  try{localStorage.setItem('tw-net-speed',String(idx))}catch(e){}
  var btns=document.querySelectorAll('.speed-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active',i===idx);
  }
}

function init(){
  // Load saved state
  try{
    var savedUrl=localStorage.getItem('tw-net-url');
    if(savedUrl)$('url-input').value=savedUrl;
    var savedSpeed=localStorage.getItem('tw-net-speed');
    if(savedSpeed!==null){handleSpeed(parseInt(savedSpeed))}
  }catch(e){}
  state.urlData=parseURL($('url-input').value);
  // Bind events
  $('send-btn').addEventListener('click',handleSend);
  $('play-btn').addEventListener('click',togglePlay);
  $('prev-btn').addEventListener('click',prevPhase);
  $('next-btn').addEventListener('click',nextPhase);
  $('replay-btn').addEventListener('click',replayPhase);
  $('url-input').addEventListener('keydown',function(e){
    if(e.key==='Enter')handleSend();
  });
  var spBtns=document.querySelectorAll('.speed-btn');
  for(var i=0;i<spBtns.length;i++){
    spBtns[i].addEventListener('click',function(){
      handleSpeed(parseInt(this.getAttribute('data-speed')));
    });
  }
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT')return;
    if(e.key===' '){e.preventDefault();togglePlay()}
    else if(e.key==='ArrowLeft'){prevPhase()}
    else if(e.key==='ArrowRight'){nextPhase()}
    else if(e.key==='r'||e.key==='R'){replayPhase()}
  });
  // Initial render
  buildStage(0);
  renderProtocol(0);
  renderKnowledge(0);
  renderTimeline();
}

init();
})();
</script>
</body>
</html>
