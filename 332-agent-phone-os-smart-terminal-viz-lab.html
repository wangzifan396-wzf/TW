<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体手机与Agent操作系统可视化实验室 · WAIC 2026</title>
<style>
:root {
  --bg: #0a0b0f;
  --bg2: #12141c;
  --bg3: #1a1d28;
  --bg4: #222634;
  --teal: #00d4aa;
  --teal-dim: #00a88a;
  --teal-bright: #2effd0;
  --teal-glow: rgba(0,212,170,0.12);
  --text: #e8edf2;
  --text-dim: #8a94a6;
  --text-faint: #4a5266;
  --border: #2a2f3e;
  --border-bright: #3a4055;
  --accent: #ff6b6b;
  --warn: #ffb84d;
  --info: #5b9eff;
  --purple: #b388ff;
  --pink: #ff6bc6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}
.sticky-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,11,15,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sticky-header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.3px; }
.sticky-header h1 span { color: var(--teal); }
.header-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 16px; }
.header-meta b { color: var(--teal-dim); font-weight: 500; }
.module-nav {
  position: sticky;
  top: 53px;
  z-index: 99;
  background: rgba(18,20,28,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 4px;
  padding: 8px 28px;
  overflow-x: auto;
}
.nav-btn {
  padding: 8px 16px;
  background: none;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  font-family: inherit;
}
.nav-btn:hover { color: var(--text); background: var(--bg3); }
.nav-btn.active { color: var(--teal); background: var(--teal-glow); border-color: var(--teal-dim); }
.main-content { padding: 24px 28px 60px; max-width: 1200px; margin: 0 auto; }
.module { display: none; animation: moduleFadeIn 0.4s ease; }
.module.active { display: block; }
@keyframes moduleFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.module-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.module-title span { color: var(--teal); }
.module-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; max-width: 800px; }
.ctrl-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.ctrl-btn {
  padding: 7px 16px;
  background: var(--bg3);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.18s;
  font-family: inherit;
}
.ctrl-btn:hover { background: var(--bg4); border-color: var(--teal-dim); color: var(--text); }
.ctrl-btn.active { background: var(--teal-glow); border-color: var(--teal); color: var(--teal); }
.svg-container { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; overflow: hidden; }
.svg-container svg { width: 100%; height: auto; display: block; }
.status-bar {
  margin-top: 10px;
  padding: 10px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--teal);
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-dim);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  min-height: 38px;
}
.status-bar strong { color: var(--teal); }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
.info-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 12px; }
.info-card .label { color: var(--text-faint); font-size: 11px; }
.info-card .value { color: var(--teal); font-size: 16px; font-weight: 600; margin-top: 2px; }
.footer { text-align: center; padding: 30px; color: var(--text-faint); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
</style>
</head>
<body>
<header class="sticky-header">
  <h1>智能体手机与 <span>Agent OS</span> 可视化实验室</h1>
  <div class="header-meta">
    <b>WAIC 2026</b>
    <span>智能体手机趋势</span>
    <span>L1-L5 智能化分级</span>
  </div>
</header>
<nav class="module-nav" id="moduleNav"></nav>
<main class="main-content" id="moduleContainer"></main>
<div class="footer">智能体手机与Agent操作系统可视化实验室 · 零外部依赖 · 纯HTML/CSS/JS+SVG · WAIC 2026</div>
<script>
// ===== Core Utility Functions =====
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

// ===== Extended Helpers =====
function pts(arr) { return arr.map(function(p) { return p[0] + "," + p[1]; }).join(" "); }
function setupDefs(svg, prefix) {
  var defs = el("defs", {}, svg);
  var grad = el("linearGradient", { id: prefix + "-grad", x1: "0%", y1: "0%", x2: "100%", y2: "0%" }, defs);
  el("stop", { offset: "0%", "stop-color": "#00d4aa", "stop-opacity": "0.25" }, grad);
  el("stop", { offset: "100%", "stop-color": "#00d4aa", "stop-opacity": "0" }, grad);
  var rgrad = el("radialGradient", { id: prefix + "-rg", cx: "50%", cy: "50%", r: "50%" }, defs);
  el("stop", { offset: "0%", "stop-color": "#00d4aa", "stop-opacity": "0.3" }, rgrad);
  el("stop", { offset: "100%", "stop-color": "#00d4aa", "stop-opacity": "0" }, rgrad);
  var filter = el("filter", { id: prefix + "-glow", x: "-30%", y: "-30%", width: "160%", height: "160%" }, defs);
  el("feGaussianBlur", { stdDeviation: "3", result: "blur" }, filter);
  var merge = el("feMerge", {}, filter);
  el("feMergeNode", { in: "blur" }, merge);
  el("feMergeNode", { in: "SourceGraphic" }, merge);
  var marker = el("marker", { id: prefix + "-arrow", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" }, defs);
  el("path", { d: "M 0 0 L 10 5 L 0 10 Z", fill: "#00d4aa" }, marker);
  var marker2 = el("marker", { id: prefix + "-arrow-d", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto" }, defs);
  el("path", { d: "M 0 0 L 10 5 L 0 10 Z", fill: "#3a4055" }, marker2);
  return defs;
}
function drawGrid(parent, w, h, sp) {
  sp = sp || 40;
  for (var x = 0; x <= w; x += sp) { el("line", { x1: x, y1: 0, x2: x, y2: h, stroke: "#14161e", "stroke-width": 0.5 }, parent); }
  for (var y = 0; y <= h; y += sp) { el("line", { x1: 0, y1: y, x2: w, y2: y, stroke: "#14161e", "stroke-width": 0.5 }, parent); }
}
function svgBox(parent, x, y, w, h, label, opts) {
  opts = opts || {};
  var fill = opts.fill || "#1a1d28";
  var stroke = opts.stroke || "#3a4055";
  var sw = opts.sw || 1;
  var rx = opts.rx || 6;
  el("rect", { x: x, y: y, width: w, height: h, fill: fill, stroke: stroke, "stroke-width": sw, rx: rx, opacity: opts.opacity || 1 }, parent);
  if (label) { tspanEl(x + w / 2, y + h / 2 + 4, label, parent, { "text-anchor": "middle", fill: opts.tfill || "#e8edf2", "font-size": opts.fs || 12, "font-weight": opts.fw || 400 }); }
}
function svgNode(parent, cx, cy, r, label, opts) {
  opts = opts || {};
  el("circle", { cx: cx, cy: cy, r: r, fill: opts.fill || "#1a1d28", stroke: opts.stroke || "#3a4055", "stroke-width": opts.sw || 1.5 }, parent);
  if (label) { tspanEl(cx, cy + 4, label, parent, { "text-anchor": "middle", fill: opts.tfill || "#e8edf2", "font-size": opts.fs || 11 }); }
}
function updateButtons(mid, vidx) {
  var btns = document.querySelectorAll("#ctrl-" + mid + " .ctrl-btn");
  for (var i = 0; i < btns.length; i++) { btns[i].classList.toggle("active", i === vidx); }
}

// ==================== M1: 智能体手机全景 ====================
function m1Draw() {
  var svg = document.getElementById("svg-1");
  if (!svg) return;

}

    var yrs = ["2022", "2023", "2024", "2025", "2026"];

    for (var i = 0; i < 5; i++) {
      el("circle", { cx: xs[i], cy: yL, r: 18, fill: "#12141c", stroke: cs[i], "stroke-width": 2 }, g);
      tspanEl(xs[i], yL - 35, yrs[i], g, { "text-anchor": "middle", fill: cs[i], "font-size": 13, "font-weight": 700 });
      tspanEl(xs[i], yL + 45, lbs[i], g, { "text-anchor": "middle", fill: "#e8edf2", "font-size": 13, "font-weight": 600 });
      tspanEl(xs[i], yL + 62, ds[i], g, { "text-anchor": "middle", fill: "#8a94a6", "font-size": 11 });
      if (i < 4) { el("line", { x1: xs[i] + 20, y1: yL, x2: xs[i + 1] - 20, y2: yL, stroke: cs[i], "stroke-width": 1.5, "stroke-dasharray": "3 2", opacity: 0.5, "marker-end": "url(#m1-arrow)" }, g); }
      if (i === 4) {
        var p = el("circle", { cx: xs[i], cy: yL, r: 18, fill: "none", stroke: "#00d4aa", "stroke-width": 2, opacity: 0.6 }, g);
        el("animate", { attributeName: "r", values: "18;34;18", dur: "2s", repeatCount: "indefinite" }, p);
        el("animate", { attributeName: "opacity", values: "0.6;0;0.6", dur: "2s", repeatCount: "indefinite" }, p);
      }
    }
    tspanEl(430, 400, "从被动助手到主动代理 — 智能体手机完成5年跨越式演进", g, { "text-anchor": "middle", fill: "#4a5266", "font-size": 11 });
    tspanEl(430, 425, "STEPX Neo (2026) 首款L4级智能体手机  向L5完全自主迈进", g, { "text-anchor": "middle", fill: "#00a88a", "font-size": 12 });
    setStatText(stat, "[M1 v0] 演进时间线 | 5阶段: " + lbs.join(" > ") + " | 当前: " + lbs[4] + " (L4)");
  } else if (v === 1) {
    tspanEl(430, 35, "AI终端智能化分级标准  L1 — L5", g, { "text-anchor": "middle", fill: "#e8edf2", "font-size": 15, "font-weight": 600 });
    var lvs = [
      { lv: "L1", nm: "基础响应", dc: "被动响应用户指令", w: 100, c: "#4a5266" },
      { lv: "L2", nm: "智能推荐", dc: "基于规则和偏好推荐", w: 180, c: "#5b9eff" },
      { lv: "L3", nm: "有限自主", dc: "单场景自主完成任务", w: 280, c: "#b388ff" },
      { lv: "L4", nm: "跨场景协同", dc: "多应用跨场景协作", w: 400, c: "#ffb84d" },

// ==================== M2: Agent操作系统 ====================
function m2Draw() {
  var svg = document.getElementById("svg-2");

// ===== Module Switching =====
var moduleInitialized = {};
function switchModule(id) {
  var modules = document.querySelectorAll(".module");
  for (var i = 0; i < modules.length; i++) { modules[i].classList.remove("active"); }
  var target = document.getElementById("mod-" + id);
  if (target) target.classList.add("active");
  var navBtns = document.querySelectorAll(".nav-btn");
  for (var j = 0; j < navBtns.length; j++) {
    navBtns[j].classList.toggle("active", parseInt(navBtns[j].getAttribute("data-mid"), 10) === id);
  }
  if (!moduleInitialized[id]) {
    moduleInitialized[id] = true;
    var m = MODULES[id - 1];
    if (m && m.draw) { setTimeout(function(fn) { return function() { fn(); }; }(m.draw), 50); }
  }
}

// ===== Build Navigation (IIFE) =====
(function buildNav() {
  var nav = document.getElementById("moduleNav");
  var container = document.getElementById("moduleContainer");
  for (var i = 0; i < MODULES.length; i++) {
    var m = MODULES[i];
    var btn = document.createElement("button");
    btn.className = "nav-btn" + (i === 0 ? " active" : "");
    btn.textContent = m.short;
    btn.setAttribute("data-mid", m.id);
    btn.onclick = (function(id) { return function() { switchModule(id); }; })(m.id);
    nav.appendChild(btn);
    var sec = document.createElement("section");
    sec.className = "module" + (i === 0 ? " active" : "");
    sec.id = "mod-" + m.id;
    var title = document.createElement("div");
    title.className = "module-title";
    title.innerHTML = "M" + m.id + " <span>" + m.name + "</span>";
    sec.appendChild(title);
    var desc = document.createElement("p");
    desc.className = "module-desc";
    desc.textContent = m.desc;
    sec.appendChild(desc);
    var ctrl = document.createElement("div");
    ctrl.className = "ctrl-bar";
    ctrl.id = "ctrl-" + m.id;
    for (var j = 0; j < m.views.length; j++) {
      var cb = document.createElement("button");
      cb.className = "ctrl-btn" + (j === 0 ? " active" : "");
      cb.textContent = m.views[j];
      cb.onclick = (function(mod, idx) { return function() { mod.view(idx); }; })(m, j);
      ctrl.appendChild(cb);
    }
    sec.appendChild(ctrl);
    var svgWrap = document.createElement("div");
    svgWrap.className = "svg-container";
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 860 460");
    svg.id = "svg-" + m.id;
    svgWrap.appendChild(svg);
    sec.appendChild(svgWrap);
    var status = document.createElement("div");
    status.className = "status-bar";
    status.id = "status-" + m.id;
    status.textContent = "正在初始化模块...";
    sec.appendChild(status);
    container.appendChild(sec);
  }
})();
