*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0b0f;color:#e2e8f0;font-family:'SF Mono','JetBrains Mono',Consolas,monospace;min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.app-header{margin-bottom:14px}
.ah-badge{display:inline-block;padding:3px 12px;border:1px solid #00d4aa;border-radius:20px;color:#00d4aa;font-size:11px;letter-spacing:1px;margin-bottom:8px}
.ah-title{font-size:22px;font-weight:bold;color:#e2e8f0;margin-bottom:6px;line-height:1.3}
.ah-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.ah-tags span{padding:2px 10px;border:1px solid #2a3144;border-radius:12px;font-size:11px;color:#94a3b8}
.module-nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.nav-btn{padding:6px 13px;border:1px solid #2a3144;background:#0f1117;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;white-space:nowrap}
.nav-btn:hover{border-color:#00d4aa;color:#00d4aa}
.nav-btn.active{background:#00d4aa;color:#0a0b0f;border-color:#00d4aa;font-weight:bold}
.lab-hero{padding:12px 16px;background:#0f1117;border:1px solid #2a3144;border-radius:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.lab-hero .lh-left{min-width:0;flex:1}
.lab-hero .lh-title{font-size:15px;font-weight:bold;color:#e2e8f0}
.lab-hero .lh-desc{font-size:12px;color:#94a3b8;margin-top:3px}
.lab-hero .lh-meta{display:flex;gap:14px;flex-wrap:wrap}
.lab-hero .lh-meta .mk{font-size:10px;color:#64748b}
.lab-hero .lh-meta .mv{font-size:14px;font-weight:bold;color:#00d4aa}
.module-panel{display:flex;gap:14px}
.mp-tabs{display:flex;flex-direction:column;gap:6px;width:150px;flex-shrink:0}
.mp-tabs button{padding:8px 12px;border:1px solid #2a3144;background:#0f1117;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit;transition:all .2s}
.mp-tabs button:hover{border-color:#22d3ee;color:#22d3ee}
.mp-tabs button.active{background:#1c2030;color:#22d3ee;border-color:#22d3ee;font-weight:bold}
.mp-body{flex:1;min-width:0}
.svg-wrap{background:#0a0b0f;border:1px solid #2a3144;border-radius:12px;padding:12px;overflow:hidden}
.svg-wrap svg{width:100%;height:auto;display:block}
.mp-side{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.side-card{padding:10px 12px;background:#0f1117;border:1px solid #2a3144;border-radius:10px}
.side-card .sc-title{font-size:10px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{padding:3px 9px;border:1px solid;border-radius:12px;font-size:10px}
.legend{display:flex;flex-direction:column;gap:5px}
.lg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:#94a3b8}
.lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.info{display:flex;flex-direction:column;gap:3px}
.info-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #1e2433}
.info-k{color:#64748b}
.info-v{color:#e2e8f0;font-weight:bold}
.apulse{animation:apulse 2s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.4}}
.aglow{animation:aglow 2.5s ease-in-out infinite}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 1px currentColor)}50%{filter:drop-shadow(0 0 6px currentColor)}}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.4s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{animation:aspin 8s linear infinite;transform-origin:center}
@keyframes aspin{to{transform:rotate(360deg)}}
@media(max-width:960px){
  .module-panel{flex-direction:column}
  .mp-tabs{flex-direction:row;width:100%;overflow-x:auto}
  .mp-side{width:100%;flex-direction:row;flex-wrap:wrap}
  .side-card{flex:1;min-width:140px}
  .ah-title{font-size:18px}
}
</style>

/* ===== 导航与模块系统 ===== */
function buildNav(){var nav=$('moduleNav');clearNode(nav);MODULES.forEach(function(m,i){var b=document.createElement('button');b.className='nav-btn'+(i===mCur?' active':'');b.textContent=m.n+' '+m.t;b.onclick=function(){mCur=i;if(!mViews[mCur])mViews[mCur]=0;drawModule();buildNav();};nav.appendChild(b);});}
function buildTabs(){var tabs=$('mpTabs');clearNode(tabs);var m=MODULES[mCur];m.v.forEach(function(vn,i){var b=document.createElement('button');b.className=i===mViews[mCur]?'active':'';b.textContent=(i+1)+'. '+vn;b.onclick=function(){setView(i);};tabs.appendChild(b);});}
function setView(i){mViews[mCur]=i;drawModule();}
function drawModule(){for(var i=1;i<=8;i++){if(mLayers['m'+i])mLayers['m'+i].style.display='none';}var key='m'+(mCur+1);mLayers[key].style.display='';var fn=window[key+'Draw'];if(fn)fn();buildTabs();updateHero();}
function updateHero(){var m=MODULES[mCur];var el=$('labHero');clearNode(el);var left=document.createElement('div');left.className='lh-left';var t=document.createElement('div');t.className='lh-title';t.textContent=m.n+' · '+m.t;left.appendChild(t);var d=document.createElement('div');d.className='lh-desc';d.textContent=m.d;left.appendChild(d);el.appendChild(left);var right=document.createElement('div');right.className='lh-meta';m.meta.forEach(function(me){var c=document.createElement('div');var k=document.createElement('div');k.className='mk';k.textContent=me.k;var v=document.createElement('div');v.className='mv';v.textContent=me.v;c.appendChild(k);c.appendChild(v);right.appendChild(c);});el.appendChild(right);}
function init(){mLayers={};for(var i=1;i<=8;i++){mLayers['m'+i]=E($('mLayer'),'g',{});}buildNav();drawModule();}
window.addEventListener('DOMContentLoaded',init);
</script>
