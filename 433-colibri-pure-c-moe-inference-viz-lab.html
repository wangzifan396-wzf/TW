<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Colibri 纯C推理引擎 · 可视化实验室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overflow-x:hidden;min-height:100vh;
}
.app{max-width:1300px;margin:0 auto;padding:16px;}

/* ========== HEADER ========== */
.app-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;background:var(--bg2);
  border:1px solid var(--border);border-radius:12px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.app-header::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--teal),var(--cyan),var(--purple),var(--pink));
}
.ah-left{display:flex;align-items:center;gap:14px;}
.ah-badge{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,var(--teal),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;letter-spacing:1px;color:#fff;
}
.ah-title{font-size:17px;font-weight:700;letter-spacing:0.5px;}
.ah-sub{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:1px;}
.ah-tags{display:flex;gap:8px;}
.ah-tag{
  padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border2);color:var(--teal);background:rgba(0,212,170,0.06);
}
.ah-tag.c2{color:var(--cyan);background:rgba(34,211,238,0.06);}
.ah-tag.c3{color:var(--purple);background:rgba(167,139,250,0.06);}

/* ========== MODULE NAV ========== */
.module-nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;
  padding:10px 14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:all 0.2s;min-width:92px;font-family:inherit;
}
.nav-btn:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px);}
.nav-btn.active{border-color:var(--teal);background:rgba(0,212,170,0.08);box-shadow:0 0 12px rgba(0,212,170,0.15);}
.nav-n{font-size:10px;color:var(--text3);font-family:var(--mono);font-weight:700;letter-spacing:1px;}
.nav-btn.active .nav-n{color:var(--teal);}
.nav-t{font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap;}
.nav-btn.active .nav-t{color:var(--text);font-weight:600;}

/* ========== HERO ========== */
.lab-hero{
  padding:26px 24px;
  background:linear-gradient(135deg,var(--bg2),var(--bg3));
  border:1px solid var(--border);border-radius:14px;
  margin-bottom:14px;position:relative;overflow:hidden;
}
.lab-hero::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--teal),var(--cyan),transparent);
}
.hero-eyebrow{
  font-size:11px;color:var(--text3);font-family:var(--mono);
  letter-spacing:2px;margin-bottom:8px;
}
.hero-eyebrow span{color:var(--teal);font-weight:700;}
.hero-title{font-size:26px;font-weight:800;letter-spacing:1px;margin-bottom:8px;}
.hero-desc{font-size:13px;color:var(--text2);line-height:1.6;max-width:820px;}
.hero-meta{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.hm-item{
  display:flex;flex-direction:column;gap:2px;
  padding:8px 14px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;
}
.hm-k{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
.hm-v{font-size:13px;color:var(--teal);font-weight:600;}

/* ========== MODULE PANEL ========== */
.module-panel{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.mp-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 12px;}
.mp-tab{
  padding:12px 18px;background:none;border:none;
  color:var(--text3);font-size:13px;cursor:pointer;
  border-bottom:2px solid transparent;transition:all 0.2s;
  font-family:inherit;
}
.mp-tab:hover{color:var(--text2);}
.mp-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.mp-body{display:flex;gap:0;}
.svg-wrap{flex:1;padding:14px;min-width:0;}
#svg{
  width:100%;height:auto;display:block;
  background:var(--bg);border-radius:8px;
  border:1px solid var(--border);
}
.mp-side{
  width:260px;flex-shrink:0;padding:14px;
  border-left:1px solid var(--border);background:var(--bg3);
}
.side-set{display:flex;flex-direction:column;gap:16px;}
.sb{display:flex;flex-direction:column;gap:8px;}
.sb-t{
  font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:700;
}
.pills{display:flex;flex-wrap:wrap;gap:6px;}
.pill{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;background:var(--bg);
  border:1px solid var(--border);border-radius:6px;
  font-size:11px;color:var(--text2);
}
.pd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.legend{display:flex;flex-direction:column;gap:6px;}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.info{display:flex;flex-direction:column;gap:5px;}
.info-row{
  display:flex;justify-content:space-between;gap:8px;
  padding:5px 8px;background:var(--bg);
  border-radius:5px;font-size:11px;
}
.info-k{color:var(--text3);}
.info-v{color:var(--text2);font-weight:600;text-align:right;}

/* ========== ANIMATIONS ========== */
.apulse{animation:apulse 2s ease-in-out infinite;}
@keyframes apulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.aglow{animation:aglow 2.5s ease-in-out infinite;}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 2px currentColor);}50%{filter:drop-shadow(0 0 8px currentColor);}}
.adash{stroke-dasharray:6 4;animation:adash 0.8s linear infinite;}
@keyframes adash{to{stroke-dashoffset:-20;}}
.ablink{animation:ablink 1.5s ease-in-out infinite;}
@keyframes ablink{0%,100%{opacity:1;}50%{opacity:0.25;}}
.aspin{animation:aspin 14s linear infinite;transform-box:fill-box;transform-origin:center;}
@keyframes aspin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* ========== FOOTER ========== */
.app-footer{
  text-align:center;padding:16px;font-size:11px;
  color:var(--text3);letter-spacing:0.5px;
}

/* ========== RESPONSIVE ========== */
@media(max-width:960px){
  .mp-body{flex-direction:column;}
  .mp-side{width:100%;border-left:none;border-top:1px solid var(--border);}
  .nav-btn{min-width:72px;padding:8px 10px;}
  .ah-tags{display:none;}
  .hero-title{font-size:22px;}
}
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="ah-left">
      <div class="ah-badge">C</div>
      <div>
        <div class="ah-title">Colibri 纯C推理引擎 · 744B MoE消费级推理</div>

            <marker id="ah-c" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#22d3ee"/></marker>
            <marker id="ah-p" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#a78bfa"/></marker>
            <marker id="ah-a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#fbbf24"/></marker>
            <marker id="ah-b" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#3b82f6"/></marker>
            <marker id="ah-k" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#f472b6"/></marker>
            <marker id="ah-g" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#34d399"/></marker>
            <marker id="ah-r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ef4444"/></marker>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
        </svg>
      </div>
      <div class="mp-side" id="mpSide"></div>
    </div>
  </section>

  <footer class="app-footer">Colibri 纯C推理引擎 · 744B MoE消费级推理可视化实验室 · 2026</footer>
</div>

<script>
/* ==================== CONSTANTS ==================== */
var SVGNS='http://www.w3.org/2000/svg';

/* ==================== COLOR MIRROR ==================== */
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

/* ==================== UTILITY FUNCTIONS ==================== */
function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){el.setAttribute(k,attrs[k]);}}
  parent.appendChild(el);
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n.firstChild){n.removeChild(n.firstChild);}}
function box(g,x,y,w,h,opts){
  opts=opts||{};
  E(g,'rect',{x:x,y:y,width:w,height:h,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5,rx:opts.rx||8});
}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var t=E(g,'text',{x:x,y:y,fill:opts.fill||C.text,'font-size':opts.fs||13,'font-family':opts.ff||'sans-serif','text-anchor':opts.ta||'start','font-weight':opts.fw||'normal'});
  t.textContent=s;
  return t;
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5};
  if(opts.dash)a['stroke-dasharray']=opts.dash;
  if(opts.cls)a['class']=opts.cls;
  E(g,'line',a);
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var col=opts.stroke||C.teal;
  var mid='ah';
  if(col===C.cyan)mid='ah-c';else if(col===C.purple)mid='ah-p';else if(col===C.amber)mid='ah-a';
  else if(col===C.blue)mid='ah-b';else if(col===C.pink)mid='ah-k';else if(col===C.green)mid='ah-g';else if(col===C.red)mid='ah-r';
  var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':opts.sw||2,'marker-end':'url(#'+mid+')'};
  if(opts.dash)a['stroke-dasharray']=opts.dash;
  if(opts.cls)a['class']=opts.cls;
  E(g,'line',a);
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  var a={cx:cx,cy:cy,r:r,fill:opts.fill||'none',stroke:opts.stroke||C.teal,'stroke-width':opts.sw||1.5};
  if(opts.cls)a['class']=opts.cls;
  E(g,'circle',a);
}
function poly(g,pts,opts){
  opts=opts||{};
  E(g,'polygon',{points:pts,fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5});
}
function radar(g,cx,cy,r,labels,data,opts){
  opts=opts||{};
  var n=labels.length,i,a,rr;
  for(var ring=1;ring<=4;ring++){
    var pts=[];
    for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*ring/4;pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));}
    E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:C.border,'stroke-width':1});
  }
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;E(g,'line',{x1:cx,y1:cy,x2:cx+Math.cos(a)*r,y2:cy+Math.sin(a)*r,stroke:C.border,'stroke-width':1});}
  var dpts=[];
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*data[i]/100;dpts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));}
  E(g,'polygon',{points:dpts.join(' '),fill:opts.fill||'rgba(0,212,170,0.15)',stroke:opts.stroke||C.teal,'stroke-width':2});
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lx=cx+Math.cos(a)*(r+22),ly=cy+Math.sin(a)*(r+22)+4;txt(g,lx,ly,labels[i],{fs:10,fill:C.text2,ta:'middle'});}
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function setPills(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  for(var i=0;i<arr.length;i++){var p=arr[i];var d=document.createElement('div');d.className='pill';d.innerHTML='<span class="pd" style="background:'+p.c+'"></span><span>'+p.t+'</span>';c.appendChild(d);}
}
function setLegend(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  for(var i=0;i<arr.length;i++){var l=arr[i];var d=document.createElement('div');d.className='leg-item';d.innerHTML='<span class="leg-dot" style="background:'+l.c+'"></span><span class="leg-txt">'+l.t+'</span>';c.appendChild(d);}
}
function setInfo(id,arr){
  var c=$(id);if(!c)return;clearNode(c);
  for(var i=0;i<arr.length;i++){var it=arr[i];var d=document.createElement('div');d.className='info-row';d.innerHTML='<span class="info-k">'+it.k+'</span><span class="info-v">'+it.v+'</span>';c.appendChild(d);}
}

/* ==================== HELPER FUNCTIONS ==================== */
function nodeBox(g,x,y,w,h,title,sub,col){
  col=col||C.purple;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:8,fill:C.bg3,stroke:col,'stroke-width':1.5});
  txt(g,x+w/2,y+h/2+(sub?4:5),title,{fs:13,fw:'bold',fill:C.text,ta:'middle'});
  if(sub)txt(g,x+w/2,y+h/2+22,sub,{fs:10,fill:col,ta:'middle'});
}
function chip(g,x,y,w,label,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:20,rx:10,fill:'rgba(0,0,0,0.3)',stroke:col,'stroke-width':1});
  txt(g,x+w/2,y+14,label,{fs:10,fill:col,ta:'middle',fw:'bold'});
}
function pbar(g,x,y,w,h,val,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:h/2,fill:C.bg4,stroke:C.border,'stroke-width':1});
  E(g,'rect',{x:x,y:y,width:Math.max(w*val/100,h),height:h,rx:h/2,fill:col});
}
function rbox(g,x,y,w,h,col,label,val){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:8,fill:C.bg3,stroke:col,'stroke-width':1.5});
  txt(g,x+w/2,y+28,val,{fs:24,fw:'bold',fill:col,ta:'middle',ff:C.mono});
  txt(g,x+w/2,y+50,label,{fs:11,fill:C.text2,ta:'middle'});
}
function drawChip(g,x,y,w,h,label,col){
  col=col||C.teal;
  E(g,'rect',{x:x,y:y,width:w,height:h,rx:6,fill:'rgba(0,0,0,0.3)',stroke:col,'stroke-width':1});
  txt(g,x+w/2,y+h/2+4,label,{fs:10,fill:col,ta:'middle',fw:'bold'});
}

/* ==================== MODULES DATA ==================== */
var MODULES=[
  {n:'01',t:'Colibri概览',d:'极小的纯C推理引擎,零依赖,让GLM-5.2(744B参数MoE模型)在约25GB RAM的消费级机器上运行。核心创新:磁盘流式加载专家。',v:['引擎全景','核心指标','设计哲学'],meta:[{k:'项目',v:'JustVugg/colibri'},{k:'星标',v:'14.7K+ stars'},{k:'突破',v:'744B消费级推理'}]},
  {n:'02',t:'纯C零依赖',d:'整个引擎用纯C语言实现,零外部依赖,无需BLAS/CUDA/Python。单文件编译,极致极简主义工程哲学。',v:['极简架构','代码规模','性能基准'],meta:[{k:'语言',v:'Pure C'},{k:'依赖',v:'零'},{k:'编译',v:'单文件'}]},
  {n:'03',t:'磁盘流式MoE',d:'核心创新:按需从磁盘读取MoE专家层,而非全部加载到内存。仅激活的专家被加载,实现744B模型在25GB内存运行。',v:['流式加载原理','专家缓存','内存管理'],meta:[{k:'创新',v:'磁盘流式加载'},{k:'机制',v:'按需读取专家'},{k:'效果',v:'744B/25GB'}]},
  {n:'04',t:'GLM-5.2 744B',d:'GLM-5.2是744B参数的MoE模型,激活参数约12B。Colibri通过磁盘流式加载让消费级硬件运行此超大模型。',v:['模型规模','MoE架构','专家分布'],meta:[{k:'模型',v:'GLM-5.2'},{k:'总参数',v:'744B'},{k:'激活参数',v:'~12B'}]},
  {n:'05',t:'25GB内存突破',d:'传统方式运行744B需1.5TB+内存。Colibri通过磁盘流式加载将内存需求降至约25GB,实现60倍压缩。',v:['内存对比','加载策略','吞吐量'],meta:[{k:'传统需求',v:'1.5TB+'},{k:'Colibri',v:'~25GB'},{k:'压缩比',v:'60x'}]},

/* ==================== MODULE SYSTEM ==================== */
function setView(mi,vi){
  mViews[mi]=vi;
  drawModule(mi);
}

function buildTabs(mi){
  var tc=$('mpTabs');
  clearNode(tc);
  var views=MODULES[mi].v;
  for(var i=0;i<views.length;i++){
    var btn=document.createElement('button');
    btn.className='mp-tab'+(i===mViews[mi]?' active':'');
    btn.textContent=views[i];
    btn.onclick=(function(mi,i){return function(){setView(mi,i);};})(mi,i);
    tc.appendChild(btn);
  }
}

function buildNav(){
  var nav=$('modNav');
  clearNode(nav);
  for(var i=0;i<MODULES.length;i++){
    var btn=document.createElement('button');
    btn.className='nav-btn'+(i===mCur?' active':'');
    var n=document.createElement('span');
    n.className='nav-n';
    n.textContent=MODULES[i].n;
    var t=document.createElement('span');
    t.className='nav-t';
    t.textContent=MODULES[i].t;
    btn.appendChild(n);
    btn.appendChild(t);
    btn.onclick=(function(i){return function(){
      mCur=i;
      buildNav();
      drawModule(i);
    };})(i);
    nav.appendChild(btn);
  }
}

function drawModule(mi){
  for(var i=0;i<8;i++){
    var ly=mLayers['m'+(i+1)];
    if(ly)ly.style.display=(i===mi)?'':'none';
    var sd=$('side-m'+(i+1));
    if(sd)sd.style.display=(i===mi)?'':'none';
  }
  $('heroNum').textContent=MODULES[mi].n;
  $('heroTitle').textContent=MODULES[mi].t;
  $('heroDesc').textContent=MODULES[mi].d;
  var meta=$('heroMeta');
  clearNode(meta);
  var mi_items=MODULES[mi].meta||[];
  for(var j=0;j<mi_items.length;j++){
    var div=document.createElement('div');
    div.className='hm-item';
    div.innerHTML='<span class="hm-k">'+mi_items[j].k+'</span><span class="hm-v">'+mi_items[j].v+'</span>';
    meta.appendChild(div);
  }
  buildTabs(mi);
  var fn=window['m'+(mi+1)+'Draw'];
  if(fn)fn();
}

/* ==================== INIT ==================== */
function init(){
  var svg=$('svg');
  for(var i=1;i<=8;i++){
    var g=E(svg,'g',{id:'g-m'+i});
    if(i>1)g.style.display='none';
    mLayers['m'+i]=g;
  }
  var side=$('mpSide');
  for(var i=1;i<=8;i++){
    var d=document.createElement('div');
    d.className='side-set';
    d.id='side-m'+i;
    if(i>1)d.style.display='none';
    d.innerHTML='<div class="sb"><div class="sb-t">关键指标</div><div class="pills" id="m'+i+'-stat"></div></div>'
      +'<div class="sb"><div class="sb-t">图例</div><div class="legend" id="m'+i+'-leg"></div></div>'
      +'<div class="sb"><div class="sb-t">说明</div><div class="info" id="m'+i+'-info"></div></div>';
    side.appendChild(d);
  }
  buildNav();
  drawModule(0);
}

window.addEventListener('DOMContentLoaded',init);
