.btn.active{border-color:var(--ac);background:rgba(124,92,255,.12);color:var(--ac);}
.btn .idx{color:var(--dim);font-size:9px;margin-right:4px;}
.btn.active .idx{color:var(--ac);}

<script>
var BD='#1a1d27',DIM='#4a5568',AC='#7c5cff',INFO='#2dd4ff',WARN='#fbbf24',ERR='#ef4444',PUR='#a78bfa',ROSE='#f472b6';
var FG='#e5e7eb',BG2='#11141c',BG3='#0d1018',OK='#22c55e';
function el(t,a,p){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
var svg=document.getElementById('svg'),logEl=document.getElementById('log'),tabsEl=document.getElementById('tabs'),ctrlEl=document.getElementById('controls');
var curM=0,curV=0;
var MODS=[
 {id:'M1',name:'SSM全景与演进',views:['演进时间线','HiPPO记忆','S4核心','Mamba创新']},
 {id:'M2',name:'Mamba选择性机制',views:['选择性扫描','保留与遗忘','选择性对比','状态演化']},
 {id:'M3',name:'S4结构化状态空间',views:['连续参数化','HiPPO矩阵','对角化','S4D复数域']},
 {id:'M4',name:'RWKV线性注意力',views:['Time-Mixing','Channel-Mixing','注意力对比','RWKV优势']},
 {id:'M5',name:'Transformer vs SSM',views:['复杂度对比','注意力vs扫描','并行训练','长序列效率']},
 {id:'M6',name:'长序列建模能力',views:['性能对比','内存占用','外推能力','吞吐量']},
 {id:'M7',name:'硬件感知实现',views:['内存层次','并行扫描','SRAM融合','Kernel对比']},
 {id:'M8',name:'应用场景与未来',views:['语言建模','基因组分析','时序预测','视觉SSM']}
];
function logMsg(msg,cls){
  var d=document.createElement('div');d.className='log-line';
  var tm=new Date().toLocaleTimeString('en-US',{hour12:false});
  var s=document.createElement('span');s.className='t';s.textContent='['+tm+'] ';d.appendChild(s);
  if(cls){var s2=document.createElement('span');s2.className=cls;s2.textContent=msg;d.appendChild(s2);}
  else{d.appendChild(document.createTextNode(msg));}
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
}
function box(x,y,w,h,o){o=o||{};el('rect',{x:x,y:y,width:w,height:h,rx:o.r||5,ry:o.r||5,fill:o.fill||BG2,stroke:o.stroke||BD,'stroke-width':o.sw||1.5},svg);if(o.dash)el('rect',{x:x,y:y,width:w,height:h,rx:o.r||5,ry:o.r||5,fill:'none',stroke:o.stroke||BD,'stroke-width':o.sw||1.5,'stroke-dasharray':o.dash},svg);if(o.label){var t=el('text',{x:x+w/2,y:y+h/2,fill:o.fc||FG,'font-size':o.fs||12,'text-anchor':'middle','dominant-baseline':'middle','font-weight':o.fw||'normal'},svg);t.textContent=o.label;}}
function line(x1,y1,x2,y2,c,w,d){var a={'x1':x1,'y1':y1,'x2':x2,'y2':y2,'stroke':c||DIM,'stroke-width':w||1.5};if(d)a['stroke-dasharray']=d;el('line',a,svg);}
function arrow(x1,y1,x2,y2,c,w){c=c||DIM;w=w||1.5;var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<1)return;var ux=dx/len,uy=dy/len;el('line',{x1:x1,y1:y1,x2:x2-ux*7,y2:y2-uy*7,stroke:c,'stroke-width':w},svg);var ang=Math.atan2(dy,dx),s=7;el('polygon',{points:x2+','+y2+' '+(x2-Math.cos(ang-0.4)*s)+','+(y2-Math.sin(ang-0.4)*s)+' '+(x2-Math.cos(ang+0.4)*s)+','+(y2-Math.sin(ang+0.4)*s),fill:c},svg);}
function darrow(x1,y1,x2,y2,c,w){c=c||DIM;w=w||1.5;var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<1)return;el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:c,'stroke-width':w,'stroke-dasharray':'4,3'},svg);var ang=Math.atan2(dy,dx),s=7;el('polygon',{points:x2+','+y2+' '+(x2-Math.cos(ang-0.4)*s)+','+(y2-Math.sin(ang-0.4)*s)+' '+(x2-Math.cos(ang+0.4)*s)+','+(y2-Math.sin(ang+0.4)*s),fill:c},svg);}
function txt(x,y,s,o){o=o||{};var t=el('text',{x:x,y:y,fill:o.fill||FG,'font-size':o.fs||12,'text-anchor':o.ta||'start','dominant-baseline':o.db||'middle','font-weight':o.fw||'normal'},svg);t.textContent=s;}
function ttl(x,y,s,c){var t=el('text',{x:x,y:y,fill:c||AC,'font-size':15,'font-weight':'bold'},svg);t.textContent=s;}
function sub(x,y,s,c){var t=el('text',{x:x,y:y,fill:c||DIM,'font-size':11},svg);t.textContent=s;}
function circ(cx,cy,r,fill,stroke,sw){el('circle',{cx:cx,cy:cy,r:r,fill:fill||'none',stroke:stroke||BD,'stroke-width':sw||1.5},svg);}
function gridbg(){for(var x=0;x<=920;x+=40)el('line',{x1:x,y1:0,x2:x,y2:460,stroke:'#0d0f16','stroke-width':0.5},svg);for(var y=0;y<=460;y+=40)el('line',{x1:0,y1:y,x2:920,y2:y,stroke:'#0d0f16','stroke-width':0.5},svg);}
function panel(x,y,w,h,title){el('rect',{x:x,y:y,width:w,height:h,rx:6,fill:BG3,stroke:BD,'stroke-width':1},svg);if(title){var t=el('text',{x:x+12,y:y+20,fill:INFO,'font-size':11,'font-weight':'bold'},svg);t.textContent=title;}}
function metric(x,y,label,val,color){var t1=el('text',{x:x,y:y,fill:DIM,'font-size':11},svg);t1.textContent=label;var t2=el('text',{x:x+150,y:y,fill:color||FG,'font-size':11,'text-anchor':'end','font-weight':'bold'},svg);t2.textContent=val;}
function bars(x,y,w,h,data,unit){var mv=1;for(var i=0;i<data.length;i++)if(data[i].v>mv)mv=data[i].v;var n=data.length,bw=w/n*0.6,gp=w/n*0.4;for(var g=0;g<=4;g++){var gy=y+h-g*h/4;line(x,gy,x+w,gy,'#15182a',0.5);var gt=el('text',{x:x-6,y:gy,fill:DIM,'font-size':9,'text-anchor':'end','dominant-baseline':'middle'},svg);gt.textContent=Math.round(g*mv/4)+(unit||'');}line(x,y+h,x+w,y+h,DIM,1.5);for(var i=0;i<data.length;i++){var bh=data[i].v/mv*h*0.9;var bx=x+i*(bw+gp)+gp/2;el('rect',{x:bx,y:y+h-bh,width:bw,height:bh,fill:data[i].c||AC,opacity:0.78,rx:2},svg);var t=el('text',{x:bx+bw/2,y:y+h-bh-8,fill:data[i].c||AC,'font-size':11,'text-anchor':'middle','font-weight':'bold'},svg);t.textContent=data[i].v;var t2=el('text',{x:bx+bw/2,y:y+h+16,fill:'#9ca3af','font-size':10,'text-anchor':'middle'},svg);t2.textContent=data[i].l;}}
function heatCell(x,y,w,h,v,cmax){var f=v/cmax;if(f<0)f=0;if(f>1)f=1;var r=Math.round(30+f*180),g=Math.round(40+f*120),b=Math.round(90+f*200);el('rect',{x:x,y:y,width:w,height:h,fill:'rgb('+r+','+g+','+b+')',stroke:BD,'stroke-width':0.4},svg);}
// 交互滑块（绘制于SVG，点击轨道调节）
function slider(x,y,w,label,min,max,val,onChange){
  var lbl=el('text',{x:x,y:y-10,fill:DIM,'font-size':10},svg);lbl.textContent=label;
  el('rect',{x:x,y:y,width:w,height:6,rx:3,fill:'#1a1d27'},svg);
  var frac=(val-min)/(max-min);if(frac<0)frac=0;if(frac>1)frac=1;
  el('rect',{x:x,y:y,width:w*frac,height:6,rx:3,fill:AC},svg);
  var knobX=x+w*frac;
  el('circle',{cx:knobX,cy:y+3,r:7,fill:AC,stroke:'#fff','stroke-width':1.5},svg);
  var vt=el('text',{x:x+w+10,y:y+7,fill:AC,'font-size':11,'font-weight':'bold'},svg);vt.textContent=val;
  var hit=el('rect',{x:x-6,y:y-10,width:w+12,height:24,fill:'transparent',cursor:'pointer'},svg);
  hit.onmousedown=function(ev){
    function mv(e){
      var rect=svg.getBoundingClientRect();var scale=920/rect.width;
      var px=(e.clientX-rect.left)*scale;var f2=(px-x)/w;if(f2<0)f2=0;if(f2>1)f2=1;
      onChange(Math.round(min+f2*(max-min)));
    }
    mv(ev);
    function mm(e){mv(e);}
    function up(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',up);
  };
}
// 模块交互状态
var M1Sel=0,M2Step=6,M3Hippo='LegS',M5N=512;
function redraw(){viewFns[curM](curV);}

// ===== M1: SSM全景与演进 =====
var M1NODES=[
 {x:90,y:200,t:'2020',n:'HiPPO',c:INFO,d:'HiPPO框架首次将连续函数记忆压缩为正交多项式(Legendre)，提出HiPPO矩阵，让循环网络拥有理论上的长程记忆能力，奠定SSM的数学基础。'},
 {x:240,y:200,t:'2021',n:'S4',c:AC,d:'S4（Structured State Space sequence model）通过对状态矩阵A对角化，将O(N²)递推降为O(N)，并利用FFT把递推转为卷积实现并行训练，在Long Range Arena长程任务上达到SOTA。'},
 {x:390,y:200,t:'2023',n:'Mamba',c:PUR,d:'Mamba（S6）引入输入相关的选择性机制：B、C、Δ随输入动态变化，使模型能按内容决定保留/遗忘；配合硬件感知扫描在GPU上高效实现，性能比肩Transformer且推理为线性时间。'},
 {x:540,y:200,t:'2023',n:'RWKV',c:ROSE,d:'RWKV结合RNN的推理效率与Transformer的可并行训练，通过time-mixing/channel-mixing的线性注意力，推理恒定内存、训练可并行，开源生态活跃。'},
 {x:690,y:200,t:'2024',n:'Mamba-2',c:WARN,d:'Mamba-2提出状态空间对偶性(SSD)，揭示SSM与注意力机制的数学对偶，统一两类架构；状态维度大幅提升(N→64k)，速度比Mamba-1快2-8倍。'}
];
function m1Draw(){M1Sel=0;m1View(0);}
function m1Select(i){M1Sel=i;redraw();}
function m1View(m){
  clear(svg);gridbg();
  if(m===0){
    ttl(30,30,'M1-1 SSM演进时间线',AC);
    sub(30,48,'HiPPO → S4 → Mamba → RWKV → Mamba-2 · 点击节点查看详情',DIM);
    line(70,200,720,200,DIM,2);
    arrow(710,200,740,200,AC,2);
    for(var i=0;i<M1NODES.length;i++){
      var nd=M1NODES[i];
      var sel=(i===M1Sel);
      el('rect',{x:nd.x-55,y:nd.y-95,width:110,height:38,rx:6,fill:sel?nd.c:BG3,stroke:nd.c,'stroke-width':sel?2:1,cursor:'pointer'},svg);
      var nt=el('text',{x:nd.x,y:nd.y-76,fill:sel?'#0a0c12':nd.c,'font-size':13,'text-anchor':'middle','font-weight':'bold'},svg);nt.textContent=nd.n;
      var tt=el('text',{x:nd.x,y:nd.y-62,fill:sel?'#0a0c12':DIM,'font-size':10,'text-anchor':'middle'},svg);tt.textContent=nd.t;
      arrow(nd.x,nd.y-57,nd.x,nd.y-20,nd.c,1.5);
      el('circle',{cx:nd.x,cy:nd.y,r:sel?14:10,fill:sel?nd.c:BG2,stroke:nd.c,'stroke-width':2,cursor:'pointer'},svg);
      var hit=el('rect',{x:nd.x-55,y:nd.y-95,width:110,height:115,fill:'transparent',cursor:'pointer'},svg);
      hit.onclick=(function(idx){return function(){m1Select(idx);};})(i);
    }
    var sel=M1NODES[M1Sel];
    panel(40,300,840,110,'节点详情：'+sel.n+' ('+sel.t+')');
    var dt=el('text',{x:55,y:330,fill:FG,'font-size':12},svg);
    var desc=sel.d;
    var lines=[];var tmp='';var max=60;
    for(var w=0;w<desc.length;w++){tmp+=desc[w];if(tmp.length>=max&&desc[w]==='。'){lines.push(tmp);tmp='';}}
    if(tmp)lines.push(tmp);
    for(var li=0;li<lines.length;li++){var lt=el('text',{x:55,y:330+li*20,fill:FG,'font-size':12},svg);lt.textContent=lines[li];}
    panel(40,420,840,30,'');
    txt(55,438,'关键脉络：连续记忆理论(HiPPO) → 结构化高效计算(S4) → 输入自适应选择(Mamba) → 架构统一(Mamba-2)',{fill:AC,fs:10});
    logMsg('[M1-1] SSM演进时间线','k');
    logMsg('  HiPPO(2020)建立记忆压缩理论 → S4(2021)结构化对角化+FFT卷积。','i');
    logMsg('  Mamba(2023)选择性机制+硬件感知扫描，线性时间推理。','ok');
    logMsg('  Mamba-2(2024)状态空间对偶性SSD，统一SSM与注意力。','p');
  }else if(m===1){
    ttl(30,30,'M1-2 HiPPO记忆压缩理论',AC);
    sub(30,48,'Legendre正交多项式基 · 连续函数在线记忆 · HiPPO矩阵A',DIM);
    ttl(45,90,'连续状态方程',INFO);
    txt(55,115,"h'(t) = A·h(t) + B·x(t)",{fill:FG,fs:13});
    txt(55,135,'目标：用有限维状态 h(t) 近似记忆历史输入 x(s), s∈[0,t]',{fill:DIM,fs:10});
    ttl(45,170,'HiPPO-LegS 矩阵 A (N=8 截断)',INFO);
    var N=8,cs=26,cx0=55,cy0=185;
    for(var i=0;i<N;i++)for(var j=0;j<N;j++){
      var v=0;
      if(i>j)v=-Math.sqrt(2*j+1)*Math.sqrt(2*i+1);
      else if(i===j)v=-(i+1);
      var norm=Math.abs(v)/8;
      heatCell(cx0+j*cs,cy0+i*cs,cs-2,cs-2,norm,1);
      var ct=el('text',{x:cx0+j*cs+cs/2,y:cy0+i*cs+cs/2,fill:Math.abs(v)>3?'#fff':'#cbd5e1','font-size':7,'text-anchor':'middle','dominant-baseline':'middle'},svg);ct.textContent=v.toFixed(1);
    }
    txt(cx0+N*cs/2,cy0+N*cs+18,'下三角结构 · 负值保证稳定性',{fill:DIM,fs:9,ta:'middle'});
    panel(330,170,260,150,'HiPPO变体');
    var vars=[['LegS','尺度平移不变，全域记忆'],['LegT','滑动窗，最近N单位'],['LMU','拉格朗日记忆单元'],['Lagt','拉盖尔多项式基'],['FouT','傅里叶基，频域记忆']];
    for(var i=0;i<vars.length;i++){txt(345,195+i*24,vars[i][0],{fill:AC,fs:10,fw:'bold'});txt(410,195+i*24,vars[i][1],{fill:DIM,fs:9});}
    panel(610,170,270,150,'核心性质');
    var props=[['长程记忆','指数衰减可控，支持千步依赖'],['正交基','Legendre基保证数值稳定'],['可解析','A矩阵闭式解，无需学习'],['理论保证','L²误差有界，记忆精度可证']];
    for(var i=0;i<props.length;i++){txt(625,195+i*24,props[i][0],{fill:INFO,fs:10,fw:'bold'});txt(710,195+i*24,props[i][1],{fill:DIM,fs:9});}
    panel(40,340,840,110,'HiPPO的意义');
    txt(55,365,'1. 为SSM提供了“如何让RNN记住长历史”的理论框架，是S4/Mamba的直接前驱。',{fill:FG,fs:11});
    txt(55,388,'2. HiPPO矩阵A作为S4初始化的关键，使模型天然具备长程衰减结构。',{fill:FG,fs:11});
    txt(55,411,'3. 证明用正交多项式投影可在线维护函数记忆，误差随N多项式衰减。',{fill:FG,fs:11});
    txt(55,434,'局限：固定参数(非选择性)，无法根据内容动态调整记忆策略。',{fill:WARN,fs:11});
    logMsg('[M1-2] HiPPO记忆压缩','k');
    logMsg('  HiPPO用Legendre正交基在线压缩连续函数历史，构建下三角稳定矩阵A。','i');
    logMsg('  是S4/Mamba的初始化基石，提供长程记忆理论保证。','ok');
  }else if(m===2){
    ttl(30,30,'M1-3 S4结构化状态空间核心',AC);
    sub(30,48,'连续参数(A,B,C,D) → 离散化(Ā,B̄) → 递推 / 卷积双视图',DIM);
    ttl(45,85,'连续 SSM',INFO);
    txt(55,108,"h'(t)=A·h(t)+B·x(t)     y(t)=C·h(t)+D·x(t)",{fill:FG,fs:12});

// ===== Tab/Control building & init =====
var viewFns=[m1View,m2View,m3View,m4View,m5View,m6View,m7View,m8View];
var drawFns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];
function buildTabs(){
  clear(tabsEl);
  for(var i=0;i<MODS.length;i++){
    var d=document.createElement('div');
    d.className='tab'+(i===curM?' active':'');
    var s1=document.createElement('span');
    s1.style.color=i===curM?AC:DIM;
    s1.textContent=MODS[i].id+' ';
    d.appendChild(s1);
    var s2=document.createElement('span');
    s2.textContent=MODS[i].name;
    d.appendChild(s2);
    d.onclick=(function(idx){return function(){switchModule(idx);};})(i);
    tabsEl.appendChild(d);
  }
}
function buildControls(){
  clear(ctrlEl);
  var t=document.createElement('div');t.className='ctrl-title';t.textContent='视图切换';ctrlEl.appendChild(t);
  for(var i=0;i<MODS[curM].views.length;i++){
    var b=document.createElement('div');
    b.className='btn'+(i===curV?' active':'');
    var s1=document.createElement('span');s1.className='idx';s1.textContent='V'+(i+1);b.appendChild(s1);
    var s2=document.createElement('span');s2.textContent=MODS[curM].views[i];b.appendChild(s2);
    b.onclick=(function(idx){return function(){switchView(idx);};})(i);
    ctrlEl.appendChild(b);
  }
  var sp=document.createElement('div');sp.style.flex='1';ctrlEl.appendChild(sp);
  var info=document.createElement('div');info.className='ctrl-title';info.textContent='当前模块';ctrlEl.appendChild(info);
  var cur=document.createElement('div');cur.style.color=AC;cur.style.fontSize='13px';cur.style.fontWeight='bold';cur.textContent=MODS[curM].id+' '+MODS[curM].name;ctrlEl.appendChild(cur);
  var sub2=document.createElement('div');sub2.style.color=DIM;sub2.style.fontSize='10px';sub2.style.marginTop='4px';sub2.textContent='视图 '+(curV+1)+'/'+MODS[curM].views.length+': '+MODS[curM].views[curV];ctrlEl.appendChild(sub2);
  var tip=document.createElement('div');tip.className='ctrl-title';tip.style.marginTop='8px';tip.textContent='交互提示';ctrlEl.appendChild(tip);
  var tip2=document.createElement('div');tip2.style.color=DIM;tip2.style.fontSize='10px';tip2.style.lineHeight='1.5';
  var tips=['M1点击时间线节点','M2拖动序列滑块','M3切换HiPPO变体','M5拖动序列长度滑块'];
  tip2.textContent=tips[curM]||'点击上方视图切换';
  ctrlEl.appendChild(tip2);
}
function switchModule(i){
  curM=i;curV=0;
  buildTabs();buildControls();
  clear(logEl);
  logMsg('===== '+MODS[i].id+' '+MODS[i].name+' =====','k');
  drawFns[i]();
}
function switchView(i){
  curV=i;
  buildControls();
  viewFns[curM](i);
}
buildTabs();buildControls();
logMsg('状态空间模型与Mamba架构可视化实验室 v3.07 启动','k');
logMsg('共8个模块 · 32个视图 · 覆盖SSM理论到工程实现','i');
logMsg('===== M1 SSM全景与演进 =====','k');
m1Draw();
