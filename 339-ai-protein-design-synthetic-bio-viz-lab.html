<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW · AI蛋白质设计与合成生物学可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f; --bg-2:#0f1117; --bg-3:#161922; --bg-4:#1c2030;
  --border:#1e2433; --border-2:#2a3144;
  --text:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
  --teal:#00d4aa; --teal-dim:rgba(0,212,170,.16); --teal-soft:rgba(0,212,170,.08); --teal-glow:rgba(0,212,170,.35);
  --cyan:#22d3ee; --amber:#fbbf24; --red:#ef4444; --purple:#a78bfa; --blue:#3b82f6; --pink:#f472b6; --green:#34d399;
  --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.app-header{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;height:54px;padding:0 20px}
.hub-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);padding:6px 12px;border:1px solid var(--border);border-radius:6px;transition:.2s;white-space:nowrap}
.hub-link:hover{color:var(--teal);border-color:var(--teal)}
.header-title{font-size:14px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-title .sep{color:var(--text-3);margin:0 8px}
.header-title .ac{color:var(--teal)}
.header-badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:3px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.module-nav{position:sticky;top:54px;z-index:40;background:rgba(10,11,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px}
.nav-btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 13px;cursor:pointer;transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav-btn .nidx{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.nav-btn:hover{color:var(--text);background:var(--bg-3)}
.nav-btn.active{color:var(--teal);background:var(--teal-soft);border-color:var(--teal-dim);font-weight:600}
.nav-btn.active .nidx{color:var(--teal)}
.lab-main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.lab-hero{margin-bottom:24px}
.lab-hero .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:3px 9px;border-radius:4px;margin-bottom:14px;text-transform:uppercase}
.lab-hero h1{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.22;margin-bottom:10px}
.lab-hero h1 .grad{background:linear-gradient(120deg,var(--teal),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lab-hero p{color:var(--text-2);font-size:14px;max-width:780px;line-height:1.65}
.module-panel{display:none}
.module-panel.active{display:block;animation:mFade .4s ease}
@keyframes mFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.m-head .num{font-family:var(--mono);font-size:12px;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:2px 8px;border-radius:4px}
.m-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.m-head .sub{font-size:12px;color:var(--text-3);font-family:var(--mono)}
.m-desc{color:var(--text-2);font-size:13px;margin-bottom:16px;max-width:820px;line-height:1.6}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text);background:var(--bg-3);border:1px solid var(--border-2);border-radius:7px;padding:8px 15px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.active{background:var(--teal-soft);border-color:var(--teal-dim);color:var(--teal);font-weight:600}
.btn.ghost{background:transparent}
.viz-wrap{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;overflow:hidden;position:relative}
.viz-wrap svg{display:block;width:100%;height:auto}
.status-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat-pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg-3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px}
.stat-pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat-pill .label{color:var(--text-3);font-size:11px}
.stat-pill .val{color:var(--text);font-weight:600;font-family:var(--mono)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.info-card{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:15px;transition:.2s}
.info-card:hover{border-color:var(--teal-dim)}
.info-card .k{font-family:var(--mono);font-size:10.5px;color:var(--teal);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.info-card .k .ic{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.info-card .v{font-size:13.5px;color:var(--text);font-weight:600;margin-bottom:4px}
.info-card .d{font-size:12px;color:var(--text-3);line-height:1.55}
.legend-row{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text-2);margin-top:10px;font-family:var(--mono)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{fill:var(--text);font-family:var(--sans)}
svg .lbl{font-size:11px;fill:var(--text-2)}
svg .dim{fill:var(--text-3)}
svg .mono{font-family:var(--mono)}
svg .ax-t{font-size:10px;fill:var(--text-3);font-family:var(--mono)}
svg .ttl{font-size:13px;font-weight:600;fill:var(--text)}
svg .sub{font-size:10.5px;fill:var(--text-3)}
svg .flow-rect{transition:.25s}
svg .flow-rect:hover{stroke-width:2.2}
.apulse{animation:apulse 1.6s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}
.aglow{animation:aglow 2s ease-in-out infinite}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 1px var(--teal))}50%{filter:drop-shadow(0 0 7px var(--teal))}}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.2s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aslide{animation:aslide .5s ease}
@keyframes aslide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.aspin{transform-origin:center;animation:aspin 8s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
@media (max-width:760px){
  .header-title{font-size:12px}
  .lab-hero h1{font-size:21px}
  .nav-btn{font-size:11px;padding:6px 9px}
  .nav-btn .nidx{display:none}
  .module-nav{top:54px}
  .info-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <a href="index.html" class="hub-link">&#8592; TW Hub</a>
    <span class="header-title">TW<span class="sep">/</span><span class="ac">AI蛋白质设计与合成生物学可视化实验室</span></span>
    <span class="header-badge">VIZ LAB / 339</span>
  </div>
</header>
<nav class="module-nav"><div class="nav-inner" id="nav-inner"></div></nav>
<main class="lab-main">
  <div class="lab-hero">
    <span class="tag">PROTEIN DESIGN / SYNTHETIC BIO</span>
    <h1>AI <span class="grad">蛋白质设计</span> 与合成生物学可视化实验室</h1>
    <p>从AlphaFold结构预测突破到从头设计全新蛋白质，从蛋白质语言模型ESM到合成生物学DBTL闭环，系统呈现AI如何重塑生命分子工程——8大模块、24个视图，覆盖结构预测、序列生成、酶工程、自动化实验、产业化应用与未来生物设计。</p>
  </div>
  <div id="module-stage"></div>
</main>
<script>
window.addEventListener('error',function(e){if(e.error){console.warn('VizLab:',e.message);e.preventDefault();}},true);

/* ===== SVG 工具函数 ===== */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ===== 颜色常量 ===== */
var C_TEAL='#00d4aa', C_CYAN='#22d3ee', C_AMBER='#fbbf24', C_RED='#ef4444';
var C_PURPLE='#a78bfa', C_BLUE='#3b82f6', C_PINK='#f472b6', C_GREEN='#34d399';
var C_BD='#1e293b', C_BD2='#334155', C_DIM='#64748b', C_T2='#94a3b8', C_T3='#64748b';
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== 动画管理 ===== */
var animTimer = null;
function stopAnim(){ if(animTimer){ clearInterval(animTimer); animTimer=null; } }
function startAnim(fn, ms){ stopAnim(); animTimer = setInterval(fn, ms||700); }

/* ===== 通用辅助 ===== */
function addDefs(svg, pfx){
  var defs = el('defs', {}, svg);
  var f = el('filter', {id:pfx+'-glow', x:'-60%', y:'-60%', width:'220%', height:'220%'}, defs);
  el('feGaussianBlur', {stdDeviation:'3', result:'b'}, f);
  var mg = el('feMerge', {}, f);
  el('feMergeNode', {in:'b'}, mg);
  el('feMergeNode', {in:'SourceGraphic'}, mg);
  var g1 = el('linearGradient', {id:pfx+'-tg', x1:'0', y1:'0', x2:'1', y2:'1'}, defs);
  el('stop', {offset:'0%', 'stop-color':'#00d4aa', 'stop-opacity':'0.05'}, g1);
  el('stop', {offset:'100%', 'stop-color':'#00d4aa', 'stop-opacity':'0.28'}, g1);
  var g2 = el('linearGradient', {id:pfx+'-rg', x1:'0', y1:'0', x2:'0', y2:'1'}, defs);
  el('stop', {offset:'0%', 'stop-color':'#ef4444', 'stop-opacity':'0.06'}, g2);
  el('stop', {offset:'100%', 'stop-color':'#ef4444', 'stop-opacity':'0.22'}, g2);
  var g3 = el('linearGradient', {id:pfx+'-pg', x1:'0', y1:'0', x2:'1', y2:'0'}, defs);
  el('stop', {offset:'0%', 'stop-color':'#a78bfa', 'stop-opacity':'0.05'}, g3);
  el('stop', {offset:'100%', 'stop-color':'#a78bfa', 'stop-opacity':'0.25'}, g3);
  return defs;
}
function gridBg(svg, w, h, step){
  step = step || 40;
  for(var x=0; x<=w; x+=step){
    el('line', {x1:x, y1:0, x2:x, y2:h, stroke:'#12151e', 'stroke-width':0.5}, svg);
  }
  for(var y=0; y<=h; y+=step){
    el('line', {x1:0, y1:y, x2:w, y2:y, stroke:'#12151e', 'stroke-width':0.5}, svg);
  }
}
function box(svg, x, y, w, h, label, opts){
  opts = opts || {};
  var fill = opts.fill || '#161922';
  var stroke = opts.stroke || C_BD2;
  var sw = opts.sw || 1.2;
  var r = el('rect', {x:x, y:y, width:w, height:h, fill:fill, stroke:stroke, 'stroke-width':sw, rx:opts.rx||8, class:opts.cls||'flow-rect'}, svg);
  if(opts.filter) r.setAttribute('filter', opts.filter);
  if(label){
    tspanEl(x+w/2, y+h/2+4, label, svg, {'text-anchor':'middle', 'font-size':opts.fs||12, 'font-weight':opts.fw||600, fill:opts.tfill||'#e2e8f0'});
  }
  return r;
}
function arrow(svg, x1, y1, x2, y2, color, opts){
  opts = opts || {};
  el('line', {x1:x1, y1:y1, x2:x2, y2:y2, stroke:color, 'stroke-width':opts.sw||1.8, 'marker-end':'url(#'+opts.mk+')', class:opts.cls||'', 'stroke-dasharray':opts.dash||'none'}, svg);
}
function mkMarker(svg, id, color){
  var defs = svg.querySelector('defs') || el('defs', {}, svg);
  var m = el('marker', {id:id, markerWidth:'8', markerHeight:'8', refX:'6', refY:'4', orient:'auto'}, defs);
  el('path', {d:'M0,0 L8,4 L0,8 Z', fill:color}, m);
}

/* ===== 模块状态 ===== */
var mRoots = {}, mLayers = {}, mStatus = {}, mDrawn = {};
var currentModule = 0;

/* ===== M1: 蛋白质设计全景 ===== */
function m1Draw(){
  var c = document.getElementById('m1-canvas'); clearNode(c);
  var svg = el('svg', {viewBox:'0 0 900 480', preserveAspectRatio:'xMidYMid meet'}, c);
  addDefs(svg, 'm1'); mkMarker(svg, 'm1-ar', C_TEAL); mkMarker(svg, 'm1-ar2', C_AMBER); mkMarker(svg, 'm1-ar3', C_PURPLE);
  mRoots.m1 = svg;
  mLayers.m1 = el('g', {}, svg);
  m1View(0);
}
function m1View(v){
  stopAnim();
  var g = mLayers.m1; clearNode(g);
  gridBg(mRoots.m1, 900, 480);
  setStatText(mStatus.m1, '视图 ' + (v+1) + '/3');
  var btns = document.querySelectorAll('[data-m1v]');
  for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', parseInt(btns[i].dataset.m1v)===v); }

  if(v===0){
    tspanEl(450, 34, '蛋白质设计发展历程', g, {'text-anchor':'middle', class:'ttl'});
    el('line', {x1:60, y1:100, x2:840, y2:100, stroke:C_BD2, 'stroke-width':2}, g);
    var nodes = [
      {x:90, y:100, t:'1950s', label:'X射线晶体学', desc:'解析肌红蛋白结构', c:C_T3},
      {x:240, y:100, t:'1990s', label:'同源建模', desc:'基于模板结构预测', c:C_DIM},
      {x:390, y:100, t:'2008', label:'Rosetta', desc:'物理能量函数设计', c:C_BLUE},
      {x:540, y:100, t:'2018', label:'AlphaFold', desc:'深度学习预测', c:C_TEAL},
      {x:690, y:100, t:'2022', label:'RFdiffusion', desc:'扩散模型从头设计', c:C_PURPLE},
      {x:840, y:100, t:'2024+', label:'ESM3', desc:'多模态生成模型', c:C_PINK}
    ];
    for(var i=0;i<nodes.length;i++){
      var N = nodes[i];
      el('circle', {cx:N.x, cy:N.y, r:8, fill:N.c+'30', stroke:N.c, 'stroke-width':1.8}, g);
      el('circle', {cx:N.x, cy:N.y, r:3, fill:N.c, class:'apulse'}, g);
      tspanEl(N.x, N.y-20, N.t, g, {'text-anchor':'middle', fill:N.c, 'font-size':11, 'font-weight':700, class:'mono'});
      el('rect', {x:N.x-58, y:N.y+18, width:116, height:46, fill:'#0f1117', stroke:N.c+'60', 'stroke-width':1, rx:6}, g);
      tspanEl(N.x, N.y+36, N.label, g, {'text-anchor':'middle', fill:N.c, 'font-size':11, 'font-weight':600});
      tspanEl(N.x, N.y+52, N.desc, g, {'text-anchor':'middle', fill:C_T3, 'font-size':9.5});
    }
    tspanEl(450, 200, '三大范式跃迁', g, {'text-anchor':'middle', class:'sub'});
    var eras = [
      {x:90, y:230, w:220, h:200, title:'实验解析时代', items:['X射线晶体学','核磁共振NMR','冷冻电镜Cryo-EM'], c:C_BLUE},
      {x:340, y:230, w:220, h:200, title:'计算预测时代', items:['同源建模HM','穿线法Threading','AlphaFold1/2','RoseTTAFold'], c:C_TEAL},
      {x:590, y:230, w:220, h:200, title:'AI生成时代', items:['ProteinMPNN','RFdiffusion','ESM系列','Chroma'], c:C_PURPLE}
    ];
    for(var i=0;i<eras.length;i++){
      var E = eras[i];
      el('rect', {x:E.x, y:E.y, width:E.w, height:E.h, fill:E.c+'10', stroke:E.c, 'stroke-width':1.5, rx:12}, g);
      tspanEl(E.x+E.w/2, E.y+28, E.title, g, {'text-anchor':'middle', fill:E.c, 'font-size':13, 'font-weight':700});
      for(var j=0;j<E.items.length;j++){
        el('rect', {x:E.x+20, y:E.y+50+j*34, width:E.w-40, height:26, fill:'#0f1117', stroke:E.c+'40', rx:5}, g);
        tspanEl(E.x+30, E.y+50+j*34+17, E.items[j], g, {fill:C_T2, 'font-size':11, class:'mono'});
      }
    }
  } else if(v===1){
    tspanEl(450, 34, '蛋白质设计技术范式对比', g, {'text-anchor':'middle', class:'ttl'});
    var paradigms = [
      {x:50, y:70, w:250, h:360, title:'模板依赖设计', c:C_BLUE, items:['同源建模','穿线法','需要已知结构','精度依赖模板','速度中等']},
      {x:325, y:70, w:250, h:360, title:'深度学习预测', c:C_TEAL, items:['AlphaFold2','RoseTTAFold','端到端预测','不需模板','高精度结构']},
      {x:600, y:70, w:250, h:360, title:'生成式从头设计', c:C_PURPLE, items:['RFdiffusion','ProteinMPNN','Chroma','扩散/流匹配','全新序列+结构']}
    ];
    for(var i=0;i<paradigms.length;i++){
      var P = paradigms[i];
      el('rect', {x:P.x, y:P.y, width:P.w, height:P.h, fill:P.c+'10', stroke:P.c, 'stroke-width':1.5, rx:14, class:'flow-rect'}, g);
      el('rect', {x:P.x, y:P.y, width:P.w, height:44, fill:P.c+'25', stroke:P.c, 'stroke-width':1.5, rx:14}, g);
      el('rect', {x:P.x, y:P.y+24, width:P.w, height:20, fill:P.c+'25'}, g);
      tspanEl(P.x+P.w/2, P.y+30, P.title, g, {'text-anchor':'middle', fill:P.c, 'font-size':14, 'font-weight':700});
      for(var j=0;j<P.items.length;j++){
        el('circle', {cx:P.x+24, cy:P.y+72+j*36, r:4, fill:P.c}, g);
        tspanEl(P.x+36, P.y+72+j*36+4, P.items[j], g, {fill:C_T2, 'font-size':11.5});
      }
      var score = [65, 92, 88];
      el('rect', {x:P.x+20, y:P.y+300, width:P.w-40, height:8, fill:'#0f1117', rx:4}, g);
      el('rect', {x:P.x+20, y:P.y+300, width:(P.w-40)*score[i]/100, height:8, fill:P.c, rx:4, class:'aglow'}, g);
      tspanEl(P.x+P.w/2, P.y+326, '设计精度 ' + score[i] + '%', g, {'text-anchor':'middle', fill:P.c, 'font-size':11, class:'mono'});
    }
    el('path', {d:'M300,250 L325,250', stroke:C_TEAL, 'stroke-width':2.5, 'marker-end':'url(#m1-ar)'}, g);
    el('path', {d:'M575,250 L600,250', stroke:C_PURPLE, 'stroke-width':2.5, 'marker-end':'url(#m1-ar3)'}, g);
  } else {
    tspanEl(450, 34, '蛋白质设计应用版图', g, {'text-anchor':'middle', class:'ttl'});
    var apps = [

/* ===== 构建模块面板 ===== */
function buildPanels(){
  var stage = document.getElementById('module-stage');
  for(var i=0;i<MODULES.length;i++){
    var M = MODULES[i];
    var sec = document.createElement('section');
    sec.className = 'module-panel' + (i===0?' active':'');
    sec.id = 'panel-'+M.id;
    var head = '<div class="m-head"><span class="num">'+M.num+'</span><h2>'+M.name+'</h2><span class="sub">PROTEIN-DESIGN / SYNTH-BIO</span></div>';
    head += '<p class="m-desc">'+M.desc+'</p>';
    var ctrl = '<div class="ctrl-row" id="ctrl-'+M.id+'">';
    for(var j=0;j<M.views.length;j++){
      ctrl += '<button class="btn'+(j===0?' active':'')+'" data-'+M.id+'v="'+j+'" onclick="'+M.id+'View('+j+')">'+M.views[j]+'</button>';
    }
    ctrl += '</div>';
    var status = '<div class="status-bar"><span class="stat-pill"><span class="dot" style="background:'+C_TEAL+'"></span><span class="label">状态</span><span class="val" id="status-'+M.id+'">就绪</span></span></div>';
    var viz = '<div class="viz-wrap"><div id="'+M.id+'-canvas"></div></div>';
    var info = buildInfoCards(M.id);
    sec.innerHTML = head + ctrl + status + viz + info;
    stage.appendChild(sec);
    mStatus[M.id] = sec.querySelector('#status-'+M.id);
  }
}

/* ===== 切换模块 ===== */
function switchModule(index){
  stopAnim();
  var panels = document.querySelectorAll('.module-panel');
  for(var i=0;i<panels.length;i++){ panels[i].classList.remove('active'); }
  var navBtns = document.querySelectorAll('.nav-btn');
  for(var i=0;i<navBtns.length;i++){ navBtns[i].classList.toggle('active', i===index); }
  panels[index].classList.add('active');
  currentModule = index;
  var M = MODULES[index];
  setStatText(mStatus[M.id], '加载中...');
  if(!mDrawn[M.id]){ mDrawn[M.id] = true; M.draw(); }
  else { M.view(0); }
}

/* ===== 构建导航 (IIFE) ===== */
(function buildNav(){
  var nav = document.getElementById('nav-inner');
  for(var i=0;i<MODULES.length;i++){
    var M = MODULES[i];
    var btn = document.createElement('button');
    btn.className = 'nav-btn' + (i===0?' active':'');
    btn.innerHTML = '<span class="nidx">'+M.num+'</span>'+M.short;
    (function(idx){ btn.addEventListener('click', function(){ switchModule(idx); }); })(i);
    nav.appendChild(btn);
  }
})();
