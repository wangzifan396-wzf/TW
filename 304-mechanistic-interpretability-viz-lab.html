<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c12;color:#c8cdd9;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:linear-gradient(90deg,#0e1119,#151926);border-bottom:1px solid #232838}
.nav-left{display:flex;align-items:center;gap:14px}
.back-link{color:#7c5cff;font-size:12px;padding:6px 12px;border:1px solid #7c5cff;border-radius:5px;transition:.2s;font-weight:500}
.back-link:hover{background:#7c5cff;color:#fff}
.title{font-size:16px;font-weight:650;color:#e2e6ef;letter-spacing:.3px}
.subtitle{color:#4a5568;font-size:11px;margin-top:1px}
.nav-tag{font-family:Consolas,monospace;font-size:11px;color:#4a5568}
.tabbar{display:flex;gap:3px;padding:8px 14px;background:#0b0e16;border-bottom:1px solid #232838;overflow-x:auto}
.tab{padding:8px 13px;cursor:pointer;border-radius:5px;color:#4a5568;font-size:12px;white-space:nowrap;border:1px solid transparent;transition:.18s;font-family:inherit}
.tab:hover{color:#c8cdd9;background:#141822}
.tab.active{color:#2dd4ff;background:#141822;border-color:#232838;font-weight:600}
.tab .tn{color:#2a3142;margin-right:5px;font-family:Consolas,monospace}
.tab.active .tn{color:#7c5cff}
.main{display:flex;gap:10px;padding:12px;max-width:1340px;margin:0 auto;align-items:flex-start}
.canvas-wrap{flex:1;min-width:0}
.canvas-box{background:#0c0f17;border:1px solid #232838;border-radius:8px;padding:8px}
.canvas-title{color:#7c5cff;font-size:12px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:10px;padding:2px 4px}
.canvas-title .ml{color:#4a5568;font-size:10px;font-weight:400;font-family:Consolas,monospace}
.canvas-title .dot{width:7px;height:7px;border-radius:50%;background:#2dd4ff;box-shadow:0 0 6px #2dd4ff}
svg{display:block;width:100%;height:auto}
.controls{width:226px;flex-shrink:0}
.ctrl-title{color:#fbbf24;font-size:11px;font-weight:600;padding:7px 10px;background:#11141d;border:1px solid #232838;border-bottom:none;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center}
.ctrl-title .sub{color:#4a5568;font-size:9px;font-family:Consolas,monospace}
.ctrl-group{background:#0c0f17;border:1px solid #232838;border-radius:0 0 6px 6px;overflow:hidden}
.btn{display:block;width:100%;text-align:left;padding:10px 12px;background:transparent;border:none;color:#8890a0;font-size:12px;cursor:pointer;border-bottom:1px solid #151926;transition:.15s;font-family:inherit;display:flex;align-items:center;gap:8px}
.btn:last-child{border-bottom:none}
.btn:hover{background:#141822;color:#c8cdd9}
.btn.active{background:rgba(124,92,255,.14);color:#c9bdff}
.btn .ic{width:7px;height:7px;border-radius:2px;background:#2a3142;flex-shrink:0}
.btn.active .ic{background:#7c5cff;box-shadow:0 0 5px #7c5cff}
.btn .nm{font-family:Consolas,monospace;font-size:10px;color:#4a5568;min-width:20px}
.btn.active .nm{color:#7c5cff}
.btn .vt{color:#4a5568;font-size:9px;margin-left:auto;font-family:Consolas,monospace}
.btn.active .vt{color:#7c5cff}
.log-wrap{max-width:1340px;margin:0 auto;padding:0 12px 14px}
.log-head{display:flex;justify-content:space-between;align-items:center;padding:5px 4px}
.log-head .lt{color:#6b7280;font-size:10px;font-family:Consolas,monospace}
.log-head .clr{color:#4a5568;font-size:10px;cursor:pointer;background:none;border:1px solid #232838;border-radius:4px;padding:2px 8px;font-family:Consolas,monospace}
.log-head .clr:hover{color:#ef4444;border-color:#ef4444}
.log-box{background:#06070d;border:1px solid #232838;border-radius:6px;height:132px;overflow:auto;padding:9px 13px;font-family:Consolas,'Courier New',monospace;font-size:11px;line-height:1.65;color:#6b7280}
.log-box::-webkit-scrollbar{width:7px;height:7px}
.log-box::-webkit-scrollbar-thumb{background:#232838;border-radius:4px}
.log-line{white-space:pre-wrap;word-break:break-all}
.log-line .ts{color:#3a4252}
.log-line .tag{color:#7c5cff;font-weight:600}
.log-line .info{color:#2dd4ff}
.log-line .warn{color:#fbbf24}
.log-line .err{color:#ef4444}
.log-line .ok{color:#34d399}
.log-line .ro{color:#f472b6}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:5px 4px 0}
.legend span{font-size:10px;color:#6b7280;display:flex;align-items:center;gap:4px;font-family:Consolas,monospace}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
@media(max-width:880px){.main{flex-direction:column}.controls{width:100%}}
</style>

<body>
<div class="navbar">
  <div class="nav-left">
    <a class="back-link" href="index.html">&#8592; 返回 TW Hub</a>
    <div>
      <div class="title">机制可解释性可视化实验室</div>
      <div class="subtitle">Mechanistic Interpretability Visualization Lab</div>
    </div>
  </div>
  <div class="nav-tag">304 / Mechanistic-Interpretability</div>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="main">
  <div class="canvas-wrap">
    <div class="canvas-box">
      <div class="canvas-title">
        <span class="dot"></span>
        <span id="modTitle">M1 可解释性全景</span>
        <span class="ml" id="viewLabel">v1 / 黑箱问题</span>
        <span class="ml" style="margin-left:auto">viewBox 920x460</span>
      </div>
      <svg id="canvas" viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div class="controls">
    <div class="ctrl-title"><span>控制面板 / Controls</span><span class="sub" id="ctrlSub">M1</span></div>
    <div class="ctrl-group" id="ctrlPanel"></div>
  </div>
</div>
<div class="log-wrap">
  <div class="log-head"><span class="lt">运行日志 / runtime log</span><button class="clr" id="clrBtn">清空</button></div>
  <div class="log-box" id="logBox"></div>
</div>
<script>
var BD='#1a1d27',DIM='#4a5568',AC='#7c5cff',INFO='#2dd4ff',WARN='#fbbf24',ERR='#ef4444',PUR='#a78bfa',ROSE='#f472b6';
var SVGNS='http://www.w3.org/2000/svg';
var svg=document.getElementById('canvas');
function el(t,a,p){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function hexRGB(h){h=h.replace('#','');return parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16);}
function rgba(c,a){return 'rgba('+hexRGB(c)+','+a+')';}
function txt(x,y,s,c,fs,g,an,w){var o={'x':x,'y':y,fill:c||'#c8cdd9','font-size':fs||11};if(an)o['text-anchor']=an;if(w)o['font-weight']=w;return el('text',o,g).textContent=s;}
function box(x,y,w,h,fill,stroke,sw,g,r){var o={'x':x,'y':y,width:w,height:h,rx:r||6,fill:fill||'#141822',stroke:stroke||DIM,'stroke-width':sw||1};return el('rect',o,g);}
function ln(x1,y1,x2,y2,c,sw,g,m){var o={'x1':x1,'y1':y1,'x2':x2,'y2':y2,stroke:c||DIM,'stroke-width':sw||1.2,fill:'none'};if(m)o['marker-end']=m;return el('line',o,g);}
function pth(d,c,sw,g,dash){var o={d:d,stroke:c||DIM,'stroke-width':sw||1.2,fill:'none'};if(dash)o['stroke-dasharray']=dash;return el('path',o,g);}
function node(x,y,w,h,label,c,g,fs){box(x,y,w,h,rgba(c||AC,.08),c||AC,1.4,g);txt(x+w/2,y+h/2+4,label,'#dde1ea',fs||11,g,'middle',600);}
function setupDefs(defs){
  var colors={ar:AC,arI:INFO,arW:WARN,arE:ERR,arP:PUR,arR:ROSE,arD:DIM};
  for(var name in colors){var m=el('marker',{id:name,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',fill:colors[name]},m);}
  var gl=el('linearGradient',{id:'glow1',x1:0,y1:0,x2:1,y2:1},defs);
  el('stop',{offset:'0%','stop-color':AC,'stop-opacity':.9},gl);el('stop',{offset:'100%','stop-color':INFO,'stop-opacity':.7},gl);
  var f=el('filter',{id:'glow',x:'-50%','y':'-50%',width:'200%',height:'200%'},defs);
  el('feGaussianBlur',{stdDeviation:2.4,result:'b'},f);var mg=el('merge',{},f);el('mergeNode',{in:'b'},mg);el('mergeNode',{in:'SourceGraphic'},mg);
  return defs;
}
var defs=el('defs',{},svg);setupDefs(defs);
var root=el('g',{id:'root'},svg);
function drawBg(g){
  el('rect',{x:0,y:0,width:920,height:460,fill:'#0a0c12'},g);
  for(var i=0;i<=920;i+=40)el('line',{x1:i,y1:0,x2:i,y2:460,stroke:'#0f1320','stroke-width':1},g);
  for(var j=0;j<=460;j+=40)el('line',{x1:0,y1:j,x2:920,y2:j,stroke:'#0f1320','stroke-width':1},g);
}
var gridFade=el('linearGradient',{id:'gridfade',x1:0,y1:0,x2:0,y2:1},defs);
el('stop',{offset:'0%','stop-color':'#0a0c12','stop-opacity':.5},gridFade);
el('stop',{offset:'100%','stop-color':'#0a0c12','stop-opacity':.9},gridFade);

// ===== log =====
function log(msg,type){
  var box=document.getElementById('logBox');
  var line=document.createElement('div');line.className='log-line';
  var ts=document.createElement('span');ts.className='ts';
  var d=new Date();ts.textContent='['+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+'] ';
  var tp=type||'log';var tag=document.createElement('span');
  var cls=tp==='info'?'info':tp==='warn'?'warn':tp==='err'?'err':tp==='ok'?'ok':tp==='ro'?'ro':'tag';
  tag.className=cls;tag.textContent='['+tp.toUpperCase()+'] ';
  var tx=document.createElement('span');tx.textContent=msg;
  line.appendChild(ts);line.appendChild(tag);line.appendChild(tx);
  box.appendChild(line);box.scrollTop=box.scrollHeight;
}
function logClear(){document.getElementById('logBox').innerHTML='';}

// ===== modules meta =====
var MODULES=[
  {id:'M1',name:'可解释性全景',views:['黑箱问题','事后解释','内在解释','对比方法']},
  {id:'M2',name:'神经回路分析',views:['注意力头','MLP层','残差流','电路追踪']},
  {id:'M3',name:'逆向工程模型',views:['特征检测','电路发现','因果干预','验证']},
  {id:'M4',name:'Superposition',views:['稀疏特征','几何结构','解缠','验证']},
  {id:'M5',name:'诱导头机制',views:['诱导头','模式匹配','上下文学习','对比实验']},
  {id:'M6',name:'探测与干预',views:['线性探测','激活修补','因果追踪','对比']},
  {id:'M7',name:'欺骗与对齐',views:['欺骗行为','回路定位','修正','安全']},
  {id:'M8',name:'工具与方法',views:['TransformerLens','Circuits','可视化','对比']}
];
var curMod=0,curView=0;
function buildTabs(){
  var tb=document.getElementById('tabbar');clear(tb);
  MODULES.forEach(function(m,i){
    var b=document.createElement('button');b.className='tab'+(i===curMod?' active':'');
    var s=document.createElement('span');s.className='tn';s.textContent=m.id;
    b.appendChild(s);b.appendChild(document.createTextNode(m.name));
    b.onclick=function(){selectModule(i);};
    tb.appendChild(b);
  });
}
function buildCtrl(){
  var cp=document.getElementById('ctrlPanel');clear(cp);
  document.getElementById('ctrlSub').textContent=MODULES[curMod].id;
  MODULES[curMod].views.forEach(function(v,i){
    var b=document.createElement('button');b.className='btn'+(i===curView?' active':'');
    var ic=document.createElement('span');ic.className='ic';b.appendChild(ic);
    var nm=document.createElement('span');nm.className='nm';nm.textContent='v'+(i+1);b.appendChild(nm);
    b.appendChild(document.createTextNode(v));
    var vt=document.createElement('span');vt.className='vt';vt.textContent='0'+(i+1);b.appendChild(vt);
    b.onclick=function(){selectView(i);};
    cp.appendChild(b);
  });
}
function updateLabel(){
  document.getElementById('modTitle').textContent=MODULES[curMod].id+' '+MODULES[curMod].name;
  document.getElementById('viewLabel').textContent='v'+(curView+1)+' / '+MODULES[curMod].views[curView];
}
var DRAW=[m1View,m2View,m3View,m4View,m5View,m6View,m7View,m8View];
function render(){clear(root);drawBg(root);DRAW[curMod](root,curView);updateLabel();}
function selectModule(i){curMod=i;curView=0;buildTabs();buildCtrl();render();}
function selectView(j){curView=j;buildCtrl();render();}
function setLegend(items){var lg=document.getElementById('legend');clear(lg);items.forEach(function(it){var s=document.createElement('span');var i=document.createElement('i');i.style.background=it.c;s.appendChild(i);s.appendChild(document.createTextNode(it.t));lg.appendChild(s);});}
document.getElementById('clrBtn').onclick=logClear;

// ============================================================
// M1 可解释性全景
// ============================================================
function m1View(g,mode){if(mode===0)m1v0(g);else if(mode===1)m1v1(g);else if(mode===2)m1v2(g);else m1v3(g);}
function m1v0(g){
  txt(28,30,'M1·v1 黑箱问题：输入输出可观测，内部机制不可知',AC,13,g,undefined,600);
  var toks=['The','cat','sat','on','the',''];
  var bx=120;
  toks.forEach(function(t,i){box(bx+i*52,86,46,30,rgba(INFO,.07),INFO,1,g);if(t)txt(bx+i*52+23,106,t,INFO,11,g,'middle',500);});
  txt(bx+3*52+23,72,'输入序列 tokens',DIM,9,g,'middle');
  // black box
  box(380,150,300,170,'#0d1018','#3a4252',1.5,g,14);
  el('pattern',{id:'bbpat',width:14,height:14,patternUnits:'userSpaceOnUse'},defs);
  for(var i=0;i<8;i++){el('circle',{cx:380+Math.random()*300,cy:150+Math.random()*170,r:1.5,fill:rgba(PUR,.25)},g);}
  txt(530,210,'?',DIM,72,g,'middle',700);
  txt(530,255,'神经网络',DIM,12,g,'middle');
  txt(530,275,Math.pow(10,11)+' 级参数',DIM,9,g,'middle');
  txt(530,300,'内部计算不透明',ERR,10,g,'middle');
  // output
  box(760,86,120,30,rgba(AC,.08),AC,1.2,g);txt(820,106,'mat',AC,13,g,'middle',600);
  txt(820,72,'输出预测',DIM,9,g,'middle');
  txt(820,128,'P=0.82',WARN,9,g,'middle');
  // arrows
  ln(432,101,378,170,INFO,1.4,g,'arI');
  ln(682,235,758,101,AC,1.4,g,'ar');
  // question marks floating
  ['?','?','?','?'].forEach(function(q,i){txt(405+i*70,140+i*8,q,rgba(PUR,.4),16,g);});
  // bottom note
  box(28,360,864,80,rgba(DIM,.1),DIM,1,g,8);
  txt(44,384,'核心矛盾',WARN,11,g,undefined,600);
  txt(44,404,'我们只知道“它做了什么”，却不知道“它为什么这么做”。黑箱模型在输入与输出之间存在一条不可见的计算链路，',DIM,11,g);
  txt(44,421,'而机制可解释性的目标，正是把这条黑箱拆开，逆向还原内部每一层、每一个头、每一组参数到底在“算什么”。',DIM,11,g);
  setLegend([{c:INFO,t:'输入'},{c:'#3a4252',t:'黑箱模型'},{c:AC,t:'输出'},{c:PUR,t:'未知内部'}]);
  logClear();
  log('加载模块 M1 可解释性全景，当前视图 v1 黑箱问题','info');
  log('黑箱问题（Black-Box Problem）：模型作为输入-输出的映射函数可被观测，但其内部表征与计算过程不可直接解读。');
  log('深度网络参数量达到 10^11 级别， billions of weights，人工逐层检查不可行。');
  log('机制可解释性主张：与其拟合行为，不如逆向还原内部机制——找到模型“真正在做的事”。','ok');
}
function m1v1(g){
  txt(28,30,'M1·v2 事后解释：训练后再施加解释方法，不修改模型内部',AC,13,g,undefined,600);
  box(360,150,200,120,rgba(AC,.08),AC,1.4,g,10);
  txt(460,195,'已训练模型',AC,13,g,'middle',600);txt(460,220,'frozen weights',DIM,9,g,'middle');txt(460,245,'不可改动',DIM,9,g,'middle');
  var methods=[{x:60,y:300,t:'梯度归因',c:INFO,d:'Saliency / Grad-CAM',dn:'输入梯度反映贡献'},{x:260,y:300,t:'LIME',c:WARN,d:'局部线性近似',dn:'扰动样本拟合局部'},{x:460,y:300,t:'SHAP',c:PUR,d:'Shapley 加权',dn:'博弈论特征价值'},{x:660,y:300,t:'注意力可视化',c:ROSE,d:'Attention Map',dn:'注意权重热图'}];
  methods.forEach(function(m){
    box(m.x,m.y,180,56,rgba(m.c,.07),m.c,1,g,8);
    txt(m.x+90,m.y+20,m.t,m.c,12,g,'middle',600);
    txt(m.x+90,m.y+37,m.d,DIM,9,g,'middle');
    txt(m.x+90,m.y+50,m.dn,'#6b7280',8,g,'middle');
    ln(m.x+90,m.y,460,272,m.c,1.2,g);
    el('circle',{cx:460,cy:272,r:3,fill:m.c},g);
  });
  // warning
  box(28,380,864,60,rgba(ERR,.08),ERR,1,g,8);
  txt(44,403,'局限',ERR,11,g,undefined,600);txt(90,403,'：',ERR,11,g);
  txt(100,403,'事后解释只能描述“相关性”而非“因果性”，且可能给出与真实机制不符的合理化故事，并非真正的机制还原。',DIM,11,g);
  txt(44,421,'↳ 代表方法：Integrated Gradients、SmoothGrad、LIME、SHAP、Attention Rollout',DIM,10,g);
  setLegend([{c:INFO,t:'梯度类'},{c:WARN,t:'LIME'},{c:PUR,t:'SHAP'},{c:ROSE,t:'注意力'}]);
  logClear();log('切换到 M1 v2 事后解释（Post-hoc Explanation）','info');
  log('事后解释：模型训练完成、参数冻结后，再施加解释方法，不触碰内部权重。');
  log('优势：通用、即插即用，适配任意可微模型；劣势：解释的是“相关”而非“因果”，易被对抗样本误导。','warn');
  log('与机制可解释性对比：事后解释不要求理解内部回路，而机制可解释性追求“逆向工程模型本身”。','ok');
}
function m1v2(g){
  txt(28,30,'M1·v3 内在解释：模型结构本身就可读，无需事后处理',AC,13,g,undefined,600);
  // black box model
  box(40,90,360,200,rgba(ERR,.06),ERR,1.2,g,10);
  txt(220,112,'黑箱模型 / DNN',ERR,12,g,'middle',600);
  var layers=[4,6,6,4];
  layers.forEach(function(n,li){
    for(var ni=0;ni<n;ni++){el('circle',{cx:90+li*70,cy:150+ni*26,r:8,fill:rgba(ERR,.5),stroke:ERR},g);}
  });
  txt(220,300,'参数不透明 · 非线性叠加',DIM,9,g,'middle');
  txt(220,318,'需要事后解释',WARN,9,g,'middle');
  // interpretable models
  // decision tree
  box(430,90,220,95,rgba(AC,.07),AC,1.2,g,8);
  txt(540,110,'决策树 / Decision Tree',AC,11,g,'middle',600);
  el('rect',{x:540,y:120,width:50,height:18,rx:3,fill:rgba(AC,.2),stroke:AC},g);txt(565,133,'x>3?',AC,9,g,'middle');
  el('rect',{x:470,y:150,width:46,height:16,rx:3,fill:rgba(INFO,.2),stroke:INFO},g);txt(493,162,'叶A',INFO,8,g,'middle');
  el('rect',{x:565,y:150,width:46,height:16,rx:3,fill:rgba(INFO,.2),stroke:INFO},g);txt(588,162,'x>7?',INFO,8,g,'middle');
  ln(540,138,493,150,AC,1,g);ln(565,138,588,150,AC,1,g);
  txt(540,178,'每条路径=一条可读规则',DIM,8,g,'middle');
  // linear model
