<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Interview - 技术面试模拟器</title>
<style>
:root {
  --bg: #08090a;
  --surface: #0d0e10;
  --surface-2: #131417;
  --surface-3: #1a1b1f;
  --border: #1f2023;
  --border-2: #2a2b2f;
  --text: #f7f8f8;
  --text-2: #8a8f98;
  --text-3: #56595f;
  --amber: #f59e0b;
  --amber-dim: #b45309;
  --amber-soft: rgba(245, 158, 11, 0.12);
  --green: #4ade80;
  --red: #ef4444;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --font: -apple-system, "SF Pro Display", -apple-system, "Segoe UI", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul { list-style: none; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3b3f; }

/* ===== Layout ===== */
.container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

/* ===== Nav ===== */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8, 9, 10, 0.88);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  display: flex;
  align-items: center;
  height: 56px;
  gap: 24px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.logo-mark {
  width: 26px; height: 26px;
  background: var(--amber);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #08090a;
}
.nav-tabs {
  display: flex;
  gap: 2px;
  flex: 1;
  overflow-x: auto;
}
.nav-tab {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  border-radius: 6px;
  white-space: nowrap;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.nav-tab:hover { color: var(--text); background: var(--surface-2); }
.nav-tab.active { color: var(--amber); background: var(--amber-soft); }
.nav-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

/* ===== Buttons ===== */
.btn {
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-primary { background: var(--amber); color: #08090a; font-weight: 600; }
.btn-primary:hover { background: #fbbf24; }
.btn-ghost { color: var(--text-2); border: 1px solid var(--border-2); }
.btn-ghost:hover { color: var(--text); border-color: #3a3b3f; background: var(--surface-2); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ===== Stats Panel ===== */
.stats-panel {
  padding: 48px 0 32px;
  border-bottom: 1px solid var(--border);
}
.stats-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}
.stats-title h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.stats-title p { color: var(--text-2); font-size: 14px; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.15s;
}
.stat-card:hover { border-color: var(--border-2); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--amber);
  opacity: 0;
  transition: opacity 0.15s;
}
.stat-card:hover::before { opacity: 1; }
.stat-label { font-size: 12px; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.stat-value .unit { font-size: 14px; color: var(--text-2); font-weight: 400; margin-left: 2px; }
.stat-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ===== Section ===== */
.section { padding: 32px 0 80px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}
.section-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.filter-bar { display: flex; gap: 8px; align-items: center; }
.filter-chip {
  padding: 5px 12px;
  font-size: 12px;
  color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.filter-chip:hover { color: var(--text); border-color: var(--border-2); }
.filter-chip.active { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }

/* ===== Question Card ===== */
.q-list { display: flex; flex-direction: column; gap: 14px; }
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.q-card:hover { border-color: var(--border-2); }
.q-card.completed { border-color: var(--amber-dim); }
.q-main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  min-height: 200px;
}
.q-info {
  padding: 24px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}
.q-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.q-id { font-size: 11px; color: var(--text-3); font-family: monospace; }
.diff-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.diff-L1 { background: rgba(74, 222, 128, 0.12); color: var(--green); }
.diff-L2 { background: rgba(245, 158, 11, 0.12); color: var(--amber); }
.diff-L3 { background: rgba(239, 68, 68, 0.12); color: var(--red); }
.q-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px; }
.q-desc { font-size: 13px; color: var(--text-2); flex: 1; }
.q-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.q-tag {
  font-size: 11px;
  color: var(--text-3);
  background: var(--surface-3);
  padding: 3px 8px;
  border-radius: 4px;
}
.q-viz {
  padding: 20px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  overflow: hidden;
}
.q-viz svg { max-width: 100%; height: auto; }
.q-viz-placeholder { color: var(--text-3); font-size: 12px; }
.q-footer {
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.q-toggle {
  font-size: 13px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.15s;
}
.q-toggle:hover { color: var(--amber); }
.q-toggle .chev { transition: transform 0.2s; display: inline-block; }
.q-toggle.open .chev { transform: rotate(90deg); }
.q-actions { display: flex; gap: 8px; align-items: center; }
.q-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  border-top: 1px solid var(--border);
}
.q-answer.open { max-height: 1200px; }
.q-answer-inner { padding: 24px; }
.q-answer-section { margin-bottom: 20px; }
.q-answer-section:last-child { margin-bottom: 0; }
.q-answer-section h4 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--amber);
  margin-bottom: 10px;
  font-weight: 600;
}
.q-answer-section ul { display: flex; flex-direction: column; gap: 6px; }
.q-answer-section li {
  font-size: 13px;
  color: var(--text-2);
  padding-left: 16px;
  position: relative;
}
.q-answer-section li::before {
  content: '';
  position: absolute;
  left: 0; top: 9px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--amber);
}
.mark-btn {
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s;
}
.mark-btn:hover { color: var(--amber); }
.mark-btn.done { color: var(--amber); }
.mark-check {
  width: 14px; height: 14px;
  border: 1.5px solid var(--text-3);
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.mark-btn.done .mark-check { background: var(--amber); border-color: var(--amber); }
.mark-btn.done .mark-check::after { content: '✓'; color: #08090a; font-size: 10px; font-weight: 700; }

/* ===== System Design Interactive ===== */
.sd-steps { display: flex; flex-direction: column; gap: 16px; }
.sd-step {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.sd-step-head {
  padding: 12px 16px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}
.sd-step-num {
  width: 22px; height: 22px;
  background: var(--amber);
  color: #08090a;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sd-strategies {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.sd-strat-btn {
  font-size: 12px;
  padding: 5px 12px;
  border: 1px solid var(--border-2);
  border-radius: 16px;
  color: var(--text-2);
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.sd-strat-btn:hover { color: var(--text); border-color: #3a3b3f; }
.sd-strat-btn.active { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.sd-strat-content { padding: 16px; }
.sd-strat-desc { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
.sd-strat-viz { display: flex; justify-content: center; }
.sd-strat-viz svg { max-width: 100%; height: auto; }

/* ===== Simulation Mode ===== */
.sim-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 9, 10, 0.92);
  z-index: 200;
  display: none;
  overflow-y: auto;
}
.sim-overlay.active { display: block; }
.sim-container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
.sim-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.sim-progress-text { font-size: 13px; color: var(--text-2); }
.sim-timer {
  font-size: 20px;
  font-weight: 700;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
}
.sim-timer.warn { color: var(--red); }
.sim-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px;
  margin-bottom: 20px;
}
.sim-card-meta { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.sim-card h3 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 12px; }
.sim-card .q-desc { margin-bottom: 20px; font-size: 14px; }
.sim-viz-box {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: center;
  min-height: 160px;
  align-items: center;
}
.sim-viz-box svg { max-width: 100%; height: auto; }
.sim-score-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.sim-score-label { font-size: 13px; color: var(--text-2); margin-right: 8px; }
.sim-score-btn {
  width: 40px; height: 32px;
  border: 1px solid var(--border-2);
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-2);
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.sim-score-btn:hover { border-color: var(--amber); color: var(--text); }
.sim-score-btn.active { background: var(--amber); color: #08090a; border-color: var(--amber); font-weight: 600; }
.sim-note {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
}
.sim-note:focus { outline: none; border-color: var(--amber); }
.sim-actions { display: flex; justify-content: space-between; align-items: center; }

/* ===== Sim Report ===== */
.sim-report { text-align: center; }
.sim-report h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
.sim-report-score {
  font-size: 72px;
  font-weight: 800;
  letter-spacing: -0.04em;
  margin: 24px 0 8px;
}
.sim-report-score .unit { font-size: 28px; color: var(--text-2); }
.sim-report-grade { font-size: 16px; color: var(--amber); margin-bottom: 32px; }
.sim-report-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
.sim-report-stat {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.sim-report-stat .label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.sim-report-stat .value { font-size: 22px; font-weight: 700; }
.sim-report-detail { text-align: left; margin-bottom: 24px; }
.sim-report-detail h3 { font-size: 14px; color: var(--text-2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.sim-report-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--surface-2);
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 13px;
}
.sim-report-item .score { font-weight: 700; color: var(--amber); }

/* ===== Sim Setup ===== */
.sim-setup { text-align: center; padding: 40px 0; }
.sim-setup h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
.sim-setup p { color: var(--text-2); font-size: 14px; margin-bottom: 32px; }
.sim-setup-options { display: flex; flex-direction: column; gap: 16px; max-width: 400px; margin: 0 auto 32px; }
.sim-setup-field { text-align: left; }
.sim-setup-field label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.sim-cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sim-cat-btn {
  padding: 12px;
  border: 1px solid var(--border-2);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-2);
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.sim-cat-btn:hover { color: var(--text); border-color: #3a3b3f; }
.sim-cat-btn.active { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.sim-count-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sim-count-btn {
  padding: 10px;
  border: 1px solid var(--border-2);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
}
.sim-count-btn:hover { color: var(--text); border-color: #3a3b3f; }
.sim-count-btn.active { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.sim-time-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
}
.sim-time-input:focus { outline: none; border-color: var(--amber); }

/* ===== History ===== */
.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
}
.history-item .h-score { font-weight: 700; font-size: 16px; }
.history-item .h-meta { color: var(--text-3); font-size: 12px; }
.history-empty { text-align: center; padding: 40px; color: var(--text-3); font-size: 14px; }

/* ===== Footer ===== */
.footer {
  border-top: 1px solid var(--border);
  padding: 24px 0;
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
}

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .q-main { grid-template-columns: 1fr; }
  .q-info { border-right: none; border-bottom: 1px solid var(--border); }
  .sim-report-stats { grid-template-columns: 1fr; }
  .stats-title h1 { font-size: 24px; }
}
@media (max-width: 600px) {
  .container { padding: 0 16px; }
  .nav-inner { gap: 12px; height: 52px; }
  .nav-tab { padding: 5px 10px; font-size: 12px; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { padding: 16px; }
  .stat-value { font-size: 24px; }
  .q-info, .q-viz { padding: 16px; }
  .q-footer { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
  .sim-card { padding: 20px; }
  .sim-container { padding: 20px 16px; }
  .sim-cat-grid, .sim-count-grid { grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<!-- ===== Navigation ===== -->
<nav class="nav">
  <div class="container nav-inner">
    <div class="logo">
      <div class="logo-mark">T</div>
      <span>TW Interview</span>
    </div>
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-cat="frontend">前端工程师</button>
      <button class="nav-tab" data-cat="backend">后端工程师</button>
      <button class="nav-tab" data-cat="algorithm">算法工程师</button>
      <button class="nav-tab" data-cat="system">系统设计</button>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost btn-sm" id="historyBtn">历史成绩</button>
      <button class="btn btn-primary btn-sm" id="simStartBtn">模拟面试</button>
    </div>
  </div>
</nav>

<!-- ===== Stats Panel ===== -->
<section class="stats-panel">
  <div class="container">
    <div class="stats-header">
      <div class="stats-title">
        <h1 id="statsTitle">前端工程师 面试题库</h1>
        <p id="statsSubtitle">练习模式 · 自由浏览题目与可视化解析</p>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">总题数</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-sub" id="statTotalSub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已完成</div>
        <div class="stat-value" id="statDone">0</div>
        <div class="stat-sub" id="statDoneSub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平均分</div>
        <div class="stat-value" id="statAvg">—</div>
        <div class="stat-sub" id="statAvgSub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最高分</div>
        <div class="stat-value" id="statMax">—</div>
        <div class="stat-sub" id="statMaxSub"></div>
      </div>
    </div>

  frontend: FRONTEND,
  backend: BACKEND,
  algorithm: ALGORITHM,
  system: SYSTEM

/* ================================================================
   STATE & STORAGE
   ================================================================ */
var state = {
  category: "frontend",
  difficulty: "all",
  simMode: false
};

var STORAGE_PREFIX = "tw-interview-";

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_PREFIX + "progress");
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveProgress(data) {
  try { localStorage.setItem(STORAGE_PREFIX + "progress", JSON.stringify(data)); } catch(e) {}
}
function loadHistory() {
  try {
    var raw = localStorage.getItem(STORAGE_PREFIX + "history");
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveHistory(data) {
  try { localStorage.setItem(STORAGE_PREFIX + "history", JSON.stringify(data)); } catch(e) {}
}
function isCompleted(qid) {
  var p = loadProgress();
  return !!p[qid];
}
function toggleCompleted(qid) {
  var p = loadProgress();
  if (p[qid]) { delete p[qid]; }
  else { p[qid] = Date.now(); }
  saveProgress(p);
}

function getAllQuestions() {
  var arr = [];
  Object.keys(ALL_QUESTIONS).forEach(function(cat) {
    ALL_QUESTIONS[cat].forEach(function(q) { arr.push(q); });
  });
  return arr;
}

function getStats() {
  var all = getAllQuestions();
  var total = all.length;
  var p = loadProgress();
  var done = 0;
  all.forEach(function(q) { if (p[q.id]) done++; });
  var history = loadHistory();
  var avg = "—", max = "—";
  if (history.length > 0) {
    var sum = 0;
    history.forEach(function(h) { sum += h.score; });
    avg = Math.round(sum / history.length);
    max = Math.max.apply(null, history.map(function(h) { return h.score; }));
  }
  return { total: total, done: done, avg: avg, max: max, history: history };
}

/* ================================================================
   RENDER: Stats Panel
   ================================================================ */
function renderStats() {
  var stats = getStats();
  document.getElementById("statTotal").textContent = stats.total;
  document.getElementById("statTotalSub").textContent = "覆盖4个方向";
  document.getElementById("statDone").textContent = stats.done;
  var pct = stats.total > 0 ? Math.round(stats.done / stats.total * 100) : 0;
  document.getElementById("statDoneSub").textContent = "完成率 " + pct + "%";
  document.getElementById("statAvg").innerHTML = stats.avg === "—" ? "—" : stats.avg + '<span class="unit">分</span>';
  document.getElementById("statAvgSub").textContent = stats.history.length + " 次模拟";
  document.getElementById("statMax").innerHTML = stats.max === "—" ? "—" : stats.max + '<span class="unit">分</span>';
  document.getElementById("statMaxSub").textContent = stats.history.length > 0 ? "历史最高" : "暂无记录";
}

/* ================================================================
   RENDER: Question List
   ================================================================ */
function getFilteredQuestions() {
  var qs = ALL_QUESTIONS[state.category] || [];
  if (state.difficulty === "all") return qs;
  return qs.filter(function(q) { return q.diff === state.difficulty; });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderQuestionCard(q) {
  var completed = isCompleted(q.id);
  var diffClass = "diff-" + q.diff;
  var tagsHtml = q.tags.map(function(t) {
    return '<span class="q-tag">' + escapeHtml(t) + '</span>';
  }).join("");
  var vizHtml = "";
  if (q.interactive && q.steps) {
    vizHtml = '<div class="q-viz-placeholder">交互式架构图（展开查看）</div>';
  } else {
    vizHtml = q.svg || '<div class="q-viz-placeholder">可视化区域</div>';
  }
  var answerHtml = "";
  if (q.interactive && q.steps) {
    answerHtml = renderInteractiveSteps(q) + renderAnswerScoring(q);
  } else {
    answerHtml = renderAnswerScoring(q);
  }
  var html = '<div class="q-card' + (completed ? " completed" : "") + '" data-qid="' + q.id + '">' +
    '<div class="q-main">' +
      '<div class="q-info">' +
        '<div class="q-meta">' +
          '<span class="q-id">' + q.id + '</span>' +
          '<span class="diff-badge ' + diffClass + '">' + q.diff + '</span>' +
        '</div>' +
        '<div class="q-title">' + escapeHtml(q.title) + '</div>' +
        '<div class="q-desc">' + escapeHtml(q.desc) + '</div>' +
        '<div class="q-tags">' + tagsHtml + '</div>' +
      '</div>' +
      '<div class="q-viz">' + vizHtml + '</div>' +
    '</div>' +
    '<div class="q-footer">' +
      '<button class="q-toggle" data-action="toggle">' +
        '<span class="chev">&#9654;</span> 查看参考答案' +
      '</button>' +
      '<div class="q-actions">' +
        '<button class="mark-btn' + (completed ? " done" : "") + '" data-action="mark">' +
          '<span class="mark-check"></span> ' + (completed ? "已完成" : "标记完成") +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="q-answer">' +
      '<div class="q-answer-inner">' + answerHtml + '</div>' +
    '</div>' +
  '</div>';
  return html;
}

function renderAnswerScoring(q) {
  var answerItems = q.answer.map(function(a) {
    return "<li>" + escapeHtml(a) + "</li>";
  }).join("");
  var scoringItems = q.scoring.map(function(s) {
    return "<li>" + escapeHtml(s) + "</li>";
  }).join("");
  return '<div class="q-answer-section"><h4>参考答案要点</h4><ul>' + answerItems + '</ul></div>' +
         '<div class="q-answer-section"><h4>评分标准</h4><ul>' + scoringItems + '</ul></div>';
}

function renderInteractiveSteps(q) {
  var stepsHtml = "";
  q.steps.forEach(function(step, si) {
    var stratsBtns = step.strategies.map(function(strat, stri) {
      return '<button class="sd-strat-btn' + (stri === 0 ? " active" : "") + '" data-step="' + si + '" data-strat="' + stri + '">' + escapeHtml(strat.name) + '</button>';
    }).join("");
    var firstStrat = step.strategies[0];
    stepsHtml += '<div class="sd-step">' +
      '<div class="sd-step-head"><span class="sd-step-num">' + (si+1) + '</span>' + escapeHtml(step.name) + '</div>' +
      '<div class="sd-strategies">' + stratsBtns + '</div>' +
      '<div class="sd-strat-content" data-step-content="' + si + '">' +
        '<div class="sd-strat-desc">' + escapeHtml(firstStrat.desc) + '</div>' +
        '<div class="sd-strat-viz">' + firstStrat.svg + '</div>' +
      '</div>' +
    '</div>';
  });
  return '<div class="q-answer-section"><h4>架构设计步骤（可切换策略）</h4><div class="sd-steps">' + stepsHtml + '</div></div>';
}

function renderQuestions() {
  var qs = getFilteredQuestions();
  var list = document.getElementById("qList");
  if (qs.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无符合条件的题目</div>';
    return;
  }
  list.innerHTML = qs.map(renderQuestionCard).join("");
  attachCardEvents();
}

function attachCardEvents() {
  var cards = document.querySelectorAll(".q-card");
  cards.forEach(function(card) {
    var qid = card.getAttribute("data-qid");
    var toggleBtn = card.querySelector('[data-action="toggle"]');
    var answerDiv = card.querySelector(".q-answer");
    var markBtn = card.querySelector('[data-action="mark"]');
    if (toggleBtn) {
      toggleBtn.addEventListener("click", function() {
        var open = answerDiv.classList.toggle("open");
        toggleBtn.classList.toggle("open", open);
        toggleBtn.innerHTML = '<span class="chev">&#9654;</span> ' + (open ? "收起参考答案" : "查看参考答案");
      });
    }
    if (markBtn) {
      markBtn.addEventListener("click", function() {
        toggleCompleted(qid);
        renderStats();
        renderQuestions();
      });
    }
    var stratBtns = card.querySelectorAll(".sd-strat-btn");
    stratBtns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        var si = parseInt(btn.getAttribute("data-step"), 10);
        var stri = parseInt(btn.getAttribute("data-strat"), 10);
        var q = findQuestionById(qid);
        if (!q || !q.steps || !q.steps[si]) return;
        var strat = q.steps[si].strategies[stri];
        var content = card.querySelector('[data-step-content="' + si + '"]');
        if (content) {
          content.innerHTML = '<div class="sd-strat-desc">' + escapeHtml(strat.desc) + '</div>' +
            '<div class="sd-strat-viz">' + strat.svg + '</div>';
        }
        btn.parentNode.querySelectorAll(".sd-strat-btn").forEach(function(b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
      });
    });
  });
}

function findQuestionById(qid) {
  var all = getAllQuestions();
  for (var i = 0; i < all.length; i++) {
    if (all[i].id === qid) return all[i];
  }
  return null;
}

function attachNavEvents() {
  var tabs = document.querySelectorAll(".nav-tab");
  tabs.forEach(function(tab) {
    tab.addEventListener("click", function() {
      var cat = tab.getAttribute("data-cat");
      state.category = cat;
      tabs.forEach(function(t) { t.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById("statsTitle").textContent = CAT_NAMES[cat] + " 面试题库";
      renderQuestions();
    });
  });
  var chips = document.querySelectorAll(".filter-chip");
  chips.forEach(function(chip) {
    chip.addEventListener("click", function() {
      var diff = chip.getAttribute("data-diff");
      state.difficulty = diff;
      chips.forEach(function(c) { c.classList.remove("active"); });
      chip.classList.add("active");
      renderQuestions();
    });
  });
  document.getElementById("simStartBtn").addEventListener("click", openSimSetup);
  document.getElementById("historyBtn").addEventListener("click", openHistory);
}

  });
  document.getElementById("simCancelBtn").addEventListener("click", closeSim);
  document.getElementById("simBeginBtn").addEventListener("click", function() {
    var timeMin = parseInt(document.getElementById("simTimeInput").value, 10) || 5;
    startSimulation(simCat, simCount, timeMin);
  });
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startSimulation(cat, count, timeMin) {
  var pool = ALL_QUESTIONS[cat] || [];
  var picked = shuffle(pool).slice(0, Math.min(count, pool.length));
  simState = {
    cat: cat,
    questions: picked,
    current: 0,
    timeMin: timeMin,
    scores: [],
    notes: [],
    timeLeft: timeMin * 60,
    startTime: Date.now()
  };
  renderSimQuestion();
}

function renderSimQuestion() {
  if (!simState) return;
  var idx = simState.current;
  var q = simState.questions[idx];
  var total = simState.questions.length;
  var container = document.getElementById("simContainer");
  var scoreBtns = "";
  for (var s = 1; s <= 10; s++) {
    scoreBtns += '<button class="sim-score-btn" data-score="' + s + '">' + s + '</button>';
  }
  var vizHtml = q.interactive ? '<div class="q-viz-placeholder">交互式题目，请参考文字描述</div>' : (q.svg || "");
  container.innerHTML =
    '<div class="sim-header">' +
      '<div class="sim-progress-text">第 ' + (idx+1) + ' / ' + total + ' 题 · ' + CAT_NAMES[simState.cat] + '</div>' +
      '<div class="sim-timer" id="simTimer">' + formatTime(simState.timeLeft) + '</div>' +
    '</div>' +
    '<div class="sim-card">' +
      '<div class="sim-card-meta">' +
        '<span class="q-id">' + q.id + '</span>' +
        '<span class="diff-badge diff-' + q.diff + '">' + q.diff + '</span>' +
      '</div>' +
      '<h3>' + escapeHtml(q.title) + '</h3>' +
      '<div class="q-desc">' + escapeHtml(q.desc) + '</div>' +
      (vizHtml ? '<div class="sim-viz-box">' + vizHtml + '</div>' : '') +
      '<div class="sim-score-bar">' +
        '<span class="sim-score-label">自评打分</span>' +
        scoreBtns +
      '</div>' +
      '<textarea class="sim-note" id="simNote" placeholder="在此记录你的答题思路..."></textarea>' +
    '</div>' +
    '<div class="sim-actions">' +
      '<button class="btn btn-ghost" id="simQuitBtn">退出</button>' +
      (idx < total - 1 ?
        '<button class="btn btn-primary" id="simNextBtn">下一题</button>' :
        '<button class="btn btn-primary" id="simFinishBtn">完成面试</button>') +
    '</div>';
  startTimer();
  var selectedScore = 0;
  container.querySelectorAll(".sim-score-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      selectedScore = parseInt(btn.getAttribute("data-score"), 10);
      container.querySelectorAll(".sim-score-btn").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
    });
  });
  document.getElementById("simQuitBtn").addEventListener("click", function() {
    if (confirm("确定退出模拟面试？本次成绩不会保存。")) {
      stopTimer();
      closeSim();
    }
  });
  var nextHandler = function() {
    simState.scores[idx] = selectedScore;
    simState.notes[idx] = document.getElementById("simNote").value;
    stopTimer();
    if (idx < total - 1) {
      simState.current++;
      simState.timeLeft = simState.timeMin * 60;
      renderSimQuestion();
    } else {
      renderSimReport();
    }
  };
  if (idx < total - 1) {
    document.getElementById("simNextBtn").addEventListener("click", nextHandler);
  } else {
    document.getElementById("simFinishBtn").addEventListener("click", nextHandler);
  }
}

function startTimer() {
  stopTimer();
  simTimerId = setInterval(function() {
    if (!simState) return;
    simState.timeLeft--;
    var el = document.getElementById("simTimer");
    if (el) {
      el.textContent = formatTime(simState.timeLeft);
      if (simState.timeLeft <= 30) el.classList.add("warn");
    }
    if (simState.timeLeft <= 0) {
      stopTimer();
      autoAdvance();
    }
  }, 1000);
}

function stopTimer() {
  if (simTimerId) { clearInterval(simTimerId); simTimerId = null; }
}

function autoAdvance() {
  if (!simState) return;
  var idx = simState.current;
  simState.scores[idx] = simState.scores[idx] || 0;
  simState.notes[idx] = simState.notes[idx] || "";
  if (idx < simState.questions.length - 1) {
    simState.current++;
    simState.timeLeft = simState.timeMin * 60;
    renderSimQuestion();
  } else {
    renderSimReport();
  }
}

function formatTime(sec) {
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function renderSimReport() {
  stopTimer();
  if (!simState) return;
  var scores = simState.scores;
  var valid = scores.filter(function(s) { return s > 0; });
  var totalScore = valid.length > 0 ? Math.round(valid.reduce(function(a,b){return a+b;},0) / valid.length * 10) : 0;
  var grade = totalScore >= 90 ? "A 优秀" : totalScore >= 80 ? "B 良好" : totalScore >= 70 ? "C 合格" : totalScore >= 60 ? "D 及格" : "F 不合格";
  var detailHtml = simState.questions.map(function(q, i) {
    var sc = scores[i] || 0;
    return '<div class="sim-report-item">' +
      '<span>' + escapeHtml(q.title) + '</span>' +
      '<span class="score">' + (sc > 0 ? sc + "/10" : "未评") + '</span>' +
    '</div>';
  }).join("");
  var container = document.getElementById("simContainer");
  container.innerHTML =
    '<div class="sim-report">' +
      '<h2>面试报告</h2>' +
      '<p style="color:var(--text-2);font-size:14px;">' + CAT_NAMES[simState.cat] + ' · ' + simState.questions.length + ' 题</p>' +
      '<div class="sim-report-score">' + totalScore + '<span class="unit">/100</span></div>' +
      '<div class="sim-report-grade">' + grade + '</div>' +
      '<div class="sim-report-stats">' +
        '<div class="sim-report-stat"><div class="label">已答题</div><div class="value">' + valid.length + '/' + simState.questions.length + '</div></div>' +
        '<div class="sim-report-stat"><div class="label">平均得分</div><div class="value">' + (valid.length > 0 ? (valid.reduce(function(a,b){return a+b;},0)/valid.length).toFixed(1) : "0") + '</div></div>' +
        '<div class="sim-report-stat"><div class="label">用时</div><div class="value">' + formatTime(Math.round((Date.now()-simState.startTime)/1000)) + '</div></div>' +
      '</div>' +
      '<div class="sim-report-detail">' +
        '<h3>题目详情</h3>' + detailHtml +
      '</div>' +
      '<div style="display:flex;gap:12px;justify-content:center;">' +
        '<button class="btn btn-primary" id="simSaveBtn">保存成绩</button>' +
        '<button class="btn btn-ghost" id="simCloseBtn">关闭</button>' +
      '</div>' +
    '</div>';
  document.getElementById("simCloseBtn").addEventListener("click", closeSim);
  document.getElementById("simSaveBtn").addEventListener("click", function() {
    var history = loadHistory();
    history.push({
      date: Date.now(),
      cat: simState.cat,
      score: totalScore,
      grade: grade,
      count: simState.questions.length,
      details: simState.questions.map(function(q, i) {
        return { id: q.id, title: q.title, score: scores[i] || 0 };
      })
    });
    saveHistory(history);
    simState.questions.forEach(function(q) {
      var p = loadProgress();
      if (!p[q.id]) { p[q.id] = Date.now(); saveProgress(p); }
    });
    renderStats();
    renderQuestions();
    closeSim();
  });
}

function closeSim() {
  stopTimer();
  simState = null;
  document.getElementById("simOverlay").classList.remove("active");
  document.getElementById("simContainer").innerHTML = "";
}

/* ================================================================
   HISTORY
   ================================================================ */
function openHistory() {
  var history = loadHistory();
  var container = document.getElementById("simContainer");
  var html = '<div class="sim-header">' +
    '<div class="sim-progress-text">历史成绩</div>' +
    '<button class="btn btn-ghost btn-sm" id="histCloseBtn">关闭</button>' +
  '</div>';
  if (history.length === 0) {
    html += '<div class="history-empty">暂无模拟面试记录，点击「模拟面试」开始你的第一次练习</div>';
  } else {
    html += '<div class="history-list">';
    history.slice().reverse().forEach(function(h) {
      var d = new Date(h.date);
      var dateStr = d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate() + " " + (d.getHours()<10?"0":"") + d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes();
      html += '<div class="history-item">' +
        '<div>' +
          '<div style="font-weight:600;">' + escapeHtml(CAT_NAMES[h.cat] || h.cat) + ' · ' + h.grade + '</div>' +
          '<div class="h-meta">' + dateStr + ' · ' + h.count + ' 题</div>' +
        '</div>' +
        '<div class="h-score" style="color:' + (h.score >= 80 ? "#4ade80" : h.score >= 60 ? "#f59e0b" : "#ef4444") + ';">' + h.score + '</div>' +
      '</div>';
    });
    html += '</div>';
    html += '<div style="text-align:center;margin-top:24px;"><button class="btn btn-ghost" id="histClearBtn">清空历史</button></div>';
  }
  container.innerHTML = html;
  document.getElementById("simOverlay").classList.add("active");
  document.getElementById("histCloseBtn").addEventListener("click", closeSim);
  var clearBtn = document.getElementById("histClearBtn");
  if (clearBtn) {
    clearBtn.addEventListener("click", function() {
      if (confirm("确定清空所有历史成绩？")) {
        saveHistory([]);
        renderStats();
        closeSim();
      }
    });
  }
}

/* ================================================================
   INIT
   ================================================================ */
function init() {
  renderStats();
  renderQuestions();
  attachNavEvents();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
window.addEventListener('beforeunload',function(){for(var i=1;i<100000;i++){try{clearInterval(i)}catch(e){}}});</script>
