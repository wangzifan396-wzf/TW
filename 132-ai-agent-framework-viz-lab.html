<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Framework Viz Lab — AI Agent 框架可视化实验室</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#22d3ee;--accent2:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;overflow-x:hidden;
}
.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.8);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(34,211,238,.3)}
.logo-mark svg{width:16px;height:16px}
.nav-modules{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 0}
.nav-modules::-webkit-scrollbar{display:none}
.nav-mod{padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text3);white-space:nowrap;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace}
.nav-mod:hover{background:var(--bg3);color:var(--text)}
.nav-mod.active{background:rgba(34,211,238,.12);color:var(--accent)}
.hero{max-width:1200px;margin:0 auto;padding:64px 24px 48px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border2);border-radius:999px;font-size:12px;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;margin-bottom:20px}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:16px}
.hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:var(--text2);max-width:640px}
.hero-stats{display:flex;gap:32px;margin-top:32px}
.hero-stat .num{font-size:24px;font-weight:700;color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace}
.hero-stat .lbl{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.modules{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:flex;flex-direction:column;gap:32px}
.module{scroll-margin-top:80px}
.module-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color .3s}
.module-card:hover{border-color:var(--border2)}
.module-head{padding:28px 32px 0;display:flex;align-items:flex-start;gap:16px}
.module-num{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);padding:4px 8px;border:1px solid rgba(34,211,238,.3);border-radius:6px;background:rgba(34,211,238,.06)}
.module-title{flex:1}
.module-title h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.module-title p{font-size:14px;color:var(--text2);max-width:760px}
.module-body{padding:24px 32px 32px}
.viz-wrap{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:24px;min-height:280px;position:relative;overflow:hidden}
.viz-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{padding:7px 14px;border:1px solid var(--border2);border-radius:8px;background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;transition:.2s;font-family:'SF Mono',Monaco,Consolas,monospace}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:rgba(34,211,238,.15);border-color:var(--accent);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
.slider-row input[type=range]{-webkit-appearance:none;width:160px;height:4px;background:var(--border2);border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(34,211,238,.5)}
.val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:36px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--text3)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px}
.bottom-nav{max-width:1200px;margin:0 auto;padding:24px 24px 64px;display:flex;justify-content:space-between;gap:16px}
.bn-btn{flex:1;padding:16px 20px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:4px}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn.next{text-align:right;align-items:flex-end}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.bn-btn .ttl{font-size:14px;color:var(--text);font-weight:500}
.bn-btn:hover .ttl{color:var(--accent)}
footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--text3);font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace}
svg{display:block}
.node-rect{transition:.25s}
.node-rect:hover{filter:brightness(1.3)}
.flow-line{stroke-dasharray:4 4;animation:flow 1.2s linear 8s}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.thought-bubble{animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#08090a"/><circle cx="12" cy="12" r="9" stroke="#08090a" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="#08090a" stroke-width="2"/></svg></div>
      <span>AI Agent Framework Viz Lab</span>
    </div>
    <nav class="nav-modules" id="navModules"></nav>
  </div>
</header>

<section class="hero">
  <div class="hero-badge"><span class="dot"></span> AI/ML 可视化实验室 · AI Agent 框架</div>
  <h1>AI Agent Framework<br><span class="grad">可视化实验室</span></h1>
  <p>从 ReAct 到 Multi-Agent，探索 LLM Agent 如何感知、记忆、规划与行动。本实验室通过 8 个交互式模块，拆解 Agent 框架的核心机制。</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">8</div><div class="lbl">Modules</div></div>
    <div class="hero-stat"><div class="num">ReAct</div><div class="lbl">Core Pattern</div></div>
    <div class="hero-stat"><div class="num">ToT</div><div class="lbl">Planning</div></div>
  </div>
</section>

<div class="modules" id="modules"></div>

<div class="bottom-nav" id="bottomNav"></div>

<footer>AI Agent Framework Viz Lab · 纯 HTML/CSS/JS + SVG · Linear 暗色美学</footer>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
const MODULES=[
  {id:'m1',num:'01',title:'Agent 架构总览',desc:'Perception → Memory → Planning → Action 循环 — Agent 的核心运转机制。'},
  {id:'m2',num:'02',title:'ReAct 模式',desc:'Reasoning + Acting 交替 — 边思考边行动，让 LLM 学会调用工具。'},
  {id:'m3',num:'03',title:'Tool Use',desc:'工具调用与 API 编排 — Agent 如何选择、调用并组合外部能力。'},
  {id:'m4',num:'04',title:'Memory Systems',desc:'短期/长期/情景记忆 — 让 Agent 跨会话保持上下文与经验。'},
  {id:'m5',num:'05',title:'Planning 算法',desc:'Tree of Thought, MCTS for LLM — 搜索式推理与决策。'},
  {id:'m6',num:'06',title:'Multi-Agent 协作',desc:'角色分工与消息传递 — 多个 Agent 协同完成复杂任务。'},
  {id:'m7',num:'07',title:'Reflection & Self-Correction',desc:'自我反思与纠错 — Agent 从失败中学习并修正策略。'},
  {id:'m8',num:'08',title:'Agent 评估',desc:'任务完成率、工具使用效率 — 如何衡量 Agent 的能力。'}
];

const navEl=document.getElementById('navModules');
MODULES.forEach((m,i)=>{const a=document.createElement('a');a.className='nav-mod';a.href='#'+m.id;a.textContent=(i+1)+'';a.dataset.target=m.id;navEl.appendChild(a);});

const modEl=document.getElementById('modules');
MODULES.forEach(m=>{
  const sec=document.createElement('section');sec.className='module';sec.id=m.id;
  sec.innerHTML=`<div class="module-card"><div class="module-head"><span class="module-num">${m.num}</span><div class="module-title"><h2>${m.title}</h2><p>${m.desc}</p></div></div><div class="module-body"><div class="viz-wrap" id="viz-${m.id}"></div></div></div>`;
  modEl.appendChild(sec);
});

const bn=document.getElementById('bottomNav');
bn.innerHTML=`<a class="bn-btn prev" href="#m8"><span class="lbl">Prev</span><span class="ttl">Agent 评估</span></a><a class="bn-btn next" href="#m2"><span class="lbl">Next</span><span class="ttl">ReAct 模式</span></a>`;

const navLinks=[...document.querySelectorAll('.nav-mod')];
const sections=MODULES.map(m=>document.getElementById(m.id));
window.addEventListener('scroll',()=>{
  let cur=0;sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<120)cur=i;});
  navLinks.forEach((l,i)=>l.classList.toggle('active',i===cur));
  const prevI=(cur-1+MODULES.length)%MODULES.length,nextI=(cur+1)%MODULES.length;
  bn.innerHTML=`<a class="bn-btn prev" href="#${MODULES[prevI].id}"><span class="lbl">Prev</span><span class="ttl">${MODULES[prevI].title}</span></a><a class="bn-btn next" href="#${MODULES[nextI].id}"><span class="lbl">Next</span><span class="ttl">${MODULES[nextI].title}</span></a>`;
});
navLinks[0].classList.add('active');

/* ===== MODULE 1: Agent 架构总览 ===== */
(function(){
  const el=document.getElementById('viz-m1');
  el.innerHTML=`
  <svg viewBox="0 0 760 360" width="100%" style="max-height:400px">
    <defs><marker id="a1arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#22d3ee"/></marker></defs>
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">Agent 核心循环（点击节点高亮阶段）</text>
    <!-- center LLM core -->
    <circle cx="380" cy="200" r="44" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="1.5" class="pulse"/>
    <text x="380" y="198" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="600">LLM</text>
    <text x="380" y="214" text-anchor="middle" fill="#a1a1aa" font-size="9">Brain</text>
    <!-- 4 stages around -->
    <g class="stage" data-stage="perception">
      <rect x="280" y="50" width="200" height="56" rx="10" fill="#0f1115" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="380" y="74" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">Perception 感知</text>
      <text x="380" y="92" text-anchor="middle" fill="#71717a" font-size="10">user input · environment</text>
    </g>
    <g class="stage" data-stage="memory">
      <rect x="560" y="172" width="170" height="56" rx="10" fill="#0f1115" stroke="#2a2d35"/>
      <text x="645" y="196" text-anchor="middle" fill="#e4e4e7" font-size="13" font-weight="600">Memory 记忆</text>
      <text x="645" y="214" text-anchor="middle" fill="#71717a" font-size="10">short / long / episodic</text>
    </g>
    <g class="stage" data-stage="planning">
      <rect x="280" y="294" width="200" height="56" rx="10" fill="#0f1115" stroke="#2a2d35"/>
      <text x="380" y="318" text-anchor="middle" fill="#e4e4e7" font-size="13" font-weight="600">Planning 规划</text>
      <text x="380" y="336" text-anchor="middle" fill="#71717a" font-size="10">decompose · ToT · MCTS</text>
    </g>
    <g class="stage" data-stage="action">
      <rect x="30" y="172" width="170" height="56" rx="10" fill="#0f1115" stroke="#2a2d35"/>
      <text x="115" y="196" text-anchor="middle" fill="#e4e4e7" font-size="13" font-weight="600">Action 行动</text>
      <text x="115" y="214" text-anchor="middle" fill="#71717a" font-size="10">tool call · API · output</text>
    </g>
    <!-- cycle arrows -->
    <path d="M380 106 Q470 130 480 172" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a1arr)" class="flow-line"/>
    <path d="M560 200 Q520 250 480 294" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a1arr)" class="flow-line"/>
    <path d="M280 322 Q190 298 200 228" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a1arr)" class="flow-line"/>
    <path d="M200 172 Q240 122 280 106" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a1arr)" class="flow-line"/>
  </svg>
  <div class="viz-controls">
    <button class="btn active" data-s="all">全部</button>
    <button class="btn" data-s="perception">感知</button>
    <button class="btn" data-s="memory">记忆</button>
    <button class="btn" data-s="planning">规划</button>
    <button class="btn" data-s="action">行动</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">Agent 在 <span style="color:var(--accent)">感知→记忆→规划→行动</span> 的循环中持续运转：接收输入、检索记忆、分解任务、调用工具，再将结果写回记忆，形成完整的认知闭环。</p>`;
  el.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    const s=b.dataset.s;
    el.querySelectorAll('.stage').forEach(g=>{
      const st=g.dataset.stage;
      const rect=g.querySelector('rect');
      const txt=g.querySelectorAll('text');
      const on=(s==='all'||s===st);
      rect.setAttribute('stroke',on?'#22d3ee':'#2a2d35');
      rect.style.opacity=on?'1':'.45';
      txt.forEach(t=>t.style.opacity=on?'1':'.5');
    });
  }));
})();

/* ===== MODULE 2: ReAct 模式 ===== */
(function(){
  const el=document.getElementById('viz-m2');
  el.innerHTML=`
  <div id="m2trace" style="font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;max-height:340px;overflow-y:auto;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg3)"></div>
  <div class="viz-controls">
    <button class="btn" id="m2run">▶ 运行 ReAct</button>
    <button class="btn" id="m2clear">↺ 清除</button>
    <div class="slider-row"><span>步数</span><input type="range" id="m2steps" min="3" max="8" value="5"><span class="val" id="m2sv">5</span></div>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">ReAct 让 LLM 交替输出 <span style="color:var(--accent)">Thought（思考）</span> 与 <span style="color:var(--accent)">Action（行动）</span>，每次行动后观察 Observation，再继续推理，形成"思考-行动-观察"循环。</p>`;
  const trace=document.getElementById('m2trace');
  const run=document.getElementById('m2run'),clear=document.getElementById('m2clear');
  const steps=document.getElementById('m2steps'),sv=document.getElementById('m2sv');
  const task="查询北京今天的天气，并和上海对比，给出穿衣建议";
  const script=[
    {t:'Thought',c:'我需要先查询北京今天的天气。',col:'#22d3ee'},
    {t:'Action',c:'weather_api(city="北京")',col:'#06b6d4'},
    {t:'Observation',c:'北京：晴，15°C，风力3级',col:'#71717a'},
    {t:'Thought',c:'现在查询上海的天气进行对比。',col:'#22d3ee'},
    {t:'Action',c:'weather_api(city="上海")',col:'#06b6d4'},
    {t:'Observation',c:'上海：多云，21°C，风力2级',col:'#71717a'},
    {t:'Thought',c:'北京比上海冷6°C，需要给出差异化建议。',col:'#22d3ee'},
    {t:'Action',c:'finish(answer=...)',col:'#06b6d4'},
    {t:'Answer',c:'北京15°C建议穿薄外套，上海21°C可穿长袖；两地温差6°C。',col:'#84cc16'}
  ];
  let idx=0,timer=null;
  function append(s){
    const div=document.createElement('div');
    div.className='thought-bubble';
    div.style.cssText='padding:4px 0;border-left:2px solid '+s.col+';padding-left:10px;margin:2px 0';
    div.innerHTML='<span style="color:'+s.col+';font-weight:600">'+s.t+':</span> <span style="color:#e4e4e7">'+s.c+'</span>';
    trace.appendChild(div);
    trace.scrollTop=trace.scrollHeight;
  }
  function step(){
    if(idx>=script.length||idx>=+steps.value*2-1){clearInterval(timer);timer=null;run.textContent='▶ 运行 ReAct';if(idx<script.length)append(script[script.length-1]);return;}
    append(script[idx]);idx++;
  }
  run.addEventListener('click',()=>{
    sv.textContent=steps.value;
    if(timer){clearInterval(timer);timer=null;run.textContent='▶ 运行 ReAct';return;}
    trace.innerHTML='';idx=0;
    const head=document.createElement('div');head.style.cssText='color:#71717a;margin-bottom:8px';
    head.textContent='Task: '+task;trace.appendChild(head);
    run.textContent='⏸ 暂停';timer=setInterval(step,700);
  });
  clear.addEventListener('click',()=>{clearInterval(timer);timer=null;trace.innerHTML='';run.textContent='▶ 运行 ReAct';idx=0;});
  steps.addEventListener('input',()=>{sv.textContent=steps.value;});
})();

/* ===== MODULE 3: Tool Use ===== */
(function(){
  const el=document.getElementById('viz-m3');
  el.innerHTML=`
  <svg viewBox="0 0 760 320" width="100%" style="max-height:360px" id="m3svg">
    <defs><marker id="a3arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#22d3ee"/></marker></defs>
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">工具调用编排（点击工具模拟调用）</text>
    <!-- LLM center -->
    <rect x="320" y="120" width="120" height="80" rx="10" fill="rgba(34,211,238,.08)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="380" y="155" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">LLM</text>
    <text x="380" y="172" text-anchor="middle" fill="#a1a1aa" font-size="10">router</text>
    <text x="380" y="186" text-anchor="middle" fill="#71717a" font-size="9">select tool</text>
    <!-- tools -->
    <g class="tool" data-t="search"><rect x="40" y="50" width="120" height="44" rx="8" fill="#0f1115" stroke="#2a2d35"/><text x="100" y="72" text-anchor="middle" fill="#e4e4e7" font-size="12">🔍 Search</text><text x="100" y="86" text-anchor="middle" fill="#71717a" font-size="9">web</text></g>
    <g class="tool" data-t="calc"><rect x="40" y="110" width="120" height="44" rx="8" fill="#0f1115" stroke="#2a2d35"/><text x="100" y="132" text-anchor="middle" fill="#e4e4e7" font-size="12">🧮 Calculator</text><text x="100" y="146" text-anchor="middle" fill="#71717a" font-size="9">math</text></g>
    <g class="tool" data-t="code"><rect x="40" y="170" width="120" height="44" rx="8" fill="#0f1115" stroke="#2a2d35"/><text x="100" y="192" text-anchor="middle" fill="#e4e4e7" font-size="12">💻 Code Exec</text><text x="100" y="206" text-anchor="middle" fill="#71717a" font-size="9">python</text></g>
    <g class="tool" data-t="db"><rect x="40" y="230" width="120" height="44" rx="8" fill="#0f1115" stroke="#2a2d35"/><text x="100" y="252" text-anchor="middle" fill="#e4e4e7" font-size="12">🗄️ Database</text><text x="100" y="266" text-anchor="middle" fill="#71717a" font-size="9">SQL</text></g>
    <!-- result -->
    <rect x="560" y="120" width="160" height="80" rx="10" fill="#0f1115" stroke="#2a2d35"/>
    <text x="640" y="150" text-anchor="middle" fill="#e4e4e7" font-size="12">Result</text>
    <text x="640" y="172" text-anchor="middle" fill="#71717a" font-size="10" id="m3result">点击工具</text>
    <text x="640" y="188" text-anchor="middle" fill="#71717a" font-size="9" id="m3latency">-</text>

/* ===== MODULE 5: Planning 算法 ===== */
(function(){
  const el=document.getElementById('viz-m5');
  el.innerHTML=`
  <svg viewBox="0 0 760 360" width="100%" style="max-height:400px" id="m5svg">
    <text x="380" y="24" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="'SF Mono',monospace">Tree of Thought 搜索（点击展开/评估）</text>
    <g id="m5tree"></g>
  </svg>
  <div class="viz-controls">
    <button class="btn" id="m5expand">展开思维树</button>
    <button class="btn" id="m5eval">评估打分</button>
    <button class="btn" id="m5best">高亮最优路径</button>
    <button class="btn" id="m5clear">↺ 清除</button>
    <div class="slider-row"><span>分支</span><input type="range" id="m5b" min="2" max="4" value="3"><span class="val" id="m5bv">3</span></div>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)">Tree of Thought (ToT) 让 LLM 生成多个候选思路，对每条路径评估打分，再用 BFS/DFS 搜索最优解，相比 CoT 单链推理能探索更大解空间。</p>`;
  const tree=document.getElementById('m5tree');
  const b=document.getElementById('m5b'),bv=document.getElementById('m5bv');
  let nodes=[],edges=[],scores={},bestPath=[];
  function build(){
    const B=+b.value;bv.textContent=B;nodes=[];edges=[];scores={};bestPath=[];
    // root + 2 levels
    nodes.push({id:'r',x:380,y:50,label:'问题',r:10,root:true});
    for(let i=0;i<B;i++){
      const id='l1_'+i;const x=380+(i-(B-1)/2)*180;
      nodes.push({id:id,x:x,y:150,label:'思路'+(i+1),r:7});
      edges.push({from:'r',to:id});
      for(let j=0;j<B;j++){
        const id2='l2_'+i+'_'+j;const x2=x+(j-(B-1)/2)*50;
        nodes.push({id:id2,x:x2,y:260,label:'',r:4,leaf:true});
        edges.push({from:id,to:id2});
        scores[id2]=Math.random();
      }
    }
  }
  function findBest(){
    const B=+b.value;let best=-1,bestI=0,bestJ=0;
    for(let i=0;i<B;i++)for(let j=0;j<B;j++){const s=scores['l2_'+i+'_'+j];if(s>best){best=s;bestI=i;bestJ=j;}}
    bestPath=['r','l1_'+bestI,'l2_'+bestI+'_'+bestJ];
  }
  let mode='init';
  function draw(){
    let html='';
    edges.forEach(e=>{
      const f=nodes.find(n=>n.id===e.from),t=nodes.find(n=>n.id===e.to);
      const onBest=mode==='best'&&bestPath.includes(e.from)&&bestPath.includes(e.to);
      html+=`<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" stroke="${onBest?'#22d3ee':'#1e2026'}" stroke-width="${onBest?2.5:1}"/>`;
    });
    nodes.forEach(n=>{
      let fill='#2a2d35',col='#71717a',r=n.r||5;
      if(n.root){fill='#22d3ee';col='#08090a';}
      else if(mode==='eval'&&scores[n.id]!==undefined){
        const s=scores[n.id];fill='rgba(34,211,238,'+s+')';col='#e4e4e7';
      }else if(mode==='best'&&bestPath.includes(n.id)){fill='#22d3ee';col='#08090a';}
      else if(mode==='expand'){fill='#0f1115';col='#a1a1aa';}
      html+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}" stroke="${n.root||mode==='best'&&bestPath.includes(n.id)?'#22d3ee':'#2a2d35'}" stroke-width="1.5"/>`;
      if(n.label)html+=`<text x="${n.x}" y="${n.y-r-6}" text-anchor="middle" fill="${col}" font-size="10">${n.label}</text>`;
      if(mode==='eval'&&scores[n.id]!==undefined&&!n.root){
        html+=`<text x="${n.x}" y="${n.y+18}" text-anchor="middle" fill="#22d3ee" font-size="8">${scores[n.id].toFixed(2)}</text>`;
      }
    });
    tree.innerHTML=html;
  }
  document.getElementById('m5expand').addEventListener('click',()=>{build();mode='expand';draw();});
  document.getElementById('m5eval').addEventListener('click',()=>{if(!nodes.length)build();mode='eval';draw();});
  document.getElementById('m5best').addEventListener('click',()=>{if(!nodes.length)build();findBest();mode='best';draw();});
  document.getElementById('m5clear').addEventListener('click',()=>{mode='init';build();draw();});
  b.addEventListener('input',()=>{build();draw();});
  build();draw();
})();

      html+=`<text x="${a.x}" y="${a.y+12}" text-anchor="middle" fill="#71717a" font-size="9">${a.role}</text>`;
    });
    g.innerHTML=html;
  }
  const flow=[
    {from:'planner',to:'coder',msg:'任务分解：实现排序函数'},

    // message line

    vals.forEach((v,i)=>v.textContent=vals2[i]);
    let html='';
    // grid rings
    for(let r=1;r<=4;r++){
      let pts='';
      for(let i=0;i<5;i++){
        const ang=-Math.PI/2+i*2*Math.PI/5;
        const x=cx+Math.cos(ang)*R*r/4,y=cy+Math.sin(ang)*R*r/4;
        pts+=x+','+y+' ';
      }
      html+=`<polygon points="${pts}" fill="none" stroke="#1e2026" stroke-width="1"/>`;
    }
    // axes
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*2*Math.PI/5;
      const x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
      html+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1e2026"/>`;
      html+=`<text x="${cx+Math.cos(ang)*(R+18)}" y="${cy+Math.sin(ang)*(R+18)+4}" text-anchor="middle" fill="#a1a1aa" font-size="10">${labels[i]}</text>`;
    }
    // data polygon
    let dpts='';
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*2*Math.PI/5;
      const v=vals2[i]/100;
      const x=cx+Math.cos(ang)*R*v,y=cy+Math.sin(ang)*R*v;
      dpts+=x+','+y+' ';
    }
    html+=`<polygon points="${dpts}" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="2"/>`;
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*2*Math.PI/5;
      const v=vals2[i]/100;
      const x=cx+Math.cos(ang)*R*v,y=cy+Math.sin(ang)*R*v;
      html+=`<circle cx="${x}" cy="${y}" r="4" fill="#22d3ee"/>`;
    }
    // avg score
    const avg=Math.round(vals2.reduce((a,b)=>a+b,0)/5);
    html+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">${avg}</text>`;
    html+=`<text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#71717a" font-size="9">avg</text>`;
    radar.innerHTML=html;
  }
  sliders.forEach(s=>s.addEventListener('input',draw));
  draw();
})();
window.addEventListener('beforeunload',function(){for(var i=1;i<100000;i++){try{clearInterval(i)}catch(e){}}});</script>
</body>
</html>
