.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--pink);background:rgba(244,114,182,.08);border-color:rgba(244,114,182,.16);font-weight:600}
.nav-btn.active .nidx{color:var(--pink)}

.lab-hero{margin-bottom:24px}
.lab-hero .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--pink);background:rgba(244,114,182,.08);border:1px solid rgba(244,114,182,.16);padding:3px 9px;border-radius:4px;margin-bottom:14px;text-transform:uppercase}

.lab-hero h1 .grad{background:linear-gradient(120deg,var(--pink),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lab-hero p{color:var(--text2);font-size:14px;max-width:840px;line-height:1.65}
.module-panel{display:none}
.module-panel.active{display:block;animation:mFade .4s ease}

.m-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}

.info-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:15px;transition:.2s}

.legend-row{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text2);margin-top:10px;font-family:var(--mono)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{fill:var(--text);font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif}
svg .lbl{font-size:11px;fill:var(--text2)}
svg .dim{fill:var(--text3)}
svg .mono{font-family:var(--mono)}
svg .ax-t{font-size:10px;fill:var(--text3);font-family:var(--mono)}
svg .ttl{font-size:13px;font-weight:600;fill:var(--text)}
svg .sub{font-size:10.5px;fill:var(--text3)}
svg .flow-rect{transition:.25s}
svg .flow-rect:hover{stroke-width:2.2}
.apulse{animation:apulse 1.6s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}
.aglow{animation:aglow 2s ease-in-out infinite}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 1px #f472b6)}50%{filter:drop-shadow(0 0 7px #f472b6)}}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.2s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{transform-origin:center;animation:aspin 8s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
@media (max-width:760px){.header-title{font-size:12px}.lab-hero h1{font-size:21px}.nav-btn{font-size:11px;padding:6px 9px}.nav-btn .nidx{display:none}.info-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
