<!DOCTYPE html>

<style>
:root {

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);

  overflow-x: hidden;
}
header {

  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {

.nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 16px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);

.nav-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 11px 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  font-family: inherit;
  white-space: nowrap;

.nav-btn:hover { color: var(--text); background: var(--bg3); }
.nav-btn.active { color: var(--teal); border-bottom-color: var(--teal); background: var(--bg3); }

.module { display: none; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.module-head { margin-bottom: 20px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

.ctrl-label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-right: 4px; letter-spacing: 1px; }
.ctrl-btn {
  background: var(--bg3); border: 1px solid var(--border-bright); color: var(--text-dim);
  padding: 6px 14px; font-size: 12px; border-radius: 4px; cursor: pointer;
  transition: all 0.15s; font-family: inherit;
}
.ctrl-btn:hover { border-color: var(--teal-dim); color: var(--text); }
.ctrl-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); font-weight: 600; }
.viz-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; position: relative; }
.viz-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--teal), transparent); opacity: 0.5; z-index: 1; }
.svg-wrap { padding: 16px; display: flex; justify-content: center; }
.svg-wrap svg { width: 100%; max-width: 920px; height: auto; display: block; }
.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; border-top: 1px solid var(--border); background: var(--bg2);
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
}
.status-bar .stat-val { color: var(--teal); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-right: 6px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.info-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; transition: border-color 0.2s; }
.info-card:hover { border-color: var(--teal-dim); }
.info-card .ic-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; }
.info-card .ic-value { font-size: 22px; font-weight: 700; color: var(--teal); margin-top: 4px; }
.info-card .ic-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
footer { max-width: 1280px; margin: 30px auto 0; padding: 20px 24px 40px; font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-align: center; border-top: 1px solid var(--border); }
@media (max-width: 900px) { .nav-inner { grid-template-columns: repeat(4, 1fr); } .header-meta { display: none; } }
</style>
</head>

"use strict";
/* ============================================================
   UTILITY FUNCTIONS (exact specification)

var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);

function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }

}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* HTML element helper */

}

function addAnim(fn, ms) { var id = setInterval(fn, ms || 33); animTimers.push(id); return id; }

  el("stop", { offset: "100%", "stop-color": "#007a63", "stop-opacity": "0.9" }, g1);

function drawGrid(svg, w, h) {

  for (var x = 0; x <= w; x += 40) { el("line", { x1: x, y1: 0, x2: x, y2: h, stroke: "#00d4aa", "stroke-width": "0.5" }, g); }

function svgTitle(svg, title, sub) {

  if (sub) tspanEl(450, 54, sub, svg, { "text-anchor": "middle", fill: "#8a94a6", "font-size": "12" });

function rrect(x, y, w, h, r, fill, stroke, parent) {
  return el("rect", { x: x, y: y, width: w, height: h, rx: r, ry: r, fill: fill, stroke: stroke || "none", "stroke-width": stroke ? "1.5" : "0" }, parent);
}
function setActiveBtn(ctrlId, v) {
  var btns = document.getElementById(ctrlId).querySelectorAll(".ctrl-btn");
  for (var i = 0; i < btns.length; i++) {
    if (i === v) btns[i].classList.add("active");
    else btns[i].classList.remove("active");
  }
}
function buildCtrl(modId, labels, viewFn) {
  var ctrl = document.getElementById(modId + "-ctrl");
  clearNode(ctrl);
  var lab = el2("span", { class: "ctrl-label" }, ctrl);
  lab.textContent = "VIEW:";
  labels.forEach(function(name, i) {
    var btn = el2("button", { class: "ctrl-btn" + (i === 0 ? " active" : "") }, ctrl);
    btn.textContent = name;
    btn.onclick = function() { viewFn(i); };
  });

function svgFrame(svg, w, h) {
  svgDefs(svg);
  drawGrid(svg, w, h);
  el("rect", { x: 0.5, y: 0.5, width: w - 1, height: h - 1, fill: "none", stroke: "#2a2f3d", "stroke-width": "1", rx: "6" }, svg);
}

/* ============================================================

function m1Draw() { buildCtrl("m1", ["载体迁移", "增长曲线", "AI入口"], m1View); m1View(0); }

/* ============================================================
   MODULE DOM BUILDER
   ============================================================ */
function buildModules() {
  var main = document.getElementById("main-content");
  MODULES.forEach(function(mod, idx) {
    var section = el2("section", { class: "module", id: "mod-" + mod.id }, main);
    var head = el2("div", { class: "module-head" }, section);
    var tw = el2("div", {}, head);
    var title = el2("div", { class: "module-title" }, tw);
    var tag = el2("span", { class: "tag" }, title);
    tag.textContent = "M" + (idx + 1);
    title.appendChild(document.createTextNode(mod.name));
    var desc = el2("div", { class: "module-desc" }, tw);
    desc.textContent = mod.desc;
    var ctrl = el2("div", { class: "controls", id: mod.id + "-ctrl" }, section);
    var panel = el2("div", { class: "viz-panel" }, section);
    var svgWrap = el2("div", { class: "svg-wrap" }, panel);
    var svg = el("svg", { viewBox: "0 0 900 480", preserveAspectRatio: "xMidYMid meet" }, svgWrap);
    svg.id = mod.id + "-svg";
    var statusBar = el2("div", { class: "status-bar", id: mod.id + "-bar" }, panel);
    var sl = el2("span", {}, statusBar);
    var dot = el2("span", { class: "status-dot" }, sl);
    sl.appendChild(document.createTextNode("LIVE"));
    var sr = el2("span", { class: "stat-val", id: mod.id + "-stat" }, statusBar);
    setStatText(sr, "INITIALIZING...");
    var info = el2("div", { class: "info-grid", id: mod.id + "-info" }, section);
    mod.cards.forEach(function(c) {
      var card = el2("div", { class: "info-card" }, info);
      var lab = el2("div", { class: "ic-label" }, card);
      lab.textContent = c.label;
      var val = el2("div", { class: "ic-value" }, card);
      val.textContent = c.value;
      var dsc = el2("div", { class: "ic-desc" }, card);
      dsc.textContent = c.desc;
    });
  });
}

/* ============================================================
   MODULE SWITCHING
   ============================================================ */
function switchModule(idx) {
  clearAnims();
  var mods = document.querySelectorAll(".module");
  for (var i = 0; i < mods.length; i++) mods[i].classList.remove("active");
  var mod = MODULES[idx];
  var target = document.getElementById("mod-" + mod.id);
  if (target) target.classList.add("active");
  var navBtns = document.querySelectorAll(".nav-btn");
  for (var j = 0; j < navBtns.length; j++) {
    if (j === idx) navBtns[j].classList.add("active");
    else navBtns[j].classList.remove("active");
  }
  var am = document.getElementById("active-mod");
  if (am) setStatText(am, String(idx + 1).padStart(2, "0"));
  if (!mod.inited) {
    mod.draw();
    mod.inited = true;
  }
  window.scrollTo(0, 0);
}

/* ============================================================
   NAVIGATION BUILDER (IIFE)
   ============================================================ */
(function buildNav() {
  var container = document.getElementById("nav-container");
  MODULES.forEach(function(mod, idx) {
    var btn = el2("button", { class: "nav-btn" + (idx === 0 ? " active" : "") }, container);
    var num = el2("span", { class: "nav-num" }, btn);
    num.textContent = mod.num;
    btn.appendChild(document.createTextNode(mod.short));
    btn.onclick = function() { switchModule(idx); };
  });
})();

/* ============================================================
   INITIALIZATION
   ============================================================ */
buildModules();
window.addEventListener("load", function() {
  switchModule(0);
});
</script>
