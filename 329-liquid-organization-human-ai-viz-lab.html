<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液态组织与人机混编可视化实验室</title>
<style>
:root {
  --bg: #0a0b0f;
  --bg-elev: #101218;
  --bg-card: #14171f;
  --bg-deep: #07080c;
  --teal: #00d4aa;
  --teal-dim: #00a888;
  --teal-glow: rgba(0, 212, 170, 0.18);
  --teal-line: rgba(0, 212, 170, 0.35);
  --text: #e6edf5;
  --text-dim: #7d8a9e;
  --text-mute: #4a5364;
  --border: #1c2230;
  --border-bright: #2a3344;
  --amber: #ffb347;
  --blue: #4a9eff;
  --violet: #a78bfa;
  --rose: #ff5a6a;
  --cyan: #22d3ee;
  --lime: #a3e635;
  --font-mono: 'SF Mono','Cascadia Code','Consolas','Menlo',monospace;
  --font-sans: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font-sans); }
body { min-height: 100vh; overflow-x: hidden; }

/* ---- Header ---- */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,11,15,0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px 0;
}
.header-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 30px; height: 30px; border: 1.5px solid var(--teal);
  border-radius: 7px; display: grid; place-items: center;
  background: var(--teal-glow); flex-shrink: 0;
}
.brand-mark span { color: var(--teal); font-family: var(--font-mono); font-weight: 700; font-size: 14px; }
.brand-title { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
.brand-sub { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
.header-meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); text-align: right; line-height: 1.6; }
.header-meta b { color: var(--teal); font-weight: 500; }

/* ---- Nav ---- */
.mod-nav {
  display: flex; gap: 4px; margin-top: 12px;
  overflow-x: auto; padding-bottom: 10px;
  scrollbar-width: thin; scrollbar-color: var(--border-bright) transparent;
}
.mod-nav::-webkit-scrollbar { height: 5px; }
.mod-nav::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
.nav-btn {
  flex-shrink: 0; background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); padding: 7px 14px; border-radius: 7px;
  font-family: var(--font-mono); font-size: 12px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 7px;
}
.nav-btn:hover { border-color: var(--teal-dim); color: var(--text); background: var(--bg-card); }
.nav-btn.active {
  border-color: var(--teal); color: var(--teal); background: var(--teal-glow);
  box-shadow: 0 0 12px rgba(0,212,170,0.15);
}
.nav-btn .nav-idx { font-size: 10px; opacity: 0.6; }

/* ---- Stage ---- */
.mod-stage { padding: 28px; max-width: 1080px; margin: 0 auto; }
.module { display: none; }
.module.active { display: block; animation: modIn 0.45s cubic-bezier(0.2,0.7,0.3,1); }
@keyframes modIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.mod-header { margin-bottom: 16px; }
.mod-tag { font-family: var(--font-mono); font-size: 11px; color: var(--teal); letter-spacing: 1.5px; }
.mod-title { font-size: 24px; font-weight: 600; margin: 4px 0 2px; }
.mod-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; max-width: 720px; }

.mod-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 14px; }
.ctrl-btn {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
  padding: 7px 15px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
  transition: all 0.18s; font-family: var(--font-sans);
}
.ctrl-btn:hover { border-color: var(--teal-dim); color: var(--text); }
.ctrl-btn.active { border-color: var(--teal); color: var(--teal); background: var(--teal-glow); }

.svg-wrap {
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; position: relative; overflow: hidden;
}
.svg-wrap::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  opacity: 0.4;
}
.svg-wrap svg { display: block; width: 100%; height: auto; }

.mod-footer {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px; margin-top: 14px;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 14px;
}
.stat-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); letter-spacing: 0.8px; text-transform: uppercase; }
.stat-val { font-size: 15px; font-weight: 600; color: var(--teal); margin-top: 3px; font-family: var(--font-mono); }

.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; padding: 0 4px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

footer.app-foot {
  text-align: center; padding: 30px 20px 40px; font-size: 12px; color: var(--text-mute);
  font-family: var(--font-mono); border-top: 1px solid var(--border); margin-top: 30px;
}
footer.app-foot a { color: var(--teal-dim); text-decoration: none; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark"><span>LQ</span></div>
      <div>
        <div class="brand-title">液态组织与人机混编可视化实验室</div>
        <div class="brand-sub">Liquid Organization · Human-AI Co-pilot Lab</div>
      </div>
    </div>
    <div class="header-meta">
      <div>基于 <b>腾讯研究院 2026 AI十大趋势</b></div>
      <div>零外部依赖 · 纯 SVG · 8 模块</div>
    </div>
  </div>
  <nav class="mod-nav" id="nav"></nav>
</header>
<main class="mod-stage" id="stage"></main>
<footer class="app-foot">
  Liquid Organization Visualization Lab &middot; 数据概念源自腾讯研究院《2026 AI十大趋势报告》液态组织章节<br>
  人机混编 · 任务驱动 · Agent员工化 · 弹性契约 · 智能体管理 · 配比优化 · 流程治理
</footer>

<script>
"use strict";
/* ============================================================
   核心工具函数 (必须完全一致)
   ============================================================ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  if (attrs) { for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); } }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(node, str) { var t = document.createTextNode(str); node.appendChild(t); return node; }
function tspanEl(x, y, str, parent, opts) {
  var a = { x: x, y: y };
  if (opts) { for (var kk in opts) { if (opts.hasOwnProperty(kk)) a[kk] = opts[kk]; } }
  var t = el("text", a, parent); txt(t, str); return t;
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function setStatText(node, str) { node.textContent = str; }

/* ============================================================
   辅助函数
   ============================================================ */
var VW = 960, VH = 480;          // SVG 画布尺寸
var MOD = {};                    // 各模块视图状态
for (var _i = 1; _i <= 8; _i++) { MOD['m' + _i] = 0; }

/* 动画管理器 */
var RAF = { id: null, fns: [] };
function rafStop() { if (RAF.id) { cancelAnimationFrame(RAF.id); RAF.id = null; } RAF.fns = []; }
function rafAdd(fn) { RAF.fns.push(fn); }
function rafStart() {
  rafStop();
  var last = 0;
  function loop(t) {
    for (var i = 0; i < RAF.fns.length; i++) { try { RAF.fns[i](t); } catch (e) {} }
    RAF.id = requestAnimationFrame(loop);
  }
  RAF.id = requestAnimationFrame(loop);
}

/* SVG 公共构造 */
function svgBase(id) {
  var svg = el('svg', { id: id, viewBox: '0 0 ' + VW + ' ' + VH, preserveAspectRatio: 'xMidYMid meet', xmlns: SVGNS });
  return svg;
}
function addGlow(defs, id, std) {
  var f = el('filter', { id: id, x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
  el('feGaussianBlur', { stdDeviation: std || 2.5, result: 'b' }, f);
  var m = el('feMerge', {}, f);
  el('feMergeNode', { in: 'b' }, m);
  el('feMergeNode', { in: 'SourceGraphic' }, m);
  return f;
}
function addGrid(g, w, h, gap, color, op) {
  var grp = el('g', { opacity: op || 0.05 }, g);
  for (var x = 0; x <= w; x += gap) { el('line', { x1: x, y1: 0, x2: x, y2: h, stroke: color || '#00d4aa', 'stroke-width': 0.5 }, grp); }
  for (var y = 0; y <= h; y += gap) { el('line', { x1: 0, y1: y, x2: w, y2: y, stroke: color || '#00d4aa', 'stroke-width': 0.5 }, grp); }
  return grp;
}
function addDefsCommon(svg) {
  var defs = el('defs', {}, svg);
  addGlow(defs, 'glow', 3);
  addGlow(defs, 'glow-sm', 1.5);
  addGlow(defs, 'glow-lg', 6);
  return defs;
}
function label(svg, x, y, str, fill, fs, opts) {
  var a = { x: x, y: y, fill: fill || '#7d8a9e', 'font-size': fs || 11, 'font-family': 'monospace' };
  if (opts) { for (var k in opts) { if (opts.hasOwnProperty(k)) a[k] = opts[k]; } }
  var t = el('text', a, svg); txt(t, str); return t;
}
function setTitle(svg, str) {
  label(svg, 24, 32, str, '#4a5364', 10, { 'letter-spacing': '1.5' });
}

/* ============================================================
   M1 · 组织形态演进
   ============================================================ */
function m1Draw() {
  var svg = document.getElementById('svg-m1'); clearNode(svg);
  addDefsCommon(svg);
  var bg = el('g', {}, svg);
  addGrid(bg, VW, VH, 32, '#00d4aa', 0.045);
  setTitle(svg, 'M1 / ORG-EVOLUTION · 固态金字塔 → 液态网络');
  var v = MOD.m1;
  var showSolid = v === 0 || v === 2;
  var showLiquid = v === 1 || v === 2;

  /* ---- 固态金字塔 (左) ---- */
  if (showSolid) {
    var gx = el('g', { opacity: v === 1 ? 0.18 : 1, transition: 'opacity .4s' }, svg);
    var levels = [
      { n: 1, w: 90, label: '决策层', col: '#ffb347', y: 90 },
      { n: 3, w: 70, label: '管理层', col: '#ff8c42', y: 170 },
      { n: 6, w: 56, label: '执行层', col: '#e07030', y: 250 },
      { n: 10, w: 44, label: '基层', col: '#b85a28', y: 330 }
    ];
    var cx0 = 230;
    levels.forEach(function (lv, li) {
      var totalW = lv.n * (lv.w + 10) - 10;
      var startX = cx0 - totalW / 2;
      for (var i = 0; i < lv.n; i++) {
        var bx = startX + i * (lv.w + 10);
        el('rect', { x: bx, y: lv.y, width: lv.w, height: 40, rx: 4, fill: lv.col, 'fill-opacity': 0.16, stroke: lv.col, 'stroke-width': 1.2, filter: 'url(#glow-sm)' }, gx);
        if (i === 0) label(gx, cx0, lv.y - 8, lv.label, lv.col, 10, { 'text-anchor': 'middle', 'font-weight': 600 });
      }
      if (li < levels.length - 1) {
        var next = levels[li + 1];
        var nextTotal = next.n * (next.w + 10) - 10;
        var nStart = cx0 - nextTotal / 2;
        for (var a = 0; a < lv.n; a++) {
          var ax = cx0 - totalW / 2 + a * (lv.w + 10) + lv.w / 2;
          for (var b = 0; b < next.n; b++) {
            var bx2 = nStart + b * (next.w + 10) + next.w / 2;
            el('line', { x1: ax, y1: lv.y + 40, x2: bx2, y2: next.y, stroke: '#e07030', 'stroke-width': 0.6, 'stroke-opacity': 0.25 }, gx);
          }
        }
      }
    });
    label(gx, cx0, 400, 'SOLID HIERARCHY', '#ffb347', 13, { 'text-anchor': 'middle', 'font-weight': 700, 'letter-spacing': '2' });
    label(gx, cx0, 420, '层级固化 · 信息逐级衰减', '#7d8a9e', 10.5, { 'text-anchor': 'middle' });
  }

  /* ---- 液态网络 (右) ---- */
  if (showLiquid) {
    var nx = el('g', { opacity: v === 0 ? 0.18 : 1, transition: 'opacity .4s' }, svg);
    var nodes = [
      { x: 700, y: 110, r: 11, hub: true, c: '#00d4aa', t: '人' },
      { x: 800, y: 160, r: 9, c: '#22d3ee', t: 'AI' },
      { x: 850, y: 240, r: 9, c: '#22d3ee', t: 'AI' },
      { x: 820, y: 320, r: 10, hub: true, c: '#00d4aa', t: '人' },
      { x: 720, y: 360, r: 8, c: '#a3e635', t: 'AI' },
      { x: 640, y: 300, r: 9, c: '#22d3ee', t: 'AI' },
      { x: 620, y: 200, r: 9, c: '#a3e635', t: 'AI' },
      { x: 760, y: 90, r: 7, c: '#22d3ee', t: 'AI' },
      { x: 880, y: 110, r: 7, c: '#a3e635', t: 'AI' },
      { x: 560, y: 260, r: 8, c: '#22d3ee', t: 'AI' },
      { x: 900, y: 200, r: 7, c: '#a3e635', t: 'AI' },
      { x: 680, y: 250, r: 7, c: '#22d3ee', t: 'AI' }
    ];
    var edges = [[0,1],[0,6],[0,7],[1,2],[1,8],[2,3],[2,9],[3,4],[3,5],[5,6],[5,9],[6,7],[4,5],[2,8],[3,10],[1,11],[6,11]];
    edges.forEach(function (e) {
      var a = nodes[e[0]], b = nodes[e[1]];
      el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#00d4aa', 'stroke-width': 0.8, 'stroke-opacity': 0.3 }, nx);
    });
    nodes.forEach(function (nd, i) {
      var g2 = el('g', {}, nx);
      el('circle', { cx: nd.x, cy: nd.y, r: nd.r + 3, fill: 'none', stroke: nd.c, 'stroke-width': 0.8, 'stroke-opacity': 0.3, class: 'm1-ring' + i }, g2);
      el('circle', { cx: nd.x, cy: nd.y, r: nd.r, fill: nd.c, 'fill-opacity': nd.hub ? 0.35 : 0.18, stroke: nd.c, 'stroke-width': 1.3, filter: 'url(#glow-sm)' }, g2);
      tspanEl(nd.x, nd.y + 3.5, nd.t, g2, { 'text-anchor': 'middle', fill: nd.c, 'font-size': 9, 'font-family': 'monospace', 'font-weight': 700 });
    });
    label(nx, 740, 400, 'LIQUID NETWORK', '#00d4aa', 13, { 'text-anchor': 'middle', 'font-weight': 700, 'letter-spacing': '2' });
    label(nx, 740, 420, '动态重组 · 即时连接', '#7d8a9e', 10.5, { 'text-anchor': 'middle' });

    /* 动画: 网络脉冲 */
    var rings = nodes.map(function (nd, i) { return nx.querySelector('.m1-ring' + i); });
    rafAdd(function (t) {
      var s = (t % 2200) / 2200;
      rings.forEach(function (r, i) {
        if (!r) return;
        var off = (i * 0.13) % 1;
        var p = (s + off) % 1;
        r.setAttribute('r', (nodes[i].r + 3 + p * 14).toFixed(1));
        r.setAttribute('stroke-opacity', (0.4 * (1 - p)).toFixed(3));
      });
    });
  }

  /* ---- 中间过渡箭头 ---- */
  if (v === 2) {
    var ar = el('g', {}, svg);
    el('line', { x1: 440, y1: 240, x2: 510, y2: 240, stroke: '#00d4aa', 'stroke-width': 2, 'marker-end': 'url(#m1arrow)' }, ar);
    el('path', { d: 'M506,234 L516,240 L506,246', fill: 'none', stroke: '#00d4aa', 'stroke-width': 2 }, ar);
    label(ar, 475, 228, 'EVOLVE', '#00d4aa', 9, { 'text-anchor': 'middle', 'letter-spacing': '1' });
  }

  /* ---- 底部特征对比 ---- */
  if (v === 2) {
    var cmp = [
      ['维度', '固态组织', '液态组织'],
      ['结构', '金字塔层级', '动态网络'],
      ['协作', '部门壁垒', '任务即组'],
      ['规模', '与产能绑定', '弹性伸缩'],
      ['决策', '自上而下', '分布授权']
    ];
    var y0 = 440;
    /* 不画在SVG底部，放stats */
  }

  rafStart();
  var stats = [
    ['组织层级', v === 1 ? '扁平 ~2层' : '4-7层'],
    ['管理跨度', v === 0 ? '1:6 固化' : '1:50+ 弹性'],
    ['响应速度', v === 0 ? '小时~天' : '秒级'],
    ['当前视图', ['固态组织', '液态组织', '对比演进'][v]]
  ];
  fillStats('m1', stats);
}
function m1View(v) { MOD.m1 = v; m1Draw(); syncCtrl('m1', v); }

/* ============================================================
   M2 · 人机混编网络
   ============================================================ */
function m2Draw() {
  var svg = document.getElementById('svg-m2'); clearNode(svg);
  addDefsCommon(svg);
  var bg = el('g', {}, svg);
  addGrid(bg, VW, VH, 32, '#00d4aa', 0.045);
  setTitle(svg, 'M2 / HUMAN-AI MESH · 2-5人管理者调度数十上百Agent');
  var v = MOD.m2;
  var cx = 480, cy = 240;

  /* 管理者簇 (中心) */
  var mgrs = [
    { x: cx - 26, y: cy - 18, c: '#00d4aa', n: 'M1' },
    { x: cx + 26, y: cy - 18, c: '#00d4aa', n: 'M2' },
    { x: cx, y: cy + 22, c: '#a3e635', n: 'M3' }
  ];
  /* Agent 环形布局 */
  var agents = [];
  var rings = v === 0 ? [26] : v === 1 ? [18, 30] : [14, 24, 34];
  rings.forEach(function (count, ri) {
    var R = 80 + ri * 62;
    for (var i = 0; i < count; i++) {
      var ang = (i / count) * Math.PI * 2 + ri * 0.3 - Math.PI / 2;
      agents.push({ x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang), ring: ri, idx: i, c: ri === 0 ? '#22d3ee' : ri === 1 ? '#4a9eff' : '#a78bfa' });
    }
  });

  var edgeG = el('g', { opacity: v === 1 ? 0.12 : 0.22 }, svg);
  agents.forEach(function (a) {
    mgrs.forEach(function (m) {
      el('line', { x1: m.x, y1: m.y, x2: a.x, y2: a.y, stroke: a.c, 'stroke-width': 0.4, 'stroke-opacity': 0.5 }, edgeG);
    });
  });

  /* 任务流视图: 高亮流动 */
  if (v === 1) {
    var flowG = el('g', {}, svg);
    var flowLines = [];
    agents.forEach(function (a, i) {
      if (i % 3 === 0) {
        var ln = el('line', { x1: mgrs[0].x, y1: mgrs[0].y, x2: a.x, y2: a.y, stroke: '#00d4aa', 'stroke-width': 1.2, 'stroke-dasharray': '4 6', 'stroke-opacity': 0.6 }, flowG);
        flowLines.push(ln);
      }
    });
    rafAdd(function (t) {
      var off = -((t * 0.05) % 10);
      flowLines.forEach(function (ln) { ln.setAttribute('stroke-dashoffset', off.toFixed(1)); });
    });
  }

  /* Agent 节点 */
  var agentG = el('g', {}, svg);
  var agentCircles = [];
  agents.forEach(function (a) {
    var g2 = el('g', {}, agentG);
    el('circle', { cx: a.x, cy: a.y, r: 5, fill: a.c, 'fill-opacity': 0.12, stroke: a.c, 'stroke-width': 1, class: 'm2-agent' }, g2);
    agentCircles.push({ node: g2.firstChild, data: a });
  });

  /* 管理者节点 */
  mgrs.forEach(function (m) {
    var g2 = el('g', {}, svg);
    el('circle', { cx: m.x, cy: m.y, r: 14, fill: m.c, 'fill-opacity': 0.2, stroke: m.c, 'stroke-width': 1.8, filter: 'url(#glow)' }, g2);
    el('circle', { cx: m.x, cy: m.y, r: 19, fill: 'none', stroke: m.c, 'stroke-width': 0.6, 'stroke-opacity': 0.4 }, g2);
    tspanEl(m.x, m.y + 3.5, m.n, g2, { 'text-anchor': 'middle', fill: m.c, 'font-size': 10, 'font-weight': 700, 'font-family': 'monospace' });
  });

  /* 中心标注 */
  label(svg, cx, cy - 48, '管理者簇 · 3人', '#00d4aa', 11, { 'text-anchor': 'middle', 'font-weight': 600 });
  label(svg, cx, 430, '人机比 1:' + agents.length + ' · 扁平化调度', '#7d8a9e', 11, { 'text-anchor': 'middle' });

  /* 角色层级视图 */
  if (v === 2) {
    var layers = [
      { y: 60, label: 'L0 意图层', c: '#00d4aa', n: 3 },

/* ============================================================
   框架逻辑
   ============================================================ */
var currentMod = null;

function fillStats(id, stats) {
  var box = document.getElementById('stats-' + id);
  if (!box) return;
  clearNode(box);
  stats.forEach(function (s) {
    var card = document.createElement('div');
    card.className = 'stat-card';
    var lab = document.createElement('div'); lab.className = 'stat-label'; lab.textContent = s[0];
    var val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s[1];
    card.appendChild(lab); card.appendChild(val);
    box.appendChild(card);
  });
}

function syncCtrl(id, v) {
  var btns = document.querySelectorAll('#ctrl-' + id + ' .ctrl-btn');
  btns.forEach(function (b, i) { b.classList.toggle('active', i === v); });
}

function switchModule(id) {
  rafStop();
  var mod = null;
  for (var i = 0; i < MODULES.length; i++) { if (MODULES[i].id === id) mod = MODULES[i]; }
  if (!mod) return;
  currentMod = id;
  var secs = document.querySelectorAll('.module');
  secs.forEach(function (s) { s.classList.remove('active'); });
  var sec = document.getElementById('mod-' + id);
  if (sec) sec.classList.add('active');
  var navBtns = document.querySelectorAll('.nav-btn');
  navBtns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-mod') === id); });
  try { mod.draw(); } catch (e) { console.error(e); }
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* 构建导航 */
var buildNav = (function () {
  var nav = document.getElementById('nav');
  MODULES.forEach(function (m) {
    var btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.setAttribute('data-mod', m.id);
    var idx = document.createElement('span'); idx.className = 'nav-idx'; idx.textContent = m.no;
    var nm = document.createElement('span'); nm.textContent = m.name;
    btn.appendChild(idx); btn.appendChild(nm);
    btn.addEventListener('click', function () { switchModule(m.id); });
    nav.appendChild(btn);
  });
})();

/* 构建模块舞台 */
function buildStage() {
  var stage = document.getElementById('stage');
  MODULES.forEach(function (m) {
    var sec = document.createElement('section');
    sec.className = 'module';
    sec.id = 'mod-' + m.id;

    var head = document.createElement('div'); head.className = 'mod-header';
    var tag = document.createElement('div'); tag.className = 'mod-tag'; tag.textContent = m.no + ' / ' + m.sub.toUpperCase();
    var title = document.createElement('div'); title.className = 'mod-title'; title.textContent = m.title;
    var desc = document.createElement('div'); desc.className = 'mod-desc'; desc.textContent = m.desc;
    head.appendChild(tag); head.appendChild(title); head.appendChild(desc);

    var ctrl = document.createElement('div'); ctrl.className = 'mod-controls'; ctrl.id = 'ctrl-' + m.id;
    m.views.forEach(function (vw, i) {
      var b = document.createElement('button');
      b.className = 'ctrl-btn' + (i === 0 ? ' active' : '');
      b.textContent = vw;
      b.addEventListener('click', function () { m.view(i); });
      ctrl.appendChild(b);
    });

    var wrap = document.createElement('div'); wrap.className = 'svg-wrap';
    var svg = svgBase('svg-' + m.id);
    wrap.appendChild(svg);

    var stats = document.createElement('div'); stats.className = 'mod-footer'; stats.id = 'stats-' + m.id;

    sec.appendChild(head); sec.appendChild(ctrl); sec.appendChild(wrap); sec.appendChild(stats);
    stage.appendChild(sec);
  });
}

/* 初始化 */
function init() {
  buildStage();
  switchModule('m1');
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
