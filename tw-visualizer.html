<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Visualizer</title>
<style>
  :root{
    --bg:#08090a;
    --panel:#0c0e10;
    --panel-2:#101316;
    --border:#1b1f23;
    --border-2:#262b30;
    --border-hover:#343a40;
    --text:#e4e4e7;
    --muted:#8b919a;
    --dim:#5a6068;
    --accent:#059669;
    --accent-2:#047857;
    --accent-dim:rgba(5,150,105,.12);
    --accent-glow:rgba(5,150,105,.35);
    --red:#ef4444;
    --red-dim:rgba(239,68,68,.14);
    --amber:#f59e0b;
    --node-fill:#14181c;
    --node-stroke:#2c3239;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:13px;
    line-height:1.5;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    display:grid;
    grid-template-rows:48px 1fr 150px;
  }
  button{font-family:inherit;cursor:pointer;color:var(--text);background:none;border:none}
  input,textarea,select{font-family:inherit;color:var(--text)}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:18px;
    padding:0 16px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    z-index:5;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .logo .mark{width:20px;height:20px;border:1.5px solid var(--accent);border-radius:5px;position:relative}
  .logo .mark::after{content:"";position:absolute;inset:4px;border-radius:2px;background:var(--accent)}
  .logo b{color:var(--text)}
  .logo span{color:var(--dim);font-weight:400}
  .tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:6px 11px;border-radius:6px;font-size:12px;color:var(--muted);
    white-space:nowrap;transition:color .15s,background .15s;
    border:1px solid transparent;
  }
  .tab:hover{color:var(--text);background:var(--panel-2)}
  .tab.active{color:var(--accent);background:var(--accent-dim);border-color:rgba(5,150,105,.25)}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:11px}
  .header-right .pill{padding:3px 8px;border:1px solid var(--border);border-radius:99px;color:var(--muted)}

  /* ---------- Main ---------- */
  main{display:grid;grid-template-columns:300px 1fr;min-height:0}
  aside.panel{
    border-right:1px solid var(--border);
    background:var(--panel);
    overflow-y:auto;
    padding:14px;
    display:flex;flex-direction:column;gap:16px;
  }
  aside.panel::-webkit-scrollbar{width:8px}
  aside.panel::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .section-label{
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    margin-bottom:8px;display:flex;align-items:center;gap:6px;
  }
  .section-label::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--accent)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:11px;color:var(--muted)}
  textarea.input-area{
    width:100%;min-height:74px;resize:vertical;
    background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
    padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--text);
    transition:border-color .15s;
  }
  textarea.input-area:focus{outline:none;border-color:var(--accent)}
  input[type=text].input-line,input[type=number].input-line{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    padding:7px 9px;font-size:12px;
  }
  input[type=text].input-line:focus,input[type=number].input-line:focus{outline:none;border-color:var(--accent)}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap}
  .btn{
    padding:6px 11px;border-radius:6px;font-size:12px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
    display:inline-flex;align-items:center;gap:5px;
  }
  .btn:hover{border-color:var(--border-hover);background:#161a1e}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04130d;font-weight:600}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 8px;font-size:11px}
  .btn.active-state{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ops-grid .btn{justify-content:center}
  .inline-row{display:flex;gap:6px;align-items:center}
  .inline-row .input-line{flex:1}
  .check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .check-row input{accent-color:var(--accent);width:14px;height:14px}
  select.input-line{cursor:pointer}
  .info-text{font-size:11.5px;color:var(--muted);line-height:1.6}
  .info-text code{font-family:var(--mono);color:var(--accent);background:var(--accent-dim);padding:1px 5px;border-radius:3px;font-size:11px}
  .stat-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px dashed var(--border)}
  .stat-row b{color:var(--text);font-family:var(--mono)}

  /* ---------- Viz area ---------- */
  .viz-area{
    position:relative;min-width:0;min-height:0;
    background:var(--bg);
    background-image:radial-gradient(circle,#13171b 1px,transparent 1px);
    background-size:22px 22px;
    overflow:hidden;
  }
  #canvas{width:100%;height:100%;display:block;cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  .viz-toolbar{
    position:absolute;top:10px;right:10px;display:flex;gap:6px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;
    z-index:3;
  }
  .viz-toolbar button{
    width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;font-size:14px;
  }
  .viz-toolbar button:hover{background:var(--panel-2);color:var(--text)}
  .viz-info{
    position:absolute;top:10px;left:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;font-size:11px;color:var(--muted);z-index:3;
    display:flex;align-items:center;gap:8px;
  }
  .viz-info b{color:var(--accent);font-family:var(--mono)}
  .viz-empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:13px;pointer-events:none;flex-direction:column;gap:8px;
  }
  .viz-empty .big{font-size:15px;color:var(--muted);letter-spacing:.05em}

  /* SVG styles */
  .edge{stroke:#2c3239;stroke-width:1.5;fill:none}
  .edge.hi{stroke:var(--accent);stroke-width:2.2}
  .edge.path{stroke:var(--accent);stroke-width:2.6;filter:drop-shadow(0 0 3px var(--accent-glow))}
  .edge.dash{stroke-dasharray:5 4}
  .node{cursor:pointer}
  .node-circle{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1.6;transition:fill .2s,stroke .2s}
  .node:hover .node-circle{stroke:var(--border-hover)}
  .node.hi .node-circle{fill:var(--accent-dim);stroke:var(--accent)}
  .node.found .node-circle{fill:var(--accent);stroke:var(--accent)}
  .node.found .node-text{fill:#04130d;font-weight:700}
  .node.visit .node-circle{fill:rgba(245,158,11,.14);stroke:var(--amber)}
  .node-text{fill:var(--text);font-size:12px;font-family:var(--mono);pointer-events:none;user-select:none}
  .node-sub{fill:var(--dim);font-size:10px;font-family:var(--mono);pointer-events:none}
  .node-rb-red .node-circle{fill:var(--red-dim);stroke:var(--red)}
  .node-rb-red .node-text{fill:#fecaca}
  .node-rb-black .node-circle{fill:#14181c;stroke:#4b5563}
  .node-rb-black .node-text{fill:#e4e4e7}
  .edge-label{fill:var(--dim);font-size:10px;font-family:var(--mono);pointer-events:none}
  .edge-label.hi{fill:var(--accent)}
  .bp-internal{fill:#14181c;stroke:var(--node-stroke);stroke-width:1.6}
  .bp-leaf{fill:var(--accent-dim);stroke:var(--accent);stroke-width:1.4}
  .bp-key{fill:var(--text);font-size:11px;font-family:var(--mono);pointer-events:none}
  .bp-sep{stroke:var(--border-2);stroke-width:1}
  .bucket-rect{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1.4}
  .bucket-rect.hi{stroke:var(--accent);fill:var(--accent-dim)}
  .arr-cell{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1.2}
  .arr-cell.hi{fill:var(--accent-dim);stroke:var(--accent)}
  .arr-text{fill:var(--text);font-size:11px;font-family:var(--mono);pointer-events:none}
  .arr-idx{fill:var(--dim);font-size:9px;font-family:var(--mono);pointer-events:none}
  .link-text{fill:var(--accent);font-size:10px;font-family:var(--mono)}
  .legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .legend .li{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
  .legend .sw{width:11px;height:11px;border-radius:3px;border:1px solid}

  /* ---------- Log ---------- */
  footer.log{
    border-top:1px solid var(--border);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .log-head{
    display:flex;align-items:center;gap:10px;padding:6px 14px;
    border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);
  }
  .log-head .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
  .log-head .clear{margin-left:auto;color:var(--dim);font-size:10.5px}
  .log-head .clear:hover{color:var(--text)}
  .log-content{
    flex:1;overflow-y:auto;padding:6px 14px;font-family:var(--mono);font-size:11.5px;
  }
  .log-content::-webkit-scrollbar{width:8px}
  .log-content::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  .log-line{display:flex;gap:10px;padding:2px 0;align-items:baseline}
  .log-line .t{color:var(--dim);flex-shrink:0}
  .log-line .tag{flex-shrink:0;width:54px;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  .log-line .msg{color:var(--text);word-break:break-all}
  .tag.info{color:var(--muted)}
  .tag.insert{color:var(--accent)}
  .tag.delete{color:var(--red)}
  .tag.find{color:#60a5fa}
  .tag.rotate{color:var(--amber)}
  .tag.split{color:#c084fc}
  .tag.hash{color:#34d399}
  .tag.traverse{color:#fbbf24}
  .tag.error{color:var(--red)}
  .tag.build{color:var(--accent)}

  /* responsive */
  @media (max-width:820px){
    body{grid-template-rows:48px auto 1fr 120px}
    main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside.panel{max-height:38vh;border-right:none;border-bottom:1px solid var(--border)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark"></span><b>TW</b><span>Visualizer</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="header-right">
    <span class="pill" id="memPill">0 nodes</span>
  </div>
</header>
<main>
  <aside class="panel" id="panel"></aside>
  <section class="viz-area" id="vizArea">
    <div class="viz-info" id="vizInfo"><span id="vizTitle">—</span> · <b id="vizCount">0</b> elements</div>
    <div class="viz-toolbar">
      <button id="zoomIn" title="放大">+</button>
      <button id="zoomOut" title="缩小">−</button>
      <button id="zoomFit" title="适应">⤢</button>
      <button id="zoomReset" title="重置">↻</button>
    </div>
    <svg id="canvas" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#5a6068"/>
        </marker>
        <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
        </marker>
      </defs>
      <g id="content"></g>
    </svg>
    <div class="viz-empty" id="vizEmpty" style="display:none">
      <div class="big">No data</div>
      <div>在左侧输入数据并点击构建</div>
    </div>
  </section>
</main>
<footer class="log">
  <div class="log-head">
    <span class="dot"></span><span>操作日志</span>
    <button class="clear" id="logClear">清空</button>
  </div>
  <div class="log-content" id="logContent"></div>
</footer>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
(function(){
'use strict';

/* ============================================================
   Utilities
   ============================================================ */
const SVG_NS='http://www.w3.org/2000/svg';
function el(tag,attrs){
  const e=document.createElementNS(SVG_NS,tag);
  if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);
  return e;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function parseNums(s){return (String(s).match(/-?\d+(\.\d+)?/g)||[]).map(Number).filter(n=>!isNaN(n));}
function parseWords(s){return String(s).split(/[,\s\n;]+/).map(x=>x.trim()).filter(Boolean);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function insertSorted(arr,v){let i=0;while(i<arr.length&&arr[i]<v)i++;arr.splice(i,0,v);}

/* SVG drawing helpers */
function drawNode(g,x,y,label,opts){
  opts=opts||{};
  const r=opts.r||18;
  const grp=el('g',{class:'node'+(opts.cls?(' '+opts.cls):''),transform:'translate('+x+','+y+')'});
  if(opts.id)grp.setAttribute('data-id',opts.id);
  const c=el('circle',{r:r,class:'node-circle'});
  if(opts.color)c.classList.add('node-'+opts.color);
  grp.appendChild(c);
  if(label!==null&&label!==undefined){
    const t=el('text',{'text-anchor':'middle','dominant-baseline':'central',class:'node-text'});
    t.textContent=String(label);
    if(opts.color==='rb-red')t.setAttribute('fill','#fecaca');
    grp.appendChild(t);
  }
  if(opts.sub){
    const t2=el('text',{y:r+14,'text-anchor':'middle',class:'node-sub'});
    t2.textContent=opts.sub;grp.appendChild(t2);
  }
  if(opts.order){
    const t3=el('text',{y:-(r+8),'text-anchor':'middle',class:'node-sub',fill:'#f59e0b'});
    t3.textContent='#'+opts.order;grp.appendChild(t3);
  }
  g.appendChild(grp);
  return grp;
}
function drawEdge(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  const line=el('line',{x1:x1,y1:y1,x2:x2,y2:y2,class:'edge'+(opts.cls?(' '+opts.cls):'')});
  if(opts.dashed)line.setAttribute('stroke-dasharray','5 4');
  if(opts.arrow)line.setAttribute('marker-end','url(#'+(opts.cls==='path'||opts.cls==='hi'?'arrow-hi':'arrow')+')');
  g.appendChild(line);
  return line;
}

/* ============================================================
   App state
   ============================================================ */
const App={
  current:'bst',
  states:{},
  logEntries:[],
  viewBox:{x:0,y:0,w:1000,h:620},
  lastBounds:null
};
const STORAGE_KEY='tw-viz-state';

const svg=document.getElementById('canvas');
const content=document.getElementById('content');
const panel=document.getElementById('panel');
const tabsEl=document.getElementById('tabs');
const logContent=document.getElementById('logContent');
const vizInfo=document.getElementById('vizInfo');
const vizTitle=document.getElementById('vizTitle');
const vizCount=document.getElementById('vizCount');
const vizEmpty=document.getElementById('vizEmpty');
const memPill=document.getElementById('memPill');

/* ============================================================
   Log
   ============================================================ */
function addLog(type,msg){
  App.logEntries.push({type,msg,time:new Date().toLocaleTimeString('en-GB')});
  if(App.logEntries.length>300)App.logEntries.shift();
  renderLog();
}
function renderLog(){
  const frag=document.createDocumentFragment();
  App.logEntries.slice(-150).forEach(e=>{
    const line=h('div','log-line');
    const t=h('span','t');t.textContent=e.time;line.appendChild(t);
    const tag=h('span','tag '+e.type);tag.textContent=e.type;line.appendChild(tag);
    const msg=h('span','msg');msg.textContent=e.msg;line.appendChild(msg);
    frag.appendChild(line);
  });
  clear(logContent);logContent.appendChild(frag);
  logContent.scrollTop=logContent.scrollHeight;
}
document.getElementById('logClear').addEventListener('click',()=>{
  App.logEntries=[];renderLog();
});

/* ============================================================
   SVG view: zoom (wheel) + pan (pointer) — no mousemove
   ============================================================ */
function applyViewBox(){
  svg.setAttribute('viewBox',App.viewBox.x+' '+App.viewBox.y+' '+App.viewBox.w+' '+App.viewBox.h);
}
function fitViewBox(b,pad){
  pad=pad||40;
  if(!b||b.maxX-b.minX<1||b.maxY-b.minY<1){App.viewBox={x:0,y:0,w:1000,h:620};applyViewBox();return;}
  const w=b.maxX-b.minX+pad*2,h=b.maxY-b.minY+pad*2;
  App.viewBox={x:b.minX-pad,y:b.minY-pad,w:w,h:h};
  applyViewBox();
}
function zoomBy(factor){
  const cx=App.viewBox.x+App.viewBox.w/2,cy=App.viewBox.y+App.viewBox.h/2;
  App.viewBox.w=clamp(App.viewBox.w*factor,120,8000);
  App.viewBox.h=clamp(App.viewBox.h*factor,80,5000);
  App.viewBox.x=cx-App.viewBox.w/2;App.viewBox.y=cy-App.viewBox.h/2;
  applyViewBox();
}
document.getElementById('zoomIn').addEventListener('click',()=>zoomBy(0.8));
document.getElementById('zoomOut').addEventListener('click',()=>zoomBy(1.25));
document.getElementById('zoomFit').addEventListener('click',()=>fitViewBox(App.lastBounds));
document.getElementById('zoomReset').addEventListener('click',()=>{App.viewBox={x:0,y:0,w:1000,h:620};applyViewBox();});

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY>0?1.12:0.89;
  const rect=svg.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/rect.width*App.viewBox.w+App.viewBox.x;
  const cy=(e.clientY-rect.top)/rect.height*App.viewBox.h+App.viewBox.y;
  const newW=clamp(App.viewBox.w*factor,120,8000);
  const newH=clamp(App.viewBox.h*factor,80,5000);
  App.viewBox.x=cx-(cx-App.viewBox.x)*(newW/App.viewBox.w);
  App.viewBox.y=cy-(cy-App.viewBox.y)*(newH/App.viewBox.h);
  App.viewBox.w=newW;App.viewBox.h=newH;
  applyViewBox();
},{passive:false});

let panning=false,panStart=null;
svg.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  if(e.target.closest('.node,.bucket-rect,.bp-leaf,.bp-internal,.arr-cell'))return;
  panning=true;panStart={x:e.clientX,y:e.clientY,vx:App.viewBox.x,vy:App.viewBox.y};
  svg.classList.add('grabbing');
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!panning)return;
  const rect=svg.getBoundingClientRect();
  const dx=(e.clientX-panStart.x)/rect.width*App.viewBox.w;
  const dy=(e.clientY-panStart.y)/rect.height*App.viewBox.h;
  App.viewBox.x=panStart.vx-dx;App.viewBox.y=panStart.vy-dy;
  applyViewBox();
});
function endPan(){panning=false;svg.classList.remove('grabbing');}
svg.addEventListener('pointerup',endPan);
svg.addEventListener('pointercancel',endPan);
svg.addEventListener('pointerleave',endPan);

/* ============================================================
   Persistence
   ============================================================ */
function saveState(){
  try{
    const data={current:App.current,inputs:{}};
    for(const k in Modules)data.inputs[k]=App.states[k].input||'';
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}
}

/* ============================================================
   Module registry
   ============================================================ */
const Modules={};
const ORDER=['bst','heap','graph','hash','skip','trie','rb','bp'];
function register(name,def){Modules[name]=def;}

const API={
  rerender(){renderModule();},
  log:addLog,
  save:saveState,
  fit:b=>fitViewBox(b)
};

/* ============================================================

register('bst',{
  label:'BST',title:'二叉搜索树',
  defaultInput:'50,30,70,20,40,60,80,10,25,45',
  buildState(){return{input:this.defaultInput,root:null,avl:false,values:[],highlight:0,found:null};},
  panelHTML(){
    const s=App.states.bst;
    return '<div class="section-label">数据输入</div>'+
      '<textarea class="input-area" id="bstInput">'+esc(s.input)+'</textarea>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn primary" data-act="build">构建</button>'+
        '<button class="btn" data-act="clear">清空</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">单元素操作</div>'+
      '<div class="inline-row"><input type="text" class="input-line" id="bstVal" placeholder="数字"></div>'+
      '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn" data-act="insert">插入</button>'+
        '<button class="btn" data-act="delete">删除</button>'+
        '<button class="btn" data-act="find">查找</button>'+
      '</div>'+
      '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn" data-act="inorder">中序遍历</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">参数</div>'+
      '<label class="check-row"><input type="checkbox" id="bstAvl" '+(s.avl?'checked':'')+'> AVL 平衡模式</label>'+
      '<div class="section-label" style="margin-top:14px">统计</div>'+
      '<div id="bstStats"></div>'+
      '<div class="section-label" style="margin-top:14px">说明</div>'+
      '<p class="info-text">输入数字序列自动构建 BST。左子树 &lt; 根 &lt; 右子树。中序遍历得到升序序列。开启 <code>AVL</code> 后插入/删除自动旋转保持平衡。</p>';
  },
  bind(){
    const s=App.states.bst;
    panel.querySelector('#bstInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelector('#bstAvl').addEventListener('change',e=>{
      s.avl=e.target.checked;
      if(s.values.length){this.rebuild();API.rerender();}
      API.save();
      API.log('info','AVL 模式 '+(s.avl?'开启':'关闭'));
    });
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){s.values=parseNums(s.input);this.rebuild();API.rerender();API.log('build','构建 BST：'+s.values.length+' 个节点');}
        else if(act==='clear'){s.values=[];s.root=null;API.rerender();API.log('info','已清空');}
        else if(act==='insert'||act==='delete'||act==='find'){
          const v=Number(panel.querySelector('#bstVal').value);
          if(isNaN(v)){API.log('error','请输入有效数字');return;}
          if(act==='insert'){if(s.values.includes(v)){API.log('error',v+' 已存在');return;}s.values.push(v);s.input=s.values.join(',');panel.querySelector('#bstInput').value=s.input;this.rebuild();API.rerender();API.log('insert','插入 '+v);}
          else if(act==='delete'){if(!s.values.includes(v)){API.log('error',v+' 不存在');return;}s.values=s.values.filter(x=>x!==v);s.input=s.values.join(',');panel.querySelector('#bstInput').value=s.input;this.rebuild();API.rerender();API.log('delete','删除 '+v);}
          else{this.find(v);}
          API.save();
        }
        else if(act==='inorder'){this.inorder();}
      });
    });
  },
  rebuild(){
    const s=App.states.bst;s.root=null;s.found=null;
    for(const v of s.values){s.root=this.insertNode(s.root,v,s.avl);}
  },
  insertNode(node,v,avl){
    if(!node)return{val:v,left:null,right:null,h:1};
    if(v<node.val)node.left=this.insertNode(node.left,v,avl);
    else if(v>node.val)node.right=this.insertNode(node.right,v,avl);
    else return node;
    if(avl){
      node.h=1+Math.max(this.hgt(node.left),this.hgt(node.right));
      const bf=this.hgt(node.left)-this.hgt(node.right);
      if(bf>1&&v<node.left.val)return this.rotR(node);
      if(bf<-1&&v>node.right.val)return this.rotL(node);
      if(bf>1&&v>node.left.val){node.left=this.rotL(node.left);return this.rotR(node);}
      if(bf<-1&&v<node.right.val){node.right=this.rotR(node.right);return this.rotL(node);}
    }
    return node;
  },
  hgt(n){return n?n.h:0;},
  rotR(y){const x=y.left,T=x.right;x.right=y;y.left=T;if(App.states.bst.avl){y.h=1+Math.max(this.hgt(y.left),this.hgt(y.right));x.h=1+Math.max(this.hgt(x.left),this.hgt(x.right));}return x;},
  rotL(x){const y=x.right,T=y.left;y.left=x;x.right=T;if(App.states.bst.avl){x.h=1+Math.max(this.hgt(x.left),this.hgt(x.right));y.h=1+Math.max(this.hgt(y.left),this.hgt(y.right));}return y;},
  find(v){
    const s=App.states.bst;s.found=v;let cur=s.root,path=[];
    while(cur){path.push(cur.val);if(v===cur.val)break;cur=v<cur.val?cur.left:cur.right;}
    if(path[path.length-1]===v)API.log('find','查找 '+v+'：路径 ['+path.join(' → ')+']');
    else{API.log('find','查找 '+v+'：未找到');}
    API.rerender();
    setTimeout(()=>{s.found=null;API.rerender();},1800);
  },
  inorder(){
    const s=App.states.bst;const res=[];
    (function go(n){if(!n)return;go(n.left);res.push(n.val);go(n.right);})(s.root);
    API.log('traverse','中序遍历：['+res.join(', ')+']');
  },
  render(){
    const s=App.states.bst;clear(content);
    if(!s.root){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    let idx=0;const nodes=[];
    (function io(n,d){if(!n)return;io(n.left,d+1);n._i=idx++;n._d=d;nodes.push(n);io(n.right,d+1);})(s.root,0);
    const xStep=Math.max(48,Math.min(70,820/Math.max(nodes.length,1))),yStep=68,x0=40,y0=50;
    let maxX=0,maxY=0,minX=1e9;
    nodes.forEach(n=>{n.x=x0+n._i*xStep;n.y=y0+n._d*yStep;maxX=Math.max(maxX,n.x);maxY=Math.max(maxY,n.y);minX=Math.min(minX,n.x);});
    // edges
    (function edges(n){if(!n)return;edges(n.left);if(n.left)drawEdge(content,n.x,n.y,n.left.x,n.left.y);if(n.right)drawEdge(content,n.x,n.y,n.right.x,n.right.y);edges(n.right);})(s.root);
    // nodes
    nodes.forEach(n=>{
      const opts={};
      if(s.found!==null&&n.val===s.found)opts.cls='found';
      drawNode(content,n.x,n.y,n.val,opts);
    });
    const stats=panel.querySelector('#bstStats');
    if(stats){const h=this.treeH(s.root);stats.innerHTML='<div class="stat-row"><span>节点数</span><b>'+nodes.length+'</b></div><div class="stat-row"><span>树高度</span><b>'+h+'</b></div><div class="stat-row"><span>平衡因子</span><b>'+(s.avl?'AVL':'—')+'</b></div>';}
    return{minX:minX-30,minY:y0-40,maxX:maxX+30,maxY:maxY+30};
  },
  treeH(n){return n?1+Math.max(this.treeH(n.left),this.treeH(n.right)):0;}
});

  },
  bind(){
    const s=App.states.heap;
    panel.querySelector('#heapInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){s.arr=parseNums(s.input);this.buildHeap();API.rerender();API.log('build','构建'+(s.isMax?'最大':'最小')+'堆：'+s.arr.join(', '));}
        else if(act==='clear'){s.arr=[];API.rerender();API.log('info','已清空');}
        else if(act==='insert'){const v=Number(panel.querySelector('#heapVal').value);if(isNaN(v)){API.log('error','请输入数字');return;}s.arr.push(v);s.input=s.arr.join(',');panel.querySelector('#heapInput').value=s.input;this.siftUp(s.arr.length-1);API.rerender();API.log('insert','insert '+v+' → 上浮修复');API.save();}
        else if(act==='extract'){if(!s.arr.length){API.log('error','堆为空');return;}const top=s.arr[0];s.arr[0]=s.arr.pop();if(s.arr.length)this.siftDown(0);s.input=s.arr.join(',');panel.querySelector('#heapInput').value=s.input;API.rerender();API.log('delete','extract '+top+' → 下沉修复');API.save();}
        else if(act==='heapify'){s.arr=parseNums(s.input);this.buildHeap();API.rerender();API.log('build','heapify：自底向下建堆');API.save();}
        else if(act==='max'){s.isMax=true;if(s.arr.length){this.buildHeap();API.rerender();}this.refreshBtns();API.log('info','切换为最大堆');API.save();}
        else if(act==='min'){s.isMax=false;if(s.arr.length){this.buildHeap();API.rerender();}this.refreshBtns();API.log('info','切换为最小堆');API.save();}

  refreshBtns(){

    panel.querySelector('[data-act=min]').classList.toggle('active-state',!s.isMax);
  },
  cmp(a,b){return s_isMax()?a>b:a<b;},
  buildHeap(){const s=App.states.heap;for(let i=(s.arr.length>>1)-1;i>=0;i--)this.siftDown(i);},
  siftUp(i){const s=App.states.heap;while(i>0){const p=(i-1)>>1;if(this.cmp(s.arr[i],s.arr[p])){[s.arr[i],s.arr[p]]=[s.arr[p],s.arr[i]];i=p;}else break;}},
  siftDown(i){const s=App.states.heap;const n=s.arr.length;while(true){let b=i;const l=2*i+1,r=2*i+2;if(l<n&&this.cmp(s.arr[l],s.arr[b]))b=l;if(r<n&&this.cmp(s.arr[r],s.arr[b]))b=r;if(b!==i){[s.arr[i],s.arr[b]]=[s.arr[b],s.arr[i]];i=b;}else break;}},
  render(){
    const s=App.states.heap;clear(content);
    if(!s.arr.length){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    const n=s.arr.length;
    const levels=Math.floor(Math.log2(n))+1;
    const yStep=70,x0=40,y0=50;
    const pos=i=>{const level=Math.floor(Math.log2(i+1));const levelStart=(1<<level)-1;const posInLevel=i-levelStart;const nodesInLevel=1<<level;const levelW=900;const sp=levelW/nodesInLevel;return{x:x0+sp*(posInLevel+0.5),y:y0+level*yStep};};
    // edges
    for(let i=1;i<n;i++){const p=pos((i-1)>>1),c=pos(i);drawEdge(content,p.x,p.y,c.x,c.y);}
    // nodes
    let maxX=0,maxY=0,minX=1e9;
    s.arr.forEach((v,i)=>{const p=pos(i);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);minX=Math.min(minX,p.x);const opts={sub:'['+i+']'};if(i===0)opts.cls='hi';drawNode(content,p.x,p.y,v,opts);});
    // array representation below
    const arrY=maxY+70;const cellW=42,cellH=34,startX=Math.max(40,(maxX+minX)/2-(n*cellW)/2);
    const arrLabel=el('text',{x:startX,y:arrY-10,class:'arr-idx'});arrLabel.textContent='array:';content.appendChild(arrLabel);
    s.arr.forEach((v,i)=>{
      const cx=startX+i*cellW;
      const r=el('rect',{x:cx,y:arrY,width:cellW-3,height:cellH,rx:4,class:'arr-cell'+(i===0?' hi':'')});content.appendChild(r);
      const t=el('text',{x:cx+(cellW-3)/2,y:arrY+cellH/2,'text-anchor':'middle','dominant-baseline':'central',class:'arr-text'});t.textContent=v;content.appendChild(t);
      const idx=el('text',{x:cx+(cellW-3)/2,y:arrY+cellH+12,'text-anchor':'middle',class:'arr-idx'});idx.textContent=i;content.appendChild(idx);
    });
    return{minX:minX-30,minY:y0-40,maxX:Math.max(maxX,startX+n*cellW)+20,maxY:arrY+cellH+30};
  }
});

register('graph',{
  label:'Graph',title:'图',
  defaultInput:'A-B,B-C,B-D,C-D,C-E,D-E,A-C,B-E',
  buildState(){return{input:this.defaultInput,nodes:[],edges:[],adj:{},directed:false,mode:'none',hl:{nodes:new Set(),edges:new Set()},startNode:'A',endNode:'E'};},
  panelHTML(){

      '<p class="info-text" style="margin-bottom:6px">格式 <code>A-B</code> 或带权 <code>A-B:5</code></p>'+

      '<div class="btn-row" style="margin-top:8px">'+

        '<button class="btn" data-act="clear">清空</button>'+
      '</div>'+

      '<div class="inline-row"><input type="text" class="input-line" id="gStart" value="'+esc(s.startNode)+'" placeholder="起点"></div>'+
      '<div class="inline-row" style="margin-top:6px"><input type="text" class="input-line" id="gEnd" value="'+esc(s.endNode)+'" placeholder="终点(路径)"></div>'+
      '<div class="ops-grid" style="margin-top:8px">'+
        '<button class="btn" data-act="bfs">BFS</button>'+
        '<button class="btn" data-act="dfs">DFS</button>'+
        '<button class="btn" data-act="path">最短路径</button>'+
        '<button class="btn" data-act="mst">最小生成树</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">参数</div>'+
      '<label class="check-row"><input type="checkbox" id="gDir" '+(s.directed?'checked':'')+'> 有向图</label>'+
      '<div class="btn-row" style="margin-top:6px"><button class="btn sm" data-act="relayout">重新布局</button>'+
      '<button class="btn sm" data-act="reset">清除高亮</button></div>'+
      '<div class="section-label" style="margin-top:14px">说明</div>'+
      '<p class="info-text">力导向布局。BFS/DFS 高亮遍历顺序，Dijkstra 求最短路径，Kruskal 求最小生成树（无向）。</p>';
  },
  bind(){
    const s=App.states.graph;
    panel.querySelector('#gInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelector('#gStart').addEventListener('input',e=>{s.startNode=e.target.value;});
    panel.querySelector('#gEnd').addEventListener('input',e=>{s.endNode=e.target.value;});
    panel.querySelector('#gDir').addEventListener('change',e=>{s.directed=e.target.checked;if(s.nodes.length){this.build();API.rerender();}API.save();});
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){this.build();API.rerender();API.log('build','构建图：'+s.nodes.length+' 节点，'+s.edges.length+' 边');}
        else if(act==='clear'){s.nodes=[];s.edges=[];s.adj={};API.rerender();API.log('info','已清空');}
        else if(act==='relayout'){this.forceLayout();API.rerender();API.log('info','重新力导向布局');}
        else if(act==='reset'){s.mode='none';s.hl={nodes:new Set(),edges:new Set()};API.rerender();}
        else if(act==='bfs'){this.runBFS();}
        else if(act==='dfs'){this.runDFS();}
        else if(act==='path'){this.runPath();}
        else if(act==='mst'){this.runMST();}
      });
    });
  },
  build(){
    const s=App.states.graph;
    const edges=this.parseEdges();
    s.edges=edges;
    const set=new Set();
    edges.forEach(e=>{set.add(e.from);set.add(e.to);});
    s.nodes=[...set].map(id=>({id,x:0,y:0,vx:0,vy:0}));
    // adjacency
    s.adj={};s.nodes.forEach(n=>s.adj[n.id]=[]);
    edges.forEach(e=>{
      s.adj[e.from].push({to:e.to,w:e.w});
      if(!s.directed)s.adj[e.to].push({to:e.from,w:e.w});
    });
    this.forceLayout();
    s.startNode=s.nodes[0]?s.nodes[0].id:'A';
    const startInput=panel.querySelector('#gStart');if(startInput)startInput.value=s.startNode;
  },
  parseEdges(){
    const s=App.states.graph;const out=[];
    String(s.input).split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
      const m=p.match(/^(\w+)\s*-\s*(\w+)(?::(\d+))?$/);
      if(m)out.push({from:m[1],to:m[2],w:m[3]?Number(m[3]):1});
    });
    return out;
  },
  forceLayout(){
    const s=App.states.graph;const N=s.nodes.length;if(!N)return;
    const W=900,H=520;
    s.nodes.forEach((n,i)=>{n.x=W/2+200*Math.cos(2*Math.PI*i/N);n.y=H/2+200*Math.sin(2*Math.PI*i/N);n.vx=0;n.vy=0;});
    const k=Math.sqrt(W*H/N)*0.8;
    const idx={};s.nodes.forEach((n,i)=>idx[n.id]=i);
    const iters=180;
    for(let it=0;it<iters;it++){
      const disp=s.nodes.map(()=>({x:0,y:0}));
      for(let i=0;i<N;i++){
        for(let j=0;j<N;j++){
          if(i===j)continue;
          let dx=s.nodes[i].x-s.nodes[j].x,dy=s.nodes[i].y-s.nodes[j].y;
          let d=Math.max(0.5,Math.sqrt(dx*dx+dy*dy));
          const f=k*k/d;
          disp[i].x+=dx/d*f;disp[i].y+=dy/d*f;
        }
      }
      s.edges.forEach(e=>{
        const a=idx[e.from],b=idx[e.to];if(a===undefined||b===undefined)return;
        let dx=s.nodes[b].x-s.nodes[a].x,dy=s.nodes[b].y-s.nodes[a].y;
        let d=Math.max(0.5,Math.sqrt(dx*dx+dy*dy));
        const f=d*d/k;
        disp[a].x+=dx/d*f;disp[a].y+=dy/d*f;
        disp[b].x-=dx/d*f;disp[b].y-=dy/d*f;
      });
      const t=(1-it/iters)*40;
      s.nodes.forEach((n,i)=>{
        const dl=Math.max(0.5,Math.sqrt(disp[i].x**2+disp[i].y**2));
        n.x+=disp[i].x/dl*Math.min(dl,t);
        n.y+=disp[i].y/dl*Math.min(dl,t);
        n.x=clamp(n.x,50,W-50);n.y=clamp(n.y,50,H-50);
      });
    }
  },
  runBFS(){
    const s=App.states.graph;const start=s.startNode;
    if(!s.adj[start]){API.log('error','起点不存在');return;}
    const visited=new Set([start]);const order=[];const q=[start];
    while(q.length){const n=q.shift();order.push(n);(s.adj[n]||[]).forEach(e=>{if(!visited.has(e.to)){visited.add(e.to);q.push(e.to);}});}
    s.mode='bfs';s.hl={nodes:new Set(order),edges:new Set()};
    s._order={};order.forEach((n,i)=>s._order[n]=i+1);
    API.rerender();API.log('traverse','BFS 从 '+start+'：['+order.join(' → ')+']');
  },
  runDFS(){
    const s=App.states.graph;const start=s.startNode;
    if(!s.adj[start]){API.log('error','起点不存在');return;}
    const visited=new Set();const order=[];
    (function go(n){visited.add(n);order.push(n);(s.adj[n]||[]).forEach(e=>{if(!visited.has(e.to))go(e.to);});})(start);
    s.mode='dfs';s.hl={nodes:new Set(order),edges:new Set()};
    s._order={};order.forEach((n,i)=>s._order[n]=i+1);
    API.rerender();API.log('traverse','DFS 从 '+start+'：['+order.join(' → ')+']');
  },
  runPath(){
    const s=App.states.graph;const start=s.startNode,end=s.endNode;
    if(!s.adj[start]||!s.adj[end]){API.log('error','起点或终点不存在');return;}
    const dist={},prev={};s.nodes.forEach(n=>{dist[n.id]=Infinity;prev[n.id]=null;});
    dist[start]=0;const pq=[[0,start]];
    while(pq.length){pq.sort((a,b)=>a[0]-b[0]);const[d,u]=pq.shift();if(u===end)break;if(d>dist[u])continue;(s.adj[u]||[]).forEach(e=>{const nd=d+e.w;if(nd<dist[e.to]){dist[e.to]=nd;prev[e.to]=u;pq.push([nd,e.to]);}});}
    const path=[];let cur=end;let ok=true;
    while(cur){path.unshift(cur);if(cur===start)break;cur=prev[cur];if(cur===null&&path[0]!==start){ok=false;break;}}
    if(!ok||dist[end]===Infinity){API.log('error',start+' → '+end+' 不可达');return;}
    s.mode='path';const ns=new Set(path),es=new Set();
    for(let i=0;i<path.length-1;i++)es.add(path[i]+'|'+path[i+1]);
    s.hl={nodes:ns,edges:es};
    API.rerender();API.log('find','最短路径 '+start+'→'+end+'：['+path.join(' → ')+'] 距离='+dist[end]);
  },
  runMST(){
    const s=App.states.graph;
    if(s.directed){API.log('error','MST 仅支持无向图');return;}
    const parent={};s.nodes.forEach(n=>parent[n.id]=n.id);
    const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
    const sorted=s.edges.slice().sort((a,b)=>(a.w||1)-(b.w||1));
    const mst=[];let total=0;
    sorted.forEach(e=>{const a=find(e.from),b=find(e.to);if(a!==b){mst.push(e);total+=e.w||1;parent[a]=b;}});
    s.mode='mst';const es=new Set();mst.forEach(e=>{es.add(e.from+'|'+e.to);es.add(e.to+'|'+e.from);});
    s.hl={nodes:new Set(),edges:es};
    API.rerender();API.log('build','MST (Kruskal)：'+mst.length+' 条边，总权='+total);
  },
  render(){
    const s=App.states.graph;clear(content);
    if(!s.nodes.length){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    const pos={};s.nodes.forEach(n=>pos[n.id]=n);
    // edges
    let minX=1e9,minY=1e9,maxX=0,maxY=0;
    s.nodes.forEach(n=>{minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x);maxY=Math.max(maxY,n.y);});
    const R=20;
    s.edges.forEach(e=>{
      const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
      let dx=b.x-a.x,dy=b.y-a.y;const d=Math.max(0.01,Math.sqrt(dx*dx+dy*dy));
      dx/=d;dy/=d;
      const x1=a.x+dx*R,y1=a.y+dy*R,x2=b.x-dx*R,y2=b.y-dy*R;
      const isHi=s.hl.edges.has(e.from+'|'+e.to)||s.hl.edges.has(e.to+'|'+e.from);
      drawEdge(content,x1,y1,x2,y2,{cls:isHi?'path':'',arrow:s.directed,dashed:false});
      if(e.w!==1){const mx=(x1+x2)/2,my=(y1+y2)/2;const t=el('text',{x:mx,y:my-4,'text-anchor':'middle',class:'edge-label'+(isHi?' hi':'')});t.textContent=e.w;content.appendChild(t);}
    });
    // nodes
    s.nodes.forEach(n=>{
      const isHi=s.hl.nodes.has(n.id);
      const opts={id:n.id,sub:(s.mode==='bfs'||s.mode==='dfs')&&s._order&&s._order[n.id]?('#'+s._order[n.id]):null};
      if(isHi)opts.cls='hi';
      if(n.id===s.startNode&&s.mode==='none')opts.cls='hi';
      drawNode(content,n.x,n.y,n.id,opts);
    });
    return{minX:minX-40,minY:minY-40,maxX:maxX+40,maxY:maxY+40};
  }
});

register('hash',{
  label:'Hash',title:'哈希表',
  defaultInput:'apple:5,banana:2,cherry:8,date:3,elderberry:1,fig:7,grape:4',
  buildState(){return{input:this.defaultInput,pairs:[],size:7,mode:'chain',fn:'mod',lastKey:null};},
  panelHTML(){
    const s=App.states.hash;
    return '<div class="section-label">键值对输入</div>'+
      '<p class="info-text" style="margin-bottom:6px">格式 <code>key:value</code></p>'+
      '<textarea class="input-area" id="hInput">'+esc(s.input)+'</textarea>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn primary" data-act="build">构建</button>'+
        '<button class="btn" data-act="clear">清空</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">操作</div>'+
      '<div class="inline-row"><input type="text" class="input-line" id="hKey" placeholder="key"></div>'+
      '<div class="inline-row" style="margin-top:6px"><input type="text" class="input-line" id="hVal" placeholder="value"></div>'+
      '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn" data-act="insert">插入</button>'+
        '<button class="btn" data-act="delete">删除</button>'+
        '<button class="btn" data-act="find">查找</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">参数</div>'+
      '<div class="field"><label>桶大小</label><input type="number" class="input-line" id="hSize" value="'+s.size+'" min="3" max="30"></div>'+
      '<div class="field"><label>冲突处理</label><select class="input-line" id="hMode"><option value="chain"'+(s.mode==='chain'?' selected':'')+'>链地址法</option><option value="open"'+(s.mode==='open'?' selected':'')+'>开放地址(线性探测)</option></select></div>'+
      '<div class="field"><label>哈希函数</label><select class="input-line" id="hFn"><option value="mod"'+(s.fn==='mod'?' selected':'')+'>取模 hash%size</option><option value="mul"'+(s.fn==='mul'?' selected':'')+'>乘法 hash*0.618</option><option value="knuth"'+(s.fn==='knuth'?' selected':'')+'>Knuth 乘法</option></select></div>'+
      '<div class="section-label" style="margin-top:14px">说明</div>'+
      '<p class="info-text">展示哈希函数计算与桶分布。链地址法用链表处理冲突，开放地址法线性探测下一个空桶。</p>';
  },
  bind(){
    const s=App.states.hash;
    panel.querySelector('#hInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelector('#hSize').addEventListener('change',e=>{s.size=clamp(Number(e.target.value)||7,3,30);this.build();API.rerender();API.save();});
    panel.querySelector('#hMode').addEventListener('change',e=>{s.mode=e.target.value;this.build();API.rerender();API.save();});
    panel.querySelector('#hFn').addEventListener('change',e=>{s.fn=e.target.value;this.build();API.rerender();API.save();});
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){this.build();API.rerender();API.log('build','构建哈希表：'+s.pairs.length+' 项');}
        else if(act==='clear'){s.pairs=[];s.input='';panel.querySelector('#hInput').value='';API.rerender();API.log('info','已清空');API.save();}
        else if(act==='insert'){
          const k=panel.querySelector('#hKey').value.trim(),v=panel.querySelector('#hVal').value.trim();
          if(!k){API.log('error','请输入 key');return;}
          s.pairs=s.pairs.filter(p=>p.k!==k);s.pairs.push({k,v});
          s.input=s.pairs.map(p=>p.k+':'+p.v).join(',');panel.querySelector('#hInput').value=s.input;
          s.lastKey=k;API.rerender();API.log('hash','插入 '+k+'→'+v+'，hash='+this.hash(k));API.save();
        }
        else if(act==='delete'){
          const k=panel.querySelector('#hKey').value.trim();
          if(!s.pairs.find(p=>p.k===k)){API.log('error',k+' 不存在');return;}
          s.pairs=s.pairs.filter(p=>p.k!==k);
          s.input=s.pairs.map(p=>p.k+':'+p.v).join(',');panel.querySelector('#hInput').value=s.input;
          API.rerender();API.log('delete','删除 '+k);API.save();
        }
        else if(act==='find'){
          const k=panel.querySelector('#hKey').value.trim();
          s.lastKey=k;API.rerender();
          const p=s.pairs.find(x=>x.k===k);
          if(p)API.log('find','查找 '+k+'：找到 value='+p.v+'，hash='+this.hash(k));
          else API.log('find','查找 '+k+'：未找到，hash='+this.hash(k));
          setTimeout(()=>{s.lastKey=null;API.rerender();},1800);
        }
      });
    });
  },
  hash(key){
    const s=App.states.hash;let n;
    if(/^-?\d+$/.test(key))n=Number(key);
    else{n=0;for(let i=0;i<key.length;i++)n=(n*31+key.charCodeAt(i))>>>0;}
    if(s.fn==='mod')return((n%s.size)+s.size)%s.size;
    if(s.fn==='mul')return Math.floor(s.size*((n*0.6180339887)%1));
    return((n*2654435761)>>>0)%s.size;
  },
  build(){
    const s=App.states.hash;
    const pairs=[];String(s.input).split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
      const i=p.indexOf(':');if(i>0)pairs.push({k:p.slice(0,i).trim(),v:p.slice(i+1).trim()});
    });
    s.pairs=pairs;
  },
  render(){
    const s=App.states.hash;clear(content);
    if(!s.pairs.length&&!s.size){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    const size=s.size;
    const buckets=[];
    for(let i=0;i<size;i++)buckets.push([]);
    if(s.mode==='chain'){
      s.pairs.forEach(p=>{buckets[this.hash(p.k)].push(p);});
    }else{
      const table=new Array(size).fill(null);
      s.pairs.forEach(p=>{
        let h=this.hash(p.k),i=0;
        while(table[h]!==null&&table[h].k!==p.k){i++;h=(h+1)%size;if(i>size*2)break;}
        table[h]=p;
      });
      for(let i=0;i<size;i++)if(table[i])buckets[i].push(table[i]);
    }
    const colW=120,colX=60,colY=40,rowH=44;
    // title
    const ttl=el('text',{x:colX,y:colY-14,class:'arr-idx'});ttl.textContent='bucket array ['+size+']  '+(s.mode==='chain'?'链地址':'开放地址');content.appendChild(ttl);
    let maxY=colY;
    buckets.forEach((bucket,i)=>{
      const y=colY+i*rowH;
      const isHi=s.lastKey!==null&&this.hash(s.lastKey)===i;
      const r=el('rect',{x:colX,y:y,width:50,height:32,rx:5,class:'bucket-rect'+(isHi?' hi':'')});content.appendChild(r);
      const it=el('text',{x:colX+25,y:y+16,'text-anchor':'middle','dominant-baseline':'central',class:'arr-text'});it.textContent=i;content.appendChild(it);
      const arr=el('text',{x:colX+58,y:y+16,'dominant-baseline':'central',class:'arr-idx'});arr.textContent='→';content.appendChild(arr);
      let cx=colX+80;
      if(!bucket.length){const e=el('text',{x:cx,y:y+16,'dominant-baseline':'central',class:'arr-idx'});e.textContent='∅ (empty)';content.appendChild(e);}
      bucket.forEach((p,j)=>{
        const isFound=s.lastKey===p.k;
        const cell=el('rect',{x:cx,y:y+2,width:colW,height:28,rx:4,class:'bucket-rect'+(isFound?' hi':'')});content.appendChild(cell);
        const t=el('text',{x:cx+colW/2,y:y+16,'text-anchor':'middle','dominant-baseline':'central',class:'arr-text'});t.textContent=p.k+':'+p.v;content.appendChild(t);
        cx+=colW+6;
        if(j<bucket.length-1){const ar=el('text',{x:cx-3,y:y+16,'dominant-baseline':'central',class:'arr-idx'});ar.textContent='→';content.appendChild(ar);}
      });
      maxY=y+32;
    });
    // hash calc for lastKey
    if(s.lastKey!==null){
      const info=el('text',{x:colX,y:maxY+30,class:'link-text'});info.textContent='hash("'+s.lastKey+'") = '+this.hash(s.lastKey);content.appendChild(info);
      maxY+=40;
    }
    return{minX:colX-20,minY:colY-30,maxX:colX+80+buckets.length*0+900,maxY:maxY+20};
  }
});

register('skip',{
  label:'Skip',title:'跳表',
  defaultInput:'3,6,7,9,12,17,19,21,25,26',
  buildState(){return{input:this.defaultInput,head:null,maxLevel:0,values:[],searchPath:[],searchTarget:null};},
  panelHTML(){
    return '<div class="section-label">数据输入</div>'+
      '<textarea class="input-area" id="skInput">'+esc(App.states.skip.input)+'</textarea>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn primary" data-act="build">构建</button>'+
        '<button class="btn" data-act="clear">清空</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">操作</div>'+
      '<div class="inline-row"><input type="text" class="input-line" id="skVal" placeholder="数字"></div>'+
      '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn" data-act="insert">插入</button>'+
        '<button class="btn" data-act="delete">删除</button>'+
        '<button class="btn" data-act="find">查找路径</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">说明</div>'+
      '<p class="info-text">多级索引链表，期望 O(log n) 查找。查找从最高层开始，向右走到不超过目标的最大值再下降。<code>p=0.5</code> 随机层数。</p>';
  },
  bind(){
    const s=App.states.skip;
    panel.querySelector('#skInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){s.values=parseNums(s.input);this.rebuild();API.rerender();API.log('build','构建跳表：'+s.values.length+' 元素，最高 '+s.maxLevel+' 层');}
        else if(act==='clear'){s.values=[];s.head=null;s.maxLevel=0;API.rerender();API.log('info','已清空');}
        else if(act==='insert'||act==='delete'||act==='find'){
          const v=Number(panel.querySelector('#skVal').value);
          if(isNaN(v)){API.log('error','请输入数字');return;}
          if(act==='insert'){if(s.values.includes(v)){API.log('error',v+' 已存在');return;}s.values.push(v);s.values.sort((a,b)=>a-b);s.input=s.values.join(',');panel.querySelector('#skInput').value=s.input;this.rebuild();API.rerender();API.log('insert','插入 '+v);API.save();}
          else if(act==='delete'){if(!s.values.includes(v)){API.log('error',v+' 不存在');return;}s.values=s.values.filter(x=>x!==v);s.input=s.values.join(',');panel.querySelector('#skInput').value=s.input;this.rebuild();API.rerender();API.log('delete','删除 '+v);API.save();}
          else{this.search(v);}
        }
      });
    });
  },
  rebuild(){
    const s=App.states.skip;const vals=[...new Set(s.values)].sort((a,b)=>a-b);
    s.values=vals;
    s.head={val:-Infinity,forward:[]};
    const levels=vals.map(()=>{let lvl=0;while(Math.random()<0.5&&lvl<8)lvl++;return lvl;});
    s.maxLevel=vals.length?Math.max(0,...levels):0;
    for(let l=0;l<=s.maxLevel;l++)s.head.forward[l]=null;
    const nodes=vals.map((v,i)=>{const node={val:v,forward:[]};for(let l=0;l<=levels[i];l++)node.forward[l]=null;return{node,level:levels[i]};});
    for(let l=s.maxLevel;l>=0;l--){
      let prev=s.head;
      nodes.forEach(({node,level})=>{
        if(level>=l){prev.forward[l]=node;prev=node;}
      });
    }
    s._levels=levels;s._nodes=nodes;
  },
  search(v){
    const s=App.states.skip;s.searchTarget=v;s.searchPath=[];
    if(!s.head){API.log('error','跳表为空');return;}
    let cur=s.head;const path=[];
    for(let l=s.maxLevel;l>=0;l--){
      while(cur.forward[l]&&cur.forward[l].val<v){cur=cur.forward[l];path.push({node:cur,level:l});}
      path.push({node:cur,level:l,drop:true});
    }
    cur=cur.forward[0];
    s.searchPath=path;
    API.rerender();
    if(cur&&cur.val===v)API.log('find','查找 '+v+'：找到，经过 '+path.length+' 步');
    else API.log('find','查找 '+v+'：未找到');
    setTimeout(()=>{s.searchPath=[];s.searchTarget=null;API.rerender();},2500);
  },
  render(){
    const s=App.states.skip;clear(content);
    if(!s.head||!s._nodes||!s._nodes.length){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    const x0=70,xStep=66,y0=40,yStep=50;
    const pos=new Map();
    pos.set(s.head,x0-40);
    s._nodes.forEach((item,i)=>pos.set(item.node,x0+i*xStep));
    const pathSet=new Set();
    s.searchPath.forEach(p=>pathSet.add(p.node));
    let maxY=0;
    for(let l=s.maxLevel;l>=0;l--){
      const y=y0+(s.maxLevel-l)*yStep;
      maxY=Math.max(maxY,y);
      // head
      const headHi=pathSet.has(s.head);
      const hr=el('rect',{x:pos.get(s.head)-26,y:y-14,width:52,height:28,rx:5,class:'bucket-rect'+(headHi?' hi':'')});content.appendChild(hr);
      const ht=el('text',{x:pos.get(s.head),y:y,'text-anchor':'middle','dominant-baseline':'central',class:'arr-text'});ht.textContent='HEAD';content.appendChild(ht);
      // nodes on this level
      let cur=s.head;const row=[s.head];
      while(cur.forward[l]){cur=cur.forward[l];row.push(cur);}
      for(let i=0;i<row.length-1;i++){
        const a=row[i],b=row[i+1];
        const hi=pathSet.has(a)&&pathSet.has(b);
        drawEdge(content,pos.get(a)+26,y,pos.get(b)-26,y,{cls:hi?'path':'',arrow:true});
      }
      row.forEach(n=>{
        if(n===s.head)return;
        const hi=pathSet.has(n);
        const found=s.searchTarget!==null&&n.val===s.searchTarget;
        const r=el('rect',{x:pos.get(n)-22,y:y-14,width:44,height:28,rx:5,class:'bucket-rect'+(hi?' hi':'')+(found?' hi':'')});content.appendChild(r);
        const t=el('text',{x:pos.get(n),y:y,'text-anchor':'middle','dominant-baseline':'central',class:'arr-text'});t.textContent=n.val;content.appendChild(t);
      });
    }
    // level labels
    for(let l=s.maxLevel;l>=0;l--){
      const y=y0+(s.maxLevel-l)*yStep;
      const lb=el('text',{x:10,y:y+4,class:'arr-idx'});lb.textContent='L'+l;content.appendChild(lb);
    }
    const maxX=x0+s._nodes.length*xStep;
    return{minX:0,minY:y0-30,maxX:maxX+30,maxY:maxY+40};
  }
});

        else{
          const w=panel.querySelector('#trWord').value.trim().toLowerCase();
          if(!w){API.log('error','请输入单词');return;}
          if(act==='insert'){if(!s.words.includes(w)){s.words.push(w);s.input=s.words.join(',');panel.querySelector('#trInput').value=s.input;this.build();API.rerender();API.log('insert','插入 "'+w+'"');API.save();}else API.log('error','"'+w+'" 已存在');}
          else if(act==='delete'){if(!s.words.includes(w)){API.log('error','"'+w+'" 不存在');return;}s.words=s.words.filter(x=>x!==w);s.input=s.words.join(',');panel.querySelector('#trInput').value=s.input;this.build();API.rerender();API.log('delete','删除 "'+w+'"');API.save();}
          else if(act==='search'){this.prefixSearch(w);}
        }
      });
    });
  },
  build(){
    const s=App.states.trie;
    s.root={children:{},end:false,char:'^'};
    s.words.forEach(w=>{
      let cur=s.root;
      for(const c of w){if(!cur.children[c])cur.children[c]={children:{},end:false,char:c};cur=cur.children[c];}
      cur.end=true;
    });
    s.prefix='';
  },
  prefixSearch(p){
    const s=App.states.trie;s.prefix=p;
    this.clearHl(s.root);
    if(!s.root){API.log('error','Trie 为空');return;}
    let cur=s.root;cur._hl=true;
    for(const c of p){
      if(!cur.children[c]){API.log('find','前缀 "'+p+'"：无匹配');API.rerender();return;}
      cur=cur.children[c];cur._hl=true;
    }
    const found=[];
    (function collect(node,word){
      if(node.end)found.push(word);
      for(const k in node.children)collect(node.children[k],word+k);
    })(cur,p);
    API.rerender();
    API.log('find','前缀 "'+p+'"：匹配 '+found.length+' 词 ['+found.slice(0,8).join(', ')+(found.length>8?'…':'')+']');
  },
  clearHl(n){if(!n)return;n._hl=false;for(const k in n.children)this.clearHl(n.children[k]);},
  render(){
    const s=App.states.trie;clear(content);
    if(!s.root){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    let idx=0;const xStep=40,x0=40,yStep=54,y0=40;
    (function assign(node,depth){
      node.depth=depth;node.y=y0+depth*yStep;
      const keys=Object.keys(node.children);
      if(!keys.length){node.x=x0+(idx++)*xStep;return node.x;}
      let sum=0;keys.forEach(k=>{sum+=assign(node.children[k],depth+1);});
      node.x=sum/keys.length;return node.x;
    })(s.root,0);
    let maxX=0,maxY=0,minX=1e9;
    (function walk(n){
      minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);maxY=Math.max(maxY,n.y);
      for(const k in n.children){
        const c=n.children[k];
        const isHi=!!n._hl&&!!c._hl;
        drawEdge(content,n.x,n.y,c.x,c.y,{cls:isHi?'path':''});
        const mx=(n.x+c.x)/2,my=(n.y+c.y)/2;
        const lb=el('text',{x:mx,y:my-4,'text-anchor':'middle',class:'edge-label'+(isHi?' hi':'')});lb.textContent=k;content.appendChild(lb);
        walk(c);
      }
    })(s.root);
    (function walk2(n){
      const isHi=!!n._hl;
      const r=n.end?15:12;
      const grp=el('g',{class:'node'+(isHi?' hi':''),transform:'translate('+n.x+','+n.y+')'});
      const c=el('circle',{r:r,class:'node-circle'});
      if(n.end)c.setAttribute('fill','#059669');
      if(n.end)c.setAttribute('stroke','#059669');
      grp.appendChild(c);
      const t=el('text',{'text-anchor':'middle','dominant-baseline':'central',class:'node-text'});
      t.textContent=n.char==='^'?'$':n.char;
      if(n.end)t.setAttribute('fill','#04130d');
      grp.appendChild(t);
      content.appendChild(grp);
      for(const k in n.children)walk2(n.children[k]);
    })(s.root);
    return{minX:minX-30,minY:y0-40,maxX:maxX+30,maxY:maxY+30};
  }
});

   MODULE: Red-Black Tree
   ============================================================ */
let _rbEvents=[];
register('rb',{
  label:'RB Tree',title:'红黑树',
  defaultInput:'10,20,30,15,25,5,1,7,18,22,35,40',
  buildState(){return{input:this.defaultInput,root:null,values:[]};},
  panelHTML(){
    return '<div class="section-label">数据输入</div>'+
      '<textarea class="input-area" id="rbInput">'+esc(App.states.rb.input)+'</textarea>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn primary" data-act="build">构建</button>'+
        '<button class="btn" data-act="clear">清空</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">操作</div>'+
      '<div class="inline-row"><input type="text" class="input-line" id="rbVal" placeholder="数字"></div>'+
      '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn" data-act="insert">插入</button>'+
        '<button class="btn" data-act="delete">删除</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">图例</div>'+
      '<div class="legend">'+
        '<div class="li"><span class="sw" style="background:rgba(239,68,68,.14);border-color:#ef4444"></span>红节点</div>'+
        '<div class="li"><span class="sw" style="background:#14181c;border-color:#4b5563"></span>黑节点</div>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">说明</div>'+
      '<p class="info-text">自平衡 BST，5 条性质保证 O(log n)。插入触发旋转/重着色修复。<code>红节点的子节点必黑</code>，<code>等黑高</code>。</p>';
  },
  bind(){
    const s=App.states.rb;
    panel.querySelector('#rbInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){s.values=parseNums(s.input);this.rebuild();API.rerender();API.log('build','构建红黑树：'+s.values.length+' 节点');}
        else if(act==='clear'){s.values=[];s.root=null;API.rerender();API.log('info','已清空');}
        else if(act==='insert'){const v=Number(panel.querySelector('#rbVal').value);if(isNaN(v)){API.log('error','请输入数字');return;}if(s.values.includes(v)){API.log('error',v+' 已存在');return;}s.values.push(v);s.input=s.values.join(',');panel.querySelector('#rbInput').value=s.input;this.rebuild();API.rerender();API.log('insert','插入 '+v+_rbEvents.join('，'));_rbEvents=[];API.save();}
        else if(act==='delete'){const v=Number(panel.querySelector('#rbVal').value);if(isNaN(v)){API.log('error','请输入数字');return;}if(!s.values.includes(v)){API.log('error',v+' 不存在');return;}s.values=s.values.filter(x=>x!==v);s.input=s.values.join(',');panel.querySelector('#rbInput').value=s.input;this.rebuild();API.rerender();API.log('delete','删除 '+v+' (重建)');API.save();}
      });
    });
  },
  rebuild(){
    const s=App.states.rb;s.root=null;_rbEvents=[];
    const vals=[...new Set(s.values)];
    vals.forEach(v=>{s.root=this.insert(s.root,v);});
  },
  insert(root,val){
    const node={val,left:null,right:null,color:'R',parent:null};
    if(!root){node.color='B';return node;}
    let cur=root,p=null;
    while(cur){p=cur;cur=val<cur.val?cur.left:cur.right;}
    node.parent=p;
    if(val<p.val)p.left=node;else p.right=node;
    _rbEvents.push('插入 '+val+'(红)');
    this.fixup(node);
    while(root.parent)root=root.parent;
    root.color='B';
    return root;
  },
  fixup(n){
    while(n.parent&&n.parent.color==='R'){
      const gp=n.parent.parent;
      if(!gp)break;
      if(n.parent===gp.left){
        const u=gp.right;
        if(u&&u.color==='R'){n.parent.color='B';u.color='B';gp.color='R';_rbEvents.push('重着色');n=gp;}
        else{
          if(n===n.parent.right){n=n.parent;this.rotL(n);_rbEvents.push('左旋');}
          n.parent.color='B';n.parent.parent.color='R';this.rotR(n.parent.parent);_rbEvents.push('右旋');
        }
      }else{
        const u=gp.left;
        if(u&&u.color==='R'){n.parent.color='B';u.color='B';gp.color='R';_rbEvents.push('重着色');n=gp;}
        else{
          if(n===n.parent.left){n=n.parent;this.rotR(n);_rbEvents.push('右旋');}
          n.parent.color='B';n.parent.parent.color='R';this.rotL(n.parent.parent);_rbEvents.push('左旋');
        }
      }
    }
  },
  rotL(x){const y=x.right;x.right=y.left;if(y.left)y.left.parent=x;y.parent=x.parent;if(!x.parent){}else if(x===x.parent.left)x.parent.left=y;else x.parent.right=y;y.left=x;x.parent=y;},
  rotR(x){const y=x.left;x.left=y.right;if(y.right)y.right.parent=x;y.parent=x.parent;if(!x.parent){}else if(x===x.parent.right)x.parent.right=y;else x.parent.left=y;y.right=x;x.parent=y;},
  render(){
    const s=App.states.rb;clear(content);
    if(!s.root){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    let idx=0;const nodes=[];
    (function io(n,d){if(!n)return;io(n.left,d+1);n._i=idx++;n._d=d;nodes.push(n);io(n.right,d+1);})(s.root,0);
    const xStep=Math.max(46,Math.min(64,820/Math.max(nodes.length,1))),yStep=66,x0=40,y0=50;
    let maxX=0,maxY=0,minX=1e9;
    nodes.forEach(n=>{n.x=x0+n._i*xStep;n.y=y0+n._d*yStep;maxX=Math.max(maxX,n.x);maxY=Math.max(maxY,n.y);minX=Math.min(minX,n.x);});
    (function edges(n){if(!n)return;edges(n.left);if(n.left)drawEdge(content,n.x,n.y,n.left.x,n.left.y);if(n.right)drawEdge(content,n.x,n.y,n.right.x,n.right.y);edges(n.right);})(s.root);
    nodes.forEach(n=>{drawNode(content,n.x,n.y,n.val,{color:'rb-'+n.color.toLowerCase()});});
    return{minX:minX-30,minY:y0-40,maxX:maxX+30,maxY:maxY+30};
  }
});

   MODULE: B+ Tree
   ============================================================ */
register('bp',{
  label:'B+ Tree',title:'B+ 树',
  defaultInput:'5,10,15,20,25,30,35,40,45,50,55,3,7,12,18,28,33,38,42,48',
  buildState(){return{input:this.defaultInput,root:null,values:[],order:4};},
  panelHTML(){
    const s=App.states.bp;
    return '<div class="section-label">数据输入</div>'+
      '<textarea class="input-area" id="bpInput">'+esc(s.input)+'</textarea>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn primary" data-act="build">构建</button>'+
        '<button class="btn" data-act="clear">清空</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">操作</div>'+
      '<div class="inline-row"><input type="text" class="input-line" id="bpVal" placeholder="数字"></div>'+
      '<div class="btn-row" style="margin-top:6px">'+
        '<button class="btn" data-act="insert">插入</button>'+
        '<button class="btn" data-act="delete">删除</button>'+
      '</div>'+
      '<div class="section-label" style="margin-top:14px">参数</div>'+
      '<div class="field"><label>阶数 m (max children)</label><input type="number" class="input-line" id="bpOrder" value="'+s.order+'" min="3" max="8"></div>'+
      '<div class="section-label" style="margin-top:14px">说明</div>'+
      '<p class="info-text">数据库索引结构。内部节点仅存索引键，数据在叶子层并按链表连接。节点满 (≥m 键) 时分裂。</p>';
  },
  bind(){
    const s=App.states.bp;
    panel.querySelector('#bpInput').addEventListener('input',e=>{s.input=e.target.value;API.save();});
    panel.querySelector('#bpOrder').addEventListener('change',e=>{s.order=clamp(Number(e.target.value)||4,3,8);this.rebuild();API.rerender();API.save();});
    panel.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',()=>{
        const act=b.dataset.act;
        if(act==='build'){s.values=parseNums(s.input);this.rebuild();API.rerender();API.log('build','构建 B+ 树 (m='+s.order+')：'+s.values.length+' 键');}
        else if(act==='clear'){s.values=[];s.root=null;API.rerender();API.log('info','已清空');}
        else if(act==='insert'){const v=Number(panel.querySelector('#bpVal').value);if(isNaN(v)){API.log('error','请输入数字');return;}if(s.values.includes(v)){API.log('error',v+' 已存在');return;}s.values.push(v);s.input=s.values.join(',');panel.querySelector('#bpInput').value=s.input;this.rebuild();API.rerender();API.log('insert','插入 '+v);API.save();}
        else if(act==='delete'){const v=Number(panel.querySelector('#bpVal').value);if(isNaN(v)){API.log('error','请输入数字');return;}if(!s.values.includes(v)){API.log('error',v+' 不存在');return;}s.values=s.values.filter(x=>x!==v);s.input=s.values.join(',');panel.querySelector('#bpInput').value=s.input;this.rebuild();API.rerender();API.log('delete','删除 '+v);API.save();}
      });
    });
  },
  rebuild(){
    const s=App.states.bp;s.root=null;
    const vals=[...new Set(s.values)].sort((a,b)=>a-b);
    vals.forEach(v=>{
      if(!s.root)s.root={leaf:true,keys:[],next:null};
      const split=this.bpInsert(s.root,v,s.order);
      if(split){s.root={leaf:false,keys:[split.key],children:[split.left,split.right]};}
    });
  },
  bpInsert(node,val,m){
    if(node.leaf){
      insertSorted(node.keys,val);
      if(node.keys.length<m)return null;
      const mid=Math.ceil(node.keys.length/2);
      const right={leaf:true,keys:node.keys.slice(mid),next:node.next};
      node.keys=node.keys.slice(0,mid);node.next=right;
      return{key:right.keys[0],left:node,right:right};
    }
    let i=0;while(i<node.keys.length&&val>=node.keys[i])i++;
    const split=this.bpInsert(node.children[i],val,m);
    if(!split)return null;
    node.keys.splice(i,0,split.key);node.children.splice(i+1,0,split.right);
    if(node.keys.length<m)return null;
    const mid=Math.floor(node.keys.length/2);
    const upKey=node.keys[mid];
    const right={leaf:false,keys:node.keys.slice(mid+1),children:node.children.slice(mid+1)};
    node.keys=node.keys.slice(0,mid);node.children=node.children.slice(0,mid+1);
    return{key:upKey,left:node,right:right};
  },
  render(){
    const s=App.states.bp;clear(content);
    if(!s.root){vizEmpty.style.display='flex';return{minX:0,minY:0,maxX:0,maxY:0};}
    vizEmpty.style.display='none';
    const cellW=30,cellH=30,pad=5;
    const nodeW=n=>Math.max(cellW,n.keys.length*cellW)+pad*2;
    // leaf x spacing based on max possible leaf width to avoid overlap
    const xStep=Math.max(56,(s.order-1)*cellW+pad*2+10),x0=40;
    let leafIdx=0;
    (function assignLeaf(n){if(n.leaf){n.x=x0+(leafIdx++)*xStep;return;}n.children.forEach(assignLeaf);})(s.root);
    (function setDepth(n,d){n.depth=d;if(!n.leaf)n.children.forEach(c=>setDepth(c,d+1));})(s.root,0);
    const md=(function maxD(n){if(n.leaf)return n.depth;return Math.max.apply(null,n.children.map(maxD));})(s.root);
    (function setY(n){if(n.leaf){n.y=md*78;return;}n.children.forEach(setY);n.y=n.children[0].y-78;})(s.root);
    (function setX(n){if(n.leaf)return;n.children.forEach(setX);n.x=(n.children[0].x+n.children[n.children.length-1].x)/2;})(s.root);
    const all=[];
    (function collect(n){all.push(n);if(!n.leaf)n.children.forEach(collect);})(s.root);
    let minX=1e9,maxX=0,maxY=0;
    // draw edges internal->child
    (function edges(n){if(!n.leaf){n.children.forEach(c=>{drawEdge(content,n.x,n.y+cellH/2,c.x,c.y-cellH/2);edges(c);});}})(s.root);
    // draw leaf links using real half-widths
    const leaves=all.filter(n=>n.leaf);
    for(let i=0;i<leaves.length-1;i++){
      const a=leaves[i],b=leaves[i+1];
      drawEdge(content,a.x+nodeW(a)/2,a.y,b.x-nodeW(b)/2,b.y,{cls:'path',arrow:true});
    }
    if(leaves.length>1){const lt=el('text',{x:(leaves[0].x+leaves[leaves.length-1].x)/2,y:leaves[0].y+34,'text-anchor':'middle',class:'link-text'});lt.textContent='叶子节点链表 (leaf linked list) →';content.appendChild(lt);}
    // draw nodes
    all.forEach(n=>{
      const w=nodeW(n);
      const x=n.x-w/2,y=n.y-cellH/2;
      minX=Math.min(minX,x);maxX=Math.max(maxX,x+w);maxY=Math.max(maxY,y+cellH);
      const rect=el('rect',{x:x,y:y,width:w,height:cellH,rx:5,class:n.leaf?'bp-leaf':'bp-internal'});
      content.appendChild(rect);
      n.keys.forEach((k,i)=>{
        const tx=x+pad+cellW*i+cellW/2;
        const t=el('text',{x:tx,y:n.y,'text-anchor':'middle','dominant-baseline':'central',class:'bp-key'});t.textContent=k;content.appendChild(t);
        if(i>0){const lx=x+pad+cellW*i;content.appendChild(el('line',{x1:lx,y1:y,x2:lx,y2:y+cellH,class:'bp-sep'}));}
      });
      if(n.leaf){const lab=el('text',{x:n.x,y:y-6,'text-anchor':'middle',class:'arr-idx'});lab.textContent='leaf';content.appendChild(lab);}
      else{const lab=el('text',{x:n.x,y:y-6,'text-anchor':'middle',class:'arr-idx'});lab.textContent='internal';content.appendChild(lab);}
    });
    return{minX:minX-30,minY:-30,maxX:maxX+30,maxY:maxY+50};
  }
});

/* ============================================================
   Helpers / wiring
   ============================================================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function buildTabs(){
  clear(tabsEl);
  ORDER.forEach(id=>{
    const b=h('button','tab'+(App.current===id?' active':''),Modules[id].label);
    b.dataset.module=id;
    b.addEventListener('click',()=>switchModule(id));
    tabsEl.appendChild(b);
  });
}
function switchModule(id){
  if(!Modules[id])return;
  App.current=id;
  buildTabs();
  renderPanel();
  renderModule();
  API.save();
  API.log('info','切换到 '+Modules[id].title);
}
function renderPanel(){
  const m=Modules[App.current];
  panel.innerHTML=m.panelHTML();
  m.bind();
}
function renderModule(){
  const m=Modules[App.current];
  const s=App.states[App.current];
  vizTitle.textContent=m.title;
  let count=0;
  if(App.current==='bst'||App.current==='rb')count=(s.root?countNodes(s.root):0);
  else if(App.current==='heap')count=s.arr.length;
  else if(App.current==='graph')count=s.nodes.length;
  else if(App.current==='hash')count=s.pairs.length;
  else if(App.current==='skip')count=s.values.length;
  else if(App.current==='trie')count=s.words.length;
  else if(App.current==='bp')count=s.values.length;
  vizCount.textContent=count;
  memPill.textContent=count+' nodes';
  const b=m.render();
  App.lastBounds=b;
  fitViewBox(b);
}
function countNodes(n){return n?1+countNodes(n.left)+countNodes(n.right):0;}

/* ============================================================
   Init
   ============================================================ */
function init(){
  // init states
  ORDER.forEach(id=>{
    App.states[id]=Modules[id].buildState();
  });
  const saved=loadState();
  if(saved){
    if(saved.current&&Modules[saved.current])App.current=saved.current;
    if(saved.inputs)for(const k in saved.inputs)if(Modules[k]&&saved.inputs[k]!=null)App.states[k].input=saved.inputs[k];
  }
  // build initial data for current module
  ORDER.forEach(id=>{
    const s=App.states[id];
    if(id==='bst'){s.values=parseNums(s.input);Modules.bst.rebuild();}
    else if(id==='heap'){s.arr=parseNums(s.input);Modules.heap.buildHeap();}
    else if(id==='graph'){Modules.graph.build();}
    else if(id==='hash'){Modules.hash.build();}
    else if(id==='skip'){s.values=parseNums(s.input);Modules.skip.rebuild();}
    else if(id==='trie'){s.words=parseWords(s.input);Modules.trie.build();}
    else if(id==='rb'){s.values=parseNums(s.input);Modules.rb.rebuild();}
    else if(id==='bp'){s.values=parseNums(s.input);Modules.bp.rebuild();}
  });
  buildTabs();
  renderPanel();
  renderModule();
  API.log('info','TW Visualizer 就绪 · '+Modules[App.current].title);
}

init();
})();
