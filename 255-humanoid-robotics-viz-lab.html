<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人形机器人AI · 可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;
  --accent:#00d4aa;
  --accent-dim:rgba(0,212,170,0.15);
  --accent-glow:rgba(0,212,170,0.4);
  --panel:#12141c;
  --panel2:#1a1d28;
  --text:#e4e6eb;
  --dim:#8b8f9a;
  --border:#2a2d3a;
  --warn:#ffb347;
  --danger:#ff5566;
  --info:#4d9fff;
  --purple:#a855f7;
  --pink:#ec4899;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;
  line-height:1.6;
  min-height:100vh;
}
.app{max-width:1100px;margin:0 auto;padding:16px}
.header{text-align:center;padding:20px 0 10px;border-bottom:1px solid var(--border)}
.header h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:1px}
.header .sub{font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:2px}
.tabbar{
  display:flex;flex-wrap:wrap;gap:4px;padding:12px 0;
  border-bottom:1px solid var(--border);justify-content:center;
}
.tab{
  padding:8px 14px;border:1px solid var(--border);border-radius:6px;
  background:var(--panel);color:var(--dim);cursor:pointer;
  font-size:13px;font-weight:600;transition:background-color 0.2s ease,color 0.2s ease,border-color 0.2s ease;
  user-select:none;white-space:nowrap;
}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{
  background:var(--accent-dim);border-color:var(--accent);color:var(--accent);
}
.tab .tn{font-size:10px;color:var(--dim);display:block;transition:color 0.2s ease}
.tab.active .tn{color:var(--accent)}
.module{display:none;padding:16px 0}
.module.active{display:block}
.mhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.mhead h2{font-size:18px;font-weight:700}
.mhead .mn{font-size:12px;color:var(--accent);font-weight:700}
.mdesc{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.7}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.btn{
  padding:7px 16px;border:1px solid var(--border);border-radius:5px;
  background:var(--panel2);color:var(--text);cursor:pointer;
  font-size:13px;font-weight:600;transition:background-color 0.18s ease,color 0.18s ease,border-color 0.18s ease;
}
.btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.canvas-wrap{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:12px;overflow:hidden;
}
svg.canvas{width:100%;height:auto;display:block;border-radius:6px}
.infobar{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;
}
.chip{
  padding:5px 12px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--border);font-size:12px;color:var(--dim);
  transition:background-color 0.18s ease,color 0.18s ease;
}
.chip.hi{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.stat{
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
}
.stat .v{font-size:20px;font-weight:700;color:var(--accent)}
.stat .l{font-size:11px;color:var(--dim);margin-top:2px}
.footer{text-align:center;padding:20px 0;color:var(--dim);font-size:11px;border-top:1px solid var(--border);margin-top:10px}
.note{
  font-size:12px;color:var(--dim);margin-top:10px;padding:8px 12px;
  background:var(--panel);border-radius:6px;border-left:3px solid var(--accent);
}
@media(max-width:640px){
  .header h1{font-size:18px}
  .tab{padding:6px 10px;font-size:12px}
  .mhead h2{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>人形机器人AI · 可视化实验室</h1>
    <div class="sub">HUMANOID ROBOTICS AI VISUALIZATION LAB</div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <main id="main"></main>
  <div class="footer">Self-Contained SVG Visualization · 人形机器人AI · 8 Modules</div>
</div>

<script>
window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);

/* ===== Color palette ===== */
var C={
  bg:'#0a0b0f',accent:'#00d4aa',accentDim:'rgba(0,212,170,0.15)',
  panel:'#12141c',panel2:'#1a1d28',text:'#e4e6eb',dim:'#8b8f9a',
  border:'#2a2d3a',warn:'#ffb347',danger:'#ff5566',info:'#4d9fff',
  purple:'#a855f7',pink:'#ec4899',grid:'#1e212c',grid2:'#252836'
};
var SVGNS='http://www.w3.org/2000/svg';

/* ===== SVG helpers ===== */
function el(t,a,p){
  var e=document.createElementNS(SVGNS,t);
  if(a){for(var k in a){e.setAttribute(k,a[k]);}}
  if(p){p.appendChild(e);}
  return e;
}
function clear(s){while(s.firstChild){s.removeChild(s.firstChild);}}

/* ===== Drawing helpers ===== */
function dText(p,x,y,txt,fs,col,anchor,wt){
  return el('text',{x:x,y:y,'font-size':fs||12,fill:col||C.text,
    'text-anchor':anchor||'middle','font-family':'inherit',
    'font-weight':wt||'normal'},p).textContent=txt,p.lastChild;
}
function dCircle(p,cx,cy,r,fill,stroke,sw){
  return el('circle',{cx:cx,cy:cy,r:r,fill:fill||'none',
    stroke:stroke||'none','stroke-width':sw||1},p);
}
function dLine(p,x1,y1,x2,y2,stroke,sw,dash){
  return el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:stroke||C.border,
    'stroke-width':sw||1,'stroke-dasharray':dash||'none',
    'stroke-linecap':'round'},p);
}
function dRect(p,x,y,w,h,fill,stroke,sw,rx){
  return el('rect',{x:x,y:y,width:w,height:h,fill:fill||'none',
    stroke:stroke||'none','stroke-width':sw||1,rx:rx||0},p);
}
function dPath(p,d,fill,stroke,sw,dash){
  return el('path',{d:d,fill:fill||'none',stroke:stroke||'none',
    'stroke-width':sw||1,'stroke-dasharray':dash||'none',
    'stroke-linecap':'round','stroke-linejoin':'round'},p);
}
function dArrow(p,x1,y1,x2,y2,col,sw){
  var ang=Math.atan2(y2-y1,x2-x1);
  var hl=8;
  dLine(p,x1,y1,x2,y2,col||C.accent,sw||2);
  dLine(p,x2,y2,x2-hl*Math.cos(ang-0.4),y2-hl*Math.sin(ang-0.4),col||C.accent,sw||2);
  dLine(p,x2,y2,x2-hl*Math.cos(ang+0.4),y2-hl*Math.sin(ang+0.4),col||C.accent,sw||2);
}
function dGrid(p,x,y,w,h,step){
  for(var i=0;i<=w;i+=step){dLine(p,x+i,y,x+i,y+h,C.grid,1);}
  for(var j=0;j<=h;j+=step){dLine(p,x,y+j,x+w,y+j,C.grid,1);}
}

/* ===== Animation manager ===== */
var animTimer=null;
function stopAnim(){if(animTimer){clearInterval(animTimer);animTimer=null;}}

/* ===== Module definitions ===== */
var MODS=[
  {n:'M1',name:'全景',en:'Overview',desc:'人形机器人技术全景：从感知决策到运动控制，从仿真训练到真实部署，覆盖人形机器人AI的完整技术栈与核心能力。'},
  {n:'M2',name:'双足行走',en:'Bipedal',desc:'双足行走是人形机器人的核心运动能力。通过步态规划、ZMP稳定性判据与全身动力学控制，实现稳定、高效的自然行走。'},
  {n:'M3',name:'灵巧操作',en:'Manipulation',desc:'灵巧手与手臂协同操作，实现抓取、捏取、力控等精细任务。多指手拥有20+自由度，配合视觉触觉融合实现复杂操作。'},
  {n:'M4',name:'全身控制',en:'WBC',desc:'全身控制（WBC）统一协调所有关节，同时满足平衡、接触、任务空间等多层约束，实现跑跳、搬运、踢腿等全身运动。'},
  {n:'M5',name:'Sim-to-Real',en:'Transfer',desc:'仿真到真实迁移：在仿真中大规模训练策略，通过域随机化、系统辨识等技术弥合仿真与现实差距，实现零样本部署。'},
  {n:'M6',name:'感知系统',en:'Perception',desc:'多模态感知融合：视觉相机、深度传感器、LiDAR、IMU与触觉传感器协同，构建对环境与自身状态的全面感知。'},
  {n:'M7',name:'学习架构',en:'Learning',desc:'强化学习（RL）与模仿学习（IL）是人形机器人策略学习的主流范式。从仿真预训练到真实微调，端到端学习运动与操作技能。'},
  {n:'M8',name:'生态对比',en:'Ecosystem',desc:'全球人形机器人生态对比：波士顿动力Atlas、特斯拉Optimus、宇树H1、Figure 01、敏捷机器人Digit等主流产品多维参数对比。'}
];

/* ===== State ===== */
var curMod=0;
var S={}; /* module states */

/* ===== Build UI ===== */
function buildUI(){
  var tb=document.getElementById('tabbar');
  var main=document.getElementById('main');
  for(var i=0;i<MODS.length;i++){
    var m=MODS[i];
    var tab=el('div',{'class':'tab','data-i':i},null);
    document.getElementById('tabbar').appendChild(tab);
    tab.innerHTML='<span>'+m.name+'</span><span class="tn">'+m.n+'</span>';
    (function(idx){tab.onclick=function(){showModule(idx);};})(i);
    var mod=el('div',{'class':'module','id':'mod'+i},null);
    main.appendChild(mod);
  }
}
function showModule(i){
  stopAnim();
  curMod=i;
  var tabs=document.getElementById('tabbar').children;
  for(var j=0;j<tabs.length;j++){tabs[j].className='tab';}
  tabs[i].className='tab active';
  var mods=document.getElementById('main').children;
  for(var k=0;k<mods.length;k++){mods[k].className='module';}
  mods[i].className='module active';
  var render=[renderM1,renderM2,renderM3,renderM4,renderM5,renderM6,renderM7,renderM8];
  render[i]();
}

/* ===== Common module shell ===== */
function modShell(i){
  var m=MODS[i];
  var mod=document.getElementById('mod'+i);
  mod.innerHTML='';
  var head=el('div',{'class':'mhead'},mod);
  el('span',{'class':'mn'},head).textContent=m.n;
  el('h2',null,head).textContent=m.name+' · '+m.en;
  el('p',{'class':'mdesc'},mod).textContent=m.desc;
  var ctrl=el('div',{'class':'controls'},mod);
  ctrl.id='ctrl'+i;
  var cw=el('div',{'class':'canvas-wrap'},mod);
  var svg=el('svg',{'class':'canvas','id':'svg'+i,'viewBox':'0 0 900 520','preserveAspectRatio':'xMidYMid meet'},cw);
  var info=el('div',{'class':'infobar'},mod);
  info.id='info'+i;
  return {mod:m,ctrl:ctrl,svg:svg,info:info};
}
function addBtn(ctrl,label,fn){
  var b=el('button',{'class':'btn'},ctrl);
  b.textContent=label;
  b.onclick=fn;
  return b;
}
function setInfo(i,items){
  var info=document.getElementById('info'+i);
  info.innerHTML='';
  for(var j=0;j<items.length;j++){
    var c=el('div',{'class':'chip'},info);
    c.textContent=items[j];
    if(items[j].hi)c.className='chip hi';
  }
}
function setInfoHtml(i,html){
  document.getElementById('info'+i).innerHTML=html;
}

/* ============================================================
   M1: 全景概览 — Humanoid Robotics Overview
   ============================================================ */
function renderM1(){
  var sh=modShell(0);
  var ctrl=sh.ctrl;
  S.m1={view:0,labels:true,specs:false};
  addBtn(ctrl,'显示/隐藏标注',m1Labels);
  addBtn(ctrl,'切换视角',m1View);
  addBtn(ctrl,'技术参数',m1Specs);
  m1Draw();
}
function m1Labels(){S.m1.labels=!S.m1.labels;m1Draw();}
function m1View(){S.m1.view=(S.m1.view+1)%2;m1Draw();}
function m1Specs(){S.m1.specs=!S.m1.specs;m1Draw();}
function m1Draw(){
  var svg=document.getElementById('svg0');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dGrid(svg,0,0,900,520,40);
  /* Title */
  dText(svg,450,30,'人形机器人技术架构全景',16,C.accent,'middle','bold');
  dText(svg,450,48,'Humanoid Robotics AI Stack',11,C.dim,'middle');
  /* Draw robot figure */
  var cx=300,cy=260;
  m1Robot(svg,cx,cy,S.m1.view);
  /* Labels */
  if(S.m1.labels){
    var labs=[
      {x:cx,y:cy-150,tx:'视觉头部',en:'Vision Head',dx:480,dy:cy-150},
      {x:cx,y:cy-95,tx:'计算单元',en:'Compute Unit',dx:480,dy:cy-95},
      {x:cx-55,y:cy-30,tx:'力矩关节',en:'Actuated Joints',dx:80,dy:cy-30},
      {x:cx+60,y:cy+10,tx:'灵巧手',en:'Dexterous Hand',dx:520,dy:cy+10},
      {x:cx,y:cy+70,tx:'腰部平衡',en:'Waist Balance',dx:80,dy:cy+70},
      {x:cx-30,y:cy+160,tx:'双足步态',en:'Bipedal Gait',dx:80,dy:cy+160},
      {x:cx+30,y:cy+200,tx:'力/触觉传感',en:'Force/Tactile',dx:520,dy:cy+200}
    ];
    for(var i=0;i<labs.length;i++){
      var L=labs[i];
      var lx=L.dx<L.x?L.x-100:L.x+100;
      dLine(svg,L.x,L.y,lx,L.dy,C.accent,1,'4,3');
      dCircle(svg,L.x,L.y,4,C.accent,C.accent,1);
      var ta=L.dx<L.x?'end':'start';
      dText(svg,lx,L.dy-2,L.tx,13,C.accent,ta,'bold');
      dText(svg,lx,L.dy+13,L.en,10,C.dim,ta);
    }
  }
  /* Specs panel */
  if(S.m1.specs){
    var px=620,py=70,pw=260,ph=380;
    el('rect',{x:px,y:py,width:pw,height:ph,fill:C.panel,stroke:C.border,'stroke-width':1,rx:8},svg);
    dText(svg,px+pw/2,py+22,'核心规格 · Core Specs',13,C.accent,'middle','bold');
    var specs=[
      ['身高 Height','170 cm'],
      ['重量 Weight','65 kg'],
      ['自由度 DOF','40+'],
      ['上肢臂展','180 cm'],
      ['行走速度','1.5 m/s'],
      ['手部自由度','20 DOF'],
      ['续航时间','4 hours'],
      ['算力 Compute','275 TOPS'],
      ['传感器','视觉+深度+IMU+触觉'],
      ['控制频率','1000 Hz']
    ];
    for(var s=0;s<specs.length;s++){
      var yy=py+48+s*32;
      dText(svg,px+16,yy,specs[s][0],11,C.dim,'start');
      dText(svg,px+pw-16,yy,specs[s][1],12,C.text,'end','bold');
      if(s<specs.length-1)dLine(svg,px+12,yy+12,px+pw-12,yy+12,C.grid,1);
    }
  } else {
    /* Tech stack boxes */
    var boxes=[
      {x:620,y:70,w:120,h:50,t:'感知 Perception',c:C.info},
      {x:760,y:70,w:120,h:50,t:'规划 Planning',c:C.purple},
      {x:620,y:130,w:120,h:50,t:'控制 Control',c:C.accent},
      {x:760,y:130,w:120,h:50,t:'学习 Learning',c:C.warn},
      {x:620,y:190,w:260,h:50,t:'全身动力学 WBC + MPC',c:C.pink},
      {x:620,y:250,w:260,h:50,t:'仿真训练 Sim Training',c:C.info},
      {x:620,y:310,w:260,h:50,t:'Sim-to-Real 迁移部署',c:C.accent},
      {x:620,y:370,w:260,h:60,t:'端到端 Embodied AI',c:C.warn}
    ];
    for(var b=0;b<boxes.length;b++){
      var B=boxes[b];
      el('rect',{x:B.x,y:B.y,width:B.w,height:B.h,fill:C.panel,stroke:B.c,'stroke-width':1.5,rx:6},svg);
      dText(svg,B.x+B.w/2,B.y+B.h/2+5,B.t,12,B.c,'middle','bold');
    }
    /* Connecting arrows */
    dArrow(svg,620,260,580,260,C.dim,1.5);
    dArrow(svg,580,260,580,330,C.dim,1.5);
    dArrow(svg,580,330,580,400,C.dim,1.5);
    dArrow(svg,580,400,620,400,C.dim,1.5);
  }
  setInfo(0,[
    {hi:'40+ DOF'},'170cm','65kg','1.5 m/s','275 TOPS','多模态感知','全身控制'
  ]);
}
function m1Robot(svg,cx,cy,view){
  /* Stylized humanoid robot */
  var c=C.accent;
  /* Head */
  el('rect',{x:cx-22,y:cy-170,width:44,height:48,fill:C.panel2,stroke:c,'stroke-width':2,rx:8},svg);
  /* Eyes/cameras */
  dCircle(svg,cx-10,cy-152,5,C.accent);
  dCircle(svg,cx+10,cy-152,5,C.accent);
  dLine(svg,cx-14,cy-152,cx-6,cy-152,C.bg,2);
  dLine(svg,cx+6,cy-152,cx+14,cy-152,C.bg,2);
  /* Neck */
  el('rect',{x:cx-8,y:cy-122,width:16,height:12,fill:C.panel2,stroke:C.border,'stroke-width':1},svg);
  /* Torso */
  el('path',{d:'M '+(cx-40)+' '+(cy-110)+' L '+(cx+40)+' '+(cy-110)+
    ' L '+(cx+35)+' '+(cy-30)+' L '+(cx-35)+' '+(cy-30)+' Z',
    fill:C.panel2,stroke:c,'stroke-width':2},svg);
  /* Chest plate */
  el('rect',{x:cx-20,y:cy-95,width:40,height:30,fill:C.panel,stroke:C.border,'stroke-width':1,rx:4},svg);
  dCircle(svg,cx,cy-80,4,C.accent,C.accent,1);
  dLine(svg,cx-12,cy-80,cx-6,cy-80,C.accent,1);
  dLine(svg,cx+6,cy-80,cx+12,cy-80,C.accent,1);
  /* Shoulders */
  dCircle(svg,cx-42,cy-105,7,C.panel2,c,2);
  dCircle(svg,cx+42,cy-105,7,C.panel2,c,2);
  /* Arms */
  el('rect',{x:cx-58,y:cy-100,width:16,height:55,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6,transform:'rotate(8 '+(cx-50)+' '+(cy-100)+')'},svg);
  el('rect',{x:cx+42,y:cy-100,width:16,height:55,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6,transform:'rotate(-8 '+(cx+50)+' '+(cy-100)+')'},svg);
  /* Elbows */
  dCircle(svg,cx-56,cy-45,5,C.panel2,c,2);
  dCircle(svg,cx+56,cy-45,5,C.panel2,c,2);
  /* Forearms */
  el('rect',{x:cx-62,y:cy-40,width:14,height:45,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:5},svg);
  el('rect',{x:cx+48,y:cy-40,width:14,height:45,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:5},svg);
  /* Hands */
  m1Hand(svg,cx-55,cy+8);
  m1Hand(svg,cx+55,cy+8);
  /* Hips */
  dCircle(svg,cx-20,cy-25,6,C.panel2,c,2);
  dCircle(svg,cx+20,cy-25,6,C.panel2,c,2);
  /* Pelvis */
  el('rect',{x:cx-32,y:cy-28,width:64,height:18,fill:C.panel2,stroke:c,'stroke-width':1.5,rx:6},svg);
  /* Legs */
  if(view===0){
    /* Front view */
    el('rect',{x:cx-28,y:cy-10,width:18,height:80,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
    el('rect',{x:cx+10,y:cy-10,width:18,height:80,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
    /* Knees */
    dCircle(svg,cx-19,cy+70,5,C.panel2,c,2);
    dCircle(svg,cx+19,cy+70,5,C.panel2,c,2);
    /* Shins */
    el('rect',{x:cx-28,y:cy+75,width:18,height:70,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
    el('rect',{x:cx+10,y:cy+75,width:18,height:70,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
    /* Feet */
    el('rect',{x:cx-36,y:cy+143,width:34,height:12,fill:C.panel2,stroke:c,'stroke-width':1.5,rx:4},svg);

/* ============================================================
   M2: 双足行走 — Bipedal Locomotion
   ============================================================ */
function renderM2(){
  var sh=modShell(1);
  var ctrl=sh.ctrl;
  S.m2={phase:0,speed:0.06,playing:true,showZMP:true,showFoot:true,steps:0};
  addBtn(ctrl,'播放/暂停',m2Toggle);
  addBtn(ctrl,'加速',function(){m2Speed(1.4);});
  addBtn(ctrl,'减速',function(){m2Speed(0.7);});
  addBtn(ctrl,'重置',m2Reset);
  addBtn(ctrl,'显示ZMP/CoM',m2ZMP);
  addBtn(ctrl,'显示足迹',m2Foot);
  m2Draw();
  if(S.m2.playing){
    animTimer=setInterval(function(){
      S.m2.phase+=S.m2.speed;
      if(S.m2.phase>Math.PI*2){S.m2.phase-=Math.PI*2;S.m2.steps++;}
      m2Draw();
    },33);
  }
}
function m2Toggle(){S.m2.playing=!S.m2.playing;renderM2();}
function m2Speed(f){S.m2.speed=Math.max(0.01,Math.min(0.2,S.m2.speed*f));}
function m2Reset(){S.m2.phase=0;S.m2.steps=0;m2Draw();}
function m2ZMP(){S.m2.showZMP=!S.m2.showZMP;m2Draw();}
function m2Foot(){S.m2.showFoot=!S.m2.showFoot;m2Draw();}
function m2Draw(){
  var svg=document.getElementById('svg1');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dText(svg,450,28,'双足行走步态周期 · Bipedal Gait Cycle',15,C.accent,'middle','bold');
  /* Ground */
  el('rect',{x:0,y:400,width:900,height:120,fill:C.panel,stroke:'none'},svg);
  for(var gx=0;gx<900;gx+=30){dLine(svg,gx,400,gx+15,415,C.grid2,1);}
  dLine(svg,0,400,900,400,C.border,2);
  /* Walk figure */
  var cx=450,baseY=400;
  var ph=S.m2.phase;
  var bob=6*Math.cos(2*ph);
  var hipY=baseY-145+bob;
  /* Legs */
  var thighL=58,shinL=58;
  /* Left leg */
  var lHipA=0.45*Math.sin(ph);
  var lKneeA=0.55*Math.max(0,Math.sin(ph+Math.PI*0.5));
  var lKx=cx+thighL*Math.sin(lHipA);
  var lKy=hipY+thighL*Math.cos(lHipA);
  var lFx=lKx+shinL*Math.sin(lHipA-lKneeA);
  var lFy=lKy+shinL*Math.cos(lHipA-lKneeA);
  /* Right leg */
  var rHipA=0.45*Math.sin(ph+Math.PI);
  var rKneeA=0.55*Math.max(0,Math.sin(ph+Math.PI+Math.PI*0.5));
  var rKx=cx+thighL*Math.sin(rHipA);
  var rKy=hipY+thighL*Math.cos(rHipA);
  var rFx=rKx+shinL*Math.sin(rHipA-rKneeA);
  var rFy=rKy+shinL*Math.cos(rHipA-rKneeA);
  /* Arms */
  var armL=48,foreL=42;
  var lArmA=-0.35*Math.sin(ph);
  var rArmA=-0.35*Math.sin(ph+Math.PI);
  var shoulderY=hipY-55;
  var lElX=cx-15+armL*Math.sin(lArmA);
  var lElY=shoulderY+armL*Math.cos(lArmA);
  var lHaX=lElX+foreL*Math.sin(lArmA+0.2);
  var lHaY=lElY+foreL*Math.cos(lArmA+0.2);
  var rElX=cx+15+armL*Math.sin(rArmA);
  var rElY=shoulderY+armL*Math.cos(rArmA);
  var rHaX=rElX+foreL*Math.sin(rArmA+0.2);
  var rHaY=rElY+foreL*Math.cos(rArmA+0.2);
  /* Draw right leg (behind) */
  dLine(svg,cx,hipY,rKx,rKy,C.dim,5);
  dLine(svg,rKx,rKy,rFx,rFy,C.dim,5);
  dCircle(svg,rFx,rFy+3,5,C.dim,C.dim,1);
  /* Draw left leg (front) */
  dLine(svg,cx,hipY,lKx,lKy,C.accent,6);
  dLine(svg,lKx,lKy,lFx,lFy,C.accent,6);
  dCircle(svg,lFx,lFy+3,5,C.accent,C.accent,1);
  /* Joints */
  dCircle(svg,cx,hipY,5,C.text);
  dCircle(svg,lKx,lKy,4,C.accent);
  dCircle(svg,rKx,rKy,4,C.dim);
  /* Torso */
  dLine(svg,cx,hipY,cx,shoulderY,C.text,7);
  /* Shoulders */
  dCircle(svg,cx-15,shoulderY,4,C.text);
  dCircle(svg,cx+15,shoulderY,4,C.text);
  /* Arms */
  dLine(svg,cx-15,shoulderY,lElX,lElY,C.info,4);
  dLine(svg,lElX,lElY,lHaX,lHaY,C.info,4);
  dLine(svg,cx+15,shoulderY,rElX,rElY,C.purple,4);
  dLine(svg,rElX,rElY,rHaX,rHaY,C.purple,4);
  /* Head */
  dCircle(svg,cx,shoulderY-20,12,C.panel2,C.text,2);
  dCircle(svg,cx-4,shoulderY-22,2,C.accent);
  dCircle(svg,cx+4,shoulderY-22,2,C.accent);
  /* CoM */
  var comX=cx+3*Math.sin(ph);
  var comY=hipY-30;
  if(S.m2.showZMP){
    dCircle(svg,comX,comY,8,'rgba(255,179,71,0.2)',C.warn,2);
    dCircle(svg,comX,comY,3,C.warn);
    dText(svg,comX+14,comY-4,'CoM',11,C.warn,'start','bold');
    /* ZMP - between feet, weighted */
    var zmpX=(lFx+rFx)/2+5*Math.sin(ph);
    var zmpY=baseY+4;
    dLine(svg,comX,comY,zmpX,zmpY,C.warn,1,'3,3');
    dCircle(svg,zmpX,zmpY,7,'rgba(0,212,170,0.2)',C.accent,2);
    dCircle(svg,zmpX,zmpY,3,C.accent);
    dText(svg,zmpX+14,zmpY+4,'ZMP',11,C.accent,'start','bold');
    /* Stability margin */
    var minX=Math.min(lFx,rFx)-15,maxX=Math.max(lFx,rFx)+15;
    dLine(svg,minX,baseY+2,maxX,baseY+2,C.accent,1,'5,3');
  }
  /* Footprints */
  if(S.m2.showFoot){
    for(var fi=0;fi<6;fi++){
      var fph=ph-fi*0.7;
      var side=Math.sin(fph)>0?1:-1;
      var fx=cx+30*Math.sin(fph)-side*10;
      if(fx>40&&fx<860){
        var alpha=Math.max(0.05,0.35-fi*0.05);
        el('ellipse',{cx:fx,cy:baseY+8,rx:8,ry:3,
          fill:'rgba(0,212,170,'+alpha+')',stroke:'none'},svg);
      }
    }
  }
  /* Phase indicator */
  var phaseDeg=Math.round((ph/(Math.PI*2))*360)%360;
  /* Gait phase bar */
  var bx=60,by=460,bw=780,bh=30;
  dRect(svg,bx,by,bw,bh,C.panel,C.border,1,6);
  var stancePct=0.6;
  el('rect',{x:bx,y:by,width:bw*stancePct/2,height:bh,fill:C.accentDim,stroke:'none',rx:6},svg);
  el('rect',{x:bx+bw/2,y:by,width:bw*stancePct/2,height:bh,fill:C.accentDim,stroke:'none',rx:6},svg);
  var markerX=bx+bw*(ph/(Math.PI*2));
  dLine(svg,markerX,by-4,markerX,by+bh+4,C.warn,2);
  dText(svg,markerX,by-8,'φ='+phaseDeg+'°',10,C.warn,'middle','bold');
  dText(svg,bx+bw*0.15,by+bh/2+4,'左支撑 Left Stance',10,C.accent,'middle');
  dText(svg,bx+bw*0.65,by+bh/2+4,'右支撑 Right Stance',10,C.accent,'middle');
  /* Info */
  setInfo(1,[
    S.m2.playing?{hi:'▶ 运行中'}:'⏸ 已暂停',
    '步频 '+(S.m2.speed*100).toFixed(0)+'%',
    'CoM 质心','ZMP 零力矩点',
    '双支撑相','摆动相'
  ]);
}

/* ============================================================
   M3: 灵巧操作 — Dexterous Manipulation
   ============================================================ */
function renderM3(){
  var sh=modShell(2);
  var ctrl=sh.ctrl;
  S.m3={grasp:0,curl:0,target:0,obj:0};
  addBtn(ctrl,'张开手掌',function(){m3Set(0);});
  addBtn(ctrl,'握拳',function(){m3Set(1);});
  addBtn(ctrl,'捏取 Pinch',function(){m3Set(2);});
  addBtn(ctrl,'抓球',function(){m3Set(3);});
  addBtn(ctrl,'抓方块',function(){m3Set(4);});
  m3Draw();
  animTimer=setInterval(function(){
    if(Math.abs(S.m3.curl-S.m3.target)>0.01){
      S.m3.curl+=(S.m3.target-S.m3.curl)*0.18;
      m3Draw();
    }
  },33);
}
function m3Set(g){
  S.m3.grasp=g;
  var targets=[0,1,0.85,0.9,0.95];
  var objs=[0,0,1,2,3];
  S.m3.target=targets[g];
  S.m3.obj=objs[g];
  m3Draw();
}
function m3Draw(){
  var svg=document.getElementById('svg2');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dText(svg,450,28,'灵巧手操作 · Dexterous Manipulation',15,C.accent,'middle','bold');
  /* Palm */
  var px=400,py=300;
  el('rect',{x:px-50,y:py-30,width:100,height:80,fill:C.panel2,stroke:C.accent,'stroke-width':2,rx:12},svg);
  dText(svg,px,py+50,'手掌 Palm',10,C.dim,'middle');
  /* Wrist */
  el('rect',{x:px-30,y:py+50,width:60,height:20,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
  dLine(svg,px,py+70,px,py+100,C.border,3);
  /* Fingers */
  var fingers=[
    {x:px-42,n:'拇指',seg:2,base:-0.3},
    {x:px-20,n:'食指',seg:3,base:0},
    {x:px-2,n:'中指',seg:3,base:0},
    {x:px+16,n:'无名',seg:3,base:0},
    {x:px+34,n:'小指',seg:3,base:0.1}
  ];
  var curl=S.m3.curl;
  for(var i=0;i<fingers.length;i++){
    var f=fingers[i];
    var isPinch=S.m3.grasp===2&&(f.n==='拇指'||f.n==='食指');
    var fc=isPinch?C.warn:C.accent;
    var localCurl=isPinch?curl*0.5:curl;
    if(S.m3.grasp===2&&f.n!=='拇指'&&f.n!=='食指')localCurl=curl*0.3;
    /* Finger segments */
    var segLen=f.seg===2?28:22;
    var fx=f.x,fy=py-30;
    var ang1=f.base-localCurl*1.2;
    var j1x=fx+segLen*Math.sin(ang1);
    var j1y=fy-segLen*Math.cos(ang1);
    dLine(svg,fx,fy,j1x,j1y,fc,5);
    dCircle(svg,j1x,j1y,3,C.panel2,fc,1.5);
    var ang2=ang1-localCurl*1.0;
    var j2x=j1x+segLen*Math.sin(ang2);
    var j2y=j1y-segLen*Math.cos(ang2);
    if(f.seg===3){
      dLine(svg,j1x,j1y,j2x,j2y,fc,4);
      dCircle(svg,j2x,j2y,3,C.panel2,fc,1.5);
      var ang3=ang2-localCurl*0.8;
      var tx=j2x+segLen*0.8*Math.sin(ang3);
      var ty=j2y-segLen*0.8*Math.cos(ang3);
      dLine(svg,j2x,j2y,tx,ty,fc,3);
      dCircle(svg,tx,ty,5,fc,fc,1);
    } else {
      dCircle(svg,j2x,j2y,5,fc,fc,1);
    }
    /* Label */
    if(i===0)dText(svg,fx-18,fy-10,f.n,9,C.dim,'end');
    else dText(svg,fx,fy-10,f.n,9,C.dim,'middle');
  }
  /* Object */
  if(S.m3.obj===1){
    /* Ball for pinch */
    var bx=px-5,by=py-60;
    dCircle(svg,bx,by,18,C.warn,C.warn,2);
    dCircle(svg,bx-5,by-5,4,'rgba(255,255,255,0.3)');
    dText(svg,bx,by+35,'捏取目标',10,C.warn,'middle');
  } else if(S.m3.obj===2){
    /* Ball */
    var bx2=px,by2=py-55;
    dCircle(svg,bx2,by2,22,C.info,C.info,2);
    dCircle(svg,bx2-6,by2-6,5,'rgba(255,255,255,0.25)');
    dText(svg,bx2,by2+38,'球体 Sphere',10,C.info,'middle');
  } else if(S.m3.obj===3){
    /* Box */
    var bxw=px-25,byw=py-60;
    el('rect',{x:bxw,y:byw,width:50,height:40,fill:C.purple+'33',stroke:C.purple,'stroke-width':2,rx:3},svg);
    dLine(svg,bxw,byw,bxw+10,byw-8,C.purple,1);
    dLine(svg,bxw+50,byw,bxw+60,byw-8,C.purple,1);
    dLine(svg,bxw+10,byw-8,bxw+60,byw-8,C.purple,1);
    dText(svg,bxw+25,byw+55,'方块 Box',10,C.purple,'middle');
  }
  /* Tactile dots */
  for(var t=0;t<8;t++){
    var tx2=px-35+t*10,ty2=py-10+(t%2)*15;
    var active=curl>0.5&&Math.random()>0.5;
    dCircle(svg,tx2,ty2,2,active?C.danger:'rgba(0,212,170,0.3)');
  }
  /* Info panel */
  var graspNames=['张开 Open','握拳 Fist','捏取 Pinch','抓球 Ball Grip','抓方块 Power Grip'];
  var ix=640,iy=80,iw=240,ih=320;
  el('rect',{x:ix,y:iy,width:iw,height:ih,fill:C.panel,stroke:C.border,'stroke-width':1,rx:8},svg);
  dText(svg,ix+iw/2,iy+22,'操作信息',13,C.accent,'middle','bold');
  var info2=[
    ['当前抓取',graspNames[S.m3.grasp]],
    ['手指卷曲',(curl*100).toFixed(0)+'%'],
    ['灵巧手DOF','20'],
    ['触觉点','200+'],
    ['指尖力控','0.1 N精度'],
    ['控制频率','500 Hz'],
    ['载荷','5 kg/指']
  ];
  for(var s=0;s<info2.length;s++){
    var yy=iy+48+s*34;
    dText(svg,ix+16,yy,info2[s][0],11,C.dim,'start');
    dText(svg,ix+iw-16,yy,info2[s][1],12,C.text,'end','bold');
    if(s<info2.length-1)dLine(svg,ix+12,yy+14,ix+iw-12,yy+14,C.grid,1);
  }
  setInfo(2,[
    {hi:graspNames[S.m3.grasp]},
    '20 DOF','200+ 触觉点','力控 0.1N','500Hz'
  ]);
}

      hipR:[cx+12,cy-140],kneeR:[cx+12,cy-75],footR:[cx+18,cy]
    },
    {/*walk*/
      hip:[cx,cy-138],neck:[cx,cy-198],head:[cx,cy-218],
      shoulderL:[cx-18,cy-188],elbowL:[cx-38,cy-150],handL:[cx-45,cy-110],
      shoulderR:[cx+18,cy-188],elbowR:[cx+35,cy-155],handR:[cx+48,cy-120],
      hipL:[cx-12,cy-138],kneeL:[cx-30,cy-80],footL:[cx-45,cy],
      hipR:[cx+12,cy-138],kneeR:[cx+22,cy-75],footR:[cx+30,cy]
    },
    {/*carry*/
      hip:[cx,cy-140],neck:[cx,cy-200],head:[cx,cy-220],
      shoulderL:[cx-18,cy-190],elbowL:[cx-40,cy-165],handL:[cx-20,cy-140],
      shoulderR:[cx+18,cy-190],elbowR:[cx+40,cy-165],handR:[cx+20,cy-140],
      hipL:[cx-12,cy-140],kneeL:[cx-12,cy-75],footL:[cx-18,cy],
      hipR:[cx+12,cy-140],kneeR:[cx+12,cy-75],footR:[cx+18,cy]
    },
    {/*kick*/
      hip:[cx,cy-140],neck:[cx+5,cy-200],head:[cx+8,cy-220],
      shoulderL:[cx-15,cy-190],elbowL:[cx-35,cy-155],handL:[cx-45,cy-120],
      shoulderR:[cx+20,cy-190],elbowR:[cx+40,cy-160],handR:[cx+50,cy-130],
      hipL:[cx-12,cy-140],kneeL:[cx-12,cy-75],footL:[cx-18,cy],
      hipR:[cx+12,cy-140],kneeR:[cx+55,cy-105],footR:[cx+95,cy-115]
    },
    {/*balance*/
      hip:[cx,cy-130],neck:[cx-15,cy-195],head:[cx-25,cy-215],
      shoulderL:[cx-30,cy-185],elbowL:[cx-55,cy-155],handL:[cx-70,cy-125],
      shoulderR:[cx-3,cy-185],elbowR:[cx+15,cy-160],handR:[cx+30,cy-140],
      hipL:[cx-12,cy-130],kneeL:[cx-15,cy-70],footL:[cx-22,cy],
      hipR:[cx+12,cy-130],kneeR:[cx+18,cy-70],footR:[cx+22,cy]
    }
  ];
  var P=poses[S.m4.pose];
  /* Draw body */
  /* Right side (behind) */
  dLine(svg,P.hipR[0],P.hipR[1],P.kneeR[0],P.kneeR[1],C.dim,5);
  dLine(svg,P.kneeR[0],P.kneeR[1],P.footR[0],P.footR[1],C.dim,5);
  dLine(svg,P.shoulderR[0],P.shoulderR[1],P.elbowR[0],P.elbowR[1],C.purple,4);

  dCircle(svg,P.head[0],P.head[1],12,C.panel2,C.text,2);
  /* Joints */
  var joints=[P.hip,P.neck,P.shoulderL,P.elbowL,P.shoulderR,P.elbowR,

  for(var j=0;j<joints.length;j++){

  /* Force vectors */

      dArrow(svg,P.handR[0],P.handR[1],P.handR[0],P.handR[1]+20,C.info,2);

    {j:P.hipR,label:'髋',val:S.m4.pose===3?30:45},

  ];

    ['平衡约束 Balance','ZMP/CoM稳定',C.warn],
    ['接触约束 Contact','足/手接触力',C.info],
    ['关节空间 Joint','力矩分配',C.purple],
    ['执行器 Motor','电流/位置控制',C.danger]

    var ly=py+50+l*60;
    el('rect',{x:px+15,y:ly,width:pw-30,height:48,fill:C.panel2,stroke:layers[l][2],'stroke-width':1.5,rx:6},svg);
    dText(svg,px+pw/2,ly+18,layers[l][0],12,layers[l][2],'middle','bold');
    dText(svg,px+pw/2,ly+36,layers[l][1],10,C.dim,'middle');
    if(l<layers.length-1){
      dArrow(svg,px+pw/2,ly+48,px+pw/2,ly+60,C.dim,1.5);

  var poseNames=['站立 Stand','行走 Walk','搬运 Carry','踢腿 Kick','平衡 Balance'];
  setInfo(3,[
    {hi:poseNames[S.m4.pose]},

}

/* ============================================================
   M5: Sim-to-Real — Simulation to Reality Transfer
   ============================================================ */
function renderM5(){
  var sh=modShell(4);
  var ctrl=sh.ctrl;
  S.m5={mode:0,rand:false,transfer:0,transferring:false};
  addBtn(ctrl,'仅仿真',function(){m5Mode(0);});
  addBtn(ctrl,'仅现实',function(){m5Mode(1);});
  addBtn(ctrl,'对比视图',function(){m5Mode(2);});
  addBtn(ctrl,'域随机化',m5Rand);
  addBtn(ctrl,'执行迁移',m5Transfer);
  m5Draw();
}
function m5Mode(m){S.m5.mode=m;m5Draw();}
function m5Rand(){S.m5.rand=!S.m5.rand;m5Draw();}
function m5Transfer(){
  S.m5.transferring=!S.m5.transferring;
  if(S.m5.transferring){
    animTimer=setInterval(function(){
      S.m5.transfer+=0.025;
      if(S.m5.transfer>=1){S.m5.transfer=0;}
      m5Draw();
    },33);
  } else {stopAnim();}
}
function m5Draw(){
  var svg=document.getElementById('svg4');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dText(svg,450,28,'Sim-to-Real 仿真到真实迁移',15,C.accent,'middle','bold');
  var showSim=S.m5.mode!==1;
  var showReal=S.m5.mode!==0;
  /* Sim panel */
  if(showSim){
    var sx=showReal?40:150,sw=showReal?380:600,sy=60,sh=380;
    el('rect',{x:sx,y:sy,width:sw,height:sh,fill:C.panel,stroke:C.info,'stroke-width':1.5,rx:8},svg);
    dText(svg,sx+sw/2,sy+22,'仿真环境 Simulation',13,C.info,'middle','bold');
    /* Grid floor */
    var gx=sx+20,gy=sy+250,gw=sw-40,gh=100;
    for(var i=0;i<=gw;i+=25){dLine(svg,gx+i,gy,gx+i+(gw/2-i/2)*0.3,gy+gh,C.grid2,1);}
    for(var j=0;j<=gh;j+=20){dLine(svg,gx+j*0.3,gy+j,gx+gw-j*0.3,gy+j,C.grid2,1);}
    /* Wireframe robot */
    var rx=sx+sw/2,ry=sy+200;
    m5RobotSim(svg,rx,ry,S.m5.rand);
    /* Randomization effects */
    if(S.m5.rand){
      for(var r=0;r<6;r++){
        var col=[C.accent,C.warn,C.purple,C.pink,C.info,C.danger][r];
        dCircle(svg,sx+30+r*5,sy+40,3,col);
      }
      dText(svg,sx+sw-20,sy+44,'域随机化 ON',10,C.warn,'end','bold');
      /* Friction/terrain variations */
      dText(svg,sx+20,sy+sh-15,'μ='+[(0.3+Math.random()*0.7).toFixed(2)]+'  m='+(1+Math.random()*3).toFixed(1)+'kg',9,C.dim,'start');
    }
    /* Sim stats */
    dText(svg,sx+20,sy+50,'10,000+ 并行环境',10,C.dim,'start');
    dText(svg,sx+20,sy+65,'1M steps/min',10,C.dim,'start');
  }
  /* Real panel */
  if(showReal){
    var rxs=showSim?480:150,rws=showSim?380:600,rys=60,rhs=380;
    el('rect',{x:rxs,y:rys,width:rws,height:rhs,fill:C.panel,stroke:C.accent,'stroke-width':1.5,rx:8},svg);
    dText(svg,rxs+rws/2,rys+22,'真实环境 Reality',13,C.accent,'middle','bold');
    /* Realistic ground */
    el('rect',{x:rxs+20,y:rys+250,width:rws-40,height:100,fill:'#1a1a1a',stroke:'none',rx:4},svg);
    for(var rg=0;rg<rws-40;rg+=20){
      el('rect',{x:rxs+20+rg,y:rys+250,width:10,height:100,fill:'#15151a',stroke:'none'},svg);
    }
    /* Solid robot */
    var rxr=rxs+rws/2,ryr=rys+200;
    m5RobotReal(svg,rxr,ryr);
    dText(svg,rxs+20,rys+50,'零样本部署',10,C.dim,'start');
    dText(svg,rxs+20,rys+65,'Real2Sim2Real',10,C.dim,'start');
    /* Performance */
    dText(svg,rxs+20,rys+rhs-15,'成功率: '+(S.m5.rand?'87%':'72%'),10,C.accent,'start','bold');
  }
  /* Transfer arrows */
  if(showSim&&showReal){
    var ax=420,ay=250;
    if(S.m5.transferring){
      /* Animated particles */
      for(var p=0;p<5;p++){
        var t=(S.m5.transfer+p*0.2)%1;
        var px=ax+t*60;
        var py2=ay+Math.sin(t*Math.PI)*-15;
        dCircle(svg,px,py2,4,C.warn,C.warn,1);
      }
    }
    dArrow(svg,ax-10,ay,ax+70,ay,C.warn,2);
    dText(svg,ax+30,ay-15,'迁移',11,C.warn,'middle','bold');
    dText(svg,ax+30,ay+25,'Transfer',9,C.dim,'middle');
  }
  /* Bottom pipeline */
  var py3=460;
  var stages=['仿真训练','域随机化','系统辨识','策略蒸馏','真实部署'];
  var sw2=150,gap=10;
  var totalW=stages.length*sw2+(stages.length-1)*gap;
  var startX=(900-totalW)/2;
  for(var s2=0;s2<stages.length;s2++){
    var bx3=startX+s2*(sw2+gap);
    el('rect',{x:bx3,y:py3,width:sw2,height:36,fill:C.panel2,stroke:s2===stages.length-1?C.accent:C.border,'stroke-width':1.5,rx:6},svg);
    dText(svg,bx3+sw2/2,py3+22,stages[s2],11,s2===stages.length-1?C.accent:C.text,'middle','bold');
    if(s2<stages.length-1){
      dArrow(svg,bx3+sw2,py3+18,bx3+sw2+gap,py3+18,C.dim,1.5);
    }
  }
  setInfo(4,[
    S.m5.rand?{hi:'域随机化 ON'}:'域随机化 OFF',
    S.m5.transferring?{hi:'迁移中...'}:'迁移就绪',
    '10K+ 并行环境','零样本部署','Sim2Real Gap'
  ]);
}

  dLine(svg,cx-12,cy+35,cx-15,cy+65,c,1.5);
  dLine(svg,cx+12,cy+35,cx+15,cy+65,c,1.5);

}

/* ============================================================
   M6: 感知系统 — Perception System
   ============================================================ */
function renderM6(){
  var sh=modShell(5);
  var ctrl=sh.ctrl;
  S.m6={sensor:0,scan:0,scanning:false};
  addBtn(ctrl,'视觉 Vision',function(){m6Sensor(0);});
  addBtn(ctrl,'深度 Depth',function(){m6Sensor(1);});
  addBtn(ctrl,'LiDAR',function(){m6Sensor(2);});
  addBtn(ctrl,'本体感知',function(){m6Sensor(3);});
  addBtn(ctrl,'触觉 Tactile',function(){m6Sensor(4);});
  addBtn(ctrl,'扫描',m6Scan);
  m6Draw();
}
function m6Sensor(s){S.m6.sensor=s;m6Draw();}
function m6Scan(){
  S.m6.scanning=!S.m6.scanning;
  if(S.m6.scanning){
    animTimer=setInterval(function(){
      S.m6.scan+=0.05;
      if(S.m6.scan>1)S.m6.scan=0;
      m6Draw();
    },33);
  } else {stopAnim();}
}
function m6Draw(){
  var svg=document.getElementById('svg5');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dText(svg,450,28,'多模态感知系统 · Multi-Modal Perception',15,C.accent,'middle','bold');
  /* Robot head */
  var hx=200,hy=240;
  el('rect',{x:hx-45,y:hy-50,width:90,height:100,fill:C.panel2,stroke:C.accent,'stroke-width':2,rx:12},svg);
  /* Camera eyes */
  dCircle(svg,hx-18,hy-20,10,C.panel,C.accent,2);
  dCircle(svg,hx+18,hy-20,10,C.panel,C.accent,2);
  dCircle(svg,hx-18,hy-20,4,C.accent);
  dCircle(svg,hx+18,hy-20,4,C.accent);
  /* Mouth/speaker */
  el('rect',{x:hx-20,y:hy+15,width:40,height:6,fill:C.panel,stroke:C.border,'stroke-width':1,rx:3},svg);
  /* LiDAR on top */
  dCircle(svg,hx,hy-58,8,C.panel2,C.warn,2);
  dCircle(svg,hx,hy-58,3,C.warn);
  /* IMU */
  el('rect',{x:hx+30,y:hy-45,width:12,height:12,fill:C.purple,rx:2},svg);
  dText(svg,hx+36,hy-30,'IMU',7,C.purple,'middle');
  dText(svg,hx,hy+70,'机器人头部传感器',11,C.dim,'middle');
  /* Sensor visualization area */
  var areaX=350,areaY=70,areaW=520,areaH=380;
  el('rect',{x:areaX,y:areaY,width:areaW,height:areaH,fill:C.panel,stroke:C.border,'stroke-width':1,rx:8},svg);
  var sensorNames=['视觉 Vision','深度 Depth','LiDAR','本体感知','触觉 Tactile'];
  dText(svg,areaX+areaW/2,areaY+22,sensorNames[S.m6.sensor]+' 感知',13,C.accent,'middle','bold');
  if(S.m6.sensor===0){
    /* Vision: camera FOV cones */
    var vcx=areaX+80,vcy=areaY+200;
    /* Left eye cone */
    el('path',{d:'M '+vcx+' '+vcy+' L '+(vcx+200)+' '+(vcy-100)+' L '+(vcx+200)+' '+(vcy+100)+' Z',fill:'rgba(77,159,255,0.08)',stroke:C.info,'stroke-width':1},svg);
    /* Right eye cone */
    el('path',{d:'M '+(vcx+20)+' '+vcy+' L '+(vcx+220)+' '+(vcy-100)+' L '+(vcx+220)+' '+(vcy+100)+' Z',fill:'rgba(77,159,255,0.06)',stroke:C.info,'stroke-width':1},svg);
    /* Detected objects */
    var objs=[[480,150,'人'],[550,220,'椅'],[500,280,'桌'],[580,300,'瓶']];
    for(var oi=0;oi<objs.length;oi++){
      el('rect',{x:objs[oi][0]-15,y:objs[oi][1]-12,width:30,height:24,fill:'none',stroke:C.accent,'stroke-width':1.5,rx:3},svg);
      dText(svg,objs[oi][0],objs[oi][1],objs[oi][2],10,C.accent,'middle','bold');
    }
    dText(svg,vcx+10,vcy+5,'相机',10,C.info,'middle');
    dText(svg,areaX+20,areaY+areaH-15,'FOV: 120° · 分辨率: 4K · 帧率: 60fps · 目标检测+语义分割',10,C.dim,'start');
  } else if(S.m6.sensor===1){
    /* Depth: colored depth map */
    var dx=areaX+40,dy=areaY+50,dw=440,dh=280;
    for(var di=0;di<dw;di+=8){
      for(var dj=0;dj<dh;dj+=8){
        var dist=Math.sqrt(Math.pow(di-dw/2,2)+Math.pow(dj-dh/2,2));
        var normDist=Math.min(1,dist/(dw/2));
        var hue=240-normDist*240;
        var opacity=0.3+0.5*(1-normDist);
        var cols=['#00d4aa','#4d9fff','#a855f7','#ffb347','#ff5566'];
        var ci=Math.floor(normDist*4);
        el('rect',{x:dx+di,y:dy+dj,width:8,height:8,fill:cols[Math.min(4,ci)],opacity:opacity,stroke:'none'},svg);
      }
    }
    /* Depth scale */
    dText(svg,areaX+20,areaY+areaH-50,'近',10,C.accent,'start','bold');
    dText(svg,areaX+areaW-20,areaY+areaH-50,'远',10,C.danger,'end','bold');
    dText(svg,areaX+20,areaY+areaH-15,'深度相机 · 测距范围: 0.3-10m · 精度: ±1cm · 点云: 30K pts',10,C.dim,'start');
  } else if(S.m6.sensor===2){
    /* LiDAR: rotating rays */
    var lcx=areaX+areaW/2,lcy=areaY+200;
    /* Range rings */
    for(var ri=1;ri<=4;ri++){
      dCircle(svg,lcx,lcy,ri*60,'none',C.grid,1);
    }
    /* Rays */
    var nRays=36;
    for(var li=0;li<nRays;li++){
      var ang=(li/nRays)*Math.PI*2+S.m6.scan*Math.PI*2;
      var rLen=180+Math.sin(li*0.7)*40;
      if(S.m6.scanning){
        rLen=180+Math.sin(li*0.7+S.m6.scan*10)*40;
      }
      var ex=lcx+Math.cos(ang)*rLen;
      var ey=lcy+Math.sin(ang)*rLen;
      dLine(svg,lcx,lcy,ex,ey,'rgba(255,179,71,0.3)',1);
      dCircle(svg,ex,ey,2,C.warn);
    }
    dCircle(svg,lcx,lcy,8,C.warn,C.warn,2);
    /* Detected obstacles */
    var obstacles=[[520,150],[650,220],[480,280]];
    for(var ob=0;ob<obstacles.length;ob++){
      dCircle(svg,obstacles[ob][0],obstacles[ob][1],6,'rgba(255,85,102,0.3)',C.danger,1.5);
    }
    dText(svg,areaX+20,areaY+areaH-15,'LiDAR · 360°扫描 · 频率: 10Hz · 距离: 100m · 点云: 300K pts/s',10,C.dim,'start');
  } else if(S.m6.sensor===3){
    /* Proprioception: joint angles */
    var jcx=areaX+areaW/2,jcy=areaY+200;
    /* Body diagram with joint angle readouts */
    dCircle(svg,jcx,jcy-80,14,C.panel2,C.accent,2);
    dLine(svg,jcx,jcy-66,jcx,jcy+20,C.accent,3);
    dLine(svg,jcx,jcy-50,jcx-35,jcy-10,C.info,3);
    dLine(svg,jcx,jcy-50,jcx+35,jcy-10,C.info,3);
    dLine(svg,jcx,jcy+20,jcx-20,jcy+70,C.accent,3);
    dLine(svg,jcx,jcy+20,jcx+20,jcy+70,C.accent,3);
    dLine(svg,jcx-20,jcy+70,jcx-25,jcy+120,C.accent,3);
    dLine(svg,jcx+20,jcy+70,jcx+25,jcy+120,C.accent,3);
    /* Joint labels */
    var joints6=[
      [jcx,jcy-50,'肩-30°',C.info],[jcx,jcy-50,'肩+30°',C.info],
      [jcx-20,jcy+70,'膝45°',C.accent],[jcx+20,jcy+70,'膝30°',C.accent],
      [jcx,jcy+20,'髋15°',C.warn],[jcx,jcy-66,'腰5°',C.warn]
    ];
    var jpos=[[jcx-50,jcy-60],[jcx+50,jcy-60],[jcx-55,jcy+90],[jcx+55,jcy+90],[jcx-40,jcy+30],[jcx+30,jcy-90]];
    for(var ji=0;ji<6;ji++){
      dCircle(svg,jpos[ji][0],jpos[ji][1],4,joints6[ji][2]);
      dText(svg,jpos[ji][0]+12,jpos[ji][1]+4,joints6[ji][2],9,joints6[ji][2],'start','bold');
    }
    dText(svg,areaX+20,areaY+areaH-15,'本体感知 · IMU+编码器+力矩传感器 · 关节角度/速度/力矩实时反馈',10,C.dim,'start');
  } else {
    /* Tactile: pressure map on hands */
    var thx=areaX+areaW/2,thy=areaY+100;
    /* Left hand */
    el('rect',{x:thx-100,y:thy,width:60,height:80,fill:C.panel2,stroke:C.accent,'stroke-width':2,rx:8},svg);
    dText(svg,thx-70,thy+95,'左手',10,C.dim,'middle');
    /* Right hand */
    el('rect',{x:thx+40,y:thy,width:60,height:80,fill:C.panel2,stroke:C.accent,'stroke-width':2,rx:8},svg);
    dText(svg,thx+70,thy+95,'右手',10,C.dim,'middle');
    /* Pressure dots */
    for(var pi=0;pi<8;pi++){
      for(var pj=0;pj<10;pj++){
        var pressure=Math.random();
        var pcol=pressure>0.7?C.danger:pressure>0.4?C.warn:C.accent;
        var palpha=0.2+pressure*0.6;
        el('circle',{cx:thx-95+pi*7,cy:thy+8+pj*7,r:2.5,fill:pcol,opacity:palpha},svg);
        el('circle',{cx:thx+45+pi*7,cy:thy+8+pj*7,r:2.5,fill:pcol,opacity:palpha},svg);
      }
    }
    /* Pressure scale */
    for(var ps=0;ps<5;ps++){
      var pcol2=[C.accent,C.accent,C.warn,C.warn,C.danger][ps];
      el('rect',{x:areaX+20+ps*30,y:areaY+areaH-45,width:25,height:8,fill:pcol2,opacity:0.5+ps*0.1,rx:2},svg);
    }
    dText(svg,areaX+20,areaY+areaH-50,'低压',9,C.dim,'start');
    dText(svg,areaX+170,areaY+areaH-50,'高压',9,C.dim,'start');
    dText(svg,areaX+20,areaY+areaH-15,'触觉传感 · 200+触觉点/手 · 压力+温度+滑动 · 1kHz采样',10,C.dim,'start');
  }
  setInfo(5,[
    {hi:sensorNames[S.m6.sensor]},
    S.m6.scanning?{hi:'扫描中'}:'扫描就绪',
    '4K 视觉','360° LiDAR','200+ 触觉点','1000Hz IMU'
  ]);
}

/* ============================================================
   M7: 学习架构 — Learning Architecture (RL/IL)
   ============================================================ */
function renderM7(){
  var sh=modShell(6);
  var ctrl=sh.ctrl;
  S.m7={mode:0,training:false,step:0,reward:0,data:[],epoch:0};
  /* Init training data */
  S.m7.data=[];
  for(var i=0;i<60;i++)S.m7.data.push(0);
  addBtn(ctrl,'强化学习 RL',function(){m7Mode(0);});
  addBtn(ctrl,'模仿学习 IL',function(){m7Mode(1);});
  addBtn(ctrl,'奖励函数',function(){m7Mode(2);});
  addBtn(ctrl,'训练曲线',function(){m7Mode(3);});
  addBtn(ctrl,'开始/暂停训练',m7Train);
  m7Draw();
}
function m7Mode(m){S.m7.mode=m;m7Draw();}
function m7Train(){
  S.m7.training=!S.m7.training;
  if(S.m7.training){
    animTimer=setInterval(function(){
      S.m7.step++;
      S.m7.epoch++;
      var base=S.m7.mode===0?0.85:S.m7.mode===1?0.75:0.5;
      var target=base*(1-Math.exp(-S.m7.epoch/30));
      var noise=(Math.random()-0.5)*0.08;
      S.m7.reward=Math.max(0,Math.min(1,target+noise));
      S.m7.data.push(S.m7.reward);
      if(S.m7.data.length>60)S.m7.data.shift();
      m7Draw();
    },100);
  } else {stopAnim();}
}
function m7Draw(){
  var svg=document.getElementById('svg6');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dText(svg,450,28,'策略学习架构 · Policy Learning Architecture',15,C.accent,'middle','bold');
  if(S.m7.mode===0){
    m7RL(svg);
  } else if(S.m7.mode===1){
    m7IL(svg);
  } else if(S.m7.mode===2){
    m7Reward(svg);
  } else {
    m7Curve(svg);
  }
  var modeNames=['强化学习 RL','模仿学习 IL','奖励函数','训练曲线'];
  setInfo(6,[
    {hi:modeNames[S.m7.mode]},
    S.m7.training?{hi:'训练中 E'+S.m7.epoch}:'训练就绪',
    'PPO/SAC','Actor-Critic','Sim2Real 微调'
  ]);
}
function m7NN(svg,lx,ly,lw,lh,layers,title){
  /* Neural network visualization */
  dText(svg,lx+lw/2,ly-8,title,12,C.accent,'middle','bold');
  var layerW=lw/(layers.length-1);
  var positions=[];
  for(var li=0;li<layers.length;li++){
    var n=layers[li];
    var x=lx+li*layerW;
    var pos=[];
    for(var ni=0;ni<n;ni++){
      var y=ly+lh/2-(n-1)*18+ni*36;
      pos.push([x,y]);
    }
    positions.push(pos);
  }
  /* Connections */
  for(var ci=0;ci<positions.length-1;ci++){
    for(var cj=0;cj<positions[ci].length;cj++){
      for(var ck=0;ck<positions[ci+1].length;ck++){
        dLine(svg,positions[ci][cj][0],positions[ci][cj][1],
          positions[ci+1][ck][0],positions[ci+1][ck][1],
          'rgba(0,212,170,0.12)',1);
      }
    }
  }
  /* Nodes */
  for(var ni2=0;ni2<positions.length;ni2++){
    var col=ni2===0?C.info:ni2===positions.length-1?C.warn:C.accent;
    for(var nj=0;nj<positions[ni2].length;nj++){
      dCircle(svg,positions[ni2][nj][0],positions[ni2][nj][1],7,C.panel2,col,2);
    }
    var labels=['输入','隐藏','隐藏','输出'];
    if(ni2<labels.length)dText(svg,positions[ni2][0][0],ly+lh+20,labels[ni2],10,C.dim,'middle');
  }
  return positions;
}
function m7RL(svg){
  /* RL pipeline: Agent <-> Environment */
  /* Agent box */
  el('rect',{x:100,y:80,width:200,height:100,fill:C.panel,stroke:C.accent,'stroke-width':2,rx:8},svg);
  dText(svg,200,108,'智能体 Agent',14,C.accent,'middle','bold');
  dText(svg,200,128,'Policy Network π(a|s)',11,C.dim,'middle');
  dText(svg,200,148,'Actor-Critic',11,C.dim,'middle');
  /* Environment box */
  el('rect',{x:600,y:80,width:200,height:100,fill:C.panel,stroke:C.info,'stroke-width':2,rx:8},svg);
  dText(svg,700,108,'环境 Environment',14,C.info,'middle','bold');
  dText(svg,700,128,'物理仿真器',11,C.dim,'middle');
  dText(svg,700,148,'Humanoid Sim',11,C.dim,'middle');
  /* Action arrow */
  dArrow(svg,300,110,600,110,C.accent,2);
  dText(svg,450,100,'动作 Action a',12,C.accent,'middle','bold');
  /* State arrow */
  dArrow(svg,600,150,300,150,C.info,2);
  dText(svg,450,165,'状态 State s',12,C.info,'middle','bold');
  /* Reward */
  dArrow(svg,700,180,700,220,C.warn,2);
  dArrow(svg,700,220,300,220,C.warn,2);
  dText(svg,500,212,'奖励 Reward r',12,C.warn,'middle','bold');
  /* Neural network */
  m7NN(svg,200,270,500,100,[4,6,6,3],'策略网络 Policy Network');
  /* Algorithm badges */
  var algos=['PPO','SAC','TD3','DDPG','A2C'];
  for(var a=0;a<algos.length;a++){
    var ax=120+a*130;
    el('rect',{x:ax,y:410,width:110,height:30,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
    dText(svg,ax+55,430,algos[a],12,C.accent,'middle','bold');
  }
}
function m7IL(svg){
  /* IL pipeline: Demonstrations -> Policy */
  /* Demonstration data */
  el('rect',{x:80,y:80,width:200,height:100,fill:C.panel,stroke:C.warn,'stroke-width':2,rx:8},svg);
  dText(svg,180,108,'示教数据',14,C.warn,'middle','bold');
  dText(svg,180,128,'Demonstrations',11,C.dim,'middle');
  dText(svg,180,148,'专家轨迹 1000+',11,C.dim,'middle');
  /* Policy */
  el('rect',{x:620,y:80,width:200,height:100,fill:C.panel,stroke:C.accent,'stroke-width':2,rx:8},svg);
  dText(svg,720,108,'策略网络',14,C.accent,'middle','bold');
  dText(svg,720,128,'BC / DAgger',11,C.dim,'middle');
  dText(svg,720,148,'Imitation Policy',11,C.dim,'middle');
  /* Arrow */
  dArrow(svg,280,110,620,110,C.warn,2);
  dText(svg,450,100,'行为克隆 BC',12,C.warn,'middle','bold');
  /* Feedback loop */
  dArrow(svg,720,180,720,220,C.info,2);
  dArrow(svg,720,220,180,220,C.info,1.5,'4,3');
  dText(svg,450,212,'DAgger 在线纠正',11,C.info,'middle','bold');
  /* Network */
  m7NN(svg,200,270,500,100,[5,8,8,4],'模仿学习网络');
  /* Methods */
  var methods=['Behavioral Cloning','DAgger','GAIL','Diffusion Policy'];
  for(var m=0;m<methods.length;m++){
    var mx=100+m*190;
    el('rect',{x:mx,y:410,width:170,height:30,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:6},svg);
    dText(svg,mx+85,430,methods[m],11,C.accent,'middle','bold');
  }
}
function m7Reward(svg){
  /* Reward function components */
  dText(svg,450,55,'奖励函数组成 · Reward Function',13,C.accent,'middle','bold');
  var comps=[
    {y:90,label:'前进速度',val:0.3,col:C.accent,desc:'鼓励向前移动'},
    {y:150,label:'能量效率',val:0.2,col:C.info,desc:'惩罚多余能耗'},
    {y:210,label:'步态平滑',val:0.15,col:C.purple,desc:'关节加速度惩罚'},
    {y:270,label:'稳定性',val:0.2,col:C.warn,desc:'ZMP/CoM约束'},
    {y:330,label:'存活奖励',val:0.1,col:C.pink,desc:'不摔倒加分'},
    {y:390,label:'目标到达',val:0.05,col:C.danger,desc:'到达目标点'}
  ];
  for(var i=0;i<comps.length;i++){
    var c=comps[i];
    /* Label */
    dText(svg,120,c.y+5,c.label,12,C.text,'start','bold');
    /* Bar background */
    el('rect',{x:250,y:c.y-10,width:400,height:20,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:4},svg);
    /* Bar fill */
    el('rect',{x:250,y:c.y-10,width:400*c.val,height:20,fill:c.col,opacity:0.7,rx:4},svg);
    /* Value */
    dText(svg,670,c.y+5,(c.val*100).toFixed(0)+'%',12,c.col,'start','bold');
    /* Description */
    dText(svg,740,c.y+5,c.desc,10,C.dim,'start');
  }
  /* Total */
  el('rect',{x:100,y:430,width:700,height:40,fill:C.accentDim,stroke:C.accent,'stroke-width':1.5,rx:6},svg);
  dText(svg,450,456,'Σ 总奖励 = 1.0  (归一化)',14,C.accent,'middle','bold');
}
function m7Curve(svg){
  /* Training curve chart */
  var cx=80,cy=60,cw=740,chh=360;
  /* Chart background */
  el('rect',{x:cx,y:cy,width:cw,height:chh,fill:C.panel,stroke:C.border,'stroke-width':1,rx:8},svg);
  dText(svg,cx+cw/2,cy+22,'训练曲线 · Training Curve',13,C.accent,'middle','bold');
  /* Axes */
  var ax=cx+60,ay=cy+40,aw=cw-100,ah=chh-80;
  dLine(svg,ax,ay,ax,ay+ah,C.border,2);
  dLine(svg,ax,ay+ah,ax+aw,ay+ah,C.border,2);
  /* Grid */
  for(var gi=0;gi<=5;gi++){
    var gy=ay+ah-(gi/5)*ah;
    dLine(svg,ax,gy,ax+aw,gy,C.grid,1);
    dText(svg,ax-8,gy+4,(gi*0.2).toFixed(1),9,C.dim,'end');
  }
  for(var gj=0;gj<=6;gj++){
    var gx2=ax+(gj/6)*aw;
    dLine(svg,gx2,ay,gx2,ay+ah,C.grid,1);
    dText(svg,gx2,ay+ah+16,gj*10+'k',9,C.dim,'middle');
  }
  /* Axis labels */
  dText(svg,ax-40,ay+ah/2,'奖励',11,C.dim,'middle',function(){return''});
  dText(svg,ax-35,ay+ah/2,'Reward',10,C.dim,'middle');
  dText(svg,ax+aw/2,ay+ah+36,'训练步数 Steps',10,C.dim,'middle');
  /* Plot data */
  var data=S.m7.data;
  var pts='';
  for(var di=0;di<data.length;di++){
    var px=ax+(di/(data.length-1))*aw;
    var py=ay+ah-data[di]*ah;
    pts+=(di===0?'M':'L')+px+' '+py+' ';
  }
  /* Area fill */
  var areaPath=pts+'L '+(ax+aw)+' '+(ay+ah)+' L '+ax+' '+(ay+ah)+' Z';
  el('path',{d:areaPath,fill:'rgba(0,212,170,0.15)',stroke:'none'},svg);
  /* Line */
  el('path',{d:pts,fill:'none',stroke:C.accent,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'},svg);
  /* Current point */
  if(data.length>0){
    var cpx=ax+aw;
    var cpy=ay+ah-data[data.length-1]*ah;
    dCircle(svg,cpx,cpy,5,C.accent,C.bg,2);
    dText(svg,cpx-15,cpy-8,data[data.length-1].toFixed(3),11,C.accent,'end','bold');
  }
  /* Stats */
  var avg=0;
  for(var si=0;si<data.length;si++)avg+=data[si];
  avg/=data.length;
  dText(svg,ax+aw-10,ay+15,'当前: '+(data[data.length-1]||0).toFixed(3),11,C.accent,'end','bold');
  dText(svg,ax+aw-10,ay+32,'均值: '+avg.toFixed(3),10,C.dim,'end');
  dText(svg,ax+10,ay+15,'Epoch: '+S.m7.epoch,10,C.dim,'start');
  if(S.m7.training){
    /* Pulsing indicator (non-infinite, via JS) */
    dCircle(svg,ax+20,ay+15,5,C.warn);
    dText(svg,ax+30,ay+19,'LIVE',10,C.warn,'start','bold');
  }
}

/* ============================================================
   M8: 生态对比 — Ecosystem Comparison
   ============================================================ */
function renderM8(){
  var sh=modShell(7);
  var ctrl=sh.ctrl;
  S.m8={metric:0};
  addBtn(ctrl,'自由度 DOF',function(){m8Metric(0);});
  addBtn(ctrl,'负载 Payload',function(){m8Metric(1);});
  addBtn(ctrl,'速度 Speed',function(){m8Metric(2);});
  addBtn(ctrl,'价格 Price',function(){m8Metric(3);});
  addBtn(ctrl,'综合雷达图',function(){m8Metric(4);});
  m8Draw();
}
function m8Metric(m){S.m8.metric=m;m8Draw();}
function m8Draw(){
  var svg=document.getElementById('svg7');
  clear(svg);
  el('rect',{x:0,y:0,width:900,height:520,fill:C.bg},svg);
  dText(svg,450,28,'全球人形机器人生态对比 · Ecosystem',15,C.accent,'middle','bold');
  var robots=[
    {name:'Atlas',company:'Boston Dynamics',color:C.accent,data:[28,25,2.5,150]},
    {name:'Optimus',company:'Tesla',color:C.info,data:[28,25,2.2,20]},
    {name:'H1',company:'Unitree',color:C.warn,data:[19,30,1.5,90]},
    {name:'Figure 01',company:'Figure AI',color:C.purple,data:[41,20,1.2,200]},
    {name:'Digit',company:'Agility Robotics',color:C.pink,data:[20,18,1.5,100]},
    {name:'Apollo',company:'Apptronik',color:C.danger,data:[28,25,1.6,120]}
  ];
  var metrics=['自由度 DOF','负载 (kg)','速度 (m/s)','价格 (k$)'];
  var maxVals=[45,35,3,250];
  if(S.m8.metric<4){
    m8Bars(svg,robots,metrics[S.m8.metric],S.m8.metric,maxVals[S.m8.metric]);
  } else {
    m8Radar(svg,robots);
  }
  var metricNames=['自由度对比','负载对比','速度对比','价格对比','综合雷达图'];
  setInfo(7,[{hi:metricNames[S.m8.metric]},'6款主流机器人','Atlas','Optimus','H1','Figure 01']);
}
function m8Bars(svg,robots,label,mi,maxVal){
  dText(svg,450,55,label+' 对比',14,C.accent,'middle','bold');
  var bx=120,by=90,bw=650,bh=360;
  el('rect',{x:bx,y:by,width:bw,height:bh,fill:C.panel,stroke:C.border,'stroke-width':1,rx:8},svg);
  var n=robots.length;
  var barW=60,gap=(bw-80)/n;
  var maxH=bh-80;
  /* Y axis grid */
  for(var gi=0;gi<=5;gi++){
    var gy=by+bh-40-(gi/5)*maxH;
    dLine(svg,bx+50,gy,bx+bw-20,gy,C.grid,1);
    dText(svg,bx+42,gy+4,(maxVal*gi/5).toFixed(mi===2||mi===3?1:0),9,C.dim,'end');
  }
  /* Bars */
  for(var i=0;i<n;i++){
    var r=robots[i];
    var val=r.data[mi];
    var h=(val/maxVal)*maxH;
    var x=bx+70+i*gap;
    var y=by+bh-40-h;
    /* Bar */
    el('rect',{x:x,y:y,width:barW,height:h,fill:r.color,opacity:0.7,rx:4},svg);
    el('rect',{x:x,y:y,width:barW,height:4,fill:r.color,rx:2},svg);
    /* Value */
    dText(svg,x+barW/2,y-8,val+(mi===0?' DOF':mi===1?' kg':mi===2?' m/s':' k$'),12,r.color,'middle','bold');
    /* Name */
    dText(svg,x+barW/2,by+bh-22,r.name,11,C.text,'middle','bold');
    dText(svg,x+barW/2,by+bh-8,r.company,8,C.dim,'middle');
  }
  /* Axis label */
  dText(svg,bx+10,by+bh/2,label,11,C.dim,'middle');
  dText(svg,bx+30,by+30,'↑ '+label,10,C.dim,'start');
  /* Note */
  el('rect',{x:bx,y:by+bh+5,width:bw,height:24,fill:C.panel2,stroke:C.border,'stroke-width':1,rx:4},svg);
  dText(svg,bx+bw/2,by+bh+21,'* 数据为近似值，仅用于可视化对比参考',10,C.dim,'middle');
}
function m8Radar(svg,robots){
  dText(svg,450,55,'综合能力雷达图 · Capability Radar',14,C.accent,'middle','bold');
  var cx=300,cy=270,radius=170;
  var dims=['DOF','负载','速度','智能','灵活性','价格优势'];
  var nD=dims.length;
  /* Radar grid */
  for(var ri=1;ri<=5;ri++){
    var rr=radius*ri/5;
    var pts='';
    for(var di=0;di<nD;di++){
      var ang=(di/nD)*Math.PI*2-Math.PI/2;
      pts+=(di===0?'M':'L')+(cx+Math.cos(ang)*rr)+' '+(cy+Math.sin(ang)*rr)+' ';
    }
    pts+='Z';
    el('path',{d:pts,fill:'none',stroke:C.grid,'stroke-width':1},svg);
  }
  /* Axis lines */
  for(var ai=0;ai<nD;ai++){
    var ang2=(ai/nD)*Math.PI*2-Math.PI/2;
    dLine(svg,cx,cy,cx+Math.cos(ang2)*radius,cy+Math.sin(ang2)*radius,C.border,1);
    dText(svg,cx+Math.cos(ang2)*(radius+25),cy+Math.sin(ang2)*(radius+25)+4,dims[ai],11,C.text,'middle','bold');
  }
  /* Robot polygons */
  var radarData=[
    [0.62,0.71,0.83,0.95,0.85,0.40], /* Atlas */
    [0.62,0.71,0.73,0.80,0.70,0.92], /* Optimus */
    [0.42,0.86,0.50,0.60,0.65,0.64], /* H1 */
    [0.91,0.57,0.40,0.98,0.90,0.20]  /* Figure 01 */
  ];
  var showRobots=[robots[0],robots[1],robots[2],robots[3]];
  for(var ri2=0;ri2<4;ri2++){
    var r=showRobots[ri2];
    var rd=radarData[ri2];
    var rpts='';
    for(var di2=0;di2<nD;di2++){
      var ang3=(di2/nD)*Math.PI*2-Math.PI/2;
      var rr2=radius*rd[di2];
      rpts+=(di2===0?'M':'L')+(cx+Math.cos(ang3)*rr2)+' '+(cy+Math.sin(ang3)*rr2)+' ';
    }
    rpts+='Z';
    el('path',{d:rpts,fill:r.color,opacity:0.1,stroke:r.color,'stroke-width':2},svg);
  }
  /* Legend */
  var lx=580,ly=120;
  el('rect',{x:lx,y:ly,width:280,height:200,fill:C.panel,stroke:C.border,'stroke-width':1,rx:8},svg);
  dText(svg,lx+140,ly+22,'图例 Legend',12,C.accent,'middle','bold');
  for(var li=0;li<4;li++){
    var lr=showRobots[li];
    el('rect',{x:lx+20,y:ly+45+li*35,width:16,height:16,fill:lr.color,opacity:0.7,rx:3},svg);
    dText(svg,lx+48,ly+57+li*35,lr.name,12,C.text,'start','bold');
    dText(svg,lx+160,ly+57+li*35,lr.company,10,C.dim,'start');
  }
  /* Note */
  dText(svg,lx+140,ly+190,'归一化评分 (0-1)',10,C.dim,'middle');
}
