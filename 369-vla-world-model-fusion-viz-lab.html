<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root{
  --bg:#0a0b0f; --bg-2:#0f1117; --bg-3:#161922; --bg-4:#1c2030;
  --border:#1e2433; --border-2:#2a3144;
  --text:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
  --teal:#00d4aa; --teal-dim:rgba(0,212,170,.16); --teal-soft:rgba(0,212,170,.08); --teal-glow:rgba(0,212,170,.35);
  --cyan:#22d3ee; --amber:#fbbf24; --red:#ef4444; --purple:#a78bfa; --blue:#3b82f6; --pink:#f472b6; --green:#34d399;
  --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.app-header{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;height:54px;padding:0 20px}
.hub-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);padding:6px 12px;border:1px solid var(--border);border-radius:6px;transition:.2s;white-space:nowrap}
.hub-link:hover{color:var(--teal);border-color:var(--teal)}
.header-title{font-size:14px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-title .sep{color:var(--text-3);margin:0 8px}
.header-title .ac{color:var(--teal)}
.header-badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:3px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.module-nav{position:sticky;top:54px;z-index:40;background:rgba(10,11,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px}
.nav-btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 13px;cursor:pointer;transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav-btn .nidx{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.nav-btn:hover{color:var(--text);background:var(--bg-3)}
.nav-btn.active{color:var(--teal);background:var(--teal-soft);border-color:var(--teal-dim);font-weight:600}
.nav-btn.active .nidx{color:var(--teal)}
.lab-main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.lab-hero{margin-bottom:24px}
.lab-hero .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:3px 9px;border-radius:4px;margin-bottom:14px;text-transform:uppercase}
.lab-hero h1{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.22;margin-bottom:10px}
.lab-hero h1 .grad{background:linear-gradient(120deg,var(--teal),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lab-hero p{color:var(--text-2);font-size:14px;max-width:820px;line-height:1.65}
.module-panel{display:none}
.module-panel.active{display:block;animation:mFade .4s ease}
@keyframes mFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.m-head .num{font-family:var(--mono);font-size:12px;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-dim);padding:2px 8px;border-radius:4px}
.m-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.m-head .sub{font-size:12px;color:var(--text-3);font-family:var(--mono)}
.m-desc{color:var(--text-2);font-size:13px;margin-bottom:16px;max-width:820px;line-height:1.6}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text);background:var(--bg-3);border:1px solid var(--border-2);border-radius:7px;padding:8px 15px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.active{background:var(--teal-soft);border-color:var(--teal-dim);color:var(--teal);font-weight:600}
.viz-wrap{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;overflow:hidden;position:relative}
.viz-wrap svg{display:block;width:100%;height:auto}
.status-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat-pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg-3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px}
.stat-pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat-pill .label{color:var(--text-3);font-size:11px}
.stat-pill .val{color:var(--text);font-weight:600;font-family:var(--mono)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.info-card{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:15px;transition:.2s}
.info-card:hover{border-color:var(--teal-dim)}
.info-card .k{font-family:var(--mono);font-size:10.5px;color:var(--teal);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.info-card .v{font-size:13.5px;color:var(--text);font-weight:600;margin-bottom:4px}
.info-card .d{font-size:12px;color:var(--text-3);line-height:1.55}
.legend-row{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text-2);margin-top:10px;font-family:var(--mono)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{fill:var(--text);font-family:var(--sans)}
svg .lbl{font-size:11px;fill:var(--text-2)}
svg .dim{fill:var(--text-3)}
svg .mono{font-family:var(--mono)}
svg .ttl{font-size:13px;font-weight:600;fill:var(--text)}
svg .sub{font-size:10.5px;fill:var(--text-3)}
svg .flow-rect{transition:.25s}
svg .flow-rect:hover{stroke-width:2.2}
.apulse{animation:apulse 1.6s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}
.aglow{animation:aglow 2s ease-in-out infinite}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 1px var(--teal))}50%{filter:drop-shadow(0 0 7px var(--teal))}}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
@keyframes adash{to{stroke-dashoffset:-20}}
.ablink{animation:ablink 1.2s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.15}}
.aspin{transform-origin:center;animation:aspin 8s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
@media (max-width:760px){.header-title{font-size:12px}.lab-hero h1{font-size:21px}.nav-btn{font-size:11px;padding:6px 9px}.nav-btn .nidx{display:none}.info-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="app-header"><div class="header-inner"><a href="index.html" class="hub-link">&#8592; TW Hub</a><span class="header-title">TW<span class="sep">/</span><span class="ac">VLA世界模型融合与物理AI终局可视化实验室</span></span><span class="header-badge">VIZ LAB / 369</span></div></header>
<nav class="module-nav"><div class="nav-inner" id="nav-inner"></div></nav>
<main class="lab-main">
<div class="lab-hero"><span class="tag">VLA × WORLD MODEL / PHYSICAL AI</span><h1>VLA世界模型 <span class="grad">融合与物理AI终局</span> 可视化实验室</h1><p>从VLA到世界模型，从博弈到融合——系统呈现2026年具身智能两大技术路线的融合全景。覆盖VLA架构演进、世界模型(WAM)技术架构、VLA×WAM融合架构、物理AI评测基准、具身智能ChatGPT时刻、产业链商业化与物理AI终局愿景，解构从"会说话"到"会做"的AI范式跃迁。</p></div>
<div id="module-stage"></div>
</main>
<script>
/* ===== 颜色常量 ===== */
var C={
  bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',
  border:'#1e2433',border2:'#2a3144',
  text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',
  teal:'#00d4aa',tealDim:'rgba(0,212,170,.16)',tealSoft:'rgba(0,212,170,.08)',
  cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',
  mono:"'SF Mono','JetBrains Mono',Consolas,monospace"
};
var SVGNS='http://www.w3.org/2000/svg';

/* ===== 工具函数 ===== */
function $(id){return document.getElementById(id);}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}
function E(p,t,a){var e=document.createElementNS(SVGNS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function box(g,x,y,w,h,o){
  o=o||{};var r=E(g,'rect',{x:x,y:y,width:w,height:h,rx:o.rx||7,fill:o.fill||C.bg3,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3});
  if(o.cls)r.setAttribute('class',o.cls);return r;
}
function lbox(g,x,y,w,h,title,sub,o){
  o=o||{};box(g,x,y,w,h,o);
  if(o.top){txt(g,o.left?x+14:x+w/2,y+22,title,{f:o.tf||C.text,s:o.ts||13,w:600,a:o.left?'start':'middle'});
    if(sub)txt(g,o.left?x+14:x+w/2,y+40,sub,{f:o.sf||C.text3,s:10.5,a:o.left?'start':'middle'});}
  else{txt(g,x+w/2,y+h/2+(sub?-6:4),title,{f:o.tf||C.text,s:o.ts||13,w:600});
    if(sub)txt(g,x+w/2,y+h/2+14,sub,{f:o.sf||C.text3,s:10.5});}
}
function txt(g,x,y,s,o){
  o=o||{};var t=E(g,'text',{x:x,y:y,'text-anchor':o.a||'middle',fill:o.f||C.text,'font-size':o.s||11,'font-weight':o.w||400});
  if(o.mono)t.setAttribute('font-family',C.mono);t.textContent=s;return t;
}
function line(g,x1,y1,x2,y2,o){o=o||{};return E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:o.stroke||C.border2,'stroke-width':o.sw||1.4,'stroke-dasharray':o.dash||'none',class:o.cls||''});}
function arrow(g,x1,y1,x2,y2,o){
  o=o||{};var col=o.stroke||C.text2;var sw=o.sw||1.5;
  E(g,'line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':sw,'stroke-dasharray':o.dash||'none',class:o.cls||''});
  var ang=Math.atan2(y2-y1,x2-x1);var ah=o.ah||7;
  E(g,'polygon',{points:x2+','+y2+' '+(x2-ah*Math.cos(ang-0.42))+','+(y2-ah*Math.sin(ang-0.42))+' '+(x2-ah*Math.cos(ang+0.42))+','+(y2-ah*Math.sin(ang+0.42)),fill:col});
}
function circ(g,cx,cy,r,o){o=o||{};return E(g,'circle',{cx:cx,cy:cy,r:r,fill:o.fill||C.tealSoft,stroke:o.stroke||C.teal,'stroke-width':o.sw||1.5,class:o.cls||''});}
function poly(g,pts,o){o=o||{};return E(g,'polygon',{points:pts.join(' '),fill:o.fill||'none',stroke:o.stroke||C.border2,'stroke-width':o.sw||1.3,class:o.cls||''});}

/* ===== HTML 容器填充 ===== */
function setPills(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){
  var s=document.createElement('span');s.className='stat-pill';
  var d=document.createElement('span');d.className='dot';d.style.background=p.c||C.teal;
  var l=document.createElement('span');l.className='label';l.textContent=p.k;
  var v=document.createElement('span');v.className='val';v.textContent=p.v;
  s.appendChild(d);s.appendChild(l);s.appendChild(v);c.appendChild(s);});}
function setLegend(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){
  var s=document.createElement('span');var i=document.createElement('i');i.style.background=p.c;
  s.appendChild(i);s.appendChild(document.createTextNode(p.t));c.appendChild(s);});}
function setInfo(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){
  var d=document.createElement('div');d.className='info-card';
  var k=document.createElement('div');k.className='k';k.textContent=p.k;
  var v=document.createElement('div');v.className='v';v.textContent=p.v;
  var de=document.createElement('div');de.className='d';de.textContent=p.d;
  d.appendChild(k);d.appendChild(v);d.appendChild(de);c.appendChild(d);});}

/* ===== 雷达图 ===== */
function radar(g,cx,cy,r,labels,values,color){
  var n=labels.length,k,i,a,rr;
  for(k=1;k<=4;k++){var pts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*k/4;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}
    E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:'#1e2433','stroke-width':1});}
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:'#1e2433',sw:1});}
  var dpts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];dpts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}
  E(g,'polygon',{points:dpts.join(' '),fill:color+'33',stroke:color,'stroke-width':2,cls:'aglow'});
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:color,stroke:'none'});}
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lr=r+20;txt(g,cx+lr*Math.cos(a),cy+lr*Math.sin(a)+4,labels[i],{s:10.5,f:C.text2});}
}

/* ===== 模块元数据 ===== */
var MODULES=[
  {id:'m1',num:'M1',title:'VLA与世界模型全景',sub:'VLA & WAM OVERVIEW',desc:'纵览2026年具身智能两大技术路线：视觉-语言-动作模型(VLA)与世界动作模型(WAM)，对比全球头部玩家格局与核心能力维度。',views:['技术路线','全球格局','能力对比'],draw:'m1Draw',view:'m1View'},
  {id:'m2',num:'M2',title:'VLA架构演进',sub:'VLA ARCHITECTURE EVOLUTION',desc:'从RT-1到OpenVLA再到TG-VLA，追踪VLA模型架构演进、参数规模扩展与训练范式从预训练到微调到强化学习的全流程跃迁。',views:['架构演进','模型规模','训练范式'],draw:'m2Draw',view:'m2View'},
  {id:'m3',num:'M3',title:'世界模型(WAM)技术架构',sub:'WORLD ACTION MODEL',desc:'解构世界动作模型(WAM)的核心架构、未来状态预测引擎与基于仿真环境的训练闭环，刻画从"理解"到"预测"的范式升级。',views:['WAM架构','预测引擎','仿真训练'],draw:'m3Draw',view:'m3View'},
  {id:'m4',num:'M4',title:'VLA×WAM融合架构',sub:'VLA-WAM FUSION',desc:'呈现VLA与世界模型的融合范式、大脑-小脑协同架构与融合过程中的核心技术挑战，解构两条路线走向统一的技术路径。',views:['融合范式','协同架构','技术挑战'],draw:'m4Draw',view:'m4View'},
  {id:'m5',num:'M5',title:'物理AI评测基准',sub:'PHYSICAL AI BENCHMARKS',desc:'覆盖PhyBench与RoboEval物理AI评测体系，对比主流基准指标与多场景覆盖度，刻画从数字到物理的能力度量。',views:['评测体系','基准对比','场景覆盖'],draw:'m5Draw',view:'m5View'},
  {id:'m6',num:'M6',title:'具身智能ChatGPT时刻',sub:'EMBODIED AI CHATGPT MOMENT',desc:'预测具身智能ChatGPT时刻的到来时间窗(2-5年)，剖析数据、泛化、成本三大关键瓶颈与突破路径，展望范式跃迁临界点。',views:['时间预测','关键瓶颈','突破路径'],draw:'m6Draw',view:'m6View'},
  {id:'m7',num:'M7',title:'产业链与商业化',sub:'INDUSTRY & COMMERCIALIZATION',desc:'梳理从模型、芯片、机器人到场景的具身智能产业链全景，分析落地场景与商业化成本结构，刻画从实验室到量产的路径。',views:['产业链','落地场景','成本分析'],draw:'m7Draw',view:'m7View'},
  {id:'m8',num:'M8',title:'物理AI终局愿景',sub:'PHYSICAL AI ENDGAME',desc:'描绘2026-2035物理AI技术路线图，展望通用具身智能形态与文明级愿景，解构从专用机器人到通用具身智能的终极演进。',views:['技术路线','通用具身','文明愿景'],draw:'m8Draw',view:'m8View'}
];

/* ===== 全局状态 ===== */
var mLayers={},mViews=[0,0,0,0,0,0,0,0];

/* ===== 构建 ===== */
function buildNav(){
  var n=$('nav-inner');MODULES.forEach(function(m,i){
    var b=document.createElement('button');b.className='nav-btn'+(i===0?' active':'');b.dataset.i=i;
    b.innerHTML='<span class="nidx">'+m.num+'</span>'+m.title;b.onclick=function(){showModule(i);};n.appendChild(b);});}
function buildStage(){
  var stage=$('module-stage');MODULES.forEach(function(m,i){
    var p=document.createElement('div');p.className='module-panel'+(i===0?' active':'');p.id='panel-'+m.id;
    var btns=m.views.map(function(v,j){return '<button class="btn'+(j===0?' active':'')+'" id="'+m.id+'-btn'+j+'" onclick="'+m.view+'('+j+')">'+v+'</button>';}).join('');
    p.innerHTML='<div class="m-head"><span class="num">'+m.num+'</span><h2>'+m.title+'</h2><span class="sub">'+m.sub+'</span></div>'+
      '<div class="m-desc">'+m.desc+'</div><div class="ctrl-row">'+btns+'</div>'+
      '<div class="status-bar" id="'+m.id+'-stat"></div>'+
      '<div class="viz-wrap"><svg viewBox="0 0 900 480"><g id="'+m.id+'-layer"></g></svg><div class="legend-row" id="'+m.id+'-leg"></div></div>'+
      '<div class="info-grid" id="'+m.id+'-info"></div>';
    stage.appendChild(p);mLayers[m.id]=$('m'+(i+1)+'-layer');});}
function setView(idx,v){mViews[idx]=v;var m=MODULES[idx];for(var j=0;j<3;j++){var b=$(m.id+'-btn'+j);if(b)b.classList.toggle('active',j===v);}window[m.draw]();}
function showModule(idx){
  var panels=document.querySelectorAll('.module-panel');panels.forEach(function(p){p.classList.remove('active');});
  $('panel-'+MODULES[idx].id).classList.add('active');
  var btns=document.querySelectorAll('.nav-btn');btns.forEach(function(b){b.classList.toggle('active',b.dataset.i==idx);});
  window[MODULES[idx].draw]();}
function init(){buildNav();buildStage();showModule(0);}

/* ============================================================
   M1 · VLA与世界模型全景
   ============================================================ */
