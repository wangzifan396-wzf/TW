<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW · AI 伦理与公平性可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg-elev:#111317;--bg-elev-2:#16181d;--bg-elev-3:#1c1f26;
  --border:#1f2128;--border-strong:#2a2d36;
  --text:#e4e4e7;--text-dim:#8b8d96;--text-faint:#56575e;
  --accent:#eab308;--accent-dim:#a16207;--accent-soft:rgba(234,179,8,.12);--accent-glow:rgba(234,179,8,.35);
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--cyan:#06b6d4;
  --mono:'SF Mono',ui-monospace,'Cascadia Code','Fira Code',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,var(--accent-soft),transparent 60%);pointer-events:none;z-index:0}
nav{position:sticky;top:0;z-index:100;background:rgba(10,11,15,.85);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px}
nav .brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:-.01em}
nav .brand .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
nav .brand .sep{color:var(--text-faint)}
nav .back{margin-left:auto;font-size:12px;color:var(--text-dim);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:6px;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
nav .back:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-elev)}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px 24px 80px}
.hero{margin-bottom:32px}
.hero .eyebrow{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.hero h1{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
.hero p{color:var(--text-dim);font-size:14px;max-width:640px}
.hero .meta{display:flex;gap:16px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.hero .meta span{display:flex;align-items:center;gap:5px}
.hero .meta span::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent-dim)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:none;border:none;padding:8px 12px;cursor:pointer;border-radius:6px 6px 0 0;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;position:relative;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tab .num{color:var(--text-faint);margin-right:6px}
.tab.active .num{color:var(--accent-dim)}
.module{display:none;animation:fade .3s ease}
.module.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mod-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.mod-head h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.mod-head .idx{font-family:var(--mono);font-size:11px;color:var(--accent-dim)}
.mod-desc{color:var(--text-dim);font-size:13px;margin-bottom:20px;max-width:720px}
.canvas{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.canvas svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;font-family:var(--mono);font-size:10px;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-swatch{width:10px;height:10px;border-radius:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.btn{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--bg-elev);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
.btn:hover{color:var(--text);border-color:var(--border-strong)}
.btn.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.info-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:14px}
.info-card .k{font-family:var(--mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.info-card .v{font-size:13px;color:var(--text)}
.info-card .v code{font-family:var(--mono);color:var(--accent);font-size:12px}
.code-block{font-family:var(--mono);font-size:11px;line-height:1.7;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:8px;padding:14px;color:var(--text-dim);overflow-x:auto;margin-top:12px}
.code-block .kw{color:var(--accent)}.code-block .fn{color:var(--blue)}.code-block .str{color:var(--green)}.code-block .cmt{color:var(--text-faint)}
.svg-label{font-family:var(--mono);font-size:10px;fill:var(--text-dim)}
.svg-node{transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s}
.pulse{animation:pulse 2s ease-in-out 8s}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.flow-dash{stroke-dasharray:4 4;animation:dash 1.5s linear 8s}
@keyframes dash{to{stroke-dashoffset:-16}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flow-dash{stroke-dasharray:none}}
@media(max-width:640px){.hero h1{font-size:22px}.tabs{gap:4px}.tab{padding:6px 8px;font-size:10px}main{padding:24px 14px 60px}}
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="dot"></span>TW<span class="sep">/</span>AI 伦理与公平性可视化实验室</div>
  <a class="back" href="#">← 返回 TW Hub</a>
</nav>
<main>
  <div class="hero">
    <div class="eyebrow">AI Ethics & Fairness · Lab 169</div>
    <h1>AI 伦理与公平性可视化实验室</h1>
    <p>从偏见来源追踪到公平性度量，从伦理框架到价值对齐，系统化拆解 AI 系统中的道德困境与治理路径，让负责任的 AI 可视、可审、可问责。</p>
    <div class="meta"><span>8 个交互模块</span><span>SVG 矢量可视化</span><span>实时动画</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="modules"></div>
</main>
<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
const MODULES=[
  {id:0,title:"算法偏见来源",desc:"偏见沿数据采集、模型训练、部署决策三个阶段逐级放大。历史数据偏差经模型拟合固化为系统性歧视，最终在真实场景造成不公。"},
  {id:1,title:"公平性度量",desc:"Demographic Parity、Equal Opportunity、Equalized Odds 等指标从不同视角量化公平性，各指标间存在数学冲突，需按场景取舍。"},
  {id:2,title:"伦理框架对比",desc:"功利主义追求总体效用最大化，义务论强调规则与义务，美德伦理关注品格培养，三种框架在 AI 决策中各有适用边界。"},
  {id:3,title:"道德推理模型",desc:"MoralBERT 等模型通过大规模道德语料学习道德判断，在伦理困境中预测人类价值取向，实现结构化的道德推理。"},
  {id:4,title:"价值对齐",desc:"Inverse RL 从专家示范中反推奖励函数，RLHF 用人类反馈微调模型，两者共同让 AI 行为对齐人类真实价值观。"},
  {id:5,title:"算法问责",desc:"影响评估在部署前预估系统性风险，责任链追溯从开发者到部署方的权责边界，构建端到端的问责机制。"},
  {id:6,title:"隐私伦理",desc:"差分隐私注入噪声保护个体，联邦学习保留数据本地化，二者在隐私保护与模型效用之间寻找帕累托最优。"},
  {id:7,title:"AI 人权框架",desc:"AI 系统对隐私权、平等权、言论自由等基本权利产生潜在影响，需通过人权影响评估在设计与部署阶段前置审查。"}
];
const ACC="#eab308";
function buildTabs(){const c=document.getElementById("tabs");MODULES.forEach((m,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span>${m.title}`;b.onclick=()=>select(i);c.appendChild(b)})}
function buildModules(){const c=document.getElementById("modules");MODULES.forEach((m,i)=>{const d=document.createElement("section");d.className="module"+(i===0?" active":"");d.id="mod-"+i;d.innerHTML=`<div class="mod-head"><span class="idx">M${String(i+1).padStart(2,"0")}</span><h2>${m.title}</h2></div><p class="mod-desc">${m.desc}</p><div class="canvas" id="cv-${i}"></div>`;c.appendChild(d)});MODULES.forEach((m,i)=>render[i](i))}
let current=0;
function select(i){document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));document.querySelectorAll(".module").forEach((m,j)=>m.classList.toggle("active",j===i));current=i}
const render=[];
// M0 算法偏见传播链
render[0]=(i)=>{const c=document.getElementById("cv-"+i);c.innerHTML=`
<div class="legend"><div class="legend-item"><div class="legend-swatch" style="background:#3b82f6"></div>数据偏见</div><div class="legend-item"><div class="legend-swatch" style="background:#f59e0b"></div>模型偏见</div><div class="legend-item"><div class="legend-swatch" style="background:#ef4444"></div>部署偏见</div></div>
<svg viewBox="0 0 720 300" id="svg0">
<defs><marker id="ar0" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="#56575e"/></marker></defs>
<g id="bias-stages"></g>
<g id="bias-flow"></g>
</svg>
<div class="info-grid" style="margin-top:14px">
<div class="info-card"><div class="k">数据层</div><div class="v">采样偏差 / 历史歧视</div></div>
<div class="info-card"><div class="k">模型层</div><div class="v">目标函数放大偏差</div></div>
<div class="info-card"><div class="k">部署层</div><div class="v">反馈循环固化不公</div></div>
<div class="info-card"><div class="k">缓解</div><div class="v">去偏 / 审计 / 监测</div></div>
</div>`;
const svg=c.querySelector("svg");const ns="http://www.w3.org/2000/svg";const sG=svg.querySelector("#bias-stages"),fG=svg.querySelector("#bias-flow");
const stages=[["数据采集",120,150,"#3b82f6"],["模型训练",360,150,"#f59e0b"],["部署决策",600,150,"#ef4444"]];
const bias=[[60,80,"采样不足"],[60,220,"标签噪声"],[300,70,"损失偏差"],[300,230,"过拟合"],[540,80,"阈值不公"],[540,230,"反馈循环"]];
bias.forEach(b=>{const t=document.createElementNS(ns,"text");t.setAttribute("x",b[0]);t.setAttribute("y",b[1]);t.setAttribute("class","svg-label");t.setAttribute("font-size",9);t.setAttribute("fill","#56575e");t.textContent=b[2];sG.appendChild(t)});
stages.forEach(s=>{const g=document.createElementNS(ns,"g");const r=document.createElementNS(ns,"rect");r.setAttribute("x",s[1]-55);r.setAttribute("y",s[2]-30);r.setAttribute("width",110);r.setAttribute("height",60);r.setAttribute("rx",8);r.setAttribute("fill","#111317");r.setAttribute("stroke",s[3]);r.setAttribute("stroke-width",1.5);g.appendChild(r);const t=document.createElementNS(ns,"text");t.setAttribute("x",s[1]);t.setAttribute("y",s[2]+5);t.setAttribute("class","svg-label");t.setAttribute("text-anchor","middle");t.setAttribute("fill",s[3]);t.textContent=s[0];g.appendChild(t);sG.appendChild(g)});
[[0,1],[1,2]].forEach(p=>{const a=stages[p[0]],b=stages[p[1]];const l=document.createElementNS(ns,"line");l.setAttribute("x1",a[1]+55);l.setAttribute("y1",a[2]);l.setAttribute("x2",b[1]-55);l.setAttribute("y2",b[2]);l.setAttribute("stroke","#56575e");l.setAttribute("stroke-width",1.5);l.setAttribute("marker-end","url(#ar0)");l.setAttribute("class","flow-dash");fG.appendChild(l)});
// bias meter bars
const meters=[120,360,600];const colors=["#3b82f6","#f59e0b","#ef4444"];const vals=[.3,.55,.78];
meters.forEach((mx,mi)=>{const bg=document.createElementNS(ns,"rect");bg.setAttribute("x",mx-40);bg.setAttribute("y",240);bg.setAttribute("width",80);bg.setAttribute("height",6);bg.setAttribute("rx",3);bg.setAttribute("fill","#1f2128");sG.appendChild(bg);const bar=document.createElementNS(ns,"rect");bar.setAttribute("x",mx-40);bar.setAttribute("y",240);bar.setAttribute("width",80*vals[mi]);bar.setAttribute("height",6);bar.setAttribute("rx",3);bar.setAttribute("fill",colors[mi]);bar.setAttribute("id","bias-meter-"+mi);sG.appendChild(bar);const t=document.createElementNS(ns,"text");t.setAttribute("x",mx);t.setAttribute("y",262);t.setAttribute("class","svg-label");t.setAttribute("text-anchor","middle");t.setAttribute("fill",colors[mi]);t.setAttribute("id","bias-val-"+mi);t.textContent="偏见 "+Math.round(vals[mi]*100)+"%";sG.appendChild(t)});
let t=0;
function anim0(){t+=0.01;meters.forEach((mx,mi)=>{const v=vals[mi]+Math.sin(t+mi)*.06;const bar=document.getElementById("bias-meter-"+mi);const tx=document.getElementById("bias-val-"+mi);if(bar)bar.setAttribute("width",80*Math.max(0,Math.min(1,v)));if(tx)tx.textContent="偏见 "+Math.round(Math.max(0,Math.min(1,v))*100)+"%"});requestAnimationFrame(anim0)}anim0();
};
// M1 公平性度量
render[1]=(i)=>{const c=document.getElementById("cv-"+i);c.innerHTML=`
<div class="controls"><button class="btn active" data-m="dp">人口统计平等</button><button class="btn" data-m="eo">机会均等</button><button class="btn" data-m="eod">均等赔率</button></div>
<svg viewBox="0 0 720 300" id="svg1">
<g id="fairness-groups"></g>
</svg>
<div class="info-grid" style="margin-top:14px">
<div class="info-card"><div class="k">DP</div><div class="v"><code>P(Ŷ=1|A=0)=P(Ŷ=1|A=1)</code></div></div>
<div class="info-card"><div class="k">EO</div><div class="v"><code>P(Ŷ=1|Y=1,A)=P(Ŷ=1|Y=1)</code></div></div>
<div class="info-card"><div class="k">EqOdds</div><div class="v">TPR 与 FPR 均相等</div></div>
<div class="info-card"><div class="k">权衡</div><div class="v">公平 vs 准确率</div></div>
</div>`;
const svg=c.querySelector("svg");const ns="http://www.w3.org/2000/svg";const g=svg.querySelector("#fairness-groups");
const groups=[["群体 A",180],["群体 B",540]];
groups.forEach(gr=>{const r=document.createElementNS(ns,"rect");r.setAttribute("x",gr[1]-90);r.setAttribute("y",40);r.setAttribute("width",180);r.setAttribute("height",220);r.setAttribute("rx",10);r.setAttribute("fill","none");r.setAttribute("stroke","#2a2d36");r.setAttribute("stroke-width",1);g.appendChild(r);const t=document.createElementNS(ns,"text");t.setAttribute("x",gr[1]);t.setAttribute("y",30);t.setAttribute("class","svg-label");t.setAttribute("text-anchor","middle");t.setAttribute("fill",ACC);t.textContent=gr[0];g.appendChild(t)});
// TP/FN/FP/TN quadrants
function drawQuad(cx,label,x,y,w,h,color){const r=document.createElementNS(ns,"rect");r.setAttribute("x",cx+x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);r.setAttribute("fill",color);r.setAttribute("opacity",.25);r.setAttribute("rx",3);g.appendChild(r);const t=document.createElementNS(ns,"text");t.setAttribute("x",cx+x+w/2);t.setAttribute("y",y+h/2+4);t.setAttribute("class","svg-label");t.setAttribute("text-anchor","middle");t.setAttribute("id","q-"+label);t.textContent=label;g.appendChild(t)}
drawQuad(90,"TP",-70,60,65,55,ACC);drawQuad(90,"FN",5,60,65,55,"#22c55e");
drawQuad(90,"FP",-70,120,65,55,"#f59e0b");drawQuad(90,"TN",5,120,65,55,"#3b82f6");
drawQuad(450,"TP",-70,60,65,55,ACC);drawQuad(450,"FN",5,60,65,55,"#22c55e");
drawQuad(450,"FP",-70,120,65,55,"#f59e0b");drawQuad(450,"TN",5,120,65,55,"#3b82f6");
// metric display
const mb=document.createElementNS(ns,"rect");mb.setAttribute("x",260);mb.setAttribute("y",220);mb.setAttribute("width",200);mb.setAttribute("height",50);mb.setAttribute("rx",8);mb.setAttribute("fill","#111317");mb.setAttribute("stroke",ACC);mb.setAttribute("stroke-width",1.3);g.appendChild(mb);
const mt=document.createElementNS(ns,"text");mt.setAttribute("x",360);mt.setAttribute("y",240);mt.setAttribute("class","svg-label");mt.setAttribute("text-anchor","middle");mt.setAttribute("fill",ACC);mt.setAttribute("id","metric-name");mt.textContent="人口统计平等";g.appendChild(mt);
const mv=document.createElementNS(ns,"text");mv.setAttribute("x",360);mv.setAttribute("y",260);mv.setAttribute("class","svg-label");mv.setAttribute("text-anchor","middle");mv.setAttribute("fill","#22c55e");mv.setAttribute("id","metric-val");mv.textContent="差异: 0.12";g.appendChild(mv);
const metrics={"dp":{name:"人口统计平等",val:"差异: 0.12"},"eo":{name:"机会均等",val:"TPR差: 0.08"},"eod":{name:"均等赔率",val:"TPR+FRP差: 0.15"}};
c.querySelectorAll(".btn").forEach(b=>b.onclick=()=>{c.querySelectorAll(".btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");const m=metrics[b.dataset.m];document.getElementById("metric-name").textContent=m.name;document.getElementById("metric-val").textContent=m.val});
let t=0;
function anim1(){t+=0.02;const diff=.12+.08*Math.abs(Math.sin(t));const mv=document.getElementById("metric-val");if(mv&&document.querySelector('[data-m="dp"].active'))mv.textContent="差异: "+diff.toFixed(2);requestAnimationFrame(anim1)}anim1();
};
// M2 伦理框架对比
render[2]=(i)=>{const c=document.getElementById("cv-"+i);c.innerHTML=`
<svg viewBox="0 0 720 320" id="svg2">
<g id="ethics-frames"></g>
</svg>
<div class="info-grid" style="margin-top:14px">
<div class="info-card"><div class="k">功利主义</div><div class="v">最大化总体效用 · 结果导向</div></div>
<div class="info-card"><div class="k">义务论</div><div class="v">遵循道德规则 · 过程导向</div></div>
<div class="info-card"><div class="k">美德伦理</div><div class="v">培养优良品格 · 行为者导向</div></div>
<div class="info-card"><div class="k">应用</div><div class="v">自动驾驶 / 医疗 / 司法</div></div>
</div>`;
const svg=c.querySelector("svg");const ns="http://www.w3.org/2000/svg";const g=svg.querySelector("#ethics-frames");
const frames=[["功利主义",140,160,ACC,"最大效用"],["义务论",360,160,"#3b82f6","道德规则"],["美德伦理",580,160,"#22c55e","品格培养"]];
// triangle
const tri=document.createElementNS(ns,"polygon");tri.setAttribute("points","360,40 140,260 580,260");tri.setAttribute("fill","none");tri.setAttribute("stroke","#1f2128");tri.setAttribute("stroke-width",1);g.appendChild(tri);
frames.forEach(f=>{const c1=document.createElementNS(ns,"circle");c1.setAttribute("cx",f[1]);c1.setAttribute("cy",f[2]);c1.setAttribute("r",34);c1.setAttribute("fill","#0a0b0f");c1.setAttribute("stroke",f[3]);c1.setAttribute("stroke-width",2);c1.setAttribute("class","pulse");g.appendChild(c1);const t=document.createElementNS(ns,"text");t.setAttribute("x",f[1]);t.setAttribute("y",f[2]-2);t.setAttribute("class","svg-label");t.setAttribute("text-anchor","middle");t.setAttribute("fill",f[3]);t.setAttribute("font-size",10);t.textContent=f[0];g.appendChild(t);const t2=document.createElementNS(ns,"text");t2.setAttribute("x",f[1]);t2.setAttribute("y",f[2]+12);t2.setAttribute("class","svg-label");t2.setAttribute("text-anchor","middle");t2.setAttribute("font-size",8);t2.setAttribute("fill","#56575e");t2.textContent=f[4];g.appendChild(t2)});
