<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AngelSpec · 腾讯混元全链路投机解码框架</title>
<style>
:root{
--bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
--border:#1e2433;--border2:#2a3144;
--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
--teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;--red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;--pink:#f472b6;--green:#34d399;
--mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;line-height:1.5}
#app{max-width:960px;margin:0 auto;padding:14px}
.lab-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--bg);letter-spacing:-0.02em}
.header-left h1{font-size:17px;font-weight:700}
.header-left p{font-size:10px;color:var(--text2);margin-top:1px}
.badge{font-size:10px;padding:4px 10px;border-radius:20px;background:var(--teal);color:var(--bg);font-weight:600;white-space:nowrap}
.lab-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.hero-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;position:relative;overflow:hidden}
.hero-item::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--teal)}
.hero-val{font-size:22px;font-weight:700;color:var(--teal)}
.hero-lbl{font-size:9px;color:var(--text2);margin-top:3px}
.module-nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.mod-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:7px 12px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:11px;transition:all 0.2s;white-space:nowrap}
.mod-btn:hover{border-color:var(--teal);color:var(--teal)}
.mod-btn.active{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:600}
.module-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.panel-head h2{font-size:15px;font-weight:700}
.panel-head p{font-size:10px;color:var(--text2)}
.view-tabs{display:flex;gap:5px;margin-bottom:8px}
.view-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text3);padding:5px 11px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:10px;transition:all 0.2s}
.view-btn:hover{color:var(--text2);border-color:var(--cyan)}
.view-btn.active{background:var(--cyan);color:var(--bg);border-color:var(--cyan);font-weight:600}
#canvas{width:100%;height:auto;background:var(--bg);border-radius:8px;border:1px solid var(--border);display:block}
.panel-foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.pill{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid;font-weight:500}
.legend{display:flex;flex-direction:column;gap:3px}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.leg-lbl{font-size:9px;color:var(--text2)}
.info{display:flex;flex-direction:column;gap:2px}
.info-item{display:flex;justify-content:space-between;gap:6px}
.info-lbl{font-size:9px;color:var(--text3)}
.info-val{font-size:9px;color:var(--text);font-weight:600}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes aglow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
@keyframes adash{to{stroke-dashoffset:-20}}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes aspin{to{transform:rotate(360deg)}}
.apulse{animation:apulse 2s ease-in-out infinite}
.aglow{animation:aglow 2s ease-in-out infinite}
.adash{stroke-dasharray:6 4;animation:adash 1s linear infinite}
.ablink{animation:ablink 1.5s ease-in-out infinite}
.aspin{transform-origin:center;animation:aspin 8s linear infinite}
@media(max-width:720px){.lab-hero{grid-template-columns:repeat(2,1fr)}.panel-foot{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header class="lab-header">
    <div class="header-left">
      <div class="logo">AS</div>
      <div>
        <h1>AngelSpec</h1>
        <p>腾讯混元全链路投机解码框架</p>
      </div>
    </div>
    <span class="badge">2026.07.29 开源</span>
  </header>
  <div class="lab-hero">
    <div class="hero-item"><div class="hero-val">2.4x</div><div class="hero-lbl">平均加速</div></div>
    <div class="hero-item"><div class="hero-val">4-64</div><div class="hero-lbl">并发档位</div></div>
    <div class="hero-item"><div class="hero-val">6</div><div class="hero-lbl">基准测试</div></div>
    <div class="hero-item"><div class="hero-val">全链路</div><div class="hero-lbl">开源覆盖</div></div>
  </div>
  <div class="module-nav" id="moduleNav"></div>
  <div class="module-panel">
    <div class="panel-head">
      <h2 id="mTitle">AngelSpec概览</h2>
      <p id="mDesc">腾讯混元全链路投机解码框架</p>
    </div>
    <div class="view-tabs" id="viewTabs"></div>
    <svg id="canvas" viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="panel-foot">
      <div id="pills" class="pills"></div>
      <div id="legend" class="legend"></div>
      <div id="info" class="info"></div>
    </div>
  </div>
</div>
<script>
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};
function E(parent,tag,attrs){
  var ns='http://www.w3.org/2000/svg';
  var ht=['div','span','p','h1','h2','h3','h4','button','a','br','label','input','ul','li','section','table','tr','td','th'];
  var el;
  if(ht.indexOf(tag)>=0){el=document.createElement(tag);}
  else{el=document.createElementNS(ns,tag);}
  if(attrs){
    for(var k in attrs){
      if(k==='text'){el.textContent=attrs[k];}
      else if(k==='cls'){el.setAttribute('class',attrs[k]);}
      else{el.setAttribute(k,attrs[k]);}
    }
  }
  if(parent){parent.appendChild(el);}
  return el;
}
function $(id){return document.getElementById(id);}
function clearNode(n){while(n.firstChild){n.removeChild(n.firstChild);}}
function box(g,x,y,w,h,opts){
  opts=opts||{};
  var a={x:x,y:y,width:w,height:h};
  for(var k in opts) a[k]=opts[k];
  return E(g,'rect',a);
}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var a={x:x,y:y,fill:opts.fill||C.text,'font-size':opts['font-size']||11,'font-family':C.mono};
  if(opts['text-anchor']) a['text-anchor']=opts['text-anchor'];
  if(opts['font-weight']) a['font-weight']=opts['font-weight'];
  if(opts.opacity!==undefined) a['opacity']=opts.opacity;
  if(opts.transform) a['transform']=opts.transform;
  if(opts['letter-spacing']) a['letter-spacing']=opts['letter-spacing'];
  var el=E(g,'text',a);
  el.textContent=s;
  return el;
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts['stroke-width']||1};
  if(opts.opacity!==undefined) a['opacity']=opts.opacity;
  if(opts['stroke-dasharray']) a['stroke-dasharray']=opts['stroke-dasharray'];
  if(opts['marker-end']) a['marker-end']=opts['marker-end'];
  if(opts['stroke-linecap']) a['stroke-linecap']=opts['stroke-linecap'];
  if(opts.cls) a['class']=opts.cls;
  return E(g,'line',a);
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var col=opts.stroke||C.teal;
  var m={};
  m[C.teal]='ah';m[C.cyan]='ah-c';m[C.purple]='ah-p';m[C.amber]='ah-a';
  m[C.blue]='ah-b';m[C.pink]='ah-k';m[C.green]='ah-g';m[C.red]='ah-r';
  var mk=m[col]||'ah';
  var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':opts['stroke-width']||1.5,'marker-end':'url(#'+mk+')'};
  if(opts.opacity!==undefined) a['opacity']=opts.opacity;
  if(opts['stroke-dasharray']) a['stroke-dasharray']=opts['stroke-dasharray'];
  if(opts.cls) a['class']=opts.cls;
  return E(g,'line',a);
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  var a={cx:cx,cy:cy,r:r};
  a['fill']=opts.fill||'none';
  a['stroke']=opts.stroke||C.border2;
  a['stroke-width']=opts['stroke-width']||1;
  if(opts.opacity!==undefined) a['opacity']=opts.opacity;
  if(opts.cls) a['class']=opts.cls;
  if(opts.filter) a['filter']=opts.filter;
  return E(g,'circle',a);
}
function poly(g,pts,opts){
  opts=opts||{};
  var a={points:pts.join(' '),fill:opts.fill||'none',stroke:opts.stroke||C.border2,'stroke-width':opts['stroke-width']||1};
  if(opts.opacity!==undefined) a['opacity']=opts.opacity;
  if(opts['fill-opacity']!==undefined) a['fill-opacity']=opts['fill-opacity'];
  if(opts.cls) a['class']=opts.cls;
  if(opts['stroke-linejoin']) a['stroke-linejoin']=opts['stroke-linejoin'];
  return E(g,'polygon',a);
}
function radar(g,cx,cy,r,labels,data,opts){
  opts=opts||{};
  var col=opts.col||C.teal;
  var n=labels.length;
  var step=(Math.PI*2)/n;
  for(var i=1;i<=4;i++){
    var rr=r*i/4;var pts=[];
    for(var j=0;j<n;j++){
      var a=j*step-Math.PI/2;
      pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
    }
    poly(g,pts,{fill:'none',stroke:C.border,'stroke-width':0.5,opacity:0.4});
  }
  for(var j=0;j<n;j++){
    var a=j*step-Math.PI/2;
    line(g,cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,{stroke:C.border,'stroke-width':0.5,opacity:0.4});
  }
  var dp=[];
  for(var j=0;j<n;j++){
    var a=j*step-Math.PI/2;
    var rr=r*data[j];
    dp.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  poly(g,dp,{fill:col,stroke:col,'stroke-width':2,'fill-opacity':0.15});
  for(var j=0;j<n;j++){
    var a=j*step-Math.PI/2;
    var rr=r*data[j];
    circ(g,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,3,{fill:col,stroke:C.bg,'stroke-width':1});
  }
  for(var j=0;j<n;j++){
    var a=j*step-Math.PI/2;
    var lx=cx+Math.cos(a)*(r+18);
    var ly=cy+Math.sin(a)*(r+18)+4;
    var ta='middle';
    if(Math.cos(a)>0.3) ta='start';
    else if(Math.cos(a)<-0.3) ta='end';
    txt(g,lx,ly,labels[j],{fill:C.text2,'font-size':9,'text-anchor':ta});
  }
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=30){
    line(g,x,0,x,h,{stroke:C.border,'stroke-width':0.5,opacity:0.25});
  }
  for(var y=0;y<=h;y+=30){
    line(g,0,y,w,y,{stroke:C.border,'stroke-width':0.5,opacity:0.25});
  }
  box(g,0,0,w,h,{fill:'none',stroke:C.border,'stroke-width':1});
}
function setPills(id,arr){
  var el=$(id);if(!el) return;
  el.innerHTML='';
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    var s=E(el,'span',{cls:'pill'});
    s.style.borderColor=p.c||C.teal;
    s.style.color=p.c||C.teal;
    s.style.backgroundColor=(p.c||C.teal)+'1a';
    s.textContent=p.t;
  }
}
function setLegend(id,arr){
  var el=$(id);if(!el) return;
  el.innerHTML='';
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    var item=E(el,'span',{cls:'leg-item'});
    var dot=E(item,'span',{cls:'leg-dot'});
    dot.style.backgroundColor=p.c||C.teal;
    E(item,'span',{cls:'leg-lbl',text:p.t});
  }
}
function setInfo(id,arr){
  var el=$(id);if(!el) return;
  el.innerHTML='';
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    var item=E(el,'div',{cls:'info-item'});
    E(item,'span',{cls:'info-lbl',text:p.k});
    E(item,'span',{cls:'info-val',text:p.v});
  }
}
function nodeBox(g,x,y,w,h,title,sub,col){
  col=col||C.teal;
  box(g,x,y,w,h,{fill:C.bg3,stroke:col,'stroke-width':1.5,rx:8});
  box(g,x,y,4,h,{fill:col,rx:2});
  txt(g,x+w/2,y+22,title,{fill:C.text,'font-size':12,'font-weight':600,'text-anchor':'middle'});
  if(sub) txt(g,x+w/2,y+h-12,sub,{fill:C.text2,'font-size':9,'text-anchor':'middle'});
}
function chip(g,x,y,w,label,col){
  col=col||C.teal;
  box(g,x,y,w,20,{fill:col,stroke:col,'stroke-width':1,rx:10,'fill-opacity':0.12});
  txt(g,x+w/2,y+13,label,{fill:col,'font-size':9,'text-anchor':'middle','font-weight':600});
}
function pbar(g,x,y,w,h,val,col){
  col=col||C.teal;
  box(g,x,y,w,h,{fill:C.bg4,stroke:C.border2,'stroke-width':0.5,rx:h/2});
  var fw=Math.max(w*val,h);
  if(fw>0) box(g,x,y,fw,h,{fill:col,rx:h/2,opacity:0.85});
}
function rbox(g,x,y,w,h,col,label,val){
  col=col||C.teal;
  box(g,x,y,w,h,{fill:C.bg3,stroke:col,'stroke-width':1.5,rx:10});
  box(g,x,y,4,h,{fill:col,rx:2});
  txt(g,x+16,y+22,label,{fill:C.text2,'font-size':10});
  txt(g,x+16,y+48,val,{fill:col,'font-size':22,'font-weight':700});
}
function drawChip(g,x,y,w,h,label,col){
  col=col||C.teal;
  box(g,x,y,w,h,{fill:C.bg3,stroke:col,'stroke-width':1,rx:6,'fill-opacity':0.5});
  circ(g,x+14,y+h/2,4,{fill:col,stroke:'none'});
  txt(g,x+26,y+h/2+3,label,{fill:C.text,'font-size':10});
}
function addDefs(svg){
  var defs=E(svg,'defs');
  var f=E(defs,'filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'});
  E(f,'feGaussianBlur',{stdDeviation:'3',result:'blur'});
  var m=E(f,'feMerge');
  E(m,'feMergeNode',{in:'blur'});
  E(m,'feMergeNode',{in:'SourceGraphic'});
  var mk=[['ah',C.teal],['ah-c',C.cyan],['ah-p',C.purple],['ah-a',C.amber],['ah-b',C.blue],['ah-k',C.pink],['ah-g',C.green],['ah-r',C.red]];
  for(var i=0;i<mk.length;i++){
    var marker=E(defs,'marker',{id:mk[i][0],markerWidth:'8',markerHeight:'8',refX:'7',refY:'4',orient:'auto'});
    E(marker,'path',{d:'M0,0 L8,4 L0,8 Z',fill:mk[i][1]});
  }
}
var MODULES=[
  {n:'AngelSpec概览',t:'框架全景',d:'腾讯混元全链路投机解码框架',v:['框架全景','核心指标','开源意义']},
  {n:'投机解码原理',t:'投机-验证范式',d:'Drafter-Verifier协作加速机制',v:['投机-验证范式','加速机制','接受率分析']},
  {n:'DFly Drafter',t:'DFly架构',d:'高效轻量级推测头架构',v:['DFly架构','训练流程','性能对比']},
  {n:'MTP Drafter',t:'MTP原理',d:'多Token预测推测头',v:['MTP原理','权重设计','推理流程']},
  {n:'全链路覆盖',t:'训练到部署',d:'端到端投机解码框架',v:['训练到部署','架构设计','线上服务']},
  {n:'Hy3-A21B模型',t:'模型规模',d:'21B参数混合专家模型',v:['模型规模','MoE架构','并发性能']},
  {n:'六大基准测试',t:'基准全景',d:'全场景性能验证',v:['基准全景','吞吐量对比','加速比分析']},
  {n:'2.4x加速解析',t:'加速效果',d:'相对自回归基线平均加速2.4倍',v:['加速效果','并发档位','效率指标']}
];
var mCur=0,mViews=0,mLayers=null;

function drawM1V0(){
  var g=mLayers;
  gridBg(g,900,480);
  txt(g,450,30,'AngelSpec 全链路框架',{fill:C.text,'font-size':15,'font-weight':700,'text-anchor':'middle'});
  var stages=[
    {x:60,y:70,w:200,h:75,t:'Drafter训练',s:'DFly + MTP',c:C.teal},
    {x:350,y:70,w:200,h:75,t:'架构设计',s:'投机解码引擎',c:C.cyan},
    {x:640,y:70,w:200,h:75,t:'线上部署',s:'推理服务',c:C.purple}
  ];
  for(var i=0;i<stages.length;i++){
    var s=stages[i];
    nodeBox(g,s.x,s.y,s.w,s.h,s.t,s.s,s.c);
  }
  arrow(g,260,107,350,107,{stroke:C.teal,'stroke-width':2});
  arrow(g,550,107,640,107,{stroke:C.cyan,'stroke-width':2});
  txt(g,450,185,'两种 Drafter 路径',{fill:C.text2,'font-size':11,'text-anchor':'middle'});
  var types=[
    {x:180,y:210,w:220,h:95,t:'DFly Drafter',d:'基于隐状态外推',c:C.teal,items:['轻量推测头','低延迟草稿','高接受率']},
    {x:500,y:210,w:220,h:95,t:'MTP Drafter',d:'多Token预测头',c:C.cyan,items:['并行预测','树形展开','训练即用']}
  ];
  for(var i=0;i<types.length;i++){
    var t=types[i];
    box(g,t.x,t.y,t.w,t.h,{fill:C.bg3,stroke:t.c,'stroke-width':1.5,rx:8,'fill-opacity':0.6});
    txt(g,t.x+t.w/2,t.y+22,t.t,{fill:t.c,'font-size':12,'font-weight':700,'text-anchor':'middle'});
    txt(g,t.x+t.w/2,t.y+38,t.d,{fill:C.text2,'font-size':9,'text-anchor':'middle'});
    for(var j=0;j<t.items.length;j++){
      chip(g,t.x+12,t.y+52+j*22,t.w-24,t.items[j],t.c);
    }
  }
  arrow(g,400,257,500,257,{stroke:C.text3,'stroke-width':1.5,'stroke-dasharray':'4 3'});
  txt(g,450,340,'验证器: Hy3-A21B (21B MoE)',{fill:C.purple,'font-size':12,'font-weight':600,'text-anchor':'middle'});
  box(g,300,350,300,50,{fill:C.bg3,stroke:C.purple,'stroke-width':1.5,rx:8});
  txt(g,450,380,'目标模型 · 并行验证草稿',{fill:C.text2,'font-size':10,'text-anchor':'middle'});
  txt(g,450,405,'全链路: 训练 → 架构 → 部署',{fill:C.text3,'font-size':9,'text-anchor':'middle'});
  arrow(g,290,375,300,375,{stroke:C.teal,'stroke-width':1.5});
  arrow(g,600,375,610,375,{stroke:C.purple,'stroke-width':1.5});
  for(var i=0;i<5;i++){
    circ(g,120+i*50,445,3,{fill:C.teal,opacity:0.3+i*0.15,cls:'apulse'});

function drawM8V1(){
  var g=mLayers;
  gridBg(g,900,480);

  var concs=[4,8,16,32,64];
  var dflyVals=[120,230,420,720,980];
  var baseVals=[80,140,220,340,480];
  var bx=80;var bw=120;var gap=30;
  for(var i=0;i<concs.length;i++){
    var x=bx+i*(bw+gap);
    var maxV=1000;
    var h1=baseVals[i]/maxV*250;
    var h2=dflyVals[i]/maxV*250;
    box(g,x,360-h1,bw/2-5,h1,{fill:C.text3,opacity:0.4,rx:3});
    box(g,x+bw/2+5,360-h2,bw/2-5,h2,{fill:C.teal,opacity:0.75,rx:3,cls:'apulse'});
    txt(g,x+bw/4,360-h1-8,baseVals[i]+'',{fill:C.text3,'font-size':8,'text-anchor':'middle'});
    txt(g,x+bw*3/4+5,360-h2-8,dflyVals[i]+'',{fill:C.teal,'font-size':8,'text-anchor':'middle','font-weight':600});
    txt(g,x+bw/2,375,concs[i]+'并发',{fill:C.text2,'font-size':9,'text-anchor':'middle'});
    var ratio=dflyVals[i]/baseVals[i];
    txt(g,x+bw/2,392,ratio.toFixed(1)+'x',{fill:C.green,'font-size':9,'text-anchor':'middle','font-weight':600});
  }
  line(g,50,360,850,360,{stroke:C.border2,'stroke-width':1});
  txt(g,450,420,'全并发档位加速比',{fill:C.text,'font-size':11,'text-anchor':'middle','font-weight':600});

  txt(g,500,448,'32c: 2.1x',{fill:C.teal,'font-size':9,'font-weight':600});
  txt(g,640,448,'64c: 2.0x',{fill:C.teal,'font-size':9,'font-weight':600});
  txt(g,770,448,'均领先',{fill:C.green,'font-size':9,'font-weight':600});
  setPills('pills',[
    {t:'4-64全并发',c:C.teal},{t:'全档位领先',c:C.green},{t:'平均2.4x',c:C.amber}
  ]);

var DRAW_FUNCS=[
  [drawM1V0,drawM1V1,drawM1V2],
  [drawM2V0,drawM2V1,drawM2V2],
  [drawM3V0,drawM3V1,drawM3V2],
  [drawM4V0,drawM4V1,drawM4V2],
  [drawM5V0,drawM5V1,drawM5V2],
  [drawM6V0,drawM6V1,drawM6V2],
  [drawM7V0,drawM7V1,drawM7V2],
  [drawM8V0,drawM8V1,drawM8V2]
];

function buildNav(){
  var nav=$('moduleNav');
  if(!nav) return;
  nav.innerHTML='';
  for(var i=0;i<MODULES.length;i++){
    (function(idx){
      var btn=E(nav,'button',{cls:'mod-btn'+(idx===mCur?' active':''),text:MODULES[idx].n});
      btn.onclick=function(){
        mCur=idx;
        mViews=0;
        buildNav();
        buildViewTabs();
        drawModule();
      };
    })(i);
  }
}

function buildViewTabs(){
  var vt=$('viewTabs');
  if(!vt) return;
  vt.innerHTML='';
  var vs=MODULES[mCur].v;
  for(var i=0;i<vs.length;i++){
    (function(idx){
      var btn=E(vt,'button',{cls:'view-btn'+(idx===mViews?' active':''),text:vs[idx]});
      btn.onclick=function(){setView(idx);};
    })(i);
  }
}

function setView(idx){
  mViews=idx;
  buildViewTabs();
  drawModule();
}

function drawModule(){
  var svg=$('canvas');
  if(!svg) return;
  clearNode(svg);
  addDefs(svg);
  mLayers=E(svg,'g');
  $('mTitle').textContent=MODULES[mCur].n;
  $('mDesc').textContent=MODULES[mCur].d;
  DRAW_FUNCS[mCur][mViews]();
}

function init(){
  buildNav();
  buildViewTabs();
  drawModule();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
