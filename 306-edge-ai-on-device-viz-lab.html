<style>
:root{--bg:#0a0c12;--bd:#1a1d27;--dim:#4a5568;--ac:#7c5cff;--info:#2dd4ff;--warn:#fbbf24;--err:#ef4444;--pur:#a78bfa;--rose:#f472b6;--fg:#e5e7eb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Consolas','SF Mono','Monaco',monospace;font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:linear-gradient(90deg,#0d1018,#141826);border-bottom:1px solid var(--bd);flex-shrink:0;}
.topbar a{color:var(--info);text-decoration:none;font-size:12px;}
.topbar a:hover{text-decoration:underline;}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:1px;}
.topbar .ver{color:var(--dim);font-size:11px;}
.tabs{display:flex;background:#0d1018;border-bottom:1px solid var(--bd);padding:0 10px;flex-shrink:0;overflow-x:auto;}
.tabs::-webkit-scrollbar{height:0;}
.tab{padding:7px 14px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-size:12px;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--info);}
.tab.active{color:var(--ac);border-bottom-color:var(--ac);}
.main{display:flex;gap:8px;padding:8px;flex:1;min-height:0;}
.canvas-wrap{flex:1;background:#0a0c12;border:1px solid var(--bd);border-radius:6px;overflow:hidden;position:relative;}
.canvas-wrap svg{width:100%;height:100%;display:block;}
.controls{width:190px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.ctrl-title{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px;padding:2px 0;}
.btn{padding:7px 10px;background:#11141c;border:1px solid var(--bd);color:var(--fg);cursor:pointer;border-radius:4px;font-size:11px;text-align:left;transition:all .12s;font-family:inherit;line-height:1.3;}
.btn:hover{border-color:var(--ac);background:#1a1f30;}
.btn.active{border-color:var(--ac);background:rgba(124,92,255,.12);color:var(--ac);}
.btn .idx{color:var(--dim);font-size:9px;margin-right:4px;}
.btn.active .idx{color:var(--ac);}
.log{height:130px;background:#06070b;border-top:1px solid var(--bd);padding:6px 14px;overflow-y:auto;font-size:11px;line-height:1.5;flex-shrink:0;}
.log::-webkit-scrollbar{width:6px;}
.log::-webkit-scrollbar-track{background:transparent;}
.log::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px;}
.log-line{color:#9ca3af;margin-bottom:1px;}
.log-line .t{color:var(--info);}
.log-line .k{color:var(--ac);}
.log-line .w{color:var(--warn);}
.log-line .e{color:var(--err);}
.log-line .ok{color:#22c55e;}
.log-line .i{color:var(--info);}
.log-line .p{color:var(--pur);}
.log-line .r{color:var(--rose);}

<script>
var BD='#1a1d27',DIM='#4a5568',AC='#7c5cff',INFO='#2dd4ff',WARN='#fbbf24',ERR='#ef4444',PUR='#a78bfa',ROSE='#f472b6';
var FG='#e5e7eb',BG2='#11141c',BG3='#0d1018';
function el(t,a,p){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
var svg=document.getElementById('svg'),logEl=document.getElementById('log'),tabsEl=document.getElementById('tabs'),ctrlEl=document.getElementById('controls');
var curM=0,curV=0;
var MODS=[
 {id:'M1',name:'端侧AI全景',views:['云端推理','边缘推理','端侧推理','混合对比']},
 {id:'M2',name:'模型压缩',views:['网络剪枝','模型量化','知识蒸馏','压缩对比']},
 {id:'M3',name:'推理引擎',views:['TFLite','CoreML','ONNX Runtime','引擎对比']},
 {id:'M4',name:'NPU芯片',views:['NPU架构','内存架构','能效分析','芯片对比']},
 {id:'M5',name:'隐私计算',views:['联邦学习','差分隐私','安全聚合','隐私对比']},
 {id:'M6',name:'动态推理',views:['早退机制','动态路由','模型交换','动态对比']},
 {id:'M7',name:'端云协同',views:['模型分发','增量更新','混合推理','协同对比']},
 {id:'M8',name:'应用场景',views:['语音助手','增强现实','健康监测','智能相机']}
];
function logMsg(msg,cls){
  var d=document.createElement('div');d.className='log-line';
  var tm=new Date().toLocaleTimeString('en-US',{hour12:false});
  var s=document.createElement('span');s.className='t';s.textContent='['+tm+'] ';d.appendChild(s);
  if(cls){var s2=document.createElement('span');s2.className=cls;s2.textContent=msg;d.appendChild(s2);}
  else{d.appendChild(document.createTextNode(msg));}
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
}
function box(x,y,w,h,o){o=o||{};el('rect',{x:x,y:y,width:w,height:h,rx:o.r||5,ry:o.r||5,fill:o.fill||BG2,stroke:o.stroke||BD,'stroke-width':o.sw||1.5},svg);if(o.dash)el('rect',{x:x,y:y,width:w,height:h,rx:o.r||5,ry:o.r||5,fill:'none',stroke:o.stroke||BD,'stroke-width':o.sw||1.5,'stroke-dasharray':o.dash},svg);if(o.label){var t=el('text',{x:x+w/2,y:y+h/2,fill:o.fc||FG,'font-size':o.fs||12,'text-anchor':'middle','dominant-baseline':'middle','font-weight':o.fw||'normal'},svg);t.textContent=o.label;}}
function line(x1,y1,x2,y2,c,w,d){var a={'x1':x1,'y1':y1,'x2':x2,'y2':y2,'stroke':c||DIM,'stroke-width':w||1.5};if(d)a['stroke-dasharray']=d;el('line',a,svg);}
function arrow(x1,y1,x2,y2,c,w){c=c||DIM;w=w||1.5;var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<1)return;var ux=dx/len,uy=dy/len;el('line',{x1:x1,y1:y1,x2:x2-ux*7,y2:y2-uy*7,stroke:c,'stroke-width':w},svg);var ang=Math.atan2(dy,dx),s=7;el('polygon',{points:x2+','+y2+' '+(x2-Math.cos(ang-0.4)*s)+','+(y2-Math.sin(ang-0.4)*s)+' '+(x2-Math.cos(ang+0.4)*s)+','+(y2-Math.sin(ang+0.4)*s),fill:c},svg);}
function darrow(x1,y1,x2,y2,c,w){c=c||DIM;w=w||1.5;var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<1)return;el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:c,'stroke-width':w,'stroke-dasharray':'4,3'},svg);var ang=Math.atan2(dy,dx),s=7;el('polygon',{points:x2+','+y2+' '+(x2-Math.cos(ang-0.4)*s)+','+(y2-Math.sin(ang-0.4)*s)+' '+(x2-Math.cos(ang+0.4)*s)+','+(y2-Math.sin(ang+0.4)*s),fill:c},svg);}
function txt(x,y,s,o){o=o||{};var t=el('text',{x:x,y:y,fill:o.fill||FG,'font-size':o.fs||12,'text-anchor':o.ta||'start','dominant-baseline':o.db||'middle','font-weight':o.fw||'normal'},svg);t.textContent=s;}
function ttl(x,y,s,c){var t=el('text',{x:x,y:y,fill:c||AC,'font-size':15,'font-weight':'bold'},svg);t.textContent=s;}
function sub(x,y,s,c){var t=el('text',{x:x,y:y,fill:c||DIM,'font-size':11},svg);t.textContent=s;}
function circ(cx,cy,r,fill,stroke,sw){el('circle',{cx:cx,cy:cy,r:r,fill:fill||'none',stroke:stroke||BD,'stroke-width':sw||1.5},svg);}
function gridbg(){for(var x=0;x<=920;x+=40)el('line',{x1:x,y1:0,x2:x,y2:460,stroke:'#0d0f16','stroke-width':0.5},svg);for(var y=0;y<=460;y+=40)el('line',{x1:0,y1:y,x2:920,y2:y,stroke:'#0d0f16','stroke-width':0.5},svg);}
function bars(x,y,w,h,data,unit){var mv=1;for(var i=0;i<data.length;i++)if(data[i].v>mv)mv=data[i].v;var n=data.length,bw=w/n*0.6,gp=w/n*0.4;for(var g=0;g<=4;g++){var gy=y+h-g*h/4;line(x,gy,x+w,gy,'#15182a',0.5);var gt=el('text',{x:x-6,y:gy,fill:DIM,'font-size':9,'text-anchor':'end','dominant-baseline':'middle'},svg);gt.textContent=Math.round(g*mv/4)+(unit||'');}line(x,y+h,x+w,y+h,DIM,1.5);for(var i=0;i<data.length;i++){var bh=data[i].v/mv*h*0.9;var bx=x+i*(bw+gp)+gp/2;el('rect',{x:bx,y:y+h-bh,width:bw,height:bh,fill:data[i].c||AC,opacity:0.78,rx:2},svg);var t=el('text',{x:bx+bw/2,y:y+h-bh-8,fill:data[i].c||AC,'font-size':11,'text-anchor':'middle','font-weight':'bold'},svg);t.textContent=data[i].v;var t2=el('text',{x:bx+bw/2,y:y+h+16,fill:'#9ca3af','font-size':10,'text-anchor':'middle'},svg);t2.textContent=data[i].l;}}
function panel(x,y,w,h,title){el('rect',{x:x,y:y,width:w,height:h,rx:6,fill:BG3,stroke:BD,'stroke-width':1},svg);var t=el('text',{x:x+12,y:y+20,fill:INFO,'font-size':11,'font-weight':'bold'},svg);t.textContent=title;}
function metric(x,y,label,val,color){var t1=el('text',{x:x,y:y,fill:DIM,'font-size':11},svg);t1.textContent=label;var t2=el('text',{x:x+150,y:y,fill:color||FG,'font-size':11,'text-anchor':'end','font-weight':'bold'},svg);t2.textContent=val;}

// ===== M1: 端侧AI全景 =====

    logMsg('  劣势：延迟200-500ms、强依赖网络、隐私数据外泄风险、带宽成本高。','e');
  }else if(m===1){
    ttl(30,30,'M1-2 边缘推理架构',AC);

    box(40,150,100,50,{label:'终端设备',stroke:DIM,fc:FG,fs:10});
    box(40,220,100,40,{label:'数据采集',stroke:INFO,fc:INFO,fs:9});
    box(180,140,130,90,{fill:BG3,stroke:INFO,sw:2});
    ttl(195,165,'边缘节点',INFO);
    box(195,180,100,30,{label:'边缘推理引擎',stroke:AC,fc:AC,fs:9});
    box(195,215,100,30,{label:'模型缓存',stroke:BD,fs:9});
    arrow(140,170,180,180,INFO,2);
    arrow(180,200,140,190,INFO,2);
    box(360,90,180,55,{label:'区域边缘服务器',stroke:PUR,fc:PUR,fs:10});
    box(360,160,180,55,{label:'5G MEC 多接入边缘计算',stroke:PUR,fc:PUR,fs:10});
    box(360,230,180,55,{label:'CDN边缘缓存节点',stroke:PUR,fc:PUR,fs:10});
    arrow(310,185,360,117,PUR,2);
    arrow(310,200,360,187,PUR,1.5);
    arrow(310,215,360,257,PUR,1.5);
    box(600,140,130,90,{fill:BG3,stroke:AC,sw:2});
    ttl(615,165,'云端',AC);
    box(615,180,100,30,{label:'模型训练',stroke:AC,fc:AC,fs:9});
    box(615,215,100,30,{label:'全局聚合',stroke:BD,fs:9});
    darrow(540,185,600,185,AC,2);
    darrow(600,200,540,200,DIM,1.5);
    panel(770,110,120,230,'关键指标');
    var met=[['延迟','10-50ms',WARN],['带宽','中',WARN],['隐私','中',WARN],['算力','中高',INFO],['成本','中',WARN],['离线','部分',WARN]];
    for(var i=0;i<met.length;i++)metric(785,140+i*30,met[i][0],met[i][1],met[i][2]);
    logMsg('[M1-2] 边缘推理模式','k');

    logMsg('  优势：延迟降至10-50ms，减少回传带宽，支持局部离线自治。','ok');
    logMsg('  劣势：算力受限（TOPS级），模型规模有上限，部署运维复杂度增加。','w');
  }else if(m===2){
    ttl(30,30,'M1-3 端侧推理架构',AC);
    sub(30,48,'模型直接运行在设备本地 · 超低延迟 · 隐私保护 · 完全离线',DIM);
    box(250,90,420,300,{fill:BG3,stroke:AC,sw:2});
    ttl(270,115,'移动设备 / IoT终端',INFO);
    box(270,135,180,40,{label:'传感器输入层',stroke:INFO,fc:INFO,fs:10});
    box(470,135,180,40,{label:'NPU/GPU/DSP 加速',stroke:AC,fc:AC,fs:10});
    box(270,195,180,40,{label:'本地模型推理',stroke:PUR,fc:PUR,fs:10});
    box(470,195,180,40,{label:'量化模型 (INT8)',stroke:PUR,fc:PUR,fs:10});

      }

    panel(810,90,80,330,'结论');
    txt(820,115,'端侧',{fill:'#22c55e',fs:11,fw:'bold'});
    txt(820,132,'隐私+延迟',{fill:'#22c55e',fs:9});
    txt(820,152,'最优',{fill:'#22c55e',fs:9});
    txt(820,180,'边缘',{fill:WARN,fs:11,fw:'bold'});
    txt(820,197,'平衡型',{fill:WARN,fs:9});

// ===== Tab/Control building & init =====
var viewFns=[m1View,m2View,m3View,m4View,m5View,m6View,m7View,m8View];
function buildTabs(){
  clear(tabsEl);
  for(var i=0;i<MODS.length;i++){
    var d=document.createElement('div');
    d.className='tab'+(i===curM?' active':'');
    var s1=document.createElement('span');
    s1.style.color=i===curM?AC:DIM;
    s1.textContent=MODS[i].id+' ';
    d.appendChild(s1);
    var s2=document.createElement('span');
    s2.textContent=MODS[i].name;
    d.appendChild(s2);
    d.onclick=(function(idx){return function(){switchModule(idx);};})(i);
    tabsEl.appendChild(d);
  }
}
function buildControls(){
  clear(ctrlEl);
  var t=document.createElement('div');t.className='ctrl-title';t.textContent='视图切换';ctrlEl.appendChild(t);
  for(var i=0;i<MODS[curM].views.length;i++){
    var b=document.createElement('div');
    b.className='btn'+(i===curV?' active':'');
    var s1=document.createElement('span');s1.className='idx';s1.textContent='V'+(i+1);b.appendChild(s1);
    var s2=document.createElement('span');s2.textContent=MODS[curM].views[i];b.appendChild(s2);
    b.onclick=(function(idx){return function(){switchView(idx);};})(i);
    ctrlEl.appendChild(b);
  }
  var sp=document.createElement('div');sp.style.flex='1';ctrlEl.appendChild(sp);
  var info=document.createElement('div');info.className='ctrl-title';info.textContent='当前模块';ctrlEl.appendChild(info);
  var cur=document.createElement('div');cur.style.color=AC;cur.style.fontSize='13px';cur.style.fontWeight='bold';cur.textContent=MODS[curM].id+' '+MODS[curM].name;ctrlEl.appendChild(cur);
  var sub=document.createElement('div');sub.style.color=DIM;sub.style.fontSize='10px';sub.style.marginTop='4px';sub.textContent='视图 '+(curV+1)+'/'+MODS[curM].views.length+': '+MODS[curM].views[curV];ctrlEl.appendChild(sub);
}
function switchModule(i){
  curM=i;curV=0;
  buildTabs();buildControls();
  clear(logEl);
  logMsg('===== '+MODS[i].id+' '+MODS[i].name+' =====','k');
  viewFns[i](0);
}
function switchView(i){
  curV=i;
  buildControls();
  viewFns[curM](i);
}
