<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型记忆容量与信息论 · 可视化实验室</title>
<style>
  :root{
    --bg:#0a0b0f;
    --bg-soft:#11131a;
    --bg-card:#151823;
    --bg-card-2:#1a1e2b;
    --teal:#00d4aa;
    --teal-dim:#00a888;
    --teal-soft:rgba(0,212,170,0.12);
    --amber:#f5a623;
    --rose:#ff5c7a;
    --violet:#9b8cff;
    --blue:#4aa8ff;
    --text:#e8ecf3;
    --text-dim:#9aa3b2;
    --text-faint:#6b7488;
    --border:#222734;
    --grid:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  a{color:var(--teal);text-decoration:none;}

  /* 顶部栏 */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(10,11,15,0.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1280px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--teal),#008f72);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#04130e;font-size:15px;
    box-shadow:0 0 22px rgba(0,212,170,0.35);
  }
  .brand-text{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .brand-sub{font-size:11px;color:var(--text-faint);font-weight:500;}
  .nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;}
  .nav-btn{
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    padding:7px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;
    font-weight:600;transition:all .18s ease;font-family:inherit;
    display:flex;align-items:center;gap:6px;
  }
  .nav-btn:hover{color:var(--text);background:var(--bg-card);}
  .nav-btn.active{color:var(--teal);background:var(--teal-soft);border-color:rgba(0,212,170,0.3);}
  .nav-tag{font-size:10px;opacity:.7;font-weight:700;}

  /* 主体 */
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 80px;}
  .module{display:none;animation:fade .4s ease;}
  .module.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .mhead{margin-bottom:22px;}
  .mhead .kicker{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
  .mhead h1{font-size:27px;font-weight:800;margin:6px 0 4px;letter-spacing:.3px;}
  .mhead p{color:var(--text-dim);font-size:14.5px;max-width:880px;}

  .grid{display:grid;gap:18px;}
  .g2{grid-template-columns:1.4fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2eq{grid-template-columns:1fr 1fr;}
  @media(max-width:900px){.g2,.g3,.g2eq{grid-template-columns:1fr;}}

  .card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
    padding:20px;position:relative;overflow:hidden;
  }
  .card-title{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .card-desc{color:var(--text-faint);font-size:12.5px;margin-bottom:14px;}

  /* 控件 */
  .ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .btn{
    background:var(--bg-card-2);border:1px solid var(--border);color:var(--text-dim);
    padding:7px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;font-weight:600;
    font-family:inherit;transition:all .15s;
  }
  .btn:hover{color:var(--text);border-color:#333a4d;}
  .btn.active{color:var(--teal);border-color:rgba(0,212,170,0.4);background:var(--teal-soft);}
  .slider-wrap{display:flex;align-items:center;gap:12px;flex:1;min-width:220px;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:5px;border-radius:5px;
    background:linear-gradient(90deg,var(--teal) var(--p,50%),#2a3040 var(--p,50%));outline:none;flex:1;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--teal);cursor:pointer;border:3px solid #04130e;
    box-shadow:0 0 10px rgba(0,212,170,0.5);
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:var(--teal);cursor:pointer;border:3px solid #04130e;
  }
  .val-pill{
    background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:13px;
    padding:4px 11px;border-radius:20px;border:1px solid rgba(0,212,170,0.25);white-space:nowrap;
  }
  .label{font-size:12px;color:var(--text-faint);font-weight:600;}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
  .stat{flex:1;min-width:120px;background:var(--bg-card-2);border-radius:10px;padding:12px 14px;border:1px solid var(--border);}
  .stat .v{font-size:21px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;}
  .stat .v.amber{color:var(--amber);}
  .stat .v.rose{color:var(--rose);}
  .stat .v.violet{color:var(--violet);}
  .stat .k{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  svg{display:block;width:100%;height:auto;}
  .svg-cap{font-size:11.5px;color:var(--text-faint);margin-top:8px;text-align:center;}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--text-faint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  td{color:var(--text-dim);}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
  .tag.good{background:rgba(0,212,170,0.15);color:var(--teal);}
  .tag.warn{background:rgba(245,166,35,0.15);color:var(--amber);}
  .tag.bad{background:rgba(255,92,122,0.15);color:var(--rose);}
  .tag.mid{background:rgba(155,140,255,0.15);color:var(--violet);}

  .callout{
    background:linear-gradient(135deg,rgba(0,212,170,0.08),rgba(0,212,170,0.02));
    border:1px solid rgba(0,212,170,0.22);border-radius:12px;padding:14px 16px;margin-top:14px;
  }
  .callout .ct{font-weight:700;color:var(--teal);font-size:13px;margin-bottom:4px;}
  .callout p{font-size:13px;color:var(--text-dim);}

  .formula{
    background:#0d0f15;border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;font-family:"Cambria Math","Times New Roman",serif;font-size:15px;
    color:var(--text);text-align:center;letter-spacing:.5px;
  }
  .formula .var{color:var(--teal);font-style:italic;}
  .formula .op{color:var(--amber);}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-dim);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}

  .foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);}
  .foot b{color:var(--text-dim);}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-text">记忆容量与信息论</div>
        <div class="brand-sub">Model Memorization Capacity · 可视化实验室</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>

<div class="wrap">
  <!-- 模块容器由JS填充 -->
  <div id="m1" class="module active"></div>
  <div id="m2" class="module"></div>
  <div id="m3" class="module"></div>
  <div id="m4" class="module"></div>
  <div id="m5" class="module"></div>
  <div id="m6" class="module"></div>
  <div id="m7" class="module"></div>
  <div id="m8" class="module"></div>

  <div class="foot">
    <b>关于本实验室</b> · 基于 ICML 2026 Honorable Mention 论文 "How much can language models memorize?" 及相关记忆容量、Kolmogorov 复杂度、隐私提取、影响函数、去记忆技术与标度律研究构建的交互式可视化。所有数据为研究趋势的示意性可视化，非原始实验复现。
  </div>
</div>

<script>
"use strict";
/* ============================================================
   工具函数：el() 创建 SVG 元素
   ============================================================ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  var e = document.createElementNS(SVGNS, tag);
  if(attrs){
    for(var k in attrs){
      if(attrs.hasOwnProperty(k)){
        if(k === "text"){ e.textContent = attrs[k]; }
        else if(k === "html"){ /* skip */ }
        else { e.setAttribute(k, attrs[k]); }
      }
    }
  }
  if(parent){ parent.appendChild(e); }
  return e;
}
function clearNode(n){ while(n && n.firstChild){ n.removeChild(n.firstChild); } }
function fmt(n){
  if(n >= 1e12) return (n/1e12).toFixed(2)+"万亿";
  if(n >= 1e8) return (n/1e8).toFixed(2)+"亿";
  if(n >= 1e4) return (n/1e4).toFixed(2)+"万";
  if(n >= 1e3) return (n/1e3).toFixed(1)+"k";
  return String(Math.round(n));
}
function fmtBits(n){
  if(n >= 1e15) return (n/1e15).toFixed(2)+" Pb";
  if(n >= 1e12) return (n/1e12).toFixed(2)+" Tb";
  if(n >= 1e9) return (n/1e9).toFixed(2)+" Gb";
  if(n >= 1e6) return (n/1e6).toFixed(2)+" Mb";
  if(n >= 1e3) return (n/1e3).toFixed(2)+" kb";
  return Math.round(n)+" b";
}

/* ============================================================
   模块元数据与导航
   ============================================================ */
var MODULES = [
  {id:"m1", tag:"M1", name:"记忆容量全景"},
  {id:"m2", tag:"M2", name:"3.6比特/参数"},
  {id:"m3", tag:"M3", name:"Kolmogorov复杂度"},
  {id:"m4", tag:"M4", name:"记忆vs泛化"},
  {id:"m5", tag:"M5", name:"数据提取攻击"},
  {id:"m6", tag:"M6", name:"影响函数追踪"},
  {id:"m7", tag:"M7", name:"去记忆技术"},
  {id:"m8", tag:"M8", name:"容量标度律"}
];

function buildNav(){
  var nav = document.getElementById("nav");
  MODULES.forEach(function(m){
    var b = document.createElement("button");
    b.className = "nav-btn active".replace("active","");
    b.setAttribute("data-target", m.id);
    var tag = document.createElement("span");
    tag.className = "nav-tag";
    tag.textContent = m.tag;
    var name = document.createElement("span");
    name.textContent = m.name;
    b.appendChild(tag);
    b.appendChild(name);
    if(m.id === "m1"){ b.classList.add("active"); }
    b.addEventListener("click", function(){ switchModule(m.id); });
    nav.appendChild(b);
  });
}

function switchModule(id){
  MODULES.forEach(function(m){
    var mod = document.getElementById(m.id);
    if(mod){ mod.classList.toggle("active", m.id === id); }
  });
  var btns = document.querySelectorAll(".nav-btn");
  btns.forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-target") === id);
  });
  // 调用对应 view 函数
  var fn = window[id + "View"];
  if(typeof fn === "function"){ fn(); }
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ============================================================
   M1 · 记忆容量全景
   ============================================================ */
function m1Draw(){
  var root = document.getElementById("m1");
  clearNode(root);
  var head = document.createElement("div");
  head.className = "mhead";
  head.innerHTML = '<div class="kicker">M1 · OVERVIEW</div>'+
    '<h1>模型记忆容量全景</h1>'+
    '<p>大语言模型在训练中会"记住"训练数据的片段，也会"学习"可泛化的统计模式。记忆与泛化之间的张力，是理解模型能力边界、隐私风险与数据效率的核心线索。</p>';
  root.appendChild(head);

  var grid = document.createElement("div");
  grid.className = "grid g2";
  root.appendChild(grid);

  // 左：记忆 vs 泛化 张力图
  var left = document.createElement("div");
  left.className = "card";
  left.innerHTML = '<div class="card-title"><span class="dot"></span>记忆 vs 泛化：一道张力</div>'+
    '<div class="card-desc">同一组参数同时承载两类信息——可复现的记忆与可迁移的模式</div>';
  var svgL = el("svg", {viewBox:"0 0 520 320"}, left);
  drawTension(svgL);
  var cap1 = document.createElement("div");
  cap1.className = "svg-cap";
  cap1.textContent = "横轴为训练步数，左侧峰值代表逐字记忆，右侧平台代表泛化模式";
  left.appendChild(cap1);
  grid.appendChild(left);

  // 右：关键概念
  var right = document.createElement("div");
  right.className = "card";
  right.innerHTML = '<div class="card-title"><span class="dot"></span>三种"记住"的本质</div>'+
    '<div class="card-desc">区分三类现象，才能讨论记忆容量的边界</div>';
  var list = [
    {c:"teal", t:"逐字记忆", d:"能近乎完整复现训练样本的字符串/序列", e:"例：背诵某条训练语料原句"},
    {c:"amber", t:"统计记忆", d:"记住了数据分布的统计特征而非具体样本", e:"例：复现某领域的用词风格"},
    {c:"violet", t:"泛化模式", d:"学到可在新数据上复用的抽象规律", e:"例：语法结构、推理链"}
  ];
  list.forEach(function(it){
    var row = document.createElement("div");
    row.style.cssText = "display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);";
    var col = it.c === "teal" ? "var(--teal)" : (it.c === "amber" ? "var(--amber)" : "var(--violet)");
    var dot = document.createElement("div");
    dot.style.cssText = "width:10px;height:10px;border-radius:50%;background:"+col+";flex-shrink:0;margin-top:6px;";
    var body = document.createElement("div");
    var t = document.createElement("div");
    t.style.cssText = "font-weight:700;font-size:13.5px;color:"+col+";";
    t.textContent = it.t;
    var d = document.createElement("div");
    d.style.cssText = "font-size:12.5px;color:var(--text-dim);";
    d.textContent = it.d;
    var e = document.createElement("div");
    e.style.cssText = "font-size:11.5px;color:var(--text-faint);margin-top:2px;";
    e.textContent = it.e;
    body.appendChild(t); body.appendChild(d); body.appendChild(e);
    row.appendChild(dot); row.appendChild(body);
    right.appendChild(row);
  });
  grid.appendChild(right);

  // 下方：交互式时间线
  var tl = document.createElement("div");
  tl.className = "card";
  tl.style.marginTop = "18px";
  tl.innerHTML = '<div class="card-title"><span class="dot"></span>关键研究历程 · 点击节点查看详情</div>'+
    '<div class="card-desc">从过拟合到容量分析，再到信息论框架下的精确量化</div>';
  var tlSvg = el("svg", {id:"m1Timeline", viewBox:"0 0 1100 200"}, tl);
  root.appendChild(tl);

  var detail = document.createElement("div");
  detail.id = "m1Detail";
  detail.className = "callout";
  detail.style.marginTop = "14px";
  root.appendChild(detail);

  m1Timeline = {
    svg: tlSvg,
    detail: detail,
    events: [
      {year:"2017", t:"Attention Is All You Need", d:"Transformer 架构提出，参数规模化成为主线，记忆现象随规模凸显。"},
      {year:"2020", t:"Carlini 等数据提取", d:"首次系统证明大模型可被引导逐字吐出训练数据，隐私风险被量化。"},
      {year:"2021", t:"记忆 vs 泛化的相变", d:"研究发现模型先记忆后泛化，存在清晰的训练动力学相变点。"},
      {year:"2022", t:"重复样本更易被记忆", d:"数据重复次数与可提取记忆量呈强相关，去重成为缓解手段。"},
      {year:"2023", t:"Chinchilla 标度律", d:"数据与参数的最优比例被精确刻画，隐含容量约束。"},
      {year:"2025", t:"容量与Kolmogorov复杂度", d:"用算法信息论框架统一解释模型能记住多少分布信息。"},
      {year:"2026", t:"3.6 比特/参数", d:"ICML 2026 论文证明 GPT 风格模型每参数可建模约 3.6 比特分布信息。"}
    ],
    selected: 6
  };
  drawTimeline();
}
var m1Timeline = null;

function drawTension(svg){
  var bg = el("rect", {x:0,y:0,width:520,height:320,fill:"transparent"}, svg);
  // 网格
  for(var i=0;i<=5;i++){
    el("line", {x1:50,y1:40+i*52,x2:490,y2:40+i*52,stroke:"rgba(255,255,255,0.05)", "stroke-width":1}, svg);
  }
  // 坐标轴
  el("line", {x1:50,y1:300,x2:490,y2:300,stroke:"#3a4154","stroke-width":1.5}, svg);
  el("line", {x1:50,y1:40,x2:50,y2:300,stroke:"#3a4154","stroke-width":1.5}, svg);
  // 记忆曲线（先快速上升后下降）
  var memPath = "M50,280 C120,90 180,55 240,80 S360,160 490,210";
  el("path", {d:memPath, fill:"none", stroke:"var(--rose)","stroke-width":2.5, "stroke-linecap":"round"}, svg);
  // 泛化曲线（缓慢上升后平台）
  var genPath = "M50,290 C160,270 260,180 360,110 S470,85 490,82";
  el("path", {d:genPath, fill:"none", stroke:"var(--teal)","stroke-width":2.5, "stroke-linecap":"round"}, svg);
  // 交叉点标注
  el("circle", {cx:300, cy:135, r:5, fill:"var(--amber)"}, svg);
  el("line", {x1:300,y1:135,x2:300,y2:300,stroke:"var(--amber)","stroke-width":1, "stroke-dasharray":"4 4", opacity:0.5}, svg);
  el("text", {x:308, y:128, fill:"var(--amber)", "font-size":11, "font-weight":700}, svg).textContent = "相变点";
  // 标签
  el("text", {x:140, y:70, fill:"var(--rose)", "font-size":12, "font-weight":700}, svg).textContent = "逐字记忆";
  el("text", {x:380, y:75, fill:"var(--teal)", "font-size":12, "font-weight":700}, svg).textContent = "泛化模式";
  // 轴标签
  el("text", {x:260, y:318, fill:"var(--text-faint)", "font-size":11, "text-anchor":"middle"}, svg).textContent = "训练步数 →";
  el("text", {x:38, y:170, fill:"var(--text-faint)", "font-size":11, "text-anchor":"middle", transform:"rotate(-90 38 170)"}, svg).textContent = "强度 →";
}

function drawTimeline(){
  var t = m1Timeline;
  clearNode(t.svg);
  var n = t.events.length;
  var x0 = 60, x1 = 1040;
  var yMid = 110;
  el("line", {x1:x0,y1:yMid,x2:x1,y2:yMid,stroke:"#2a3040","stroke-width":2}, t.svg);
  t.events.forEach(function(ev, i){
    var x = x0 + (x1-x0) * (i/(n-1));
    var isSel = (i === t.selected);
    // 连接线到上方/下方交替
    var up = (i % 2 === 0);
    var yEnd = up ? yMid - 38 : yMid + 38;
    el("line", {x1:x,y1:yMid,x2:x,y2:yEnd,stroke:isSel?"var(--teal)":"#3a4154","stroke-width":isSel?2:1}, t.svg);
    el("circle", {cx:x, cy:yMid, r:isSel?8:6, fill:isSel?"var(--teal)":"#1a1e2b", stroke:isSel?"var(--teal)":"#4a5168", "stroke-width":2, style:"cursor:pointer"}, t.svg);
    el("text", {x:x, y:up?yEnd-6:yEnd+16, fill:isSel?"var(--teal)":"var(--text-dim)", "font-size":12, "font-weight":isSel?700:600, "text-anchor":"middle"}, t.svg).textContent = ev.year;
    el("text", {x:x, y:up?yEnd-22:yEnd+32, fill:"var(--text-faint)", "font-size":9.5, "text-anchor":"middle"}, t.svg).textContent = ev.t.length>10 ? ev.t.slice(0,9)+"…" : ev.t;

  // 网格

  for(var i=0;i<=4;i++){
    el("line", {x1:mL,y1:mT+i*ph/4,x2:mL+pw,y2:mT+i*ph/4,stroke:"rgba(255,255,255,0.05)"}, s.svg);

  }

  el("line", {x1:mL,y1:mT,x2:mL,y2:mT+ph,stroke:"#3a4154","stroke-width":1.5}, s.svg);

  // 记忆率曲线：快速上升后下降

  }
  // 重新：记忆率 = 早期高，临界点(0.3)后骤降
  function memRate(t){
    if(t < 0.25) return 0.95 - t*0.5;
    if(t < 0.4) return 0.825 - (t-0.25)*4; // 骤降

  }

  function trainErr(t){ return 0.9*Math.exp(-t*4) + 0.05; }
  // 验证误差：先降后可能回升(过拟合) 这里设计为先降后平
  function valErr(t){
    if(t < 0.35) return 0.85 - t*1.6;
    return Math.max(0.18, 0.29 + (t-0.35)*0.15);
  }

  function plot(fn, color){
    var pts = [];
    for(var i=0;i<=100;i++){
      var t = i/100;
      var x = mL + t*pw;
      var y = mT + (1-fn(t))*ph;
      pts.push(x+","+y);
    }
    el("polyline", {points:pts.join(" "), fill:"none", stroke:color, "stroke-width":2.5, "stroke-linecap":"round", "stroke-linejoin":"round"}, s.svg);
  }
  plot(memRate, "var(--rose)");
  plot(trainErr, "var(--teal)");
  plot(valErr, "var(--blue)");

  // 临界点标记
  var cx = mL + 0.3*pw;
  el("line", {x1:cx,y1:mT,x2:cx,y2:mT+ph,stroke:"var(--amber)","stroke-width":1, "stroke-dasharray":"4 4", opacity:0.6}, s.svg);
  el("text", {x:cx, y:mT-8, fill:"var(--amber)", "font-size":10, "font-weight":700, "text-anchor":"middle"}, s.svg).textContent = "相变点";

  // 当前位置
  var px = mL + p*pw;
  el("line", {x1:px,y1:mT,x2:px,y2:mT+ph,stroke:"var(--text)","stroke-width":1.5, opacity:0.4}, s.svg);
  el("circle", {cx:px, cy:mT+(1-memRate(p))*ph, r:5, fill:"var(--rose)"}, s.svg);
  el("circle", {cx:px, cy:mT+(1-trainErr(p))*ph, r:5, fill:"var(--teal)"}, s.svg);
  el("circle", {cx:px, cy:mT+(1-valErr(p))*ph, r:5, fill:"var(--blue)"}, s.svg);

  // 轴标签
  el("text", {x:mL+pw/2, y:H-8, fill:"var(--text-faint)", "font-size":11, "text-anchor":"middle"}, s.svg).textContent = "训练进度 →";

  // 阶段诊断
  var stageName, stageColor, stageDesc;
  if(p < 0.25){ stageName="阶段一 · 逐字记忆期"; stageColor="var(--rose)"; stageDesc="模型正用满容量拟合训练样本，记忆率高位。"; }
  else if(p < 0.4){ stageName="阶段二 · 相变过渡期"; stageColor="var(--amber)"; stageDesc="临界点附近，记忆率骤降，泛化模式开始占优。"; }
  else if(p < 0.75){ stageName="阶段三 · 泛化建立期"; stageColor="var(--teal)"; stageDesc="验证误差持续下降，模型学到了可迁移规律。"; }
  else { stageName="阶段四 · 过拟合风险期"; stageColor="var(--violet)"; stageDesc="验证误差可能回升，剩余容量用于记忆噪声。"; }
  s.stage.style.background = "rgba(255,255,255,0.02)";
  s.stage.style.border = "1px solid " + stageColor;
  s.stage.innerHTML = '<div style="font-weight:700;color:'+stageColor+';font-size:14px;">'+stageName+'</div>'+
    '<div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">'+stageDesc+'</div>';

  s.stats.innerHTML = "";
  var ms = [
    {v:(memRate(p)*100).toFixed(0)+"%", k:"记忆率", c:"rose"},
    {v:(trainErr(p)*100).toFixed(0)+"%", k:"训练误差", c:""},
    {v:(valErr(p)*100).toFixed(0)+"%", k:"验证误差", c:"violet"}
  ];
  ms.forEach(function(st){
    var d = document.createElement("div"); d.className = "stat";
    var v = document.createElement("div"); v.className = "v "+st.c; v.textContent = st.v;
    var k = document.createElement("div"); k.className = "k"; k.textContent = st.k;
    d.appendChild(v); d.appendChild(k); s.stats.appendChild(d);
  });
}

      dp:      [0.9, 0.45, 0.85, 0.55],
      unlearn: [0.85, 0.8, 0.6, 0.85],
      dedup:   [0.55, 0.85, 0.25, 0.3],
      distill: [0.5, 0.8, 0.55, 0.5]
    },
    names:["差分隐私训练","机器遗忘","数据去重","知识蒸馏"],
    dims:["隐私保护","泛化保持","计算开销","实施难度"]
  };
  m7DrawRadar();
}
var m7State = null;

function m7DrawRadar(){
  var s = m7State;
  var keys = ["dp","unlearn","dedup","distill"];
  var vals = s.data[keys[s.selected]];
  clearNode(s.svg);
  var W = 360, H = 320;
  el("rect", {x:0,y:0,width:W,height:H,fill:"transparent"}, s.svg);
  var cx = W/2, cy = H/2 + 6, R = 110;
  var n = 4;
  // 网格圈
  for(var g=1; g<=4; g++){
    var pts = [];
    for(var i=0;i<n;i++){
      var ang = -Math.PI/2 + i*2*Math.PI/n;
      pts.push((cx+Math.cos(ang)*R*g/4)+","+(cy+Math.sin(ang)*R*g/4));
    }
    el("polygon", {points:pts.join(" "), fill:"none", stroke:"rgba(255,255,255,0.08)", "stroke-width":1}, s.svg);
  }
  // 轴线
  for(var i=0;i<n;i++){
    var ang = -Math.PI/2 + i*2*Math.PI/n;
    el("line", {x1:cx, y1:cy, x2:cx+Math.cos(ang)*R, y2:cy+Math.sin(ang)*R, stroke:"rgba(255,255,255,0.1)"}, s.svg);
    el("text", {x:cx+Math.cos(ang)*(R+18), y:cy+Math.sin(ang)*(R+18)+4, fill:"var(--text-dim)", "font-size":11, "text-anchor":"middle", "font-weight":600}, s.svg).textContent = s.dims[i];
  }
  // 数据多边形
  var dpts = [];
  for(var i=0;i<n;i++){
    var ang = -Math.PI/2 + i*2*Math.PI/n;
    var r = R * vals[i];
    dpts.push((cx+Math.cos(ang)*r)+","+(cy+Math.sin(ang)*r));
  }
  el("polygon", {points:dpts.join(" "), fill:"var(--teal)", "fill-opacity":0.18, stroke:"var(--teal)", "stroke-width":2}, s.svg);
  for(var i=0;i<n;i++){
    var ang = -Math.PI/2 + i*2*Math.PI/n;
    var r = R * vals[i];
    el("circle", {cx:cx+Math.cos(ang)*r, cy:cy+Math.sin(ang)*r, r:4, fill:"var(--teal)"}, s.svg);
  }
  // 标题
  el("text", {x:cx, y:20, fill:"var(--text)", "font-size":13, "font-weight":700, "text-anchor":"middle"}, s.svg).textContent = s.names[s.selected];
}
function m7View(){ if(m7State){ m7DrawRadar(); } }

/* ============================================================
   M8 · 容量标度律
   ============================================================ */
function m8Draw(){
  var root = document.getElementById("m8");
  clearNode(root);
  var head = document.createElement("div");
  head.className = "mhead";
  head.innerHTML = '<div class="kicker">M8 · SCALING LAWS</div>'+
    '<h1>容量标度律</h1>'+
    '<p>模型容量与参数量、数据量、训练算力之间遵循幂律关系。在 3.6 bits/param 常数下，可推导出最优数据-参数配比与算力分配。</p>';
  root.appendChild(head);

  var grid = document.createElement("div");
  grid.className = "grid g2";
  root.appendChild(grid);

  // 左：对数坐标图
  var left = document.createElement("div");
  left.className = "card";
  left.innerHTML = '<div class="card-title"><span class="dot"></span>损失-算力标度律 · 双对数坐标</div>'+
    '<div class="card-desc">切换变量观察不同标度关系</div>';
  var ctrl = document.createElement("div");
  ctrl.className = "ctrl";
  var modes = [
    {name:"vs 参数量", key:"param"},
    {name:"vs 数据量", key:"data"},
    {name:"vs 算力", key:"compute"}
  ];
  modes.forEach(function(m, i){
    var b = document.createElement("button");
    b.className = "btn" + (i===0?" active":"");
    b.textContent = m.name;
    b.addEventListener("click", function(){
      ctrl.querySelectorAll(".btn").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      m8State.selected = i; m8DrawLog();
    });
    ctrl.appendChild(b);
  });
  left.appendChild(ctrl);
  var svgC = el("svg", {id:"m8Log", viewBox:"0 0 520 300"}, left);
  left.appendChild(svgC);
  var cap = document.createElement("div");
  cap.className = "svg-cap"; cap.id = "m8Cap";
  left.appendChild(cap);
  grid.appendChild(left);

  // 右：标度律公式
  var right = document.createElement("div");
  right.className = "card";
  right.innerHTML = '<div class="card-title"><span class="dot"></span>核心标度律公式</div>'+
    '<div class="card-desc">Kaplan/Chinchilla 幂律 + 容量常数</div>';
  var formulas = [
    {f:'<span class="var">L</span>(<span class="var">N</span>) <span class="op">∝</span> <span class="var">N</span><sup>−0.076</sup>', t:"损失随参数量 N 的幂律"},
    {f:'<span class="var">L</span>(<span class="var">D</span>) <span class="op">∝</span> <span class="var">D</span><sup>−0.095</sup>', t:"损失随数据量 D 的幂律"},
    {f:'<span class="var">L</span>(<span class="var">C</span>) <span class="op">∝</span> <span class="var">C</span><sup>−0.050</sup>', t:"损失随算力 C 的幂律"},
    {f:'<span class="var">C</span><sub>容量</sub> <span class="op">=</span> 3.6 <span class="op">×</span> <span class="var">N</span> bits', t:"容量上界（ICML 2026）"},
    {f:'<span class="var">D</span><sub>最优</sub> <span class="op">≈</span> 20 <span class="op">×</span> <span class="var">N</span>', t:"Chinchilla 最优数据配比"}
  ];
  formulas.forEach(function(fr, i){
    var f = document.createElement("div");
    f.className = "formula";
    if(i>0) f.style.marginTop = "8px";
    f.innerHTML = fr.f;
    right.appendChild(f);
    var t = document.createElement("div");
    t.style.cssText = "font-size:11.5px;color:var(--text-faint);margin-top:3px;margin-bottom:6px;";
    t.textContent = fr.t;
    right.appendChild(t);
  });
  var callout = document.createElement("div");
  callout.className = "callout"; callout.style.marginTop = "10px";
  callout.innerHTML = '<div class="ct">容量的意义</div>'+
    '<p>当数据所需信息量超过 3.6×N 时，模型无法完全记忆，被迫泛化——这解释了为何"数据略多于容量"时泛化最佳。</p>';
  right.appendChild(callout);
  grid.appendChild(right);

  m8State = {svg:svgC, cap:cap, selected:0,
    exps:{param:-0.076, data:-0.095, compute:-0.050},
    names:{param:"参数量 N", data:"数据量 D", compute:"算力 C"},
    units:{param:"参数", data:"token", compute:"FLOPs"}
  };
  m8DrawLog();
}
var m8State = null;

function m8DrawLog(){
  var s = m8State;
  var keys = ["param","data","compute"];
  var key = keys[s.selected];
  var exp = s.exps[key];
  clearNode(s.svg);
  var W = 520, H = 300;
  el("rect", {x:0,y:0,width:W,height:H,fill:"transparent"}, s.svg);
  var mL=56, mT=24, mR=24, mB=42;
  var pw = W-mL-mR, ph = H-mT-mB;
  // 双对数网格：x从1e2到1e6(4个 decade)，y从0.5到8
  var xDec = 4, yDec = 4;
  for(var i=0;i<=xDec;i++){
    var x = mL + i*pw/xDec;
    el("line", {x1:x,y1:mT,x2:x,y2:mT+ph,stroke:"rgba(255,255,255,0.05)"}, s.svg);
    el("text", {x:x, y:mT+ph+16, fill:"var(--text-faint)", "font-size":10, "text-anchor":"middle"}, s.svg).textContent = "10"+(2+i);
  }
  for(var j=0;j<=yDec;j++){
    var y = mT + j*ph/yDec;
    el("line", {x1:mL,y1:y,x2:mL+pw,y2:y,stroke:"rgba(255,255,255,0.05)"}, s.svg);
    var lv = (8 * Math.pow(0.5, j)).toFixed(1);
    el("text", {x:mL-8, y:y+4, fill:"var(--text-faint)", "font-size":10, "text-anchor":"end"}, s.svg).textContent = lv;
  }
  el("line", {x1:mL,y1:mT+ph,x2:mL+pw,y2:mT+ph,stroke:"#3a4154","stroke-width":1.5}, s.svg);
  el("line", {x1:mL,y1:mT,x2:mL,y2:mT+ph,stroke:"#3a4154","stroke-width":1.5}, s.svg);

  // 标度律曲线：在双对数坐标下是直线
  // L = A * x^exp, 取 A 使 x=1e2 时 L≈6
  function logX(dec){ return mL + dec*pw/xDec; }
  function yOf(L){
    // L 范围 0.5..8, log2 映射
    var l2 = Math.log(L)/Math.log(2); // log2(L), 8->3, 0.5->-1
    var frac = (3 - l2)/yDec; // 0..1
    return mT + frac*ph;
  }
  // 计算几个点
  var pts = [];
  for(var i=0;i<=40;i++){
    var dec = (i/40)*xDec; // 0..4 对应 1e2..1e6
    var xv = Math.pow(10, 2+dec);
    // L = 6 * (xv/1e2)^exp  -> 在 log 下线性
    var L = 6 * Math.pow(xv/1e2, exp);
    L = Math.max(0.5, Math.min(8, L));
    pts.push(logX(dec)+","+yOf(L));
  }
  // 理论线
  el("polyline", {points:pts.join(" "), fill:"none", stroke:"var(--teal)", "stroke-width":2.5}, s.svg);
  // 容量上界虚线：当 x 超过容量时损失触底
  var capDec = 2.5;
  el("line", {x1:logX(capDec), y1:mT, x2:logX(capDec), y2:mT+ph, stroke:"var(--amber)", "stroke-width":1, "stroke-dasharray":"5 4", opacity:0.6}, s.svg);
  el("text", {x:logX(capDec)+4, y:mT+14, fill:"var(--amber)", "font-size":10, "font-weight":700}, s.svg).textContent = "容量上界";

  // 散点：示意实测点
  var scatter = [[0.3,5.8],[0.8,5.2],[1.4,4.6],[2.0,4.1],[2.8,3.5],[3.4,3.0]];
  scatter.forEach(function(p){
    el("circle", {cx:logX(p[0]), cy:yOf(p[1]), r:4, fill:"var(--violet)", opacity:0.85}, s.svg);
  });

  // 轴标签
  el("text", {x:mL+pw/2, y:H-6, fill:"var(--text-faint)", "font-size":11, "text-anchor":"middle"}, s.svg).textContent = s.names[key] + " (" + s.units[key] + ") →";
  el("text", {x:18, y:mT+ph/2, fill:"var(--text-faint)", "font-size":11, "text-anchor":"middle", transform:"rotate(-90 18 "+(mT+ph/2)+")"}, s.svg).textContent = "测试损失 L →";

  // 图例
  el("circle", {cx:mL+16, cy:mT+10, r:4, fill:"var(--teal)"}, s.svg);
  el("text", {x:mL+26, y:mT+14, fill:"var(--text-dim)", "font-size":10}, s.svg).textContent = "理论幂律";
  el("circle", {cx:mL+90, cy:mT+10, r:4, fill:"var(--violet)"}, s.svg);
  el("text", {x:mL+100, y:mT+14, fill:"var(--text-dim)", "font-size":10}, s.svg).textContent = "实测点";

  s.cap.textContent = "L(" + s.names[key] + ") ∝ " + s.names[key].split(" ")[0] + "^(" + exp + ")：双对数坐标下呈直线，斜率 " + exp;
}
function m8View(){ if(m8State){ m8DrawLog(); } }

/* ============================================================
   初始化
   ============================================================ */
function init(){
  buildNav();
  m1Draw();
  m2Draw();
  m3Draw();
  m4Draw();
  m5Draw();
  m6Draw();
  m7Draw();
  m8Draw();
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
