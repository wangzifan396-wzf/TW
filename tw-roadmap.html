:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;

  --radius:8px;
  --mono:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace;

*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3d45}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,.92);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
header .logo{font-size:18px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
header .logo span{color:var(--accent)}
header .sep{width:1px;height:20px;background:var(--border2)}
header nav{display:flex;gap:4px}
header nav a{color:var(--text3);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:all .15s;white-space:nowrap}
header nav a:hover{color:var(--text);background:var(--bg3)}
header nav a.active{color:var(--text);background:var(--bg3)}
header .spacer{flex:1}
header .stats{font-size:12px;color:var(--text3);white-space:nowrap}
header .stats b{color:var(--text2)}

/* Hero */
.hero{padding:48px 24px 24px;text-align:center;max-width:1200px;margin:0 auto}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,var(--text) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:16px;color:var(--text2);max-width:600px;margin:0 auto}

/* Path selector */
.paths{max-width:1400px;margin:0 auto;padding:16px 24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.path-card{padding:12px 20px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:all .15s;min-width:200px}
.path-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-2px)}
.path-card.active{border-color:var(--accent);background:var(--bg3);box-shadow:0 4px 20px rgba(124,92,255,.15)}
.path-card .pn{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.path-card .pd{font-size:11px;color:var(--text3);line-height:1.4}
.path-card .pc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.path-card .pcount{font-size:11px;color:var(--text3);margin-top:4px;font-family:var(--mono)}

/* Roadmap canvas */
.roadmap-wrap{max-width:1400px;margin:0 auto;padding:0 24px 48px}
.roadmap-scroll{overflow-x:auto;overflow-y:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);position:relative}
.roadmap-inner{position:relative;min-height:600px;user-select:none}

/* SVG for edges */
.edges-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.edge{stroke:var(--border2);stroke-width:1.5;fill:none;transition:all .2s}
.edge.highlight{stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 4px rgba(124,92,255,.4))}

/* Level labels */
.level-label{position:absolute;left:0;width:100%;text-align:center;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:2px;pointer-events:none}

/* Nodes */
.node{position:absolute;width:180px;padding:12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;transition:all .2s;z-index:5}
.node:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.node.highlighted{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 24px rgba(124,92,255,.2)}
.node.dimmed{opacity:.3}
.node .nl{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text3);margin-bottom:4px}
.node .nt{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.node .nd{font-size:11px;color:var(--text3);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .np{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 6px;border-radius:4px;margin-top:6px;background:var(--bg);color:var(--text2);font-family:var(--mono)}
.node .cat-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--radius) 0 0 var(--radius)}

/* Progress */
.node .check{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);transition:all .15s;z-index:6}
.node .check:hover{border-color:var(--accent)}
.node .check.done{background:var(--accent);border-color:var(--accent);color:#fff}
.node.completed{opacity:.7}
.node.completed .nt{text-decoration:line-through;text-decoration-color:var(--text3)}

/* Progress bar */
.progress-bar{max-width:1400px;margin:0 auto;padding:0 24px 16px;display:flex;align-items:center;gap:12px}
.progress-bar .pl{font-size:13px;color:var(--text2);white-space:nowrap}
.progress-bar .track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:3px;transition:width .3s}
.progress-bar .pct{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600;min-width:40px;text-align:right}
.progress-bar .reset{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text3);font-size:11px;cursor:pointer;transition:all .15s}
.progress-bar .reset:hover{color:var(--text);border-color:var(--border2)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.modal-overlay.show{display:flex;opacity:1}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;max-width:440px;width:90%;overflow:hidden;transform:scale(.95);transition:transform .2s;position:relative}
.modal-overlay.show .modal{transform:scale(1)}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.modal-head .lvl{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.modal-head .ttl{font-size:22px;font-weight:700;color:var(--text);margin:4px 0 8px}
.modal-head .cat-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.modal-body{padding:20px 24px}
.modal-body .dsc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.modal-body .meta{display:flex;gap:16px;margin-bottom:16px}
.modal-body .meta-item{font-size:12px;color:var(--text3)}
.modal-body .meta-item b{color:var(--text2)}
.modal-body .link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:all .15s}
.modal-body .link-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,92,255,.3)}
.modal-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:6px;border:none;background:var(--bg3);color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:10}
.modal-close:hover{color:var(--text);background:var(--border)}
.modal-body .deps{margin-bottom:16px}
.modal-body .deps-label{font-size:12px;color:var(--text3);margin-bottom:6px}
.modal-body .dep-chips{display:flex;flex-wrap:wrap;gap:4px}
.modal-body .dep-chip{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .15s}
.modal-body .dep-chip:hover{background:var(--border);color:var(--text)}

/* Footer */
footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);color:var(--text3);font-size:12px}

.hint kbd{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px;color:var(--text2);margin:0 2px}

  .node{width:150px;padding:10px}

var LEVEL_NAMES = {"1": "基础层", "2": "入门层", "3": "进阶层", "4": "高级层", "5": "专家层"};
var LEVEL_DESCS = {"1": "Foundation · 计算机科学的根基", "2": "Introductory · 核心系统与理论", "3": "Intermediate · 专业方向深入", "4": "Advanced · 前沿技术探索", "5": "Expert · 专家级领域研究"};
var CAT_COLORS = {"foundation": "#a1a1aa", "ai": "#5e6ad2", "cs": "#34d399", "math": "#fbbf24", "theory": "#f97316", "cross": "#ec4899"};
var BASE = "https://wangzifan396-wzf.github.io/TW/";

var nodeMap = {};
NODES.forEach(function(n){nodeMap[n.id] = n});

var activePath = null;
var completed = {};
try{completed = JSON.parse(localStorage.getItem("tw_roadmap_progress") || "{}")}catch(e){completed = {}}

// Layout constants
var COL_WIDTH = 240;
var ROW_HEIGHT = 110;
var NODE_W = 180;
var NODE_H = 80;
var PAD_X = 40;
var PAD_Y = 50;

function getMaxY(level){
  var max = 0;
  NODES.forEach(function(n){
    if(n.level === level && n.y > max) max = n.y;
  });
  return max;
}

function init(){
  renderPaths();
  renderNodes();
  renderEdges();
  updateProgress();
  bindControls();
}

function renderPaths(){
  var container = document.getElementById("paths");
  container.innerHTML = "";

  // "All" option
  var allCard = document.createElement("div");
  allCard.className = "path-card active";
  allCard.dataset.pathId = "all";
  allCard.innerHTML = '<div class="pn"><span class="pc" style="background:var(--accent)"></span>全部节点</div><div class="pd">展示完整技能树</div><div class="pcount">35 nodes</div>';
  allCard.addEventListener("click", function(){selectPath("all")});
  container.appendChild(allCard);

  PATHS.forEach(function(p){
    var card = document.createElement("div");
    card.className = "path-card";
    card.dataset.pathId = p.id;
    card.innerHTML = '<div class="pn"><span class="pc" style="background:'+p.color+'"></span>'+p.name+'</div><div class="pd">'+p.desc+'</div><div class="pcount">'+p.nodes.length+' nodes</div>';
    card.addEventListener("click", function(){selectPath(p.id)});
    container.appendChild(card);
  });
}

function selectPath(pathId){
  activePath = pathId;
  document.querySelectorAll(".path-card").forEach(function(c){
    c.classList.toggle("active", c.dataset.pathId === pathId);
  });

  // Reset highlights
  document.querySelectorAll(".node").forEach(function(n){
    n.classList.remove("highlighted","dimmed");
  });
  document.querySelectorAll(".edge").forEach(function(e){
    e.classList.remove("highlight");
  });

  if(pathId !== "all"){
    var path = PATHS.find(function(p){return p.id === pathId});
    if(path){
      var nodeSet = {};
      path.nodes.forEach(function(id){nodeSet[id] = true});

      // Highlight nodes in path
      document.querySelectorAll(".node").forEach(function(el){
        if(nodeSet[el.dataset.id]){
          el.classList.add("highlighted");
        } else {
          el.classList.add("dimmed");
        }
      });

      // Highlight edges between path nodes
      document.querySelectorAll(".edge").forEach(function(el){
        var from = el.dataset.from;
        var to = el.dataset.to;
        if(nodeSet[from] && nodeSet[to]){
          el.classList.add("highlight");
        }
      });
    }
  }
}

function renderNodes(){
  var inner = document.getElementById("rmInner");
  var maxLevel = 5;

  // Calculate dimensions
  var maxNodesInLevel = 0;
  for(var lv = 1; lv <= maxLevel; lv++){
    var count = NODES.filter(function(n){return n.level === lv}).length;
    if(count > maxNodesInLevel) maxNodesInLevel = count;
  }

  var totalWidth = maxLevel * COL_WIDTH + PAD_X * 2;
  var totalHeight = (maxNodesInLevel + 1) * ROW_HEIGHT + PAD_Y * 2;
  inner.style.width = totalWidth + "px";
  inner.style.height = totalHeight + "px";

  // Level labels
  for(var lv = 1; lv <= maxLevel; lv++){
    var label = document.createElement("div");
    label.className = "level-label";
    label.style.left = ((lv - 1) * COL_WIDTH + PAD_X) + "px";
    label.style.top = "12px";
    label.style.width = COL_WIDTH + "px";
    label.textContent = "L" + lv + " · " + LEVEL_NAMES[lv];
    label.title = LEVEL_DESCS[lv];
    inner.appendChild(label);
  }

  // Nodes
  NODES.forEach(function(n){
    var el = document.createElement("div");
    el.className = "node";
    el.dataset.id = n.id;
    el.dataset.level = n.level;
    el.dataset.cat = n.cat;

    var x = (n.level - 1) * COL_WIDTH + PAD_X;
    var y = PAD_Y + n.y * ROW_HEIGHT + 30;
    el.style.left = x + "px";
    el.style.top = y + "px";

    var color = CAT_COLORS[n.cat] || "#7c5cff";

    var catBar = document.createElement("div");
    catBar.className = "cat-bar";
    catBar.style.background = color;
    el.appendChild(catBar);

    var lvl = document.createElement("div");
    lvl.className = "nl";
    lvl.textContent = "L" + n.level;
    el.appendChild(lvl);

    var ttl = document.createElement("div");
    ttl.className = "nt";
    ttl.textContent = n.name;
    el.appendChild(ttl);

    var dsc = document.createElement("div");
    dsc.className = "nd";
    dsc.textContent = n.desc;
    el.appendChild(dsc);

    if(n.project){
      var proj = document.createElement("div");
      proj.className = "np";
      proj.textContent = "🔗 " + n.project;
      el.appendChild(proj);
    }

    // Check button
    var check = document.createElement("div");
    check.className = "check" + (completed[n.id] ? " done" : "");
    check.textContent = completed[n.id] ? "✓" : "";
    check.title = "标记为已学习";
    check.addEventListener("click", function(e){
      e.stopPropagation();
      toggleComplete(n.id, check, el);
    });
    el.appendChild(check);

    if(completed[n.id]){
      el.classList.add("completed");
    }

    el.addEventListener("click", function(e){
      if(e.target.classList.contains("check")) return;
      showDetail(n);
    });

    inner.appendChild(el);
  });
}

function renderEdges(){
  var svg = document.getElementById("edgesSvg");
  var inner = document.getElementById("rmInner");
  var w = inner.offsetWidth;
  var h = inner.offsetHeight;
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.innerHTML = "";

  EDGES.forEach(function(e){
    var from = nodeMap[e.from];
    var to = nodeMap[e.to];
    if(!from || !to) return;

    var x1 = (from.level - 1) * COL_WIDTH + PAD_X + NODE_W;
    var y1 = PAD_Y + from.y * ROW_HEIGHT + 30 + NODE_H / 2;
    var x2 = (to.level - 1) * COL_WIDTH + PAD_X;
    var y2 = PAD_Y + to.y * ROW_HEIGHT + 30 + NODE_H / 2;

    // Bezier curve
    var cx1 = x1 + (x2 - x1) * 0.5;
    var cy1 = y1;
    var cx2 = x1 + (x2 - x1) * 0.5;
    var cy2 = y2;

    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "edge");
    path.setAttribute("d", "M " + x1 + " " + y1 + " C " + cx1 + " " + cy1 + ", " + cx2 + " " + cy2 + ", " + x2 + " " + y2);
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    svg.appendChild(path);
  });
}

function toggleComplete(id, checkEl, nodeEl){
  if(completed[id]){
    delete completed[id];
    checkEl.classList.remove("done");
    checkEl.textContent = "";
    nodeEl.classList.remove("completed");
  } else {
    completed[id] = true;
    checkEl.classList.add("done");
    checkEl.textContent = "✓";
    nodeEl.classList.add("completed");
  }
  localStorage.setItem("tw_roadmap_progress", JSON.stringify(completed));
  updateProgress();
}

function updateProgress(){
  var total = NODES.length;
  var done = Object.keys(completed).filter(function(k){return completed[k] && nodeMap[k]}).length;
  var pct = Math.round(done / total * 100);
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progPct").textContent = pct + "%";
}

function showDetail(n){
  document.getElementById("mLevel").textContent = "Level " + n.level + " · " + LEVEL_NAMES[n.level];
  document.getElementById("mTitle").textContent = n.name;
  document.getElementById("mDesc").textContent = n.desc;

  var catEl = document.getElementById("mCat");
  catEl.textContent = n.cat;
  catEl.style.background = (CAT_COLORS[n.cat] || "#7c5cff") + "22";
  catEl.style.color = CAT_COLORS[n.cat] || "#7c5cff";

  document.getElementById("mLevelName").textContent = LEVEL_NAMES[n.level];
  document.getElementById("mCatName").textContent = n.cat;

  // Find path nodes
  var depsEl = document.getElementById("mDeps");
  var chipsEl = document.getElementById("mDepChips");
  chipsEl.innerHTML = "";

  var containingPaths = PATHS.filter(function(p){return p.nodes.indexOf(n.id) >= 0});
  if(containingPaths.length > 0){
    depsEl.style.display = "block";
    containingPaths.forEach(function(p){
      p.nodes.forEach(function(id){
        if(id === n.id) return;
        var node = nodeMap[id];
        if(!node) return;
        var chip = document.createElement("span");
        chip.className = "dep-chip";
        chip.textContent = node.name;
        chip.addEventListener("click", function(){showDetail(node)});
        chipsEl.appendChild(chip);
      });
    });
  } else {
    depsEl.style.display = "none";
  }

  var linkEl = document.getElementById("mLink");
  if(n.project){
    linkEl.href = BASE + n.project + "/";
    linkEl.style.display = "inline-flex";
    linkEl.textContent = "访问 " + n.project + " →";
  } else {
    linkEl.style.display = "none";
  }

  document.getElementById("modalOverlay").classList.add("show");
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("show");
}

function bindControls(){
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });
  document.getElementById("progReset").addEventListener("click", function(){
    completed = {};
    localStorage.removeItem("tw_roadmap_progress");
    document.querySelectorAll(".check").forEach(function(c){
      c.classList.remove("done");
      c.textContent = "";
    });
    document.querySelectorAll(".node").forEach(function(n){
      n.classList.remove("completed");
    });
    updateProgress();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeModal();
  });
}

init();
