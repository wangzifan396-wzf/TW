<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高级算法可视化实验室 · Algorithm Advanced Viz Lab</title>
<style>
:root{
  --bg:#08090a;--bg2:#0f1115;--bg3:#16181d;--border:#1e2026;--border2:#2a2d35;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;--accent:#facc15;--accent2:#eab308;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 50% 0%,rgba(250,204,21,0.05),transparent 50%);
}
code,.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
.header{position:sticky;top:0;z-index:100;background:rgba(8,9,10,0.85);border-bottom:1px solid var(--border)}
.header-inner{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-0.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#08090a;font-weight:700;font-size:13px}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav-pill{font-size:12px;padding:6px 11px;border-radius:7px;color:var(--text2);background:transparent;border:1px solid transparent;cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;white-space:nowrap}
.nav-pill:hover{color:var(--text);background:var(--bg2);border-color:var(--border)}
.nav-pill.active{color:var(--accent);background:rgba(250,204,21,0.1);border-color:rgba(250,204,21,0.3)}
.container{max-width:1280px;margin:0 auto;padding:32px 28px 120px}
.hero{padding:24px 0 40px;border-bottom:1px solid var(--border);margin-bottom:48px}
.hero h1{font-size:34px;letter-spacing:-0.02em;font-weight:600;margin-bottom:10px}
.hero h1 .glow{color:var(--accent)}
.hero p{color:var(--text2);font-size:15px;max-width:680px}
.hero .meta{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--text3)}
.hero .meta span{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.module{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-bottom:28px;scroll-margin-top:80px;transition:border-color .2s ease}
.module:hover{border-color:var(--border2)}
.module-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.module-num{flex-shrink:0;width:34px;height:34px;border-radius:9px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600}
.module-title{flex:1;min-width:200px}
.module-title h2{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px}
.module-title p{color:var(--text2);font-size:13.5px}
.badge{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);font-family:'SF Mono',Monaco,Consolas,monospace}
.badge.accent{color:var(--accent);border-color:rgba(250,204,21,0.3);background:rgba(250,204,21,0.08)}
.module-body{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px}
.panel-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;font-weight:600}
.desc{color:var(--text2);font-size:13.5px;margin-bottom:16px;line-height:1.7}
.desc strong{color:var(--text)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:7px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#08090a;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#08090a}
.btn.sm{font-size:11.5px;padding:5px 10px}
.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(250,204,21,0.1)}
.slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
.slider-row input[type=range]{-webkit-appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;width:110px}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.slider-row .val{color:var(--accent);font-family:'SF Mono',Monaco,Consolas,monospace;min-width:42px}
svg{display:block;width:100%;height:auto}
.svg-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:hidden}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.stat .v{font-size:16px;color:var(--text);font-family:'SF Mono',Monaco,Consolas,monospace;margin-top:2px}
.stat .v.acc{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
table.cmp th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em}
table.cmp td{color:var(--text2)}
table.cmp tr:hover td{color:var(--text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.bn-btn{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s ease}
.bn-btn:hover{border-color:var(--accent)}
.bn-btn .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.bn-btn .name{font-size:14px;color:var(--text);margin-top:3px}
.bn-btn.next{text-align:right}
.bn-btn[disabled]{opacity:0.4;pointer-events:none}
@media(max-width:820px){.module-body{grid-template-columns:1fr}.hero h1{font-size:26px}.container{padding:24px 16px 100px}.header-inner{padding:12px 16px}}
.pulse{animation:pulse 1.5s ease-in-out 8s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:11.5px;color:var(--text2);white-space:pre;overflow-x:auto;margin-top:10px}
.code-block .kw{color:var(--accent)}.code-block .str{color:var(--green)}.code-block .num{color:var(--amber)}.code-block .cmt{color:var(--text3)}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo"><div class="logo-mark">A</div><span>Algorithm Advanced · 高级算法</span></div>
    <div class="nav-pills" id="navPills"></div>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>高级算法 <span class="glow">可视化实验室</span></h1>
    <p>8 个交互式模块，覆盖竞赛级数据结构与算法：线段树(懒标记)、树状数组、莫队、后缀自动机、LCT、Slope Trick、模拟退火、字符串哈希。所有可视化均由 SVG 实时绘制。</p>
    <div class="meta">
      <span><i class="dot"></i>8 Modules</span>
      <span><i class="dot"></i>Pure SVG / Canvas</span>
      <span><i class="dot"></i>Zero Dependencies</span>
      <span><i class="dot"></i>Linear Dark Aesthetic</span>
    </div>
  </div>

  <div id="modules"></div>

  <div class="bottom-nav">
    <div class="bn-btn prev" id="bnPrev"><div class="lbl">← Previous</div><div class="name" id="bnPrevName">—</div></div>
    <div class="bn-btn next" id="bnNext"><div class="lbl">Next →</div><div class="name" id="bnNextName">—</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>[...p.querySelectorAll(s)];
const SVGNS='http://www.w3.org/2000/svg';
const el=(tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);};
const rnd=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MODULES=[
  {id:'segtree',num:'01',name:'线段树',en:'Segment Tree'},
  {id:'bit',num:'02',name:'树状数组',en:'Fenwick / BIT'},
  {id:'mo',num:'03',name:'莫队算法',en:"Mo's Algorithm"},
  {id:'sam',num:'04',name:'后缀自动机',en:'Suffix Automaton'},
  {id:'lct',num:'05',name:'LCT 动态树',en:'Link-Cut Tree'},
  {id:'slope',num:'06',name:'Slope Trick',en:'Slope Trick'},
  {id:'sa',num:'07',name:'模拟退火',en:'Simulated Annealing'},
  {id:'hash',num:'08',name:'字符串哈希',en:'String Hash'},
];

const navPills=$('#navPills');
MODULES.forEach(m=>{const b=document.createElement('div');b.className='nav-pill';b.textContent=m.num;b.onclick=()=>document.getElementById(m.id).scrollIntoView({behavior:'smooth',block:'start'});navPills.appendChild(b);});
const modulesEl=$('#modules');
MODULES.forEach(m=>{const sec=document.createElement('section');sec.className='module';sec.id=m.id;sec.innerHTML=`<div class="module-head"><div class="module-num">${m.num}</div><div class="module-title"><h2>${m.name}</h2><p>${m.en}</p></div><span class="badge accent">Module ${m.num}</span></div><div class="module-body" id="body-${m.id}"></div>`;modulesEl.appendChild(sec);});

/* ============================================================ 模块1: 线段树 ============================================================ */
(()=>{
  const body=$('#body-segtree');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">线段树 + Lazy Propagation</div>
      <div class="desc">区间更新/查询 O(log n)。Lazy 标记延迟下传，避免 O(n)。点击"区间加"或"区间求和"，观察节点访问路径与 lazy 下传。</div>
      <div class="controls">
        <button class="btn primary" id="st-query">区间求和</button>
        <button class="btn" id="st-update">区间加</button>
        <button class="btn" id="st-reset">重置</button>
        <div class="slider-row">L <input type="range" id="st-l" min="0" max="7" value="1"><span class="val" id="st-l-v">1</span></div>
        <div class="slider-row">R <input type="range" id="st-r" min="0" max="7" value="4"><span class="val" id="st-r-v">4</span></div>
      </div>
      <div class="svg-wrap"><svg id="st-svg" viewBox="0 0 460 320"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">复杂度与原理</div>
      <table class="cmp">
        <tr><th>操作</th><th>复杂度</th></tr>
        <tr><td>建树</td><td>O(n)</td></tr>
        <tr><td>区间查询</td><td>O(log n)</td></tr>
        <tr><td>区间更新(lazy)</td><td>O(log n)</td></tr>
        <tr><td>单点更新</td><td>O(log n)</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">Lazy 标记</div>
      <div class="desc">节点已被更新但其子节点未更新。访问子节点时 pushdown 下传标记。lazy[node] 表示该节点代表的区间每个元素待加的值。</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">数组大小</div><div class="v acc">8</div></div>
        <div class="stat"><div class="k">查询结果</div><div class="v" id="st-result">—</div></div>
        <div class="stat"><div class="k">访问节点</div><div class="v" id="st-visited">0</div></div>
      </div>
    </div>`;
  const svg=$('#st-svg');
  let n=8,arr=[3,1,4,1,5,9,2,6];
  let tree=new Array(4*n).fill(0),lazy=new Array(4*n).fill(0);
  let visited=new Set(),highlightPath=[],queryResult=null;
  function build(node,l,r){
    if(l===r){tree[node]=arr[l];return;}
    const mid=(l+r)>>1;
    build(node*2,l,mid);build(node*2+1,mid+1,r);
    tree[node]=tree[node*2]+tree[node*2+1];
  }
  build(1,0,n-1);
  function pushdown(node,l,r){
    if(lazy[node]){
      const mid=(l+r)>>1;
      tree[node*2]+=lazy[node]*(mid-l+1);
      lazy[node*2]+=lazy[node];
      tree[node*2+1]+=lazy[node]*(r-mid);
      lazy[node*2+1]+=lazy[node];
      lazy[node]=0;
    }
  }
  function update(node,l,r,ql,qr,val){
    visited.add(node);
    if(qr<l||r<ql)return;
    if(ql<=l&&r<=qr){tree[node]+=val*(r-l+1);lazy[node]+=val;return;}
    pushdown(node,l,r);
    const mid=(l+r)>>1;
    update(node*2,l,mid,ql,qr,val);
    update(node*2+1,mid+1,r,ql,qr,val);
    tree[node]=tree[node*2]+tree[node*2+1];
  }
  function query(node,l,r,ql,qr){
    visited.add(node);
    if(qr<l||r<ql)return 0;
    if(ql<=l&&r<=qr)return tree[node];
    pushdown(node,l,r);
    const mid=(l+r)>>1;
    return query(node*2,l,mid,ql,qr)+query(node*2+1,mid+1,r,ql,qr);
  }
  let L=1,R=4;
  $('#st-l').oninput=e=>{L=+e.target.value;$('#st-l-v').textContent=L;if(R<L){R=L;$('#st-r').value=L;$('#st-r-v').textContent=L;}draw();};
  $('#st-r').oninput=e=>{R=+e.target.value;$('#st-r-v').textContent=R;if(L>R){L=R;$('#st-l').value=L;$('#st-l-v').textContent=L;}draw();};
  function nodePos(node,depth){
    // 满二叉树布局
    const width=420;const x0=20;
    const nodesAtLevel=Math.pow(2,depth);
    const idx=node-Math.pow(2,depth);
    const x=x0+(idx+0.5)*(width/nodesAtLevel);
    const y=30+depth*45;
    return {x,y};
  }
  function getRange(node,l,r){return [l,r];}
  function drawTree(node=1,l=0,r=n-1,depth=0){
    const {x,y}=nodePos(node,depth);
    const isVisited=visited.has(node);
    const [rl,rr]=getRange(node,l,r);
    const inRange=!(rr<L||rl>R);
    let c='var(--border2)';
    if(isVisited)c=inRange?'var(--accent)':'var(--green)';
    // lazy 标记
    if(lazy[node]){
      svg.appendChild(el('circle',{cx:x+22,cy:y-12,r:8,fill:'var(--amber)'}));
      svg.appendChild(el('text',{x:x+22,y:y-9,'text-anchor':'middle',fill:'#08090a','font-size':9,'font-family':'monospace','font-weight':700},'+'));
    }
    svg.appendChild(el('circle',{cx:x,cy:y,r:16,fill:isVisited?'rgba(250,204,21,0.15)':'var(--bg3)',stroke:c,'stroke-width':isVisited?2:1.2}));
    svg.appendChild(el('text',{x,y:y+4,'text-anchor':'middle',fill:isVisited?'var(--accent)':'var(--text2)','font-size':9,'font-family':'monospace'},tree[node]));
    // 区间标签
    if(depth<3)svg.appendChild(el('text',{x,y:y+28,'text-anchor':'middle',fill:'var(--text3)','font-size':7.5,'font-family':'monospace'},'['+l+','+r+']'));
    if(l<r){
      const mid=(l+r)>>1;
      const lc=nodePos(node*2,depth+1),rc=nodePos(node*2+1,depth+1);
      svg.appendChild(el('line',{x1:x,y1:y+16,x2:lc.x,y2:lc.y-16,stroke:'var(--border)','stroke-width':1}));
      svg.appendChild(el('line',{x1:x,y1:y+16,x2:rc.x,y2:rc.y-16,stroke:'var(--border)','stroke-width':1}));
      drawTree(node*2,l,mid,depth+1);
      drawTree(node*2+1,mid+1,r,depth+1);
    }
  }
  function draw(){
    svg.innerHTML='';
    // 叶子数组
    for(let i=0;i<n;i++){
      const inQ=i>=L&&i<=R;
      svg.appendChild(el('rect',{x:20+i*52,y:285,width:46,height:24,rx:4,fill:inQ?'rgba(250,204,21,0.2)':'var(--bg3)',stroke:inQ?'var(--accent)':'var(--border2)'}));
      svg.appendChild(el('text',{x:20+i*52+23,y:301,'text-anchor':'middle',fill:inQ?'var(--accent)':'var(--text2)','font-size':10,'font-family':'monospace'},arr[i]));
      svg.appendChild(el('text',{x:20+i*52+23,y:280,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},i));
    }
    drawTree();
    $('#st-visited').textContent=visited.size;
    $('#st-result').textContent=queryResult!==null?queryResult:'—';
  }
  $('#st-query').onclick=()=>{
    visited=new Set();queryResult=null;draw();
    setTimeout(()=>{
      queryResult=query(1,0,n-1,L,R);draw();
      toast('sum['+L+','+R+'] = '+queryResult+' (访问 '+visited.size+' 节点)');
    },200);
  };
  $('#st-update').onclick=()=>{
    visited=new Set();
    setTimeout(()=>{
      update(1,0,n-1,L,R,5);
      // 同步数组
      for(let i=L;i<=R;i++)arr[i]+=5;
      draw();toast('['+L+','+R+'] 每个元素 +5 (lazy 下传)');
    },200);
  };
  $('#st-reset').onclick=()=>{arr=[3,1,4,1,5,9,2,6];tree=new Array(4*n).fill(0);lazy=new Array(4*n).fill(0);build(1,0,n-1);visited=new Set();queryResult=null;draw();};
  draw();
})();

/* ============================================================ 模块2: 树状数组 ============================================================ */
(()=>{
  const body=$('#body-bit');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">树状数组 (BIT)</div>
      <div class="desc">利用 lowbit(x)=x&-x 分治。c[i] 管辖 [i-lowbit(i)+1, i]。单点更新向上爬，前缀查询向下求和。点击操作观察路径。</div>
      <div class="controls">
        <button class="btn primary" id="bt-query">前缀查询</button>
        <button class="btn" id="bt-update">单点加</button>
        <div class="slider-row">位置 <input type="range" id="bt-pos" min="1" max="8" value="3"><span class="val" id="bt-pos-v">3</span></div>
      </div>
      <div class="svg-wrap"><svg id="bt-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">lowbit 与路径</div>
      <div class="desc">单点更新 i：依次 i += lowbit(i) 向上。<br>前缀查询 i：依次 i -= lowbit(i) 向下。<br>lowbit(i) = i & -i，取出最低位的 1。</div>
      <table class="cmp">
        <tr><th>i</th><th>lowbit</th><th>管辖范围</th></tr>
        <tr><td>1</td><td>1</td><td>[1,1]</td></tr>
        <tr><td>2</td><td>2</td><td>[1,2]</td></tr>
        <tr><td>4</td><td>4</td><td>[1,4]</td></tr>
        <tr><td>6</td><td>2</td><td>[5,6]</td></tr>
        <tr><td>8</td><td>8</td><td>[1,8]</td></tr>
      </table>
      <div class="stat-grid">
        <div class="stat"><div class="k">查询结果</div><div class="v acc" id="bt-result">—</div></div>
        <div class="stat"><div class="k">访问节点</div><div class="v" id="bt-visited">0</div></div>
      </div>
    </div>`;
  const svg=$('#bt-svg');
  let n=8,a=[0,3,1,4,1,5,9,2,6];
  let c=new Array(n+1).fill(0);
  for(let i=1;i<=n;i++)for(let j=i;j>=i-(i&-i)+1;j--)c[i]+=a[j];
  let visited=new Set(),path=[],result=null,pos=3;
  $('#bt-pos').oninput=e=>{pos=+e.target.value;$('#bt-pos-v').textContent=pos;draw();};
  function draw(){
    svg.innerHTML='';
    // BIT 结构：每个 c[i] 画一个块，宽度=lowbit(i)
    let x=20;
    const rowH=40;
    // 树状层级
    const levels={8:0,4:1,2:2,6:2,1:3,3:3,5:3,7:3};
    // 简化：横向排列，块宽=lowbit
    for(let i=1;i<=n;i++){
      const lb=i&-i;
      const w=lb*44;
      const isVisited=visited.has(i);
      const inPath=path.includes(i);
      let fill='var(--bg3)',stroke='var(--border2)';
      if(isVisited){fill='rgba(250,204,21,0.15)';stroke='var(--accent)';}
      if(inPath){fill='rgba(52,211,153,0.2)';stroke='var(--green)';}
      svg.appendChild(el('rect',{x,y:80,width:w-3,height:rowH,rx:5,fill,stroke,'stroke-width':isVisited||inPath?2:1.2}));
      svg.appendChild(el('text',{x:x+w/2-1,y:96,'text-anchor':'middle',fill:isVisited||inPath?'var(--accent)':'var(--text2)','font-size':11,'font-family':'monospace'},'c'+i+'='+c[i]));
      svg.appendChild(el('text',{x:x+w/2-1,y:112,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},'['+(i-lb+1)+','+i+']'));
      x+=w;
    }
    // 原数组
    for(let i=1;i<=n;i++){
      svg.appendChild(el('rect',{x:20+(i-1)*44,y:170,width:40,height:24,rx:4,fill:pos===i?'rgba(250,204,21,0.15)':'var(--bg3)',stroke:pos===i?'var(--accent)':'var(--border)'}));
      svg.appendChild(el('text',{x:20+(i-1)*44+20,y:186,'text-anchor':'middle',fill:'var(--text2)','font-size':10,'font-family':'monospace'},a[i]));
      svg.appendChild(el('text',{x:20+(i-1)*44+20,y:165,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},i));
    }
    // lowbit 标注
    for(let i=1;i<=n;i++){
      svg.appendChild(el('text',{x:20+(i-1)*44+20,y:215,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},'lb='+(i&-i)));
    }
    // 路径说明
    svg.appendChild(el('text',{x:20,y:250,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'路径: '+path.join('→')));
    $('#bt-visited').textContent=visited.size;
    $('#bt-result').textContent=result!==null?result:'—';
  }
  $('#bt-query').onclick=()=>{
    visited=new Set();path=[];result=null;draw();
    setTimeout(()=>{
      let i=pos,sum=0;
      while(i>0){visited.add(i);path.push(i);sum+=c[i];i-=i&-i;draw();
        i=path[path.length-1]; // restore
      }
      // 重新执行
      visited=new Set();path=[];i=pos;
      const steps=[];
      while(i>0){steps.push(i);i-=i&-i;}
      let si=0;
      const iv=setInterval(()=>{
        if(si>=steps.length){clearInterval(iv);result=steps.reduce((s,x)=>s+c[x],0);draw();toast('prefix['+pos+']='+result);return;}
        visited.add(steps[si]);path.push(steps[si]);draw();si++;
      },300);
    },100);
  };
  $('#bt-update').onclick=()=>{
    visited=new Set();path=[];
    const steps=[];let i=pos;
    while(i<=n){steps.push(i);i+=i&-i;}
    let si=0;
    const iv=setInterval(()=>{
      if(si>=steps.length){clearInterval(iv);a[pos]+=5;draw();toast('a['+pos+']+=5, 更新 '+steps.length+' 个节点');return;}
      visited.add(steps[si]);path.push(steps[si]);c[steps[si]]+=5;draw();si++;
    },300);
  };
  draw();
})();

/* ============================================================ 模块3: 莫队算法 ============================================================ */
(()=>{
  const body=$('#body-mo');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">莫队算法 - 离线区间查询</div>
      <div class="desc">将查询按 (L 块号, R) 排序，双指针移动。复杂度 O(n√n)。点击"下一步"观察指针移动与答案更新。</div>
      <div class="controls">
        <button class="btn primary" id="mo-next">下一步</button>
        <button class="btn" id="mo-auto">自动</button>
        <button class="btn" id="mo-reset">重置</button>
      </div>
      <div class="svg-wrap"><svg id="mo-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">算法核心</div>
      <div class="desc">块大小 B=√n。查询按 (L/B, R) 排序(奇偶块 R 升降序优化)。双指针 L,R 移动总次数 O(n√n)。</div>
      <div class="code-block"><span class="cmt">// 排序：奇偶块优化</span>
<span class="kw">sort</span>(q, [&](a,b){
  <span class="kw">if</span>(a.L/B != b.L/B) <span class="kw">return</span> a.L&lt;b.L;
  <span class="kw">return</span> (a.L/B&amp;1)? a.R&lt;b.R : a.R&gt;b.R;
});</div>
      <div class="panel-title" style="margin-top:14px">查询列表</div>
      <div id="mo-queries"></div>
      <div class="stat-grid">
        <div class="stat"><div class="k">当前查询</div><div class="v acc" id="mo-cur">—</div></div>
        <div class="stat"><div class="k">答案</div><div class="v" id="mo-ans">—</div></div>
        <div class="stat"><div class="k">移动次数</div><div class="v" id="mo-moves">0</div></div>
      </div>
    </div>`;
  const svg=$('#mo-svg');
  const n=12,a=[3,1,4,1,5,9,2,6,5,3,5,8];
  const queries=[{L:2,R:6,id:0},{L:0,R:4,id:1},{L:5,R:10,id:2},{L:1,R:8,id:3}];
  const B=Math.sqrt(n);
  // 排序
  const sorted=[...queries].sort((x,y)=>{
    const bx=Math.floor(x.L/B),by=Math.floor(y.L/B);
    if(bx!==by)return bx-by;
    return bx&1?x.R-y.R:y.R-x.R;
  });
  let curL=0,curR=-1,curAns=0,moves=0,curIdx=0,auto=false,counts=new Array(10).fill(0);
  function add(x){counts[a[x]]++;if(counts[a[x]]===1)curAns++;}
  function del(x){if(counts[a[x]]===1)curAns--;counts[a[x]]--;}
  function draw(){
    svg.innerHTML='';
    // 数组
    for(let i=0;i<n;i++){
      const x=20+i*36;
      const inRange=i>=curL&&i<=curR;
      const isTarget=curIdx<sorted.length&&i>=sorted[curIdx].L&&i<=sorted[curIdx].R;
      svg.appendChild(el('rect',{x,y:40,width:32,height:30,rx:4,fill:inRange?(isTarget?'rgba(52,211,153,0.2)':'rgba(250,204,21,0.1)'):'var(--bg3)',stroke:inRange?'var(--accent)':'var(--border2)'}));
      svg.appendChild(el('text',{x:x+16,y:59,'text-anchor':'middle',fill:'var(--text2)','font-size':10,'font-family':'monospace'},a[i]));
      svg.appendChild(el('text',{x:x+16,y:85,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},i));
    }
    // 双指针
    if(curL<n)svg.appendChild(el('text',{x:20+curL*36+16,y:105,'text-anchor':'middle',fill:'var(--accent)','font-size':11,'font-family':'monospace'},'L'));
    if(curR>=0&&curR<n)svg.appendChild(el('text',{x:20+curR*36+16,y:105,'text-anchor':'middle',fill:'var(--green)','font-size':11,'font-family':'monospace'},'R'));
    // 目标区间框
    if(curIdx<sorted.length){
      const q=sorted[curIdx];
      svg.appendChild(el('rect',{x:20+q.L*36-2,y:36,width:(q.R-q.L+1)*36,height:38,fill:'none',stroke:'var(--green)','stroke-width':1.5,'stroke-dasharray':'4 3','rx':4}));
    }
    // 查询进度
    svg.appendChild(el('text',{x:20,y:140,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'执行顺序(已排序):'));
    sorted.forEach((q,i)=>{
      const x=20+i*110;const done=i<curIdx;const cur=i===curIdx;
      svg.appendChild(el('rect',{x,y:155,width:100,height:34,rx:5,fill:done?'rgba(52,211,153,0.1)':(cur?'rgba(250,204,21,0.15)':'var(--bg3)'),stroke:done?'var(--green)':(cur?'var(--accent)':'var(--border2)')})); 
      svg.appendChild(el('text',{x:x+50,y:170,'text-anchor':'middle',fill:done?'var(--green)':(cur?'var(--accent)':'var(--text2)'),'font-size':10,'font-family':'monospace'},'Q'+q.id+'['+q.L+','+q.R+']'));
      svg.appendChild(el('text',{x:x+50,y:184,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},done?'done':'#'+i));
    });
    $('#mo-cur').textContent=curIdx<sorted.length?('Q'+sorted[curIdx].id):'完成';
    $('#mo-ans').textContent=curAns;
    $('#mo-moves').textContent=moves;
  }
  function step(){
    if(curIdx>=sorted.length){auto=false;$('.btn#mo-auto').classList.remove('active');toast('全部完成');return;}
    const q=sorted[curIdx];
    // 移动 L,R 到目标
    if(curL>q.L){curL--;add(curL);moves++;draw();return true;}
    if(curR<q.R){curR++;add(curR);moves++;draw();return true;}
    if(curL<q.L){del(curL);curL++;moves++;draw();return true;}
    if(curR>q.R){del(curR);curR--;moves++;draw();return true;}
    // 到位
    toast('Q'+q.id+'['+q.L+','+q.R+'] 答案='+curAns+' (不同值个数)');
    curIdx++;
    return true;
  }
  draw();
  $('#mo-next').onclick=()=>step();
  $('#mo-auto').onclick=(e)=>{auto=!auto;e.target.classList.toggle('active',auto);function loop(){if(!auto)return;if(step())setTimeout(loop,250);}if(auto)loop();};
  $('#mo-reset').onclick=()=>{curL=0;curR=-1;curAns=0;moves=0;curIdx=0;auto=false;counts=new Array(10).fill(0);$('.btn#mo-auto').classList.remove('active');draw();};
})();

/* ============================================================ 模块4: 后缀自动机 ============================================================ */
(()=>{
  const body=$('#body-sam');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">后缀自动机 (SAM)</div>
      <div class="desc">SAM 是接受所有后缀的最小 DFA。状态数 ≤ 2n-1。每个状态代表一个 endpos 等价类。点击"添加字符"逐步构建。</div>
      <div class="controls">
        <button class="btn primary" id="sm-build">构建 SAM</button>
        <button class="btn" id="sm-step">逐步</button>
        <button class="btn" id="sm-reset">重置</button>
        <div class="slider-row">字符串 <input type="text" id="sm-str" value="aabab" maxlength="8" style="width:80px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:3px 6px;font-family:monospace"></div>
      </div>
      <div class="svg-wrap"><svg id="sm-svg" viewBox="0 0 460 320"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">SAM 性质</div>
      <table class="cmp">
        <tr><th>属性</th><th>值</th></tr>
        <tr><td>状态数</td><td>≤ 2n-1</td></tr>
        <tr><td>转移数</td><td>≤ 3n-4</td></tr>
        <tr><td>构建复杂度</td><td>O(n)</td></tr>
        <tr><td>应用</td><td>子串计数/不同子串</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">核心概念</div>
      <div class="desc"><strong>endpos</strong>：子串所有结束位置集合。endpos 相同的子串属于同一状态。<strong>link</strong>(后缀链接)：指向 endpos 集更大的最短前缀状态，构成 parent 树。</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">状态数</div><div class="v acc" id="sm-states">1</div></div>
        <div class="stat"><div class="k">转移数</div><div class="v" id="sm-trans">0</div></div>
        <div class="stat"><div class="k">不同子串</div><div class="v" id="sm-substr">0</div></div>
      </div>
    </div>`;
  const svg=$('#sm-svg');
  let str='aabab',builtLen=0,nodes=[],edges=[],last=0;
  // SAM 构建算法
  function buildSAM(s){
    nodes=[{id:0,len:0,link:-1,next:{},x:230,y:270}];
    edges=[];last=0;
    for(let i=0;i<s.length;i++){
      const c=s[i];
      const cur=nodes.length;
      nodes.push({id:cur,len:nodes[last].len+1,link:-1,next:{},char:c});
      let p=last;
      while(p!==-1&&!nodes[p].next[c]){nodes[p].next[c]=cur;p=nodes[p].link;}
      if(p===-1){nodes[cur].link=0;}
      else{
        const q=nodes[p].next[c];
        if(nodes[p].len+1===nodes[q].len){nodes[cur].link=q;}
        else{
          const clone=nodes.length;
          nodes.push({id:clone,len:nodes[p].len+1,link:nodes[q].link,next:{...nodes[q].next},clone:true});
          while(p!==-1&&nodes[p].next[c]===q){nodes[p].next[c]=clone;p=nodes[p].link;}
          nodes[q].link=clone;nodes[cur].link=clone;
        }
      }
      last=cur;
    }
    // 布局
    layout();
  }
  function layout(){
    // 按层级布局
    const levels={};
    nodes.forEach(nd=>{const l=nd.len;levels[l]=levels[l]||[];levels[l].push(nd);});
    const maxLen=Math.max(...nodes.map(n=>n.len));
    Object.keys(levels).forEach(l=>{
      const arr=levels[l];const y=270-(+l/maxLen)*230;
      arr.forEach((nd,i)=>{nd.x=230+(i-(arr.length-1)/2)*90;nd.y=y;});
    });
    nodes[0].x=230;nodes[0].y=270;
  }
  function draw(){
    svg.innerHTML='';
    svg.appendChild(el('defs')).innerHTML=`<marker id="sma" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--accent)"/></marker><marker id="smal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--text3)"/></marker>`;
    // 转移边
    nodes.forEach(nd=>{
      Object.entries(nd.next).forEach(([c,to])=>{
        const t=nodes[to];
        if(!nd.x||!t.x)return;
        const isLast=to===last;
        svg.appendChild(el('line',{x1:nd.x,y1:nd.y-12,x2:t.x,y2:t.y+12,stroke:isLast?'var(--accent)':'var(--border2)','stroke-width':isLast?1.8:1.2,'marker-end':'url(#sma)'}));
        const mx=(nd.x+t.x)/2,my=(nd.y+t.y)/2;
        svg.appendChild(el('rect',{x:mx-7,y:my-8,width:14,height:14,rx:3,fill:'var(--bg)'}));
        svg.appendChild(el('text',{x:mx,y:my+3,'text-anchor':'middle',fill:'var(--accent)','font-size':10,'font-family':'monospace'},c));
      });
    });
    // link 边
    nodes.forEach(nd=>{
      if(nd.link>=0&&nd.link!==-1){
        const t=nodes[nd.link];
        if(nd.x&&t.x)svg.appendChild(el('line',{x1:nd.x+14,y1:nd.y,x2:t.x+14,y2:t.y,stroke:'var(--text3)','stroke-width':0.8,'stroke-dasharray':'3 2','marker-end':'url(#smal)',opacity:0.5}));
      }
    });
    // 节点
    nodes.forEach(nd=>{
      if(nd.x===undefined)return;
      const isLast=nd.id===last;
      const isClone=nd.clone;
      svg.appendChild(el('circle',{cx:nd.x,cy:nd.y,r:13,fill:isLast?'var(--accent)':(isClone?'var(--bg3)':'var(--bg3)'),stroke:isLast?'var(--accent)':(isClone?'var(--amber)':'var(--border2)'),'stroke-width':isLast?2:1.3}));
      svg.appendChild(el('text',{x:nd.x,y:nd.y+3,'text-anchor':'middle',fill:isLast?'#08090a':'var(--text2)','font-size':9,'font-family':'monospace'},nd.id));
    });
    $('#sm-states').textContent=nodes.length;
    let transCount=0,substrCount=0;
    nodes.forEach(nd=>{transCount+=Object.keys(nd.next).length;if(nd.link>=0)substrCount+=nd.len-nodes[nd.link].len;});
    $('#sm-trans').textContent=transCount;
    $('#sm-substr').textContent=substrCount;
  }
  buildSAM(str.substring(0,0));
  draw();
  $('#sm-build').onclick=()=>{str=$('#sm-str').value||'aabab';buildSAM(str);builtLen=str.length;draw();toast('已构建 "'+str+'" 的 SAM');};
  $('#sm-step').onclick=()=>{
    str=$('#sm-str').value||'aabab';
    if(builtLen>=str.length){toast('已构建完成');return;}
    builtLen++;
    buildSAM(str.substring(0,builtLen));
    draw();toast('添加字符 "'+str[builtLen-1]+'", 状态数='+nodes.length);
  };
  $('#sm-reset').onclick=()=>{builtLen=0;buildSAM('');draw();};
})();

/* ============================================================ 模块5: LCT ============================================================ */
(()=>{
  const body=$('#body-lct');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">Link-Cut Tree 动态树</div>
      <div class="desc">LCT 用 Splay 森林维护动态树。支持 link/cut/access O(log n)。access(x) 使根到 x 路径变为重链(Splay)。点击操作观察虚实边切换。</div>

      <table class="cmp">
        <tr><th>操作</th><th>复杂度</th><th>说明</th></tr>
        <tr><td>access(x)</td><td>O(log n)</td><td>根到x变重链</td></tr>
        <tr><td>link(x,y)</td><td>O(log n)</td><td>连边</td></tr>
        <tr><td>cut(x,y)</td><td>O(log n)</td><td>断边</td></tr>
        <tr><td>findroot(x)</td><td>O(log n)</td><td>找所在树根</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">虚实边</div>
      <div class="desc"><strong>实边</strong>(preferred edge)：Splay 树内父子边。<strong>虚边</strong>：Splay 树根指向原树父亲(单向)。access 不断切换虚→实。</div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>实边(Splay内)</span>
        <span><i style="background:var(--text3)"></i>虚边(虚线)</span>
        <span><i style="background:var(--green)"></i>当前 access 路径</span>
      </div>
    </div>`;
  const svg=$('#lc-svg');
  // 简化的树结构: parent[i], 实/虚边
  let parent={1:null,2:1,3:2,4:3,5:2,6:1};
  let preferred={}; // preferred child
  let node=4;
  $('#lc-node').oninput=e=>{node=+e.target.value;$('#lc-node-v').textContent=node;draw();};
  const positions={1:{x:230,y:50},2:{x:150,y:120},3:{x:90,y:190},4:{x:60,y:250},5:{x:210,y:190},6:{x:310,y:120}};
  function draw(accessPath){
    svg.innerHTML='';
    // 边
    Object.entries(parent).forEach(([c,p])=>{
      if(p===null)return;
      const cp=positions[c],pp=positions[p];
      const isPreferred=preferred[p]===+c;
      const onPath=accessPath&&accessPath.includes(+c)&&accessPath.includes(+p);
      let stroke='var(--text3)',dash='4 3',w=1;
      if(isPreferred){stroke='var(--accent)';dash='none';w=1.8;}
      if(onPath){stroke='var(--green)';w=2.2;dash='none';}
      svg.appendChild(el('line',{x1:pp.x,y1:pp.y,x2:cp.x,y2:cp.y,stroke,'stroke-width':w,'stroke-dasharray':dash}));
    });
    // 节点
    Object.entries(positions).forEach(([id,pos])=>{
      const isCur=+id===node;
      const onPath=accessPath&&accessPath.includes(+id);
      svg.appendChild(el('circle',{cx:pos.x,cy:pos.y,r:16,fill:onPath?'var(--green)':(isCur?'var(--accent)':'var(--bg3)'),stroke:onPath?'var(--green)':(isCur?'var(--accent)':'var(--border2)'),'stroke-width':2}));
      svg.appendChild(el('text',{x:pos.x,y:pos.y+4,'text-anchor':'middle',fill:onPath||isCur?'#08090a':'var(--text2)','font-size':10,'font-family':'monospace'},id));
    });
    // Splay 森林说明
    svg.appendChild(el('text',{x:230,y:25,'text-anchor':'middle',fill:'var(--text3)','font-size':10,'font-family':'monospace'},'原树结构 (虚实边混合)'));
  }
  function getPathToRoot(x){
    const path=[];let cur=x;
    while(cur!==null){path.push(cur);cur=parent[cur];}
    return path;
  }
  $('#lc-access').onclick=()=>{
    const path=getPathToRoot(node);
    // access: 设置路径上每个节点的 preferred child 为路径下一节点
    for(let i=0;i<path.length-1;i++){
      preferred[path[i+1]]=path[i]; // parent->child
    }
    // 实际是 parent 的 preferred = child，重新映射
    preferred={};
    for(let i=path.length-1;i>0;i--){
      preferred[path[i]]=path[i-1];
    }
    draw(path);toast('access('+node+'): 根到 '+node+' 路径变实链');
  };
  $('#lc-link').onclick=()=>{
    // link node 到随机其他树节点(简化)
    const others=Object.keys(positions).map(Number).filter(x=>x!==node&&parent[x]===null);
    if(others.length===0){toast('无可 link 的根节点');return;}
    // 简化：连到节点1(若不是自己)
    if(node!==1&&parent[node]===null){parent[node]=1;draw();toast('link('+node+',1)');}
    else toast('需 link 两棵不同树');
  };
  $('#lc-cut').onclick=()=>{
    if(parent[node]===null){toast(node+' 已是根');return;}
    const p=parent[node];
    delete preferred[p];
    parent[node]=null;draw();toast('cut('+node+','+p+')');
  };
  $('#lc-reset').onclick=()=>{parent={1:null,2:1,3:2,4:3,5:2,6:1};preferred={};draw();};
  draw();
})();

/* ============================================================ 模块6: Slope Trick ============================================================ */
(()=>{
  const body=$('#body-slope');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">Slope Trick 凸函数优化</div>
      <div class="desc">维护凸分段函数 f(x)。转移 f'(x)=min(f(x),g(x)) 用两个堆维护斜率变化点。点击"插入点"观察凸函数演化。</div>
      <div class="controls">
        <button class="btn primary" id="sl-insert">插入数据点</button>
        <button class="btn" id="sl-reset">重置</button>

    </div>
    <div class="panel">
      <div class="panel-title">核心思想</div>
      <div class="desc">凸函数 f(x) 由"斜率变化点"唯一确定。维护左侧(斜率&lt;0)大根堆 L 和右侧(斜率&gt;0)小根堆 R。中位数即最小值点。</div>
      <div class="code-block"><span class="cmt">// f(x) = sum |x - a_i| 的最小化</span>
<span class="cmt">// 转移: f_i(x) = |x-a_i| + min(f_{i-1})</span>
L.push(a_i); L.push(a_i);
R.push(L.top()); L.pop();
<span class="cmt">// 最小值 = L.top()</span></div>
      <div class="panel-title" style="margin-top:14px">应用场景</div>
      <table class="cmp">
        <tr><th>问题</th><th>转化</th></tr>
        <tr><td>APIO Command</td><td>|x-a_i| 求和</td></tr>
        <tr><td>网络流费用</td><td>凸费用函数</td></tr>
        <tr><td>seq 序列划分</td><td>斜率优化 DP</td></tr>
      </table>
      <div class="stat-grid">
        <div class="stat"><div class="k">点数</div><div class="v acc" id="sl-count">0</div></div>
        <div class="stat"><div class="k">最优 x</div><div class="v" id="sl-opt">—</div></div>
        <div class="stat"><div class="k">最小值</div><div class="v" id="sl-min">—</div></div>
      </div>
    </div>`;
  const svg=$('#sl-svg');
  let points=[],newX=50;
  $('#sl-x').oninput=e=>{newX=+e.target.value;$('#sl-x-v').textContent=newX;};
  function f(x){return points.reduce((s,p)=>s+Math.abs(x-p),0);}
  function draw(){
    svg.innerHTML='';
    if(points.length===0){
      svg.appendChild(el('text',{x:230,y:140,'text-anchor':'middle',fill:'var(--text3)','font-size':12,'font-family':'monospace'},'插入数据点开始'));
      $('#sl-count').textContent=0;$('#sl-opt').textContent='—';$('#sl-min').textContent='—';
      return;
    }
    // 坐标系
    const x0=40,x1=420,y0=240,y1=40;
    svg.appendChild(el('line',{x1:x0,y1:y0,x2:x1,y2:y0,stroke:'var(--border2)','stroke-width':1}));
    svg.appendChild(el('line',{x1:x0,y1:y0,x2:x0,y2:y1,stroke:'var(--border2)','stroke-width':1}));
    // 函数曲线
    const xs=[];for(let i=0;i<=100;i+=2)xs.push(i);
    const ys=xs.map(f);
    const maxY=Math.max(...ys),minY=Math.min(...ys);
    let pathD='';
    xs.forEach((x,i)=>{
      const px=x0+(x/100)*(x1-x0);
      const py=y0-((ys[i]-minY)/(maxY-minY||1))*(y0-y1);
      pathD+=(i===0?'M':'L')+px+','+py+' ';
    });
    svg.appendChild(el('path',{d:pathD,fill:'none',stroke:'var(--accent)','stroke-width':2}));
    // 填充
    const fillD=pathD+`L${x1},${y0} L${x0},${y0} Z`;
    svg.appendChild(el('path',{d:fillD,fill:'rgba(250,204,21,0.08)'}));
    // 数据点
    points.forEach(p=>{
      const px=x0+(p/100)*(x1-x0);
      svg.appendChild(el('line',{x1:px,y1:y0,x2:px,y2:y0-((f(p)-minY)/(maxY-minY||1))*(y0-y1),stroke:'var(--text3)','stroke-width':0.5,'stroke-dasharray':'2 2'}));

      svg.appendChild(el('text',{x:px,y:y0+14,'text-anchor':'middle',fill:'var(--green)','font-size':9,'font-family':'monospace'},p));
    });
    // 最小值点(中位数)
    const sorted=[...points].sort((a,b)=>a-b);
    const median=sorted.length%2?sorted[Math.floor(sorted.length/2)]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
    const optX=x0+(median/100)*(x1-x0);
    const optY=y0-((f(median)-minY)/(maxY-minY||1))*(y0-y1);
    svg.appendChild(el('circle',{cx:optX,cy:optY,r:6,fill:'var(--accent)',stroke:'#08090a','stroke-width':2}));
    svg.appendChild(el('text',{x:optX,y:optY-12,'text-anchor':'middle',fill:'var(--accent)','font-size':10,'font-family':'monospace'},'min'));
    $('#sl-count').textContent=points.length;
    $('#sl-opt').textContent=median;
    $('#sl-min').textContent=f(median).toFixed(0);
  }
  $('#sl-insert').onclick=()=>{points.push(newX);draw();toast('插入点 x='+newX+', f 为凸函数')};
  $('#sl-reset').onclick=()=>{points=[];draw();};
  draw();
})();

/* ============================================================ 模块7: 模拟退火 ============================================================ */
(()=>{
  const body=$('#body-sa');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">模拟退火 Simulated Annealing</div>
      <div class="desc">以概率 P=exp(-ΔE/T) 接受劣解，避免陷入局部最优。温度 T 随时间衰减。点击"退火"求 Rosenbrock 函数最小值。</div>
      <div class="controls">
        <button class="btn primary" id="sa-run">开始退火</button>
        <button class="btn" id="sa-stop">停止</button>
        <button class="btn" id="sa-reset">重置</button>
        <div class="slider-row">初温 <input type="range" id="sa-t0" min="10" max="200" value="100"><span class="val" id="sa-t0-v">100</span></div>
        <div class="slider-row">冷却率 <input type="range" id="sa-cool" min="80" max="99" value="95"><span class="val" id="sa-cool-v">0.95</span></div>
      </div>
      <div class="svg-wrap"><svg id="sa-svg" viewBox="0 0 460 280"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-title">退火参数</div>
      <div class="desc">目标函数: Rosenbrock f(x,y)=(1-x)²+100(y-x²)²<br>全局最小 (1,1)=0。山谷狭长，易陷入局部最优。</div>
      <div class="code-block"><span class="kw">while</span>(T &gt; T_min){
  x' = x + rand() * 2 * step - step;
  dE = f(x') - f(x);
  <span class="kw">if</span>(dE &lt; 0 || rand() &lt; exp(-dE/T))
    x = x';
  T *= alpha;  <span class="cmt">// 冷却</span>
}</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">温度 T</div><div class="v acc" id="sa-t">—</div></div>
        <div class="stat"><div class="k">当前值</div><div class="v" id="sa-cur">—</div></div>
        <div class="stat"><div class="k">最优值</div><div class="v" id="sa-best" style="color:var(--green)">—</div></div>
        <div class="stat"><div class="k">迭代数</div><div class="v" id="sa-iter">0</div></div>
      </div>
    </div>`;
  const svg=$('#sa-svg');
  let T0=100,cool=0.95,running=false;
  let x=0,y=0,T=100,best=Infinity,bestX=0,bestY=0,iter=0,path=[];
  $('#sa-t0').oninput=e=>{T0=+e.target.value;$('#sa-t0-v').textContent=T0;};
  $('#sa-cool').oninput=e=>{cool=+e.target.value/100;$('#sa-cool-v').textContent=cool.toFixed(2);};
  function f(x,y){return (1-x)*(1-x)+100*(y-x*x)*(y-x*x);}
  function draw(){
    svg.innerHTML='';
    // 等高线背景(简化网格)
    const W=420,H=240,x0=20,y0=20;
    for(let i=0;i<W;i+=4){
      for(let j=0;j<H;j+=4){
        const nx=-2+i/W*4,ny=-1+j/H*3;
        const v=f(nx,ny);
        const intensity=Math.min(1,Math.log(v+1)/5);
        svg.appendChild(el('rect',{x:x0+i,y:y0+j,width:4,height:4,fill:`rgba(250,204,21,${intensity*0.3})`}));
      }
    }
    // 目标点
    const tx=x0+((1+2)/4)*W,ty=y0+((1+1)/3)*H;
    svg.appendChild(el('circle',{cx:tx,cy:ty,r:5,fill:'var(--green)'}));
    svg.appendChild(el('text',{x:tx,y:ty-10,'text-anchor':'middle',fill:'var(--green)','font-size':9,'font-family':'monospace'},'(1,1)=0'));
    // 路径
    if(path.length>1){
      let pd='';
      path.forEach((p,i)=>{
        const px=x0+((p.x+2)/4)*W,py=y0+((p.y+1)/3)*H;
        pd+=(i===0?'M':'L')+px+','+py+' ';
      });
      svg.appendChild(el('path',{d:pd,fill:'none',stroke:'var(--accent)','stroke-width':1.5,opacity:0.6}));
    }
    // 当前点
    const cx=x0+((x+2)/4)*W,cy=y0+((y+1)/3)*H;
    svg.appendChild(el('circle',{cx,cy,r:6,fill:'var(--accent)',stroke:'#08090a','stroke-width':2}));
    // 最优点
    const bx=x0+((bestX+2)/4)*W,by=y0+((bestY+1)/3)*H;
    svg.appendChild(el('circle',{cx:bx,cy:by,r:4,fill:'none',stroke:'var(--green)','stroke-width':1.5}));
    $('#sa-t').textContent=T.toFixed(2);
    $('#sa-cur').textContent=f(x,y).toFixed(3);
    $('#sa-best').textContent=best===Infinity?'—':best.toFixed(3);
    $('#sa-iter').textContent=iter;
  }
  function step(){
    if(!running)return;
    for(let k=0;k<5;k++){
      const nx=x+rnd(-1,1)*T*0.05,ny=y+rnd(-1,1)*T*0.05;
      const dE=f(nx,ny)-f(x,y);
      if(dE<0||Math.random()<Math.exp(-dE/T)){
        x=nx;y=ny;
        if(f(x,y)<best){best=f(x,y);bestX=x;bestY=y;}
      }
      T*=cool;iter++;
    }
    if(iter%10===0)path.push({x,y});
    if(path.length>50)path.shift();
    draw();
    if(T>0.01&&running)setTimeout(step,30);
    else{running=false;toast('退火完成, 最优='+best.toFixed(4));$('.btn#sa-run').classList.remove('active');}
  }
  $('#sa-run').onclick=(e)=>{if(!running){running=true;e.target.classList.add('active');step();}};
  $('#sa-stop').onclick=()=>{running=false;$('.btn#sa-run').classList.remove('active');};
  $('#sa-reset').onclick=()=>{running=false;x=rnd(-1.5,1.5);y=rnd(-0.5,1.5);T=T0;best=Infinity;iter=0;path=[];$('.btn#sa-run').classList.remove('active');draw();};
  // init
  x=rnd(-1.5,1.5);y=rnd(-0.5,1.5);T=T0;path=[];
  draw();
})();

/* ============================================================ 模块8: 字符串哈希 ============================================================ */
(()=>{
  const body=$('#body-hash');
  body.innerHTML=`
    <div class="panel">
      <div class="panel-title">字符串哈希 / KMP / Z 算法</div>
      <div class="desc">对比三种匹配算法。双哈希降低冲突。KMP 用 next 数组 O(n+m)。Z 函数 z[i]=S 与 S[i:] LCP。输入模式串匹配。</div>
      <div class="controls">
        <button class="btn active" data-algo="hash">双哈希</button>
        <button class="btn" data-algo="kmp">KMP</button>
        <button class="btn" data-algo="z">Z 函数</button>
        <button class="btn primary" id="sh-match">匹配</button>
        <div class="slider-row">模式 <input type="text" id="sh-pat" value="ab" maxlength="6" style="width:70px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:3px 6px;font-family:monospace"></div>
      </div>

    </div>
    <div class="panel">
      <div class="panel-title">算法对比</div>
      <table class="cmp">
        <tr><th>算法</th><th>预处理</th><th>匹配</th><th>特点</th></tr>
        <tr><td>双哈希</td><td>O(n)</td><td>O(n)</td><td>冲突极低</td></tr>
        <tr><td>KMP</td><td>O(m)</td><td>O(n)</td><td>精确, next数组</td></tr>
        <tr><td>Z</td><td>O(n)</td><td>O(n)</td><td>LCP, 多用</td></tr>
      </table>
      <div class="panel-title" style="margin-top:14px">双哈希原理</div>
      <div class="desc">h = (h*p + c) mod M1, mod M2。两套 base/mod。子串哈希 O(1)：h[l..r] = (h[r] - h[l-1]*p^(r-l+1)) mod M。</div>
      <div class="stat-grid">
        <div class="stat"><div class="k">匹配数</div><div class="v acc" id="sh-count">0</div></div>
        <div class="stat"><div class="k">比较次数</div><div class="v" id="sh-cmps">0</div></div>
        <div class="stat"><div class="k">算法</div><div class="v" id="sh-algo">hash</div></div>
      </div>
    </div>`;
  const svg=$('#sh-svg');
  const text='ababcabababcab';
  let algo='hash',matches=[],cmps=0;
  $$('#body-hash [data-algo]').forEach(b=>b.onclick(()=>{
    $$('#body-hash [data-algo]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');algo=b.dataset.algo;$('#sh-algo').textContent=algo;run();
  }));
  function draw(highlightIdx){
    svg.innerHTML='';
    // text
    for(let i=0;i<text.length;i++){
      const x=20+i*30;
      const isMatch=matches.includes(i);
      const isCmp=highlightIdx!==undefined&&i>=highlightIdx&&i<highlightIdx+pat.length;
      svg.appendChild(el('rect',{x:x-1,y:60,width:28,height:28,rx:4,fill:isMatch?'rgba(52,211,153,0.2)':(isCmp?'rgba(250,204,21,0.15)':'var(--bg3)'),stroke:isMatch?'var(--green)':(isCmp?'var(--accent)':'var(--border2)')})); 
      svg.appendChild(el('text',{x:x+13,y:78,'text-anchor':'middle',fill:'var(--text2)','font-size':12,'font-family':'monospace'},text[i]));
      svg.appendChild(el('text',{x:x+13,y:100,'text-anchor':'middle',fill:'var(--text3)','font-size':8,'font-family':'monospace'},i));
    }
    // pattern
    for(let i=0;i<pat.length;i++){
      const x=20+i*30;
      svg.appendChild(el('rect',{x:x-1,y:120,width:28,height:24,rx:4,fill:'var(--bg3)',stroke:'var(--accent)'}));
      svg.appendChild(el('text',{x:x+13,y:136,'text-anchor':'middle',fill:'var(--accent)','font-size':12,'font-family':'monospace'},pat[i]));
    }
    svg.appendChild(el('text',{x:20,y:155,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'模式串 pat'));
    // 算法特定可视化
    if(algo==='kmp'){
      // next 数组
      const next=computeNext(pat);
      svg.appendChild(el('text',{x:20,y:185,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'next[]:'));
      for(let i=0;i<pat.length;i++){
        svg.appendChild(el('rect',{x:20+i*30,y:195,width:28,height:20,rx:3,fill:'var(--bg3)',stroke:'var(--border)'}));
        svg.appendChild(el('text',{x:20+i*30+14,y:209,'text-anchor':'middle',fill:'var(--accent)','font-size':10,'font-family':'monospace'},next[i]));
      }
    }else if(algo==='z'){
      // Z 数组(对 text)
      const z=computeZ(text);
      svg.appendChild(el('text',{x:20,y:185,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'Z(text):'));
      for(let i=0;i<text.length;i++){
        svg.appendChild(el('rect',{x:20+i*30,y:195,width:28,height:20,rx:3,fill:'var(--bg3)',stroke:'var(--border)'}));
        svg.appendChild(el('text',{x:20+i*30+14,y:209,'text-anchor':'middle',fill:z[i]>=pat.length?'var(--green)':'var(--text2)','font-size':9,'font-family':'monospace'},z[i]));
      }
      svg.appendChild(el('text',{x:20,y:235,fill:'var(--text3)','font-size':9,'font-family':'monospace'},'绿色=Z值≥|pat| 即匹配位置'));
    }else{
      // 哈希值
      svg.appendChild(el('text',{x:20,y:185,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'hash mod M1:'));
      const p1=131,m1=1e9+7;let h1=0;
      for(let i=0;i<text.length;i++){
        h1=(h1*p1+text.charCodeAt(i))%m1;
        svg.appendChild(el('text',{x:20+i*30,y:205,'text-anchor':'middle',fill:'var(--text2)','font-size':7,'font-family':'monospace'},(h1%1000)));
      }
      svg.appendChild(el('text',{x:20,y:235,fill:'var(--text3)','font-size':10,'font-family':'monospace'},'(显示 mod 1000, 双哈希另用 M2)'));
    }
    $('#sh-count').textContent=matches.length;
    $('#sh-cmps').textContent=cmps;
  }
  let pat='ab';
  function computeNext(s){
    const n=s.length,next=new Array(n).fill(0);let k=0;
    for(let i=1;i<n;i++){
      while(k>0&&s[i]!==s[k])k=next[k-1];
      if(s[i]===s[k])k++;
      next[i]=k;
    }
    return next;
  }
  function computeZ(s){
    const n=s.length,z=new Array(n).fill(0);let l=0,r=0;
    for(let i=1;i<n;i++){
      if(i<r)z[i]=Math.min(r-i,z[i-l]);
      while(i+z[i]<n&&s[z[i]]===s[i+z[i]])z[i]++;
      if(i+z[i]>r){l=i;r=i+z[i];}
    }
    return z;
  }
  function run(){
    pat=$('#sh-pat').value||'ab';
    matches=[];cmps=0;
    if(algo==='hash'){
      const p1=131,m1=1e9+7,p2=137,m2=998244353;
      let ph1=0,ph2=0;
      for(const c of pat){ph1=(ph1*p1+c.charCodeAt(0))%m1;ph2=(ph2*p2+c.charCodeAt(0))%m2;}
      let h1=0,h2=0,pw1=1,pw2=1;
      for(let i=0;i<pat.length-1;i++){pw1=pw1*p1%m1;pw2=pw2*p2%m2;}
      const pre1=[],pre2=[];
      let acc1=0,acc2=0;
      for(let i=0;i<text.length;i++){acc1=(acc1*p1+text.charCodeAt(i))%m1;acc2=(acc2*p2+text.charCodeAt(i))%m2;pre1.push(acc1);pre2.push(acc2);}
      for(let i=0;i+pat.length<=text.length;i++){
        cmps++;
        const r=i+pat.length-1;
        let sub1=pre1[r],sub2=pre2[r];
        if(i>0){sub1=((sub1-pre1[i-1]*pw1)%m1+m1)%m1;sub2=((sub2-pre2[i-1]*pw2)%m2+m2)%m2;}
        if(sub1===ph1&&sub2===ph2)matches.push(i);
      }
    }else if(algo==='kmp'){
      const next=computeNext(pat);
      let j=0;
      for(let i=0;i<text.length;i++){
        cmps++;
        while(j>0&&text[i]!==pat[j]){j=next[j-1];cmps++;}
        if(text[i]===pat[j])j++;
        if(j===pat.length){matches.push(i-pat.length+1);j=next[j-1];}
      }
    }else{
      const z=computeZ(text);
      for(let i=1;i<text.length;i++){
        cmps++;
        if(z[i]>=pat.length)matches.push(i);
      }
    }
    draw();
    toast(algo+': 找到 '+matches.length+' 处匹配, 比较 '+cmps+' 次');
  }
  $('#sh-match').onclick=run;
  $('#sh-pat').oninput=()=>run();
  run();
})();

/* ============================================================ 底部导航 ============================================================ */
const sections=$$('.module');
function updateBottomNav(){
  const scrollY=window.scrollY+120;let cur=0;
  sections.forEach((s,i)=>{if(s.offsetTop<=scrollY)cur=i;});
  $('#bnPrevName').textContent=cur>0?MODULES[cur-1].name:'—';
  $('#bnNextName').textContent=cur<MODULES.length-1?MODULES[cur+1].name:'—';
  $('#bnPrev').setAttribute('disabled',cur===0);
  $('#bnNext').setAttribute('disabled',cur===MODULES.length-1);
  $('#bnPrev').onclick=()=>cur>0&&sections[cur-1].scrollIntoView({behavior:'smooth'});
  $('#bnNext').onclick=()=>cur<MODULES.length-1&&sections[cur+1].scrollIntoView({behavior:'smooth'});
  $$('.nav-pill').forEach((p,i)=>p.classList.toggle('active',i===cur));
}
window.addEventListener('scroll',updateBottomNav,{passive:true});
updateBottomNav();
window.addEventListener('beforeunload',function(){for(var i=1;i<100000;i++){try{clearInterval(i)}catch(e){}}});</script>
