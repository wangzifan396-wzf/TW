<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TW Mindmap — 可缩放概念思维导图</title>
<style>
  :root{
    --bg:#08090a;
    --bg2:#0f1115;
    --bg3:#16181d;
    --border:#1e2026;
    --border2:#2a2d35;
    --text:#e4e4e7;
    --text2:#a1a1aa;
    --text3:#71717a;
    --accent:#7c5cff;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  body{overflow-x:hidden;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;
    background:rgba(8,9,10,0.8);
    
    border-bottom:1px solid var(--border);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-0.01em;}
  .logo-mark{
    width:26px;height:26px;border-radius:7px;
    background:linear-gradient(135deg,var(--accent),#4c3aff);
    display:grid;place-items:center;
    box-shadow:0 0 0 1px rgba(124,92,255,0.4),0 4px 14px rgba(124,92,255,0.35);
  }
  .logo-mark svg{width:15px;height:15px;}
  .logo span{font-size:15px;}
  .logo b{color:var(--text);}
  .logo i{color:var(--text3);font-style:normal;font-weight:400;}
  nav{display:flex;gap:22px;align-items:center;font-size:13px;color:var(--text2);}
  nav a{transition:color .15s;}
  nav a:hover{color:var(--text);}
  nav .nav-cta{
    padding:6px 12px;border:1px solid var(--border2);border-radius:7px;
    color:var(--text);font-size:12.5px;
  }
  nav .nav-cta:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- Hero ---------- */
  .hero{
    max-width:1180px;margin:0 auto;padding:64px 28px 28px;text-align:center;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:11.5px;color:var(--text3);
    border:1px solid var(--border);border-radius:999px;padding:5px 12px;
    background:var(--bg2);
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .hero h1{
    font-size:clamp(34px,5vw,56px);font-weight:600;letter-spacing:-0.03em;
    margin:22px 0 14px;line-height:1.05;
    background:linear-gradient(180deg,#fff 30%,#9b9ba4);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero p{color:var(--text2);font-size:16px;max-width:620px;margin:0 auto 26px;}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .stat{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:12px 20px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);min-width:120px;
  }
  .stat b{font-family:var(--mono);font-size:20px;color:var(--text);}
  .stat span{font-size:11.5px;color:var(--text3);letter-spacing:0.02em;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1400px;margin:18px auto 0;padding:0 28px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
  }
  .pill-group{
    display:flex;flex-wrap:wrap;gap:6px;padding:6px;
    border:1px solid var(--border);border-radius:12px;background:var(--bg2);
  }
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--text2);
    cursor:pointer;border:1px solid transparent;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;white-space:nowrap;
  }
  .pill:hover{color:var(--text);background:var(--bg3);}
  .pill .pdot{width:8px;height:8px;border-radius:50%;background:var(--c,#7c5cff);}
  .pill.active{color:var(--text);background:var(--bg3);border-color:var(--c);}
  .search-box{
    position:relative;display:flex;align-items:center;
    background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    padding:0 12px;min-width:230px;flex:1;max-width:300px;
  }
  .search-box:focus-within{border-color:var(--accent);}
  .search-box svg{width:14px;height:14px;color:var(--text3);flex-shrink:0;}
  .search-box input{
    background:none;border:none;outline:none;color:var(--text);
    padding:9px 8px;font-size:13px;width:100%;font-family:inherit;
  }
  .search-box input::placeholder{color:var(--text3);}
  .btn-group{display:flex;gap:6px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 13px;border-radius:9px;font-size:12.5px;color:var(--text2);
    background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
    font-family:inherit;
  }
  .btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3);}
  .btn svg{width:13px;height:13px;}

  /* ---------- Canvas ---------- */
  .canvas-wrap{
    position:relative;
    max-width:1400px;margin:16px auto 0;
    height:72vh;min-height:480px;
    margin-left:auto;margin-right:auto;
    border:1px solid var(--border);border-radius:16px;overflow:hidden;
    background:
      radial-gradient(900px 500px at 50% 40%,rgba(124,92,255,0.06),transparent 60%),
      var(--bg2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .grid-bg{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 100%);
  }
  #mindmap{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
  #mindmap:active{cursor:grabbing;}

  .hint{
    position:absolute;left:14px;bottom:12px;z-index:5;
    font-family:var(--mono);font-size:10.5px;color:var(--text3);
    background:rgba(8,9,10,0.6);border:1px solid var(--border);
    padding:5px 9px;border-radius:7px;
    pointer-events:none;
  }
  .hint b{color:var(--text2);font-weight:500;}

  .zoom-controls{
    position:absolute;right:14px;bottom:14px;z-index:6;
    display:flex;flex-direction:column;gap:4px;
    background:rgba(15,17,21,0.85);border:1px solid var(--border);border-radius:10px;padding:4px;
    
  }
  .zbtn{
    width:30px;height:30px;display:grid;place-items:center;
    background:none;border:none;color:var(--text2);cursor:pointer;border-radius:6px;
    font-size:15px;font-family:var(--mono);transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
  }
  .zbtn:hover{background:var(--bg3);color:var(--text);}
  .zbtn.small{font-size:10px;}
  .zlabel{
    font-family:var(--mono);font-size:10px;color:var(--text3);text-align:center;padding:2px 0;
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:1px 0;
  }

  /* tooltip */
  .tooltip{
    position:absolute;z-index:30;display:none;pointer-events:none;
    max-width:260px;padding:9px 11px;border-radius:9px;
    background:rgba(15,17,21,0.96);border:1px solid var(--border2);
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .tt-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
  .tt-desc{font-size:11.5px;color:var(--text2);line-height:1.45;}

  /* details panel */
  .details{
    position:absolute;top:0;right:0;bottom:0;z-index:20;
    width:340px;max-width:88vw;
    background:rgba(12,13,17,0.97);border-left:1px solid var(--border);
    
    transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);
    padding:22px;overflow-y:auto;
    display:flex;flex-direction:column;gap:14px;
  }
  .details.open{transform:translateX(0);}
  .details .close{
    position:absolute;top:14px;right:14px;
    width:28px;height:28px;border-radius:7px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text2);cursor:pointer;font-size:14px;
  }
  .details .close:hover{color:var(--text);border-color:var(--border2);}
  .d-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11px;color:var(--text3);padding-right:34px;}
  .crumb{color:var(--text2);}
  .crumb::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle;}
  .crumb-sep{color:var(--text3);opacity:.6;}
  .d-name{font-size:22px;font-weight:600;letter-spacing:-0.01em;line-height:1.2;border-left:3px solid var(--c);padding-left:10px;}
  .d-type{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-family:var(--mono);font-size:10.5px;color:var(--text3);border:1px solid var(--border);padding:3px 8px;border-radius:6px;background:var(--bg2);}
  .d-desc{font-size:13.5px;color:var(--text2);line-height:1.6;}
  .d-meta{font-size:12px;color:var(--text3);font-family:var(--mono);}
  .d-children{display:flex;flex-direction:column;gap:5px;margin-top:2px;}
  .d-children .ch-label{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}
  .d-child{
    font-size:12.5px;color:var(--text2);padding:6px 9px;border-radius:7px;
    border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;
    display:flex;align-items:center;gap:8px;
  }
  .d-child:hover{border-color:var(--c);color:var(--text);}
  .d-child .cdot{width:6px;height:6px;border-radius:50%;background:var(--c);flex-shrink:0;}
  .viz-link{
    margin-top:4px;display:inline-flex;align-items:center;gap:7px;
    padding:9px 13px;border-radius:9px;font-size:13px;font-weight:500;
    background:var(--accent);color:#fff;transition:color .18s,background .18s,border-color .18s,opacity .18s,transform .18s;align-self:flex-start;
  }
  .viz-link:hover{background:#6a4cf2;transform:translateY(-1px);}
  .viz-link svg{width:14px;height:14px;}

  /* ---------- Footer ---------- */
  footer{
    max-width:1400px;margin:40px auto 0;padding:28px;
    border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    color:var(--text3);font-size:12.5px;
  }
  footer .fl{display:flex;align-items:center;gap:10px;}
  footer a:hover{color:var(--text2);}
  footer .fmono{font-family:var(--mono);}

  /* ---------- SVG node styles ---------- */
  #mindmap text{font-family:var(--sans);}
  .node{cursor:pointer;}
  .node rect{transition:fill .2s,stroke .2s,stroke-width .2s;}
  .node:hover rect{filter:brightness(1.22);}
  .node.appearing{animation:nodeIn .32s cubic-bezier(.22,.61,.36,1);transform-box:fill-box;}
  @keyframes nodeIn{from{opacity:0;transform-origin:center;}to{opacity:1;}}
  .node .label{font-size:12px;font-weight:500;}
  .node.is-center .label{font-size:14px;font-weight:600;}
  .node.is-theme .label{font-size:12.5px;font-weight:600;}
  .node .toggle{font-size:11px;font-weight:700;}
  .edge{fill:none;stroke-linecap:round;opacity:.32;transition:opacity .2s,stroke-width .2s;}
  .edge.edge-active{opacity:.85;stroke-width:2;}
  .edge.edge-match{opacity:1;stroke:#facc15;}

  @media (max-width:760px){
    header{padding:12px 16px;}
    .hero{padding:40px 16px 18px;}
    .toolbar{padding:0 12px;gap:10px;}
    .canvas-wrap{height:64vh;border-radius:12px;margin:12px;}
    .search-box{min-width:0;max-width:none;flex:1 1 100%;}
    .details{width:100%;}
    footer{padding:20px 16px;}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2.5"/><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="6" r="1.6"/><circle cx="20" cy="18" r="1.6"/>
        <path d="M6 6 L10 11 M6 18 L10 13 M18 6 L14 11 M18 18 L14 13"/>
      </svg>
    </span>
    <span><b>TW</b> <i>Mindmap</i></span>
  </a>
  <nav>
    <a href="index.html">Universe</a>
    <a href="index.html" class="nav-cta">viz-lab ↗</a>
  </nav>
</header>

<section class="hero">
  <span class="eyebrow"><span class="dot"></span> ZOOMABLE CONCEPT MAP</span>
  <h1>计算机科学的<br/>可缩放概念地图</h1>
  <p>把计算机科学的核心知识领域，组织成可折叠、可缩放的思维导图。展开节点探索分支，搜索定位知识点，点击叶子跳转到关联的可视化项目。</p>
  <div class="stats">
    <div class="stat"><b id="statThemes">8</b><span>根主题</span></div>
    <div class="stat"><b id="statNodes">—</b><span>知识节点</span></div>
    <div class="stat"><b>4</b><span>层级深度</span></div>
    <div class="stat"><b>SVG</b><span>零依赖渲染</span></div>
  </div>
</section>

<div class="toolbar">
  <div class="pill-group" id="themePills"></div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="search" type="text" placeholder="搜索知识点，如 Transformer / Raft / FFT…" />
  </div>
  <div class="btn-group">
    <button class="btn" id="btnExpand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9l4-4 4 4M4 15l4 4 4-4M14 5h6M14 12h6M14 19h6"/></svg>
      展开全部
    </button>
    <button class="btn" id="btnCollapse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16"/></svg>
      折叠全部
    </button>
  </div>
</div>

<div class="canvas-wrap">
  <div class="grid-bg"></div>
  <svg id="mindmap" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="viewport"></g>
  </svg>
  <div class="hint"><b>拖拽</b> 平移 · <b>滚轮</b> 缩放 · <b>点击</b> 展开节点</div>
  <div class="tooltip" id="tooltip"></div>
  <aside class="details" id="details"></aside>
  <div class="zoom-controls">
    <button class="zbtn" id="zIn" title="放大">+</button>
    <div class="zlabel" id="zLabel">100%</div>
    <button class="zbtn" id="zOut" title="缩小">−</button>
    <button class="zbtn small" id="zFit" title="适应">FIT</button>
    <button class="zbtn small" id="zReset" title="重置">1:1</button>
  </div>
</div>

<footer>
  <div class="fl">
    <span class="logo-mark" style="width:20px;height:20px;border-radius:5px;"></span>
    <span>TW Mindmap · 计算机科学概念地图</span>
  </div>
  <div class="fl fmono">
    <span>纯 HTML / CSS / JS + SVG</span>
    <span style="opacity:.5;">|</span>
    <a href="index.html">← 返回 TW Universe</a>
  </div>
</footer>

<script>window.addEventListener('error',function(e){if(e.error){console.warn('Caught:',e.message);e.preventDefault()}},true);
(function(){
'use strict';

/* ============================================================
   DATA — 8 root themes, 200+ nodes
   ============================================================ */
function C(id,name,desc,children){return {id,name,desc,children};}
function L(id,name,desc){return {id,name,desc};}

var ROOT = C('cs','计算机科学','计算机科学核心知识领域的可缩放概念地图，覆盖人工智能、系统、理论、数据科学等八大主题。',[
  C('ai','人工智能与机器学习','从经典机器学习到大语言模型，覆盖学习范式、模型架构与系统落地的完整图谱。',[
    C('ai-ml','机器学习基础','从数据中学习函数的基本范式。',[
      L('ai-ml-sup','监督学习','从标注样本学习输入到输出的映射。'),
      L('ai-ml-unsup','无监督学习','从无标签数据中发现结构与模式。'),
      L('ai-ml-semi','半监督学习','结合少量标注与大量无标签数据进行学习。'),
      L('ai-ml-rl','强化学习','通过环境反馈的奖励信号学习策略。'),
      L('ai-ml-tl','迁移学习','将源域学到的知识迁移到目标域。')
    ]),
    C('ai-dl','深度学习','基于深层神经网络的可微表示学习。',[
      L('ai-dl-cnn','CNN','卷积神经网络，擅长处理网格状数据如图像。'),
      L('ai-dl-rnn','RNN','循环神经网络，建模序列依赖关系。'),
      L('ai-dl-tf','Transformer','基于自注意力的序列模型架构。'),
      L('ai-dl-diff','扩散模型','通过逐步去噪过程生成数据的深度模型。')
    ]),
    C('ai-llm','大语言模型','大规模预训练语言模型的方法栈。',[
      L('ai-llm-tok','Tokenizer','将文本切分为模型可处理的 token。'),
      L('ai-llm-attn','Attention','自注意力机制，建模 token 间关系。'),
      L('ai-llm-pre','Pre-training','在大规模语料上的自监督预训练。'),
      L('ai-llm-ft','Fine-tuning','在下游任务上微调预训练模型。'),
      L('ai-llm-rlhf','RLHF','基于人类反馈的强化学习对齐方法。')
    ]),
    C('ai-gen','生成模型','学习数据分布并生成新样本。',[
      L('ai-gen-gan','GAN','生成对抗网络，对抗训练生成器与判别器。'),
      L('ai-gen-vae','VAE','变分自编码器，学习潜在分布。'),
      L('ai-gen-ar','自回归','逐 token 预测生成序列。'),
      L('ai-gen-flow','流模型','基于可逆变换的精确似然生成模型。')
    ]),
    C('ai-mm','多模态','融合多种模态信息进行学习与理解。',[
      L('ai-mm-clip','CLIP','对比学习对齐图像与文本表示。'),
      L('ai-mm-vit','ViT','Vision Transformer，将图像分块编码。'),
      L('ai-mm-vqa','VQA','视觉问答，给定图像与问题输出答案。'),
      L('ai-mm-fuse','图文融合','跨模态表示、检索与联合推理。')
    ]),
    C('ai-sys','AI 系统','大模型训练与推理的系统工程。',[
      L('ai-sys-parallel','训练并行','数据、张量、流水线并行策略。'),
      L('ai-sys-infer','推理优化','KV 缓存、连续批处理等加速技术。'),
      L('ai-sys-quant','量化','降低权重精度以加速推理。'),
      L('ai-sys-distill','蒸馏','用大模型监督训练小模型。')
    ]),
    C('ai-safe','AI 安全','确保 AI 系统可靠、可控与对齐。',[
      L('ai-safe-align','对齐','使模型行为符合人类意图。'),
      L('ai-safe-red','红队','主动发现模型漏洞与风险。'),
      L('ai-safe-adv','对抗防御','抵御对抗样本攻击。'),
      L('ai-safe-wm','水印','在生成内容中嵌入可检测标识。')
    ]),
    C('ai-app','应用','AI 的工程化落地场景。',[

  nodeMap[n.id]=n;

/* ============================================================
   LAYOUT
   ============================================================ */
var SPACING = [0, 330, 270, 240]; // distance by depth (1,2,3)
var ROW = 40;
var NODE_H = 30;

function textWidth(s){
  var w=0;
  for(var i=0;i<s.length;i++){
    var ch=s.charCodeAt(i);
    w += (ch>=0x3000 && ch<=0x9fff) || (ch>=0xff00 && ch<=0xffef) ? 13 : 7;
  }
  return w;
}
function nodeWidth(node){
  var depth = depthOf(node);
  var extra = depth===0 ? 24 : 0;
  return Math.max(74, textWidth(node.name) + 32 + extra);
}
function depthOf(node){
  var d=0, p=parentMap[node.id];
  while(p){d++;p=parentMap[p.id];}
  return d;
}

function visibleHeight(node){
  if(!node.children || !expanded.has(node.id)) return 1;
  var s=0;
  for(var i=0;i<node.children.length;i++) s+=visibleHeight(node.children[i]);
  return Math.max(s,1);
}

function layout(){
  var pos = {};
  function place(node, x, yStart, side, depth){
    var h = visibleHeight(node);
    var cy = yStart + (h*ROW)/2;
    pos[node.id] = {x:x, y:cy, depth:depth, side:side, node:node, w:nodeWidth(node)};
    if(node.children && expanded.has(node.id)){
      var cur = yStart;
      var sp = SPACING[depth+1] || 220;
      var childX = x + side*sp;
      for(var i=0;i<node.children.length;i++){
        var c = node.children[i];
        var ch = visibleHeight(c);
        place(c, childX, cur, side, depth+1);
        cur += ch*ROW;
      }
    }
  }
  pos[ROOT.id] = {x:0, y:0, depth:0, side:0, node:ROOT, w:nodeWidth(ROOT)};
  var left = ROOT.children.slice(0,4);
  var right = ROOT.children.slice(4);
  function placeSide(roots, side){
    var total=0;
    for(var i=0;i<roots.length;i++) total += visibleHeight(roots[i])*ROW;
    var cur = -total/2;
    for(var i=0;i<roots.length;i++){
      var h = visibleHeight(roots[i])*ROW;
      place(roots[i], side*SPACING[1], cur, side, 1);
      cur += h;
    }
  }
  placeSide(left,-1);
  placeSide(right,1);
  return pos;
}

function buildEdges(pos){
  var edges=[];
  for(var id in pos){
    if(id===ROOT.id) continue;
    var p = pos[id];
    var parent = parentMap[id];
    if(!parent || !pos[parent.id]) continue;
    var pp = pos[parent.id];
    var side = p.side;
    var sx = side>0 ? pp.x + pp.w/2 : pp.x - pp.w/2;
    var sy = pp.y;
    var ex = side>0 ? p.x - p.w/2 : p.x + p.w/2;
    var ey = p.y;
    var mx = (sx+ex)/2;
    edges.push({
      d:'M '+sx+' '+sy+' C '+mx+' '+sy+', '+mx+' '+ey+', '+ex+' '+ey,
      parent:parent.id, child:id, side:side, color:parent.color
    });
  }
  return edges;
}

/* ============================================================
   RENDER
   ============================================================ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hexToRgba(h,a){
  var n=parseInt(h.slice(1),16);
  var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function nodeStyle(node,depth){
  var c = node.color;
  if(depth===0) return {fill:c, stroke:c, text:'#ffffff', sw:0};
  if(depth===1) return {fill:hexToRgba(c,0.14), stroke:c, text:'#e4e4e7', sw:1.5};
  if(depth===2) return {fill:'#16181d', stroke:hexToRgba(c,0.55), text:'#e4e4e7', sw:1.2};
  return {fill:'#0f1115', stroke:'#2a2d35', text:'#a1a1aa', sw:1};
}

function render(){
  var pos = layout();
  lastPositions = pos;
  var edges = buildEdges(pos);

  var q = searchQuery.toLowerCase();
  var matchSet = {};
  if(searchQuery){
    for(var id in nodeMap){
      if(nodeMap[id].name.toLowerCase().indexOf(q)>=0) matchSet[id]=true;
    }
  }
  var matchAncestors = {};
  for(var mid in matchSet){
    var p = parentMap[mid];
    while(p){ matchAncestors[p.id]=true; p=parentMap[p.id]; }
  }

  var edgesHtml='';
  for(var i=0;i<edges.length;i++){
    var e = edges[i];
    var cls='edge';
    if(selectedId && (e.parent===selectedId || e.child===selectedId)) cls+=' edge-active';
    if(matchSet[e.child] || matchSet[e.parent]) cls+=' edge-match';
    edgesHtml += '<path class="'+cls+'" d="'+e.d+'" stroke="'+e.color+'" stroke-width="1.4"/>';
  }

  var nodesHtml='';
  for(var nid in pos){
    var p = pos[nid];
    var n = p.node;
    var depth = p.depth;
    var w = p.w;
    var isCenter = depth===0;
    var hasChildren = n.children && n.children.length;
    var st = nodeStyle(n,depth);
    var stroke=st.stroke, sw=st.sw, fill=st.fill, txt=st.text;
    var isMatch = !!matchSet[nid];
    if(isMatch){ stroke='#facc15'; sw=2; txt='#fffde7'; }
    var isSel = selectedId===nid;
    if(isSel){ sw = Math.max(sw,2.6); }
    var appearing = (prevVisibleIds && !prevVisibleIds.has(nid)) ? ' appearing' : '';
    var cls = 'node'+(isCenter?' is-center':'')+(depth===1?' is-theme':'')+(isSel?' selected':'')+(isMatch?' match':'')+appearing;
    var filter = isSel ? ' filter="url(#glow)"' : '';
    var badge='';
    if(hasChildren && !isCenter){
      var sign = expanded.has(nid) ? '−' : '+';
      badge = '<circle cx="'+(w/2+12)+'" cy="0" r="8.5" fill="#0f1115" stroke="'+stroke+'" stroke-width="1.2"/>'+
              '<text class="toggle" x="'+(w/2+12)+'" y="0.5" text-anchor="middle" dominant-baseline="middle" fill="'+txt+'">'+sign+'</text>';
    } else if(!hasChildren){
      badge = '<circle cx="'+(w/2+10)+'" cy="0" r="3" fill="'+n.color+'"/>';
    }
    nodesHtml += '<g class="'+cls+'" data-id="'+nid+'" transform="translate('+p.x+','+p.y+')">'+
      '<rect x="'+(-w/2)+'" y="-15" width="'+w+'" height="'+NODE_H+'" rx="8" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+filter+'/>'+
      '<text class="label" x="0" y="1" text-anchor="middle" dominant-baseline="middle" fill="'+txt+'">'+esc(n.name)+'</text>'+
      badge+
    '</g>';
  }

  viewport.innerHTML = '<g class="edges">'+edgesHtml+'</g><g class="nodes">'+nodesHtml+'</g>';
  applyTransform();
  bindNodeEvents();
  updatePills();
  prevVisibleIds = new Set(Object.keys(pos));
}

/* ============================================================
   INTERACTION
   ============================================================ */
function applyTransform(){
  viewport.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')');
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function updateZoomLabel(){ zLabel.textContent = Math.round(scale*100)+'%'; }

function zoomAt(clientX,clientY,factor){
  var rect = svg.getBoundingClientRect();
  var mx = clientX-rect.left, my = clientY-rect.top;
  var wx = (mx-tx)/scale, wy = (my-ty)/scale;
  var ns = clamp(scale*factor, 0.15, 3);
  tx = mx - wx*ns; ty = my - wy*ns; scale = ns;
  applyTransform(); updateZoomLabel();
}
function zoomCenter(factor){
  var rect = svg.getBoundingClientRect();
  zoomAt(rect.left+rect.width/2, rect.top+rect.height/2, factor);
}
function fit(){
  if(!lastPositions) return;
  var keys = Object.keys(lastPositions);
  if(!keys.length) return;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(var i=0;i<keys.length;i++){
    var p=lastPositions[keys[i]];
    minX=Math.min(minX,p.x-p.w/2);maxX=Math.max(maxX,p.x+p.w/2);
    minY=Math.min(minY,p.y-16);maxY=Math.max(maxY,p.y+16);
  }
  var bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
  var W=svg.clientWidth, H=svg.clientHeight;
  var pad=70;
  scale = clamp(Math.min((W-pad*2)/bw,(H-pad*2)/bh),0.15,3);
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  tx = W/2 - cx*scale; ty = H/2 - cy*scale;
  applyTransform(); updateZoomLabel();
}
function resetView(){
  scale=1; tx=svg.clientWidth/2; ty=svg.clientHeight/2;
  applyTransform(); updateZoomLabel();
}
function centerOn(id){
  var p = lastPositions[id];
  if(!p) return;
  var W=svg.clientWidth, H=svg.clientHeight;
  tx = W/2 - p.x*scale; ty = H/2 - p.y*scale;
  applyTransform();
}

/* pan + zoom */
var panning=false, dragged=false, lastX=0, lastY=0;
svg.addEventListener('pointerdown', function(e){
  if(e.button!==0 && e.pointerType==='mouse') return;
  panning=true; dragged=false; lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener('pointermove', function(e){
  if(!panning) return;
  var dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>4) dragged=true;
  tx+=dx; ty+=dy; lastX=e.clientX; lastY=e.clientY;
  applyTransform();
});
window.addEventListener('pointerup', function(){ panning=false; });
window.addEventListener('pointercancel', function(){ panning=false; });

svg.addEventListener('wheel', function(e){
  e.preventDefault();
  var factor = e.deltaY<0 ? 1.12 : 0.89;
  zoomAt(e.clientX, e.clientY, factor);
}, {passive:false});

/* node events */
function bindNodeEvents(){
  var groups = viewport.querySelectorAll('.node');
  for(var i=0;i<groups.length;i++){
    (function(g){
      var id = g.getAttribute('data-id');
      g.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragged) return;
        handleNodeClick(id);
      });
      g.addEventListener('pointerenter', function(e){
        showTooltip(id, e);
        g.classList.add('hovered');
      });
      g.addEventListener('pointermove', function(e){ moveTooltip(e); });
      g.addEventListener('pointerleave', function(){
        hideTooltip();
        g.classList.remove('hovered');
      });
    })(groups[i]);
  }
}

function handleNodeClick(id){
  var n = nodeMap[id];
  selectedId = id;
  if(n!==ROOT && n.children){
    if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
  }
  render();
  openDetails(id);
}

/* tooltip */
function showTooltip(id,e){
  var n = nodeMap[id];
  tooltip.innerHTML = '<div class="tt-name">'+esc(n.name)+'</div><div class="tt-desc">'+esc(n.desc||'')+'</div>';
  tooltip.style.display='block';
  moveTooltip(e);
}
function moveTooltip(e){
  var r = canvasWrap.getBoundingClientRect();
  var x = e.clientX - r.left + 14;
  var y = e.clientY - r.top + 14;
  var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  if(x+tw > r.width-8) x = e.clientX - r.left - tw - 14;
  if(y+th > r.height-8) y = e.clientY - r.top - th - 14;
  tooltip.style.left = Math.max(8,x)+'px';
  tooltip.style.top = Math.max(8,y)+'px';
}
function hideTooltip(){ tooltip.style.display='none'; }

/* details panel */
function pathOf(id){
  var arr=[]; var n=nodeMap[id];
  while(n){ arr.unshift(n); n=parentMap[n.id]; }
  return arr;
}
function rootThemeOf(id){
  var n=nodeMap[id];
  while(n && depthOf(n)>1) n=parentMap[n.id];
  return n?n.id:null;
}
function typeLabel(n){
  var d=depthOf(n);
  if(d===0) return '核心节点';
  if(d===1) return '根主题';
  if(d===2) return '分类';
  return '知识点';
}
function openDetails(id){
  var n = nodeMap[id];
  var path = pathOf(id);
  var crumbs = '';
  for(var i=0;i<path.length;i++){
    var p=path[i];
    if(i>0) crumbs += '<span class="crumb-sep">/</span>';
    crumbs += '<span class="crumb" style="--c:'+p.color+'">'+esc(p.name)+'</span>';
  }
  var isLeaf = !n.children;
  var childHtml='';
  if(n.children){
    childHtml='<div class="d-children"><div class="ch-label">子节点 ('+n.children.length+')</div>';
    for(var k=0;k<n.children.length;k++){
      var c=n.children[k];
      childHtml+='<div class="d-child" data-id="'+c.id+'" style="--c:'+c.color+'"><span class="cdot"></span>'+esc(c.name)+'</div>';
    }
    childHtml+='</div>';
  }
  var linkHtml='';
  if(isLeaf){
    linkHtml='<a class="viz-link" href="index.html#'+id+'">在 viz-lab 中查看 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>';
  }
  details.innerHTML =
    '<button class="close" id="closeDetails">✕</button>'+
    '<div class="d-crumbs">'+crumbs+'</div>'+
    '<div class="d-name" style="--c:'+n.color+'">'+esc(n.name)+'</div>'+
    '<div class="d-type">'+typeLabel(n)+'</div>'+
    '<div class="d-desc">'+esc(n.desc||'')+'</div>'+
    '<div class="d-meta">'+(isLeaf?'叶子节点 · 可关联 viz-lab 项目':'包含 '+n.children.length+' 个子节点')+'</div>'+
    childHtml+linkHtml;
  details.classList.add('open');
  document.getElementById('closeDetails').onclick = closeDetails;
  var ch = details.querySelectorAll('.d-child');
  for(var j=0;j<ch.length;j++){
    (function(el){
      el.onclick=function(){ handleNodeClick(el.getAttribute('data-id')); };
    })(ch[j]);
  }
}
function closeDetails(){ details.classList.remove('open'); }

/* search */
searchInput.addEventListener('input', function(e){
  searchQuery = e.target.value.trim();
  if(searchQuery){
    var q = searchQuery.toLowerCase();
    for(var id in nodeMap){
      if(nodeMap[id].name.toLowerCase().indexOf(q)>=0){
        var p=parentMap[id];
        while(p){ expanded.add(p.id); p=parentMap[p.id]; }
      }
    }
  }
  render();
  if(searchQuery){
    var q2 = searchQuery.toLowerCase();
    var first=null;
    for(var fid in nodeMap){
      if(nodeMap[fid].name.toLowerCase().indexOf(q2)>=0){ first=fid; break; }
    }
    if(first){
      selectedId = first;
      render();
      centerOn(first);
      openDetails(first);
    }
  }
});

/* theme pills */
function buildPills(){
  var wrap = document.getElementById('themePills');
  var html='';
  for(var i=0;i<ROOT.children.length;i++){
    var t=ROOT.children[i];
    html+='<div class="pill" data-theme="'+t.id+'" style="--c:'+t.color+'"><span class="pdot"></span>'+esc(t.name)+'</div>';
  }
  wrap.innerHTML=html;
  var pills = wrap.querySelectorAll('.pill');
  for(var k=0;k<pills.length;k++){
    (function(el){
      el.onclick=function(){ focusTheme(el.getAttribute('data-theme')); };
    })(pills[k]);
  }
}
function updatePills(){
  var activeRoot = selectedId ? rootThemeOf(selectedId) : null;
  var pills = document.querySelectorAll('.pill');
  for(var i=0;i<pills.length;i++){
    pills[i].classList.toggle('active', pills[i].getAttribute('data-theme')===activeRoot);
  }
}
function focusTheme(id){
  expanded = new Set(['cs', id]);
  selectedId = id;
  render();
  var p = lastPositions[id];
  if(p){
    scale = 1;
    centerOn(id);
    updateZoomLabel();
  }
  openDetails(id);
}

/* expand / collapse all */
function expandAll(){
  for(var id in nodeMap){ if(nodeMap[id].children) expanded.add(id); }
  render(); fit();
}
function collapseAll(){
  expanded = new Set(['cs']);
  selectedId = null;
  closeDetails();
  render(); fit();
}

/* zoom buttons */
document.getElementById('zIn').onclick = function(){ zoomCenter(1.2); };
document.getElementById('zOut').onclick = function(){ zoomCenter(0.83); };
document.getElementById('zFit').onclick = function(){ fit(); };
document.getElementById('zReset').onclick = function(){ resetView(); fit(); };
document.getElementById('btnExpand').onclick = expandAll;
document.getElementById('btnCollapse').onclick = collapseAll;

/* keyboard */
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeDetails(); }
});

/* resize */
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ applyTransform(); }, 100);
});

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('statNodes').textContent = (function(){
  var c=0; for(var k in nodeMap) c++; return c;
})();
buildPills();
resetView();
render();
fit();

})();
</script>
</body>
