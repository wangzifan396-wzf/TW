<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI编程IDE三国杀与四大工具 — 可视化实验室</title>
<style>
:root{
  --bg:#0a0b0f;--bg2:#0f1117;--bg3:#161922;--bg4:#1c2030;
  --border:#1e2433;--border2:#2a3144;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --teal:#00d4aa;--cyan:#22d3ee;--amber:#fbbf24;
  --red:#ef4444;--purple:#a78bfa;--blue:#3b82f6;
  --pink:#f472b6;--green:#34d399;
  --mono:"'SF Mono','JetBrains Mono',Consolas,monospace";
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;}
body{overflow-x:hidden;}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.apulse{animation:pulse 2s ease-in-out infinite}
.aglow{animation:glow 2.4s ease-in-out infinite}
.adash{stroke-dasharray:6 4;animation:dash 1s linear infinite}
.ablink{animation:blink 1.6s ease-in-out infinite}
.aspin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.afloat{animation:float 3s ease-in-out infinite}

.app-header{display:flex;align-items:center;justify-content:space-between;padding:13px 28px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:bold;font-size:15px;color:var(--bg)}
.logo-text{font-size:14px;font-weight:600;letter-spacing:.3px}
.logo-text small{display:block;font-size:10px;color:var(--text3);font-weight:400;letter-spacing:0;margin-top:1px}
.header-meta{display:flex;gap:16px;align-items:center}
.hm{font-family:var(--mono);font-size:11px;color:var(--text3)}
.hm b{color:var(--cyan)}

.module-nav{display:flex;gap:6px;padding:10px 28px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.module-nav::-webkit-scrollbar{height:0}
.mnav-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;text-align:left;min-width:128px;font-family:inherit}
.mnav-btn:hover{border-color:var(--cyan);background:var(--bg4)}
.mnav-btn.active{border-color:var(--cyan);background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(0,212,170,.08))}
.mnav-btn .mn{font-family:var(--mono);font-size:10px;color:var(--text3)}
.mnav-btn.active .mn{color:var(--cyan)}
.mnav-btn .mt{font-size:12px;color:var(--text2);font-weight:500;white-space:nowrap}
.mnav-btn.active .mt{color:var(--text)}

.lab-hero{padding:22px 28px 14px;background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--border)}
.hero-tag{display:inline-block;padding:3px 11px;border-radius:20px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:var(--cyan);font-family:var(--mono);font-size:11px;margin-bottom:10px}
.hero-title{font-size:23px;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,var(--text),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-desc{font-size:13px;color:var(--text2);max-width:800px;line-height:1.6}

.module-panel{padding:18px 28px 40px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.panel-title{display:flex;align-items:center;gap:10px}
.pt-num{font-family:var(--mono);font-size:13px;color:var(--cyan);background:var(--bg3);padding:3px 8px;border-radius:6px;border:1px solid var(--border2)}
.pt-text{font-size:16px;font-weight:600}
.panel-tabs{display:flex;gap:4px}
.tab-btn{padding:7px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s;font-family:inherit}
.tab-btn:hover{border-color:var(--border2);color:var(--text)}
.tab-btn.active{background:var(--bg4);border-color:var(--cyan);color:var(--cyan)}

.canvas-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:hidden}
#canvas{width:100%;height:auto;display:block;border-radius:8px}

.panel-footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.stat-pills{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.pill{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid;background:var(--bg3);white-space:nowrap}
.stat-legend{display:flex;flex-direction:column;gap:5px}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stat-info{display:flex;flex-direction:column;gap:3px}
.info-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)}
.info-k{color:var(--text3);font-family:var(--mono)}
.info-v{color:var(--text2);font-weight:500}

@media(max-width:820px){
  .panel-footer{grid-template-columns:1fr}
  .panel-header{flex-direction:column;align-items:flex-start}
  .app-header{padding:12px 16px}
  .module-nav{padding:10px 16px}
  .lab-hero{padding:18px 16px 12px}
  .module-panel{padding:14px 16px 32px}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">
    <div class="logo-mark">&lt;/&gt;</div>
    <div class="logo-text">AI编程IDE三国杀 · 四大工具<small>Four Kings of AI Coding IDE — July 2026</small></div>
  </div>
  <div class="header-meta">
    <span class="hm">MODULES <b>8</b></span>
    <span class="hm">VIEWS <b>24</b></span>
    <span class="hm">TOOLS <b>4</b></span>
  </div>
</div>

<nav class="module-nav" id="module-nav"></nav>

<section class="lab-hero">
  <span class="hero-tag" id="hero-tag">MODULE 01</span>
  <h1 class="hero-title" id="hero-title">AI编程三国杀与四大工具格局</h1>
  <p class="hero-desc" id="hero-desc">2026年7月AI编程格局:Cursor 90亿估值/Devin企业合同/Claude Code终端原生/Windsurf免费层,多步编码与云端异步执行重塑软件工程</p>
</section>

<section class="module-panel">
  <div class="panel-header">
    <div class="panel-title">
      <span class="pt-num" id="pt-num">01</span>
      <span class="pt-text" id="pt-text">AI编程三国杀与四大工具格局</span>
    </div>
    <div class="panel-tabs" id="panel-tabs"></div>
  </div>
  <div class="canvas-wrap">
    <svg id="canvas" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="panel-footer" id="panel-footer"></div>
</section>

<script>
var SVGNS='http://www.w3.org/2000/svg';
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',blue:'#3b82f6',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

function $(id){return document.getElementById(id);}
function E(parent,tag,attrs){
  var el=document.createElementNS(SVGNS,tag);
  if(attrs){for(var k in attrs){el.setAttribute(k,attrs[k]);}}
  if(parent){parent.appendChild(el);}
  return el;
}
function clearNode(n){while(n.firstChild){n.removeChild(n.firstChild);}}
function txt(g,x,y,s,opts){
  opts=opts||{};
  var t=E(g,'text',{x:x,y:y,fill:opts.fill||C.text,'font-size':opts.fs||12,'font-family':opts.mono?C.mono:'sans-serif','text-anchor':opts.ta||'start'});
  if(opts.bold){t.setAttribute('font-weight','bold');}
  if(opts.italic){t.setAttribute('font-style','italic');}
  t.textContent=s;
  return t;
}
function box(g,x,y,w,h,opts){
  opts=opts||{};
  return E(g,'rect',{x:x,y:y,width:w,height:h,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5,rx:opts.rx||6,'class':opts.cls||''});
}
function line(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5};
  if(opts.dash&&opts.dash!=='none'){a['stroke-dasharray']=opts.dash;}
  if(opts.cls){a['class']=opts.cls;}
  return E(g,'line',a);
}
function arrow(g,x1,y1,x2,y2,opts){
  opts=opts||{};
  var s=opts.stroke||C.text2,sw=opts.sw||1.5;
  line(g,x1,y1,x2,y2,{stroke:s,sw:sw,dash:opts.dash,cls:opts.cls});
  var ang=Math.atan2(y2-y1,x2-x1),ah=8;
  var ax=x2-Math.cos(ang)*ah,ay=y2-Math.sin(ang)*ah;
  var p1x=ax+Math.cos(ang+2.5)*5,p1y=ay+Math.sin(ang+2.5)*5;
  var p2x=ax+Math.cos(ang-2.5)*5,p2y=ay+Math.sin(ang-2.5)*5;
  poly(g,x2.toFixed(1)+','+y2.toFixed(1)+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1),{fill:s,stroke:'none'});
}
function circ(g,cx,cy,r,opts){
  opts=opts||{};
  var a={cx:cx,cy:cy,r:r,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5};
  if(opts.cls){a['class']=opts.cls;}
  return E(g,'circle',a);
}
function poly(g,pts,opts){
  opts=opts||{};
  var a={points:pts,fill:opts.fill||C.bg3,stroke:opts.stroke||C.border2,'stroke-width':opts.sw||1.5};
  if(opts.cls){a['class']=opts.cls;}
  if(opts.op){a['opacity']=opts.op;}
  return E(g,'polygon',a);
}
function radar(g,cx,cy,r,labels,values,color){
  var n=labels.length,i,a,rr;
  for(var ring=1;ring<=4;ring++){
    var pts=[];
    for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*ring/4;pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));}
    E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:C.border,'stroke-width':1});
  }
  for(i=0;i<n;i++){
    a=-Math.PI/2+i*2*Math.PI/n;
    line(g,cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,{stroke:C.border,sw:1});
    var lr=r+22;
    txt(g,cx+Math.cos(a)*lr,cy+Math.sin(a)*lr+4,labels[i],{fs:9,fill:C.text2,ta:'middle'});
  }
  var vpts=[];
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i]/100;vpts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));}
  E(g,'polygon',{points:vpts.join(' '),fill:color,opacity:0.18,stroke:color,'stroke-width':2});
  for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i]/100;circ(g,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,3.5,{fill:color,stroke:C.bg2,sw:1.5});}
}
function gridBg(g,w,h){
  for(var x=0;x<=w;x+=45){E(g,'line',{x1:x,y1:0,x2:x,y2:h,stroke:'#141926','stroke-width':1});}
  for(var y=0;y<=h;y+=45){E(g,'line',{x1:0,y1:y,x2:w,y2:y,stroke:'#141926','stroke-width':1});}
  E(g,'rect',{x:0,y:0,width:w,height:h,fill:'none',stroke:'#1e2433','stroke-width':1.5,rx:4});
}
function setPills(id,arr){
  var el=$(id);if(!el)return;el.innerHTML='';
  arr.forEach(function(a){
    var s=document.createElement('span');
    s.className='pill';s.style.borderColor=a[1];s.style.color=a[1];
    s.textContent=a[0];el.appendChild(s);
  });
}
function setLegend(id,arr){
  var el=$(id);if(!el)return;el.innerHTML='';
  arr.forEach(function(a){
    var d=document.createElement('div');d.className='leg-item';
    var dot=document.createElement('span');dot.className='leg-dot';dot.style.background=a[1];
    var t=document.createElement('span');t.textContent=a[0];
    d.appendChild(dot);d.appendChild(t);el.appendChild(d);
  });
}
function setInfo(id,arr){
  var el=$(id);if(!el)return;el.innerHTML='';
  arr.forEach(function(a){
    var d=document.createElement('div');d.className='info-row';
    var k=document.createElement('span');k.className='info-k';k.textContent=a[0];
    var v=document.createElement('span');v.className='info-v';v.textContent=a[1];
    d.appendChild(k);d.appendChild(v);el.appendChild(d);
  });
}

var MODULES=[
  {n:'01',t:'AI编程三国杀与四大工具格局',d:'Cursor 90亿估值/Devin企业合同/Claude Code终端原生/Windsurf免费层,市场整合加速',v:['四大工具定位象限','格局雷达对比','估值与影响力指数']},
  {n:'02',t:'Cursor与Background Agent',d:'云端异步多步编码,IDE集成,Tab补全,代码库理解,90亿估值',v:['Cursor IDE架构','Agent工作流','补全与代码库理解']},
  {n:'03',t:'Devin与全栈自主AI工程师',d:'企业年度合同,端到端项目交付,自主调试,部署能力',v:['端到端交付流程','调试与部署能力','企业合同模式']},
  {n:'04',t:'Claude Code与终端原生编码',d:'命令行Agent,异步编码任务,工具调用,MCP集成,本地优先',v:['终端Agent架构','异步任务流','MCP集成生态']},
  {n:'05',t:'Windsurf与AI原生IDE',d:'免费层策略,Cascade流程,深度理解,多模型支持',v:['Cascade流程图','免费层策略','多模型架构']},
  {n:'06',t:'多步编码与异步执行',d:'云端Background Agent,多文件联动,复杂重构,自动化调试',v:['云端Agent架构','多文件重构','调试管道']},
  {n:'07',t:'AI编程能力评测与基准',d:'SWE-bench,代码生成质量,调试能力,项目级理解,人机协作',v:['SWE-bench对比','能力雷达图','协作效率矩阵']},
  {n:'08',t:'软件工程范式重构与终局',d:'AI编码舰队,人机分工,开发者角色转型,软件工程2.0',v:['编码舰队架构','人机分工演进','工程2.0愿景']}
];

var mCur=0;
var mViews=[0,0,0,0,0,0,0,0];
var mLayers={};

function selectModule(mi){
  mCur=mi;
  var btns=document.querySelectorAll('.mnav-btn');
  btns.forEach(function(b,i){b.classList.toggle('active',i===mi);});
  var m=MODULES[mi];
  $('hero-tag').textContent='MODULE '+m.n;
  $('hero-title').textContent=m.t;
  $('hero-desc').textContent=m.d;
  $('pt-num').textContent=m.n;
  $('pt-text').textContent=m.t;
  var tabs=$('panel-tabs');tabs.innerHTML='';
  m.v.forEach(function(vn,i){
    var t=document.createElement('button');
    t.className='tab-btn'+(i===mViews[mi]?' active':'');
    t.textContent=vn;
    t.onclick=function(){setView(mi,i);};
    tabs.appendChild(t);
  });
  drawModule(mi);
}
function setView(mi,vi){
  mViews[mi]=vi;
  var tabs=document.querySelectorAll('.tab-btn');
  tabs.forEach(function(t,i){t.classList.toggle('active',i===vi);});
  drawModule(mi);
}
function drawModule(mi){
  var i;
  for(i=0;i<8;i++){
    if(mLayers['m'+(i+1)]){mLayers['m'+(i+1)].setAttribute('display',i===mi?'inline':'none');}
  }
  var foot=$('panel-footer');foot.innerHTML='';
  var sd=document.createElement('div');sd.className='stat-pills';sd.id='m'+(mi+1)+'-stat';foot.appendChild(sd);
  var ld=document.createElement('div');ld.className='stat-legend';ld.id='m'+(mi+1)+'-leg';foot.appendChild(ld);
  var idv=document.createElement('div');idv.className='stat-info';idv.id='m'+(mi+1)+'-info';foot.appendChild(idv);
  if(mi===0)m1Draw();else if(mi===1)m2Draw();else if(mi===2)m3Draw();else if(mi===3)m4Draw();
  else if(mi===4)m5Draw();else if(mi===5)m6Draw();else if(mi===6)m7Draw();else m8Draw();
}

/* ===== Module 1: AI编程三国杀与四大工具格局 ===== */
function m1Draw(){
  var g=mLayers.m1;clearNode(g);gridBg(g,900,480);
  var v=mViews[0];
  if(v===0){
    txt(g,30,34,'四大AI编程工具定位象限图',{fs:16,fill:C.text,bold:true});
    txt(g,30,52,'X轴:终端原生←→IDE集成 · Y轴:辅助协作←→全栈自主',{fs:10,fill:C.text3});
    var cx=450,cy=260;
    line(g,80,cy,820,cy,{stroke:C.border2,sw:1.5});
    line(g,cx,80,cx,440,{stroke:C.border2,sw:1.5});
    E(g,'line',{x1:80,y1:cy,x2:820,y2:cy,stroke:C.border,sw:1,'stroke-dasharray':'4 4'});
    E(g,'line',{x1:cx,y1:80,x2:cx,y2:440,stroke:C.border,sw:1,'stroke-dasharray':'4 4'});
    txt(g,820,cy+18,'IDE集成 →',{fs:11,fill:C.text2,ta:'end'});
    txt(g,80,cy+18,'← 终端原生',{fs:11,fill:C.text2});
    txt(g,cx+8,76,'全栈自主 ↑',{fs:11,fill:C.text2});
    txt(g,cx+8,436,'↓ 辅助协作',{fs:11,fill:C.text2});
    txt(g,220,110,'自主 · IDE集成',{fs:10,fill:C.text3});
    txt(g,680,110,'自主 · 终端原生',{fs:10,fill:C.text3});
    txt(g,220,410,'辅助 · IDE集成',{fs:10,fill:C.text3});
    txt(g,680,410,'辅助 · 终端原生',{fs:10,fill:C.text3});
    var tools=[
      {n:'Cursor',x:250,y:170,c:C.cyan,s:'$90亿 · Tab补全'},
      {n:'Devin',x:680,y:140,c:C.purple,s:'企业合同 · 自主交付'},
      {n:'Claude Code',x:700,y:300,c:C.amber,s:'终端原生 · 异步编码'},
      {n:'Windsurf',x:300,y:350,c:C.teal,s:'免费层 · AI原生IDE'}
    ];
    tools.forEach(function(t){
      E(g,'circle',{cx:t.x,cy:t.y,r:24,fill:t.c,opacity:0.1,stroke:t.c,'stroke-width':1.5});
      circ(g,t.x,t.y,16,{fill:C.bg3,stroke:t.c,sw:2,cls:'aglow'});
      circ(g,t.x,t.y,6,{fill:t.c,cls:'apulse'});
      txt(g,t.x,t.y-34,t.n,{fs:13,fill:t.c,bold:true,ta:'middle'});
      txt(g,t.x,t.y+38,t.s,{fs:9,fill:C.text3,ta:'middle'});
    });
  }else if(v===1){
    txt(g,30,34,'四大工具能力雷达对比',{fs:16,fill:C.text,bold:true});
    txt(g,30,52,'六维度评估:自主性/IDE集成/代码库理解/异步执行/企业就绪/价格优势',{fs:10,fill:C.text3});
    var labs=['自主性','IDE集成','代码库理解','异步执行','企业就绪','价格优势'];
    txt(g,240,86,'Cursor vs Devin',{fs:12,fill:C.cyan,bold:true,ta:'middle'});
    radar(g,240,270,95,labs,[72,95,88,82,68,60],C.cyan);
    radar(g,240,270,95,labs,[95,40,72,92,94,30],C.purple);
    txt(g,670,86,'Claude Code vs Windsurf',{fs:12,fill:C.amber,bold:true,ta:'middle'});

  });

}
