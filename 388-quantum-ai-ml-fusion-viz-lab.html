<style>

*{margin:0;padding:0;box-sizing:border-box}

.header-inner{max-width:1400px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:18px}
.hub-link{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s;white-space:nowrap}
.hub-link:hover{color:var(--purple)}
.header-title{font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.header-title .sep{color:var(--text3);margin:0 2px}
.header-title .ac{color:var(--purple);font-weight:500}
.header-badge{font-family:var(--mono);font-size:11px;color:var(--text3);padding:3px 10px;border:1px solid var(--border2);border-radius:4px;white-space:nowrap}
.lab-hero{max-width:1400px;margin:0 auto;padding:56px 28px 40px}
.lab-hero .tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--purple);background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);padding:5px 14px;border-radius:4px;margin-bottom:20px}

.view-tab:hover{color:var(--text2);border-color:var(--border2)}
.view-tab.active{background:var(--bg4);color:var(--cyan);border-color:var(--cyan)}
.viz-frame{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px}
.viz-svg{display:block;width:100%;height:auto}
.below{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.stat-row{display:flex;flex-wrap:wrap;gap:10px}
.stat-pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border2);padding:8px 14px;border-radius:6px;font-size:12.5px}
.stat-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-pill .label{color:var(--text3);font-size:11.5px}

.legend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.legend-row span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-row i{width:12px;height:12px;border-radius:3px;display:inline-block}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-card{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:16px}
.info-card .k{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono)}
.info-card .v{font-size:20px;font-weight:700;color:var(--purple);margin-bottom:6px}
.info-card .d{font-size:12px;color:var(--text2);line-height:1.5}
.panel-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-family:var(--mono)}
.apulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.aglow{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.adash{stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.ablink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.aspin{transform-origin:center;transform-box:fill-box;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.below{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.lab-hero h1{font-size:24px}}
</style>

<script>
var C={bg:'#0a0b0f',bg2:'#0f1117',bg3:'#161922',bg4:'#1c2030',border:'#1e2433',border2:'#2a3144',text:'#e2e8f0',text2:'#94a3b8',text3:'#64748b',teal:'#00d4aa',tealDim:'rgba(0,212,170,.16)',tealSoft:'rgba(0,212,170,.08)',cyan:'#22d3ee',amber:'#fbbf24',red:'#ef4444',purple:'#a78bfa',purpleDim:'rgba(167,139,250,.16)',purpleSoft:'rgba(167,139,250,.08)',blue:'#3b82f6',blueSoft:'rgba(59,130,246,.08)',pink:'#f472b6',green:'#34d399',mono:"'SF Mono','JetBrains Mono',Consolas,monospace"};

function circ(g,cx,cy,r,o){o=o||{};return E(g,'circle',{cx:cx,cy:cy,r:r,fill:o.fill||C.purpleSoft,stroke:o.stroke||C.purple,'stroke-width':o.sw||1.5,class:o.cls||''});}

function setPills(id,arr){var c=$(id);clearNode(c);arr.forEach(function(p){var s=document.createElement('span');s.className='stat-pill';var d=document.createElement('span');d.className='dot';d.style.background=p.c||C.purple;var l=document.createElement('span');l.className='label';l.textContent=p.k;var v=document.createElement('span');v.className='val';v.textContent=p.v;s.appendChild(d);s.appendChild(l);s.appendChild(v);c.appendChild(s);});}

function radar(g,cx,cy,r,labels,values,color){var n=labels.length,k,i,a,rr;for(k=1;k<=4;k++){var pts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*k/4;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}E(g,'polygon',{points:pts.join(' '),fill:'none',stroke:'#1e2433','stroke-width':1});}for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;line(g,cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),{stroke:'#1e2433',sw:1});}var dpts=[];for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];dpts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}E(g,'polygon',{points:dpts.join(' '),fill:color+'33',stroke:color,'stroke-width':2,cls:'aglow'});for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;rr=r*values[i];circ(g,cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,{fill:color,stroke:'none'});}for(i=0;i<n;i++){a=-Math.PI/2+i*2*Math.PI/n;var lr=r+20;txt(g,cx+lr*Math.cos(a),cy+lr*Math.sin(a)+4,labels[i],{s:10.5,f:C.text2});}}

var mCur=0,mViews=[0,0,0,0,0,0,0,0],mLayers={};

function buildNav(){
var nav=$('nav');clearNode(nav);
MODULES.forEach(function(m,i){

}

function buildStage(){
var stage=$('stage');clearNode(stage);
MODULES.forEach(function(m,i){
var sec=document.createElement('section');
sec.id='mod-'+i;
sec.style.display=i===mCur?'block':'none';

var tabs='<div class="view-tabs" id="tabs-'+i+'">';

function setView(mi,vi){
mViews[mi]=vi;
var tabs=$('tabs-'+mi);
Array.prototype.forEach.call(tabs.children,function(t,ti){
t.classList.toggle('active',ti===vi);

}

function drawModule(mi){
var fns=[m1Draw,m2Draw,m3Draw,m4Draw,m5Draw,m6Draw,m7Draw,m8Draw];

}

function showModule(i){

MODULES.forEach(function(m,mi){
